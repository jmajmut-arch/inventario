<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

  src="https://js.sentry-cdn.com/3a8602b248fccf0a627d6af0f6e5161d.min.js"
  crossorigin="anonymous"
></script>

<link rel="icon" href="../icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#161a20;
  --surface:#1e242c;
  --surface-2:#252c36;
  --line:#333c48;
  --amber:#f0a030;
  --amber-dim:#8a6224;
  --steel:#5b8fb0;
  --ok:#4caf6d;
  --warn:#e0b23c;
  --danger:#e0554a;
  --text:#eef1f4;
  --text-dim:#a3adb8;
  --text-faint:#6b7684;
  --radius:10px;
}

/* ---------- temas visuales (Configuraciones) ---------- */
:root[data-tema="acero"]{
  --bg:#10151c; --surface:#19212b; --surface-2:#212a37; --line:#2d394a;
  --amber:#4d9fe0; --amber-dim:#2a5578; --steel:#7fc4f0;
  --ok:#4caf6d; --warn:#e0b23c; --danger:#e0554a;
  --text:#edf1f5; --text-dim:#a1adba; --text-faint:#66727f; --radius:10px;
}
:root[data-tema="verde"]{
  --bg:#121a15; --surface:#19241c; --surface-2:#212f25; --line:#2d3f33;
  --amber:#43c07c; --amber-dim:#276b46; --steel:#5b8fb0;
  --ok:#5cb85c; --warn:#e0b23c; --danger:#e0554a;
  --text:#edf3ef; --text-dim:#a0b0a6; --text-faint:#647468; --radius:12px;
}
:root[data-tema="claro"]{
  --bg:#f4f5f3; --surface:#ffffff; --surface-2:#eef0ed; --line:#dde0db;
  --amber:#c9720f; --amber-dim:#f0d4ae; --steel:#3d6d8a;
  --ok:#2f8f52; --warn:#a8720a; --danger:#c23b2f;
  --text:#181b1a; --text-dim:#4c5450; --text-faint:#7c8480; --radius:14px;
}
:root[data-tema="alto_contraste"]{
  --bg:#000000; --surface:#0c0c0c; --surface-2:#181818; --line:#3a3a3a;
  --amber:#ffd400; --amber-dim:#8a7400; --steel:#29b6f6;
  --ok:#00e676; --warn:#ffd400; --danger:#ff5252;
  --text:#ffffff; --text-dim:#d4d4d4; --text-faint:#8f8f8f; --radius:4px;
}
/* el toast de error/ok/aviso usa colores pastel fijos pensados para fondo oscuro; en el tema claro necesitan su propio contraste */
:root[data-tema="claro"] .toast.err{border-color:#e3b3ae;color:#8a2b20;background:#fdf1f0;}
:root[data-tema="claro"] .toast.ok{border-color:#b7dcc3;color:#1f6b3d;background:#eef8f1;}
:root[data-tema="claro"] .toast.warn{border-color:#e8d9a8;color:#8a6d1f;background:#fdf8ec;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .2s ease,color .2s ease;}
body{min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3,.display{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- barcode tick divider (signature element) ---------- */
.ticks{height:14px;display:flex;align-items:flex-end;gap:2px;overflow:hidden;opacity:0.55;}
.ticks span{display:block;width:2px;background:var(--amber);}
.ticks span:nth-child(3n){height:14px;} .ticks span:nth-child(3n+1){height:8px;} .ticks span:nth-child(3n+2){height:11px;}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 0;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-badge{width:34px;height:34px;border-radius:8px;background:linear-gradient(155deg,var(--amber),#c97a1c);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:13px;letter-spacing:-0.03em;color:#1a1204;flex-shrink:0;}
.brand-text h1{font-size:18px;margin:0;line-height:1.1;}
.brand-text span{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em;}
.user-chip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);}
.user-chip button{background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:6px;padding:5px 9px;font-size:11px;}
.user-chip button:active{background:var(--surface-2);}

/* ---------- layout ---------- */
main{flex:1;max-width:720px;width:100%;margin:0 auto;padding:18px 16px 96px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px;}
.section-head:first-child{margin-top:0;}
.section-head h2{font-size:22px;margin:0;}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--amber);font-weight:600;margin-bottom:2px;display:block;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card + .card{margin-top:10px;}

/* bin-tag card: torn top edge motif for KPI cards */
.tag-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);padding:14px 14px 12px;overflow:hidden;}
.tag-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(-55deg,var(--amber) 0 6px,transparent 6px 12px);opacity:0.85;}
.tag-card .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-faint);margin-bottom:6px;}
.tag-card .kpi-value{font-family:'Barlow Condensed';font-weight:800;font-size:30px;line-height:1;}
.tag-card .kpi-sub{font-size:12px;color:var(--text-dim);margin-top:4px;}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.segmented{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;margin-bottom:16px;gap:2px;}
.segmented-btn{flex:1;border:none;background:none;padding:9px 4px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-dim);}
.segmented-btn.active{background:var(--amber);color:#1a1204;}

.progress-track{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--amber-dim),var(--amber));border-radius:5px;transition:width .4s ease;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--text-faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;padding:6px 8px;border-bottom:1px solid var(--line);}
td{padding:8px;border-bottom:1px solid var(--line);color:var(--text-dim);}
tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono';}
.table-wrap{overflow-x:auto;}

label{display:block;font-size:12px;color:var(--text-dim);margin:12px 0 5px;font-weight:500;}
label:first-child{margin-top:0;}
input[type=text],input[type=number],input[type=password],input[type=email],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  padding:11px 12px;border-radius:8px;font-size:15px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--amber);}
textarea{resize:vertical;min-height:60px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;padding:12px 16px;font-size:14px;font-weight:600;width:100%;}
.btn-primary{background:var(--amber);color:#1a1204;}
.btn-primary:active{background:#d68e26;}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
.btn-secondary:active{background:#2c3441;}
.btn-danger{background:transparent;color:var(--danger);border:1px solid #5a2f2c;}
.btn:disabled{opacity:0.45;pointer-events:none;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{width:auto;flex:1;}

.file-input{border:1.5px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--text-dim);font-size:13px;position:relative;}
.file-input input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.file-preview{margin-top:10px;border-radius:8px;overflow:hidden;border:1px solid var(--line);max-height:220px;}
.file-preview img{width:100%;display:block;object-fit:cover;max-height:220px;}

.badge{display:inline-block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;padding:3px 8px;border-radius:5px;}
.badge-ok{background:rgba(76,175,109,.15);color:var(--ok);}
.badge-warn{background:rgba(224,178,60,.15);color:var(--warn);}
.badge-danger{background:rgba(224,85,74,.15);color:var(--danger);}
.badge-neutral{background:var(--surface-2);color:var(--text-dim);}

.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:8px;font-size:13.5px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:88%;text-align:center;}
.toast.err{border-color:#5a2f2c;color:#f3a6a0;}
.toast.ok{border-color:#2c5a3d;color:#a3e0b8;}
.toast.warn{border-color:#5a4a1f;color:#e8c25f;}

.empty{text-align:center;padding:30px 10px;color:var(--text-faint);}
.empty .glyph{font-size:28px;margin-bottom:8px;opacity:0.6;}

#marca-agua{position:fixed;right:10px;bottom:62px;z-index:15;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.04em;color:var(--text-faint);opacity:0.6;pointer-events:none;user-select:none;}

/* ---------- bottom nav ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px 8px;background:none;border:none;color:var(--text-faint);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.02em;}
.tab.active{color:var(--amber);}
.tab-icon-wrap{position:relative;display:flex;}
.tab-icon-wrap>svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}
.tab-bloqueada{opacity:0.55;}
.tab-candado{position:absolute;top:-4px;right:-6px;display:flex;align-items:center;justify-content:center;width:13px;height:13px;background:var(--surface);border-radius:50%;}
.tab-candado svg{width:11px;height:11px;stroke:var(--text-faint);fill:none;stroke-width:2.2;}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px 26px;position:relative;overflow:hidden;}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(-55deg,var(--amber) 0 6px,transparent 6px 12px);}
.login-logo{width:52px;height:52px;border-radius:12px;background:linear-gradient(155deg,var(--amber),#c97a1c);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:19px;letter-spacing:-0.03em;color:#1a1204;margin:6px auto 14px;}
.login-title{text-align:center;font-size:22px;margin:0 0 4px;}
.login-sub{text-align:center;font-size:12.5px;color:var(--text-faint);margin-bottom:22px;}
.login-toggle{display:flex;font-size:12.5px;color:var(--text-dim);justify-content:center;margin-top:16px;gap:5px;}
.login-toggle button{background:none;border:none;color:var(--amber);font-weight:600;padding:0;}
.login-toggle a{color:var(--amber);font-weight:600;text-decoration:none;}

.spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,.25);border-top-color:#1a1204;border-radius:50%;animation:spin .7s linear infinite;}
.spinner.light{border:2px solid var(--line);border-top-color:var(--amber);}
@keyframes spin{to{transform:rotate(360deg);}}

.hint{font-size:11.5px;color:var(--text-faint);margin-top:6px;line-height:1.5;}
.sku-pick{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--surface-2);}
.sku-pick div span{display:block;}
.sku-pick .code{font-family:'IBM Plex Mono';font-weight:600;font-size:13.5px;}
.sku-pick .desc{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.sku-pick button{background:var(--amber);color:#1a1204;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;}
.selected-sku{background:var(--surface-2);border:1px solid var(--amber-dim);border-radius:8px;padding:12px;margin-bottom:6px;}
.selected-sku .code{font-family:'IBM Plex Mono';font-weight:700;font-size:15px;color:var(--amber);}

.icon-btn{background:none;border:none;padding:4px;color:var(--amber);display:inline-flex;align-items:center;justify-content:center;line-height:0;}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.icon-btn.disabled{color:var(--text-faint);opacity:.35;}
.foto-modal-backdrop{position:fixed;inset:0;background:rgba(10,12,15,.86);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;}
.foto-modal-card{position:relative;max-width:92vw;max-height:86vh;}
.foto-modal-card img{max-width:92vw;max-height:86vh;display:block;border-radius:10px;border:1px solid var(--line);}
.foto-modal-close{position:absolute;top:-14px;right:-14px;width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;}
.foto-modal-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
.foto-modal-nav-prev{left:6px;}
.foto-modal-nav-next{right:6px;}
.foto-modal-contador{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--text-dim);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 10px;white-space:nowrap;}

.foto-preview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.foto-preview-item{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:var(--surface-2);}
.foto-preview-item img{width:100%;height:100%;object-fit:cover;display:block;}
.foto-preview-remove{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);border:none;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;}
.foto-preview-remove svg{width:11px;height:11px;}

.tema-opcion{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:10px;cursor:pointer;}
.tema-opcion.activo{border-color:var(--amber);}
.tema-swatches{display:flex;gap:3px;flex-shrink:0;}
.tema-swatches span{width:16px;height:16px;border-radius:4px;display:block;border:1px solid rgba(128,128,128,.35);}
.tema-info{flex:1;min-width:0;}
.tema-nombre{font-size:14px;font-weight:600;color:var(--text);}
.tema-desc{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.btn-icon-header{padding:6px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--text-dim);display:inline-flex;align-items:center;justify-content:center;}

.opcion-carga{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface-2);margin-bottom:8px;cursor:pointer;}
.opcion-carga.activo{border-color:var(--amber);background:var(--surface);}
.opcion-carga input[type=radio]{margin-top:2px;flex-shrink:0;}
.opcion-carga .nombre{font-size:13.5px;font-weight:600;color:var(--text);}
.opcion-carga .desc{font-size:11.5px;color:var(--text-faint);margin-top:2px;line-height:1.4;}

.plan-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.plan-item:last-child{border-bottom:none;}
.plan-item-ubic{font-size:13.5px;font-weight:600;color:var(--text);}
.plan-item-responsable{font-size:12px;color:var(--text-dim);margin-top:2px;}
.plan-item-nota{font-size:12px;color:var(--text-dim);margin-top:2px;}
.plan-item-universo{font-size:11px;color:var(--text-faint);margin-top:3px;}
.plan-item-detalle{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
.plan-sku-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
.plan-sku-lista li{font-size:12px;color:var(--text-dim);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.plan-sku-lista .icon-btn{padding:2px;flex:none;}

#print-plan{display:none;}
@media print{
  html,body{background:#fff;}
  #app,#toast-root{display:none;}
  #print-plan{display:block;padding:0;color:#000;background:#fff;}
  #print-plan h1{font-size:17px;margin:0 0 2px;}
  #print-plan .print-meta{font-size:11px;color:#333;margin-bottom:14px;}
  #print-plan h2{font-size:13px;text-transform:capitalize;margin:16px 0 6px;border-bottom:1px solid #000;padding-bottom:2px;page-break-after:avoid;}
  #print-plan h3{font-size:11.5px;margin:10px 0 1px;page-break-after:avoid;}
  #print-plan .print-entrada-meta{font-size:10px;color:#333;margin-bottom:4px;}
  #print-plan table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:6px;}
  #print-plan th,#print-plan td{border:1px solid #999;padding:3px 6px;text-align:left;}
  #print-plan th{background:#eee;}
  #print-plan td.print-blank{min-width:60px;}
  #print-plan .print-vacio{font-size:11px;color:#555;}

  /* Informe de ciclo: reusa los mismos componentes del dashboard (.card, .kpi-grid, etc.),
     así que solo hace falta reescalar las variables de color al esquema del tema "claro" —
     ya pensado para fondo blanco — en vez de duplicar cada regla de componente. */
  #print-informe{
    display:block; padding:0; background:#fff; color:#181b1a;
    --bg:#f4f5f3; --surface:#ffffff; --surface-2:#eef0ed; --line:#dde0db;
    --amber:#c9720f; --amber-dim:#f0d4ae; --steel:#3d6d8a;
    --ok:#2f8f52; --warn:#a8720a; --danger:#c23b2f;
    --text:#181b1a; --text-dim:#4c5450; --text-faint:#7c8480;
  }
  #print-informe h1{font-size:19px;margin:0 0 2px;}
  #print-informe .print-meta{font-size:11px;color:var(--text-dim);margin-bottom:16px;}
  #print-informe .segmented{display:none;}
  #print-informe .section-head,#print-informe .card,#print-informe .tag-card{page-break-inside:avoid;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>
<div id="print-plan"></div>
<div id="print-informe"></div>
<div id="marca-agua" aria-hidden="true">Joel Majmut</div>

<script>
/* =======================================================================
   CONFIG — proyecto Supabase "inventario-toma-fisica"
   ======================================================================= */
const SUPABASE_URL = 'https://ncvwgsbcvklhbyvurxzz.supabase.co';

/* =======================================================================
   MONITOREO DE ERRORES — Sentry captura solo (errores JS + promesas
   rechazadas) vía el Loader Script cargado en <head>; acá solo le pasamos
   contexto de quién está mirando, para que cada error diga de qué empresa
   vino. Sentry.onLoad encola el callback hasta que el SDK real esté listo
   (el Loader Script parte como un stub liviano), así que es seguro llamar
   a esto apenas cambia el perfil, sin esperar a que Sentry haya cargado.
   ======================================================================= */
function configurarContextoSentry(){
  if(typeof Sentry === 'undefined' || !Sentry.onLoad) return;
  Sentry.onLoad(function(){
    if(state.perfil){
      Sentry.setUser({ id: state.perfil.id });
      Sentry.setTag('empresa_id', state.perfil.empresa_id);
      Sentry.setTag('empresa_nombre', state.perfil.empresas ? state.perfil.empresas.nombre : null);
    }else{
      Sentry.setUser(null);
    }
  });
}

function formatearValorAuditoria(v){
  if(v===null || v===undefined || v==='') return '—';
  if(v===true) return 'sí';
  if(v===false) return 'no';
  return String(v);
}

// El trigger de auditoría guarda la fila completa (to_jsonb) en datos_antes/datos_despues, así
// que además de "qué cambió" en un UPDATE, también podemos mostrar el detalle de una creación
// o eliminación en vez de un genérico "se creó/eliminó el registro" que no dice nada útil.
function resumenCambioAuditoria(fila){
  const campos = CAMPOS_AUDITADOS[fila.tabla] || [];
  if(fila.accion==='INSERT'){
    const despues = fila.datos_despues || {};
    const detalle = campos.map(([campo,label]) => `${label}: ${formatearValorAuditoria(despues[campo])}`);
    return detalle.length ? detalle.join(' · ') : 'Se creó el registro';
  }
  if(fila.accion==='DELETE'){
    const antes = fila.datos_antes || {};
    const detalle = campos.map(([campo,label]) => `${label}: ${formatearValorAuditoria(antes[campo])}`);
    return detalle.length ? detalle.join(' · ') : 'Se eliminó el registro';
  }
  const antes = fila.datos_antes || {};
  const despues = fila.datos_despues || {};
  const cambios = campos
    .filter(([campo]) => JSON.stringify(antes[campo]) !== JSON.stringify(despues[campo]))
    .map(([campo,label]) => `${label}: ${formatearValorAuditoria(antes[campo])} → ${formatearValorAuditoria(despues[campo])}`);
  return cambios.length ? cambios.join(' · ') : 'Sin cambios visibles';
}

// Identifica de qué registro se trata además de tabla+acción: sin esto, "Persona · Modificado"
// o "Empresa · Eliminado" no dicen a quién le pasó — hay que saber el nombre para que la fila
// sirva de algo al revisar la trazabilidad (ej. quién quedó con rol admin, qué empresa se borró).
function identificadorAuditoria(fila){
  const antes = fila.datos_antes || {};
  const despues = fila.datos_despues || {};
  if(fila.tabla==='skus'){
    const codigo = despues.sku_code || antes.sku_code;
    return codigo? ` · ${codigo}` : '';
  }
  if(fila.tabla==='usuarios' || fila.tabla==='empresas'){
    const nombre = despues.nombre || antes.nombre;
    return nombre? ` · ${nombre}` : '';
  }
  if(fila.tabla==='conteos'){
    const partes = [despues.bodega || antes.bodega, despues.ubicacion_contada || antes.ubicacion_contada].filter(Boolean);
    return partes.length? ` · ${partes.join(' / ')}` : '';
  }
  return '';
}

/* =======================================================================
   HELPERS DE RED — REST / AUTH / STORAGE de Supabase (sin SDK externo)
   ======================================================================= */
// fetch() rechaza con un TypeError crudo en inglés ("Failed to fetch", "NetworkError...",
// "Load failed" en Safari) cuando no hay conexión — antes de siquiera llegar a una respuesta
// HTTP. Es justo el escenario más común en una bodega o mina con señal mala, así que es el
// caso que más vale traducir: se atrapa acá, en la capa de red, para que cualquier catch(e)
// más arriba en la app (hay decenas) le muestre a la persona algo entendible en vez del
// error crudo del navegador. Sigue siendo un TypeError (no un Error genérico) a propósito:
// pareceFalloDeRed(), más abajo, detecta "sin conexión de verdad" con instanceof TypeError
// para encolar conteos/fotos/SKU offline en vez de mostrarlos como error — si esto lanzara
// un Error normal, esa detección dejaría de funcionar en todos esos flujos.
const MENSAJE_SIN_CONEXION = 'No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.';

async function authRequest(path, body){
  let res;
  try{
    res = await fetch(`${SUPABASE_URL}/auth/v1${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify(body)
    });
  }catch(e){
    if(pareceFalloDeRed(e)) throw new TypeError(MENSAJE_SIN_CONEXION);
    throw e;
  }
  const data = await res.json().catch(()=> ({}));
  if(!res.ok){ throw new Error(data.error_description || data.msg || data.error || 'Error de autenticación'); }
  return data;
}

async function rest(path, { method='GET', body=null, prefer=null, extraHeaders={} } = {}){
  const hacerLlamada = () => {
    const headers = {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      ...extraHeaders
    };
    if(prefer) headers['Prefer'] = prefer;
    return fetch(`${SUPABASE_URL}/rest/v1${path}`, { method, headers, body: body?JSON.stringify(body):null });
  };
  let res;
  try{
    res = await hacerLlamada();
  }catch(e){
    if(pareceFalloDeRed(e)) throw new TypeError(MENSAJE_SIN_CONEXION);
    throw e;
  }
  // El access_token dura poco (~1h); si ya venció, refrescamos con el refresh_token
  // guardado y reintentamos una sola vez antes de mostrar el error.
  if(res.status===401 && state.session && state.session.refresh_token){
    const refrescada = await refrescarSesion();
    if(refrescada){
      try{
        res = await hacerLlamada();
      }catch(e){
        if(pareceFalloDeRed(e)) throw new TypeError(MENSAJE_SIN_CONEXION);
        throw e;
      }
    }
    else{
      manejarSesionInvalida();
      throw new Error(MENSAJE_SESION_TERMINADA);
    }
  }
  const text = await res.text(); // POST/PATCH con Prefer: return=minimal responden 200/201 con cuerpo vacío, no 204 — no asumir JSON siempre presente
  let data = null;
  if(text){ try{ data = JSON.parse(text); }catch(e){ /* respuesta no-JSON */ } }
  if(!res.ok){
    throw new Error((data && data.message) || 'No se pudo completar la operación. Inténtalo de nuevo.');
  }
  return data;
}

async function storageUpload(path, file){
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
    method:'POST',
    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session.access_token}`,
      'Content-Type': file.type || 'application/octet-stream',
      'x-upsert':'true'
    },
    body:file
  });
  if(!res.ok){ const err=await res.json().catch(()=>({})); throw new Error(err.message||'No se pudo subir la foto'); }
  return path; // el bucket es privado: se guarda la ruta, la URL para verla se firma al momento de mostrarla
}

// Genera una URL temporal para ver una foto del bucket privado. Acepta tanto
// una ruta nueva (empresa_id/sku/archivo) como una URL pública completa de
// fotos subidas antes de que el bucket pasara a privado.
async function crearUrlFirmada(fotoUrlORuta){
  const marcador = `/object/public/${BUCKET}/`;
  const idx = fotoUrlORuta.indexOf(marcador);
  const ruta = idx>=0 ? fotoUrlORuta.slice(idx+marcador.length) : fotoUrlORuta;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/sign/${BUCKET}/${ruta}`, {
    method:'POST',
    headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${state.session.access_token}`, 'Content-Type':'application/json' },
    body: JSON.stringify({expiresIn:3600})
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok || !data.signedURL) throw new Error(data.message || 'No se pudo abrir la foto');
  return `${SUPABASE_URL}/storage/v1${data.signedURL}`;
}

const SESION_KEY = 'sesion_inventario';

function guardarSesion(data){
  try{ localStorage.setItem(SESION_KEY, JSON.stringify({access_token:data.access_token, refresh_token:data.refresh_token, user:data.user})); }catch(e){ /* localStorage no disponible (modo privado, etc.) */ }
}

function borrarSesionGuardada(){
  try{ localStorage.removeItem(SESION_KEY); }catch(e){ /* nada que borrar */ }
}

// El access_token dura ~1h; con el refresh_token pedimos uno nuevo sin que
// la persona tenga que volver a loguearse (ni al recargar la página, ni
// a mitad de un turno largo de conteo).
async function refrescarSesion(){
  if(!state.session || !state.session.refresh_token) return false;
  try{
    const data = await authRequest('/token?grant_type=refresh_token', {refresh_token: state.session.refresh_token});
    if(!data.access_token) return false;
    state.session = data;
    guardarSesion(data);
    return true;
  }catch(e){ return false; }
}

// Al abrir la app, si hay una sesión guardada la restauramos (con refresh)
// en vez de mostrar el login. Si el refresh_token ya no sirve o la cuenta
// fue desactivada, la limpiamos y seguimos al login normal.
async function restaurarSesionGuardada(){
  let guardada;
  try{ guardada = JSON.parse(localStorage.getItem(SESION_KEY)); }catch(e){ guardada = null; }
  if(!guardada || !guardada.refresh_token) return;
  state.session = guardada;
  const ok = await refrescarSesion();
  if(!ok){ state.session = null; borrarSesionGuardada(); return; }
  await cargarPerfil();
  if(state.empresaBloqueada) return; // sesión sigue viva: se muestra la pantalla de cuenta bloqueada
  if(!state.perfil){ state.session = null; borrarSesionGuardada(); return; }
  state.view = vistaInicialParaPerfil();
  cargarTodo();
}

async function cargarPerfil(){
  const uid = state.session.user.id;
  // Antes de pedir el perfil normal, revisamos si la empresa está bloqueada (inactiva o
  // con la suscripción morosa). empresa_actual() ya no deja leer nada en ese caso, así que
  // sin este chequeo aparte el usuario vería un login roto en vez de saber por qué.
  try{
    const estado = await rest('/rpc/mi_estado_bloqueo', {method:'POST'});
    const info = estado && estado[0];
    if(info && info.bloqueada){
      state.perfil = null;
      state.empresaBloqueada = {motivo: info.motivo, nombre: info.empresa_nombre, planNombre: info.plan_nombre};
      configurarContextoSentry();
      return;
    }
  }catch(e){ /* si falla la consulta de estado, seguimos con el flujo normal */ }
  state.empresaBloqueada = null;
  const rows = await rest(`/usuarios?auth_user_id=eq.${uid}&select=id,nombre,rol,es_super_admin,empresa_id,empresas(nombre,codigo_invitacion,flow_subscription_status,planes(nombre,etiqueta,max_bodegas,max_usuarios,offline_habilitado,dashboard_ejecutivo_habilitado,auditoria_habilitada))`);
  if(rows && rows[0]) state.perfil = rows[0];
  else state.perfil = null;
  configurarContextoSentry();
}

// Si no hay plan cargado (aún no llegó del backend, o el embed falló) se asume acceso
// completo: es una restricción de UX, no de seguridad — el límite real lo aplican los
// triggers en la base de datos, así que fallar "abierto" acá no compromete nada.
function planIncluye(campo){
  const plan = state.perfil && state.perfil.empresas && state.perfil.empresas.planes;
  if(!plan) return true;

// Con "Single session per user" activado, este login deja invalidada (en su próximo
// refresh) cualquier otra sesión activa de la cuenta. Se lo decimos a quien recién
// entró para que no se sorprenda si el otro dispositivo se desconecta solo más tarde.
async function hayOtraSesionActiva(){
  try{ return await rest('/rpc/tengo_otra_sesion_activa', {method:'POST'}); }
  catch(e){ return false; }
}

// Al llegar desde el link del correo de invitación o de recuperar contraseña, Supabase
// redirige con el token de sesión en el fragmento de la URL
// (#access_token=...&type=invite o type=recovery). Lo detectamos antes del primer render
// para mostrar "crea tu contraseña" en vez del login normal.
async function procesarLlegadaPorInvitacion(){
  const hash = location.hash.startsWith('#') ? location.hash.slice(1) : '';
  const params = new URLSearchParams(hash);
  const accessToken = params.get('access_token');
  const tipo = params.get('type');
  if(!accessToken || (tipo!=='recovery' && tipo!=='invite')) return;
  history.replaceState(null, '', location.pathname + location.search);
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${accessToken}` }
    });
    const user = await res.json();
    if(!res.ok || !user.id) throw new Error('El link de invitación ya no es válido');
    state.session = { access_token: accessToken, refresh_token: params.get('refresh_token'), user };
    state.debeCrearPassword = true;
  }catch(e){
    toast(e.message,'err');
  }
}

// Al volver de registrar la tarjeta en Flow, la Edge Function flow-registro-callback nos
// redirige acá con ?flow=ok o ?flow=error. Solo mostramos el aviso; el estado real
// (flow_subscription_status, plan_id) ya lo dejó puesto esa función en el backend.
function procesarRetornoFlow(){
  const params = new URLSearchParams(location.search);
  const resultado = params.get('flow');
  if(!resultado) return;
  history.replaceState(null, '', location.pathname + location.hash);
  state.avisoFlow = resultado;
}

const PLANES_AUTOSERVICIO = ['basico', 'profesional'];

// Al llegar desde el botón "Suscribirme" del landing (?plan=basico o ?plan=profesional),
// mostramos la pantalla de alta autoservicio en vez del login normal.
function procesarRegistroPlanDesdeUrl(){
  const params = new URLSearchParams(location.search);

  history.replaceState(null, '', location.pathname + location.hash);

}

// Página del listado de SKUs (tabla "SKU activos"), con conteo exacto vía Prefer: count=exact
// para poder mostrar Anterior/Siguiente y ver el 100% de los materiales, no solo los primeros 500.
async function fetchSkusPagina(page){
  const from = page*SKUS_POR_PAGINA;
  const to = from + SKUS_POR_PAGINA - 1;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/skus?activo=eq.true&order=sku_code.asc`, {
    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
      'Range-Unit': 'items',
      'Range': `${from}-${to}`,
      'Prefer': 'count=exact',
    }
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : [];
  if(!res.ok){ throw new Error((data && data.message) || res.statusText || 'Error de base de datos'); }
  const range = res.headers.get('content-range'); // ej. "0-49/1410"
  const total = range && range.includes('/') ? Number(range.split('/')[1]) : data.length;
  return { data, total };
}

async function cargarSkusPagina(page=0){
  try{
    const { data, total } = await fetchSkusPagina(page);
    const rows = data||[];
    // Estado del último conteo de cada SKU de esta página (para el ícono verde/amarillo/rojo
    // según si cuadró, quedó con sobrante o con faltante) — consulta aparte porque
    // ultimo_conteo_por_sku es una vista sin FK declarada hacia skus, así que PostgREST no la
    // puede traer embebida automáticamente.
    if(rows.length){
      try{
        const ids = rows.map(r=>r.id).join(',');
        const estados = await rest(`/ultimo_conteo_por_sku?sku_id=in.(${ids})&select=sku_id,estado,diferencia`);
        const porSku = new Map((estados||[]).map(e=>[e.sku_id, e]));
        rows.forEach(r=>{
          const e = porSku.get(r.id);
          r.ultimoEstado = e ? e.estado : null;
          r.ultimaDiferencia = e ? e.diferencia : null;
        });
      }catch(e){ /* si falla, la tabla igual se ve, solo sin el ícono */ }
    }
    setState({skusPagina: { rows, page, total: total||0 }, skusSeleccionados: []});
  }catch(e){ toast(e.message,'err'); }
}

async function eliminarSkusSeleccionados(){
  const ids = state.skusSeleccionados;
  if(!ids.length) return;
  if(!confirm(`¿Eliminar ${ids.length} SKU? Esta acción no se puede deshacer.`)) return;
  setState({loading:true});
  try{
    // Un SKU con conteos ya registrados no se puede borrar (protegido por la base de datos):
    // los separamos primero para avisar cuáles se saltaron, en vez de que falle todo el lote.
    const conteosExistentes = await rest(`/conteos?select=sku_id&sku_id=in.(${ids.join(',')})`);
    const idsConConteos = new Set((conteosExistentes||[]).map(c=>c.sku_id));
    const idsABorrar = ids.filter(id=>!idsConConteos.has(id));
    if(idsABorrar.length) await rest(`/skus?id=in.(${idsABorrar.join(',')})`, {method:'DELETE'});
    const omitidos = ids.length - idsABorrar.length;
    if(!omitidos){
      toast(`${idsABorrar.length} SKU eliminados`);
    }else if(idsABorrar.length){
      toast(`${idsABorrar.length} SKU eliminados. ${omitidos} no se eliminaron: ya tienen conteos registrados (desactívalos en vez de eliminarlos).`, 'err');
    }else{
      toast('No se eliminó ningún SKU: todos ya tienen conteos registrados. Desactívalos en vez de eliminarlos.', 'err');
    }
    setState({loading:false});
    refrescarListaSkus();
  }catch(e){
    setState({loading:false});
    toast(e.message,'err');
  }
}

/* =======================================================================
   PLANIFICACIÓN SEMANAL — por ubicación (bodega), ubicación específica y storage bin
   ======================================================================= */
function fechaISO(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function sumarDias(d, n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function inicioSemana(d){
  const date = new Date(d);
  const dia = date.getDay(); // 0=domingo .. 6=sabado
  const diff = dia===0 ? -6 : 1-dia; // retrocede hasta el lunes
  date.setDate(date.getDate()+diff);
  date.setHours(0,0,0,0);
  return date;
}

// Arma el filtro PostgREST que excluye del cálculo los SKU quitados a mano de una entrada del plan.
function filtroExclusion(excluidos){
  if(!excluidos || !excluidos.length) return '';
  return `&sku_code=not.in.(${excluidos.map(s=>encodeURIComponent(s)).join(',')})`;
}

// SKU "sueltos": sin ubicación general ni específica (ver renderPlanificacion / crearPlanEntrada).
// Las vistas ubicaciones_generales/especificas/bins los excluyen a propósito (agrupan solo lo que
// tiene bodega/ubicacion), así que para plani­ficarlos hay que filtrar explícitamente is.null.
function filtroSoloSinUbicacion(soloSinUbicacion){
  return soloSinUbicacion ? '&bodega=is.null&ubicacion=is.null' : '';
}

// bodega==='' es el caso "Sin bodega asignada" (BODEGA_VACIA ya resuelto a '' antes de
// llegar acá): filtra bodega IS NULL en la base. Distinto de bodega==null/undefined, que
// significa "sin filtro, cualquier bodega" — el campo se dejó opcionalmente en blanco al
// planificar (comodín ya existente, no confundir con el caso anterior).
function filtroBodega(bodega){
  if(bodega==='') return '&bodega=is.null';
  if(bodega) return `&bodega=eq.${encodeURIComponent(bodega)}`;
  return '';
}

// Usa skus_planificables (no skus): un SKU ya contado en el ciclo actual (con diferencia o
// sin ella) no debe seguir ofreciéndose para planificar — planificarlo de nuevo solo confunde.
// excluirYaPlanificados además saca los que ya están cubiertos por OTRA entrada de plan_semanal
// vigente (skus_disponibles_planificar) — solo para armar una entrada NUEVA. No usar esto para
// calcular el universo/detalle de una entrada YA CREADA: se anularía a sí misma (todo lo que
// cubre "ya está planificado" por ella).
async function contarUniversoUbicacion({bodega, ubicacion, storage_bin, excluidos, soloSinUbicacion, excluirYaPlanificados}){
  let filtro = `/${excluirYaPlanificados ? 'skus_disponibles_planificar' : 'skus_planificables'}?activo=eq.true`;
  if(soloSinUbicacion){
    filtro += filtroSoloSinUbicacion(true);
  }else{
    filtro += filtroBodega(bodega);
    if(ubicacion) filtro += `&ubicacion=eq.${encodeURIComponent(ubicacion)}`;
    if(storage_bin) filtro += `&storage_bin=eq.${encodeURIComponent(storage_bin)}`;
  }
  filtro += filtroExclusion(excluidos);
  const res = await fetch(`${SUPABASE_URL}/rest/v1${filtro}`, {
    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
      'Range-Unit': 'items',
      'Range': '0-0',
      'Prefer': 'count=exact',
    }
  });
  const range = res.headers.get('content-range');
  return range && range.includes('/') ? Number(range.split('/')[1]) : 0;
}

// Trae el detalle completo (no solo el conteo) de los SKU de una ubicación planificada,
// paginando de a 1000 filas vía Range para no chocar con el límite de fila de PostgREST.
async function skusDeUbicacion({bodega, ubicacion, storage_bin, excluidos, soloSinUbicacion, excluirYaPlanificados}){
  let filtro = `/${excluirYaPlanificados ? 'skus_disponibles_planificar' : 'skus_planificables'}?activo=eq.true&select=sku_code,descripcion,bodega,ubicacion,storage_bin,unidad_medida&order=storage_bin.asc,sku_code.asc`;
  if(soloSinUbicacion){
    filtro += filtroSoloSinUbicacion(true);
  }else{
    filtro += filtroBodega(bodega);
    if(ubicacion) filtro += `&ubicacion=eq.${encodeURIComponent(ubicacion)}`;
    if(storage_bin) filtro += `&storage_bin=eq.${encodeURIComponent(storage_bin)}`;
  }
  filtro += filtroExclusion(excluidos);
  const TAM_PAGINA = 1000;
  let desde = 0, total = Infinity, filas = [];
  while(desde < total){
    const res = await fetch(`${SUPABASE_URL}/rest/v1${filtro}`, {
      headers:{
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
        'Range-Unit': 'items',
        'Range': `${desde}-${desde+TAM_PAGINA-1}`,
        'Prefer': 'count=exact',
      }
    });
    const text = await res.text();
    const data = text ? JSON.parse(text) : [];
    if(!res.ok){ throw new Error((data && data.message) || res.statusText || 'Error de base de datos'); }
    filas = filas.concat(data);
    const range = res.headers.get('content-range');
    total = range && range.includes('/') ? Number(range.split('/')[1]) : filas.length;
    desde += TAM_PAGINA;
    if(!data.length) break;
  }
  return filas;
}

async function cargarPlanSemanal(){
  const inicio = state.plan.semanaInicio || fechaISO(inicioSemana(new Date()));
  // La "semana" mostrada va de lunes al lunes siguiente inclusive (8 días, no 7): a pedido, para
  // no cortar la vista justo el domingo y poder ver de una el arranque de la semana próxima.
  const fin = fechaISO(sumarDias(new Date(inicio+'T00:00:00'), 7));
  // Con un período (ciclo) elegido en el filtro, se muestra toda su planificación sin
  // importar la semana; sin período elegido, se sigue mostrando semana por semana como antes.
  const cicloFiltro = state.plan.cicloFiltro;
  try{
    const rows = await rest(cicloFiltro
      ? `/plan_semanal_detalle?ciclo_id=eq.${cicloFiltro}&order=fecha.asc`
      : `/plan_semanal_detalle?fecha=gte.${inicio}&fecha=lte.${fin}&order=fecha.asc`);
    setState({plan: {...state.plan, semanaInicio: inicio, entradas: rows||[], seleccionados:[]}});
    // Estos dos recálculos de fondo (universo y detalle por CADA entrada ya planificada) disparan
    // un render() completo cada uno, sin relación con el formulario "Agregar a la planificación"
    // que la persona puede estar llenando en ese momento. No hace falta protegerlos acá: render()
    // ya captura y restaura ese formulario alrededor de cualquier render (ver capturarFormularioPlan).
    // Cada callback tiene su propio try/catch: son recálculos de fondo por entrada, en paralelo
    // vía forEach (que no espera ni encadena las promesas que dispara) — sin este try/catch, un
    // fetch que falla (red caída, pestaña en background) queda como una promesa rechazada sin
    // manejar, la captura Sentry como error no capturado y el try/catch de cargarPlanSemanal ya
    // no lo alcanza porque el forEach que lo disparó ya terminó. Silencioso a propósito: no es
    // una acción que la persona haya iniciado, y esa entrada simplemente no actualiza su conteo
    // esta vez (se reintenta solo al volver a cargar la pestaña).
    (rows||[]).forEach(async r=>{
      try{
        const total = await contarUniversoUbicacion({bodega:r.bodega, ubicacion:r.ubicacion, storage_bin:r.storage_bin, excluidos:r.skus_excluidos, soloSinUbicacion:r.solo_sin_ubicacion});
        setState({plan: {...state.plan, universos: {...state.plan.universos, [r.id]: total}}});
      }catch(e){ /* recálculo de fondo no crítico, ver comentario arriba */ }
    });
    (rows||[]).forEach(async r=>{
      try{
        const skus = await skusDeUbicacion({bodega:r.bodega, ubicacion:r.ubicacion, storage_bin:r.storage_bin, excluidos:r.skus_excluidos, soloSinUbicacion:r.solo_sin_ubicacion});
        setState({plan: {...state.plan, detalle: {...state.plan.detalle, [r.id]: skus}}});
      }catch(e){ /* recálculo de fondo no crítico, ver comentario arriba */ }
    });
  }catch(e){ toast(e.message,'err'); }
}

// De las entradas de hoy, cuáles corresponden a la bodega/ubicación elegidas en los <select> en
// cascada (o la entrada "SKU sin ubicación", un caso aparte que no cascadea). Sin filtro de
// storage bin: puede haber más de una entrada para la misma bodega+ubicación (una por bin) — se
// devuelven todas para juntar sus SKU pendientes, en vez de obligar a elegir el bin exacto.
function entradasActivasContar(cp){
  if(cp.bodega === BODEGA_SIN_UBICACION) return cp.entradas.filter(e=>e.solo_sin_ubicacion);
  if(!cp.bodega) return [];
  // BODEGA_VACIA (grupo "Sin bodega asignada" del <select>) representa las entradas con
  // bodega==='' (bodega IS NULL, pero con ubicación específica) — hay que traducir el sentinel
  // de vuelta antes de comparar contra el valor real guardado en la entrada.
  const bodegaCoincide = e => cp.bodega===BODEGA_VACIA ? e.bodega==='' : e.bodega===cp.bodega;
  return cp.entradas.filter(e=> !e.solo_sin_ubicacion && bodegaCoincide(e) && (e.ubicacion||'')===cp.ubicacion);
}

// SKU que se planificaron para una bodega/ubicación/bin determinados, pero que una carga masiva
// posterior les cambió alguno de esos datos: si ya no coinciden con ninguna entrada activa de
// este bodega+ubicación, desaparecerían silenciosamente del plan del día. Se resuelven acá
// cruzando la foto guardada al planificar (plan_semanal_skus) contra los datos actuales de cada
// SKU, y se devuelven marcados con qué cambió para poder avisar en vez de perderlos. `entradas`
// debe venir ya acotado a las que tienen bin específico (ver elegirCascadaContar y
// crearPlanEntrada): solo esas guardan la foto, porque el universo de SKU de una entrada sin bin
// (bodega+ubicación completa) puede ser demasiado grande para snapshotearlo.
async function skusMovidosDeEntradas(entradas, binesActivos){
  if(!entradas.length) return [];
  const snapshots = await Promise.all(entradas.map(e=>
    rest(`/plan_semanal_skus?plan_id=eq.${e.id}&select=sku_code,storage_bin_original,bodega_original,ubicacion_original`)
  ));
  const original = new Map();
  snapshots.flat().forEach(s=>{ if(!original.has(s.sku_code)) original.set(s.sku_code, s); });
  if(!original.size) return [];
  const codigos = [...original.keys()];
  const actuales = await rest(`/skus_planificables?activo=eq.true&select=sku_code,descripcion,bodega,ubicacion,storage_bin,unidad_medida&sku_code=in.(${codigos.map(c=>encodeURIComponent(c)).join(',')})`) || [];
  return actuales.map(s=>{
    const o = original.get(s.sku_code);
    // Fotos guardadas antes de que existieran estas dos columnas (plan planificado antes de este
    // aviso) quedan con ambas en null — ahí no hay con qué comparar bodega/ubicación, así que no
    // se puede saber si "cambiaron": tratarlo como si sí hubiera cambiado (null → cualquier dato)
    // mostraría el aviso en TODOS los SKU de ese plan viejo aunque nada se haya movido.
    const tieneOriginalBodegaUbicacion = !!(o.bodega_original || o.ubicacion_original);
    const cambioBodega = tieneOriginalBodegaUbicacion && (s.bodega||null) !== (o.bodega_original||null);
    const cambioUbicacion = tieneOriginalBodegaUbicacion && (s.ubicacion||null) !== (o.ubicacion_original||null);
    const cambioBin = s.storage_bin !== o.storage_bin_original;
    // Un cambio de solo bin, dentro de la misma bodega+ubicación, ya aparece solo si el bin
    // nuevo es otro de los activos para esta entrada — no hace falta "recuperarlo" acá.
    if(!cambioBodega && !cambioUbicacion && (!cambioBin || binesActivos.has(s.storage_bin))) return null;
    return {...s, bodegaOriginal:o.bodega_original, ubicacionOriginal:o.ubicacion_original, binOriginal:o.storage_bin_original, cambioBodega, cambioUbicacion, cambioBin};
  }).filter(Boolean);
}

// Texto de la advertencia para un SKU recuperado por skusMovidosDeEntradas: si cambió de bodega
// o ubicación, eso es lo relevante para el conteo (importa más que el bin); si solo cambió de
// bin dentro de la misma bodega+ubicación, se avisa puntualmente de eso.
function describirCambioPlan(s){
  if(s.cambioBodega || s.cambioUbicacion){
    const antes = [s.bodegaOriginal, s.ubicacionOriginal].filter(Boolean).join(' · ') || 'sin ubicación asignada';
    const ahora = [s.bodega, s.ubicacion].filter(Boolean).join(' · ') || 'sin ubicación asignada';
    return `Cambió de ubicación: se planificó en ${esc(antes)}, ahora está en ${esc(ahora)}`;
  }
  return `Cambió de bin: se planificó en ${esc(s.binOriginal)}, ahora está en ${esc(s.storage_bin||'sin bin')}`;
}

async function elegirCascadaContar(cambios){
  const cp = {...state.contarPlan, ...cambios, skusPendientes:null};
  setState({contarPlan: cp});
  const activas = entradasActivasContar(cp);
  if(!activas.length) return;
  try{
    // Cada entrada puede tener su propio storage_bin y su propia lista de exclusiones (una fila
    // por bin) — se piden por separado, respetando cada una, y se juntan sin duplicar SKU (puede
    // repetirse si dos entradas de distinto bin comparten alguno).
    const listas = await Promise.all(activas.map(e=>
      skusDeUbicacion({bodega:e.bodega, ubicacion:e.ubicacion, storage_bin:e.storage_bin, excluidos:e.skus_excluidos, soloSinUbicacion:e.solo_sin_ubicacion})
    ));
    const vistos = new Set();
    const skus = [];
    listas.flat().forEach(s=>{ if(!vistos.has(s.sku_code)){ vistos.add(s.sku_code); skus.push(s); } });

    // Solo entradas CON bin específico: el universo de SKU a snapshotear queda acotado a lo que
    // hay en ese bin (chico), a diferencia de una entrada sin bin (bodega+ubicación completa),
    // que puede cubrir miles de SKU y volvería impracticable guardar la foto de todos.
    const entradasConBin = activas.filter(e=>!e.solo_sin_ubicacion && e.storage_bin);
    if(entradasConBin.length){
      const binesActivos = new Set(activas.map(e=>e.storage_bin).filter(Boolean));
      const excluidos = new Set(activas.flatMap(e=>e.skus_excluidos||[]));
      const movidos = await skusMovidosDeEntradas(entradasConBin, binesActivos);
      movidos.forEach(s=>{ if(!vistos.has(s.sku_code) && !excluidos.has(s.sku_code)){ vistos.add(s.sku_code); skus.push(s); } });
    }

    skus.sort((a,b)=> (a.storage_bin||'').localeCompare(b.storage_bin||'') || a.sku_code.localeCompare(b.sku_code));
    setState({contarPlan:{...state.contarPlan, skusPendientes: skus}});
  }catch(e){ toast(e.message,'err'); }
}

async function crearPlanEntrada({fecha, bodega, ubicacion, storageBins, skusExcluidos, responsableId, nota, soloSinUbicacion, cicloId}){
  if(!fecha){ toast('Elige una fecha','err'); return; }
  if(!perfilCargado()) return;
  // "SKU sin ubicación" es una sola entrada (no tiene bodega/ubicación/bin que cascadear).
  const bins = soloSinUbicacion ? [null] : ((storageBins && storageBins.length) ? storageBins : [null]);
  try{
    const filas = await rest('/plan_semanal', {method:'POST', body: bins.map(bin=>({
      fecha,
      // bodega puede llegar en '' a propósito (grupo "Sin bodega asignada": bodega IS NULL,
      // pero con ubicación específica) — no colapsarlo a null con `||`, eso lo confundiría
      // con el comodín "sin restricción de bodega" (bodega==null/undefined desde el llamador).
      bodega: soloSinUbicacion ? null : (bodega==null ? null : bodega),
      ubicacion: soloSinUbicacion ? null : (ubicacion||null),
      storage_bin: soloSinUbicacion ? null : (bin||null),
      solo_sin_ubicacion: !!soloSinUbicacion,
      // Sin período elegido, el trigger asignar_ciclo_plan_semanal la deja en el ciclo
      // marcado como actual (igual que ya pasa con los conteos).
      ciclo_id: cicloId||null,
      responsable_id: responsableId||null, nota: nota||null, usuario_id: state.perfil ? state.perfil.id : null,
      empresa_id: state.perfil.empresa_id,
    })), prefer:'return=representation'});
    // Sin storage bin cargado, Storage bin ofrece elegir SKU puntuales en vez de bins (ver
    // cargarBinsPara) — elegir algunos ahí significa "solo estos", así que el resto se manda
    // como exclusión de la única entrada creada (misma tabla que usa excluirSkuDePlan).
    if(skusExcluidos && skusExcluidos.length && filas && filas.length){
      await rest('/plan_semanal_exclusiones', {method:'POST', body: filas.flatMap(f=>skusExcluidos.map(sku_code=>({plan_id:f.id, sku_code}))), prefer:'return=minimal'});
    }
    // Foto del universo de SKU capturado al planificar, por entrada CON bin específico (el
    // universo queda acotado a lo que hay en ese bin): permite detectar más adelante (ver
    // skusMovidosDeEntradas) si una carga masiva posterior movió alguno a otro bin, bodega o
    // ubicación, para no perderlo silenciosamente del plan del día. Una entrada sin bin (toda
    // una bodega+ubicación) puede cubrir miles de SKU, así que no se le guarda esta foto — el
    // costo de escribirla no compensa frente a lo poco frecuente del caso que resuelve.
    if(!soloSinUbicacion && filas && filas.length){
      const conBin = filas.filter(f=>f.storage_bin);
      if(conBin.length){
        const snapshots = await Promise.all(conBin.map(f=>
          skusDeUbicacion({bodega:f.bodega, ubicacion:f.ubicacion, storage_bin:f.storage_bin, excluidos:[], soloSinUbicacion:false})
        ));
        const filasSnapshot = conBin.flatMap((f,i)=>snapshots[i].map(s=>({plan_id:f.id, sku_code:s.sku_code, storage_bin_original:f.storage_bin, bodega_original:f.bodega, ubicacion_original:f.ubicacion})));
        if(filasSnapshot.length){
          await rest('/plan_semanal_skus', {method:'POST', body:filasSnapshot, prefer:'return=minimal'});
        }
      }
    }
    toast(bins.length>1 ? `Agregado a la planificación (${bins.length} storage bin)` : 'Agregado a la planificación');
    cargarPlanSemanal();
    refrescarOpcionesUbicacion();
  }catch(e){ toast(e.message,'err'); }
}

function filtroBodegaOpciones(bodega){

}

async function opcionesBins(bodega, ubicacion){
  if(!bodega) return [];
  try{
    if(ubicacion){
      return await rest(`/ubicaciones_bins?${filtroBodegaOpciones(bodega)}&ubicacion=eq.${encodeURIComponent(ubicacion)}&order=storage_bin.asc`) || [];
    }
    // "Todas" las ubicaciones específicas: el mismo storage_bin puede repetirse en más de
    // una (la vista viene agrupada por bodega+ubicacion+storage_bin), así que se suman antes
    // de listarlo — si no, un mismo bin aparecería duplicado varias veces en el <select>.
    const filas = await rest(`/ubicaciones_bins?${filtroBodegaOpciones(bodega)}&order=storage_bin.asc`) || [];
    const porBin = new Map();
    for(const f of filas){
      const acc = porBin.get(f.storage_bin) || {storage_bin:f.storage_bin, cantidad_skus:0};
      acc.cantidad_skus += Number(f.cantidad_skus)||0;
      porBin.set(f.storage_bin, acc);
    }
    return Array.from(porBin.values()).sort((a,b)=> a.storage_bin.localeCompare(b.storage_bin));
  }catch(e){ return []; }
}

// Quita caracteres que puedan romper la sintaxis de filtros de PostgREST (,()."*)
function sanearTextoFiltro(s){
  return String(s||'').replace(/[,()."*]/g, ' ').trim();
}

// Busca en el maestro completo de SKU (skus_busqueda: un renglón por SKU con su último conteo
// embebido, si existe) — antes buscaba solo en /conteos, así que un SKU nunca contado era
// invisible acá. "Contado"/"no contado" son valores especiales de Estado que no son columnas
// reales: se traducen a filtrar por si hay o no conteo_id.
function construirPathBusqueda(offset){
  let path = `/skus_busqueda?select=*&order=fecha_conteo.desc.nullslast,sku_code.asc&limit=${TAM_PAGINA_LISTA}&offset=${offset}`;
  const texto = sanearTextoFiltro(state.busqueda.texto);
  if(texto) path += `&or=(sku_code.ilike.*${encodeURIComponent(texto)}*,descripcion.ilike.*${encodeURIComponent(texto)}*)`;
  const bodega = sanearTextoFiltro(state.busqueda.bodega);
  if(bodega) path += `&bodega=ilike.*${encodeURIComponent(bodega)}*`;
  if(state.busqueda.estado === 'no_contado') path += `&conteo_id=is.null`;
  else if(state.busqueda.estado) path += `&estado=eq.${encodeURIComponent(state.busqueda.estado)}`;
  if(state.busqueda.ciclo === '__sin_ciclo__') path += `&ciclo_id=is.null&conteo_id=not.is.null`;
  else if(state.busqueda.ciclo) path += `&ciclo_id=eq.${encodeURIComponent(state.busqueda.ciclo)}`;
  if(state.busqueda.soloFueraDePlan) path += `&fuera_de_plan=eq.true`;
  if(state.busqueda.soloContadoHoy){
    // Mismo patrón que exportarConteosExcel: se arma el instante real a partir de la medianoche
    // LOCAL de hoy (no un string con "Z" a la fuerza), para que "hoy" coincida con el día
    // calendario que la persona ve en su pantalla, sin importar el huso horario.
    const hoy = fechaISO(new Date());
    const desdeInstante = new Date(hoy+'T00:00:00').toISOString();
    const mañana = fechaISO(sumarDias(new Date(hoy+'T00:00:00'), 1));
    const hastaInstante = new Date(mañana+'T00:00:00').toISOString();
    path += `&fecha_conteo=gte.${desdeInstante}&fecha_conteo=lt.${hastaInstante}`;
  }
  return path;
}

// "Solo con fotografías" no es una columna propia (foto_urls es un array agregado), así que
// se filtra en el cliente después de traer cada página.
function filtrarResultadosBusqueda(rows){
  if(!state.busqueda.soloConFotos) return rows;
  return rows.filter(r=> (r.foto_urls||[]).length>0);
}

async function buscarConteos(){

// Exporta a Excel los conteos de una fecha o rango de fechas (vista conteos_exportables: un
// renglón por conteo, no deduplicado por SKU, con el detalle del maestro y el resultado) — para
// poder cargarlos a un ERP. Pagina de a 1000 filas vía Range (mismo patrón que skusDeUbicacion)
// para no chocar con el límite de fila de PostgREST si el rango trae muchos conteos.
async function exportarConteosExcel(){
  const {desde, hasta} = state.exportConteos;
  if(!desde){ toast('Elige al menos la fecha "Desde"','err'); return; }
  const hastaReal = hasta || desde;
  if(hastaReal < desde){ toast('"Hasta" no puede ser anterior a "Desde"','err'); return; }
  setState({exportConteos: {...state.exportConteos, exportando:true}});
  try{
    // Se construye el instante real (no un string con "Z" a la fuerza) a partir de la
    // medianoche LOCAL de cada fecha elegida, para que el rango coincida con el día calendario
    // que la persona ve en su pantalla, sin importar en qué huso horario esté.
    const desdeInstante = new Date(desde+'T00:00:00').toISOString();
    const siguienteDia = fechaISO(sumarDias(new Date(hastaReal+'T00:00:00'), 1));
    const hastaInstante = new Date(siguienteDia+'T00:00:00').toISOString();
    const filtro = `/conteos_exportables?select=*&fecha_conteo=gte.${desdeInstante}&fecha_conteo=lt.${hastaInstante}&order=fecha_conteo.asc`;
    const TAM_PAGINA = 1000;
    let inicio = 0, total = Infinity, filas = [];
    while(inicio < total){
      const res = await fetch(`${SUPABASE_URL}/rest/v1${filtro}`, {
        headers:{
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
          'Range-Unit': 'items',
          'Range': `${inicio}-${inicio+TAM_PAGINA-1}`,
          'Prefer': 'count=exact',
        }
      });
      const texto = await res.text();
      const data = texto ? JSON.parse(texto) : [];
      if(!res.ok){ throw new Error((data && data.message) || res.statusText || 'Error de base de datos'); }
      filas = filas.concat(data);
      const range = res.headers.get('content-range');
      total = range && range.includes('/') ? Number(range.split('/')[1]) : filas.length;
      inicio += TAM_PAGINA;
    }
    if(!filas.length){
      toast('No hay conteos en ese rango de fechas','err');
      setState({exportConteos: {...state.exportConteos, exportando:false}});
      return;
    }
    const filasExcel = filas.map(f=>({
      'SKU': f.sku_code,
      'Descripción': f.descripcion,
      'Categoría': f.categoria,
      'Unidad de medida': f.unidad_medida,
      'Código de barras': f.codigo_barras,
      'Bodega (maestro)': f.bodega_maestro,
      'Ubicación (maestro)': f.ubicacion_maestro,
      'Storage bin': f.storage_bin,
      'Bodega contada': f.bodega_contada,
      'Ubicación contada': f.ubicacion_contada,
      'Ubicación distinta': f.ubicacion_distinta ? 'Sí' : 'No',
      'Stock sistema': f.stock_sistema,
      'Cantidad contada': f.cantidad_contada,
      'Diferencia': f.diferencia,
      'Costo unitario': f.costo_unitario,
      'Valor diferencia': f.valor_diferencia,
      'Estado': f.estado,
      'Fuera de plan': f.fuera_de_plan ? 'Sí' : 'No',
      'Observación': f.observacion,
      'Responsable': f.responsable,
      'Ciclo': f.ciclo_nombre,
      'Fecha de conteo': fmtFechaHora(f.fecha_conteo),
      'Capturado sin conexión': fueCapturadoOffline(f.capturado_en, f.fecha_conteo) ? fmtFechaHora(f.capturado_en) : '',
    }));
    const hoja = XLSX.utils.json_to_sheet(filasExcel);
    const libro = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(libro, hoja, 'Conteos');
    const nombreArchivo = desde===hastaReal ? `conteos_${desde}.xlsx` : `conteos_${desde}_a_${hastaReal}.xlsx`;
    XLSX.writeFile(libro, nombreArchivo);
    toast(`${filas.length} conteo${filas.length===1?'':'s'} exportado${filas.length===1?'':'s'}`);
  }catch(e){ toast(e.message,'err'); }
  setState({exportConteos: {...state.exportConteos, exportando:false}});
}

/* =======================================================================
   CSV — parser mínimo (soporta comillas y comas dentro de campos)
   ======================================================================= */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  text = text.replace(/^\uFEFF/, ''); // quita BOM de exportaciones SAP/Excel
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false;
      } else field += c;
    }else{
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return {headers:[], data:[]};
  const headers = rows[0].map(h=>h.trim());
  const data = rows.slice(1).filter(r=>r.some(v=>v && v.trim()!=='')).map(r=>{
    const obj = {};
    headers.forEach((h,idx)=> obj[h] = (r[idx]!==undefined? r[idx].trim() : ''));
    return obj;
  });
  return {headers, data};
}

/* =======================================================================
   EXCEL — lectura de .xlsx/.xls via SheetJS (cargada en el head)
   ======================================================================= */
async function leerExcel(file){
  if(typeof XLSX === 'undefined'){
    throw new Error('No se pudo cargar el lector de Excel (revisa tu conexion) e intenta de nuevo, o sube el archivo como .csv.');
  }
  const buf = await file.arrayBuffer();
  const libro = XLSX.read(buf, {type:'array'});
  const hoja = libro.Sheets[libro.SheetNames[0]];
  const filas = XLSX.utils.sheet_to_json(hoja, {defval:''});
  if(!filas.length) return {headers:[], data:[]};
  const headers = Object.keys(filas[0]).map(h=>String(h).trim());
  const data = filas.map(f=>{
    const obj = {};
    headers.forEach(h=> obj[h] = (f[h]!==undefined && f[h]!==null) ? String(f[h]).trim() : '');
    return obj;
  });
  return {headers, data};
}

async function leerArchivoMasivo(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(ext==='xlsx' || ext==='xls') return leerExcel(file);
  const text = await file.text();
  return parseCSV(text);
}

/* =======================================================================
   CLASIFICADOR GENERICO DE COLUMNAS
   Detecta automaticamente, por nombre de columna (en espanol o ingles, de
   SAP o de cualquier planilla armada a mano), a que campo de la tabla
   "skus" corresponde cada una, sin depender de encabezados fijos.
   ======================================================================= */
const CAMPOS_SKU = [
  { campo:'sku_code', obligatorio:true, etiqueta:'Codigo SKU',
    alias:['material','sku','sku code','codigo','codigo sku','codigo material','cod','cod sku','item','item code','articulo','part number','material number','nro material','n material'] },
  { campo:'descripcion', obligatorio:false, etiqueta:'Descripcion',
    alias:['material description','descripcion','descripcion material','texto breve de material','short text','nombre','detalle','desc'] },
  { campo:'categoria', obligatorio:false, etiqueta:'Categoria',
    alias:['plant name','categoria','material group','grupo de articulos','familia','grupo','clase'] },
  { campo:'unidad_medida', obligatorio:false, etiqueta:'Unidad de medida',
    alias:['unidad_medida','unidad de medida','base unit of measure','uom','um','unidad'] },
  { campo:'ubicacion', obligatorio:false, etiqueta:'Ubicación específica',
    alias:['ubicacion especifica','storage location','ubicacion','location','rack'] },
  { campo:'storage_bin', obligatorio:false, etiqueta:'Storage bin',
    alias:['storage bin','bin','posicion','slot'] },
  { campo:'bodega', obligatorio:false, etiqueta:'Ubicación general',
    alias:['ubicacion general','description of storage location','sloc description','bodega','almacen','warehouse','plant','deposito'] },
  { campo:'stock_sistema', obligatorio:true, etiqueta:'Stock sistema',
    alias:['unrestricted stock','stock_sistema','stock sistema','stock','existencia','cantidad','qty','quantity','saldo','on hand'] },
  { campo:'costo_unitario', obligatorio:false, etiqueta:'Costo unitario',
    alias:['costo unitario','costo_unitario','precio unitario','moving average price','standard price','unit cost','unit price','valor unitario','costo','precio'] },
];

function normalizarTexto(s){
  return String(s||'')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,' ')
    .trim();
}

// El primer alias de cada campo es su nombre "canónico" (el que más probablemente
// use alguien que arma la planilla a mano en español); una coincidencia exacta con
// ese alias pesa más que una coincidencia exacta con un alias genérico/jerga SAP,
// para que columnas como "Ubicación general" no pierdan contra "Storage Location"
// cuando el mismo archivo trae ambas.
function puntajeColumna(headerNorm, aliases){
  let mejor = 0;
  aliases.forEach((alias, idx)=>{
    const a = normalizarTexto(alias);
    if(headerNorm === a){ mejor = Math.max(mejor, idx===0? 110 : 100); return; }
    if(headerNorm.includes(a) || a.includes(headerNorm)){ mejor = Math.max(mejor, 75); return; }
    const hw = new Set(headerNorm.split(' '));
    const comunes = a.split(' ').filter(w=>w && hw.has(w)).length;
    if(comunes) mejor = Math.max(mejor, 40 + comunes*10);
  });
  return mejor;
}

// Asignacion voraz columna->campo: cada columna del archivo se usa como
// maximo para un campo, priorizando siempre la coincidencia de mayor puntaje.
function detectarMapeo(headers, campos){
  const headersNorm = headers.map(normalizarTexto);
  const candidatos = [];
  campos.forEach(campo=>{
    headers.forEach((h,idx)=>{
      const p = puntajeColumna(headersNorm[idx], campo.alias);
      if(p>0) candidatos.push({campo:campo.campo, header:h, puntaje:p});
    });
  });
  candidatos.sort((a,b)=> b.puntaje-a.puntaje);
  const mapeo = {};
  const usados = new Set();
  candidatos.forEach(c=>{
    if(mapeo[c.campo] || usados.has(c.header) || c.puntaje<60) return;
    mapeo[c.campo] = c.header;
    usados.add(c.header);
  });
  return mapeo;
}

// Detecta el rechazo del índice único (empresa_id, sku_code, bodega_key) para mostrar un
// mensaje claro en vez del error crudo de Postgres. A propósito ya NO se resuelve con un
// upsert: hacerlo pisaba en silencio los datos de un SKU existente si alguien reusaba su
// código para un material distinto (bug real: "123456" con "Filtro" quedó sobrescrito por
// "Sillas" al cargar de nuevo el mismo código sin bodega). Para actualizar un SKU ya
// cargado se usa la carga masiva, que sí actualiza los que ya existen a propósito.
function esErrorCodigoSkuDuplicado(e){
  return /skus_empresa_id_sku_code_bodega_key/i.test((e && e.message) || '');
}
function mensajeCodigoSkuDuplicado(skuCode, bodega){
  return `El código ${skuCode} ya existe${bodega? ` en ${bodega}` : ' sin bodega asignada'}. Para actualizarlo, usa la carga masiva.`;
}
async function crearSkuManual(payload){
  if(!perfilCargado()) return false;
  const capturadoEn = new Date().toISOString();
  try{
    await rest('/skus', {method:'POST', body:[{...payload, empresa_id: state.perfil.empresa_id, capturado_en: capturadoEn}], prefer:'return=minimal'});
    toast('SKU guardado correctamente');
    refrescarListaSkus();
    return true;
  }catch(e){
    // Sin conexión de verdad (no un error del servidor): igual que con los conteos, el
    // SKU se guarda en este dispositivo y se sube solo al volver la señal.
    if(pareceFalloDeRed(e)){
      encolarAccionOffline('sku', {...payload, empresa_id: state.perfil.empresa_id});
      toast('Sin conexión: SKU guardado en este dispositivo. Se enviará cuando vuelva la señal.', 'warn');
      return true;
    }
    toast(esErrorCodigoSkuDuplicado(e) ? mensajeCodigoSkuDuplicado(payload.sku_code, payload.bodega) : e.message, 'err');
    return false;
  }
}

// La bodega es parte de la identidad de cada fila (on_conflict incluye bodega_key, ver
// confirmarCargaMasiva): si un archivo nuevo usa nombres/códigos de bodega que no existen en lo
// que ya está cargado, esas filas NO actualizan lo existente — crean SKU duplicados en la bodega
// nueva y dejan los viejos activos (caso real: Materials.xlsx con bodegas "B501"/"B521" no
// coincidía con la data de pruebas anterior en "Nave Mina"/"Patio 3000"/etc., duplicando ~55.000
// SKU). Se avisa solo con mismatch TOTAL (ninguna bodega del archivo coincide) — una coincidencia
// parcial es simplemente agregar un sitio nuevo, no un error de nomenclatura.
async function calcularAvisoBodega(data, columnaBodega){
  if(!columnaBodega) return null;
  const bodegasArchivo = Array.from(new Set(data.map(r=>String(r[columnaBodega]||'').trim()).filter(Boolean))).sort();
  if(!bodegasArchivo.length) return null;
  let existentes;
  try{
    const rows = await rest('/ubicaciones_generales?select=bodega');
    existentes = Array.from(new Set((rows||[]).map(r=>r.bodega).filter(Boolean))).sort();
  }catch(e){ return null; } // si falla la consulta, no se bloquea el flujo con un aviso a medias
  if(!existentes.length) return null; // primera carga de la empresa: nada con qué comparar
  const hayCoincidencia = bodegasArchivo.some(b=>existentes.includes(b));
  if(hayCoincidencia) return null;
  return { archivo: bodegasArchivo, existentes, confirmado:false };
}

async function prepararCargaMasiva(file){
  try{
    const {headers, data} = await leerArchivoMasivo(file);
    if(!headers.length || !data.length){ toast('El archivo no tiene filas de datos','err'); return; }
    const mapeo = detectarMapeo(headers, CAMPOS_SKU);
    const avisoBodega = await calcularAvisoBodega(data, mapeo.bodega);
    setState({cargaPreview: { file, headers, data, campos:CAMPOS_SKU, mapeo, modo:'complementar', confirmaReemplazo:false, avisoBodega }});
  }catch(e){ toast(e.message,'err'); }
}

function resumenErroresAArray(resumenErrores){
  return Array.from(resumenErrores, ([motivo, cantidad])=>({motivo, cantidad})).sort((a,b)=>b.cantidad-a.cantidad);
}

// Cargas de antes de este cambio guardaron detalle_errores fila por fila (sin agrupar, y
// limitado a 50 entradas) — sin esto, el historial las mostraría como hasta 50 líneas idénticas
// y sin cantidad ("× sku_code vacío"). Agrupa también esas entradas viejas al mostrarlas: una
// entrada sin `cantidad` numérica se cuenta como 1 (nota: para cargas viejas la cantidad mostrada
// puede ser menor a la real, porque el guardado original ya venía recortado a 50 filas).
function agruparDetalleErrores(detalleErrores){
  const mapa = new Map();
  (detalleErrores||[]).forEach(e=>{
    const cantidad = typeof e.cantidad==='number' ? e.cantidad : 1;
    mapa.set(e.motivo, (mapa.get(e.motivo)||0) + cantidad);
  });
  return resumenErroresAArray(mapa);
}

async function confirmarCargaMasiva(){
  if(!perfilCargado()) return;
  const { file, data, mapeo, modo } = state.cargaPreview;
  const valor = (row, campo) => mapeo[campo] ? (row[mapeo[campo]]!==undefined ? String(row[mapeo[campo]]).trim() : '') : '';

  setState({loading:true});

  const marcaTiempo = new Date().toISOString();
  let ok=0, error=0;
  // Se agrupan por motivo, no fila por fila: un archivo grande puede tener miles de filas con
  // el mismo problema (ej. "1.306 con costo negativo"), y una lista fila por fila no es legible
  // ni práctica de mostrar en el historial — tampoco depende de un tope arbitrario de cuántas
  // filas guardar en detalle, como sí lo era la lista plana anterior.
  const resumenErrores = new Map();
  const anotarError = (motivo) => { error++; resumenErrores.set(motivo, (resumenErrores.get(motivo)||0)+1); };
  // Un mismo sku_code puede vivir en más de una bodega (cada bodega es su propia fila, con
  // su propio stock/ubicación), así que la clave de deduplicado es código+bodega, no solo
  // el código: si el archivo trae dos filas del mismo código en bodegas distintas, ambas
  // deben llegar al upsert. Si trae dos filas del mismo código EN LA MISMA bodega, ahí sí
  // nos quedamos con la última (no hay forma de saber cuál es la correcta).
  const porCodigoYBodega = new Map();
  data.forEach((row,idx)=>{
    const sku_code = valor(row,'sku_code');
    if(!sku_code){ anotarError('Código de SKU vacío'); return; }
    ok++;
    const stockRaw = valor(row,'stock_sistema');
    const costoRaw = valor(row,'costo_unitario');
    const bodega = valor(row,'bodega') || null;
    // Un valor negativo (típico de notas de crédito/ajustes en exportaciones de SAP) viola el
    // check constraint de la tabla — sin este filtro, esa UNA fila hace fallar el INSERT masivo
    // completo (todo el archivo, no solo esa fila), porque se manda como un solo lote. Se guarda
    // el SKU igual, sin ese dato puntual, y se deja registrado como error de esa fila.
    let stock_sistema = stockRaw!=='' ? Number(stockRaw) : null;
    if(stock_sistema !== null && stock_sistema < 0){
      anotarError('Stock en negativo');
      stock_sistema = null;
    }
    let costo_unitario = costoRaw!=='' ? Number(costoRaw) : null;
    if(costo_unitario !== null && costo_unitario < 0){
      anotarError('Costo en negativo');
      costo_unitario = null;
    }
    porCodigoYBodega.set(JSON.stringify([sku_code, bodega]), {
      sku_code,
      empresa_id: state.perfil.empresa_id,
      descripcion: valor(row,'descripcion') || null,
      categoria: valor(row,'categoria') || null,
      unidad_medida: valor(row,'unidad_medida') || null,
      ubicacion: valor(row,'ubicacion') || null,
      storage_bin: valor(row,'storage_bin') || null,
      bodega,
      stock_sistema,
      costo_unitario,
      activo: true,
      updated_at: marcaTiempo,
      capturado_en: marcaTiempo,
    });
  });
  const lote = Array.from(porCodigoYBodega.values());
  // Un solo POST con todo el archivo (ej. 64.000 filas) supera el statement_timeout de 8s del
  // rol authenticated: cada fila dispara triggers propios (auditoría + chequeo de límite de
  // bodega), y ese costo por-fila multiplicado por decenas de miles de filas hace que Postgres
  // corte la consulta a mitad de camino — con un archivo grande, la carga entera fallaba (aunque
  // los datos fueran válidos) solo por el tamaño del lote. Partirlo en bloques evita el timeout
  // sin tocar los triggers ni la configuración de la base: cada POST individual es chico y rápido.
  const TAM_LOTE_CARGA = 2000;
  let insertados = 0;
  try{
    for(let i=0; i<lote.length; i+=TAM_LOTE_CARGA){
      const bloque = lote.slice(i, i+TAM_LOTE_CARGA);
      await rest('/skus?on_conflict=empresa_id,sku_code,bodega_key', {method:'POST', body:bloque, prefer:'return=minimal,resolution=merge-duplicates'});
      insertados += bloque.length;
    }
    // "Reemplazar completo": todo lo que quedó activo y NO se tocó en este lote (updated_at previo a esta carga) pasa a inactivo.
    if(modo==='reemplazar' && lote.length){
      await rest(`/skus?activo=eq.true&updated_at=lt.${encodeURIComponent(marcaTiempo)}`, {method:'PATCH', body:{activo:false}, prefer:'return=minimal'});
    }
    await registrarCarga(file.name, 'skus', data.length, ok, error, resumenErroresAArray(resumenErrores));
    toast(`Carga completa: ${insertados} SKUs cargados${modo==='reemplazar'?' (reemplazo completo)':''}${error?`, ${error} con error`:''}`);
    refrescarListaSkus();
    setState({loading:false, cargaPreview:null});
  }catch(e){
    // Con la carga partida en bloques, un bloque que falla a mitad de camino no invalida los
    // anteriores que ya se guardaron — se informa cuántos SKU sí entraron antes del corte.
    const filasFallidas = lote.length - insertados;
    if(filasFallidas>0) resumenErrores.set(e.message, filasFallidas);
    await registrarCarga(file.name, 'skus', data.length, insertados, error + filasFallidas, resumenErroresAArray(resumenErrores));
    setState({loading:false});
    toast(insertados ? `Se cargaron ${insertados} de ${lote.length} SKU antes de fallar: ${e.message}` : e.message, 'err');
  }
}
