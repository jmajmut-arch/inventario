const COLA_OFFLINE_KEY = 'cola_offline_conteos'; // nombre histórico; hoy también guarda SKU (ver "tipo" de cada item)
const TIPO_ACCION_OFFLINE_LABEL = { conteo:'Conteo', sku:'SKU' };

// fetch() rechaza con TypeError cuando la red falla de verdad (sin señal, DNS, etc.);
// los errores HTTP (4xx/5xx) llegan como una Response resuelta, no como excepción.
// Así distinguimos "no hay conexión" (encolar) de "el servidor rechazó la solicitud" (mostrar el error).
function pareceFalloDeRed(e){
  return e instanceof TypeError;
}

function leerColaOffline(){
  try{ return JSON.parse(localStorage.getItem(COLA_OFFLINE_KEY)||'[]'); }catch(e){ return []; }
}

function guardarColaOffline(cola){
  try{ localStorage.setItem(COLA_OFFLINE_KEY, JSON.stringify(cola)); }catch(e){ /* localStorage no disponible */ }
  state.colaOffline = cola;
}

// Crea la entrada en la cola y la deja visible de inmediato ("pendiente"); devuelve
// el item creado (con su id local) para poder asociarle fotos en IndexedDB (solo aplica
// a conteos). `tipo` decide cómo se procesa al sincronizar (ver procesarUnItemOffline).
function encolarAccionOffline(tipo, payload){
  const cola = leerColaOffline();
  const item = { id: 'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,7), tipo, creado_en: Date.now(), estado:'pendiente', error:null, ...payload };
  cola.push(item);
  guardarColaOffline(cola);
  return item;
}

function quitarDeColaOffline(id){
  guardarColaOffline(leerColaOffline().filter(i=>i.id!==id));
}

function marcarErrorEnColaOffline(id, mensaje){
  guardarColaOffline(leerColaOffline().map(i => i.id===id ? {...i, estado:'error', error:mensaje} : i));
}

/* -----------------------------------------------------------------------
   Fotos offline (IndexedDB): localStorage no sirve para archivos binarios
   (límite chico, ~5-10MB), así que las fotos de conteos guardados sin
   conexión se guardan aparte, en IndexedDB, asociadas al id del conteo
   encolado, y se suben recién al sincronizar.
   ----------------------------------------------------------------------- */
const OFFLINE_DB_NAME = 'certero_offline';
const FOTOS_OFFLINE_STORE = 'fotos_pendientes';

function abrirDbOffline(){
  return new Promise((resolve, reject) => {
    if(typeof indexedDB === 'undefined'){ reject(new Error('IndexedDB no disponible en este navegador')); return; }
    const req = indexedDB.open(OFFLINE_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(FOTOS_OFFLINE_STORE)){
        const store = db.createObjectStore(FOTOS_OFFLINE_STORE, {keyPath:'id'});
        store.createIndex('itemId', 'itemId', {unique:false});
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function solicitudAPromesa(req){
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// Guarda una o más fotos (File) asociadas al conteo encolado `itemId`.
async function guardarFotosOffline(itemId, archivos){
  if(!archivos || !archivos.length) return;
  const db = await abrirDbOffline();
  const store = db.transaction(FOTOS_OFFLINE_STORE, 'readwrite').objectStore(FOTOS_OFFLINE_STORE);
  await Promise.all(archivos.map((file,i) => solicitudAPromesa(store.put({
    id: `${itemId}-${i}-${Math.random().toString(36).slice(2,7)}`,
    itemId, nombre: file.name, tipo: file.type, blob: file,
  }))));
  db.close();
}

async function leerFotosOffline(itemId){
  const db = await abrirDbOffline();
  const store = db.transaction(FOTOS_OFFLINE_STORE, 'readonly').objectStore(FOTOS_OFFLINE_STORE);
  const fotos = await solicitudAPromesa(store.index('itemId').getAll(itemId));
  db.close();
  return fotos;
}

async function borrarFotosOffline(itemId){
  const db = await abrirDbOffline();
  const store = db.transaction(FOTOS_OFFLINE_STORE, 'readwrite').objectStore(FOTOS_OFFLINE_STORE);
  const claves = await solicitudAPromesa(store.index('itemId').getAllKeys(itemId));
  await Promise.all(claves.map(k => solicitudAPromesa(store.delete(k))));
  db.close();
}

async function descartarAccionOffline(id){
  const item = leerColaOffline().find(i=>i.id===id);
  const tipoTexto = item && item.tipo==='sku' ? 'este SKU guardado' : 'este conteo guardado';
  if(!confirm(`¿Descartar ${tipoTexto} sin conexión? Esta acción no se puede deshacer.`)) return;
  quitarDeColaOffline(id);
  await borrarFotosOffline(id).catch(()=>{});
  render();
}

// Procesa un único item encolado sin conexión. El tipo decide qué hacer:
// - 'sku': INSERT directo a /skus (mismo criterio que crearSkuManual — sin upsert, ver
//   esErrorCodigoSkuDuplicado, para no pisar en silencio un SKU existente).
// - 'conteo' (o sin tipo, para lo ya encolado antes de que existiera este campo): sube sus
//   fotos pendientes (si tiene), crea el conteo y lo enlaza con esas fotos.
// No toca la cola/localStorage; eso lo decide quien llama según el resultado.
async function procesarUnItemOffline(item){
  // item.creado_en queda registrado desde el momento en que se encoló (sin conexión), no
  // cuándo se sincroniza — es la fecha/hora real de captura para efectos de auditoría.
  const capturadoEn = new Date(item.creado_en).toISOString();
  try{
    if(item.tipo==='sku'){
      await rest('/skus', {method:'POST', body:[{
        sku_code: item.sku_code,
        descripcion: item.descripcion,
        categoria: item.categoria,
        unidad_medida: item.unidad_medida,
        bodega: item.bodega,
        ubicacion: item.ubicacion,
        storage_bin: item.storage_bin,
        stock_sistema: item.stock_sistema,
        empresa_id: item.empresa_id,
        capturado_en: capturadoEn,
      }], prefer:'return=minimal'});
      return {ok:true};
    }

    const fotos = await leerFotosOffline(item.id).catch(()=>[]);
    const urls = [];
    for(const foto of fotos){
      const ext = (foto.nombre.split('.').pop()||'jpg').toLowerCase();
      const ruta = `${item.empresa_id}/${item.sku_code}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
      urls.push(await storageUpload(ruta, foto.blob));
    }
    const filas = await rest('/conteos', {method:'POST', body:[{
      sku_id: item.sku_id,
      usuario_id: item.usuario_id,
      empresa_id: item.empresa_id,
      cantidad_contada: item.cantidad_contada,
      ubicacion_contada: item.ubicacion_contada,
      bodega: item.bodega,
      observacion: item.observacion,
      capturado_en: capturadoEn,
      fuera_de_plan: item.fuera_de_plan,
      ubicacion_distinta: !!item.ubicacion_distinta,
    }], prefer:'return=representation'});
    const conteoId = filas && filas[0] && filas[0].id;
    if(conteoId && urls.length){
      await rest('/conteo_fotos', {method:'POST', body: urls.map(foto_url=>({conteo_id:conteoId, foto_url})), prefer:'return=minimal'});
    }
    await borrarFotosOffline(item.id).catch(()=>{});
    return {ok:true};
  }catch(e){
    if(pareceFalloDeRed(e)) return {ok:false, red:true};
    if(item.tipo==='sku' && esErrorCodigoSkuDuplicado(e)) return {ok:false, red:false, mensaje:mensajeCodigoSkuDuplicado(item.sku_code, item.bodega)};
    return {ok:false, red:false, mensaje:e.message};
  }
}

// Envía los conteos y SKU guardados sin conexión, en orden, uno por uno. Si vuelve a
// fallar por red se detiene ahí (se sigue sin conexión) y deja el resto para
// el próximo intento. Un item que falla por un error real del servidor
// (no de red) queda marcado como "error" y visible en la cola en vez de
// perderse en silencio; esos solo se reintentan a mano, para no reintentar
// en bucle algo que ya sabemos que va a volver a fallar igual.
async function sincronizarColaOffline(){
  if(!state.session || state.sincronizandoOffline) return;
  const cola = leerColaOffline();
  const pendientes = cola.filter(i=>i.estado!=='error');
  if(!pendientes.length) return;
  state.sincronizandoOffline = true;
  render();
  let enviados = 0;
  let seCorto = false;
  for(const item of pendientes){
    if(seCorto) break;
    const resultado = await procesarUnItemOffline(item);
    if(resultado.ok){ quitarDeColaOffline(item.id); enviados++; }
    else if(resultado.red) seCorto = true;
    else marcarErrorEnColaOffline(item.id, resultado.mensaje);
  }
  state.sincronizandoOffline = false;
  if(enviados>0){
    toast(`${enviados} cambio${enviados===1?'':'s'} sincronizado${enviados===1?'':'s'}`);
    cargarDashboard(); cargarUltimosConteos(); cargarReconteos(); refrescarListaSkus();
  }
  render();
}

// Reintento manual de un item puntual (desde el panel de detalle), sin
// importar si ya estaba marcado como "error" — a diferencia de la
// sincronización automática, este sí se dispara a pedido explícito.
async function reintentarAccionOffline(id){
  if(!state.session || state.sincronizandoOffline) return;
  const item = leerColaOffline().find(i=>i.id===id);
  if(!item) return;
  state.sincronizandoOffline = true;
  render();
  const resultado = await procesarUnItemOffline(item);
  if(resultado.ok){
    quitarDeColaOffline(id);
    toast(item.tipo==='sku' ? 'SKU sincronizado' : 'Conteo sincronizado');
    cargarDashboard(); cargarUltimosConteos(); cargarReconteos(); refrescarListaSkus();
  }else if(resultado.red){
    toast('Sigue sin haber conexión','err');
  }else{
    marcarErrorEnColaOffline(id, resultado.mensaje);
    toast(`No se pudo sincronizar: ${resultado.mensaje}`,'err');
  }
  state.sincronizandoOffline = false;
  render();
}

// Agregar o quitar una foto exige volver a renderizar toda la pantalla (para mostrar la
// miniatura), pero el resto del formulario (cantidad, ubicación, observación) no está
// atado al estado — son inputs sueltos que se leen recién al guardar. Sin esto, cada foto
// agregada/quitada borraba lo que la persona ya había tipeado, en especial la cantidad.
function conservandoCamposConteo(fn){
  const ids = ['c-cant', 'c-bodega', 'c-ubic', 'c-obs'];
  const valores = {};
  ids.forEach(id=>{ const el = document.getElementById(id); if(el) valores[id] = el.value; });
  fn();
  ids.forEach(id=>{ const el = document.getElementById(id); if(el && valores[id]!==undefined) el.value = valores[id]; });
}

// Bug reportado: al elegir bodega/ubicación/storage bin en "Agregar a la planificación", la
// selección desaparecía sola. Causa: mientras la persona llena ese formulario, hay de sobra
// actividad de fondo que dispara un render() completo sin relación alguna con lo que está
// llenando — el ejemplo más frecuente es cargarPlanSemanal() recalculando en segundo plano el
// universo y el detalle de CADA entrada ya planificada (dos setState por entrada), pero
// cualquiera de las otras cargas iniciales (cargarTodo) puede seguir resolviendo de fondo si la
// conexión es lenta, que es justamente el escenario que más le importa a esta app ("incluso sin
// señal"). Storage bin es lo que más se nota porque su lista de opciones ni siquiera viene del
// estado (se carga aparte, vía cargarBinsPara), así que un render() de fondo no solo borra la
// selección: deja el selector entero como si nunca se hubiera elegido ubicación.
// En vez de perseguir cada setState de fondo uno por uno (imposible de mantener), render() en sí
// captura y restaura este formulario alrededor de CUALQUIER render mientras esté visible — mismo
// principio que conservandoCamposConteo, pero aplicado a nivel de render() para cubrir también
// actividad de fondo que no pasa por un solo punto de entrada conocido.
function capturarFormularioPlan(){
  const binEl = document.getElementById('p-bin');
  if(!binEl) return null; // no estamos mostrando el formulario "Agregar" (otra vista, o editando)
  const bodegaEl = document.getElementById('p-bodega');
  const ubicEl = document.getElementById('p-ubic');
  const binTodosEl = document.getElementById('p-bin-todos');
  const resumenBinEl = document.getElementById('p-bin-resumen');
  const fechaEl = document.getElementById('p-fecha');
  const respEl = document.getElementById('p-responsable');
  const notaEl = document.getElementById('p-nota');
  return {
    bodega: bodegaEl && bodegaEl.value,
    ubicInnerHTML: ubicEl && ubicEl.innerHTML,
    ubicValue: ubicEl && ubicEl.value,
    ubicDisabled: ubicEl && ubicEl.disabled,
    binInnerHTML: binEl.innerHTML,
    binDisabled: binEl.disabled,
    binModo: binEl.dataset.modo,
    binSkuCodes: binEl.dataset.skuCodes,
    // binOpciones/binTotalSkuModoSkus: la foto (bin -> cantidad_skus, o el total plano en modo
    // SKU puntuales) que actualizarResumenBin() usa para recalcular el resumen "(X bin/SKU)"
    // según lo que esté seleccionado en cada momento — sin esto, un render de fondo perdía el
    // dato y el resumen quedaba en blanco hasta volver a tocar la ubicación.
    binOpciones: binEl.dataset.opciones,
    binTotalSkuModoSkus: binEl.dataset.totalSkuModoSkus,
    binSeleccionados: [...binEl.selectedOptions].map(o=>o.value),
    binTodosChecked: binTodosEl && binTodosEl.checked,
    binTodosDisabled: binTodosEl && binTodosEl.disabled,
    resumenBinText: resumenBinEl && resumenBinEl.textContent,
    fecha: fechaEl && fechaEl.value,
    responsable: respEl && respEl.value,
    nota: notaEl && notaEl.value,
  };
}
function restaurarFormularioPlan(snap){
  if(!snap) return;
  const binEl2 = document.getElementById('p-bin');
  if(!binEl2) return; // el render cambió de vista o de formulario, nada que restaurar
  const bodegaEl2 = document.getElementById('p-bodega');
  const ubicEl2 = document.getElementById('p-ubic');
  const binTodosEl2 = document.getElementById('p-bin-todos');
  const resumenBinEl2 = document.getElementById('p-bin-resumen');
  const fechaEl2 = document.getElementById('p-fecha');
  const respEl2 = document.getElementById('p-responsable');
  const notaEl2 = document.getElementById('p-nota');
  if(bodegaEl2 && snap.bodega!==undefined) bodegaEl2.value = snap.bodega;
  if(ubicEl2 && snap.ubicInnerHTML!==undefined){
    ubicEl2.innerHTML = snap.ubicInnerHTML;
    ubicEl2.value = snap.ubicValue;
    ubicEl2.disabled = snap.ubicDisabled;
  }
  binEl2.innerHTML = snap.binInnerHTML;
  binEl2.disabled = snap.binDisabled;
  if(snap.binModo!==undefined) binEl2.dataset.modo = snap.binModo;
  if(snap.binSkuCodes!==undefined) binEl2.dataset.skuCodes = snap.binSkuCodes;
  if(snap.binOpciones!==undefined) binEl2.dataset.opciones = snap.binOpciones;
  if(snap.binTotalSkuModoSkus!==undefined) binEl2.dataset.totalSkuModoSkus = snap.binTotalSkuModoSkus;
  if(binEl2.options) [...binEl2.options].forEach(o=>{ o.selected = snap.binSeleccionados.includes(o.value); });
  if(binTodosEl2){
    binTodosEl2.checked = !!snap.binTodosChecked;
    binTodosEl2.disabled = snap.binTodosDisabled;
  }
  if(resumenBinEl2 && snap.resumenBinText!==undefined) resumenBinEl2.textContent = snap.resumenBinText;
  if(fechaEl2 && snap.fecha!==undefined) fechaEl2.value = snap.fecha;
  if(respEl2 && snap.responsable!==undefined) respEl2.value = snap.responsable;
  if(notaEl2 && snap.nota!==undefined) notaEl2.value = snap.nota;
}

// Marcar/desmarcar "Lo encontré en otra ubicación" dispara un render() completo (para

// Los campos de ubicación no necesitan preservarse: siempre muestran el valor del maestro,

async function guardarConteo({cantidad, ubicacion, bodega, observacion, ubicacionDistinta}){
  if(!state.skuSeleccionado){ toast('Selecciona un SKU primero','err'); return; }
  if(cantidad === '' || cantidad === null || isNaN(Number(cantidad)) || Number(cantidad) < 0){ toast('Ingresa una cantidad contada válida','err'); return; }
  if(!perfilCargado()) return;
  // Momento real en que la persona capturó el conteo (no cuándo termina de guardarse) —
  // fundamental para auditoría cuando se guarda sin conexión y se sincroniza horas después.
  const capturadoEn = new Date().toISOString();
  setState({loading:true});
  try{
    const filas = await rest('/conteos', {method:'POST', body:[{
      sku_id: state.skuSeleccionado.id,
      usuario_id: state.perfil ? state.perfil.id : null,
      empresa_id: state.perfil.empresa_id,
      cantidad_contada: Number(cantidad),
      ubicacion_contada: ubicacion || null,
      bodega: bodega || state.skuSeleccionado.bodega || null,
      observacion: observacion || null,
      capturado_en: capturadoEn,
      fuera_de_plan: !state.conteoOrigenPlan,
      ubicacion_distinta: !!ubicacionDistinta,
    }], prefer:'return=representation'});
    const conteoId = filas && filas[0] && filas[0].id;

    if(conteoId && state.conteoFotos.length){
      const urls = [];
      for(const f of state.conteoFotos){
        const ext = (f.file.name.split('.').pop()||'jpg').toLowerCase();
        const path = `${state.perfil.empresa_id}/${state.skuSeleccionado.sku_code}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
        urls.push(await storageUpload(path, f.file));
      }
      await rest('/conteo_fotos', {method:'POST', body: urls.map(foto_url=>({conteo_id:conteoId, foto_url})), prefer:'return=minimal'});
    }

    toast('Conteo registrado');
    setState({loading:false, skuSeleccionado:null, conteoOrigenPlan:false, conteoOtraUbicacion:false, conteoFotos:[], skuSearch:''});
    if(state.contarPlan.skusPendientes) elegirCascadaContar({});
    cargarDashboard(); cargarUltimosConteos(); cargarReconteos();
  }catch(e){
    // Sin conexión de verdad (no un error del servidor): guardamos el conteo (y sus
    // fotos, en IndexedDB) en este dispositivo y lo enviamos apenas vuelva la señal,
    // en vez de perder el trabajo.
    if(pareceFalloDeRed(e)){
      const fotosAEncolar = state.conteoFotos.map(f=>f.file);
      const item = encolarAccionOffline('conteo', {
        sku_id: state.skuSeleccionado.id,
        sku_code: state.skuSeleccionado.sku_code,
        usuario_id: state.perfil ? state.perfil.id : null,
        empresa_id: state.perfil.empresa_id,
        cantidad_contada: Number(cantidad),
        ubicacion_contada: ubicacion || null,
        bodega: bodega || state.skuSeleccionado.bodega || null,
        observacion: observacion || null,
        fotosCount: fotosAEncolar.length,
        fuera_de_plan: !state.conteoOrigenPlan,
        ubicacion_distinta: !!ubicacionDistinta,
      });
      if(fotosAEncolar.length) await guardarFotosOffline(item.id, fotosAEncolar).catch(()=>{});
      setState({loading:false, skuSeleccionado:null, conteoOrigenPlan:false, conteoOtraUbicacion:false, conteoFotos:[], skuSearch:''});
      toast('Sin conexión: conteo guardado en este dispositivo. Se enviará cuando vuelva la señal.', 'warn');
      return;
    }
    setState({loading:false});
    toast(e.message,'err');
  }
}

/* =======================================================================
   ESCÁNER DE CÓDIGOS — asociación código de barras / QR ↔ SKU
   ======================================================================= */
// Resuelve un código leído por la cámara contra la lista de SKU ya cargada. Dos formas
// de coincidencia, en orden: (1) el propio código del SKU (cubre el caso de imprimir
// stickers genéricos con el sku_code como código de barras, la salida más barata para
// ítems que nunca trajeron código de fábrica) y (2) el código de barras de fábrica ya
// asociado en una lectura anterior (columna codigo_barras). Devuelve TODAS las filas que
// calzan, no solo la primera: el mismo código puede existir en más de una bodega (cada
// bodega es su propia fila de SKU) y quien llama decide qué hacer si hay más de un
// resultado. Función pura para poder testearla sin cámara real.
function resolverSkusPorCodigo(skus, codigo){
  const c = (codigo||'').trim();
  if(!c) return [];
  const cLower = c.toLowerCase();
  const porCodigo = skus.filter(s=> (s.sku_code||'').toLowerCase() === cLower);
  if(porCodigo.length) return porCodigo;
  return skus.filter(s=> (s.codigo_barras||'').toLowerCase() === cLower);
}

// Un SKU escaneado se marca como "del plan" si está en la lista de pendientes que se ve ahora
// mismo en la tarjeta Plan del día (bodega/ubicación ya elegidas ahí) — no en todo el plan del
// día completo: recorrer cada bodega/ubicación planificada para saberlo costaría una consulta
// por cada una y, sin storage bin, el universo de una sola puede ser de miles de SKU (ver
// skusMovidosDeEntradas más arriba).
function skuEstaEnPlanDelDia(skuCode){
  const pendientes = state.contarPlan.skusPendientes;
  return !!(pendientes && pendientes.some(s=>s.sku_code===skuCode));
}

async function iniciarEscaner(){
  if(escanerInstancia) return; // ya hay una lectura en curso para este modal
  if(typeof Html5Qrcode === 'undefined'){
    setState({escanerModal: {...state.escanerModal, error:'El lector de códigos no cargó. Revisa tu conexión e inténtalo de nuevo.'}});
    return;
  }
  // Se listan los formatos explícitamente (en vez de dejar que pruebe todos los que sabe
  // decodificar) para que la librería se concentre en QR y los formatos de barras 1D más
  // comunes en maestros de materiales — mejora la velocidad y tasa de lectura de barras,
  // que son más difíciles de leer con solo cámara de celular que un QR.
  const formatos = (typeof Html5QrcodeSupportedFormats !== 'undefined') ? [
    Html5QrcodeSupportedFormats.QR_CODE,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.CODE_93,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.ITF,
  ] : undefined;
  const instancia = new Html5Qrcode('escaner-reader', formatos ? { formatsToSupport: formatos } : undefined);
  escanerInstancia = instancia;
  try{
    // El recuadro debe ser lo bastante alto para un QR completo (es cuadrado) y lo bastante
    // ancho para una barra 1D larga: solo se decodifica lo que cae dentro de este recuadro,
    // así que uno angosto (pensado solo para barras) dejaba los QR cortados y sin leer.
    await instancia.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 260 } },
      (codigoLeido) => onCodigoEscaneado(codigoLeido),
      () => { /* se llama en cada frame sin lectura; no requiere acción */ }
    );
  }catch(e){
    escanerInstancia = null;
    setState({escanerModal: {...state.escanerModal, error:'No se pudo acceder a la cámara. Revisa los permisos del navegador.'}});
  }
}

// Detiene la cámara y limpia el estado del modal de forma síncrona (para poder llamarla
// desde cualquier handler — cerrar, cambiar de pestaña, cerrar sesión — sin esperar el
// stop() async de la librería, que igual libera la cámara en segundo plano).
// El try/catch envuelve la LLAMADA misma a stop(), no solo la promesa que devuelve: si alguien
// cierra el modal mientras la cámara todavía está iniciando (start() aún no resolvió), algunas
// versiones de html5-qrcode lanzan "Cannot stop, scanner is not running or paused" de forma
// síncrona, antes de llegar a devolver una promesa — un .catch() encadenado no lo alcanza a
// atrapar (visto en Sentry, JAVASCRIPT-5).
function detenerEscaner(){
  const instancia = escanerInstancia;
  escanerInstancia = null;
  state.escanerModal = null;
  if(instancia){
    try{
      const promesa = instancia.stop();
      if(promesa && promesa.then) promesa.then(()=> instancia.clear()).catch(()=>{ /* ya estaba detenida */ });
    }catch(e){ /* ya estaba detenida (lanzamiento síncrono) */ }
  }
}

function cerrarEscaner(){
  detenerEscaner();
  render();
}

async function onCodigoEscaneado(codigo){
  if(!state.escanerModal || state.escanerModal.codigo) return; // evita doble disparo mientras se procesa la primera lectura
  const destino = state.escanerModal.destino;
  detenerEscaner();
  // Al cargar un SKU nuevo no hay nada que resolver contra el maestro existente: el código
  // leído se usa tal cual como código del SKU que se está por crear.
  if(destino === 'campo-sku'){
    setState({escanerModal: null});
    const input = document.getElementById('s-code');
    if(input){ input.value = codigo; input.focus(); }
    toast('Código escaneado');
    return;
  }
  const coincidencias = resolverSkusPorCodigo(state.skus, codigo);
  if(coincidencias.length===1){
    setState({skuSeleccionado: coincidencias[0], conteoOrigenPlan: skuEstaEnPlanDelDia(coincidencias[0].sku_code), conteoOtraUbicacion:false});
    toast(`SKU ${coincidencias[0].sku_code} encontrado`);
  }else if(coincidencias.length>1){
    // El mismo código existe en más de una bodega (el código físico es el mismo sin
    // importar dónde esté guardado el material): no hay forma de saber cuál es sin
    // preguntar.
    setState({escanerModal: { codigo, opciones: coincidencias, destino }});
  }else{
    setState({escanerModal: { codigo, buscarAsociar:'', asociando:false, destino }});
  }
}

// La persona elige a cuál de las bodegas encontradas corresponde el código escaneado.
function elegirSkuEscaneado(skuId){
  const sku = state.skus.find(s=>s.id===skuId);
  if(!sku) return;
  setState({skuSeleccionado: sku, conteoOrigenPlan: skuEstaEnPlanDelDia(sku.sku_code), conteoOtraUbicacion:false, escanerModal: null});
  toast(`SKU ${sku.sku_code} encontrado`);
}

// Primera vez que se ve este código: la persona elige a mano el SKU correcto y desde
// ahora ese código queda asociado — la próxima lectura lo va a reconocer solo.
async function asociarCodigoBarras(skuId, codigo){
  const sku = state.skus.find(s=>s.id===skuId);
  if(!sku) return;
  setState({escanerModal: {...state.escanerModal, asociando:true}});
  try{
    await rest(`/skus?id=eq.${skuId}`, {method:'PATCH', body:{codigo_barras: codigo}, prefer:'return=minimal'});
    sku.codigo_barras = codigo;
    toast(`Código asociado a ${sku.sku_code}`);
    setState({skuSeleccionado: sku, conteoOrigenPlan: skuEstaEnPlanDelDia(sku.sku_code), conteoOtraUbicacion:false, escanerModal: null});
  }catch(e){
    toast(e.message,'err');
    setState({escanerModal: {...state.escanerModal, asociando:false}});
  }
}

function pct(n){ return n===null||n===undefined? '0' : Number(n).toFixed(1); }
function clp(n){ return (Number(n)||0).toLocaleString('es-CL', {style:'currency', currency:'CLP', maximumFractionDigits:0}); }

/* =======================================================================
   GRÁFICOS — SVG plano, sin librerías externas
   ======================================================================= */
// Reportado: en el gráfico "SKU a contar por día" (con un Período elegido), la fecha mostrada
// no coincidía con la de la entrada de planificación (aparecía un día antes). Causa: new Date()
// sin hora explícita interpreta una fecha "YYYY-MM-DD" como medianoche UTC, no medianoche local
// — en Chile (UTC-3/-4) eso cae en el día calendario anterior. El resto del código (grupos,
// abrevDiaSemana, etc.) ya fuerza T00:00:00 para evitar justo este corrimiento.
function fmtDiaCorto(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short'}).replace('.',''); }

// Suma el avance diario (que viene por bodega) en un total por día calendario.
function agregarPorDia(diario, dias=14){
  const map = new Map();
  diario.forEach(r=>{
    const key = (r.dia||'').slice(0,10);
    if(!key) return;
    const cur = map.get(key) || { dia:key, contados:0, diferencias:0 };
    // skus_contados/con_diferencia vienen de count() en la vista SQL: PostgREST serializa
    // bigint como string (para no perder precisión), así que sin Number() esto concatena
    // texto en vez de sumar ("0"+"3" -> "03") y arruina el gráfico y la proyección.
    cur.contados += Number(r.skus_contados)||0;
    cur.diferencias += Number(r.con_diferencia)||0;
    map.set(key, cur);
  });
  return Array.from(map.values()).sort((a,b)=> a.dia.localeCompare(b.dia)).slice(-dias);
}

function renderBarChart(datos, valueKey, color, labelFn=fmtDiaCorto, mostrarValor=false){
  if(!datos.length) return `<div class="empty">Sin datos todavía.</div>`;
  const max = Math.max(1, ...datos.map(d=>d[valueKey]||0));
  const barW = 24, gap = 12, padTop = mostrarValor?26:16, padBottom = 20;
  const plotH = 90;
  const w = datos.length*(barW+gap)+gap;
  const h = plotH + padTop + padBottom;
  const baseline = padTop + plotH;
  const bars = datos.map((d,i)=>{
    const val = d[valueKey]||0;
    const barH = Math.round((val/max)*plotH);
    const x = gap + i*(barW+gap);
    const y = baseline - barH;
    const topeY = Math.max(y,padTop);
    return `<g>
      <rect x="${x}" y="${topeY}" width="${barW}" height="${Math.max(barH,val>0?2:0)}" rx="4" fill="${color}"><title>${esc(labelFn(d.dia))}: ${val}</title></rect>
      ${mostrarValor && val>0? `<text x="${x+barW/2}" y="${topeY-5}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-dim)">${val}</text>` : ''}
      <text x="${x+barW/2}" y="${baseline+13}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)">${esc(labelFn(d.dia))}</text>
    </g>`;
  }).join('');
  return `<div class="table-wrap"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block">
    <line x1="0" y1="${baseline}" x2="${w}" y2="${baseline}" stroke="var(--line)" stroke-width="1"/>
    ${bars}
  </svg></div>`;
}

function abrevDiaSemana(iso){
  const d = new Date(iso+'T00:00:00');
  const s = d.toLocaleDateString('es-CL',{weekday:'short'}).replace('.','');
  return s.charAt(0).toUpperCase()+s.slice(1);
}

// Agrupa el universo de SKU planificado por responsable, ordenado de mayor a menor carga.
function resumenPorResponsable(entradas, universos){
  const map = new Map();
  entradas.forEach(e=>{
    const nombre = e.responsable_nombre || 'Sin asignar';
    const cantidad = universos[e.id] || 0;
    map.set(nombre, (map.get(nombre)||0) + cantidad);
  });
  return Array.from(map, ([nombre, cantidad])=>({nombre, cantidad})).sort((a,b)=> b.cantidad-a.cantidad);
}

// Lista de barras horizontales para comparar magnitudes por categoría (responsable, bodega, etc.),
// escaladas contra la mayor del grupo (no contra un total), de mayor a menor.
function renderRankedBarList(filas){
  if(!filas.length) return `<div class="empty">Sin datos todavía.</div>`;
  const max = Math.max(1, ...filas.map(f=>f.cantidad));
  return filas.map(f=>{
    const p = Math.round(f.cantidad/max*100);
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <span style="font-size:12.5px;color:var(--text-dim)">${esc(f.nombre)}</span>
        <span class="mono" style="font-size:12.5px;color:var(--text)">${f.cantidad} SKU</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${p}%"></div></div>
    </div>`;
  }).join('');
}

// Ranking de exactitud por bodega: a diferencia de renderRankedBarList, cada barra ya es

// SKU que faltan por contar en cada ubicación general, de mayor a menor — dónde falta trabajar.
function resumenPendientesPorBodega(t){
  return t
    .map(r=>({nombre: r.bodega||'Sin ubicación general', cantidad: Math.max(0,(r.skus_universo||0)-(r.skus_contados||0))}))
    .filter(f=>f.cantidad>0)
    .sort((a,b)=> b.cantidad-a.cantidad);
}

// Fecha estimada de término si se mantiene el ritmo promedio de los últimos
// VENTANA_PROYECCION_DIAS días (contados en ese período / cantidad de días de la ventana,
// incluidos los días sin actividad — así el promedio ya refleja fines de semana o pausas
// reales en vez de asumir que se trabaja todos los días).
function proyeccionTermino(totUniverso, totContados, contadosEnVentana){
  const pendientes = Math.max(0, totUniverso - totContados);
  if(totUniverso===0) return {titulo:'—', detalle:'Aún no hay SKU cargados.'};
  if(pendientes===0) return {titulo:'¡Inventario completo!', detalle:'No quedan SKU pendientes por contar.'};
  const ritmoDiario = contadosEnVentana / VENTANA_PROYECCION_DIAS;
  if(ritmoDiario<=0) return {titulo:'Sin proyección', detalle:`Sin conteos en los últimos ${VENTANA_PROYECCION_DIAS} días para estimar un ritmo.`};
  const diasRestantes = Math.ceil(pendientes/ritmoDiario);
  const fechaProyectada = fechaISO(sumarDias(new Date(), diasRestantes));
  return {
    titulo: fmtFecha(fechaProyectada),
    detalle: `${diasRestantes} día${diasRestantes===1?'':'s'} más, a un ritmo de ${ritmoDiario.toFixed(1)} SKU/día (${pendientes.toLocaleString('es-CL')} pendientes)`,
  };
}

function renderDiffChart(sinDif, conDif){
  const total = sinDif + conDif;
  if(!total) return `<div class="empty">Sin conteos todavía en este período.</div>`;
  const fila = (label, val, color) => {
    const p = Math.round(val/total*100);
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <span style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim)">
          <span style="width:9px;height:9px;border-radius:2px;background:${color};display:inline-block;flex-shrink:0"></span>${label}
        </span>
        <span class="mono" style="font-size:12.5px;color:var(--text)">${val} · ${p}%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${p}%;background:${color}"></div></div>
    </div>`;
  };
  return fila('Sin diferencia', sinDif, 'var(--ok)') + fila('Con diferencia', conDif, 'var(--warn)');
}

            ${item.estado==='error'? `<button class="btn btn-danger" style="width:auto;padding:6px 12px;font-size:12px" data-descartar-offline="${item.id}">Descartar</button>` : ''}
          </div>
        </div>
      `;}).join('') : `<div class="empty" style="padding:14px 8px">No hay cambios pendientes.</div>`}
    </div>
  </div>`;
}

        <label for="escaner-buscar">Busca el SKU al que corresponde</label>
        <input type="text" id="escaner-buscar" placeholder="Ej. 4400-1123 o &quot;filtro&quot;" value="${esc(m.buscarAsociar)}" autocomplete="off">
        <div style="margin-top:10px">
          ${q.length===0? `<div class="hint">Escribe para buscar entre ${state.skus.length} SKU activos.</div>` :
            resultados.length? resultados.map(s=>`
              <div class="sku-pick" data-asociar="${s.id}">
                <div><span class="code">${esc(s.sku_code)}</span><span class="desc">${esc(s.descripcion||'Sin descripción')} · ${esc(s.bodega||'—')}</span></div>
                <button data-asociar-btn="${s.id}" ${m.asociando?'disabled':''}>${m.asociando?'...':'Asociar'}</button>
              </div>`).join('') :
            `<div class="hint">No se encontraron coincidencias.</div>`}

// Contenido de la vista ejecutiva del dashboard, extraído de renderDashboard() porque también
// lo usa imprimirInformeCiclo(): así el informe PDF muestra exactamente los mismos números que
// el dashboard, calculados una sola vez, en un solo lugar.
function renderInformeEjecutivo(){
  const t = state.dash.total;
  // skus_universo/skus_contados vienen de count(distinct) en la vista SQL: PostgREST los
  // serializa como string (bigint), así que sin Number() la suma concatena texto en vez de
  // sumar y el avance global queda completamente mal calculado.
  const totUniverso = t.reduce((s,r)=>s+(Number(r.skus_universo)||0),0);
  const totContados = t.reduce((s,r)=>s+(Number(r.skus_contados)||0),0);
  const avanceGlobal = totUniverso? (totContados/totUniverso*100) : 0;

  const pendientesBodega = resumenPendientesPorBodega(t);

  const filasBodega = t.map(r=>`
    <div class="tag-card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span class="kpi-label">${esc(r.bodega||'Sin ubicación general')}</span>
        <span class="mono" style="font-size:12px;color:var(--text-dim)">${r.skus_contados||0} / ${r.skus_universo||0} SKU</span>
      </div>
      <div class="kpi-value">${pct(r.porcentaje_avance)}%</div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,r.porcentaje_avance||0)}%"></div></div>
    </div>
  `).join('') || `<div class="empty"><div class="glyph">◧</div>Aún no hay SKUs cargados para calcular avance.</div>`;

  const diarioAgg = agregarPorDia(state.dash.diario, VENTANA_PROYECCION_DIAS);
  const totConDif = diarioAgg.reduce((s,d)=>s+d.diferencias,0);
  const totContadosPeriodo = diarioAgg.reduce((s,d)=>s+d.contados,0);
  const totSinDif = Math.max(0, totContadosPeriodo - totConDif);
  const proyeccion = proyeccionTermino(totUniverso, totContados, totContadosPeriodo);
  const rankingResponsables = (state.dash.ranking||[]).slice(0,8);

  // Exactitud: sobre el último conteo de cada SKU (no sobre cada conteo histórico), qué
  // porcentaje cuadró contra el stock de sistema (unidades) y qué porcentaje se contó en
  // la ubicación que dice el maestro (ubicación) — agregado por bodega en exactitud_por_bodega,
  // igual patrón que avance_total: se suman los totales acá, en el cliente.
  const exactBodega = state.dash.exactitudBodega||[];
  const exactContados = exactBodega.reduce((s,r)=>s+(Number(r.skus_contados)||0),0);
  const exactSinDif = exactBodega.reduce((s,r)=>s+(Number(r.sin_diferencia)||0),0);
  const exactUbicOk = exactBodega.reduce((s,r)=>s+(Number(r.ubicacion_correcta)||0),0);
  const exactitudUnidades = exactContados? (exactSinDif/exactContados*100) : 0;
  const exactitudUbicacion = exactContados? (exactUbicOk/exactContados*100) : 0;
  const rankingExactitud = exactBodega
    .map(r=>({
      nombre: r.bodega||'Sin ubicación general',
      pct: (Number(r.skus_contados)||0)? (Number(r.sin_diferencia)||0)/Number(r.skus_contados)*100 : 0,
      sub: `${r.sin_diferencia||0}/${r.skus_contados||0}`,
    }))
    .sort((a,b)=> a.pct-b.pct); // peor exactitud primero: dónde conviene intervenir
  const topDiferenciasPositivas = state.dash.topDiferenciasPositivas||[];
  const topDiferenciasNegativas = state.dash.topDiferenciasNegativas||[];

  // Tendencia de exactitud: exactitud_mensual agrupa por mes calendario (fecha_conteo), NO por
  // ciclo — a diferencia de exactitud_por_bodega (que solo mira el ciclo actual), esta vista
  // ignora el ciclo a propósito, para poder comparar un mes contra otro aunque la empresa nunca
  // haya abierto/cerrado un ciclo (hoy casi ninguna lo hace).
  const exactMensualFilas = state.dash.exactitudMensual||[];
  const mesesMap = new Map();
  exactMensualFilas.forEach(r=>{
    const cur = mesesMap.get(r.mes) || {mes:r.mes, contados:0, sinDif:0};
    cur.contados += Number(r.skus_contados)||0;
    cur.sinDif += Number(r.sin_diferencia)||0;
    mesesMap.set(r.mes, cur);
  });
  const tendenciaMensual = Array.from(mesesMap.values())
    .sort((a,b)=> a.mes.localeCompare(b.mes))
    .map(m=>({dia:m.mes, exactitud: m.contados? (m.sinDif/m.contados*100) : 0}));

  // Comparación por bodega entre el primer y el último mes con datos: es lo que le da sentido de
  // "gestión de calidad" a la tendencia ("la bodega X mejoró N puntos"), no solo un gráfico.
  const mesesDisponibles = Array.from(new Set(exactMensualFilas.map(r=>r.mes))).sort();
  const primerMes = mesesDisponibles[0];
  const ultimoMes = mesesDisponibles[mesesDisponibles.length-1];
  let comparacionBodegas = [];
  if(primerMes && ultimoMes && primerMes!==ultimoMes){
    const exactitudPorBodegaEnMes = (mes)=>{
      const m = new Map();
      exactMensualFilas.filter(r=>r.mes===mes).forEach(r=>{
        const contados = Number(r.skus_contados)||0;
        const sinDif = Number(r.sin_diferencia)||0;
        m.set(r.bodega||'Sin ubicación general', contados? (sinDif/contados*100) : null);
      });
      return m;
    };
    const inicioPorBodega = exactitudPorBodegaEnMes(primerMes);
    const finPorBodega = exactitudPorBodegaEnMes(ultimoMes);
    const bodegas = new Set([...inicioPorBodega.keys(), ...finPorBodega.keys()]);
    comparacionBodegas = Array.from(bodegas)
      .map(nombre=>{
        const inicio = inicioPorBodega.get(nombre);
        const fin = finPorBodega.get(nombre);
        return {nombre, inicio, fin, delta: (inicio!=null && fin!=null) ? (fin-inicio) : null};
      })
      // Solo bodegas con datos en AMBOS extremos: si una recién empezó a contarse, no hay
      // "mejora" que calcular todavía, solo un punto de partida.
      .filter(b=>b.delta!==null)
      .sort((a,b)=> b.delta-a.delta);
  }
  const mejorBodega = comparacionBodegas[0];
  const peorBodega = comparacionBodegas.length>1 ? comparacionBodegas[comparacionBodegas.length-1] : null;

  // Valorización: mismo patrón que exactitud_por_bodega, agregado por bodega en la vista
  // valorizacion_diferencias y sumado acá — solo cuenta los SKU con costo_unitario cargado,
  // así que "Valor contado" no es el valor de todo el inventario, sino de lo que se pudo costear.
  // "Valor contado" = costo_unitario × stock_sistema (el valor del inventario según el sistema),
  // no cantidad_contada: no debe variar según lo que se lleva contado, sino reflejar el stock.
  const valorizBodega = state.dash.valorizacion||[];
  const valorContado = valorizBodega.reduce((s,r)=>s+(Number(r.valor_contado)||0),0);
  const valorPerdidas = valorizBodega.reduce((s,r)=>s+(Number(r.valor_perdidas)||0),0);
  const valorExcedentes = valorizBodega.reduce((s,r)=>s+(Number(r.valor_excedentes)||0),0);
  const valorNeto = valorPerdidas + valorExcedentes;

  return `
    <div class="kpi-grid">
      <div class="tag-card">
        <div class="kpi-label">Avance global</div>
        <div class="kpi-value">${pct(avanceGlobal)}%</div>
        <div class="kpi-sub">${totContados.toLocaleString('es-CL')} de ${totUniverso.toLocaleString('es-CL')} SKU</div>
      </div>
      <div class="tag-card">
        <div class="kpi-label">Conteos recientes (ciclo actual)</div>
        <div class="kpi-value">${state.ultimosConteos.length}${state.ultimosConteosHayMas?'+':''}</div>
        <div class="kpi-sub">no cambia con el selector de período de Adherencia — para ver otros ciclos, usa Buscar</div>
      </div>
    </div>

    <div class="section-head"><div><span class="eyebrow">Sobre el último conteo de cada SKU</span><h2 style="font-size:17px">Exactitud</h2></div></div>
    <div class="kpi-grid" style="margin-bottom:14px">
      <div class="tag-card">
        <div class="kpi-label">De unidades</div>
        <div class="kpi-value">${pct(exactitudUnidades)}%</div>
        <div class="kpi-sub">${exactSinDif.toLocaleString('es-CL')} de ${exactContados.toLocaleString('es-CL')} SKU sin diferencia</div>
      </div>
      <div class="tag-card">
        <div class="kpi-label">De ubicación</div>
        <div class="kpi-value">${pct(exactitudUbicacion)}%</div>
        <div class="kpi-sub">${exactUbicOk.toLocaleString('es-CL')} de ${exactContados.toLocaleString('es-CL')} contados donde dice el maestro</div>
      </div>
    </div>

    <div class="section-head"><div><span class="eyebrow">De unidades, por mes calendario del conteo</span><h2 style="font-size:17px">Tendencia de exactitud</h2></div></div>
    <div class="tag-card" style="margin-bottom:14px">
      ${mesesDisponibles.length===0? `
        <div class="empty"><div class="glyph">◧</div>Vas a ver la tendencia acá apenas tengas conteos registrados.</div>
      ` : mesesDisponibles.length===1? `
        <div class="empty"><div class="glyph">◧</div>Por ahora solo hay conteos de ${esc(fmtMesTruncado(primerMes))}. La tendencia aparece cuando haya conteos de más de un mes.</div>
      ` : `
        ${renderBarChart(tendenciaMensual, 'exactitud', 'var(--accent)', fmtMesTruncado, true)}
        <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
          ${mejorBodega? `<p style="font-size:13px;margin:0 0 4px">📈 <strong>${esc(mejorBodega.nombre)}</strong> ${mejorBodega.delta>=0?'mejoró':'bajó'} ${pct(Math.abs(mejorBodega.delta))} puntos entre ${esc(fmtMesTruncado(primerMes))} y ${esc(fmtMesTruncado(ultimoMes))} (${pct(mejorBodega.inicio)}% → ${pct(mejorBodega.fin)}%).</p>` : ''}
          ${peorBodega && peorBodega.delta<0? `<p style="font-size:13px;margin:0;color:var(--text-dim)">📉 <strong>${esc(peorBodega.nombre)}</strong> bajó ${pct(Math.abs(peorBodega.delta))} puntos en el mismo período (${pct(peorBodega.inicio)}% → ${pct(peorBodega.fin)}%).</p>` : ''}
        </div>
        ${comparacionBodegas.length>1? `
          <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
            ${comparacionBodegas.map(b=>`
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
                <span style="font-size:12.5px;color:var(--text-dim)">${esc(b.nombre)}</span>
                <span class="mono" style="font-size:12.5px;color:${b.delta>=0?'var(--ok)':'var(--danger)'}">${pct(b.inicio)}% → ${pct(b.fin)}% (${b.delta>=0?'+':''}${pct(b.delta)} pts)</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
      `}
    </div>

    ${valorContado>0 || valorPerdidas!==0 || valorExcedentes!==0? `
      <div class="section-head"><div><span class="eyebrow">Con costo unitario cargado</span><h2 style="font-size:17px">Valorización de diferencias</h2></div></div>
      <div class="kpi-grid" style="margin-bottom:14px">
        <div class="tag-card">
          <div class="kpi-label">Valor contado</div>
          <div class="kpi-value" style="font-size:20px">${clp(valorContado)}</div>
          <div class="kpi-sub">stock según sistema</div>
        </div>
        <div class="tag-card">
          <div class="kpi-label">Pérdidas</div>
          <div class="kpi-value" style="font-size:20px;color:var(--danger)">${clp(valorPerdidas)}</div>
          <div class="kpi-sub">contado bajo el sistema</div>
        </div>
        <div class="tag-card">
          <div class="kpi-label">Excedentes</div>
          <div class="kpi-value" style="font-size:20px;color:var(--ok)">${clp(valorExcedentes)}</div>
          <div class="kpi-sub">contado sobre el sistema</div>
        </div>
        <div class="tag-card">
          <div class="kpi-label">Neto</div>
          <div class="kpi-value" style="font-size:20px;${valorNeto<0?'color:var(--danger)':valorNeto>0?'color:var(--ok)':''}">${clp(valorNeto)}</div>
          <div class="kpi-sub">impacto total de las diferencias</div>
        </div>
      </div>
    ` : ''}

    ${rankingExactitud.length? `
      <div class="section-head"><div><span class="eyebrow">Exactitud de unidades</span><h2 style="font-size:17px">Ranking por ubicación general</h2></div></div>
      <div class="card">${renderExactitudBarList(rankingExactitud)}</div>
    ` : ''}

    ${topDiferenciasPositivas.length? `
      <div class="section-head"><div><span class="eyebrow">Top 10 · Mayor valor a favor</span><h2 style="font-size:17px">Excedentes con más impacto</h2></div></div>
      <div class="card">${tablaTopDiferencias(topDiferenciasPositivas)}</div>
    ` : ''}

    ${topDiferenciasNegativas.length? `
      <div class="section-head"><div><span class="eyebrow">Top 10 · Mayor valor en contra</span><h2 style="font-size:17px">Pérdidas con más impacto</h2></div></div>
      <div class="card">${tablaTopDiferencias(topDiferenciasNegativas)}</div>
    ` : ''}

    <div class="section-head"><div><span class="eyebrow">Al ritmo actual</span><h2 style="font-size:17px">Proyección de término</h2></div></div>
    <div class="tag-card" style="margin-bottom:14px">
      <div class="kpi-value" style="font-size:22px">${proyeccion.titulo}</div>
      <div class="kpi-sub">${proyeccion.detalle}</div>
    </div>

    <div class="section-head"><div><span class="eyebrow">Últimos ${VENTANA_PROYECCION_DIAS} días</span><h2 style="font-size:17px">Conteos por día</h2></div></div>
    <div class="card">${renderBarChart(diarioAgg, 'contados', 'var(--amber)', fmtDiaCorto, true)}</div>

    <div class="section-head"><div><span class="eyebrow">Últimos ${VENTANA_PROYECCION_DIAS} días</span><h2 style="font-size:17px">Diferencias</h2></div></div>
    <div class="card">${renderDiffChart(totSinDif, totConDif)}</div>

    ${rankingResponsables.length? `
      <div class="section-head"><div><span class="eyebrow">Últimos ${VENTANA_PROYECCION_DIAS} días</span><h2 style="font-size:17px">Ranking por responsable</h2></div></div>
      <div class="card">${renderRankedBarList(rankingResponsables)}</div>
    ` : ''}

    ${pendientesBodega.length? `
      <div class="section-head"><div><span class="eyebrow">Dónde falta contar</span><h2 style="font-size:17px">SKU pendientes por ubicación general</h2></div></div>
      <div class="card">${renderRankedBarList(pendientesBodega)}</div>
    ` : ''}

    <div class="section-head"><h2 style="font-size:17px">Avance por ubicación general</h2></div>
    ${filasBodega}
  `;
}

// Opciones del selector de período para "Adherencia al plan": el período actual (marcado
// es_actual en state.ciclos) primero, luego el resto de los ciclos, "Sin período" (conteos
// con ciclo_id null — antes de que existiera el ciclo actual, o capturados sin conexión
// mientras no había un ciclo marcado) y "Todos los períodos" para compararlos uno junto a otro.
function opcionesPeriodoDash(){
  const cicloActual = (state.ciclos||[]).find(c=>c.es_actual);
  const p = state.dashPeriodo;
  const opciones = [`<option value="" ${p===''?'selected':''}>${cicloActual? 'Período actual — '+esc(cicloActual.nombre) : 'Período actual'}</option>`];
  (state.ciclos||[]).forEach(c=>{
    if(cicloActual && c.id===cicloActual.id) return; // ya aparece como "Período actual"
    opciones.push(`<option value="${esc(c.id)}" ${p===c.id?'selected':''}>${esc(c.nombre)}</option>`);
  });
  opciones.push(`<option value="__sin_periodo__" ${p==='__sin_periodo__'?'selected':''}>Sin período</option>`);
  opciones.push(`<option value="__todos__" ${p==='__todos__'?'selected':''}>Todos los períodos</option>`);
  return opciones.join('');
}

// "Adherencia al plan": de todo lo contado en un período, qué porcentaje vino del plan
// asignado (Planificación → "Plan del día" en Contar) versus se agregó fuera de plan
// (buscador libre o escáner — ver #130). Igual que el resto del dashboard, es sobre el
// último conteo de cada SKU dentro de su período (no cada conteo histórico): si un SKU se
// recontó varias veces, solo cuenta su estado más reciente, si no "Fuera de plan" queda
// inflado con intentos ya corregidos. La bodega que se muestra es la del SKU (skus.bodega),
// igual que en Exactitud/Avance/Valorización — no la que quedó registrada en el conteo (donde
// físicamente estaba parado quien contó), que puede no coincidir y mostraba nombres de bodega
// que no calzaban con el resto del dashboard. El selector de período es puramente client-side
// sobre dash.adherenciaPorCiclo (ya trae todos los períodos agrupados por bodega): cambiar
// de período solo recalcula esto, no dispara una nueva carga.
function renderAdherenciaPlan(){
  const filas = state.dash.adherenciaPorCiclo || [];
  const periodo = state.dashPeriodo;
  const cabecera = `
    <div class="section-head">
      <div><span class="eyebrow">Cuánto de lo contado vino del plan asignado</span><h2 style="font-size:17px">Adherencia al plan</h2></div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <label for="dash-periodo">Período</label>
      <select id="dash-periodo">${opcionesPeriodoDash()}</select>
    </div>
  `;

  const sumar = (rows) => rows.reduce((acc,r)=>({
    total: acc.total + (Number(r.total_conteos)||0),
    enPlan: acc.enPlan + (Number(r.en_plan)||0),
    fueraPlan: acc.fueraPlan + (Number(r.fuera_de_plan)||0),
  }), {total:0, enPlan:0, fueraPlan:0});
  const nombrePeriodo = (cicloId) => cicloId===null ? 'Sin período' : (((state.ciclos||[]).find(c=>c.id===cicloId)||{}).nombre || 'Período eliminado');

  if(periodo==='__todos__'){
    const porCiclo = new Map();
    filas.forEach(r=>{
      const key = r.ciclo_id || '__null__';
      if(!porCiclo.has(key)) porCiclo.set(key, []);
      porCiclo.get(key).push(r);
    });
    const filasTabla = Array.from(porCiclo.entries()).map(([key, rows])=>{
      const cicloId = key==='__null__' ? null : key;
      const s = sumar(rows);
      return {cicloId, nombre: nombrePeriodo(cicloId), ...s, pctAdherencia: s.total? s.enPlan/s.total*100 : 0};
    }).sort((a,b)=>{
      if(a.cicloId===null) return 1;
      if(b.cicloId===null) return -1;
      const ia = (state.ciclos||[]).findIndex(c=>c.id===a.cicloId);
      const ib = (state.ciclos||[]).findIndex(c=>c.id===b.cicloId);
      return ia-ib; // state.ciclos viene ordenado created_at.desc: más reciente primero
    });

    return cabecera + `
      <div class="card">
        ${filasTabla.length? `<div class="table-wrap"><table>
          <thead><tr><th>Período</th><th class="num">Conteos</th><th class="num">En plan</th><th class="num">Fuera de plan</th><th class="num">Adherencia</th></tr></thead>
          <tbody>${filasTabla.map(f=>`<tr>
            <td>${esc(f.nombre)}</td>
            <td class="num">${f.total}</td>
            <td class="num">${f.enPlan}</td>
            <td class="num">${f.fueraPlan? `<span class="badge badge-warn">${f.fueraPlan}</span>` : '0'}</td>
            <td class="num mono">${pct(f.pctAdherencia)}%</td>
          </tr>`).join('')}</tbody>
        </table></div>` : `<div class="empty">Todavía no hay conteos registrados.</div>`}
      </div>
    `;
  }

  const cicloActual = (state.ciclos||[]).find(c=>c.es_actual);
  const cicloId = periodo==='' ? (cicloActual? cicloActual.id : null) : (periodo==='__sin_periodo__' ? null : periodo);
  const filasPeriodo = filas.filter(r=> (r.ciclo_id||null) === cicloId);
  const s = sumar(filasPeriodo);
  const pctAdherencia = s.total? s.enPlan/s.total*100 : 0;
  const porBodega = filasPeriodo
    .map(r=>({
      nombre: r.bodega||'Sin ubicación general',
      pct: (Number(r.total_conteos)||0) ? (Number(r.en_plan)||0)/Number(r.total_conteos)*100 : 0,
      sub: `${r.en_plan||0}/${r.total_conteos||0}`,
    }))
    .sort((a,b)=> a.pct-b.pct); // menor adherencia primero: dónde conviene reforzar el plan

  return cabecera + (s.total? `
    <div class="kpi-grid" style="margin-bottom:14px">
      <div class="tag-card">
        <div class="kpi-label">Adherencia al plan</div>
        <div class="kpi-value">${pct(pctAdherencia)}%</div>
        <div class="kpi-sub">${s.enPlan.toLocaleString('es-CL')} de ${s.total.toLocaleString('es-CL')} conteos</div>
      </div>
      <div class="tag-card">
        <div class="kpi-label">Fuera de plan</div>
        <div class="kpi-value">${s.fueraPlan.toLocaleString('es-CL')}</div>
        <div class="kpi-sub">buscador libre o escáner</div>
      </div>
    </div>
    ${porBodega.length? `<div class="card">${renderExactitudBarList(porBodega)}</div>` : ''}
  ` : `<div class="empty">Sin conteos registrados en este período.</div>`);
}

const CAUSA_PROBABLE_BADGE = {
  'Ubicación distinta y recurrente': 'badge-danger',
  'Diferencia recurrente': 'badge-danger',
  'Ubicación distinta': 'badge-warn',
  'Sin patrón detectado': 'badge-neutral',
};
function causaProbableBadge(causa){
  if(!causa) return '';
  return `<span class="badge ${CAUSA_PROBABLE_BADGE[causa]||'badge-neutral'}">${esc(causa)}</span>`;
}

function estadoBadge(estado, diferencia){
  if(diferencia && Number(diferencia)!==0) return `<span class="badge badge-warn">Diferencia ${diferencia>0?'+':''}${diferencia}</span>`;
  if(estado==='pendiente_revision') return `<span class="badge badge-neutral">Pendiente</span>`;
  // El valor en base (y en el dropdown de filtro) sigue siendo "aprobado" -- eso no se toca,
  // solo el texto que ve la persona: "Cuadrado" describe mejor un conteo sin diferencia que
  // "Aprobado", que sonaba a que alguien lo revisó y dio el visto bueno.
  return `<span class="badge badge-ok">${estado==='aprobado' ? 'Cuadrado' : esc(estado||'ok')}</span>`;
}

// Reportado: en Planificación, el rango de la semana mostrado ("23 ago – 29 ago") no coincidía
// con los días reales (Lun 24 – Dom 30) ni con lo que dice cada tarjeta. fmtFecha recibe tanto
// fechas puras "YYYY-MM-DD" (ej. plan_semanal.fecha, sin hora) como timestamps completos (ej.
// el último conteo, con su propia hora/zona). Sin hora explícita, new Date() interpreta una fecha
// pura como medianoche UTC, no medianoche local — en Chile (UTC-3/-4) eso corre el día al
// anterior. Se fuerza T00:00:00 solo para las fechas puras; los timestamps completos, que ya
// traen su hora/zona, se dejan tal cual.
function fmtFecha(iso){
  if(!iso) return '—';
  const d = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? new Date(iso+'T00:00:00') : new Date(iso);
  return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'2-digit'});
}
// dia/semana/mes en avance_diario/semanal/mensual vienen truncados EN EL SERVIDOR con
// date_trunc(...), siempre a las 00:00 UTC (confirmado: el timezone de la sesión de Postgres es
// UTC) — son un límite de calendario ("el lunes de esa semana", "el día 1 de ese mes"), no un
// instante real como fecha_conteo. Bug real reportado: leerlos con new Date(iso) y funciones
// locales (getMonth/getDate) los reinterpreta según la zona horaria del navegador — en cualquier
// huso detrás de UTC (Chile incluido), la medianoche UTC cae en el día anterior en hora local, y
// si es el día 1 de un mes, el mes completo se corre hacia atrás (se veía "Julio" con datos de
// agosto). Se reconstruye como fecha local a partir de los componentes UTC, para mostrar el
// mismo calendario que calculó la base de datos, sin importar la zona horaria de quien mira.
function fechaCalendarioUTC(iso){
  const d = new Date(iso);
  return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}
function fmtDiaTruncado(iso){
  if(!iso) return '—';
  return fechaCalendarioUTC(iso).toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'2-digit'});
}
// Igual que fmtDiaTruncado (misma corrección de zona horaria sobre un valor date_trunc'd), pero
// sin el día — para etiquetar meses en la tendencia de exactitud ("ene 26" en vez de "01 ene 26").
function fmtMesTruncado(iso){
  if(!iso) return '—';
  const s = fechaCalendarioUTC(iso).toLocaleDateString('es-CL',{month:'short',year:'2-digit'}).replace('.','');
  return s.charAt(0).toUpperCase()+s.slice(1);
}
// Número de semana ISO 8601 (lunes a domingo, semana 1 = la que contiene el primer jueves del
// año) — coincide con el criterio que ya usa date_trunc('week', ...) en avance_semanal.
function numeroSemanaISO(fecha){
  const d = new Date(Date.UTC(fecha.getFullYear(), fecha.getMonth(), fecha.getDate()));
  const diaSemana = d.getUTCDay() || 7; // domingo (0) pasa a 7
  d.setUTCDate(d.getUTCDate() + 4 - diaSemana);
  const inicioAnio = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - inicioAnio) / 86400000) + 1) / 7);
}
function fmtSemana(iso){
  if(!iso) return '—';
  const d = fechaCalendarioUTC(iso);
  return `Semana ${numeroSemanaISO(d)} (${d.getFullYear()})`;
}
const MESES_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function fmtMes(iso){
  if(!iso) return '—';
  const d = fechaCalendarioUTC(iso);
  return `${MESES_ES[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtFechaHora(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleString('es-CL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }

// Un conteo/SKU se considera "capturado sin conexión" cuando la fecha que reportó el
// dispositivo al momento de capturarlo (capturado_en) difiere de cuándo el registro
// realmente llegó al servidor (fecha_conteo/created_at) por más de un minuto — para
// auditoría es clave distinguir ambas fechas, nunca reemplazar una con la otra.
const UMBRAL_OFFLINE_MS = 60000;
function fueCapturadoOffline(capturadoEn, fechaServidor){
  if(!capturadoEn || !fechaServidor) return false;
  return Math.abs(new Date(fechaServidor) - new Date(capturadoEn)) > UMBRAL_OFFLINE_MS;
}
function esc(s){ return (s===null||s===undefined)? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Ícono de color para el último conteo de un SKU: verde = cuadrado (sin diferencia), amarillo =
// diferencia positiva (sobrante), rojo = diferencia negativa (faltante). null cuando aún no tiene
// ningún conteo (no se pinta nada).
function iconoUltimoConteo(estado, diferencia){
  if(!estado) return '';
  const dif = Number(diferencia)||0;
  // var(--warn) se ve café/naranjo en el tema claro (pensado para dar contraste como texto de
  // badge), no como un amarillo franco. Para este punto de color se usa un amarillo fijo, que se
  // distingue mejor de rojo/verde en cualquier tema.
  const color = estado==='aprobado' ? 'var(--ok)' : (dif>0 ? '#f1c40f' : 'var(--danger)');
  const titulo = estado==='aprobado' ? 'Último conteo cuadrado (sin diferencia)'
    : dif>0 ? `Último conteo con diferencia positiva (+${dif})`
    : `Último conteo con diferencia negativa (${dif})`;
  return `<span title="${esc(titulo)}" aria-label="${esc(titulo)}" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};flex:none"></span>`;
}

  const desde = sp.total? sp.page*SKUS_POR_PAGINA+1 : 0;

      ${sp.rows.length? `<div class="table-wrap"><table>

          <td>${esc(s.bodega||'—')}</td>

          <td class="num">${s.stock_sistema!==null? s.stock_sistema:'—'}</td>
        </tr>`;
        }).join('')}</tbody>
      </table></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px">
        <button class="btn btn-secondary" id="skus-pag-prev" style="width:auto;flex:none;padding:8px 14px" ${sp.page<=0?'disabled':''}>Anterior</button>
        <span class="hint" style="margin:0">${desde}–${hasta} de ${sp.total} · pág. ${paginaActual}/${totalPaginas}</span>
        <button class="btn btn-secondary" id="skus-pag-next" style="width:auto;flex:none;padding:8px 14px" ${paginaActual>=totalPaginas?'disabled':''}>Siguiente</button>
      </div>` : `<div class="empty"><div class="glyph">▭</div>Aún no hay SKU cargados.</div>`}
    </div>
  `;
}

        <input type="checkbox" id="chk-confirma-reemplazo" style="margin-top:2px" ${confirmaReemplazo?'checked':''}>

        <thead><tr>${campos.map(c=>`<th>${esc(c.etiqueta)}</th>`).join('')}</tr></thead>
        <tbody>${filasPreview.map(row=>`<tr>${campos.map(c=>{
          const h = mapeo[c.campo];

// "Mi plan del día": bodega/patio y ubicación en cascada, limitados a lo que le toca hoy a la
// cuenta logueada — no al universo completo de la empresa (eso es "Agregar a la planificación",
// en otra pantalla). Sin filtro de storage bin (se sacó a pedido: era un paso de más y, si una
// ubicación tenía varias entradas por bin distinto, obligaba a elegir una por una en vez de ver
// todo junto) — al elegir bodega+ubicación se junta el checklist de SKU pendientes de todos los
// bin de esa ubicación (ya excluye los contados en este ciclo, ver #129).
function renderPlanDelDia(){
  const cp = state.contarPlan;
  const normales = cp.entradas.filter(e=>!e.solo_sin_ubicacion);
  const haySueltos = cp.entradas.some(e=>e.solo_sin_ubicacion);
  // Bug real reportado: bodega==='' es el grupo "Sin bodega asignada" (bodega IS NULL, pero con
  // ubicación específica) — .filter(Boolean) lo descartaba de la lista de opciones (cadena vacía
  // es falsy), así que esas entradas quedaban en cp.entradas pero eran inalcanzables desde el
  // <select>: el operador nunca podía llegar a ver sus SKU pendientes. Necesita su propio option
  // con el sentinel BODEGA_VACIA, mismo patrón que ya usa Planificación.
  const hayBodegaVacia = normales.some(e=>e.bodega==='');
  const bodegas = Array.from(new Set(normales.map(e=>e.bodega).filter(b=>b))).sort();
  const porBodega = normales.filter(e=> (cp.bodega===BODEGA_VACIA ? e.bodega==='' : e.bodega===cp.bodega));
  const ubicaciones = Array.from(new Set(porBodega.map(e=> e.ubicacion || ''))).filter(Boolean).sort();
  const activas = entradasActivasContar(cp);
  const bodegaElegida = !!cp.bodega;
  return `
    <div class="section-head"><div><span class="eyebrow">Mi plan</span><h2>Plan del día</h2></div></div>
    <div class="card">
      <label for="contar-fecha">Día</label>
      <input type="date" id="contar-fecha" value="${cp.fecha}">
      ${cp.cargando? `<div class="hint" style="margin-top:10px">Cargando…</div>` :
        !cp.entradas.length? `<div class="empty" style="padding:14px 8px;margin-top:10px">Sin nada planificado para ti este día.</div>` : `
        <div class="row2" style="margin-top:10px">
          <div><label for="contar-bodega">Bodega/patio</label>
            <select id="contar-bodega">
              <option value="">Elige…</option>
              ${haySueltos? `<option value="${BODEGA_SIN_UBICACION}" ${cp.bodega===BODEGA_SIN_UBICACION?'selected':''}>SKU sin ubicación</option>` : ''}
              ${hayBodegaVacia? `<option value="${BODEGA_VACIA}" ${cp.bodega===BODEGA_VACIA?'selected':''}>Sin bodega asignada</option>` : ''}
              ${bodegas.map(b=>`<option value="${esc(b)}" ${cp.bodega===b?'selected':''}>${esc(b)}</option>`).join('')}
            </select>
          </div>
          <div><label for="contar-ubic">Ubicación</label>
            <select id="contar-ubic" ${bodegaElegida && cp.bodega!==BODEGA_SIN_UBICACION? '' : 'disabled'}>
              <option value="">Todas</option>
              ${ubicaciones.map(u=>`<option value="${esc(u)}" ${cp.ubicacion===u?'selected':''}>${esc(u)}</option>`).join('')}
            </select>
          </div>
        </div>
        ${activas.length? `
          ${cp.skusPendientes===null? `<div class="hint" style="margin-top:10px">Cargando SKU pendientes…</div>` :
            cp.skusPendientes.length? `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px">
              <div class="hint" style="margin:0">${cp.skusPendientes.length} SKU pendientes</div>
              <button type="button" id="btn-escanear-plan" class="icon-btn" style="border:1px solid var(--line);border-radius:8px;width:36px;height:36px;flex:none" aria-label="Escanear código de un SKU planificado">${ICONS.escanear}</button>
            </div>
            <ul class="plan-sku-lista" style="margin-top:6px">
              ${cp.skusPendientes.map(s=>`
                <li>
                  <button type="button" data-pick-plan="${esc(s.sku_code)}" style="width:100%;text-align:left;background:none;border:none;padding:8px 0;cursor:pointer;color:inherit">
                    <span class="mono">${esc(s.sku_code)}</span> — ${esc(s.descripcion||'Sin descripción')}
                    ${[s.bodega, s.ubicacion, s.storage_bin].filter(Boolean).length? `
                      <div class="hint" style="margin-top:2px">${esc([s.bodega, s.ubicacion, s.storage_bin].filter(Boolean).join(' · '))}</div>
                    ` : ''}
                    ${s.cambioBodega || s.cambioUbicacion || s.cambioBin? `
                      <div class="badge badge-warn" style="display:inline-flex;align-items:center;gap:5px;margin-top:5px">
                        ${ICONS.alerta.replace('<svg','<svg style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none"')}
                        ${describirCambioPlan(s)}
                      </div>
                    ` : ''}
                  </button>
                </li>
              `).join('')}
            </ul>
            ` : `<div class="empty" style="padding:14px 8px;margin-top:10px">Ya contaste todo lo pendiente aquí.</div>`}
        ` : bodegaElegida? `<div class="hint" style="margin-top:10px">Elige ubicación para ver los SKU pendientes.</div>` : ''}
      `}
    </div>
  `;
}

/* =======================================================================

function renderConteo(){

  ).slice(0,8) : [];

  return `
    <div class="section-head"><div><span class="eyebrow">Terreno · Bodega</span><h2>Tomar inventario</h2></div></div>

    ${!state.skuSeleccionado? renderPlanDelDia() : ''}

    ${!state.skuSeleccionado? `
      <div class="section-head"><h2 style="font-size:15px">Agregar algo fuera del plan</h2></div>
      <div class="card">
        <label for="sku-search">Buscar SKU por código o descripción</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="text" id="sku-search" style="flex:1" placeholder="Ej. 4400-1123 o &quot;filtro&quot;" value="${esc(state.skuSearch)}" autocomplete="off">

        <div style="margin-top:10px">

            resultados.length? resultados.map(s=>`
              <div class="sku-pick" data-pick="${s.id}">
                <div><span class="code">${esc(s.sku_code)}</span><span class="desc">${esc(s.descripcion||'Sin descripción')} · ${esc(s.bodega||'—')}</span></div>

      <div class="selected-sku">
        <div class="code">${esc(state.skuSeleccionado.sku_code)}</div>
        <div style="font-size:12.5px;color:var(--text-dim);margin-top:2px">${esc(state.skuSeleccionado.descripcion||'Sin descripción')}</div>
        <div style="font-size:11.5px;color:var(--text-faint);margin-top:4px">Stock sistema: ${state.skuSeleccionado.stock_sistema!==null?state.skuSeleccionado.stock_sistema:'—'} ${esc(state.skuSeleccionado.unidad_medida||'')}</div>
      </div>

      <div class="card">
        <form id="form-conteo">
          <label for="c-cant">Cantidad contada *</label>
          <input type="number" id="c-cant" step="0.01" min="0" placeholder="0" required>
          <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--text-dim)">
            <input type="checkbox" id="c-otra-ubic" ${state.conteoOtraUbicacion?'checked':''}>
            Lo encontré en otra ubicación
          </label>
          <div class="row2">
            <div><label for="c-bodega">Ubicación general</label><input type="text" id="c-bodega" value="${esc(state.skuSeleccionado.bodega||'')}" disabled></div>
            <div><label for="c-ubic">Ubicación contada</label><input type="text" id="c-ubic" value="${esc(state.skuSeleccionado.ubicacion||'')}" disabled></div>
          </div>
          <label for="c-obs">Observación</label>
          <textarea id="c-obs" placeholder="Notas del conteo (opcional)"></textarea>

          <label>Respaldo fotográfico (puedes agregar varias)</label>
