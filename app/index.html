function encabezadoEntradaPlan(e){
  const ubic = e.solo_sin_ubicacion ? 'SKU sin ubicación' : ([e.bodega, e.ubicacion, e.storage_bin].filter(Boolean).join(' · ') || 'Sin ubicación específica');
  const partes = [`Responsable: ${esc(e.responsable_nombre || 'Sin asignar')}`];
  if(e.nota) partes.push(`Nota: ${esc(e.nota)}`);
  return `<h3>${esc(ubic)}</h3><div class="print-entrada-meta">${partes.join(' · ')}</div>`;
}

function tablaSkusEntradaPlan(skus){
  if(!skus.length) return `<p class="print-vacio">Sin SKU activos en esta ubicación.</p>`;
  return `
    <table>
      <thead><tr><th>SKU</th><th>Descripción</th><th>Storage bin</th><th>Unidad</th><th>Cantidad contada</th><th>Observación</th></tr></thead>
      <tbody>
        ${skus.map(s=>`
          <tr>
            <td>${esc(s.sku_code)}</td>
            <td>${esc(s.descripcion||'')}</td>
            <td>${esc(s.storage_bin||'—')}</td>
            <td>${esc(s.unidad_medida||'—')}</td>
            <td class="print-blank"></td>
            <td class="print-blank"></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function imprimirPlan(){
  const p = state.plan;
  const inicio = new Date(p.semanaInicio+'T00:00:00');
  // Misma semana de 8 días (lunes a lunes) que renderPlanificacion/cargarPlanSemanal.
  const finSemana = sumarDias(inicio,7);
  // Igual que en renderPlanificacion: con un período elegido se exporta TODO lo planificado
  // para ese período (todas las semanas), no solo la semana que se esté mirando.
  const cicloFiltroObj = p.cicloFiltro ? (state.ciclos||[]).find(c=>c.id===p.cicloFiltro) : null;
  const titulo = cicloFiltroObj ? `Plan de conteo — ${cicloFiltroObj.nombre}` : 'Plan de conteo semanal';
  const meta = cicloFiltroObj
    ? `${esc(cicloFiltroObj.nombre)} · Generado ${new Date().toLocaleString('es-CL')}`
    : `Semana ${fmtFecha(p.semanaInicio)} – ${fmtFecha(fechaISO(finSemana))} · Generado ${new Date().toLocaleString('es-CL')}`;
  const porDia = (p.cicloFiltro
    ? Array.from(new Set(p.entradas.map(e=>e.fecha))).sort()
    : Array.from({length:8},(_,i)=> fechaISO(sumarDias(inicio,i)))
  ).map(iso=>({
    label: new Date(iso+'T00:00:00').toLocaleDateString('es-CL',{weekday:'long', day:'2-digit', month:'short'}),
    entradas: p.entradas.filter(e=>e.fecha===iso),
  })).filter(d=>d.entradas.length);

  if(!porDia.length){
    document.getElementById('print-plan').innerHTML = `
      <h1>${esc(titulo)}</h1>
      <div class="print-meta">${meta}</div>
      <p class="print-vacio">No hay conteos planificados${cicloFiltroObj?'':' para esta semana'}.</p>
    `;
    window.print();
    return;
  }

  const btn = document.getElementById('btn-exportar-plan');
  if(btn){ btn.disabled = true; btn.textContent = 'Generando…'; }
  try{
    let cuerpo = '';
    for(const d of porDia){
      cuerpo += `<h2>${esc(d.label)}</h2>`;
      for(const e of d.entradas){
        const skus = await skusDeUbicacion({bodega:e.bodega, ubicacion:e.ubicacion, storage_bin:e.storage_bin, excluidos:e.skus_excluidos, soloSinUbicacion:e.solo_sin_ubicacion});
        cuerpo += encabezadoEntradaPlan(e) + tablaSkusEntradaPlan(skus);
      }
    }
    document.getElementById('print-plan').innerHTML = `
      <h1>${esc(titulo)}</h1>
      <div class="print-meta">${meta}</div>
      ${cuerpo}
    `;
    window.print();
  }catch(err){
    toast(err.message,'err');
  }finally{
    if(btn){ btn.disabled = !p.entradas.length; btn.innerHTML = `${ICONS.download} Exportar PDF`; }
  }
}

// Informe de ciclo: exporta a PDF (vía impresión del navegador) exactamente lo que muestra
// el dashboard en modo Ejecutivo — mismos números, mismo cálculo, un solo lugar de verdad
// (renderInformeEjecutivo). No hace ninguna consulta nueva: usa lo que ya está cargado en
// state.dash, así que refleja el ciclo actual tal como lo agrupan las vistas SQL (ver #103).
function imprimirInformeCiclo(){
  if(!planIncluye('dashboard_ejecutivo_habilitado')) return;
  const cicloActual = (state.ciclos||[]).find(c=>c.es_actual);
  const empresaNombre = (state.perfil && state.perfil.empresas && state.perfil.empresas.nombre) || '';
  const metaPartes = [empresaNombre, cicloActual? cicloActual.nombre : 'Sin ciclo asignado', new Date().toLocaleString('es-CL')].filter(Boolean);
  document.getElementById('print-plan').innerHTML = '';
  document.getElementById('print-informe').innerHTML = `
    <h1>Informe de ciclo de conteo</h1>
    <div class="print-meta">${metaPartes.map(esc).join(' · ')}</div>
    ${renderInformeEjecutivo()}
  `;
  window.print();
}

/* =======================================================================
   RENDER — Planificación semanal (por bodega, ubicación específica y storage bin)
   ======================================================================= */
function renderPlanificacion(){
  const p = state.plan;
  const inicio = new Date(p.semanaInicio+'T00:00:00');
  // La "semana" mostrada va de lunes al lunes siguiente inclusive (8 días, no 7): a pedido, para
  // no cortar la vista justo el domingo y poder ver de una el arranque de la semana próxima.
  const finSemana = sumarDias(inicio,7);
  const cicloFiltroObj = p.cicloFiltro ? (state.ciclos||[]).find(c=>c.id===p.cicloFiltro) : null;

  // En modo período se agrupa por cada fecha que realmente tenga algo planificado (no hay una
  // semana de referencia). En modo semana antes se armaban los 8 días de la semana elegida
  // aunque estuvieran vacíos; se dejó de hacer a pedido — abajo se filtran los días sin nada
  // planificado antes de listarlos, en ambos modos.
  const grupos = p.cicloFiltro
    ? Array.from(new Set(p.entradas.map(e=>e.fecha))).sort().map(iso=>{
        const d = new Date(iso+'T00:00:00');
        return {
          iso,
          label: d.toLocaleDateString('es-CL',{weekday:'long', day:'2-digit', month:'short'}),
          corta: d.toLocaleDateString('es-CL',{day:'2-digit',month:'short'}),
          entradas: p.entradas.filter(e=>e.fecha===iso),
        };
      })
    : Array.from({length:8},(_,i)=> sumarDias(inicio,i)).map(d=>{
        const iso = fechaISO(d);
        return {
          iso,
          label: d.toLocaleDateString('es-CL',{weekday:'long'}),
          corta: d.toLocaleDateString('es-CL',{day:'2-digit',month:'short'}),
          entradas: p.entradas.filter(e=>e.fecha===iso),
        };
      });

  const datosPorDia = grupos.map(d=>({
    dia: d.iso,
    cantidad: d.entradas.reduce((s,e)=> s+(p.universos[e.id]||0), 0),
  }));
  const totalSemana = datosPorDia.reduce((s,d)=>s+d.cantidad, 0);
  const responsablesResumen = resumenPorResponsable(p.entradas, p.universos);
  // El formulario "Agregar a la planificación" debe abrir en el día de hoy (lo más probable
  // es que estés planificando para hoy), no en el lunes de la semana — pero si estás navegando
  // una semana distinta a la actual, hoy cae fuera de [semanaInicio, finSemana] y hay que
  // quedarse con el lunes de esa semana para no violar los min/max del campo.
  const hoyISO = fechaISO(new Date());
  const fechaPlanDefault = (hoyISO >= p.semanaInicio && hoyISO <= fechaISO(finSemana)) ? hoyISO : p.semanaInicio;
  // El máximo seleccionable debe llegar al menos 7 días después de hoy, no solo hasta el fin
  // de la semana mostrada — si hoy cae cerca del fin de semana (ej. sábado), antes casi no
  // dejaba planificar hacia adelante. Si la semana mostrada ya llega más lejos (navegando a
  // futuro), se respeta ese límite mayor.
  const hoyMasSieteISO = fechaISO(sumarDias(new Date(hoyISO+'T00:00:00'), 7));
  const maxFechaPlan = fechaISO(finSemana) > hoyMasSieteISO ? fechaISO(finSemana) : hoyMasSieteISO;

  return `
    <div class="section-head">
      <div><span class="eyebrow">Planificación</span><h2>Semana de conteo</h2></div>
      <button class="btn btn-secondary" id="btn-exportar-plan" style="width:auto;padding:8px 12px;flex:none;display:flex;align-items:center;gap:6px" ${p.entradas.length?'':'disabled'}>${ICONS.download} Exportar PDF</button>
    </div>
    ${state.ciclos.length? `
    <label for="plan-filtro-ciclo" class="hint" style="margin:0 0 4px;display:block">Período</label>
    <select id="plan-filtro-ciclo" style="margin-bottom:12px">
      <option value="">Todos los períodos (navegar por semana)</option>
      ${state.ciclos.map(c=>`<option value="${esc(c.id)}" ${p.cicloFiltro===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}
    </select>
    ` : ''}
    ${p.cicloFiltro? `
    <div class="hint" style="margin-bottom:14px">Mostrando toda la planificación de <strong>${esc(cicloFiltroObj? cicloFiltroObj.nombre : '')}</strong>, de todas las semanas.</div>
    ` : `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px">
      <button class="btn btn-secondary" id="plan-semana-prev" style="width:auto;padding:8px 12px;flex:none">‹</button>
      <span class="hint" style="margin:0;text-align:center">${fmtFecha(p.semanaInicio)} – ${fmtFecha(fechaISO(finSemana))}</span>
      <button class="btn btn-secondary" id="plan-semana-next" style="width:auto;padding:8px 12px;flex:none">›</button>
    </div>
    `}

    <div class="card">
      <h3 style="margin:0 0 10px;font-size:15px">Agregar a la planificación</h3>
      <form id="form-plan">
        <label for="p-fecha">Fecha</label>
        <input type="date" id="p-fecha" value="${fechaPlanDefault}" min="${p.semanaInicio}" max="${maxFechaPlan}" required>
        <label for="p-bodega">Ubicación general</label>
        <select id="p-bodega">
          <option value="">Selecciona (opcional)</option>
          ${p.sinUbicacionCount? `<option value="${BODEGA_SIN_UBICACION}">SKU sin ubicación (${p.sinUbicacionCount})</option>` : ''}
          ${p.generales.map(o=> o.bodega===null
            ? `<option value="${BODEGA_VACIA}">Sin bodega asignada (${o.cantidad_pendiente}/${o.cantidad_skus})</option>`
            : `<option value="${esc(o.bodega)}">${esc(o.bodega)} (${o.cantidad_pendiente}/${o.cantidad_skus})</option>`
          ).join('')}
        </select>
        <div class="row2">
          <div><label for="p-ubic">Ubicación específica</label>
            <select id="p-ubic" disabled>
              <option value="">Elige ubicación general primero</option>
            </select>
          </div>
          <div><label for="p-bin">Storage bin <span id="p-bin-resumen" style="font-weight:400;color:var(--text-faint)"></span></label>
            <select id="p-bin" multiple size="6" disabled>
              <option value="">Elige ubicación específica primero</option>
            </select>
            <label style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--text-dim)">
              <input type="checkbox" id="p-bin-todos" disabled>
              Seleccionar todos
            </label>
            <div class="hint" id="p-bin-hint" style="margin:4px 0 0">Puedes elegir uno, varios o todos. Sin selección = todos.</div>
          </div>
        </div>
        <label for="p-responsable">Responsable</label>
        <select id="p-responsable">
          <option value="">Sin asignar</option>
          ${p.responsables.map(u=>`<option value="${esc(u.id)}">${esc(u.nombre)}</option>`).join('')}
        </select>
        ${!p.responsables.length? `<div class="hint" style="margin:4px 0 0">Invita a alguien de tu equipo desde Configuraciones para poder asignarlo aquí.</div>` : ''}
        <label for="p-nota">Nota</label>
        <input type="text" id="p-nota" placeholder="Opcional">
        <div style="margin-top:14px">
          <button type="submit" class="btn btn-primary">Agregar</button>
        </div>
      </form>
    </div>

    ${p.entradas.length? `
      <div class="section-head"><h2 style="font-size:15px">Resumen de la semana</h2></div>
      <div class="card">
        <div class="hint" style="margin-bottom:8px">SKU a contar por día (${totalSemana} en total)</div>
        ${renderBarChart(datosPorDia, 'cantidad', 'var(--amber)', p.cicloFiltro? fmtDiaCorto : abrevDiaSemana, true)}
      </div>
      <div class="card">
        <div class="hint" style="margin-bottom:10px">SKU a contar por responsable</div>
        ${renderRankedBarList(responsablesResumen)}
      </div>
    ` : ''}

    ${p.entradas.length? `
      <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;${p.seleccionados.length?'border-color:var(--danger)':''}">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;margin:0">
          <input type="checkbox" id="chk-seleccionar-todo-plan" ${p.seleccionados.length && p.seleccionados.length===p.entradas.length?'checked':''}>
          ${p.seleccionados.length? `${p.seleccionados.length} entrada${p.seleccionados.length>1?'s':''} seleccionada${p.seleccionados.length>1?'s':''}` : 'Seleccionar todo'}
        </label>
        ${p.seleccionados.length? `
          <div style="display:flex;gap:8px;flex:none">
            <button class="btn btn-secondary" id="btn-cancelar-seleccion-plan" style="width:auto;padding:8px 12px">Cancelar</button>
            <button class="btn" id="btn-borrar-seleccion-plan" style="width:auto;padding:8px 12px;background:var(--danger);color:#fff">${ICONS.papelera.replace('style="width:15px;height:15px"','style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"')} Eliminar</button>
          </div>

    ${grupos.filter(d=>d.entradas.length).map(d=>`

                    ${p.detalle[e.id].length>50? `<div class="hint" style="margin-top:4px">Mostrando 50 de ${p.detalle[e.id].length}. Usa "Exportar PDF" para ver el listado completo.</div>` : ''}
                  ` : `<div class="hint">Sin SKU activos en esta ubicación.</div>`
                )}
              </div>
            </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;flex:none">
              <button class="icon-btn" data-editar-plan="${e.id}" aria-label="Editar" title="Editar esta entrada del plan">${ICONS.editar}</button>
              <button class="icon-btn" data-borrar-plan="${e.id}" aria-label="Eliminar entrada completa" title="Eliminar toda esta entrada del plan (ubicación, responsable y nota)" style="color:var(--danger)">${ICONS.papelera}</button>
            </div>
          </div>
        `).join('')}
      </div>
    `).join('')}
  `;
}

function renderPlanYFacturacion(empresa){
  const plan = empresa.planes;
  const nombrePlan = plan && plan.nombre;
  const etiquetaPlan = plan? plan.etiqueta : '—';
  const estado = empresa.flow_subscription_status;
  const esAutoservicio = nombrePlan === 'basico' || nombrePlan === 'profesional';

  const otroPlan = PLANES_AUTOSERVICIO.find(p => p !== nombrePlan);
  const otroPlanEtiqueta = otroPlan === 'profesional' ? 'Profesional' : 'Básico';

  let estadoHtml = '';
  let botonHtml = '';
  if(esAutoservicio){
    if(estado === 'activa'){
      estadoHtml = `<span class="badge badge-ok">Suscripción activa</span>`;
      botonHtml = `
        <button type="button" data-cambiar-plan="${otroPlan}" class="btn btn-primary" style="width:auto;padding:8px 14px;margin-top:10px" ${state.cambiandoPlanFlow?'disabled':''}>${state.cambiandoPlanFlow?'Cambiando…':`Cambiar a ${otroPlanEtiqueta}`}</button>
        <button type="button" class="btn btn-secondary" data-suscribir-flow="${nombrePlan}" style="width:auto;padding:8px 14px;margin-top:10px;margin-left:8px" ${state.iniciandoSuscripcionFlow?'disabled':''}>${state.iniciandoSuscripcionFlow?'Redirigiendo…':'Actualizar método de pago'}</button>
        <button type="button" class="btn btn-secondary" id="btn-cancelar-suscripcion-flow" style="width:auto;padding:8px 14px;margin-top:10px;margin-left:8px;color:var(--danger)" ${state.cancelandoSuscripcionFlow?'disabled':''}>${state.cancelandoSuscripcionFlow?'Cancelando…':'Cancelar suscripción'}</button>
      `;
    } else if(estado === 'morosa'){
      estadoHtml = `<span class="badge badge-danger">Hubo un problema con el último cobro</span>`;
      botonHtml = `<button type="button" class="btn btn-primary" data-suscribir-flow="${nombrePlan}" style="width:auto;padding:8px 14px;margin-top:10px" ${state.iniciandoSuscripcionFlow?'disabled':''}>${state.iniciandoSuscripcionFlow?'Redirigiendo…':'Actualizar tarjeta'}</button>`;
    } else if(estado === 'cancelada'){
      estadoHtml = `<div class="hint">Tu suscripción quedó cancelada: seguirá activa hasta el fin del período ya pagado, sin renovarse después.</div>`;
      botonHtml = `<button type="button" class="btn btn-primary" data-suscribir-flow="${nombrePlan}" style="width:auto;padding:8px 14px;margin-top:10px" ${state.iniciandoSuscripcionFlow?'disabled':''}>${state.iniciandoSuscripcionFlow?'Redirigiendo…':'Suscribirme de nuevo'}</button>`;
    } else if(estado === 'vencida'){
      estadoHtml = `<span class="badge badge-danger">Suscripción vencida</span>`;
      botonHtml = `<button type="button" data-suscribir-flow="${nombrePlan}" class="btn btn-primary" style="width:auto;padding:8px 14px;margin-top:10px" ${state.iniciandoSuscripcionFlow?'disabled':''}>${state.iniciandoSuscripcionFlow?'Redirigiendo…':'Suscribirme de nuevo'}</button>`;
    } else {
      estadoHtml = `<div class="hint">Todavía no tienes un método de pago activo para este plan.</div>`;
      botonHtml = `<button type="button" class="btn btn-primary" data-suscribir-flow="${nombrePlan}" style="width:auto;padding:8px 14px;margin-top:10px" ${state.iniciandoSuscripcionFlow?'disabled':''}>${state.iniciandoSuscripcionFlow?'Redirigiendo…':'Suscribirme con tarjeta'}</button>`;
    }
  }

  return `
    <div class="card" style="margin-top:14px">
      <label>Plan actual</label>
      <div class="plan-item-ubic" style="font-weight:600;font-size:15px;margin-bottom:8px">${esc(etiquetaPlan)}</div>
      ${esAutoservicio? `${estadoHtml}${botonHtml}` : `<div class="hint">Tu plan se coordina directo con nosotros. <a href="mailto:contacto@inventiapp.cl?subject=Plan%20InventIA">Escríbenos</a> para ajustarlo.</div>`}
    </div>
  `;
}

// Cupo de operadores del plan (max_usuarios cuenta solo rol='operador' activos, ver el
// trigger chequear_limite_usuarios). null = sin límite (plan Empresa) o equipo aún sin cargar,
// distinto de 0 = límite alcanzado — lo usan tanto el hint como el botón de invitar.
function cupoOperadoresRestantes(empresa){
  const max = empresa.planes && empresa.planes.max_usuarios;
  if(max==null || !state.equipo.cargado) return null;
  const activos = state.equipo.personas.filter(p=>p.activo && p.rol!=='admin').length;
  return Math.max(0, max - activos);
}

// Referencia chica junto al formulario de invitación.
function hintCupoOperadores(empresa){
  const restantes = cupoOperadoresRestantes(empresa);
  if(restantes===null) return '';
  const max = empresa.planes.max_usuarios;
  const texto = restantes>0
    ? `Puedes crear ${restantes} operador${restantes===1?'':'es'} más (tu plan permite hasta ${max}).`
    : `Alcanzaste el límite de operadores de tu plan (${max}). Actualiza el plan para agregar más.`;
  return `<div class="hint" style="margin-top:8px;font-size:11px">${esc(texto)}</div>`;
}

        ${state.tema===t.id? `<span class="badge badge-ok">Actual</span>` : ''}
      </div>
    `).join('')}

    ${(esAdmin || esSuperAdmin) && planIncluye('auditoria_habilitada')? renderAuditoria() : ''}
  `;
}

}

function tabBtn(view,label){
  const bloqueada = vistaBloqueadaParaRol(view);
  return `<button class="tab ${state.view===view?'active':''} ${bloqueada?'tab-bloqueada':''}" data-tab="${view}" ${bloqueada?`data-bloqueada="1" title="Solo para administradores"`:''}>
    <span class="tab-icon-wrap">
      ${ICONS[view==='carga'?'upload':view]}
      ${bloqueada? `<span class="tab-candado" aria-hidden="true">${ICONS.candado}</span>` : ''}
    </span>
    ${label}
  </button>`;

/* =======================================================================
   RENDER PRINCIPAL + BINDINGS
   ======================================================================= */
function render(){
  document.documentElement.setAttribute('data-tema', state.tema);
  // Ver capturarFormularioPlan: cualquier render (incluida actividad de fondo sin relación con
  // lo que la persona está llenando) reconstruye toda la pantalla desde cero, así que hay que
  // guardar el formulario "Agregar a la planificación" antes y devolverlo después.
  const snapshotPlan = state.view==='plan' ? capturarFormularioPlan() : null;
  const root = document.getElementById('app');
  root.innerHTML = (state.debeCrearPassword ? renderCrearPassword() : (state.session && state.empresaBloqueada) ? renderCuentaBloqueada() : state.session ? renderShell() : state.registroPlan ? renderRegistroAutoservicio() : renderLogin()) + renderFotoModal() + renderOfflineModal() + renderExportarModal() + renderEscanerModal();
  bind();
  restaurarFormularioPlan(snapshotPlan);
}

function renderCuentaBloqueada(){
  const {motivo, nombre, planNombre} = state.empresaBloqueada;
  const mensaje = motivo === 'morosa'
    ? 'Hubo un problema con el último cobro de tu suscripción y no se pudo regularizar automáticamente.'
    : motivo === 'pendiente_tarjeta'
    ? 'Creaste tu cuenta pero todavía no registraste un método de pago, así que no tienes acceso todavía.'
    : motivo === 'vencida'
    ? 'Tu suscripción fue cancelada y ya terminó el período que estaba pagado.'
    : 'Esta cuenta fue pausada.';
  const accionHtml = (motivo === 'pendiente_tarjeta' || motivo === 'vencida')
    ? `<button type="button" id="btn-registrar-tarjeta-bloqueada" class="btn btn-primary" style="margin-bottom:10px" ${state.iniciandoSuscripcionFlow?'disabled':''}>${state.iniciandoSuscripcionFlow?'Redirigiendo…':(motivo==='vencida'?'Suscribirme de nuevo':'Registrar método de pago')}</button><br>`
    : '';
  return `
    <div class="login-wrap">
      <div class="login-card">
        <div class="brand-badge" style="margin:0 auto 16px">IA</div>
        <h1 style="text-align:center">${esc(nombre)}</h1>
        <p class="hint" style="text-align:center;margin-bottom:20px">${mensaje} ${(motivo==='pendiente_tarjeta'||motivo==='vencida')?'':'Escríbenos a <a href="mailto:contacto@inventiapp.cl">contacto@inventiapp.cl</a> para reactivarla.'}</p>
        ${accionHtml}
        <button type="button" id="btn-salir-bloqueada" class="btn btn-secondary">Salir</button>
      </div>

}

function bind(){
  if(!(state.view==='conteo' && !state.skuSeleccionado)) conteoBuscadorFueEnfocado = false;
  if(state.fotoModal){
    document.getElementById('foto-modal-close').addEventListener('click', ()=> setState({fotoModal:null}));
    document.getElementById('foto-modal-backdrop').addEventListener('click', e=>{
      if(e.target.id === 'foto-modal-backdrop') setState({fotoModal:null});
    });
    const btnPrevFoto = document.getElementById('foto-modal-prev');
    const btnNextFoto = document.getElementById('foto-modal-next');
    if(btnPrevFoto) btnPrevFoto.addEventListener('click', ()=>{
      const {urls, index} = state.fotoModal;
      setState({fotoModal:{urls, index:(index-1+urls.length)%urls.length}});
    });
    if(btnNextFoto) btnNextFoto.addEventListener('click', ()=>{
      const {urls, index} = state.fotoModal;
      setState({fotoModal:{urls, index:(index+1)%urls.length}});
    });
  }
  if(state.offlineModal){
    document.getElementById('offline-modal-close').addEventListener('click', ()=> setState({offlineModal:false}));
    document.getElementById('offline-modal-backdrop').addEventListener('click', e=>{
      if(e.target.id === 'offline-modal-backdrop') setState({offlineModal:false});
    });
    document.querySelectorAll('[data-reintentar-offline]').forEach(btn=>{
      btn.addEventListener('click', ()=> reintentarAccionOffline(btn.dataset.reintentarOffline));
    });
    document.querySelectorAll('[data-descartar-offline]').forEach(btn=>{
      btn.addEventListener('click', ()=> descartarAccionOffline(btn.dataset.descartarOffline));
    });
  }
  if(state.exportarModal){
    document.getElementById('exportar-modal-close').addEventListener('click', ()=> setState({exportarModal:false}));
    document.getElementById('exportar-modal-backdrop').addEventListener('click', e=>{
      if(e.target.id === 'exportar-modal-backdrop') setState({exportarModal:false});
    });
    document.getElementById('form-exportar-conteos').addEventListener('submit', e=>{
      e.preventDefault();
      setState({exportConteos:{
        ...state.exportConteos,
        desde: document.getElementById('ex-desde').value,
        hasta: document.getElementById('ex-hasta').value,
      }});
      exportarConteosExcel();
    });
  }
  if(state.escanerModal){
    document.getElementById('escaner-modal-close').addEventListener('click', cerrarEscaner);
    document.getElementById('escaner-modal-backdrop').addEventListener('click', e=>{
      if(e.target.id === 'escaner-modal-backdrop') cerrarEscaner();
    });
    if(state.escanerModal.opciones){
      document.querySelectorAll('[data-escaner-elegir-btn]').forEach(btn=>{
        btn.addEventListener('click', ()=> elegirSkuEscaneado(btn.dataset.escanerElegirBtn));
      });
    }else if(!state.escanerModal.codigo){
      if(!state.escanerModal.error) iniciarEscaner();
    }else{
      const buscar = document.getElementById('escaner-buscar');
      buscar.addEventListener('input', e=> setState({escanerModal: {...state.escanerModal, buscarAsociar: e.target.value}}));
      buscar.focus(); buscar.selectionStart = buscar.selectionEnd = buscar.value.length;
      document.querySelectorAll('[data-asociar-btn]').forEach(btn=>{
        btn.addEventListener('click', ()=> asociarCodigoBarras(btn.dataset.asociarBtn, state.escanerModal.codigo));
      });
    }
  }
  if(state.debeCrearPassword){
    document.getElementById('crear-password-form').addEventListener('submit', e=>{
      e.preventDefault();
      establecerPassword(document.getElementById('f-nueva-pass').value);
    });
    return;
  }
  if(state.session && state.empresaBloqueada){
    document.getElementById('btn-salir-bloqueada').addEventListener('click', handleLogout);
    const btnRegistrarTarjeta = document.getElementById('btn-registrar-tarjeta-bloqueada');
    if(btnRegistrarTarjeta) btnRegistrarTarjeta.addEventListener('click', ()=> iniciarSuscripcionFlow(state.empresaBloqueada.planNombre));
    return;
  }
  if(!state.session && state.registroPlan){
    document.getElementById('registro-autoservicio-form').addEventListener('submit', e=>{
      e.preventDefault();
      const nombreEmpresa = document.getElementById('ra-empresa').value.trim();
      const nombreAdmin = document.getElementById('ra-nombre').value.trim();
      const email = document.getElementById('ra-email').value.trim();
      const pass = document.getElementById('ra-pass').value;
      crearCuentaAutoservicio(nombreEmpresa, nombreAdmin, email, pass);
    });
    document.getElementById('btn-ya-tengo-cuenta').addEventListener('click', ()=> setState({registroPlan:null}));
    return;
  }
  if(!state.session){
    if(state.authRecuperar){
      document.getElementById('recuperar-password-form').addEventListener('submit', e=>{
        e.preventDefault();
        solicitarRecuperacion(document.getElementById('f-recuperar-email').value.trim());
      });
      document.getElementById('btn-volver-login').addEventListener('click', ()=> setState({authRecuperar:false}));
      return;
    }
    const form = document.getElementById('auth-form');
    form.addEventListener('submit', e=>{
      e.preventDefault();
      const email = document.getElementById('f-email').value.trim();
      const pass = document.getElementById('f-pass').value;
      handleLogin(email, pass);
    });
    document.getElementById('btn-olvide-pass').addEventListener('click', ()=> setState({authRecuperar:true}));
    return;
  }

  document.getElementById('btn-logout').addEventListener('click', ()=>{ detenerEscaner(); handleLogout(); });
  document.getElementById('btn-config').addEventListener('click', ()=>{ detenerEscaner(); setState({view:'config'}); });
  document.getElementById('btn-ir-buscar').addEventListener('click', ()=>{ detenerEscaner(); setState({view:'buscar'}); });
  document.getElementById('btn-exportar-conteos-modal').addEventListener('click', ()=> setState({exportarModal:true}));
  const btnSincronizarOffline = document.getElementById('btn-sincronizar-offline');
  if(btnSincronizarOffline) btnSincronizarOffline.addEventListener('click', sincronizarColaOffline);
  const btnVerOffline = document.getElementById('btn-ver-offline');
  if(btnVerOffline) btnVerOffline.addEventListener('click', ()=> setState({offlineModal:true}));
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.bloqueada){ toast('Esta sección es solo para administradores', 'err'); return; }
      detenerEscaner();
      const patch = {view: btn.dataset.tab};
      // "Plan del día" queda en state.contarPlan una vez cargado y no se vuelve a pedir solo
      // por re-renderizar (ver el chequeo de "cargado" más abajo, necesario para evitar una
      // recursión infinita) — pero puede haber cambiado desde la última carga (planificación
      // editada desde otra pestaña, otro día, otra persona). Al volver a seleccionar la
      // pestaña Contar se fuerza a pedirla de nuevo, para no mostrar un plan desactualizado.
      if(btn.dataset.tab==='conteo') patch.contarPlan = {...state.contarPlan, cargado:false};
      setState(patch);
    });
  });

  if(state.view==='config'){
    document.querySelectorAll('[data-tema-opcion]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const tema = el.dataset.temaOpcion;

        setState({tema});

    if(!state.equipo.cargado) cargarEquipo();

    if(formEmpresaNombre) formEmpresaNombre.addEventListener('submit', e=>{

    });
    document.querySelectorAll('[data-suscribir-flow]').forEach(btn=>{

    });
    document.querySelectorAll('[data-cambiar-plan]').forEach(btn=>{
      btn.addEventListener('click', ()=> cambiarPlanFlow(btn.dataset.cambiarPlan));
    });
    const btnCancelarSuscripcion = document.getElementById('btn-cancelar-suscripcion-flow');
    if(btnCancelarSuscripcion) btnCancelarSuscripcion.addEventListener('click', cancelarSuscripcionFlow);
    const formInvitarEquipo = document.getElementById('form-invitar-equipo');
    if(formInvitarEquipo) formInvitarEquipo.addEventListener('submit', e=>{
      e.preventDefault();
      const nombre = document.getElementById('equipo-nombre').value.trim();
      const email = document.getElementById('equipo-email').value.trim();
      const rol = document.getElementById('equipo-rol').value;
      invitarPersona({email, nombre, empresaId: state.perfil.empresa_id, rol}).then(ok=>{ if(ok){ e.target.reset(); cargarEquipo(); } });
    });
    if(state.perfil && state.perfil.rol==='admin' && !state.perfil.es_super_admin){
      if(!state.equipo.cargado) cargarEquipo();
      document.querySelectorAll('[data-guardar-persona-equipo]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.guardarPersonaEquipo;
          const input = document.querySelector(`.mi-equipo-nombre[data-persona-id="${id}"]`);
          actualizarPersonaEquipo(id, {nombre: input.value.trim()});
        });
      });
      document.querySelectorAll('[data-toggle-persona-equipo]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.togglePersonaEquipo;
          const activo = btn.dataset.activo === '1';
          if(activo && !confirm('¿Desactivar el acceso de esta persona?')) return;
          actualizarPersonaEquipo(id, {activo: !activo});
        });
      });
    }
    // "Ciclos de conteo" lo ve cualquier esAdmin (incluye super-admin que administra su propia
    // empresa, ver #125) — a diferencia del bloque de arriba (invitar/editar equipo), que sigue
    // siendo exclusivo del admin normal. Por eso estos bindings van fuera de ese if.

      input.value = '';
    });
    document.querySelectorAll('[data-marcar-ciclo-actual]').forEach(btn=>{
      btn.addEventListener('click', ()=> marcarCicloActual(btn.dataset.marcarCicloActual));
    });
    const selectAuditoriaTabla = document.getElementById('auditoria-filtro-tabla');
    if(selectAuditoriaTabla){
      if(!state.auditoria.cargado){ state.auditoria.cargado = true; cargarAuditoria(''); }
      selectAuditoriaTabla.addEventListener('change', ()=> cargarAuditoria(selectAuditoriaTabla.value));
    }
    const btnCargarMasAuditoria = document.getElementById('btn-cargar-mas-auditoria');
    if(btnCargarMasAuditoria) btnCargarMasAuditoria.addEventListener('click', cargarMasAuditoria);
    if(state.perfil && state.perfil.es_super_admin){
      if(!state.superadmin.cargado){ state.superadmin.cargado = true; cargarEmpresasSuperAdmin(); cargarResumenSuperAdmin(); cargarLeadsSuperAdmin(); cargarPlanesSuperAdmin(); }
      document.getElementById('form-crear-empresa-sa').addEventListener('submit', e=>{

    const btnDashDiarioPrev = document.getElementById('dash-diario-prev');
    const btnDashDiarioNext = document.getElementById('dash-diario-next');
    if(btnDashDiarioPrev) btnDashDiarioPrev.addEventListener('click', ()=> setState({dashDiarioPagina: Math.max(0, (state.dashDiarioPagina||0)-1)}));

      // Cuando no hay storage bin cargado, #p-bin lista SKU en vez de bins (ver cargarBinsPara):

        ubicacion: document.getElementById('p-ubic').value.trim(),
        storageBins,
        skusExcluidos,
        soloSinUbicacion,
        // Sin selector propio (se sacó por duplicar el filtro "Período" de arriba de la
        // página): siempre queda en automático, el trigger del servidor la asigna al ciclo
        // marcado como actual.
        cicloId: '',
        responsableId: document.getElementById('p-responsable').value,
        nota: document.getElementById('p-nota').value.trim(),
      });
      await refrescarCascadaTrasAgregar();
    });
    function resetPBin(){
      const selBin = document.getElementById('p-bin');
      const chkTodos = document.getElementById('p-bin-todos');
      const resumenBin = document.getElementById('p-bin-resumen');
      selBin.innerHTML = '<option value="">Elige ubicación específica primero</option>';
      selBin.disabled = true;
      selBin.dataset.modo = 'bins';
      delete selBin.dataset.opciones;
      delete selBin.dataset.totalSkuModoSkus;
      chkTodos.checked = false;
      chkTodos.disabled = true;
      resumenBin.textContent = '';
    }
    // Recalcula el resumen "(X bin / Y SKU)" (o su equivalente en modo SKU puntuales) según lo
    // que esté REALMENTE seleccionado en #p-bin en este momento, no solo el total cargado — a
    // pedido: antes el resumen se calculaba una sola vez al cargar la lista y no se movía aunque
    // la persona desmarcara bins puntuales a mano. Sin selección (o con todo marcado) se sigue
    // mostrando el total, que es lo que de verdad va a cubrir la entrada (ver "sin selección =
    // todos" en el submit de #form-plan).
    function actualizarResumenBin(){
      const selBin = document.getElementById('p-bin');
      const resumenBin = document.getElementById('p-bin-resumen');
      if(!selBin || !resumenBin) return;
      const seleccionados = [...(selBin.selectedOptions||[])].map(o=>o.value).filter(Boolean);
      if(selBin.dataset.modo==='skus'){
        const total = Number(selBin.dataset.totalSkuModoSkus||0);
        if(!total){ resumenBin.textContent = ''; return; }
        const esTodos = seleccionados.length===0 || seleccionados.length>=total;
        resumenBin.textContent = esTodos ? `(${total} SKU)` : `(${seleccionados.length} de ${total} SKU seleccionados)`;
        return;
      }
      let opciones = [];
      try{ opciones = JSON.parse(selBin.dataset.opciones || '[]'); }catch(e){ opciones = []; }
      if(!opciones.length){ resumenBin.textContent = ''; return; }
      const esTodos = seleccionados.length===0 || seleccionados.length>=opciones.length;
      const base = esTodos ? opciones : opciones.filter(o=>seleccionados.includes(o.storage_bin));
      const totalSkus = base.reduce((s,o)=> s+(Number(o.cantidad_skus)||0), 0);
      resumenBin.textContent = esTodos
        ? `(${opciones.length} bin / ${totalSkus} SKU)`
        : `(${seleccionados.length} de ${opciones.length} bin / ${totalSkus} SKU)`;
    }
    // Por arriba de esta cantidad de SKU sin bin, no tiene sentido listarlos uno a uno en el
    // <select> (se vuelve lento e inmanejable) — se deja solo el mensaje de "agregar igual".
    const MAX_SKU_SIN_BIN_LISTABLES = 300;
    // Compartida entre el cambio de bodega (que deja "Todas" elegido por defecto en Ubicación
    // específica sin que la persona toque nada) y el cambio de ubicación específica en sí.
    async function cargarBinsPara(bodega, ubicacion){
      if(!bodega){ resetPBin(); return; }
      const selBinInicial = document.getElementById('p-bin');
      const chkTodosInicial = document.getElementById('p-bin-todos');
      const resumenBinInicial = document.getElementById('p-bin-resumen');
      if(!selBinInicial || !chkTodosInicial || !resumenBinInicial) return; // no estamos mostrando el formulario "Agregar"
      // "Todas" (ubicacion vacío) también debe mostrar los storage bin — de toda la bodega,
      // no solo de una ubicación específica — igual que ya pasa al elegir una en particular.
      selBinInicial.innerHTML = '<option value="">Cargando…</option>';
      selBinInicial.disabled = true;
      selBinInicial.dataset.modo = 'bins';
      chkTodosInicial.checked = false;
      chkTodosInicial.disabled = true;
      resumenBinInicial.textContent = '';
      const opciones = await opcionesBins(bodega, ubicacion);
      // Los elementos se buscan de nuevo ACÁ, después del await (y otra vez más abajo, tras el
      // segundo await): un render() de fondo puede haber reemplazado el formulario mientras
      // esperábamos la respuesta — mismo motivo que en cargarOpcionesEspecificasEnSelect. Escribir
      // sobre la referencia vieja quedaba en un nodo ya desprendido del DOM, invisible en pantalla:
      // bug real reportado, Storage bin se quedaba pegado en "Cargando…" (o con los datos de la
      // ubicación anterior) hasta que la persona volvía a tocar el selector a mano.
      let selBin = document.getElementById('p-bin');
      let chkTodos = document.getElementById('p-bin-todos');
      let hintBin = document.getElementById('p-bin-hint');
      let resumenBin = document.getElementById('p-bin-resumen');
      if(!selBin || !chkTodos || !hintBin || !resumenBin) return; // la vista cambió mientras esperábamos
      if(opciones.length){
        selBin.innerHTML = opciones.map(o=>`<option value="${esc(o.storage_bin)}">${esc(o.storage_bin)} — ${o.cantidad_skus} SKU</option>`).join('');
        // Foto bin -> cantidad_skus que actualizarResumenBin() usa para recalcular el resumen
        // cada vez que cambie la selección (no solo al cargar), sin tener que volver a pedirla.
        selBin.dataset.opciones = JSON.stringify(opciones.map(o=>({storage_bin:o.storage_bin, cantidad_skus:Number(o.cantidad_skus)||0})));
        delete selBin.dataset.totalSkuModoSkus;
        // A pedido: la lista carga con TODOS los storage bin ya marcados (visualmente explícito),
        // en vez de dejarla sin nada seleccionado confiando en la regla "sin selección = todos"
        // (que ya causó confusión — ver actualizarResumenBin). Se marca también "Seleccionar
        // todos" para que el submit siga mandando el comodín sin filtro (ver el comentario del
        // submit de #form-plan), no la lista exhaustiva de bins de este momento.
        if(selBin.options) [...selBin.options].forEach(o=>{ o.selected = true; });
        chkTodos.checked = true;
        hintBin.textContent = 'Vienen todos los storage bin marcados. Puedes dejarlos así o desmarcar los que no quieras incluir.';
        // Aclara que "12 elementos" (resumen nativo del navegador para el <select multiple>) son
        // storage bin, no SKU — bug real reportado: se entendía como 12 SKU y no cuadraba con el
        // total real, que suma los SKU de todos esos bins juntos (normalmente más que uno por bin).
        // Se recalcula en vivo con cada cambio de selección (ver el listener 'change' de #p-bin).
        actualizarResumenBin();
        selBin.disabled = false;
        chkTodos.disabled = false;
      }else{
        // Estos SKU no tienen storage bin cargado (ej. carga masiva sin esa columna): en vez de
        // dejar la caja vacía sin explicación, se listan los SKU de la ubicación para poder
        // elegir puntualmente cuáles incluir (misma mecánica de "sin selección = todos", pero
        // sobre SKU en vez de bins — ver el submit de #form-plan y crearPlanEntrada).
        const bodegaReal = bodega===BODEGA_VACIA ? '' : bodega;
        // La lista que se ofrece para elegir excluye los SKU que ya quedaron cubiertos por OTRA
        // entrada de plan (buena UX: no tiene sentido volver a ofrecerlos). Pero el submit calcula
        // "seleccionados = todos MENOS los elegidos" (ver el submit de #form-plan): si esa base
        // fuera la misma lista angosta, un SKU ya cubierto por otra entrada (invisible acá, así
        // que nunca queda "elegido") tampoco quedaría en la exclusión — y se colaría de nuevo en
        // el conteo de ESTA entrada (que sí usa el universo completo, sin ese filtro: ver el
        // comentario en contarUniversoUbicacion). Por eso se guarda acá la lista COMPLETA (sin
        // excluirYaPlanificados) como base real para calcular exclusiones, aunque el <select>
        // solo muestre/permita elegir de la lista angosta.
        const [skus, skusUniversoCompleto] = await Promise.all([
          skusDeUbicacion({bodega:bodegaReal, ubicacion, storage_bin:'', excluidos:[], soloSinUbicacion:false, excluirYaPlanificados:true}),
          skusDeUbicacion({bodega:bodegaReal, ubicacion, storage_bin:'', excluidos:[], soloSinUbicacion:false}),
        ]);
        // Elementos frescos otra vez, tras este segundo await.
        selBin = document.getElementById('p-bin');
        chkTodos = document.getElementById('p-bin-todos');
        hintBin = document.getElementById('p-bin-hint');
        resumenBin = document.getElementById('p-bin-resumen');
        if(!selBin || !chkTodos || !hintBin || !resumenBin) return; // la vista cambió mientras esperábamos
        if(skus.length && skus.length<=MAX_SKU_SIN_BIN_LISTABLES){
          selBin.dataset.modo = 'skus';
          selBin.dataset.skuCodes = JSON.stringify(skusUniversoCompleto.map(s=>s.sku_code));
          selBin.dataset.totalSkuModoSkus = String(skus.length);
          delete selBin.dataset.opciones;
          selBin.innerHTML = skus.map(s=>`<option value="${esc(s.sku_code)}">${esc(s.sku_code)} — ${esc(s.descripcion||'')}</option>`).join('');
          // Misma lógica que la lista de storage bin: carga con todos los SKU ya marcados.
          if(selBin.options) [...selBin.options].forEach(o=>{ o.selected = true; });
          chkTodos.checked = true;
          hintBin.textContent = 'No hay storage bin cargado para esta ubicación: puedes elegir SKU puntuales. Vienen todos marcados; desmarca los que no quieras incluir.';
          actualizarResumenBin();
        }else{
          selBin.innerHTML = '';
          delete selBin.dataset.opciones;
          delete selBin.dataset.totalSkuModoSkus;
          resumenBin.textContent = '';
          hintBin.textContent = 'No hay storage bin cargado para esta ubicación. Puedes agregar igual: la planificación cubrirá toda la ubicación elegida.';
        }
        selBin.disabled = false;
        chkTodos.disabled = false;
      }
    }
    // Recarga las opciones de Ubicación específica (con su conteo pendiente/total) para la
    // bodega dada. Devuelve el valor que quedó elegido, para poder encadenar cargarBinsPara con
    // ese mismo valor — compartida entre el cambio de bodega (que siempre vuelve a "Todas") y el
    // refresco tras agregar una entrada (que intenta conservar la ubicación ya elegida).
    async function cargarOpcionesEspecificasEnSelect(bodega, valorPreferido){
      const opciones = await opcionesEspecificas(bodega);
      // El <select> se busca ACÁ, después del await: un render() de fondo (p.ej. el que dispara
      // cargarPlanSemanal justo tras agregar una entrada) puede reemplazar el formulario mientras
      // esperábamos la respuesta. Buscarlo antes del await escribía sobre un nodo ya desprendido
      // del DOM (invisible en pantalla) — bug real reportado: las cantidades ("6/8", etc.) se
      // quedaban con el valor viejo hasta que la persona volvía a tocar el selector a mano.
      const selUbic = document.getElementById('p-ubic');
      if(!selUbic) return ''; // la vista cambió mientras esperábamos la respuesta
      const bodegaObj = state.plan.generales.find(g => bodega===BODEGA_VACIA ? g.bodega===null : g.bodega===bodega);
      selUbic.innerHTML = `<option value="">Todas${bodegaObj? ` (${bodegaObj.cantidad_pendiente}/${bodegaObj.cantidad_skus})` : ''}</option>` + opciones.map(o=>`<option value="${esc(o.ubicacion)}">${esc(o.ubicacion)} (${o.cantidad_pendiente}/${o.cantidad_skus})</option>`).join('');
      selUbic.disabled = false;
      selUbic.value = (valorPreferido && opciones.some(o=>o.ubicacion===valorPreferido)) ? valorPreferido : '';
      return selUbic.value;
    }
    document.getElementById('p-bodega').addEventListener('change', async e=>{
      const bodega = e.target.value;
      const selUbic = document.getElementById('p-ubic');
      resetPBin();
      if(bodega === BODEGA_SIN_UBICACION){
        selUbic.innerHTML = '<option value="">No aplica (SKU sin ubicación)</option>';
        selUbic.disabled = true;
        return;
      }
      if(!bodega){
        selUbic.innerHTML = '<option value="">Elige ubicación general primero</option>';
        selUbic.disabled = true;
        return;
      }
      selUbic.innerHTML = '<option value="">Cargando…</option>';
      selUbic.disabled = true;
      // "Todas" queda seleccionado por defecto (primera opción) sin que la persona tenga que
      // abrir el selector — pero fijar .innerHTML no dispara 'change', así que sin este llamado
      // Storage bin se quedaba pegado en "Elige ubicación específica primero" hasta que alguien
      // volviera a tocar Ubicación específica a mano (aunque fuera para elegir la misma "Todas").
      await cargarOpcionesEspecificasEnSelect(bodega, '');
      await cargarBinsPara(bodega, '');
    });
    document.getElementById('p-ubic').addEventListener('change', async e=>{
      const bodega = document.getElementById('p-bodega').value;
      await cargarBinsPara(bodega, e.target.value);
    });
    // Bug real reportado: al presionar "Agregar" (y lo mismo al quitar un SKU o borrar una
    // entrada/selección), los SKU afectados dejan de contar como pendientes, pero Ubicación
    // específica y Storage bin (que no salen de state, sino de estas cargas aparte) se quedaban
    // con los números de antes hasta que la persona volvía a tocarlos a mano. Se refrescan acá
    // mismo, conservando la bodega/ubicación elegidas (sin resetear a "Todas") para poder seguir
    // agregando entradas seguidas sin perder el lugar.
    async function refrescarCascadaTrasAgregar(){
      const bodegaEl = document.getElementById('p-bodega');
      const selUbic = document.getElementById('p-ubic');
      if(!bodegaEl || !selUbic) return;
      const bodega = bodegaEl.value;
      if(!bodega || bodega === BODEGA_SIN_UBICACION) return; // sin cascada que refrescar
      const ubicPrevia = selUbic.value;
      const ubicElegida = await cargarOpcionesEspecificasEnSelect(bodega, ubicPrevia);
      await cargarBinsPara(bodega, ubicElegida);
    }
    document.getElementById('p-bin-todos').addEventListener('change', e=>{
      const selBin = document.getElementById('p-bin');
      if(selBin.options) [...selBin.options].forEach(o=>{ o.selected = e.target.checked; });
      actualizarResumenBin();
    });
    // Bug reportado: si la persona marcaba "Seleccionar todos" y después elegía puntualmente uno
    // o varios storage bin a mano en la lista, el checkbox seguía marcado (nada lo desmarcaba) y
    // el submit mandaba "sin filtro" (todos) ignorando por completo la selección manual. Cualquier
    // cambio hecho a mano en la lista debe desmarcar "Seleccionar todos" para que el submit respete
    // la selección real.
    document.getElementById('p-bin').addEventListener('change', ()=>{
      document.getElementById('p-bin-todos').checked = false;
      // A pedido: el resumen "(X bin / Y SKU)" debe reflejar en vivo lo que la persona vaya
      // marcando/desmarcando a mano, no solo el total de cuando se cargó la lista.
      actualizarResumenBin();
    });
    document.querySelectorAll('[data-borrar-plan]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await confirmarYBorrarPlanEntrada(btn.dataset.borrarPlan);
        await refrescarCascadaTrasAgregar();
      });
    });
    document.querySelectorAll('.plan-select-check').forEach(chk=>{
      chk.addEventListener('change', ()=> alternarSeleccionPlan(chk.dataset.selectPlan));
    });
    const chkTodoPlan = document.getElementById('chk-seleccionar-todo-plan');
    if(chkTodoPlan) chkTodoPlan.addEventListener('change', alternarSeleccionTodoPlan);
    const btnBorrarSeleccion = document.getElementById('btn-borrar-seleccion-plan');
    if(btnBorrarSeleccion) btnBorrarSeleccion.addEventListener('click', async ()=>{
      await confirmarYBorrarSeleccionPlan();
      await refrescarCascadaTrasAgregar();
    });
    const btnCancelarSeleccion = document.getElementById('btn-cancelar-seleccion-plan');
    if(btnCancelarSeleccion) btnCancelarSeleccion.addEventListener('click', ()=> setState({plan:{...state.plan, seleccionados:[]}}));
    document.querySelectorAll('.plan-sku-quitar').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await excluirSkuDePlan(btn.dataset.planId, btn.dataset.skuCode);
        await refrescarCascadaTrasAgregar();
      });
    });
    document.querySelectorAll('[data-editar-plan]').forEach(btn=>{
      btn.addEventListener('click', ()=> setState({plan:{...state.plan, editando: btn.dataset.editarPlan}}));
    });
    document.querySelectorAll('[data-cancelar-plan]').forEach(btn=>{
      btn.addEventListener('click', ()=> setState({plan:{...state.plan, editando: null}}));
    });
    document.querySelectorAll('[data-guardar-plan]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.guardarPlan;
        actualizarPlanEntrada(id, {
          fecha: document.getElementById(`pe-fecha-${id}`).value,
          responsableId: document.getElementById(`pe-responsable-${id}`).value,
          nota: document.getElementById(`pe-nota-${id}`).value.trim(),
        });
      });
    });
  }
}

async function iniciarApp(){
  // Service Worker: cachea el app shell para que la app siga abriendo sin conexión.
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  }
  // Al recuperar la señal, intentamos enviar los conteos que quedaron guardados sin conexión.
  window.addEventListener('online', sincronizarColaOffline);
  procesarRetornoFlow();
  procesarRegistroPlanDesdeUrl();
  await procesarLlegadaPorInvitacion();
  if(!state.debeCrearPassword) await restaurarSesionGuardada();
  if(state.avisoFlow){
    const ok = state.avisoFlow === 'ok';
    state.avisoFlow = null;
    if(state.perfil) setState({view:'config'});
    toast(ok? 'Tarjeta registrada, tu plan quedó activo' : 'No se pudo completar la suscripción, intenta de nuevo', ok?'ok':'err');
  }
  render();
}
iniciarApp();
</script>
