<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script data-sentry-config>
  // Sentry solo debe avisar de errores de verdad. Estos dos mensajes los muestra la propia app
  // a propósito (sesión cerrada por "una sesión por usuario" y pérdida de señal en terreno) y
  // algún flujo los deja escapar como promesa rechazada; sin este filtro llegaban a Sentry y
  // abrían un issue en GitHub cada vez que alguien perdía señal o cambiaba de dispositivo.
  // El Loader Script llama a sentryOnLoad antes de inicializar y respeta estas opciones.
  window.sentryOnLoad = function(){
    Sentry.init({
      ignoreErrors: [
        'Tu sesión terminó',
        'No se pudo conectar. Revisa tu conexión'
      ]
    });
  };
</script>
<script
  src="https://js.sentry-cdn.com/3a8602b248fccf0a627d6af0f6e5161d.min.js"
  crossorigin="anonymous"
></script>

<style>
:root{
  --bg:#161a20;
  --surface:#1e242c;
  --surface-2:#252c36;
  --line:#333c48;
  --amber:#f0a030;
  --amber-dim:#8a6224;
  --steel:#5b8fb0;
  --ok:#4caf6d;
  --warn:#e0b23c;
  --danger:#e0554a;
  --text:#eef1f4;
  --text-dim:#a3adb8;
  --text-faint:#6b7684;
  --radius:10px;
}

/* ---------- temas visuales (Configuraciones) ---------- */
:root[data-tema="acero"]{
  --bg:#10151c; --surface:#19212b; --surface-2:#212a37; --line:#2d394a;
  --amber:#4d9fe0; --amber-dim:#2a5578; --steel:#7fc4f0;
  --ok:#4caf6d; --warn:#e0b23c; --danger:#e0554a;
  --text:#edf1f5; --text-dim:#a1adba; --text-faint:#66727f; --radius:10px;
}
:root[data-tema="verde"]{
  --bg:#121a15; --surface:#19241c; --surface-2:#212f25; --line:#2d3f33;
  --amber:#43c07c; --amber-dim:#276b46; --steel:#5b8fb0;
  --ok:#5cb85c; --warn:#e0b23c; --danger:#e0554a;
  --text:#edf3ef; --text-dim:#a0b0a6; --text-faint:#647468; --radius:12px;
}
:root[data-tema="claro"]{
  --bg:#f4f5f3; --surface:#ffffff; --surface-2:#eef0ed; --line:#dde0db;
  --amber:#c9720f; --amber-dim:#f0d4ae; --steel:#3d6d8a;
  --ok:#2f8f52; --warn:#a8720a; --danger:#c23b2f;
  --text:#181b1a; --text-dim:#4c5450; --text-faint:#7c8480; --radius:14px;
}
:root[data-tema="alto_contraste"]{
  --bg:#000000; --surface:#0c0c0c; --surface-2:#181818; --line:#3a3a3a;
  --amber:#ffd400; --amber-dim:#8a7400; --steel:#29b6f6;
  --ok:#00e676; --warn:#ffd400; --danger:#ff5252;
  --text:#ffffff; --text-dim:#d4d4d4; --text-faint:#8f8f8f; --radius:4px;
}
/* el toast de error/ok/aviso usa colores pastel fijos pensados para fondo oscuro; en el tema claro necesitan su propio contraste */
:root[data-tema="claro"] .toast.err{border-color:#e3b3ae;color:#8a2b20;background:#fdf1f0;}
:root[data-tema="claro"] .toast.ok{border-color:#b7dcc3;color:#1f6b3d;background:#eef8f1;}
:root[data-tema="claro"] .toast.warn{border-color:#e8d9a8;color:#8a6d1f;background:#fdf8ec;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .2s ease,color .2s ease;}
body{min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3,.display{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- barcode tick divider (signature element) ---------- */
.ticks{height:14px;display:flex;align-items:flex-end;gap:2px;overflow:hidden;opacity:0.55;}
.ticks span{display:block;width:2px;background:var(--amber);}
.ticks span:nth-child(3n){height:14px;} .ticks span:nth-child(3n+1){height:8px;} .ticks span:nth-child(3n+2){height:11px;}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 0;}
.topbar-row{display:flex;flex-wrap:wrap;row-gap:8px;align-items:center;padding-bottom:10px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-badge{width:34px;height:34px;border-radius:8px;background:linear-gradient(155deg,var(--amber),#c97a1c);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:13px;letter-spacing:-0.03em;color:#1a1204;flex-shrink:0;}
.brand-text h1{font-size:18px;margin:0;line-height:1.1;}
.brand-text span{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em;}
/* margin-left:auto en vez de justify-content:space-between en .topbar-row: así, cuando los
   íconos no caben junto al título en la misma línea, este chip baja a su propia línea (ver
   flex-wrap arriba) y igual queda pegado a la derecha, en vez de irse al extremo izquierdo. */
.user-chip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);margin-left:auto;}
.user-chip button{background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:6px;padding:5px 9px;font-size:11px;}
.user-chip button:active{background:var(--surface-2);}
/* Con el nombre + rol de la cuenta y 6-7 íconos, el chip ya no cabía en una fila en un celular
   angosto (~390px) y el texto se partía en varias líneas empujando los íconos -- se veía roto
   incluso antes de agregar el ícono de Calendario. El nombre completo ya se puede ver en
   Configuraciones, así que en pantallas angostas se oculta acá y solo quedan los íconos. Si aun
   así los íconos no caben junto al título (ver flex-wrap en .topbar-row), el chip entero baja a
   su propia línea en vez de desbordar la pantalla y esconder los últimos íconos sin aviso.
   Bug real reportado por Joel: no veía el ícono de Grupos de conteo en el celular -- el ancho
   total de los íconos (~444px) ya superaba el de casi cualquier celular (320-414px) y, al no
   haber wrap, los que no entraban quedaban fuera de la pantalla sin scroll horizontal visible. */
@media (max-width:420px){
  .user-chip>span{display:none;}
}

/* ---------- layout ---------- */
main{flex:1;max-width:720px;width:100%;margin:0 auto;padding:18px 16px 96px;}
/* Vistas admin/súper-admin (Dashboard, Planificación, Carga masiva, Períodos, Configuraciones):
   más contenido tabular y gráficos pensados para pantalla grande -- se ensanchan aparte, sin
   tocar Contar/Reconteo/Buscar, que siguen angostas a propósito para el celular en terreno. */
main.ancho{max-width:1180px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px;}
.section-head:first-child{margin-top:0;}
.section-head h2{font-size:22px;margin:0;}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--amber);font-weight:600;margin-bottom:2px;display:block;}

/* Ícono "i" junto al título de un panel del Dashboard: qué considera exactamente ese dato
   (ver tituloConInfo/campoConInfo). <details> nativo, así que se abre/cierra igual con un tap
   en el celular que con clic en el computador. */
.info-dato{display:inline-block;position:relative;vertical-align:middle;margin-left:4px;}
.info-dato summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--text-faint);line-height:0;}
.info-dato summary::-webkit-details-marker{display:none;}
.info-dato summary svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.info-dato[open]>summary{color:var(--amber);}
.info-dato-texto{position:absolute;z-index:5;top:100%;left:0;margin-top:4px;width:230px;max-width:70vw;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;box-shadow:0 4px 14px rgba(0,0,0,.35);
  font-size:11.5px;line-height:1.4;font-weight:400;text-transform:none;letter-spacing:normal;color:var(--text-dim);}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card + .card{margin-top:10px;}

/* bin-tag card: torn top edge motif for KPI cards */
.tag-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);padding:14px 14px 12px;overflow:hidden;}
.tag-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(-55deg,var(--amber) 0 6px,transparent 6px 12px);opacity:0.85;}
.tag-card .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-faint);margin-bottom:6px;}
.tag-card .kpi-value{font-family:'Barlow Condensed';font-weight:800;font-size:30px;line-height:1;}
.tag-card .kpi-sub{font-size:12px;color:var(--text-dim);margin-top:4px;}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* Calendario mensual (ver renderCalendario): grilla de 7 columnas (lunes a domingo, igual que
   inicioSemana en Planificación), celdas angostas a propósito para caber en un celular -- el
   detalle completo del día elegido va aparte, debajo de la grilla (.cal-detalle). */
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.cal-nav h3{font-size:17px;margin:0;text-transform:capitalize;font-family:'Barlow Condensed';font-weight:700;letter-spacing:.01em;}
button.cal-nav-btn{width:auto;padding:8px 12px;flex:none;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-dow{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);text-align:center;padding-bottom:4px;font-weight:600;}
.cal-dia{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 3px 6px;min-height:58px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;}
.cal-dia:disabled{opacity:0;pointer-events:none;}
.cal-dia.es-hoy{border-color:var(--amber);}
.cal-dia.seleccionado{background:var(--amber);}
.cal-dia.seleccionado .cal-dia-num,.cal-dia.seleccionado .cal-dia-fila{color:#1a1204;}
.cal-dia-num{font-size:12px;font-weight:700;color:var(--text-dim);}
.cal-dia-fila{font-size:9.5px;line-height:1.35;font-family:'IBM Plex Mono';font-variant-numeric:tabular-nums;}
.cal-dia-fila.c-plan{color:var(--text-faint);}
.cal-dia-fila.c-contado{color:var(--ok);}
.cal-dia-fila.c-recontado{color:var(--steel);}
.cal-detalle-fila{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);}
.cal-detalle-fila:last-child{border-bottom:none;}
.cal-detalle-num{font-family:'Barlow Condensed';font-weight:800;font-size:22px;}

.segmented{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;margin-bottom:16px;gap:2px;}
.segmented-btn{flex:1;border:none;background:none;padding:9px 4px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-dim);}
.segmented-btn.active{background:var(--amber);color:#1a1204;}

.progress-track{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--amber-dim),var(--amber));border-radius:5px;transition:width .4s ease;}
/* Barra indeterminada (no hay un % real que mostrar, ej. guardar conteo con señal mala) --
   a diferencia de .progress-fill, no lleva width dinámico: una franja se desliza sin parar
   dentro de .progress-track para transmitir "sigue trabajando", no un avance medible. */
.progress-indeterminada{height:100%;width:35%;background:linear-gradient(90deg,var(--amber-dim),var(--amber));border-radius:5px;animation:avance-indeterminado 1.1s ease-in-out infinite;}
@keyframes avance-indeterminado{0%{margin-left:-35%;}100%{margin-left:100%;}}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--text-faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;padding:6px 8px;border-bottom:1px solid var(--line);}
td{padding:8px;border-bottom:1px solid var(--line);color:var(--text-dim);}
tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono';}
.table-wrap{overflow-x:auto;}

label{display:block;font-size:12px;color:var(--text-dim);margin:12px 0 5px;font-weight:500;}
label:first-child{margin-top:0;}
input[type=text],input[type=number],input[type=password],input[type=email],input[type=date],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  padding:11px 12px;border-radius:8px;font-size:15px;outline:none;
}
/* Bug real reportado por Joel (captura en iPad/Safari): el campo Día de "Plan del día" en Contar
   se salía por el borde derecho de la tarjeta. Safari no respeta width:100%/box-sizing:border-box
   en input[type=date] igual que los demás campos -- calcula un ancho mínimo interno (para los
   segmentos día/mes/año + el ícono de calendario) que puede superar el ancho ya calculado del
   elemento y lo deja desbordar en vez de encogerlo. min-width:0 fuerza a que sí respete el ancho
   del contenedor como cualquier otro input. */
input[type=date]{min-width:0;}
input:focus,select:focus,textarea:focus{border-color:var(--amber);}
/* Bug real reportado por Joel ("cuesta hacer la selección" en Plan del día): Ubicación empieza
   disabled hasta elegir Bodega/patio, pero sin esta regla un <select disabled> se ve IDÉNTICO a
   uno habilitado (mismo fondo, mismo texto) — no había forma de notar con la vista que ese campo
   todavía no se puede tocar, así que se sentía que la selección "no respondía". */
input:disabled,select:disabled,textarea:disabled{opacity:0.5;cursor:not-allowed;}
textarea{resize:vertical;min-height:60px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
/* Bug real reportado por Joel (captura de "Exportar conteos" en el celular): un par de
   input[type=date] uno junto al otro en .row2 se salía de la tarjeta -- min-width:0 en el
   input (ver más abajo) evita que SE DESBORDE él solo, pero en un celular angosto sigue sin
   entrar completo A CADA LADO del "Desde"/"Hasta" (el control nativo de fecha de Safari no
   encoge tanto). Mismo patrón que ya usa "Contado desde/hasta" en el Dashboard (flex-wrap): en
   vez de pelear por el ancho exacto, apila los dos campos en pantallas de celular. */
@media (max-width:480px){
  .row2-fechas{grid-template-columns:1fr;}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;padding:12px 16px;font-size:14px;font-weight:600;width:100%;}
.btn-primary{background:var(--amber);color:#1a1204;}
.btn-primary:active{background:#d68e26;}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
.btn-secondary:active{background:#2c3441;}
.btn-danger{background:transparent;color:var(--danger);border:1px solid #5a2f2c;}
.btn:disabled{opacity:0.45;pointer-events:none;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{width:auto;flex:1;}

.file-input{border:1.5px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--text-dim);font-size:13px;position:relative;}
.file-input input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.file-preview{margin-top:10px;border-radius:8px;overflow:hidden;border:1px solid var(--line);max-height:220px;}
.file-preview img{width:100%;display:block;object-fit:cover;max-height:220px;}

.badge{display:inline-block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;padding:3px 8px;border-radius:5px;}
.badge-ok{background:rgba(76,175,109,.15);color:var(--ok);}
.badge-warn{background:rgba(224,178,60,.15);color:var(--warn);}
.badge-danger{background:rgba(224,85,74,.15);color:var(--danger);}
.badge-neutral{background:var(--surface-2);color:var(--text-dim);}
.badge-steel{background:rgba(91,143,176,.15);color:var(--steel);}

.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:8px;font-size:13.5px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:88%;text-align:center;}
.toast.err{border-color:#5a2f2c;color:#f3a6a0;}
.toast.ok{border-color:#2c5a3d;color:#a3e0b8;}
.toast.warn{border-color:#5a4a1f;color:#e8c25f;}

.empty{text-align:center;padding:30px 10px;color:var(--text-faint);}
.empty .glyph{font-size:28px;margin-bottom:8px;opacity:0.6;}

#marca-agua{position:fixed;right:10px;bottom:62px;z-index:15;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.04em;color:var(--text-faint);opacity:0.6;pointer-events:none;user-select:none;}

/* ---------- bottom nav ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom);}
/* min-width:0 -- sin esto, un flex item nunca se achica más allá del ancho de su contenido
   (acá, la etiqueta sin partir: "DASHBOARD"/"RECONTEO"), así que con 7 tabs ya no entraban en
   casi ningún celular y los últimos (Contar, Reconteo) quedaban fuera de pantalla sin aviso --
   mismo tipo de bug que el de los íconos de arriba, ver .topbar-row. Con min-width:0 la etiqueta
   puede partirse en dos líneas cuando el tab se achica de verdad. */
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 2px 8px;background:none;border:none;color:var(--text-faint);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.02em;text-align:center;overflow-wrap:anywhere;}
.tab.active{color:var(--amber);}
.tab-icon-wrap{position:relative;display:flex;}
.tab-icon-wrap>svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}
.tab-bloqueada{opacity:0.55;}
.tab-candado{position:absolute;top:-4px;right:-6px;display:flex;align-items:center;justify-content:center;width:13px;height:13px;background:var(--surface);border-radius:50%;}
.tab-candado svg{width:11px;height:11px;stroke:var(--text-faint);fill:none;stroke-width:2.2;}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px 26px;position:relative;overflow:hidden;}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(-55deg,var(--amber) 0 6px,transparent 6px 12px);}
.login-logo{width:52px;height:52px;border-radius:12px;background:linear-gradient(155deg,var(--amber),#c97a1c);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:19px;letter-spacing:-0.03em;color:#1a1204;margin:6px auto 14px;}
.login-title{text-align:center;font-size:22px;margin:0 0 4px;}
.login-sub{text-align:center;font-size:12.5px;color:var(--text-faint);margin-bottom:22px;}
.login-toggle{display:flex;font-size:12.5px;color:var(--text-dim);justify-content:center;margin-top:16px;gap:5px;}
.login-toggle button{background:none;border:none;color:var(--amber);font-weight:600;padding:0;}
.login-toggle a{color:var(--amber);font-weight:600;text-decoration:none;}

.spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,.25);border-top-color:#1a1204;border-radius:50%;animation:spin .7s linear infinite;}
.spinner.light{border:2px solid var(--line);border-top-color:var(--amber);}
@keyframes spin{to{transform:rotate(360deg);}}

.hint{font-size:11.5px;color:var(--text-faint);margin-top:6px;line-height:1.5;}
.sku-pick{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--surface-2);}
.sku-pick div span{display:block;}
.sku-pick .code{font-family:'IBM Plex Mono';font-weight:600;font-size:13.5px;}
.sku-pick .desc{font-size:11.5px;color:var(--text-faint);margin-top:2px;}

.link-btn{background:none;border:none;padding:0;color:var(--amber);font:inherit;font-family:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer;}

.foto-modal-card{position:relative;max-width:92vw;max-height:86vh;}
.foto-modal-card img{max-width:92vw;max-height:86vh;display:block;border-radius:10px;border:1px solid var(--line);}
.foto-modal-close{position:absolute;top:-14px;right:-14px;width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;}
.foto-modal-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
.foto-modal-nav-prev{left:6px;}
.foto-modal-nav-next{right:6px;}
.foto-modal-contador{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--text-dim);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 10px;white-space:nowrap;}
.foto-modal-etiqueta{position:absolute;top:-14px;left:14px;font-size:11.5px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 10px;white-space:nowrap;}

.foto-preview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.foto-preview-item{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:var(--surface-2);}
.foto-preview-item img{width:100%;height:100%;object-fit:cover;display:block;}
.foto-preview-remove{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);border:none;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;}
.foto-preview-remove svg{width:11px;height:11px;}

.tema-opcion{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:10px;cursor:pointer;}
.tema-opcion.activo{border-color:var(--amber);}
.tema-swatches{display:flex;gap:3px;flex-shrink:0;}
.tema-swatches span{width:16px;height:16px;border-radius:4px;display:block;border:1px solid rgba(128,128,128,.35);}
.tema-info{flex:1;min-width:0;}
.tema-nombre{font-size:14px;font-weight:600;color:var(--text);}
.tema-desc{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.btn-icon-header{padding:6px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--text-dim);display:inline-flex;align-items:center;justify-content:center;}

.opcion-carga .nombre{font-size:13.5px;font-weight:600;color:var(--text);}
.opcion-carga .desc{font-size:11.5px;color:var(--text-faint);margin-top:2px;line-height:1.4;}

.plan-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.plan-item:last-child{border-bottom:none;}
.plan-item-ubic{font-size:13.5px;font-weight:600;color:var(--text);}
.sku-pick button[disabled]{opacity:.5;cursor:default;}
.sku-pick .badge{margin-right:8px;vertical-align:middle;}

.plan-sku-lista .icon-btn{padding:2px;flex:none;}

#print-plan{display:none;}
#print-buscar{display:none;}
@media print{
  /* Sin esto, el tamaño de página imprimible depende de los márgenes que cada impresora/diálogo
     de impresión traiga por defecto (variable) -- eso rompía el "3 por hoja" de Buscar: con
     márgenes más grandes que los usados al probarlo, 3 fichas no entraban y el navegador cortaba
     antes de llegar al salto explícito, dejando 1 o 2 por hoja. Fijando el tamaño acá, el área
     imprimible es siempre la misma sin importar la configuración de quien imprime.  */
  @page{size:A4;margin:12mm;}
  html,body{background:#fff;}
  /* La marca de agua con el nombre de quien usa la app es para la pantalla: salía impresa en
     los comprobantes, la hoja de conteo y los informes. */
  #app,#toast-root,#marca-agua{display:none;}
  #print-plan{display:block;padding:0;color:#000;background:#fff;}
  #print-plan h1{font-size:17px;margin:0 0 2px;}
  #print-plan .print-meta{font-size:11px;color:#333;margin-bottom:14px;}
  #print-plan h2{font-size:13px;text-transform:capitalize;margin:16px 0 6px;border-bottom:1px solid #000;padding-bottom:2px;page-break-after:avoid;}
  #print-plan h3{font-size:11.5px;margin:10px 0 1px;page-break-after:avoid;}
  #print-plan .print-entrada-meta{font-size:10px;color:#333;margin-bottom:4px;}
  #print-plan table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:6px;}
  #print-plan th,#print-plan td{border:1px solid #999;padding:3px 6px;text-align:left;}
  #print-plan th{background:#eee;}
  #print-plan td.print-blank{min-width:60px;}
  #print-plan .print-vacio{font-size:11px;color:#555;}

  /* Informe de ciclo: reusa los mismos componentes del dashboard (.card, .kpi-grid, etc.),
     así que solo hace falta reescalar las variables de color al esquema del tema "claro" —
     ya pensado para fondo blanco — en vez de duplicar cada regla de componente. */
  #print-informe{
    display:block; padding:0; background:#fff; color:#181b1a;
    --bg:#f4f5f3; --surface:#ffffff; --surface-2:#eef0ed; --line:#dde0db;
    --amber:#c9720f; --amber-dim:#f0d4ae; --steel:#3d6d8a;
    --ok:#2f8f52; --warn:#a8720a; --danger:#c23b2f;
    --text:#181b1a; --text-dim:#4c5450; --text-faint:#7c8480;
  }
  #print-informe h1{font-size:19px;margin:0 0 2px;}
  #print-informe .print-meta{font-size:11px;color:var(--text-dim);margin-bottom:16px;}
  #print-informe .segmented{display:none;}
  #print-informe .section-head,#print-informe .card,#print-informe .tag-card{page-break-inside:avoid;}

  #print-buscar{display:block;padding:0;color:#000;background:#fff;}
  #print-buscar h1{font-size:17px;margin:0 0 2px;}
  #print-buscar .print-meta{font-size:11px;color:#333;margin-bottom:14px;}
  .print-ficha{display:flex;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid #ccc;page-break-inside:avoid;min-height:78mm;box-sizing:border-box;}
  .print-ficha:first-of-type{border-top:1px solid #ccc;}
  .print-ficha-datos{flex:1;min-width:0;}
  .print-ficha-datos h2{font-size:16px;margin:0 0 8px;font-family:monospace;}
  .print-ficha-datos table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .print-ficha-datos th{text-align:left;color:#555;font-weight:normal;padding:3px 10px 3px 0;white-space:nowrap;vertical-align:top;}
  .print-ficha-datos td{padding:3px 0;}
  .print-ficha-foto{flex:none;width:190px;height:190px;}
  .print-ficha-foto img{width:100%;height:100%;object-fit:cover;border:1px solid #ccc;}
  .print-sin-foto{width:100%;height:100%;border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:10px;color:#999;text-align:center;}
  /* Fuerza exactamente 3 fichas por hoja -- más confiable que dejar que el navegador
     corte solo, que depende de los márgenes de cada impresora/config de impresión. */
  .pdf-salto-pagina{page-break-after:always;}
}

      Sentry.setTag('empresa_nombre', state.perfil.empresas ? state.perfil.empresas.nombre : null);

const CAMPOS_AUDITADOS = {
  usuarios: [['nombre','Nombre'], ['rol','Rol'], ['activo','Activo']],
  empresas: [['nombre','Nombre'], ['activo','Activo'], ['flow_subscription_status','Estado de suscripción']],

};

function formatearValorAuditoria(v){
  if(v===null || v===undefined || v==='') return '—';
  if(v===true) return 'sí';
  if(v===false) return 'no';
  return String(v);
}

// Una carga masiva de SKU (ver registrar_auditoria_skus_masivo, la función del trigger) deja UNA
// fila de auditoria por sentencia SQL en vez de una por cada SKU afectado -- con un resumen
// {_resumen:true, filas_afectadas:N} en datos_antes/datos_despues en vez del detalle real de una
// fila. Sin este chequeo, resumenCambioAuditoria/identificadorAuditoria intentarían leer campos
// que ahí no existen (descripción, stock, sku_code) y mostrarían puros "—" en vez de decir cuántas
// filas fueron.
function esResumenAuditoria(fila){
  return !!((fila.datos_antes && fila.datos_antes._resumen) || (fila.datos_despues && fila.datos_despues._resumen));
}

// El trigger de auditoría guarda la fila completa (to_jsonb) en datos_antes/datos_despues, así
// que además de "qué cambió" en un UPDATE, también podemos mostrar el detalle de una creación
// o eliminación en vez de un genérico "se creó/eliminó el registro" que no dice nada útil.
function resumenCambioAuditoria(fila){
  if(esResumenAuditoria(fila)){
    const n = (fila.datos_despues || fila.datos_antes).filas_afectadas;
    const verbo = fila.accion==='INSERT' ? 'cargados' : fila.accion==='DELETE' ? 'eliminados' : 'actualizados';
    return `Carga masiva: ${n} SKU ${verbo} de una vez`;
  }
  const campos = CAMPOS_AUDITADOS[fila.tabla] || [];
  if(fila.accion==='INSERT'){
    const despues = fila.datos_despues || {};
    const detalle = campos.map(([campo,label]) => `${label}: ${formatearValorAuditoria(despues[campo])}`);
    return detalle.length ? detalle.join(' · ') : 'Se creó el registro';
  }
  if(fila.accion==='DELETE'){
    const antes = fila.datos_antes || {};
    const detalle = campos.map(([campo,label]) => `${label}: ${formatearValorAuditoria(antes[campo])}`);
    return detalle.length ? detalle.join(' · ') : 'Se eliminó el registro';
  }
  const antes = fila.datos_antes || {};
  const despues = fila.datos_despues || {};
  const cambios = campos
    .filter(([campo]) => JSON.stringify(antes[campo]) !== JSON.stringify(despues[campo]))
    .map(([campo,label]) => `${label}: ${formatearValorAuditoria(antes[campo])} → ${formatearValorAuditoria(despues[campo])}`);
  return cambios.length ? cambios.join(' · ') : 'Sin cambios visibles';
}

// Identifica de qué registro se trata además de tabla+acción: sin esto, "Persona · Modificado"
// o "Empresa · Eliminado" no dicen a quién le pasó — hay que saber el nombre para que la fila
// sirva de algo al revisar la trazabilidad (ej. quién quedó con rol admin, qué empresa se borró).
function identificadorAuditoria(fila){
  if(esResumenAuditoria(fila)) return '';
  const antes = fila.datos_antes || {};
  const despues = fila.datos_despues || {};
  if(fila.tabla==='skus'){
    const codigo = despues.sku_code || antes.sku_code;
    return codigo? ` · ${codigo}` : '';
  }
  if(fila.tabla==='usuarios' || fila.tabla==='empresas'){
    const nombre = despues.nombre || antes.nombre;
    return nombre? ` · ${nombre}` : '';
  }
  if(fila.tabla==='conteos'){
    const partes = [despues.bodega || antes.bodega, despues.ubicacion_contada || antes.ubicacion_contada].filter(Boolean);
    return partes.length? ` · ${partes.join(' / ')}` : '';
  }
  return '';
}

// fetch() rechaza con un TypeError crudo en inglés ("Failed to fetch", "NetworkError...",
// "Load failed" en Safari) cuando no hay conexión — antes de siquiera llegar a una respuesta
// HTTP. Es justo el escenario más común en una bodega o mina con señal mala, así que es el
// caso que más vale traducir: se atrapa acá, en la capa de red, para que cualquier catch(e)
// más arriba en la app (hay decenas) le muestre a la persona algo entendible en vez del
// error crudo del navegador. Sigue siendo un TypeError (no un Error genérico) a propósito:
// pareceFalloDeRed(), más abajo, detecta "sin conexión de verdad" con instanceof TypeError
// para encolar conteos/fotos/SKU offline en vez de mostrarlos como error — si esto lanzara
// un Error normal, esa detección dejaría de funcionar en todos esos flujos.
const MENSAJE_SIN_CONEXION = 'No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.';

async function authRequest(path, body){
  let res;
  try{
    res = await fetch(`${SUPABASE_URL}/auth/v1${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify(body)
    });
  }catch(e){
    if(pareceFalloDeRed(e)) throw new TypeError(MENSAJE_SIN_CONEXION);
    throw e;
  }
  const data = await res.json().catch(()=> ({}));
  if(!res.ok){ throw new Error(data.error_description || data.msg || data.error || 'Error de autenticación'); }
  return data;
}

// Como authRequest, pero para llamadas de MFA (factors/user) que necesitan la sesión ya
// autenticada (Authorization: Bearer) en vez de solo la apikey, y pueden ser GET/DELETE además
// de POST -- ver enrolarMfa/enviarCodigoMfaDesafio/desactivarMfa más abajo.
async function authFetch(path, { method='GET', body=null } = {}){
  let res;
  try{
    res = await fetch(`${SUPABASE_URL}/auth/v1${path}`, {
      method,
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${state.session.access_token}` },
      body: body ? JSON.stringify(body) : null,
    });
  }catch(e){
    if(pareceFalloDeRed(e)) throw new TypeError(MENSAJE_SIN_CONEXION);
    throw e;
  }
  const data = await res.json().catch(()=> ({}));
  if(!res.ok){ throw new Error(data.error_description || data.msg || data.error || 'Error de autenticación'); }
  return data;
}

// Lee el nivel de verificación (aal) del token actual sin llamar al servidor -- viene codificado
// en el propio JWT (segundo segmento, base64url). 'aal1' = solo contraseña; 'aal2' = ya pasó por
// un segundo factor. Si algo no calza (token raro, etc.) se asume aal1, el nivel más bajo -- así,
// ante la duda, se pide el segundo factor en vez de dejar pasar una sesión no verificada.
function decodeJwtAal(accessToken){
  try{
    const payload = accessToken.split('.')[1];
    const json = JSON.parse(atob(payload.replace(/-/g,'+').replace(/_/g,'/')));
    return json.aal || 'aal1';
  }catch(e){ return 'aal1'; }
}

// Convierte cualquier fallo de la llamada (de red real, o el aborto por timeoutMs de más abajo)
// en el mismo TypeError "sin conexión" que ya reconoce pareceFalloDeRed en toda la app -- así los
// flujos que ya saben encolar offline ante un fallo de red (ver guardarConteo) también absorben el
// caso "señal viva pero demasiado lenta" sin necesitar lógica aparte. motivoTimeout distingue el
// caso puntual (para un mensaje más preciso: "está lento" en vez de "sin conexión").
function relanzarComoSinConexion(e){
  if(e && e.name==='AbortError'){ const err = new TypeError(MENSAJE_SIN_CONEXION); err.motivoTimeout = true; throw err; }
  if(pareceFalloDeRed(e)) throw new TypeError(MENSAJE_SIN_CONEXION);
  throw e;
}

// Mismo mecanismo de timeoutMs de rest() (ver más abajo), pero para los pocos lugares
// (skusDeUbicacion/contarUniversoUbicacion) que llaman fetch() directo en vez de rest(), porque
// necesitan leer headers de paginación (Range/Content-Range) que rest() no expone. Sin esto,
// con señal mala en terreno (ver UMBRAL_ABORTAR_GUARDADO_MS) el fetch queda esperando una
// respuesta que nunca llega -- Joel reportó justo esto: "Confirmar y crear plan" quedaba pegado
// en "Creando…" para siempre, sin ningún aviso de error, porque nada cortaba la espera.
async function fetchConTimeout(url, options, timeoutMs=UMBRAL_ABORTAR_GUARDADO_MS){
  const controller = new AbortController();
  const timer = setTimeout(()=> controller.abort(), timeoutMs);
  try{
    return await fetch(url, {...options, signal: controller.signal});
  }catch(e){
    relanzarComoSinConexion(e);
  }finally{
    clearTimeout(timer);
  }
}

async function rest(path, { method='GET', body=null, prefer=null, extraHeaders={}, timeoutMs=null } = {}){
  const hacerLlamada = () => {
    const headers = {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      ...extraHeaders
    };
    if(prefer) headers['Prefer'] = prefer;
    let signal;
    if(timeoutMs){
      const controller = new AbortController();
      signal = controller.signal;
      const timer = setTimeout(()=> controller.abort(), timeoutMs);
      return fetch(`${SUPABASE_URL}/rest/v1${path}`, { method, headers, body: body?JSON.stringify(body):null, signal })
        .finally(()=> clearTimeout(timer));
    }
    return fetch(`${SUPABASE_URL}/rest/v1${path}`, { method, headers, body: body?JSON.stringify(body):null });
  };
  let res;
  try{
    res = await hacerLlamada();
  }catch(e){
    relanzarComoSinConexion(e);
  }
  // El access_token dura poco (~1h); si ya venció, refrescamos con el refresh_token
  // guardado y reintentamos una sola vez antes de mostrar el error.
  if(res.status===401 && state.session && state.session.refresh_token){
    const refrescada = await refrescarSesion();
    if(refrescada){
      try{
        res = await hacerLlamada();
      }catch(e){
        relanzarComoSinConexion(e);
      }
    }
    else{
      manejarSesionInvalida();
      throw new Error(MENSAJE_SESION_TERMINADA);
    }
  }
  const text = await res.text(); // POST/PATCH con Prefer: return=minimal responden 200/201 con cuerpo vacío, no 204 — no asumir JSON siempre presente
  let data = null;
  if(text){ try{ data = JSON.parse(text); }catch(e){ /* respuesta no-JSON */ } }
  if(!res.ok){
    throw new Error((data && data.message) || 'No se pudo completar la operación. Inténtalo de nuevo.');
  }
  return data;
}

async function storageUpload(path, file){
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
    method:'POST',
    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session.access_token}`,
      'Content-Type': file.type || 'application/octet-stream',
      'x-upsert':'true'
    },
    body:file
  });
  if(!res.ok){ const err=await res.json().catch(()=>({})); throw new Error(err.message||'No se pudo subir la foto'); }
  return path; // el bucket es privado: se guarda la ruta, la URL para verla se firma al momento de mostrarla
}

// Genera una URL temporal para ver una foto del bucket privado. Acepta tanto
// una ruta nueva (empresa_id/sku/archivo) como una URL pública completa de
// fotos subidas antes de que el bucket pasara a privado. `transform` (opcional)
// pide una versión redimensionada/comprimida vía Supabase Image Transformations
// -- si el proyecto no la tiene habilitada, el llamador debe reintentar sin transform
// (ver resolverFotoParaPDF, que cae a reducirFotoEnNavegador()).
async function crearUrlFirmada(fotoUrlORuta, transform){
  const ruta = rutaFotoDesdeUrl(fotoUrlORuta);
  const body = transform ? {expiresIn:3600, transform} : {expiresIn:3600};
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/sign/${BUCKET}/${ruta}`, {
    method:'POST',
    headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${state.session.access_token}`, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok || !data.signedURL) throw new Error(data.message || 'No se pudo abrir la foto');
  return `${SUPABASE_URL}/storage/v1${data.signedURL}`;
}

/* ---- Compresión de fotos en el dispositivo (tarea #121) -------------------------------------
   Las fotos de cámara pesan 3,3 MB en promedio (máximo 5,2 MB) para verse en un recuadro de la
   app o del PDF. Antes de subirlas (y antes de encolarlas sin conexión) se reducen acá mismo, en
   el celular, a máximo 1600 px por lado en JPEG calidad 0,82: 200-400 KB, sin diferencia visible.
   Reglas de seguridad de esta función: si algo falla (formato raro como HEIC que el navegador no
   decodifica, canvas no disponible, foto corrupta) o si el resultado no es más chico, se sube la
   original tal cual, como hasta ahora. Nunca bloquea un conteo. */
const FOTO_MAX_LADO_PX = 1600;
const FOTO_CALIDAD_JPEG = 0.82;
const FOTO_UMBRAL_COMPRIMIR_BYTES = 400 * 1024; // más chica que esto (y ya JPEG) se sube tal cual
let fotosEnProceso = []; // promesas de compresión en curso (guardarConteo las espera)

async function decodificarImagen(file){
  // 1) <img>: todos los navegadores actuales (Safari 13.4+, Chrome 81+, Firefox) aplican la
  //    orientación EXIF de la cámara al dibujarlo en un canvas, así que una foto vertical no
  //    queda acostada.
  if(typeof Image !== 'undefined' && typeof URL !== 'undefined' && typeof URL.createObjectURL === 'function'){
    let url = null;
    try{ url = URL.createObjectURL(file); }catch(e){ url = null; }
    if(url){
      try{
        return await new Promise((resolve, reject)=>{
          const im = new Image();
          im.onload = ()=> resolve(im);
          im.onerror = ()=> reject(new Error('No se pudo leer la foto'));
          im.src = url;
        });
      }catch(e){ /* sigue con createImageBitmap */ }
      finally{ try{ URL.revokeObjectURL(url); }catch(e){ /* nada */ } }
    }
  }
  // 2) createImageBitmap, pidiendo la orientación EXIF explícitamente.
  if(typeof createImageBitmap === 'function'){
    try{ return await createImageBitmap(file, {imageOrientation:'from-image'}); }catch(e){ /* formato no soportado */ }
  }
  return null;
}
function nombreFotoJpg(nombre){ return String(nombre||'foto').replace(/\.[^.]+$/, '') + '.jpg'; }
async function comprimirFoto(file){
  try{
    if(!file || typeof file.size !== 'number') return file;
    if(file.size <= FOTO_UMBRAL_COMPRIMIR_BYTES && String(file.type||'').toLowerCase()==='image/jpeg') return file;
    if(typeof document === 'undefined') return file;
    const canvas = document.createElement('canvas');
    if(!canvas || typeof canvas.getContext !== 'function' || typeof canvas.toBlob !== 'function') return file;
    const img = await decodificarImagen(file);
    if(!img) return file;
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if(!w || !h) return file;
    const escala = Math.min(1, FOTO_MAX_LADO_PX / Math.max(w, h));
    const dw = Math.max(1, Math.round(w * escala)), dh = Math.max(1, Math.round(h * escala));
    canvas.width = dw; canvas.height = dh;
    const ctx = canvas.getContext('2d');
    if(!ctx) return file;
    ctx.drawImage(img, 0, 0, dw, dh);
    if(typeof img.close === 'function') img.close(); // libera el bitmap de 12 MP
    const blob = await new Promise(resolve=> canvas.toBlob(resolve, 'image/jpeg', FOTO_CALIDAD_JPEG));
    if(!blob || !blob.size || blob.size >= file.size) return file; // no ganó nada: va la original
    const nombre = nombreFotoJpg(file.name);
    let salida = blob;
    if(typeof File === 'function'){ try{ salida = new File([blob], nombre, {type:'image/jpeg'}); }catch(e){ salida = blob; } }
    if(!salida.name){ try{ salida.name = nombre; }catch(e){ /* Blob inmutable en algún navegador: el nombre solo se usa para la extensión */ } }
    if(!salida.type){ try{ salida.type = 'image/jpeg'; }catch(e){ /* idem */ } }
    return salida;
  }catch(e){ return file; }
}
// guardarConteo la llama antes de subir/encolar: una foto recién tomada puede seguir comprimiéndose
// (unos cientos de ms) cuando la persona ya tocó "Guardar conteo".
async function esperarFotosEnProceso(){
  if(!fotosEnProceso.length) return;
  await Promise.all(fotosEnProceso.map(p=> p.catch(()=>{})));
}
function rutaFotoDesdeUrl(fotoUrlORuta){
  const marcador = `/object/public/${BUCKET}/`;
  const idx = String(fotoUrlORuta||'').indexOf(marcador);
  return idx>=0 ? fotoUrlORuta.slice(idx+marcador.length) : fotoUrlORuta;
}

// Una pasada única (Configuraciones, admin) para las fotos que ya estaban subidas a tamaño
// completo: baja cada una, la comprime con la misma función y la sobrescribe en la MISMA ruta
// (x-upsert), así conteo_fotos no cambia y nada más se entera. Solo reemplaza si quedó más
// chica; una falla puntual se cuenta y se sigue con la siguiente. Se puede cancelar.
async function comprimirFotosExistentes(){
  if(!perfilCargado() || state.comprimiendoFotos) return;
  let filas = [];
  try{ filas = await restTodo('/conteo_fotos?select=id,foto_url&order=created_at.asc'); }
  catch(e){ toast(e.message,'err'); return; }
  const progreso = {total: filas.length, hechas:0, comprimidas:0, ahorroBytes:0, errores:0, cancelar:false, terminado:false};
  setState({comprimiendoFotos: progreso});
  const pintar = ()=>{
    const el = document.getElementById('progreso-comprimir-fotos');
    if(el) el.textContent = textoProgresoComprimirFotos(progreso);
  };
  for(const f of filas){
    if(progreso.cancelar) break;
    try{
      const url = await crearUrlFirmada(f.foto_url);
      const res = await fetch(url);
      if(!res || !res.ok) throw new Error('No se pudo descargar');
      const blob = await res.blob();
      if(blob && blob.size > FOTO_UMBRAL_COMPRIMIR_BYTES){
        let archivo = blob;
        if(typeof File === 'function'){ try{ archivo = new File([blob], 'foto.jpg', {type: blob.type || 'image/jpeg'}); }catch(e){ archivo = blob; } }
        const comprimida = await comprimirFoto(archivo);
        if(comprimida !== archivo && comprimida.size < blob.size){
          await storageUpload(rutaFotoDesdeUrl(f.foto_url), comprimida);
          progreso.comprimidas++;
          progreso.ahorroBytes += blob.size - comprimida.size;
        }
      }
    }catch(e){ progreso.errores++; }
    progreso.hechas++;
    pintar();
  }
  progreso.terminado = true;
  setState({comprimiendoFotos: progreso});
  toast(progreso.cancelar ? 'Compresión cancelada' : `Listo: ${progreso.comprimidas} foto${progreso.comprimidas===1?'':'s'} comprimida${progreso.comprimidas===1?'':'s'}, ${formatoMB(progreso.ahorroBytes)} liberados`);
}
function formatoMB(bytes){ return `${(bytes/1048576).toFixed(1).replace('.',',')} MB`; }
function textoProgresoComprimirFotos(p){
  if(!p) return '';
  const base = `${p.hechas} de ${p.total} revisadas · ${p.comprimidas} comprimidas · ${formatoMB(p.ahorroBytes)} liberados${p.errores? ` · ${p.errores} con error` : ''}`;
  return p.terminado ? (p.cancelar ? `Cancelado. ${base}` : `Terminado. ${base}`) : `Comprimiendo… ${base}`;
}

// Reduce una foto en el navegador (canvas) a un cuadrado de `lado` px recortado al centro
// ("cover") y la devuelve como data URL JPEG, lista para incrustar en un PDF. Es el plan B
// cuando Supabase no puede transformar la foto (implica bajar la original de 3-5 MB, por eso
// no es el camino principal). No agranda fotos más chicas que `lado`. Devuelve null si algo
// falla (sin canvas, foto corrupta, bloqueo CORS) para que el llamador use la URL original.
const FOTO_PDF_LADO_PX = 400;
async function reducirFotoEnNavegador(url, lado=FOTO_PDF_LADO_PX, calidad=0.7){
  try{
    if(typeof Image==='undefined' || typeof document==='undefined') return null;
    const canvas = document.createElement('canvas');
    if(!canvas || typeof canvas.getContext!=='function' || typeof canvas.toDataURL!=='function') return null;
    const img = await new Promise((resolve, reject)=>{
      const im = new Image();
      im.crossOrigin = 'anonymous';
      // Tope de espera: si la foto nunca termina de cargar (señal mala), el PDF sigue con la
      // URL original en vez de quedarse colgado en "Generando PDF".
      const tope = setTimeout(()=> reject(new Error('La foto tardó demasiado en cargar')), 15000);
      im.onload = ()=>{ clearTimeout(tope); resolve(im); };
      im.onerror = ()=>{ clearTimeout(tope); reject(new Error('No se pudo cargar la foto para reducirla')); };
      im.src = url;
    });
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if(!w || !h) return null;
    const recorte = Math.min(w, h);
    const destino = Math.min(lado, recorte);
    canvas.width = destino; canvas.height = destino;
    const ctx = canvas.getContext('2d');
    if(!ctx) return null;
    ctx.drawImage(img, (w-recorte)/2, (h-recorte)/2, recorte, recorte, 0, 0, destino, destino);
    const dataUrl = canvas.toDataURL('image/jpeg', calidad);
    return (typeof dataUrl==='string' && dataUrl.startsWith('data:image/')) ? dataUrl : null;
  }catch(e){
    return null;
  }
}

/* =======================================================================
   TOASTS
   ======================================================================= */
function toast(msg, type='ok'){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast ${type==='err'?'err':type==='warn'?'warn':'ok'}`;
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* =======================================================================
   AUTENTICACIÓN
   ======================================================================= */
const SESION_KEY = 'sesion_inventario';

function guardarSesion(data){
  try{ localStorage.setItem(SESION_KEY, JSON.stringify({access_token:data.access_token, refresh_token:data.refresh_token, user:data.user})); }catch(e){ /* localStorage no disponible (modo privado, etc.) */ }
}

function borrarSesionGuardada(){
  try{ localStorage.removeItem(SESION_KEY); }catch(e){ /* nada que borrar */ }
}

// El access_token dura ~1h; con el refresh_token pedimos uno nuevo sin que
// la persona tenga que volver a loguearse (ni al recargar la página, ni
// a mitad de un turno largo de conteo).
async function refrescarSesion(){
  if(!state.session || !state.session.refresh_token) return false;
  try{
    const data = await authRequest('/token?grant_type=refresh_token', {refresh_token: state.session.refresh_token});
    if(!data.access_token) return false;
    state.session = data;
    guardarSesion(data);
    return true;
  }catch(e){ return false; }
}

// Al abrir la app, si hay una sesión guardada la restauramos (con refresh)
// en vez de mostrar el login. Si el refresh_token ya no sirve o la cuenta
// fue desactivada, la limpiamos y seguimos al login normal.
async function restaurarSesionGuardada(){
  let guardada;
  try{ guardada = JSON.parse(localStorage.getItem(SESION_KEY)); }catch(e){ guardada = null; }
  if(!guardada || !guardada.refresh_token) return;
  state.session = guardada;
  const ok = await refrescarSesion();
  if(!ok){ state.session = null; borrarSesionGuardada(); return; }
  try{
    await cargarPerfil();
  }catch(e){
    // Sentry #278: cargarPerfil() puede fallar por un corte de red genuino al pedir el perfil
    // (aparte del chequeo de empresa bloqueada, que ya se atrapa dentro de la propia función) --
    // sin este try/catch, el error se escapaba sin capturar hasta iniciarApp() (que no tiene
    // ninguno) y terminaba en la red de seguridad global (ver Sentry #227) en vez de un manejo
    // específico -- y además dejaba sin ejecutar el render() final de iniciarApp(), con la
    // pantalla pegada en el splash inicial. No se borra la sesión guardada acá: es un problema
    // de conexión momentáneo, no una sesión inválida -- borrarla forzaría un re-login
    // innecesario apenas vuelva la señal.
    toast(mensajeParaRechazoNoCapturado(e), 'err');
    return;
  }
  if(state.empresaBloqueada) return; // sesión sigue viva: se muestra la pantalla de cuenta bloqueada
  if(!state.perfil){ state.session = null; borrarSesionGuardada(); return; }
  state.view = vistaInicialParaPerfil();
  cargarTodo();
  sincronizarSuscripcionFlow();
}

async function cargarPerfil(){
  const uid = state.session.user.id;
  // Antes de pedir el perfil normal, revisamos si la empresa está bloqueada (inactiva o
  // con la suscripción morosa). empresa_actual() ya no deja leer nada en ese caso, así que
  // sin este chequeo aparte el usuario vería un login roto en vez de saber por qué.
  try{
    const estado = await rest('/rpc/mi_estado_bloqueo', {method:'POST'});
    const info = estado && estado[0];
    if(info && info.bloqueada){
      state.perfil = null;
      state.empresaBloqueada = {motivo: info.motivo, nombre: info.empresa_nombre, planNombre: info.plan_nombre};
      configurarContextoSentry();
      return;
    }
  }catch(e){ /* si falla la consulta de estado, seguimos con el flujo normal */ }
  state.empresaBloqueada = null;
  const rows = await rest(`/usuarios?auth_user_id=eq.${uid}&select=id,nombre,rol,es_super_admin,empresa_id,empresas(nombre,codigo_invitacion,flow_subscription_status,conteo_ciego_habilitado,modulo_bodega_habilitado,planes(nombre,etiqueta,max_bodegas,max_usuarios,offline_habilitado,dashboard_ejecutivo_habilitado,auditoria_habilitada))`);
  if(rows && rows[0]) state.perfil = rows[0];
  else state.perfil = null;
  configurarContextoSentry();
}

// Si no hay plan cargado (aún no llegó del backend, o el embed falló) se asume acceso
// completo: es una restricción de UX, no de seguridad — el límite real lo aplican los
// triggers en la base de datos, así que fallar "abierto" acá no compromete nada.
function planIncluye(campo){
  const plan = state.perfil && state.perfil.empresas && state.perfil.empresas.planes;
  if(!plan) return true;
  return !!plan[campo];
}

async function handleLogin(email, password){
  try{
    setState({loading:true});
    const data = await authRequest('/token?grant_type=password', {email, password});
    state.session = data;
    guardarSesion(data);
    await continuarSiHaceFaltaMfa();
  }catch(e){
    setState({loading:false});
    toast(e.message,'err');
  }
}

// Tras la contraseña, revisa si la cuenta tiene un segundo factor (TOTP) ya verificado y la
// sesión recién obtenida todavía está en aal1 -- en ese caso, en vez de entrar directo, pide el
// código de la app autenticadora (ver renderMfaDesafio) antes de cargar el perfil. Si falla la
// consulta de factores (red, etc.) se sigue como si no tuviera MFA activado: un error de red acá
// no debe dejar a nadie fuera de su propia cuenta.
async function continuarSiHaceFaltaMfa(){
  if(decodeJwtAal(state.session.access_token) !== 'aal2'){
    let factores = [];
    try{ const usuario = await authFetch('/user'); factores = (usuario && usuario.factors) || []; }catch(e){ /* seguimos como si no tuviera MFA */ }
    const factorVerificado = factores.find(f=>f.status==='verified');
    if(factorVerificado){
      setState({loading:false, mfaDesafio:{factorId:factorVerificado.id, codigo:'', verificando:false, error:null}});
      return;
    }
  }
  await finalizarLogin();
}

// Última parte, común a un login sin MFA y a uno que sí pasó por el desafío: carga el perfil y
// entra a la app. Antes vivía inline al final de handleLogin.
async function finalizarLogin(){
  await cargarPerfil();
  const otraSesionCerrada = await hayOtraSesionActiva();
  setState({loading:false, view:vistaInicialParaPerfil(), mfaDesafio:null});
  toast(otraSesionCerrada
    ? 'Cerramos tu sesión anterior en otro dispositivo.'
    : `Bienvenido${state.perfil?', '+state.perfil.nombre:''}`);
  cargarTodo();
  sincronizarSuscripcionFlow();
}

async function enviarCodigoMfaDesafio(codigo){
  const d = state.mfaDesafio;
  if(!d) return;
  setState({mfaDesafio:{...d, verificando:true, error:null}});
  try{
    const desafio = await authFetch(`/factors/${d.factorId}/challenge`, {method:'POST'});
    const sesion = await authFetch(`/factors/${d.factorId}/verify`, {method:'POST', body:{challenge_id: desafio.id, code: codigo}});
    state.session = sesion;
    guardarSesion(sesion);
    await finalizarLogin();
  }catch(e){
    setState({mfaDesafio:{...state.mfaDesafio, verificando:false, error: e.message}});
  }
}

// Con "Single session per user" activado, este login deja invalidada (en su próximo
// refresh) cualquier otra sesión activa de la cuenta. Se lo decimos a quien recién
// entró para que no se sorprenda si el otro dispositivo se desconecta solo más tarde.
async function hayOtraSesionActiva(){
  try{ return await rest('/rpc/tengo_otra_sesion_activa', {method:'POST'}); }
  catch(e){ return false; }
}

// Al llegar desde el link del correo de invitación o de recuperar contraseña, Supabase
// redirige con el token de sesión en el fragmento de la URL
// (#access_token=...&type=invite o type=recovery). Lo detectamos antes del primer render
// para mostrar "crea tu contraseña" en vez del login normal.
async function procesarLlegadaPorInvitacion(){
  const hash = location.hash.startsWith('#') ? location.hash.slice(1) : '';
  const params = new URLSearchParams(hash);
  const accessToken = params.get('access_token');
  const tipo = params.get('type');
  if(!accessToken || (tipo!=='recovery' && tipo!=='invite')) return;
  history.replaceState(null, '', location.pathname + location.search);
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${accessToken}` }
    });
    const user = await res.json();
    if(!res.ok || !user.id) throw new Error('El link de invitación ya no es válido');
    state.session = { access_token: accessToken, refresh_token: params.get('refresh_token'), user };
    state.debeCrearPassword = true;
  }catch(e){
    toast(e.message,'err');
  }
}

// Al volver de registrar la tarjeta en Flow, la Edge Function flow-registro-callback nos
// redirige acá con ?flow=ok o ?flow=error. Solo mostramos el aviso; el estado real
// (flow_subscription_status, plan_id) ya lo dejó puesto esa función en el backend.
function procesarRetornoFlow(){
  const params = new URLSearchParams(location.search);
  const resultado = params.get('flow');
  if(!resultado) return;
  history.replaceState(null, '', location.pathname + location.hash);
  state.avisoFlow = resultado;
}

const PLANES_AUTOSERVICIO = ['basico', 'profesional'];

// Al llegar desde el botón "Suscribirme" del landing (?plan=basico o ?plan=profesional),
// mostramos la pantalla de alta autoservicio en vez del login normal.
function procesarRegistroPlanDesdeUrl(){
  const params = new URLSearchParams(location.search);
  const plan = params.get('plan');
  if(!PLANES_AUTOSERVICIO.includes(plan)) return;
  history.replaceState(null, '', location.pathname + location.hash);
  state.registroPlan = plan;
}

async function iniciarSuscripcionFlow(planNombre){
  state.iniciandoSuscripcionFlow = true;
  render();
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/flow-iniciar-suscripcion`, {
      method:'POST',
      headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${state.session.access_token}`, 'Content-Type':'application/json' },
      body: JSON.stringify({planNombre})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || 'No se pudo iniciar la suscripción');
    location.href = data.url;
  }catch(e){
    toast(e.message,'err');
    state.iniciandoSuscripcionFlow = false;
    render();
  }
}

// Reconciliación del estado de la suscripción contra Flow (#94). Hallazgo real: el urlCallback
// del plan en Flow NO se invocó en el primer cobro real (2026-09-03), así que el estado en la
// base (flow_subscription_status) no puede depender solo del webhook flow-webhook-cobro. La
// Edge Function flow-sincronizar-suscripcion le pregunta a Flow y refleja el estado real. Se
// llama en segundo plano al entrar a la app, como mucho una vez cada 6 h por empresa (umbral en
// localStorage; el servidor tiene otro de 10 min), y a pedido desde la pantalla de cuenta
// bloqueada ("Ya regularicé el pago"). Silenciosa: un fallo acá nunca debe molestar a nadie.
const FLOW_SYNC_CADA_MS = 6 * 60 * 60 * 1000;
function claveFlowSync(){ return `flow_sync_${state.perfil && state.perfil.empresa_id}`; }
async function sincronizarSuscripcionFlow({forzar=false}={}){
  if(!state.session) return null;
  if(!forzar){
    const empresa = state.perfil && state.perfil.empresas;
    if(!empresa || !['activa','cancelada'].includes(empresa.flow_subscription_status)) return null;
    let ultima = 0;
    try{ ultima = Number(localStorage.getItem(claveFlowSync())) || 0; }catch(e){ ultima = 0; }
    if(Date.now() - ultima < FLOW_SYNC_CADA_MS) return null;
  }
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/flow-sincronizar-suscripcion`, {
      method:'POST',
      headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${state.session.access_token}`, 'Content-Type':'application/json' },
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || 'No se pudo sincronizar la suscripción');
    if(state.perfil){ try{ localStorage.setItem(claveFlowSync(), String(Date.now())); }catch(e){ /* sin storage */ } }
    const empresa = state.perfil && state.perfil.empresas;
    if(empresa && data.estado && data.estado !== empresa.flow_subscription_status){
      empresa.flow_subscription_status = data.estado;
      // Pasó a un estado que bloquea el acceso: cargarPerfil vuelve a consultar mi_estado_bloqueo
      // y deja la pantalla de cuenta bloqueada en vez de una app que falla por RLS.
      if(data.estado === 'morosa' || data.estado === 'vencida') await cargarPerfil();
      render();
    }
    return data;
  }catch(e){
    return null;
  }
}

// Desde la pantalla de cuenta bloqueada por mora: la persona ya actualizó su tarjeta o Flow ya
// logró cobrar, y quiere entrar sin esperar al webhook. Si Flow confirma que ya no está morosa,
// se entra a la app normalmente.
async function verificarPagoCuentaBloqueada(){
  setState({verificandoPagoBloqueada:true});
  const data = await sincronizarSuscripcionFlow({forzar:true});
  try{ await cargarPerfil(); }catch(e){ /* se queda en la pantalla bloqueada */ }
  if(state.session && !state.empresaBloqueada && state.perfil){
    setState({verificandoPagoBloqueada:false, view: vistaInicialParaPerfil()});
    toast('Pago verificado, bienvenido de vuelta');
    cargarTodo();
    return;
  }
  setState({verificandoPagoBloqueada:false});
  toast(data && data.sincronizada ? 'Flow todavía informa la suscripción como impaga' : 'No se pudo verificar el pago, intenta de nuevo en unos minutos', 'err');
}

async function cancelarSuscripcionFlow(){
  if(!confirm('¿Cancelar tu suscripción? Seguirás con acceso hasta el fin del período ya pagado, pero no se renovará después.')) return;
  state.cancelandoSuscripcionFlow = true;
  render();
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/flow-cancelar-suscripcion`, {
      method:'POST',
      headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${state.session.access_token}`, 'Content-Type':'application/json' },
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || 'No se pudo cancelar la suscripción');
    if(state.perfil && state.perfil.empresas) state.perfil.empresas.flow_subscription_status = 'cancelada';
    toast('Suscripción cancelada');
  }catch(e){
    toast(e.message,'err');
  }
  state.cancelandoSuscripcionFlow = false;
  render();
}

// Cambiar entre Básico y Profesional estando ya suscrito: a diferencia de iniciarSuscripcionFlow
// (que redirige a la página de Flow a registrar tarjeta), acá la tarjeta ya está registrada, así
// que el cambio es inmediato — la Edge Function cancela la suscripción vieja y crea la nueva sobre
// el mismo customerId de Flow, sin sacar a la persona de la app.
async function cambiarPlanFlow(nuevoPlan){
  const etiqueta = nuevoPlan === 'profesional' ? 'Profesional' : 'Básico';
  if(!confirm(`¿Cambiar tu suscripción al plan ${etiqueta}? El plan actual se cancela de inmediato y el cobro nuevo empieza hoy.`)) return;
  state.cambiandoPlanFlow = true;
  render();
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/flow-cambiar-plan`, {
      method:'POST',
      headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${state.session.access_token}`, 'Content-Type':'application/json' },
      body: JSON.stringify({planNombre: nuevoPlan})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || 'No se pudo cambiar de plan');
    toast(`Listo, ahora estás en el plan ${etiqueta}`);
    await cargarPerfil();
  }catch(e){
    toast(e.message,'err');
  }
  state.cambiandoPlanFlow = false;
  render();
}

// Alta autoservicio (Básico/Profesional): crea la empresa + la cuenta de admin, inicia
// sesión con las mismas credenciales que la persona acaba de tipear, y sigue directo al
// registro de tarjeta en Flow — la empresa queda "pendiente_tarjeta" (sin acceso real)
// hasta que ese paso se completa.
async function crearCuentaAutoservicio(nombreEmpresa, nombreAdmin, email, password){
  state.creandoCuentaAutoservicio = true;
  render();
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/crear-empresa-autoservicio`, {
      method:'POST',
      headers:{ 'apikey':SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({nombreEmpresa, nombreAdmin, email, password, planNombre: state.registroPlan})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || 'No se pudo crear la cuenta');

    const planNombre = state.registroPlan;
    state.registroPlan = null;
    const sesion = await authRequest('/token?grant_type=password', {email, password});
    state.session = sesion;
    guardarSesion(sesion);
    await cargarPerfil();
    await iniciarSuscripcionFlow(planNombre);
  }catch(e){
    toast(e.message,'err');
    state.creandoCuentaAutoservicio = false;
    render();
  }
}

async function solicitarRecuperacion(email){
  if(!email) return;
  try{
    setState({loading:true});
    const res = await fetch(`${SUPABASE_URL}/auth/v1/recover?redirect_to=${encodeURIComponent(location.origin+location.pathname)}`, {
      method:'POST',
      headers:{ 'apikey':SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({email})
    });
    if(!res.ok){
      const data = await res.json().catch(()=>({}));
      throw new Error(data.error_description || data.msg || data.error || 'No se pudo enviar el correo');
    }
    // Pasa directo a "Ingresa tu código" (con el correo ya escrito) en vez de solo volver al
    // login -- ver ingresarConCodigo: escribir el código a mano no depende de que el link del
    // correo sobreviva un escáner de seguridad corporativo.
    setState({loading:false, authRecuperar:false, otpAcceso:{email}});
    toast('Si el correo existe, te llegará un código para ingresar');
  }catch(e){
    setState({loading:false});
    toast(e.message,'err');
  }
}

// Verifica un código OTP contra Supabase (POST /auth/v1/verify) para el `type` dado -- el
// largo del código no se valida acá, se manda tal cual lo escribió la persona (ver
// renderIngresarCodigo: no se asume un largo fijo). Devuelve la sesión si el código es válido
// para ese tipo, o null si no (para poder probar el otro tipo sin mostrar un error prematuro
// -- ver ingresarConCodigo).
async function verificarOtpIntento(email, token, type){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/verify`, {
    method:'POST',
    headers:{ 'apikey':SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({email, token, type})
  });
  if(!res.ok) return null;
  const data = await res.json();
  if(!data.access_token) return null;
  return { access_token: data.access_token, refresh_token: data.refresh_token, user: data.user };
}

// Alternativa al link del correo (#access_token=...&type=invite|recovery, ver
// procesarLlegadaPorInvitacion): la persona escribe a mano el código que Supabase manda en el
// mismo correo de invitación o de recuperar contraseña. No sabemos de antemano cuál de los dos
// tipos es, así que se prueban en orden.
async function ingresarConCodigo(email, codigo){
  if(!email || !codigo) return;
  setState({loading:true});
  try{
    const sesion = (await verificarOtpIntento(email, codigo, 'invite'))
      || (await verificarOtpIntento(email, codigo, 'recovery'));
    if(!sesion) throw new Error('El código no es válido o ya venció. Pide que te reenvíen la invitación o el correo de recuperación.');
    state.session = sesion;
    setState({loading:false, otpAcceso:null, debeCrearPassword:true});
  }catch(e){
    setState({loading:false});
    toast(e.message,'err');
  }
}
