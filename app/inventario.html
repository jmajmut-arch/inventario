    const rows = await rest(`/historial_ciclos_grupo?grupo_id=eq.${grupoId}&fecha_inicio=eq.${fechaInicio}&fecha_termino=eq.${fechaTermino}&select=sku_code,bodega,contado,fecha_conteo&order=sku_code.asc`) || [];
    setState({grupos: {...state.grupos, historialDetalleCargando:false, historialDetalle: rows}});
  }catch(e){
    setState({grupos: {...state.grupos, historialDetalleCargando:false}});
    toast(e.message,'err');
  }
}

// PDF de un ciclo cerrado (a pedido de Joel, junto con la regla "el ciclo nuevo parte el día del
// cierre"): la foto guardada por cerrar_ciclos_grupo_vencidos, material por material, con su
// descripción del maestro, estado y fecha del conteo. Reusa el área #print-plan de los otros PDF.
async function imprimirHistorialCicloGrupo(grupoId, fechaInicio, fechaTermino){
  const grupo = state.grupos.lista.find(g=>g.id===grupoId) || state.grupos.pausados.find(g=>g.id===grupoId);
  try{
    const filas = await rest(`/historial_ciclos_grupo?grupo_id=eq.${grupoId}&fecha_inicio=eq.${fechaInicio}&fecha_termino=eq.${fechaTermino}&select=sku_code,bodega,contado,fecha_conteo&order=sku_code.asc`) || [];
    // Descripciones del maestro (el historial guarda solo código y bodega), de a 100 códigos por
    // consulta para no armar una URL gigante con los 757 críticos.
    const descripciones = new Map();
    const codigos = [...new Set(filas.map(f=>f.sku_code))];
    for(let i=0; i<codigos.length; i+=100){
      const tanda = codigos.slice(i, i+100);
      const skus = await rest(`/skus?sku_code=in.(${tanda.map(c=>encodeURIComponent(c)).join(',')})&select=sku_code,bodega,descripcion`) || [];
      skus.forEach(s=>{ const clave = `${s.sku_code}|${s.bodega||''}`; if(!descripciones.has(clave)) descripciones.set(clave, s.descripcion||''); if(!descripciones.has(s.sku_code)) descripciones.set(s.sku_code, s.descripcion||''); });
    }
    const contados = filas.filter(f=>f.contado).length;
    const empresaNombre = (state.perfil && state.perfil.empresas && state.perfil.empresas.nombre) || '';
    const meta = [empresaNombre, `Ciclo ${fmtFecha(fechaInicio)} – ${fmtFecha(fechaTermino)}`, `${contados} de ${filas.length} contados`, `Generado ${new Date().toLocaleString('es-CL')}`].filter(Boolean).join(' · ');
    document.getElementById('print-informe').innerHTML = '';
    document.getElementById('print-buscar').innerHTML = '';
    document.getElementById('print-plan').innerHTML = `
      <h1>Cierre de ciclo · ${esc(grupo? grupo.nombre : 'Grupo')}</h1>
      <div class="print-meta">${esc(meta)}</div>
      ${filas.length ? `
      <table>
        <thead><tr><th>SKU</th><th>Descripción</th><th>Bodega</th><th>Estado</th><th>Fecha de conteo</th></tr></thead>
        <tbody>
          ${filas.map(f=>`
            <tr>
              <td>${esc(f.sku_code)}</td>
              <td>${esc(descripciones.get(`${f.sku_code}|${f.bodega||''}`) ?? descripciones.get(f.sku_code) ?? '')}</td>
              <td>${esc(f.bodega||'—')}</td>
              <td>${f.contado? 'Contado' : 'Pendiente'}</td>
              <td>${f.fecha_conteo? esc(fmtFechaHora(f.fecha_conteo)) : '—'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>` : `<p class="print-vacio">Este ciclo se cerró sin materiales en el grupo.</p>`}
    `;
    window.print();
  }catch(e){
    toast(e.message,'err');
  }
}

async function cargarMiembrosGrupo(grupoId){
  const grupo = state.grupos.lista.find(g=>g.id===grupoId);
  if(grupo && grupo.automatico_critico){
    // Automático: no hay una lista curada que pedir ni mostrar acá -- la membresía es "todo lo
    // marcado como Crítico" (ver renderDetalleGrupo, que usa el conteo de Seguimiento en su lugar).
    setState({grupos: {...state.grupos, miembros:[], cargandoMiembros:false}});
    return;
  }
  setState({grupos: {...state.grupos, cargandoMiembros:true}});
  try{
    const rows = await rest(`/skus_grupos_conteo?grupo_id=eq.${grupoId}&select=id,sku_code,bodega&order=sku_code.asc`) || [];
    // Se enriquece con datos del maestro (descripción/crítico/último conteo) para que la lista no
    // sea solo el código -- a pedido de Joel ("está pobre y poco informativo"). Se cruza por
    // código+bodega, igual que en cargarSeguimientoGrupo, porque la membresía no tiene FK directa
    // a skus (se guarda por código+bodega para sobrevivir cambios de storage bin/ubicación/batch).
    let datosSkus = [];
    if(rows.length){
      const codigos = Array.from(new Set(rows.map(m=>m.sku_code)));
      datosSkus = await rest(`/skus?activo=eq.true&sku_code=in.(${codigos.map(c=>encodeURIComponent(c)).join(',')})&select=sku_code,bodega,descripcion,critico,ultimo_conteo_fecha`) || [];
    }
    const cicloGrupo = calcularCicloGrupo(grupo);
    const inicioGrupoMs = cicloGrupo ? new Date(grupo.fecha_inicio+'T00:00:00').getTime() : null;
    const miembros = rows.map(m=>{
      const datos = datosSkus.find(d=>d.sku_code===m.sku_code && (d.bodega||'')===(m.bodega||''));
      const contadoAlgunaVez = !!(datos && datos.ultimo_conteo_fecha);
      return {
        ...m,
        descripcion: datos? datos.descripcion : null,
        critico: !!(datos && datos.critico),
        contadoAlgunaVez,
        contadoEsteCiclo: inicioGrupoMs!=null && contadoAlgunaVez && new Date(datos.ultimo_conteo_fecha).getTime() >= inicioGrupoMs,
        tieneCiclo: cicloGrupo!=null,
      };
    });
    setState({grupos: {...state.grupos, miembros, cargandoMiembros:false}});
  }catch(e){
    setState({grupos: {...state.grupos, cargandoMiembros:false}});
    toast(e.message,'err');
  }
}

// Buscador de candidatos para agregar a un grupo: mismo patrón "aparece mientras se tipea" que el
// buscador libre de Contar (ver escribirBuscadorLibre) -- a pedido de Joel, que quería que se
// sintiera igual que buscar un SKU al tomar inventario, sin tener que apretar un botón "Buscar".
// Debounce de 350ms y peticionId para descartar respuestas fuera de orden (misma razón que el
// buscador libre); el repintado toca SOLO el contenedor de resultados (#candidatos-grupo-
// resultados), nunca los <input>, para no perder el foco ni el teclado en pantalla en cada tecla.
let debounceCandidatosGrupo = null;
let candidatosGrupoPeticionId = 0;

function resetCandidatosGrupo(){
  clearTimeout(debounceCandidatosGrupo);
  candidatosGrupoPeticionId++;
  return { candidatos: [], candidatoTexto:'', candidatoBodega:'', buscandoCandidatos:false };
}

function actualizarResultadosCandidatosGrupoEnPantalla(){
  const cont = document.getElementById('candidatos-grupo-resultados');
  if(!cont) return;
  cont.innerHTML = renderResultadosCandidatosGrupo();
  bindResultadosCandidatosGrupo();
}

// Dispara la búsqueda (con el mismo umbral de 2 caracteres que el buscador libre de Contar) desde
// cualquiera de los dos campos -- código/descripción o bodega -- ya sea que se haya escrito uno
// u otro.
function evaluarBusquedaCandidatosGrupo(){
  clearTimeout(debounceCandidatosGrupo);
  const q = sanearTextoFiltro(state.grupos.candidatoTexto);
  const b = sanearTextoFiltro(state.grupos.candidatoBodega);
  const activa = q.length>=2 || b.length>=2;
  state.grupos.buscandoCandidatos = activa;
  if(!activa) state.grupos.candidatos = [];
  actualizarResultadosCandidatosGrupoEnPantalla();
  if(!activa){ candidatosGrupoPeticionId++; return; }
  debounceCandidatosGrupo = setTimeout(buscarCandidatosGrupo, 350);
}

function escribirCandidatoTextoGrupo(texto){
  state.grupos.candidatoTexto = texto;
  evaluarBusquedaCandidatosGrupo();
}

function escribirCandidatoBodegaGrupo(texto){
  state.grupos.candidatoBodega = texto;
  evaluarBusquedaCandidatosGrupo();
}

// Busca materiales candidatos para agregar a un grupo, por texto (código/descripción) y bodega.
// Deduplica por código+bodega (un mismo código puede repetirse en varias filas de `skus` por
// batch/ubicación/bin distintos) -- acá no importa esa combinación fina, ver comentario arriba.
async function buscarCandidatosGrupo(){
  const miPeticion = ++candidatosGrupoPeticionId;
  const { candidatoTexto, candidatoBodega } = state.grupos;
  try{
    let filtro = `/skus?activo=eq.true&select=sku_code,descripcion,bodega&order=sku_code.asc&limit=200`;
    const texto = sanearTextoFiltro(candidatoTexto);
    if(texto) filtro += `&or=(sku_code.ilike.*${encodeURIComponent(texto)}*,descripcion.ilike.*${encodeURIComponent(texto)}*)`;
    const bodega = sanearTextoFiltro(candidatoBodega);
    if(bodega) filtro += `&bodega=ilike.*${encodeURIComponent(bodega)}*`;
    const rows = await rest(filtro) || [];
    if(miPeticion !== candidatosGrupoPeticionId) return; // respuesta obsoleta: se siguió escribiendo
    const porIdentidad = new Map();
    rows.forEach(r=> porIdentidad.set(`${r.sku_code}::${r.bodega||''}`, r));
    // No mostrar materiales que ya están en el grupo (reportado por Joel: al volver a buscar,
    // seguían apareciendo como candidatos ofreciendo agregarlos de nuevo) -- se compara por
    // código+bodega contra los miembros ya cargados del grupo abierto.
    const yaMiembros = new Set((state.grupos.miembros||[]).map(m=>`${m.sku_code}::${m.bodega||''}`));
    state.grupos.candidatos = Array.from(porIdentidad.values())
      .filter(c=> !yaMiembros.has(`${c.sku_code}::${c.bodega||''}`))
      .slice(0,30);
    state.grupos.buscandoCandidatos = false;
    actualizarResultadosCandidatosGrupoEnPantalla();
  }catch(e){
    if(miPeticion !== candidatosGrupoPeticionId) return;
    state.grupos.buscandoCandidatos = false;
    actualizarResultadosCandidatosGrupoEnPantalla();
    toast(e.message,'err');
  }
}

async function agregarMiembroGrupo(sku_code, bodega){
  const grupoId = state.grupos.grupoAbierto;
  if(!grupoId || !perfilCargado()) return;
  try{
    await rest('/skus_grupos_conteo', {method:'POST', body:[{
      empresa_id: state.perfil.empresa_id, grupo_id: grupoId, sku_code, bodega: bodega||null,
    }], prefer:'return=minimal'});
    toast('Material agregado al grupo');
    // Ya quedó agregado: lo sacamos de los resultados de búsqueda de inmediato (sin esperar a una
    // nueva búsqueda) para que no siga apareciendo ahí ofreciendo agregarlo de nuevo -- a pedido
    // de Joel, que lo veía repetido en el listado de abajo después de agregarlo.
    state.grupos.candidatos = state.grupos.candidatos.filter(c=> !(c.sku_code===sku_code && (c.bodega||'')===(bodega||'')));
    actualizarResultadosCandidatosGrupoEnPantalla();
    cargarMiembrosGrupo(grupoId);
    cargarGrupos();
    cargarSeguimientoGrupo(grupoId);
  }catch(e){
    // Ya pertenece al grupo (índice único skus_grupos_conteo_unico) -- no es un error real para
    // la persona, solo lo avisamos sin ruido en vez del mensaje crudo de la base.
    toast(/skus_grupos_conteo_unico/i.test(e.message||'') ? 'Ese material ya está en el grupo' : e.message, 'err');
  }
}

async function quitarMiembroGrupo(miembroId){
  const grupoId = state.grupos.grupoAbierto;
  try{
    await rest(`/skus_grupos_conteo?id=eq.${miembroId}`, {method:'DELETE'});
    toast('Material quitado del grupo');
    cargarMiembrosGrupo(grupoId);
    cargarGrupos();
    cargarSeguimientoGrupo(grupoId);
  }catch(e){ toast(e.message,'err'); }
}

// Vista previa del plan por grupo (según su frecuencia): SOLO calcula y muestra -- no crea nada
// en plan_semanal todavía (ver conversación con Joel: primero se revisa el resultado antes de
// escribir cualquier cosa en Planificación/Calendario). "Vencido" = nunca contado, o contado
// hace más de la frecuencia del grupo -- ver skus.ultimo_conteo_fecha, ya usado en toda la app.
async function calcularVistaPreviaPlanGrupo(){
  const grupoId = state.grupos.grupoAbierto;
  const grupo = state.grupos.lista.find(g=>g.id===grupoId);
  if(!grupo || !grupo.frecuencia_dias) return;
  setState({grupos: {...state.grupos, vistaPreviaCalculando:true}});
  try{
    let filas;
    if(grupo.automatico_critico){
      // Automático: el universo ES skus.critico=true -- no hay membresía que cruzar aparte.
      filas = await rest(`/skus?activo=eq.true&critico=eq.true&select=sku_code,bodega,ubicacion,storage_bin,ultimo_conteo_fecha`) || [];
    }else{
      const miembros = await rest(`/skus_grupos_conteo?grupo_id=eq.${grupoId}&select=sku_code,bodega`) || [];
      filas = [];
      if(miembros.length){
        // Un mismo código puede repetirse en más de una bodega -- se piden todas las filas activas
        // de esos códigos y se filtra acá a las que de verdad son miembros (código+bodega exactos),
        // porque PostgREST no permite filtrar por pares (código,bodega) en un solo pedido.
        const codigos = Array.from(new Set(miembros.map(m=>m.sku_code)));
        const filasCrudas = await rest(`/skus?activo=eq.true&sku_code=in.(${codigos.map(c=>encodeURIComponent(c)).join(',')})&select=sku_code,bodega,ubicacion,storage_bin,ultimo_conteo_fecha`) || [];
        const clavesMiembros = new Set(miembros.map(m=>`${m.sku_code}::${m.bodega||''}`));
        filas = filasCrudas.filter(f=> clavesMiembros.has(`${f.sku_code}::${f.bodega||''}`));
      }
    }
    const limiteMs = Date.now() - grupo.frecuencia_dias*24*60*60*1000;
    const filasVencidas = filas.filter(f=> !f.ultimo_conteo_fecha || new Date(f.ultimo_conteo_fecha).getTime() < limiteMs);
    // Cupo semanal por capacidad real (a pedido de Joel), no un número puesto a ojo: personas
    // disponibles × horas que cuenta cada una a la semana × ritmo estimado de conteo (materiales
    // por hora). Si algún campo queda vacío/inválido, cae a 20 en vez de trabar el cálculo.
    const capacidad = Math.round((Number(state.grupos.personasDisponibles)||0) * (Number(state.grupos.horasPorPersona)||0) * (Number(state.grupos.ritmoPorHora)||0));
    const cupoSemanal = capacidad > 0 ? capacidad : 20;
    const semanas = armarVistaPreviaSemanasGrupo(filasVencidas, cupoSemanal);
    setState({grupos: {...state.grupos, vistaPreviaCalculando:false, vistaPreviaSemanas:semanas, vistaPreviaTotalPendientes:filasVencidas.length, vistaPreviaCupoUsado:cupoSemanal}});
  }catch(e){
    setState({grupos: {...state.grupos, vistaPreviaCalculando:false}});
    toast(e.message,'err');
  }
}

// Agrupa los materiales vencidos por bodega+ubicación (misma zona física = misma visita) y los
// reparte en semanas respetando un cupo. A pedido de Joel: PARTE una zona entre dos semanas
// cuando no cabe completa en lo que queda de cupo, en vez de dejarla entera en una sola semana --
// eso empareja el tamaño de las semanas, al costo de que la persona puede tener que volver a esa
// misma zona física la semana siguiente para terminarla. Dentro de cada zona (y de cada fragmento,
// si se parte), ordenados por storage bin -- ahí sigue el orden físico real de la bodega, según
// confirmó Joel, así que sirve como orden de recorrido sin inventar nada.
function armarVistaPreviaSemanasGrupo(filasVencidas, cupoSemanal){
  const zonas = new Map();
  filasVencidas.forEach(f=>{
    const clave = `${f.bodega||''}::${f.ubicacion||''}`;
    if(!zonas.has(clave)) zonas.set(clave, {bodega:f.bodega, ubicacion:f.ubicacion, materiales:[]});
    zonas.get(clave).materiales.push(f);
  });
  const zonasOrdenadas = Array.from(zonas.values()).sort((a,b)=>
    (a.bodega||'').localeCompare(b.bodega||'') || (a.ubicacion||'').localeCompare(b.ubicacion||''));
  zonasOrdenadas.forEach(z=> z.materiales.sort((a,b)=> (a.storage_bin||'').localeCompare(b.storage_bin||'')));

  const semanas = [];
  let semanaActual = null;
  zonasOrdenadas.forEach(z=>{
    let restante = z.materiales;
    while(restante.length){
      if(!semanaActual || semanaActual.materiales >= cupoSemanal){
        semanaActual = { materiales:0, zonas:[] };
        semanas.push(semanaActual);
      }
      // Al menos 1: si el cupo es más chico que un solo material (no debería pasar, pero por las
      // dudas) igual hay que avanzar, en vez de quedar en un loop infinito.
      const espacio = Math.max(1, cupoSemanal - semanaActual.materiales);
      const fragmento = restante.slice(0, espacio);
      restante = restante.slice(espacio);
      semanaActual.zonas.push({ bodega:z.bodega, ubicacion:z.ubicacion, materiales:fragmento });
      semanaActual.materiales += fragmento.length;
      // Esta semana quedó llena justo con este fragmento -- lo que sigue de la zona (si queda
      // algo) va forzado a una semana nueva, no a seguir de largo en la misma.
      if(restante.length) semanaActual = null;
    }
  });
  return semanas;
}

// Convierte la vista previa YA CALCULADA en entradas reales de plan_semanal -- una por zona (o
// fragmento de zona, si armarVistaPreviaSemanasGrupo la partió entre semanas) reutilizando
// crearPlanEntrada (misma función que usa el formulario manual de Planificación, con el mismo
// refresco de plan/calendario) en vez de escribir la tabla a mano. Cubre SOLO los materiales del
// grupo en esa zona: se pide el universo completo (skusDeUbicacion, la misma función que ya usa
// Planificación) y se excluye todo lo que NO sea del grupo -- igual mecánica que "Storage bin"
// con SKU puntuales en el formulario manual (ver el submit de #form-plan). Sin responsable
// asignado -- a pedido de Joel, el reparto entre personas queda manual.
//
// Bug real encontrado con datos de Escondida: un grupo con pocos materiales (ej. "5S", 9 SKU)
// puede tener todos esos materiales desperdigados en una bodega+ubicación con decenas de miles de
// SKU (B501/0100 tiene 32.711 activos). Excluir "todo lo que no sea del grupo" ahí generaba una
// lista de más de 30.000 códigos -- que después, al leerla de vuelta en Contar, Supabase la
// rechazaba con 431 "Request Header Fields Too Large" (confirmado en terreno). La entrada se creaba
// pero quedaba inservible. Fix: cuando la bodega+ubicación son conocidas, la entrada se acota al
// storage bin puntual de cada material (igual mecánica que ya usa "Storage bin" en el formulario
// manual) -- ahí el universo a excluir es solo lo que comparte ESE bin (decenas, no decenas de
// miles). Los pocos materiales sin storage bin cargado siguen la lógica anterior (exclusión sobre
// toda la bodega+ubicación), con un tope de seguridad (LIMITE_EXCLUSIONES_PLAN_AUTOMATICO): si el
// universo a excluir lo supera, esa entrada se omite (avisando) en vez de crear una que después no
// se pueda leer.
async function confirmarVistaPreviaComoPlan(){
  const g = state.grupos;
  const grupo = g.lista.find(x=>x.id===g.grupoAbierto);
  if(!grupo || !g.vistaPreviaSemanas || !g.vistaPreviaSemanas.length || !perfilCargado()) return;

  const totalZonas = g.vistaPreviaSemanas.reduce((n,s)=>n+s.zonas.length, 0);
  const totalMateriales = g.vistaPreviaSemanas.reduce((n,s)=>n+s.materiales, 0);
  const nota = `Generado automáticamente por el grupo "${grupo.nombre}"`;
  // Si ya existen entradas de una generación anterior de este mismo grupo, avisar y ofrecer
  // reemplazarlas antes de crear las nuevas. Bug real reportado por Joel: regenerar el plan de un
  // grupo (ej. "Críticos") sin borrar antes las entradas de la generación previa las deja
  // conviviendo con las nuevas -- ambas cubren el mismo SKU, así que Planificación (que suma el
  // universo por entrada) muestra el doble de lo que corresponde para ese día, aunque el
  // Calendario siga mostrando el pendiente correcto (deduplica por SKU en el servidor). No se
  // borra nada sin preguntar: si la persona cancela acá, no se crea nada nuevo tampoco, para no
  // dejarlas conviviendo con las viejas. Reusa grupo.entradasPlan (ya cargado por cargarGrupos, ver
  // más arriba) en vez de otro viaje al servidor -- se llega acá siempre desde la lista de Grupos,
  // así que ya viene fresco.
  const previas = grupo.entradasPlan || 0;
  const avisoPrevias = previas
    ? ` Ya existen ${previas} entrada${previas===1?'':'s'} de una generación anterior de este grupo -- se eliminarán antes de crear las nuevas, para no duplicar el SKU a contar.`
    : '';
  if(!confirm(`¿Crear ${totalZonas} entrada${totalZonas===1?'':'s'} de planificación para "${grupo.nombre}" (${totalMateriales} material${totalMateriales===1?'':'es'})? Quedan sin responsable asignado -- lo repartes tú después.${avisoPrevias}`)) return;
  if(previas){
    try{ await rest(`/plan_semanal?nota=eq.${encodeURIComponent(nota)}`, {method:'DELETE', prefer:'return=minimal'}); }
    catch(e){ toast('No se pudieron eliminar las entradas anteriores: '+e.message, 'err'); return; }
  }

  // Barra de progreso (a pedido de Joel: con un grupo grande -- ej. "Críticos" con cientos de
  // storage bin distintos -- esto tarda varios minutos, uno por uno, y sin nada en pantalla más
  // que "Creando…" parece trabado). El total de pasos es el mismo conteo (1 por zona sin
  // ubicación/bodega+ubicación nula, o 1 por storage bin distinto dentro de una zona conocida)
  // que hace el loop de más abajo -- se precalcula acá para no duplicar la lógica de conteo con
  // la de creación real.
  let pasosTotales = 0;
  g.vistaPreviaSemanas.forEach(semana => semana.zonas.forEach(z=>{
    const bodegaConocida = z.bodega!==null && z.bodega!==undefined;
    const sinUbicacionEspecifica = !bodegaConocida && !z.ubicacion || bodegaConocida && !z.ubicacion;
    pasosTotales += sinUbicacionEspecifica ? 1 : new Set(z.materiales.map(m=>m.storage_bin||'')).size;
  }));
  setState({grupos: {...state.grupos, generandoPlan:true, progresoPlan:{hechos:0, total:pasosTotales}}});
  const inicioHoy = inicioSemana(new Date());
  try{
    let creadas = 0;
    let materialesOmitidos = 0;
    let entradasFallidas = 0;
    const avanzarProgreso = () => setState({grupos: {...state.grupos, progresoPlan: {...state.grupos.progresoPlan, hechos: state.grupos.progresoPlan.hechos+1}}});
    // crearPlanEntrada se llama en silencioso:true acá -- puede ser una llamada por cada storage
    // bin del grupo (varias decenas), así que muestra su propio toast/refresca Planificación y
    // Calendario UNA sola vez al final, no una vez por bin. Un error de un bin puntual (ver más
    // abajo el caso real: sku_code repetido por tener más de un batch en el mismo bin, que sin
    // deduplicar violaba la restricción única de plan_semanal_exclusiones) no aborta el resto --
    // se cuenta aparte y se avisa en el resumen final, en vez de perder lo demás.
    for(let i=0; i<g.vistaPreviaSemanas.length; i++){
      const fecha = fechaISO(sumarDias(inicioHoy, i*7));
      for(const z of g.vistaPreviaSemanas[i].zonas){
        // bodega null (skus.bodega IS NULL) se manda como '' -- convención de esta app para
        // distinguir "el grupo sin bodega asignada" de "sin filtro, cualquier bodega" (ver
        // filtroBodega/BODEGA_VACIA, ya usado en Planificación manual).
        const bodegaConocida = z.bodega!==null && z.bodega!==undefined;
        const bodegaParaZona = bodegaConocida ? z.bodega : '';
        // Sin bodega Y sin ubicación: ya cubierto de forma segura por el mecanismo existente
        // "SKU sin ubicación" (soloSinUbicacion). Bodega conocida pero sin ubicación específica
        // dentro de ella (a pedido de Joel: antes esta zona quedaba fuera del plan real): necesita
        // el filtro explícito "ubicación IS NULL" (ubicacionEsNula) -- sin él, pedir el universo
        // de solo la bodega traería TODAS sus ubicaciones, justo lo que hacía insegura a esta
        // zona antes. Ninguno de estos dos casos llega a los volúmenes de "bodega+ubicación
        // completa" que motivaron el límite de abajo, así que siguen con exclusión de zona.
        const sinBodegaNiUbicacion = !bodegaConocida && !z.ubicacion;
        const ubicacionEsNula = bodegaConocida && !z.ubicacion;
        if(sinBodegaNiUbicacion || ubicacionEsNula){
          const universo = await skusDeUbicacion({
            bodega: bodegaParaZona, ubicacion:'', storage_bin:'', excluidos:[],
            soloSinUbicacion: sinBodegaNiUbicacion, ubicacionEsNula, campos:'id,sku_code,storage_bin',
          });
          const codigosDelGrupo = new Set(z.materiales.map(m=>m.sku_code));
          // Set: un código ajeno al grupo puede aparecer más de una vez en el universo (más de un
          // batch en la misma bodega+ubicación) -- sin deduplicar, se manda dos veces el mismo
          // sku_code en el mismo POST a plan_semanal_exclusiones y viola su restricción única.
          const skusExcluidos = [...new Set(universo.map(s=>s.sku_code).filter(code=>!codigosDelGrupo.has(code)))];
          if(skusExcluidos.length > LIMITE_EXCLUSIONES_PLAN_AUTOMATICO){ materialesOmitidos += z.materiales.length; avanzarProgreso(); continue; }
          try{
            await crearPlanEntrada({
              fecha, bodega: bodegaParaZona, ubicacion: null, storageBins:[], skusExcluidos,
              soloSinUbicacion: sinBodegaNiUbicacion, ubicacionEsNula, cicloId:'', responsableId:'',
              nota: `Generado automáticamente por el grupo "${grupo.nombre}"`, silencioso:true,
            });
            creadas++;
          }catch(e){ entradasFallidas++; }
          avanzarProgreso();
          continue;
        }
        // Bodega+ubicación conocidas: una entrada POR storage bin (no una para toda la
        // bodega+ubicación) -- ver el bug real explicado arriba. Los materiales del grupo sin
        // storage bin cargado quedan en su propio grupo ('' como clave) y siguen la exclusión de
        // zona completa, con el tope de seguridad.
        const porBin = new Map();
        z.materiales.forEach(m=>{
          const bin = m.storage_bin || '';
          if(!porBin.has(bin)) porBin.set(bin, []);
          porBin.get(bin).push(m);
        });
        // El universo de TODOS los bins de la zona se pide en una sola consulta (in.(...), solo
        // id/código/bin) y se reparte por bin; después cada entrada recibe su universo ya conocido
        // para no volver a pedirlo al guardar la foto. Antes eran dos consultas de 15 columnas por
        // bin: con datos reales, un grupo de 322 entradas hacía cerca de 1.000 viajes al servidor.
        const baseZona = {bodega: bodegaParaZona, ubicacion: z.ubicacion, excluidos:[]};
        let universosPorBin = new Map();
        try{ universosPorBin = await skusDeUbicacionPorBins(baseZona, [...porBin.keys()]); }
        catch(e){ entradasFallidas += porBin.size; for(let k=0; k<porBin.size; k++) avanzarProgreso(); continue; }
        for(const [bin, materialesBin] of porBin){
          const universoBin = bin
            ? (universosPorBin.get(bin) || [])
            : await skusDeUbicacion({...baseZona, storage_bin:'', campos:'id,sku_code,storage_bin'});
          const codigosBin = new Set(materialesBin.map(m=>m.sku_code));
          const skusExcluidosBin = [...new Set(universoBin.map(s=>s.sku_code).filter(code=>!codigosBin.has(code)))];
          if(skusExcluidosBin.length > LIMITE_EXCLUSIONES_PLAN_AUTOMATICO){ materialesOmitidos += materialesBin.length; avanzarProgreso(); continue; }
          try{
            await crearPlanEntrada({
              fecha, bodega: bodegaParaZona, ubicacion: z.ubicacion, storageBins: bin ? [bin] : [], skusExcluidos: skusExcluidosBin,
              soloSinUbicacion:false, ubicacionEsNula:false, cicloId:'', responsableId:'',
              nota: `Generado automáticamente por el grupo "${grupo.nombre}"`, silencioso:true,
              universoConocido: bin ? universoBin : undefined,
            });
            creadas++;
          }catch(e){ entradasFallidas++; }
          avanzarProgreso();
        }
      }
    }
    if(creadas){ cargarPlanSemanal(); refrescarOpcionesUbicacion(); invalidarCalendario(); }
    const avisoOmitidos = materialesOmitidos ? ` -- ${materialesOmitidos} material${materialesOmitidos===1?'':'es'} no se pudo${materialesOmitidos===1?'':'ieron'} planificar (ubicación demasiado grande sin storage bin: cárgaselo y probá de nuevo)` : '';
    const avisoFallidas = entradasFallidas ? ` -- ${entradasFallidas} entrada${entradasFallidas===1?'':'s'} ${entradasFallidas===1?'falló':'fallaron'} al guardarse, probá de nuevo` : '';
    toast(`Plan generado: ${creadas} entrada${creadas===1?'':'s'} creada${creadas===1?'':'s'}${avisoOmitidos}${avisoFallidas}`, (materialesOmitidos || entradasFallidas) ? 'warn' : undefined);
    setState({grupos: {...state.grupos, generandoPlan:false, progresoPlan:null, vistaPreviaSemanas:null, vistaPreviaTotalPendientes:0}});
  }catch(e){
    setState({grupos: {...state.grupos, generandoPlan:false, progresoPlan:null}});
    toast(e.message,'err');
  }
}

/* =======================================================================
   VERIFICACIÓN EN DOS PASOS (MFA/TOTP) -- Configuraciones
   ======================================================================= */
// Trae los factores TOTP de la cuenta (verificados o no) desde /auth/v1/user, para mostrar el
// estado real en renderSeccionMfa. Se pide solo al entrar a Configuraciones (ver bind()), no en
// cada carga de la app.
async function cargarMfaFactores(){
  state.mfaFactoresCargado = true;
  try{
    const usuario = await authFetch('/user');
    setState({mfaFactores: (usuario && usuario.factors) || []});
  }catch(e){ /* si falla, no se muestra el estado -- no bloquea nada más de Configuraciones */ }
}

// Paso 1 de 2 del enrolamiento: pide un factor TOTP nuevo (queda "unverified" hasta confirmarlo
// con un código real, ver confirmarEnrolamientoMfa) y muestra el QR + secreto para escanear.
async function iniciarEnrolamientoMfa(){
  setState({mfaEnrolando:{factorId:null, qr:null, secret:null, guardando:false, error:null, cargando:true}});
  try{
    const factor = await authFetch('/factors', {method:'POST', body:{factor_type:'totp'}});
    setState({mfaEnrolando:{factorId:factor.id, qr:(factor.totp&&factor.totp.qr_code)||null, secret:(factor.totp&&factor.totp.secret)||null, guardando:false, error:null, cargando:false}});
  }catch(e){
    setState({mfaEnrolando:null});
    toast(e.message,'err');
  }
}

function cancelarEnrolamientoMfa(){
  const factorId = state.mfaEnrolando && state.mfaEnrolando.factorId;
  setState({mfaEnrolando:null});
  // El factor recién creado queda "unverified" en la cuenta si se cancela a mitad de camino --
  // se borra para no dejar un factor fantasma que confunda un futuro intento de enrolar.
  if(factorId) authFetch(`/factors/${factorId}`, {method:'DELETE'}).catch(()=>{});
}

// Paso 2 de 2: confirma que la persona sí configuró bien su app autenticadora. Si el código es
// válido, el factor pasa a "verified" y queda activo desde ya -- de paso sube la sesión actual a
// aal2 (la respuesta de /verify es una sesión nueva, igual que al iniciar sesión).
async function confirmarEnrolamientoMfa(codigo){
  const en = state.mfaEnrolando;
  if(!en || !en.factorId) return;
  setState({mfaEnrolando:{...en, guardando:true, error:null}});
  try{
    const desafio = await authFetch(`/factors/${en.factorId}/challenge`, {method:'POST'});
    const sesion = await authFetch(`/factors/${en.factorId}/verify`, {method:'POST', body:{challenge_id: desafio.id, code: codigo}});
    if(sesion && sesion.access_token){ state.session = sesion; guardarSesion(sesion); }
    setState({mfaEnrolando:null});
    toast('Verificación en dos pasos activada');
    await cargarMfaFactores();
  }catch(e){
    setState({mfaEnrolando:{...state.mfaEnrolando, guardando:false, error: e.message}});
  }
}

async function desactivarMfa(factorId){
  if(!confirm('¿Desactivar la verificación en dos pasos? Tu cuenta volverá a pedir solo la contraseña la próxima vez que inicies sesión.')) return;
  try{
    await authFetch(`/factors/${factorId}`, {method:'DELETE'});
    toast('Verificación en dos pasos desactivada');
    await cargarMfaFactores();
  }catch(e){ toast(e.message,'err'); }
}

  render();
  try{
    const filtro = state.auditoria.filtroTabla ? `&tabla=eq.${state.auditoria.filtroTabla}` : '';
    const filas = await rest(`/auditoria?select=id,tabla,accion,actor_nombre,datos_antes,datos_despues,creado_en&order=creado_en.desc&limit=${TAM_PAGINA_AUDITORIA}&offset=${state.auditoria.filas.length}${filtro}`);
    state.auditoria.filas = state.auditoria.filas.concat(filas||[]);
    state.auditoria.hayMas = (filas||[]).length === TAM_PAGINA_AUDITORIA;
  }catch(e){ toast(e.message,'err'); }
  state.auditoria.cargandoMas = false;
  render();
}

// Guarda para acciones de escritura que necesitan el perfil (empresa_id, usuario_id, etc.)
// ya cargado. Si por algún motivo la sesión existe pero el perfil no se pudo cargar (cuenta
// sin empresa asignada, corte de red al iniciar, etc.), evita que la acción crashee con un
// error crudo (`Cannot read properties of null`) y en su lugar avisa con un mensaje claro.
function perfilCargado(){
  if(!state.perfil){
    toast('No se pudo cargar tu perfil. Cierra sesión y vuelve a entrar; si el problema sigue, contacta al administrador.', 'err');
    return false;
  }
  return true;
}

// Caché local de "mi plan del día" (solo eso, no el universo completo de SKU de la empresa —
// acá puede llegar a 50 mil+ filas, invivible para guardar en el dispositivo): permite que quien
// cuenta siga viendo su plan y su checklist de SKU pendientes aunque se corte la señal justo al
// abrir la app o al cambiar de bodega/ubicación, usando la última copia que se alcanzó a bajar
// con conexión. Guardada por usuario (localStorage es por navegador/dispositivo, no por sesión)
// para no mezclar el plan de una cuenta con el de otra en un equipo compartido.
const PLAN_DIA_CACHE_KEY = 'plan_dia_cache';
function claveSeleccionPlanDia(bodega, ubicacion){ return `${bodega||''}||${ubicacion||''}`; }
function leerPlanDiaCache(usuarioId){
  try{ return (JSON.parse(localStorage.getItem(PLAN_DIA_CACHE_KEY)||'{}'))[usuarioId] || null; }catch(e){ return null; }
}
function guardarPlanDiaCache(usuarioId, datos){
  try{
    const todo = JSON.parse(localStorage.getItem(PLAN_DIA_CACHE_KEY)||'{}');
    todo[usuarioId] = datos;
    localStorage.setItem(PLAN_DIA_CACHE_KEY, JSON.stringify(todo));
  }catch(e){ /* localStorage no disponible (modo privado, etc.) */ }
}
// Al refrescar las entradas del día se conservan las selecciones (checklists por bodega/ubicación)
// ya cacheadas para ESE mismo día — son válidas igual y perderlas de encima haría inútil el
// respaldo si justo se corta la señal entre cargar las entradas y elegir la cascada.
function guardarPlanDiaCacheBase(usuarioId, fecha, entradas){
  const anterior = leerPlanDiaCache(usuarioId);
  const selecciones = (anterior && anterior.fecha===fecha) ? anterior.selecciones : {};
  guardarPlanDiaCache(usuarioId, {fecha, entradas, selecciones});
}
function guardarSeleccionPlanDiaCache(usuarioId, fecha, bodega, ubicacion, skus){
  const actual = leerPlanDiaCache(usuarioId);
  if(!actual || actual.fecha!==fecha) return; // sin base de ese día cacheada: nada que asociarle
  const selecciones = {...(actual.selecciones||{}), [claveSeleccionPlanDia(bodega, ubicacion)]: skus};
  guardarPlanDiaCache(usuarioId, {...actual, selecciones});
}
function leerSeleccionPlanDiaCache(usuarioId, fecha, bodega, ubicacion){
  const actual = leerPlanDiaCache(usuarioId);
  if(!actual || actual.fecha!==fecha) return null;
  return (actual.selecciones && actual.selecciones[claveSeleccionPlanDia(bodega, ubicacion)]) || null;
}

// "Mi plan del día" en Contar: qué le corresponde hoy (o el día elegido) a la cuenta
// logueada — responsable_id en plan_semanal ya es directamente el id de la cuenta.
async function cargarPlanDeHoy(fecha){
  if(!state.perfil) return;
  setState({contarPlan:{...state.contarPlan, fecha, cargando:true, entradas:[], bodega:'', ubicacion:'', skusPendientes:null, desdeCache:false}});
  try{
    const entradas = await rest(`/plan_semanal_detalle?fecha=eq.${fecha}&responsable_id=eq.${state.perfil.id}&order=bodega.asc,ubicacion.asc,storage_bin.asc`) || [];
    setState({contarPlan:{...state.contarPlan, cargado:true, cargando:false, fecha, entradas, desdeCache:false}});
    guardarPlanDiaCacheBase(state.perfil.id, fecha, entradas);
  }catch(e){
    if(pareceFalloDeRed(e)){
      const cache = leerPlanDiaCache(state.perfil.id);
      if(cache && cache.fecha===fecha){
        setState({contarPlan:{...state.contarPlan, cargado:true, cargando:false, fecha, entradas:cache.entradas||[], desdeCache:true}});
        return;
      }
    }
    toast(e.message,'err');
    // Bug real reportado por Joel (cuenta de Nasib): entrar a Contar en un momento de mala señal
    // (sitio minero) hacía fallar este fetch y, sin caché offline con qué recuperarse, quedaba
    // marcado cargado:true igual -- la lista se veía vacía como si "nada estuviera planificado" Y
    // encima el resguardo contra recursión en bind() (state.view==='conteo') ya no volvía a
    // intentarlo solo, porque para él ya estaba "cargado". Cambiar de día y volver al mismo
    // "arreglaba" porque el <select> de fecha llama a cargarPlanDeHoy() directo, sin pasar por ese
    // resguardo. No marcar cargado acá (igual que cargarCalendario en su catch) deja que la
    // próxima vez que se entre a la pestaña Contar lo vuelva a intentar solo.
    setState({contarPlan:{...state.contarPlan, cargando:false}});
  }
}

// De las entradas de hoy, cuáles corresponden a la bodega/ubicación elegidas en los <select> en
// cascada (o la entrada "SKU sin ubicación", un caso aparte que no cascadea). Sin filtro de
// storage bin: puede haber más de una entrada para la misma bodega+ubicación (una por bin) — se
// devuelven todas para juntar sus SKU pendientes, en vez de obligar a elegir el bin exacto.
function entradasActivasContar(cp){
  if(cp.bodega === BODEGA_SIN_UBICACION) return cp.entradas.filter(e=>e.solo_sin_ubicacion);
  if(!cp.bodega) return [];
  // BODEGA_VACIA (grupo "Sin bodega asignada" del <select>) representa las entradas con
  // bodega==='' (bodega IS NULL, pero con ubicación específica) — hay que traducir el sentinel
  // de vuelta antes de comparar contra el valor real guardado en la entrada.
  const bodegaCoincide = e => cp.bodega===BODEGA_VACIA ? e.bodega==='' : e.bodega===cp.bodega;
  return cp.entradas.filter(e=> !e.solo_sin_ubicacion && bodegaCoincide(e) && (e.ubicacion||'')===cp.ubicacion);
}

// SKU que se planificaron para una bodega/ubicación/bin determinados, pero que una carga masiva
// posterior les cambió alguno de esos datos: si ya no coinciden con ninguna entrada activa de
// este bodega+ubicación, desaparecerían silenciosamente del plan del día. Se resuelven acá
// cruzando la foto guardada al planificar (plan_semanal_skus) contra los datos actuales de cada
// SKU, y se devuelven marcados con qué cambió para poder avisar en vez de perderlos. `entradas`
// debe venir ya acotado a las que tienen bin específico (ver elegirCascadaContar y
// crearPlanEntrada): solo esas guardan la foto, porque el universo de SKU de una entrada sin bin
// (bodega+ubicación completa) puede ser demasiado grande para snapshotearlo.
async function skusMovidosDeEntradas(entradas, binesActivos){
  if(!entradas.length) return [];
  // Una sola consulta para todas las entradas (antes era una por entrada). Paginada por si un día
  // con muchas entradas junta más de 1.000 filas de foto: sin eso PostgREST cortaría en silencio.
  // Los plan_id van en la URL (in.(...)): de a 100 por consulta para que un día con cientos de
  // entradas con bin nunca arme una URL que el servidor rechace (mismo cuidado que los DELETE
  // en lote de pausarGrupo).
  const ids = entradas.map(e=>e.id);
  const tandas = [];
  for(let i=0; i<ids.length; i+=100) tandas.push(ids.slice(i, i+100));
  const snapshots = (await Promise.all(tandas.map(t=>
    restTodo(`/plan_semanal_skus?plan_id=in.(${t.join(',')})&select=sku_code,sku_id,storage_bin_original,bodega_original,ubicacion_original`)
  ))).flat();
  // sku_code NO identifica una ubicación única: el mismo material puede tener stock repartido en
  // más de una bodega/ubicación a la vez (bug real reportado por Joel — "me parece excesivo" con
  // ~45% de un plan marcado como movido a horas de haberlo creado, sin ninguna carga masiva de por
  // medio). Comparar solo por código traía TODAS las filas de ese código, incluida una ubicación
  // que nunca tuvo nada que ver con este plan, y la marcaba como "movida". sku_id (agregado acá)
  // identifica la fila exacta que se snapshoteó; se compara por ahí siempre que esté disponible.
  // Fotos viejas (creadas antes de esta columna) no tienen cómo backfillearse sin ambigüedad si el
  // código tenía más de una ubicación en ese momento, así que esas siguen cayendo al comparador por
  // código de antes (mejor que nada, igual que se comportaban hasta ahora).
  const porId = new Map(), porCodigo = new Map();
  snapshots.forEach(s=>{
    if(s.sku_id){ if(!porId.has(s.sku_id)) porId.set(s.sku_id, s); }
    else{ if(!porCodigo.has(s.sku_code)) porCodigo.set(s.sku_code, s); }
  });
  if(!porId.size && !porCodigo.size) return [];
  const campos = 'id,sku_code,descripcion,bodega,ubicacion,storage_bin,batch,unidad_medida,stock_sistema,critico,clase_abc,stock_bloqueado,stock_transito_1,stock_transito_2,stock_transferencia';
  const [actualesPorId, actualesPorCodigo] = await Promise.all([
    porId.size ? rest(`/skus_planificables?activo=eq.true&select=${campos}&id=in.(${[...porId.keys()].join(',')})`) : Promise.resolve([]),
    porCodigo.size ? rest(`/skus_planificables?activo=eq.true&select=${campos}&sku_code=in.(${[...porCodigo.keys()].map(c=>encodeURIComponent(c)).join(',')})`) : Promise.resolve([]),
  ]);
  const evaluar = (s, o) => {
    // Fotos guardadas antes de que existieran estas dos columnas (plan planificado antes de este
    // aviso) quedan con ambas en null — ahí no hay con qué comparar bodega/ubicación, así que no
    // se puede saber si "cambiaron": tratarlo como si sí hubiera cambiado (null → cualquier dato)
    // mostraría el aviso en TODOS los SKU de ese plan viejo aunque nada se haya movido.
    const tieneOriginalBodegaUbicacion = !!(o.bodega_original || o.ubicacion_original);
    const cambioBodega = tieneOriginalBodegaUbicacion && (s.bodega||null) !== (o.bodega_original||null);
    const cambioUbicacion = tieneOriginalBodegaUbicacion && (s.ubicacion||null) !== (o.ubicacion_original||null);
    const cambioBin = s.storage_bin !== o.storage_bin_original;
    // Un cambio de solo bin, dentro de la misma bodega+ubicación, ya aparece solo si el bin
    // nuevo es otro de los activos para esta entrada — no hace falta "recuperarlo" acá.
    if(!cambioBodega && !cambioUbicacion && (!cambioBin || binesActivos.has(s.storage_bin))) return null;
    return {...s, bodegaOriginal:o.bodega_original, ubicacionOriginal:o.ubicacion_original, binOriginal:o.storage_bin_original, cambioBodega, cambioUbicacion, cambioBin};
  };
  return [
    ...(actualesPorId||[]).map(s=> evaluar(s, porId.get(s.id))),
    ...(actualesPorCodigo||[]).map(s=> evaluar(s, porCodigo.get(s.sku_code))),
  ].filter(Boolean);
}

// Texto de la advertencia para un SKU recuperado por skusMovidosDeEntradas: si cambió de bodega
// o ubicación, eso es lo relevante para el conteo (importa más que el bin); si solo cambió de
// bin dentro de la misma bodega+ubicación, se avisa puntualmente de eso.
function describirCambioPlan(s){
  if(s.cambioBodega || s.cambioUbicacion){
    const antes = [s.bodegaOriginal, s.ubicacionOriginal].filter(Boolean).join(' · ') || 'sin ubicación asignada';
    const ahora = [s.bodega, s.ubicacion].filter(Boolean).join(' · ') || 'sin ubicación asignada';
    return `Cambió de ubicación: se planificó en ${esc(antes)}, ahora está en ${esc(ahora)}`;
  }
  return `Cambió de bin: se planificó en ${esc(s.binOriginal)}, ahora está en ${esc(s.storage_bin||'sin bin')}`;
}

async function elegirCascadaContar(cambios){
  const cp = {...state.contarPlan, ...cambios, skusPendientes:null, desdeCache:false};
  setState({contarPlan: cp});
  const activas = entradasActivasContar(cp);
  if(!activas.length) return;
  try{
    // Cada entrada puede tener su propio storage_bin y su propia lista de exclusiones (una fila
    // por bin) — el servidor resuelve cada una por separado y las devuelve juntas en UNA sola
    // respuesta (ver universoEntradasPlanContar); acá se juntan sin duplicar SKU (puede repetirse
    // si dos entradas de distinto bin comparten alguno). Se deduplica por id, no por sku_code: un
    // mismo código puede tener más de una fila pendiente (una por batch), y deduplicar por código
    // dejaría solo la primera, ocultando el resto de los batches.
    const porEntrada = await universoEntradasPlanContar(activas.map(e=>e.id));
    const vistos = new Set();
    const skus = [];
    activas.forEach(e=> (porEntrada[e.id]||[]).forEach(s=>{ if(!vistos.has(s.id)){ vistos.add(s.id); skus.push(s); } }));

    // Solo entradas CON bin específico: el universo de SKU a snapshotear queda acotado a lo que
    // hay en ese bin (chico), a diferencia de una entrada sin bin (bodega+ubicación completa),
    // que puede cubrir miles de SKU y volvería impracticable guardar la foto de todos.
    const entradasConBin = activas.filter(e=>!e.solo_sin_ubicacion && e.storage_bin);
    if(entradasConBin.length){
      const binesActivos = new Set(activas.map(e=>e.storage_bin).filter(Boolean));
      const excluidos = new Set(activas.flatMap(e=>e.skus_excluidos||[]));
      const movidos = await skusMovidosDeEntradas(entradasConBin, binesActivos);
      movidos.forEach(s=>{ if(!vistos.has(s.id) && !excluidos.has(s.sku_code)){ vistos.add(s.id); skus.push(s); } });
    }

    skus.sort((a,b)=> (a.storage_bin||'').localeCompare(b.storage_bin||'') || a.sku_code.localeCompare(b.sku_code));
    setState({contarPlan:{...state.contarPlan, skusPendientes: skus, desdeCache:false}});
    if(state.perfil) guardarSeleccionPlanDiaCache(state.perfil.id, cp.fecha, cp.bodega, cp.ubicacion, skus);
  }catch(e){
    if(pareceFalloDeRed(e) && state.perfil){
      const cache = leerSeleccionPlanDiaCache(state.perfil.id, cp.fecha, cp.bodega, cp.ubicacion);
      if(cache){
        setState({contarPlan:{...state.contarPlan, skusPendientes: cache, desdeCache:true}});
        return;
      }
    }
    toast(e.message,'err');
  }
}

// silencioso: usado por confirmarVistaPreviaComoPlan, que llama esta función UNA VEZ POR STORAGE
// BIN del grupo (puede ser varias decenas) -- sin este flag, cada llamada mostraría su propio
// toast de éxito y dispararía su propio refresco de Planificación/Calendario, multiplicado por
// cada bin (lento y spam de toasts encimados). En silencioso, un error se relanza en vez de
// mostrarse acá, para que el llamador lo cuente en su propio resumen final.
// skusIncluidos (opcional): lista explícita [{id, sku_code}] elegida buscando por código (ver
// agregarPlanPorSku). La entrada queda con por_sku=true y cubre exactamente esos SKU
// (plan_semanal_incluidos), sin cascada de bins, exclusiones ni foto de universo.
// universoConocido (opcional): filas {id, sku_code, storage_bin} del universo de los bins de esta
// entrada, si quien llama ya las pidió (generador de Grupos): evita volver a pedirlas para la foto.
async function crearPlanEntrada({fecha, bodega, ubicacion, storageBins, skusExcluidos, responsableId, nota, soloSinUbicacion, ubicacionEsNula, cicloId, silencioso, skusIncluidos, universoConocido}){
  if(!fecha){ if(!silencioso) toast('Elige una fecha','err'); return; }
  if(!perfilCargado()) return;
  // "SKU sin ubicación" es una sola entrada (no tiene bodega/ubicación/bin que cascadear). Lo
  // mismo para "ubicación nula" (bodega conocida, sin ubicación específica dentro de ella).
  const porSku = !!(skusIncluidos && skusIncluidos.length);
  const sinCascada = soloSinUbicacion || ubicacionEsNula;
  // Por código tampoco cascadea por bin (la lista ya es exacta), pero conserva bodega/ubicación
  // para que Contar encuentre la entrada con su selector habitual.
  const bins = (sinCascada || porSku) ? [null] : ((storageBins && storageBins.length) ? storageBins : [null]);
  try{
    const filas = await rest('/plan_semanal', {method:'POST', body: bins.map(bin=>({
      fecha,
      // bodega puede llegar en '' a propósito (grupo "Sin bodega asignada": bodega IS NULL,
      // pero con ubicación específica) — no colapsarlo a null con `||`, eso lo confundiría
      // con el comodín "sin restricción de bodega" (bodega==null/undefined desde el llamador).
      bodega: soloSinUbicacion ? null : (bodega==null ? null : bodega),
      ubicacion: sinCascada ? null : (ubicacion||null),
      storage_bin: (sinCascada || porSku) ? null : (bin||null),
      solo_sin_ubicacion: !!soloSinUbicacion,
      ubicacion_nula: !!ubicacionEsNula,
      por_sku: porSku,
      // Sin período elegido, el trigger asignar_ciclo_plan_semanal la deja en el ciclo
      // marcado como actual (igual que ya pasa con los conteos).
      ciclo_id: cicloId||null,
      responsable_id: responsableId||null, nota: nota||null, usuario_id: state.perfil ? state.perfil.id : null,
      empresa_id: state.perfil.empresa_id,
    })), prefer:'return=representation', timeoutMs: UMBRAL_ABORTAR_GUARDADO_MS});
    // Sin storage bin cargado, Storage bin ofrece elegir SKU puntuales en vez de bins (ver
    // cargarBinsPara) — elegir algunos ahí significa "solo estos", así que el resto se manda
    // como exclusión de la única entrada creada (misma tabla que usa excluirSkuDePlan).
    if(porSku && filas && filas.length){
      await rest('/plan_semanal_incluidos', {method:'POST', body: filas.flatMap(f=>skusIncluidos.map(s=>({plan_id:f.id, sku_id:s.id, sku_code:s.sku_code}))), prefer:'return=minimal', timeoutMs: UMBRAL_ABORTAR_GUARDADO_MS});
    }
    if(!porSku && skusExcluidos && skusExcluidos.length && filas && filas.length){
      await rest('/plan_semanal_exclusiones', {method:'POST', body: filas.flatMap(f=>skusExcluidos.map(sku_code=>({plan_id:f.id, sku_code}))), prefer:'return=minimal', timeoutMs: UMBRAL_ABORTAR_GUARDADO_MS});
    }
    // Foto del universo de SKU capturado al planificar, por entrada CON bin específico (el
    // universo queda acotado a lo que hay en ese bin): permite detectar más adelante (ver
    // skusMovidosDeEntradas) si una carga masiva posterior movió alguno a otro bin, bodega o
    // ubicación, para no perderlo silenciosamente del plan del día. Una entrada sin bin (toda
    // una bodega+ubicación) puede cubrir miles de SKU, así que no se le guarda esta foto — el
    // costo de escribirla no compensa frente a lo poco frecuente del caso que resuelve.
    if(!porSku && !soloSinUbicacion && filas && filas.length){
      const conBin = filas.filter(f=>f.storage_bin);
      if(conBin.length){
        // Todas las filas comparten bodega+ubicación (una entrada = una cascada): los bins van en
        // UNA consulta (in.(...)) con solo id/código/bin, no una consulta con 15 columnas por bin.
        let porBin;
        if(universoConocido){
          porBin = new Map();
          for(const s of universoConocido){ if(!porBin.has(s.storage_bin)) porBin.set(s.storage_bin, []); porBin.get(s.storage_bin).push(s); }
        }else{
          porBin = await skusDeUbicacionPorBins({bodega:conBin[0].bodega, ubicacion:conBin[0].ubicacion, excluidos:[], soloSinUbicacion:false}, conBin.map(f=>f.storage_bin));
        }
        // Una fila por código y entrada: plan_semanal_skus es único por (plan_id, sku_code), y un
        // mismo código puede estar dos veces en el bin (un batch NEW y otro REPAIRED, ver el
        // pedido de Joel del SOH por batch) -- mandarlo repetido rompía con "duplicate key" y la
        // entrada quedaba creada pero sin foto (bug real, B521/0099 LD-P1A-F1). Se guarda el id
        // del primer batch: lo que importa de la foto es el bin/bodega/ubicación de origen.
        const filasSnapshot = conBin.flatMap(f=>{
          const vistos = new Set();
          return (porBin.get(f.storage_bin)||[]).filter(s=> vistos.has(s.sku_code) ? false : (vistos.add(s.sku_code), true))
            .map(s=>({plan_id:f.id, sku_code:s.sku_code, sku_id:s.id, storage_bin_original:f.storage_bin, bodega_original:f.bodega, ubicacion_original:f.ubicacion}));
        });
        if(filasSnapshot.length){
          // La entrada YA quedó creada: si la foto falla, se avisa como advertencia (no como error
          // de la operación) para que la persona no vuelva a agregarla creyendo que no se guardó.
          try{
            await rest('/plan_semanal_skus', {method:'POST', body:filasSnapshot, prefer:'return=minimal', timeoutMs: UMBRAL_ABORTAR_GUARDADO_MS});
          }catch(e){
            if(!silencioso) toast('Entrada agregada, pero no se pudo guardar la foto de sus SKU: '+e.message, 'err');
          }
        }
      }
    }
    if(silencioso) return filas;
    toast(bins.length>1 ? `Agregado a la planificación (${bins.length} storage bin)` : 'Agregado a la planificación');
    moverVistaPlanAFecha(fecha);
    cargarPlanSemanal();
    refrescarOpcionesUbicacion();
    invalidarCalendario();
  }catch(e){
    if(silencioso) throw e;
    toast(e.message,'err');
  }
}

// Si se agregó para un día distinto del que se está viendo, mover la vista a ese día (ver el
// comentario largo de abajo, que era el cuerpo de crearPlanEntrada antes de compartirse con
// agregarPlanPorSku).
function moverVistaPlanAFecha(fecha){
    // Si se agregó para un día distinto del que se está viendo, mover la vista a ese día -- bug
    // real reportado por Joel: viendo el día 7 (desde Calendario), agregó dos storage bin para el
    // 8 y "la página no se actualizó": las entradas se crearon bien, pero la recarga volvía a
    // pedir solo el día 7 y las del 8 quedaban fuera de vista. Se mueve al día recién planificado
    // (no a la semana/período completo: con el período preseleccionado eso cargaría todo el
    // período, ~10 s). En modo semana, si la fecha cae fuera de la semana mostrada (el campo
    // permite hasta hoy+7), se navega a esa semana por el mismo motivo.
    const semanaDeFecha = fechaISO(inicioSemana(new Date(fecha+'T00:00:00')));
    if(state.plan.diaFiltro && state.plan.diaFiltro !== fecha){
      setState({plan:{...state.plan, diaFiltro: fecha, semanaInicio: semanaDeFecha}});
    }else if(!state.plan.diaFiltro && !state.plan.cicloFiltro){
      const v = ventanaPlan(state.plan);
      if(fecha < v.desde || fecha > v.hasta){
        if(v.modo==='mes') setState({plan:{...state.plan, mesInicio: inicioMes(fecha)}});
        else if(v.modo==='anio') setState({plan:{...state.plan, anioInicio: fecha.slice(0,4)+'-01-01'}});
        else setState({plan:{...state.plan, semanaInicio: semanaDeFecha}});
      }
    }
}

/* ---- Planificar por código de SKU ------------------------------------------------------
   Modo "Por código de SKU" del formulario "Agregar a la planificación" (pedido de Joel): en vez
   de elegir una zona, se buscan materiales por código o descripción y se agregan uno a uno. Al
   agregar, los elegidos se agrupan por bodega+ubicación y cada grupo se guarda como una entrada
   con por_sku=true cuya lista exacta va en plan_semanal_incluidos -- así Contar la encuentra con
   su selector habitual de bodega/ubicación, y Planificación/Calendario la resuelven en el
   servidor igual que cualquier otra (skus_universo_entrada_plan_lote, caso I). */
const PLAN_SKU_BUSQUEDA_LIMITE = 20;
const PLAN_SKU_BUSQUEDA_MIN = 2;
let planSkuBusqueda = { texto:'', resultados:[], yaPlanificados:new Set(), buscando:false, secuencia:0 };
let planSkuBusquedaTimer = null;

function cambiarModoAgregarPlan(modo){
  if(modo!=='ubicacion' && modo!=='sku') return;
  setState({plan:{...state.plan, modoAgregar: modo}});
}

// Busca en skus_planificables (activos y pendientes en el período) y marca los que ya están en
// otra entrada del plan (ausentes de skus_disponibles_planificar) para avisarlo sin bloquear.
// No pasa por setState: el resultado se dibuja directo en #p-sku-resultados para no perder el
// foco ni el texto del buscador con un render completo por cada tecla.
async function buscarSkuParaPlan(texto){
  texto = (texto||'').trim();
  planSkuBusqueda.texto = texto;
  const seq = ++planSkuBusqueda.secuencia;
  if(texto.length < PLAN_SKU_BUSQUEDA_MIN){
    planSkuBusqueda = {...planSkuBusqueda, resultados:[], yaPlanificados:new Set(), buscando:false};
    dibujarResultadosSkuPlan();
    return;
  }
  planSkuBusqueda.buscando = true;
  dibujarResultadosSkuPlan();
  try{
    const t = encodeURIComponent(texto);
    const filas = await rest(`/skus_planificables?activo=eq.true&select=id,sku_code,descripcion,bodega,ubicacion,storage_bin&or=(sku_code.ilike.*${t}*,descripcion.ilike.*${t}*)&order=sku_code.asc&limit=${PLAN_SKU_BUSQUEDA_LIMITE}`) || [];
    if(seq!==planSkuBusqueda.secuencia) return;
    let disponibles = [];
    if(filas.length){
      disponibles = await rest(`/skus_disponibles_planificar?select=id&id=in.(${filas.map(f=>f.id).join(',')})`) || [];
      if(seq!==planSkuBusqueda.secuencia) return;
    }
    const dispIds = new Set(disponibles.map(d=>d.id));
    planSkuBusqueda.resultados = filas;
    planSkuBusqueda.yaPlanificados = new Set(filas.filter(f=>!dispIds.has(f.id)).map(f=>f.id));
  }catch(e){
    if(seq!==planSkuBusqueda.secuencia) return;
    planSkuBusqueda.resultados = [];
    planSkuBusqueda.yaPlanificados = new Set();
    toast(e.message,'err');
  }
  planSkuBusqueda.buscando = false;
  dibujarResultadosSkuPlan();
}

function zonaDeSku(s){
  return [s.bodega, s.ubicacion, s.storage_bin].filter(Boolean).join(' · ') || 'Sin ubicación';
}

// Mismo formato que el buscador libre de Contar (renderResultadosBuscadorLibre): fila .sku-pick
// con el código, la descripción y la zona debajo, y el botón "Elegir" a la derecha (a pedido).
function htmlResultadosSkuPlan(){
  const b = planSkuBusqueda;
  if(b.texto.length===0) return '<div class="hint">Escribe para buscar en los materiales pendientes del período.</div>';
  if(b.texto.length < PLAN_SKU_BUSQUEDA_MIN) return '<div class="hint">Sigue escribiendo (mínimo 2 letras)…</div>';
  if(b.buscando) return '<div class="hint">Buscando…</div>';
  if(!b.resultados.length) return '<div class="hint">No se encontraron materiales pendientes que coincidan.</div>';
  const elegidos = new Set((state.plan.skusElegidos||[]).map(s=>s.id));
  return b.resultados.map(s=>{
    const elegido = elegidos.has(s.id);
    const yaPlan = b.yaPlanificados.has(s.id);
    return `
      <div class="sku-pick" data-plan-sku="${esc(s.id)}">
        <div><span class="code">${esc(s.sku_code)}</span><span class="desc">${esc(s.descripcion||'Sin descripción')} · ${esc(s.bodega||'—')}${s.ubicacion? ` · ${esc(s.ubicacion)}` : ''}${s.storage_bin? ` · Bin ${esc(s.storage_bin)}` : ''}</span></div>
        <span style="display:flex;align-items:center;flex:none">${!elegido && yaPlan? '<span class="badge badge-warn" title="Ya está en otra entrada de este período">Ya en el plan</span>' : ''}<button type="button" data-elegir-sku-plan="${esc(s.id)}" ${elegido?'disabled':''}>${elegido? 'Elegido' : 'Elegir'}</button></span>
      </div>`;
  }).join('') + (b.resultados.length>=PLAN_SKU_BUSQUEDA_LIMITE? `<div class="hint" style="margin-top:4px">Mostrando los primeros ${PLAN_SKU_BUSQUEDA_LIMITE}. Escribe más caracteres para acotar.</div>` : '');
}
function dibujarResultadosSkuPlan(){
  const el = document.getElementById('p-sku-resultados');
  if(el) el.innerHTML = htmlResultadosSkuPlan();
}

function elegirSkuParaPlan(id){
  const s = planSkuBusqueda.resultados.find(x=>x.id===id);
  if(!s) return;
  if((state.plan.skusElegidos||[]).some(x=>x.id===id)) return;
  const elegido = {id:s.id, sku_code:s.sku_code, descripcion:s.descripcion, bodega:s.bodega, ubicacion:s.ubicacion, storage_bin:s.storage_bin};
  setState({plan:{...state.plan, skusElegidos:[...(state.plan.skusElegidos||[]), elegido]}});
}
// Enter en el buscador: el que calza exacto por código, o si no el primero de la lista aún no elegido.
function elegirPrimerResultadoSkuPlan(){
  const b = planSkuBusqueda;
  const elegidos = new Set((state.plan.skusElegidos||[]).map(s=>s.id));
  const exacto = b.resultados.find(s=> s.sku_code.toLowerCase()===b.texto.toLowerCase() && !elegidos.has(s.id));
  const primero = exacto || b.resultados.find(s=>!elegidos.has(s.id));
  if(primero) elegirSkuParaPlan(primero.id);
}
function quitarSkuElegidoPlan(id){
  setState({plan:{...state.plan, skusElegidos:(state.plan.skusElegidos||[]).filter(s=>s.id!==id)}});
}

// Agrupa por bodega+ubicación (el storage bin no separa entradas: la lista de SKU ya es exacta).
function agruparSkusElegidosPorZona(skus){
  const grupos = new Map();
  skus.forEach(s=>{
    const bodega = (s.bodega==null || s.bodega==='') ? null : s.bodega;
    const ubicacion = (s.ubicacion==null || s.ubicacion==='') ? null : s.ubicacion;
    const clave = `${bodega===null?'\u0000':bodega}|${ubicacion===null?'\u0000':ubicacion}`;
    if(!grupos.has(clave)) grupos.set(clave, {bodega, ubicacion, skus:[]});
    grupos.get(clave).skus.push(s);
  });
  return [...grupos.values()];
}

async function agregarPlanPorSku({fecha, responsableId, nota}){
  const elegidos = state.plan.skusElegidos||[];
  if(!elegidos.length){ toast('Busca y elige al menos un SKU','err'); return; }
  if(!fecha){ toast('Elige una fecha','err'); return; }
  if(!perfilCargado()) return;
  const grupos = agruparSkusElegidosPorZona(elegidos);
  let creadas = 0, fallidas = 0, ultimoError = '';
  for(const g of grupos){
    // Misma traducción de zona que el formulario por ubicación: sin bodega ni ubicación = "SKU
    // sin ubicación"; bodega sin ubicación = "sin ubicación específica"; ubicación sin bodega =
    // "sin bodega asignada" (bodega '').
    const soloSinUbicacion = g.bodega===null && g.ubicacion===null;
    const ubicacionEsNula = g.bodega!==null && g.ubicacion===null;
    try{
      await crearPlanEntrada({
        fecha,
        bodega: soloSinUbicacion ? '' : (g.bodega===null ? '' : g.bodega),
        ubicacion: g.ubicacion===null ? '' : g.ubicacion,
        storageBins:[], skusExcluidos:[], soloSinUbicacion, ubicacionEsNula, cicloId:'',
        responsableId, nota, silencioso:true,
        skusIncluidos: g.skus.map(s=>({id:s.id, sku_code:s.sku_code})),
      });
      creadas++;
    }catch(e){ fallidas++; ultimoError = e.message; }
  }
  if(creadas){
    toast(`Agregado a la planificación: ${elegidos.length} SKU en ${creadas} entrada${creadas===1?'':'s'}`);
    planSkuBusqueda = { texto:'', resultados:[], yaPlanificados:new Set(), buscando:false, secuencia: planSkuBusqueda.secuencia+1 };
    setState({plan:{...state.plan, skusElegidos:[]}});
    moverVistaPlanAFecha(fecha);
    cargarPlanSemanal();
    refrescarOpcionesUbicacion();
    invalidarCalendario();
  }
  if(fallidas) toast(`${fallidas} entrada${fallidas===1?'':'s'} no se pudo${fallidas===1?'':'ieron'} crear: ${ultimoError}`,'err');
}

// Título de una entrada en Planificación: la zona que cubre, con el prefijo "Por código" cuando
// la lista de SKU es explícita (por_sku) y la zona solo indica dónde están.
function etiquetaUbicacionEntradaPlan(e){
  const zona = e.solo_sin_ubicacion ? 'SKU sin ubicación' : ([e.bodega,e.ubicacion,e.storage_bin].filter(Boolean).join(' · ') || 'Sin ubicación específica');
  return e.por_sku ? `Por código · ${zona}` : zona;
}

function alternarSeleccionTodoPlan(){

}
