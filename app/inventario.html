function encabezadoEntradaPlan(e){
  const ubic = e.solo_sin_ubicacion ? 'SKU sin ubicación' : ([e.bodega, e.ubicacion, e.storage_bin].filter(Boolean).join(' · ') || 'Sin ubicación específica');
  const partes = [`Responsable: ${esc(e.responsable_nombre || 'Sin asignar')}`];
  if(e.nota) partes.push(`Nota: ${esc(e.nota)}`);
  return `<h3>${esc(ubic)}</h3><div class="print-entrada-meta">${partes.join(' · ')}</div>`;
}

function tablaSkusEntradaPlan(skus){
  if(!skus.length) return `<p class="print-vacio">Sin SKU activos en esta ubicación.</p>`;
  // ABC y Crítico ayudan a priorizar en terreno (qué contar con más cuidado) sin revelar
  // ningún número de stock -- por eso van acá, a diferencia de bloqueado/tránsito/transferencia,
  // que sí son cantidades del sistema y no corresponde mostrarlas en una hoja de conteo ciego.
  return `
    <table>
      <thead><tr><th>SKU</th><th>Descripción</th><th>Storage bin</th><th>Unidad</th><th>ABC</th><th>Crítico</th><th>Cantidad contada</th><th>Observación</th></tr></thead>
      <tbody>
        ${skus.map(s=>`
          <tr>
            <td>${esc(s.sku_code)}</td>
            <td>${esc(s.descripcion||'')}</td>
            <td>${esc(s.storage_bin||'—')}</td>
            <td>${esc(s.unidad_medida||'—')}</td>
            <td>${esc(s.clase_abc||'—')}</td>
            <td${s.critico?' style="color:var(--danger);font-weight:600"':''}>${s.critico?'★':'—'}</td>
            <td class="print-blank"></td>
            <td class="print-blank"></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function imprimirPlan(){
  const p = state.plan;
  const inicio = new Date(p.semanaInicio+'T00:00:00');
  // Misma semana de 8 días (lunes a lunes) que renderPlanificacion/cargarPlanSemanal.
  const finSemana = sumarDias(inicio,7);
  // Igual que en renderPlanificacion: con un período elegido se exporta TODO lo planificado
  // para ese período (todas las semanas), no solo la semana que se esté mirando -- salvo que
  // haya un diaFiltro activo (viniendo de un día puntual del Calendario), que acota a ese día
  // solo, igual que ya hace la pantalla.
  // Misma ventana que la pantalla (Día / Semana / Mes / Año / Período, ver ventanaPlan). A
  // diferencia de la pantalla, el PDF SIEMPRE trae el listado completo de SKU, también en las
  // ventanas grandes (a pedido de Joel: "los excesos de SKU quedan reflejados en el pdf").
  const ventana = ventanaPlan(p);
  const modo = ventana.modo;
  const generado = `Generado ${new Date().toLocaleString('es-CL')}`;
  const titulo = modo==='semana' ? 'Plan de conteo semanal' : `Plan de conteo — ${ventana.etiqueta}`;
  const meta = modo==='dia' ? generado
    : modo==='semana' ? `Semana ${ventana.etiqueta} · ${generado}`
    : `${esc(ventana.etiqueta)} · ${generado}`;
  const entradasVisibles = p.diaFiltro ? p.entradas.filter(e=>e.fecha===p.diaFiltro) : p.entradas;
  const porDia = (modo==='dia'
    ? [p.diaFiltro]
    : modo==='semana'
    ? Array.from({length:8},(_,i)=> fechaISO(sumarDias(inicio,i)))
    : Array.from(new Set(entradasVisibles.map(e=>e.fecha))).sort()
  ).map(iso=>({
    label: new Date(iso+'T00:00:00').toLocaleDateString('es-CL',{weekday:'long', day:'2-digit', month:'short'}),
    entradas: entradasVisibles.filter(e=>e.fecha===iso),
  })).filter(d=>d.entradas.length);

  if(!porDia.length){
    document.getElementById('print-informe').innerHTML = '';
    document.getElementById('print-buscar').innerHTML = '';
    document.getElementById('print-plan').innerHTML = `
      <h1>${esc(titulo)}</h1>
      <div class="print-meta">${meta}</div>
      <p class="print-vacio">No hay conteos planificados${modo==='semana'?' para esta semana':''}.</p>
    `;
    window.print();
    return;
  }

  const btn = document.getElementById('btn-exportar-plan');
  if(btn){ btn.disabled = true; btn.textContent = 'Generando…'; }
  try{
    // Una sola llamada para todas las entradas (antes era una por entrada, 375 seguidas con el
    // período real) -- ver universoEntradasPlanHoja.
    const hoja = await universoEntradasPlanHoja(porDia.flatMap(d=>d.entradas.map(e=>e.id)));
    let cuerpo = '';
    for(const d of porDia){
      cuerpo += `<h2>${esc(d.label)}</h2>`;
      for(const e of d.entradas){
        const skus = Array.isArray(hoja[e.id]) ? hoja[e.id] : [];
        cuerpo += encabezadoEntradaPlan(e) + tablaSkusEntradaPlan(skus);
      }
    }
    document.getElementById('print-informe').innerHTML = '';
    document.getElementById('print-buscar').innerHTML = '';
    document.getElementById('print-plan').innerHTML = `
      <h1>${esc(titulo)}</h1>
      <div class="print-meta">${meta}</div>
      ${cuerpo}
    `;
    window.print();
  }catch(err){
    toast(err.message,'err');
  }finally{
    if(btn){ btn.disabled = !entradasVisibles.length; btn.innerHTML = `${ICONS.download} Exportar PDF`; }
  }
}

// "Plan del día" del operador (pestaña Contar): mismo mecanismo de exportar-a-PDF que
// imprimirPlan() (impresión del navegador sobre #print-plan), pero acotado al día y a las
// entradas que ya le corresponden a la cuenta logueada (state.contarPlan.entradas), sin
// depender de qué bodega/ubicación tenga elegida en la cascada — el PDF trae todo su día.
async function imprimirPlanDelDia(){
  const cp = state.contarPlan;
  const fechaLabel = new Date(cp.fecha+'T00:00:00').toLocaleDateString('es-CL',{weekday:'long', day:'2-digit', month:'long', year:'numeric'});
  const nombre = (state.perfil && state.perfil.nombre) || '';
  const meta = [nombre, fechaLabel, `Generado ${new Date().toLocaleString('es-CL')}`].filter(Boolean).join(' · ');

  if(!cp.entradas.length){
    document.getElementById('print-informe').innerHTML = '';
    document.getElementById('print-buscar').innerHTML = '';
    document.getElementById('print-plan').innerHTML = `
      <h1>Plan del día</h1>
      <div class="print-meta">${esc(meta)}</div>
      <p class="print-vacio">Sin nada planificado para ti este día.</p>
    `;
    window.print();
    return;
  }

  const btn = document.getElementById('btn-exportar-plan-dia');
  if(btn){ btn.disabled = true; btn.textContent = 'Generando…'; }
  try{
    // Una sola llamada para todas las entradas del día (antes una por entrada, en serie).
    const porEntrada = await universoEntradasPlanContar(cp.entradas.map(e=>e.id));
    let cuerpo = '';
    for(const e of cp.entradas){
      cuerpo += encabezadoEntradaPlan(e) + tablaSkusEntradaPlan(porEntrada[e.id]||[]);
    }
    document.getElementById('print-informe').innerHTML = '';
    document.getElementById('print-buscar').innerHTML = '';
    document.getElementById('print-plan').innerHTML = `
      <h1>Plan del día</h1>
      <div class="print-meta">${esc(meta)}</div>
      ${cuerpo}
    `;
    window.print();
  }catch(err){
    toast(err.message,'err');
  }finally{
    if(btn){ btn.disabled = !cp.entradas.length; btn.innerHTML = `${ICONS.download} Exportar PDF`; }
  }
}

// Informe de ciclo: exporta a PDF (vía impresión del navegador) exactamente lo que muestra
// el dashboard en modo Ejecutivo — mismos números, mismo cálculo, un solo lugar de verdad
// (renderInformeEjecutivo). No hace ninguna consulta nueva: usa lo que ya está cargado en
// state.dash, así que refleja el ciclo actual tal como lo agrupan las vistas SQL (ver #103).
function imprimirInformeCiclo(){
  if(!planIncluye('dashboard_ejecutivo_habilitado')) return;
  const cicloActual = (state.ciclos||[]).find(c=>c.es_actual);
  const empresaNombre = (state.perfil && state.perfil.empresas && state.perfil.empresas.nombre) || '';
  const metaPartes = [empresaNombre, cicloActual? cicloActual.nombre : 'Sin ciclo asignado', new Date().toLocaleString('es-CL')].filter(Boolean);
  document.getElementById('print-plan').innerHTML = '';
  document.getElementById('print-buscar').innerHTML = '';
  document.getElementById('print-informe').innerHTML = `
    <h1>Informe de ciclo de conteo</h1>
    <div class="print-meta">${metaPartes.map(esc).join(' · ')}</div>
    ${renderInformeEjecutivo()}
  `;
  window.print();
}

// Informe de CIERRE (distinto del de arriba): un snapshot automático generado por el servidor
// al momento exacto en que el ciclo dejó de ser el actual (ver marcar_ciclo_actual/
// informes_ciclo), no una consulta en vivo -- por eso es más simple que renderInformeEjecutivo
// (sin ABC, adherencia al plan ni proyección de término: esas viven del estado en curso del
// ciclo actual, no tienen sentido "congeladas" para uno ya cerrado). Incluye a propósito los
// reconteos pendientes que quedaron sin resolver al cerrar (pedido de Joel).
function renderCuerpoInformeGuardado(datos){
  const avance = datos.avance_total||[];
  const totUniverso = avance.reduce((s,r)=>s+(Number(r.skus_universo)||0),0);
  const totContados = avance.reduce((s,r)=>s+(Number(r.skus_contados)||0),0);
  const avanceGlobal = totUniverso? (totContados/totUniverso*100) : 0;

  const exact = datos.exactitud_por_bodega||[];
  const exactContados = exact.reduce((s,r)=>s+(Number(r.skus_contados)||0),0);
  const exactSinDif = exact.reduce((s,r)=>s+(Number(r.sin_diferencia)||0),0);
  const exactUbicOk = exact.reduce((s,r)=>s+(Number(r.ubicacion_correcta)||0),0);
  const exactitudUnidades = exactContados? (exactSinDif/exactContados*100) : 0;
  const exactitudUbicacion = exactContados? (exactUbicOk/exactContados*100) : 0;

  const dif = datos.diferencias_recientes || {sin_diferencia:0, con_diferencia:0};

  const valoriz = datos.valorizacion_diferencias||[];
  const valorContado = valoriz.reduce((s,r)=>s+(Number(r.valor_contado)||0),0);
  const valorPerdidas = valoriz.reduce((s,r)=>s+(Number(r.valor_perdidas)||0),0);
  const valorExcedentes = valoriz.reduce((s,r)=>s+(Number(r.valor_excedentes)||0),0);
  const valorNeto = valorPerdidas + valorExcedentes;

  const ranking = datos.ranking_responsable||[];
  const reconteos = datos.reconteos_sin_resolver||[];

  return `
    <div class="kpi-grid">
      <div class="tag-card">
        <div class="kpi-label">Avance final</div>
        <div class="kpi-value">${pct(avanceGlobal)}%</div>
        <div class="kpi-sub">${totContados.toLocaleString('es-CL')} de ${totUniverso.toLocaleString('es-CL')} SKU</div>
      </div>
      <div class="tag-card">
        <div class="kpi-label">Diferencias (último conteo de cada SKU)</div>
        <div class="kpi-value">${Number(dif.con_diferencia)||0}</div>
        <div class="kpi-sub">con diferencia, de ${(Number(dif.sin_diferencia)||0)+(Number(dif.con_diferencia)||0)} contados</div>
      </div>
    </div>

    <div class="section-head"><div><span class="eyebrow">Sobre el último conteo de cada SKU</span><h2 style="font-size:17px">Exactitud</h2></div></div>
    <div class="kpi-grid" style="margin-bottom:14px">
      <div class="tag-card">
        <div class="kpi-label">De unidades</div>
        <div class="kpi-value">${pct(exactitudUnidades)}%</div>
        <div class="kpi-sub">${exactSinDif.toLocaleString('es-CL')} de ${exactContados.toLocaleString('es-CL')} SKU sin diferencia</div>
      </div>
      <div class="tag-card">
        <div class="kpi-label">De ubicación</div>
        <div class="kpi-value">${pct(exactitudUbicacion)}%</div>
        <div class="kpi-sub">${exactUbicOk.toLocaleString('es-CL')} de ${exactContados.toLocaleString('es-CL')} contados donde dice el maestro</div>
      </div>
    </div>

    ${valorContado>0 || valorPerdidas!==0 || valorExcedentes!==0? `
      <div class="section-head"><div><span class="eyebrow">Con costo unitario cargado</span><h2 style="font-size:17px">Valorización de diferencias</h2></div></div>
      <div class="kpi-grid" style="margin-bottom:14px">
        <div class="tag-card"><div class="kpi-label">Valor contado</div><div class="kpi-value" style="font-size:20px">${clp(valorContado)}</div></div>
        <div class="tag-card"><div class="kpi-label">Pérdidas</div><div class="kpi-value" style="font-size:20px;color:var(--danger)">${clp(valorPerdidas)}</div></div>

        <div class="tag-card"><div class="kpi-label">Neto</div><div class="kpi-value" style="font-size:20px;${valorNeto<0?'color:var(--danger)':valorNeto>0?'color:var(--ok)':''}">${clp(valorNeto)}</div></div>
      </div>
    ` : ''}

    <div class="section-head"><div><span class="eyebrow">Top 8</span><h2 style="font-size:17px">Ranking por responsable</h2></div></div>
    <div class="card" style="margin-bottom:14px">
      ${ranking.length? ranking.map(r=>`
        <div style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(r.nombre)}</span><span class="mono">${r.cantidad}</span></div>
      `).join('') : `<div class="empty" style="padding:10px 0">Sin conteos registrados en este ciclo.</div>`}
    </div>

    <div class="section-head"><div><span class="eyebrow">${reconteos.length}</span><h2 style="font-size:17px">Reconteos sin resolver al cierre</h2></div></div>
    <div class="card">
      ${reconteos.length? `<div class="table-wrap"><table>
        <thead><tr><th>SKU</th><th class="num">Diferencia</th><th>Causa probable</th><th>Fecha</th></tr></thead>
        <tbody>${reconteos.map(r=>`<tr>
          <td class="mono">${esc(r.sku_code)}<div style="font-size:11px;color:var(--text-faint)">${esc(r.descripcion||'')}</div></td>
          <td class="num">${r.ultima_diferencia>0?'+':''}${r.ultima_diferencia}</td>
          <td>${causaProbableBadge(r.causa_probable)}</td>
          <td class="mono" style="font-size:11.5px">${fmtFecha(r.ultimo_conteo_fecha)}</td>
        </tr>`).join('')}</tbody>
      </table></div>` : `<div class="empty"><div class="glyph">✓</div>Ninguno: todo lo contado en este ciclo quedó sin diferencias pendientes.</div>`}
    </div>
  `;
}

function imprimirInformeGuardado(id){
  if(!planIncluye('dashboard_ejecutivo_habilitado')) return;
  const informe = state.informesCiclo.lista.find(x=>x.id===id);
  if(!informe) return;
  const empresaNombre = (state.perfil && state.perfil.empresas && state.perfil.empresas.nombre) || '';
  const metaPartes = [empresaNombre, informe.ciclo_nombre, `Inicio ${fmtFecha(informe.fecha_inicio)}`, `Cierre ${fmtFechaHora(informe.fecha_cierre)}`].filter(Boolean);
  document.getElementById('print-plan').innerHTML = '';
  document.getElementById('print-buscar').innerHTML = '';
  document.getElementById('print-informe').innerHTML = `
    <h1>Informe de cierre de ciclo</h1>
    <div class="print-meta">${metaPartes.map(esc).join(' · ')}</div>
    ${renderCuerpoInformeGuardado(informe.datos)}
  `;
  window.print();
}

/* =======================================================================
   RENDER — Planificación semanal (por bodega, ubicación específica y storage bin)
   ======================================================================= */
function renderPlanificacion(){
  const p = state.plan;
  const inicio = new Date(p.semanaInicio+'T00:00:00');
  // La "semana" mostrada va de lunes al lunes siguiente inclusive (8 días, no 7): a pedido, para
  // no cortar la vista justo el domingo y poder ver de una el arranque de la semana próxima.
  const finSemana = sumarDias(inicio,7);
  const cicloFiltroObj = p.cicloFiltro ? (state.ciclos||[]).find(c=>c.id===p.cicloFiltro) : null;
  // Ventana activa: Día / Semana / Mes / Año / Período (ver ventanaPlan). Mes, Año y Período son
  // vistas resumidas: totales por entrada sin listar SKU.
  const ventana = ventanaPlan(p);
  const modo = ventana.modo;
  const resumido = esResumenPlan(p);
  const propios = p.propios || {};

  // Al venir de un día puntual del Calendario (ver cal-ir-plan), diaFiltro acota TODO lo de acá
  // abajo a ese solo día -- a pedido de Joel: "que muestre ese día, no toda la planificación".
  // Se limpia solo (bind()) al navegar de semana o cambiar de período.
  const entradasVisibles = p.diaFiltro ? p.entradas.filter(e=>e.fecha===p.diaFiltro) : p.entradas;

  // En modo período se agrupa por cada fecha que realmente tenga algo planificado (no hay una
  // semana de referencia). En modo semana antes se armaban los 8 días de la semana elegida
  // aunque estuvieran vacíos; se dejó de hacer a pedido — abajo se filtran los días sin nada
  // planificado antes de listarlos, en ambos modos. Con diaFiltro activo, ninguno de los dos
  // modos aplica: es un solo día puntual, sin los otros 7 (u otras fechas del período) de relleno.
  const grupos = p.diaFiltro
    ? [{
        iso: p.diaFiltro,
        label: new Date(p.diaFiltro+'T00:00:00').toLocaleDateString('es-CL',{weekday:'long', day:'2-digit', month:'short'}),
        corta: new Date(p.diaFiltro+'T00:00:00').toLocaleDateString('es-CL',{day:'2-digit',month:'short'}),
        entradas: entradasVisibles,
      }]
    : modo!=='semana'
    ? Array.from(new Set(entradasVisibles.map(e=>e.fecha))).sort().map(iso=>{
        const d = new Date(iso+'T00:00:00');
        return {
          iso,
          label: d.toLocaleDateString('es-CL',{weekday:'long', day:'2-digit', month:'short'}),
          corta: d.toLocaleDateString('es-CL',{day:'2-digit',month:'short'}),
          entradas: entradasVisibles.filter(e=>e.fecha===iso),
        };
      })
    : Array.from({length:8},(_,i)=> sumarDias(inicio,i)).map(d=>{
        const iso = fechaISO(d);
        return {
          iso,
          label: d.toLocaleDateString('es-CL',{weekday:'long'}),
          corta: d.toLocaleDateString('es-CL',{day:'2-digit',month:'short'}),
          entradas: entradasVisibles.filter(e=>e.fecha===iso),
        };
      });

  // Cuenta SKU distintos (por sku.id) cuando ya hay detalle cargado, no la suma de universos por
  // entrada -- ver el comentario en resumenPorResponsable sobre por qué sumar por entrada duplica
  // SKU cubiertos por más de una. Una entrada sin detalle todavía ("Calculando…") suma su universo
  // tal cual, como antes.
  // Un SKU se cuenta UNA sola vez en toda la ventana, no una vez por día (a pedido de Joel, tras
  // comparar con la base: la semana del 7 al 14 de sep daba 2.009 sumando por día y 1.930 SKU
  // distintos; Mes y Año, deduplicados por el servidor, sí coincidían). El primer día que lo
  // planifica se queda con el SKU -- misma regla que resumenEntradasPlan y que el ranking por
  // responsable de abajo, así el total de arriba y el ranking cuadran entre sí y con el Dashboard.
  const vistos = new Set();
  const datosPorDia = grupos.map(d=>{
    let cantidad = 0;
    d.entradas.forEach(e=>{
      const det = p.detalle[e.id];
      if(det) det.forEach(s=>{ if(!vistos.has(s.id)){ vistos.add(s.id); cantidad++; } });
      else if(propios[e.id]!==undefined) cantidad += propios[e.id]; // vista resumida: ya deduplicado por el servidor
      else cantidad += p.universos[e.id]||0;
    });
    return {dia: d.iso, cantidad};
  });
  const totalSemana = datosPorDia.reduce((s,d)=>s+d.cantidad, 0);
  // En la vista de Año el gráfico va por mes (365 barras de un día no se leen).
  const datosGrafico = modo==='anio'
    ? Array.from(datosPorDia.reduce((m,d)=>{ const k = inicioMes(d.dia); m.set(k, (m.get(k)||0)+d.cantidad); return m; }, new Map()), ([dia,cantidad])=>({dia,cantidad}))
    : datosPorDia;
  const responsablesResumen = resumenPorResponsable(entradasVisibles, p.universos, p.detalle, propios);
  const sufijoVentana = {dia:' este día', semana:' en esta semana', mes:' en este mes', anio:' en este año', periodo:''}[modo];
  const tituloResumen = {dia:'Resumen del día', semana:'Resumen de la semana', mes:'Resumen del mes', anio:'Resumen del año', periodo:'Resumen del período'}[modo];
  // A pedido de Joel: con datos reales, más de la mitad de las entradas planificadas quedaban sin
  // responsable asignado y pasaba desapercibido -- este aviso lo pone al frente en vez de tener
  // que notar cada fila suelta o buscarlo en el ranking de abajo.
  const entradasSinResponsable = entradasVisibles.filter(e=>!e.responsable_id).length;
  // El formulario "Agregar a la planificación" debe abrir en el día de hoy (lo más probable
  // es que estés planificando para hoy), no en el lunes de la semana — pero si estás navegando
  // una semana distinta a la actual, hoy cae fuera de [semanaInicio, finSemana] y hay que
  // quedarse con el lunes de esa semana para no violar los min/max del campo.
  // Con un día puntual activo (desde Calendario), el formulario abre en ESE día -- es lo que se
  // está mirando y lo más probable es que se quiera agregar ahí; además, cambiar esta Fecha
  // navega al día elegido (ver bind()), así que sin límite mínimo de semana en ese modo.
  // En Mes/Año la ventana es más grande: hoy si cae dentro, si no el primer día de la ventana.
  // En Período no hay fechas de referencia: hoy.
  const hoyISO = fechaISO(new Date());
  const fechaPlanDefault = p.diaFiltro
    ? p.diaFiltro
    : !ventana.desde ? hoyISO
    : (hoyISO >= ventana.desde && hoyISO <= ventana.hasta) ? hoyISO : ventana.desde;
  // El máximo seleccionable debe llegar al menos 7 días después de hoy, no solo hasta el fin
  // de la ventana mostrada — si hoy cae cerca del fin de semana (ej. sábado), antes casi no
  // dejaba planificar hacia adelante. Si la ventana mostrada ya llega más lejos (navegando a
  // futuro, o un mes/año entero), se respeta ese límite mayor.
  const hoyMasSieteISO = fechaISO(sumarDias(new Date(hoyISO+'T00:00:00'), 7));
  const finVentanaISO = ventana.hasta || hoyMasSieteISO;
  const maxFechaPlan = finVentanaISO > hoyMasSieteISO ? finVentanaISO : hoyMasSieteISO;
  const minFechaPlan = (modo==='dia' || modo==='periodo') ? null : ventana.desde;

  return `
    <div class="section-head">
      <div><span class="eyebrow">Planificación</span><h2>Plan de conteo</h2></div>
      <button class="btn btn-secondary" id="btn-exportar-plan" style="width:auto;padding:8px 12px;flex:none;display:flex;align-items:center;gap:6px" ${entradasVisibles.length?'':'disabled'}>${ICONS.download} Exportar PDF</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <div class="segmented" style="margin:0;flex:1;min-width:230px">
        ${[['dia','Día'],['semana','Semana'],['mes','Mes'],['anio','Año']].map(([m,t])=>`<button type="button" class="segmented-btn${modo===m?' active':''}" id="plan-modo-${m}" data-plan-modo="${m}">${t}</button>`).join('')}
      </div>
      ${state.ciclos.length? `
      <select id="plan-filtro-ciclo" aria-label="Período" style="width:auto;margin:0;flex:none${modo==='periodo'?';border-color:var(--amber);font-weight:600':''}">
        <option value="" ${!p.cicloFiltro?'selected':''}>Período…</option>
        ${state.ciclos.map(c=>`<option value="${esc(c.id)}" ${p.cicloFiltro===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}
      </select>
      ` : ''}
    </div>
    ${modo==='dia'? `
    <div class="hint" style="margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span>Viendo solo <strong>${fmtFecha(p.diaFiltro)}</strong>.</span>
      <button type="button" class="link-btn" id="btn-quitar-dia-filtro-plan">Ver toda la semana</button>
    </div>
    ` : ''}
    ${modo==='periodo'? `
    <div class="hint" style="margin-bottom:14px">Mostrando toda la planificación de <strong>${esc(ventana.etiqueta)}</strong>, de todas las semanas.</div>
    ` : `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px">
      <button class="btn btn-secondary" id="plan-${modo}-prev" aria-label="Anterior" style="width:auto;padding:8px 12px;flex:none">‹</button>
      <span class="hint" style="margin:0;text-align:center">${esc(ventana.etiqueta)}</span>
      <button class="btn btn-secondary" id="plan-${modo}-next" aria-label="Siguiente" style="width:auto;padding:8px 12px;flex:none">›</button>
    </div>
    `}
    ${resumido? `
    <div class="hint" style="margin-bottom:14px">Vista resumida: totales por entrada, sin listar los SKU. Para verlos o quitar alguno, usa Día o Semana. El PDF trae el listado completo.</div>
    ` : ''}

    ${entradasSinResponsable>0? `
    <div class="card" style="margin-bottom:14px;border-color:var(--warn)">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="badge badge-warn">${entradasSinResponsable}</span>
        <span>${entradasSinResponsable===1?'entrada planificada no tiene':'entradas planificadas no tienen'} responsable asignado${sufijoVentana}.</span>
      </div>
    </div>
    ` : ''}

    <div class="card">
      <h3 style="margin:0 0 10px;font-size:15px">Agregar a la planificación</h3>
      <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap" role="tablist" aria-label="Forma de agregar">
        <button type="button" class="btn ${p.modoAgregar==='sku'?'btn-secondary':'btn-primary'}" id="p-modo-ubicacion" style="width:auto;padding:6px 12px;font-size:12.5px" aria-pressed="${p.modoAgregar!=='sku'}">Por ubicación</button>
        <button type="button" class="btn ${p.modoAgregar==='sku'?'btn-primary':'btn-secondary'}" id="p-modo-sku" style="width:auto;padding:6px 12px;font-size:12.5px" aria-pressed="${p.modoAgregar==='sku'}">Por código de SKU</button>
      </div>
      <form id="form-plan">
        <label for="p-fecha">Fecha</label>
        <input type="date" id="p-fecha" value="${fechaPlanDefault}" ${minFechaPlan? `min="${minFechaPlan}"` : ''} max="${maxFechaPlan}" required>
        <div id="p-campos-sku" ${p.modoAgregar==='sku'? '' : 'style="display:none"'}>
          <label for="p-sku-buscar">Buscar SKU por código o descripción</label>
          <input type="text" id="p-sku-buscar" placeholder="Ej. 4400-1123 o &quot;filtro&quot;" autocomplete="off" value="${esc(planSkuBusqueda.texto)}">
          <div class="hint" style="margin:4px 0 0">Solo aparecen materiales pendientes de contar en este período. Enter elige el primero.</div>
          <div id="p-sku-resultados" style="margin-top:10px">${p.modoAgregar==='sku'? htmlResultadosSkuPlan() : ''}</div>
          ${(p.skusElegidos||[]).length? `
            <div class="hint" style="margin:10px 0 0">${p.skusElegidos.length} SKU elegido${p.skusElegidos.length===1?'':'s'} · se crear${agruparSkusElegidosPorZona(p.skusElegidos).length===1?'á 1 entrada':'án '+agruparSkusElegidosPorZona(p.skusElegidos).length+' entradas'} (una por bodega + ubicación)</div>
            <div class="plan-sku-chips">${p.skusElegidos.map(s=>`<span class="plan-sku-chip" title="${esc(zonaDeSku(s))}"><span class="mono">${esc(s.sku_code)}</span><button type="button" data-quitar-sku-plan="${esc(s.id)}" aria-label="Quitar ${esc(s.sku_code)}">×</button></span>`).join('')}</div>
          ` : `<div class="hint" style="margin:10px 0 0">Aún no has elegido ningún SKU.</div>`}
        </div>
        <div id="p-campos-ubicacion" ${p.modoAgregar==='sku'? 'style="display:none"' : ''}>
        <label for="p-bodega">Ubicación general</label>
        <select id="p-bodega">
          <option value="">Selecciona (opcional)</option>
          ${p.sinUbicacionCount? `<option value="${BODEGA_SIN_UBICACION}">SKU sin ubicación (${p.sinUbicacionCount})</option>` : ''}
          ${p.generales.map(o=> o.bodega===null
            ? `<option value="${BODEGA_VACIA}">Sin bodega asignada (${o.cantidad_pendiente}/${o.cantidad_skus})</option>`
            : `<option value="${esc(o.bodega)}">${esc(o.bodega)} (${o.cantidad_pendiente}/${o.cantidad_skus})</option>`
          ).join('')}
        </select>
        <div class="row2">
          <div><label for="p-ubic">Ubicación específica</label>
            <select id="p-ubic" disabled>
              <option value="">Elige ubicación general primero</option>
            </select>
          </div>
          <div><label for="p-bin">Storage bin <span id="p-bin-resumen" style="font-weight:400;color:var(--text-faint)"></span></label>
            <select id="p-bin" multiple size="6" disabled>
              <option value="">Elige ubicación específica primero</option>
            </select>
            <label style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--text-dim)">
              <input type="checkbox" id="p-bin-todos" disabled>
              Seleccionar todos
            </label>
            <div class="hint" id="p-bin-hint" style="margin:4px 0 0">Puedes elegir uno, varios o todos. Sin selección = todos.</div>
          </div>
        </div>
        </div>
        <label for="p-responsable">Responsable</label>
        <select id="p-responsable">
          <option value="">Sin asignar</option>
          ${p.responsables.map(u=>`<option value="${esc(u.id)}">${esc(u.nombre)}</option>`).join('')}
        </select>
        ${!p.responsables.length? `<div class="hint" style="margin:4px 0 0">Invita a alguien de tu equipo desde Configuraciones para poder asignarlo aquí.</div>` : ''}
        <label for="p-nota">Nota</label>
        <input type="text" id="p-nota" placeholder="Opcional">
        <div style="margin-top:14px">
          <button type="submit" class="btn btn-primary">Agregar</button>
        </div>
      </form>
    </div>

    ${entradasVisibles.length? `
      <div class="section-head"><h2 style="font-size:15px">${tituloResumen}</h2></div>
      ${p.universoError? `
      <div class="card" style="margin-bottom:14px;border-color:var(--warn)">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span>No se pudo calcular el SKU a contar de este plan (${esc(p.universoError)}). Los totales de abajo están incompletos.</span>
          <button type="button" class="btn btn-secondary" id="btn-reintentar-universo" style="width:auto;padding:6px 12px;font-size:12px">Reintentar</button>
        </div>
      </div>
      ` : ''}
      <div class="card">
        <div class="hint" style="margin-bottom:8px">SKU a contar por ${modo==='anio'?'mes':'día'} (${totalSemana} en total)</div>
        ${renderBarChart(datosGrafico, 'cantidad', 'var(--amber)', modo==='anio'? fmtMesCorto : (modo==='semana'||modo==='dia')? abrevDiaSemana : fmtDiaCorto, true)}
      </div>
      <div class="card">
        <div class="hint" style="margin-bottom:10px">SKU a contar por responsable</div>

          ${p.seleccionados.length? `${p.seleccionados.length} entrada${p.seleccionados.length>1?'s':''} seleccionada${p.seleccionados.length>1?'s':''}` : 'Seleccionar todo'}
        </label>
        ${p.seleccionados.length? `
          <div style="display:flex;gap:8px;flex-wrap:wrap;flex:none">
            <select id="plan-reasignar-select" style="width:auto">
              <option value="__elegir__" selected>Reasignar a…</option>
              <option value="">Sin asignar</option>
              ${p.responsables.map(u=>`<option value="${esc(u.id)}">${esc(u.nombre)}</option>`).join('')}
            </select>
            <button class="btn btn-secondary" id="btn-reasignar-seleccion-plan" style="width:auto;padding:8px 12px">Reasignar</button>
            <button class="btn btn-secondary" id="btn-cancelar-seleccion-plan" style="width:auto;padding:8px 12px">Cancelar</button>
            <button class="btn" id="btn-borrar-seleccion-plan" style="width:auto;padding:8px 12px;background:var(--danger);color:#fff">${ICONS.papelera.replace('style="width:15px;height:15px"','style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"')} Eliminar</button>
          </div>
        ` : ''}
      </div>
    ` : ''}

    ${grupos.filter(d=>d.entradas.length).map(d=>`
      <div class="section-head"><h2 style="font-size:15px;text-transform:capitalize">${esc(d.label)}${modo==='semana'? ' · '+d.corta : ''}</h2></div>
      <div class="card">
        ${d.entradas.map(e=> p.editando===e.id ? `
          <div class="plan-item" style="flex-direction:column;align-items:stretch;gap:0">
            <div class="plan-item-ubic" style="margin-bottom:8px">${esc(etiquetaUbicacionEntradaPlan(e))}</div>
            <label for="pe-fecha-${e.id}">Fecha</label>
            <input type="date" id="pe-fecha-${e.id}" value="${e.fecha}">
            <label for="pe-responsable-${e.id}">Responsable</label>
            <select id="pe-responsable-${e.id}">
              <option value="">Sin asignar</option>
              ${p.responsables.map(u=>`<option value="${esc(u.id)}" ${u.id===e.responsable_id?'selected':''}>${esc(u.nombre)}</option>`).join('')}
            </select>
            <label for="pe-nota-${e.id}">Nota</label>

// Cupo de operadores del plan (max_usuarios cuenta solo rol='operador' activos, ver el
// trigger chequear_limite_usuarios). null = sin límite (plan Empresa) o equipo aún sin cargar,
// distinto de 0 = límite alcanzado — lo usan tanto el hint como el botón de invitar.
function cupoOperadoresRestantes(empresa){
  const max = empresa.planes && empresa.planes.max_usuarios;
  if(max==null || !state.equipo.cargado) return null;
  const activos = state.equipo.personas.filter(p=>p.activo && p.rol!=='admin').length;
  return Math.max(0, max - activos);
}

// Referencia chica junto al formulario de invitación.
function hintCupoOperadores(empresa){
  const restantes = cupoOperadoresRestantes(empresa);
  if(restantes===null) return '';
  const max = empresa.planes.max_usuarios;
  const texto = restantes>0
    ? `Puedes crear ${restantes} operador${restantes===1?'':'es'} más (tu plan permite hasta ${max}).`
    : `Alcanzaste el límite de operadores de tu plan (${max}). Actualiza el plan para agregar más.`;
  return `<div class="hint" style="margin-top:8px;font-size:11px">${esc(texto)}</div>`;
}

// "Períodos" (ciclos de conteo) ahora es su propia pestaña admin (VISTAS_SOLO_ADMIN), separada
// de Configuraciones a pedido de Joel — el SKU que ocupaba ese lugar en la barra inferior pasó
// a un ícono arriba (junto a Buscar). Antes vivía como una tarjeta dentro de Configuraciones.
// Aviso previo de un cambio de período ya programado (ver activar_periodos_programados, cron
// diario): si alguien pre-creó un período futuro, el cron lo activa solo apenas llega su fecha
// de inicio -- lo que de paso cierra el actual y genera su informe. Esto NO bloquea ni pide
// confirmación (a pedido de Joel: "avisando antes", el cambio ocurre igual) -- solo avisa con
// unos días de anticipación para que no sea sorpresa.
function proximoCambioProgramadoPeriodo(){
  const actual = state.ciclos.find(c=>c.es_actual);
  const hoy = fechaISO(new Date());
  const siguiente = state.ciclos
    .filter(c=>!c.es_actual && c.fecha_inicio && c.fecha_inicio > hoy)
    .sort((a,b)=> a.fecha_inicio.localeCompare(b.fecha_inicio))[0];
  if(!siguiente) return null;
  const dias = Math.round((new Date(siguiente.fecha_inicio+'T00:00:00') - new Date(hoy+'T00:00:00')) / 86400000);
  if(dias > DIAS_AVISO_CAMBIO_PERIODO) return null;
  return {actual, siguiente, dias};
}

  const cambioProgramado = proximoCambioProgramadoPeriodo();
  return `

      ${cambioProgramado? `<div class="hint" style="margin-bottom:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg-warn,rgba(217,119,6,.08))">
        📅 ${cambioProgramado.actual? `El período actual (<strong>${esc(cambioProgramado.actual.nombre)}</strong>) pasará automáticamente a` : 'Se activará automáticamente'} <strong>${esc(cambioProgramado.siguiente.nombre)}</strong> el ${esc(fmtFecha(cambioProgramado.siguiente.fecha_inicio))} (${cambioProgramado.dias===0?'hoy':cambioProgramado.dias===1?'mañana':`en ${cambioProgramado.dias} días`}) -- no hace falta que hagas nada, es automático.
      </div>` : ''}
      <form id="form-crear-ciclo">
        <label for="ciclo-nombre">Nombre del período</label>
        <input type="text" id="ciclo-nombre" placeholder="Ej. T1 2027" required>
        <label for="ciclo-fecha-inicio" style="margin-top:8px">Fecha de inicio</label>
        <input type="date" id="ciclo-fecha-inicio" value="${esc(fechaISO(new Date()))}" required>
        <div style="margin-top:10px"><button type="submit" class="btn btn-secondary" style="width:auto;padding:8px 14px">Crear período de conteo</button></div>
      </form>
      ${state.ciclos.length? `<div style="margin-top:12px">${state.ciclos.map(c=> c.id===state.cicloEditandoId? `
        <div class="plan-item" style="padding:8px 0;align-items:flex-end;flex-wrap:wrap;gap:8px">
          <div style="flex:1;min-width:160px">
            <div class="plan-item-ubic" style="font-weight:500">${esc(c.nombre)}</div>
            <label for="ciclo-fecha-inicio-editar" style="margin-top:6px">Fecha de inicio</label>
            <input type="date" id="ciclo-fecha-inicio-editar" value="${esc(c.fecha_inicio||'')}" required>
          </div>
          <button type="button" class="btn btn-secondary" data-guardar-fecha-ciclo="${esc(c.id)}" style="width:auto;padding:6px 12px;font-size:12px">Guardar</button>
          <button type="button" class="btn btn-secondary" data-cancelar-editar-ciclo style="width:auto;padding:6px 12px;font-size:12px">Cancelar</button>
        </div>
      ` : `
        <div class="plan-item" style="padding:8px 0;align-items:center;flex-wrap:wrap;gap:8px">
          <div style="flex:1">
            <div class="plan-item-ubic" style="font-weight:500">${esc(c.nombre)}</div>
            ${c.fecha_inicio? `<div class="hint" style="margin-top:2px">Inicio: ${esc(c.fecha_inicio)} <button type="button" class="link-btn" data-editar-fecha-ciclo="${esc(c.id)}" style="margin-left:4px">Editar</button></div>` : ''}
          </div>
          ${c.es_actual? `<span class="badge badge-ok">Actual</span>` : `<button type="button" class="btn btn-secondary" data-marcar-ciclo-actual="${esc(c.id)}" style="width:auto;padding:6px 12px;font-size:12px">Marcar como actual</button>`}
        </div>
      `).join('')}</div>` : `<div class="empty" style="padding:14px 8px">Todavía no hay ciclos creados. Mientras no crees uno, los conteos se guardan sin período asignado.</div>`}
    </div>
    ${planIncluye('dashboard_ejecutivo_habilitado')? `
    <div class="section-head" style="margin-top:20px"><div><span class="eyebrow">Automático al cerrar cada ciclo</span><h2>Informes de cierre</h2></div></div>
    <div class="card">
      <div class="hint" style="margin-bottom:10px">Cada vez que marcas un ciclo distinto como actual, el que estaba activo se cierra y su informe queda guardado acá para siempre -- con la exactitud, el avance y los reconteos que quedaron sin resolver en ese momento.</div>
      ${state.informesCiclo.cargando? `<div class="hint" style="text-align:center;padding:14px 0">Cargando…</div>` : state.informesCiclo.lista.length? state.informesCiclo.lista.map(inf=>`
        <div class="plan-item" style="padding:8px 0;align-items:center;flex-wrap:wrap;gap:8px">
          <div style="flex:1">
            <div class="plan-item-ubic" style="font-weight:500">${esc(inf.ciclo_nombre)}</div>
            <div class="hint" style="margin-top:2px">${esc(fmtFecha(inf.fecha_inicio))} → ${esc(fmtFechaHora(inf.fecha_cierre))}</div>
          </div>
          <button type="button" class="btn btn-secondary" data-ver-informe-ciclo="${esc(inf.id)}" style="width:auto;padding:6px 12px;font-size:12px">Ver informe</button>
        </div>
      `).join('') : `<div class="empty" style="padding:14px 8px">Todavía no se ha cerrado ningún ciclo.</div>`}
    </div>
    ` : ''}
  `;
}

// Grupos de conteo (ej. "IE", "5S"): listas curadas de materiales para llevar un seguimiento
// separado de crítico/no crítico. Se arman a mano acá, con un buscador simple (texto+bodega)
// -- NO por carga masiva (ver conversación con Joel). "Crítico" es totalmente independiente.
function renderGrupos(){
  const g = state.grupos;
  if(g.grupoAbierto) return renderDetalleGrupo();
  return `
    <div class="section-head"><div><span class="eyebrow">Empresa</span><h2>Grupos de conteo</h2></div></div>
    <div class="card">
      <div class="hint" style="margin-bottom:10px">Listas de materiales para llevar un seguimiento separado del resto (ej. "IE" para insumos estratégicos, "5S"). Independiente de "Crítico".</div>
      ${g.creando? `
        <form id="form-crear-grupo">
          <label for="grupo-nombre">Nombre del grupo</label>
          <input type="text" id="grupo-nombre" placeholder="Ej. IE" required value="${esc(g.nombreNuevo)}">
          <label for="grupo-frecuencia" style="margin-top:8px">Frecuencia de conteo (días, opcional)</label>
          <input type="number" id="grupo-frecuencia" min="1" placeholder="Ej. 90" value="${esc(g.frecuenciaNuevaDias)}">
          <label for="grupo-fecha-inicio-nuevo" style="margin-top:8px">Fecha de inicio del ciclo</label>
          <input type="date" id="grupo-fecha-inicio-nuevo" value="${esc(g.fechaInicioNueva || fechaISO(new Date()))}" required>
          ${g.lista.some(x=>x.automatico_critico)? '' : `
          <label style="display:flex;align-items:center;gap:6px;font-weight:400;margin-top:10px">
            <input type="checkbox" id="grupo-automatico-critico" ${g.automaticoCriticoNuevo?'checked':''}>
            Automático: incluye todos los materiales marcados como Crítico (no se agregan a mano)
          </label>`}
          <div style="display:flex;gap:8px;margin-top:10px">
            <button type="submit" class="btn btn-secondary" style="width:auto;padding:8px 14px">Crear grupo</button>
            <button type="button" id="btn-cancelar-grupo" class="btn btn-secondary" style="width:auto;padding:8px 14px">Cancelar</button>
          </div>
        </form>
      ` : `<button type="button" id="btn-nuevo-grupo" class="btn btn-secondary" style="width:auto;padding:8px 14px">Crear grupo</button>`}
      ${g.cargando? `<div class="hint" style="text-align:center;padding:24px 0">Cargando…</div>` : g.lista.length? `<div style="margin-top:14px">${g.lista.map(grupo=>{
        const cantidad = (grupo.miembros && grupo.miembros[0] && grupo.miembros[0].count) || 0;
        const descripcionPosiciones = grupo.posiciones!=null ? ` · ${grupo.posiciones} posici${grupo.posiciones===1?'ón':'ones'}` : '';
        const descripcionCantidad = grupo.automatico_critico
          ? `${grupo.totalCriticos!=null ? `${grupo.totalCriticos} material${grupo.totalCriticos===1?'':'es'}${descripcionPosiciones} · ` : ''}Automático (Crítico)`
          : `${cantidad} material${cantidad===1?'':'es'}${descripcionPosiciones}`;
        const cicloListaGrupo = calcularCicloGrupo(grupo);
        const descripcionCiclo = cicloListaGrupo
          ? (cicloListaGrupo.vencido ? ` · <span style="color:var(--warn)">vencido</span>` : ` · día ${cicloListaGrupo.dia} de ${cicloListaGrupo.totalDias}`)
          : (grupo.frecuencia_dias ? ` · cada ${grupo.frecuencia_dias} días` : '');
        // Pedido de Joel: ver de un vistazo cuántas entradas de plan generó el último plan
        // automático de este grupo (ej. "332 entradas de plan"), sin tener que volver a generarlo
        // para verlo -- ver el conteo por nota en cargarGrupos.
        const descripcionEntradas = grupo.entradasPlan? ` · ${grupo.entradasPlan} entrada${grupo.entradasPlan===1?'':'s'} de plan` : '';
        return `
        <div class="plan-item" style="padding:10px 0;align-items:center;flex-wrap:wrap;gap:8px">
          <div style="flex:1">
            <div class="plan-item-ubic" style="font-weight:500">${esc(grupo.nombre)}</div>
            <div class="hint" style="margin-top:2px">${descripcionCantidad}${descripcionCiclo}${grupo.planResumen? '' : descripcionEntradas}</div>
            ${descripcionPlanGrupo(grupo)? `<div class="hint" style="margin-top:2px">${esc(descripcionPlanGrupo(grupo))}</div>` : ''}
          </div>
          <button type="button" class="btn btn-secondary" data-ver-grupo="${esc(grupo.id)}" style="width:auto;padding:6px 12px;font-size:12px">Ver</button>
        </div>
      `;}).join('')}</div>` : `<div class="empty" style="padding:14px 8px">Todavía no hay grupos creados.</div>`}
    </div>
    ${(g.pausados||[]).length? `
    <div class="section-head" style="margin-top:14px"><h2 style="font-size:15px">Grupos pausados</h2></div>
    <div class="card">
      <div class="hint" style="margin-bottom:6px">No cierran ciclos ni aparecen en Buscar. Conservan sus materiales y su historial.</div>
      ${g.pausados.map(grupo=>{
        const cantidad = (grupo.miembros && grupo.miembros[0] && grupo.miembros[0].count) || 0;
        return `
        <div class="plan-item" style="padding:10px 0;align-items:center;flex-wrap:wrap;gap:8px">
          <div style="flex:1">
            <div class="plan-item-ubic" style="font-weight:500;color:var(--text-dim)">${esc(grupo.nombre)}</div>
            <div class="hint" style="margin-top:2px">${grupo.automatico_critico? 'Automático (Crítico)' : `${cantidad} material${cantidad===1?'':'es'}`}${grupo.posiciones!=null? ` · ${grupo.posiciones} posici${grupo.posiciones===1?'ón':'ones'}` : ''}${grupo.frecuencia_dias? ` · cada ${grupo.frecuencia_dias} días` : ''} · pausado</div>
          </div>
          <button type="button" class="btn btn-secondary" data-reactivar-grupo="${esc(grupo.id)}" style="width:auto;padding:6px 12px;font-size:12px">Reactivar</button>
        </div>`;
      }).join('')}
    </div>
    ` : ''}
  `;
}

// Ver comentario sobre buscarCandidatosGrupo: este pedazo se repinta solo (sin tocar los <input>
// de arriba) cada vez que cambia el resultado de la búsqueda.
function renderResultadosCandidatosGrupo(){
  const g = state.grupos;
  return g.buscandoCandidatos? `<div class="hint" style="text-align:center;padding:16px 0">Buscando…</div>` :
    g.candidatos.length? `<div style="margin-top:10px">${g.candidatos.map(c=>`
      <div class="plan-item" style="padding:6px 0;align-items:center;gap:8px">
        <div style="flex:1">${esc(c.sku_code)} — ${esc(c.descripcion||'')}${c.bodega? ` · ${esc(c.bodega)}` : ' · sin bodega'}</div>
        <button type="button" class="btn btn-secondary" data-agregar-miembro-grupo="${esc(c.sku_code)}" data-agregar-miembro-bodega="${esc(c.bodega||'')}" style="width:auto;padding:5px 10px;font-size:12px">+ Agregar</button>
      </div>
    `).join('')}</div>` : '';
}

function bindResultadosCandidatosGrupo(){
  document.querySelectorAll('[data-agregar-miembro-grupo]').forEach(btn=>{
    btn.addEventListener('click', ()=> agregarMiembroGrupo(btn.dataset.agregarMiembroGrupo, btn.dataset.agregarMiembroBodega));
  });
}

function renderDetalleGrupo(){
  const g = state.grupos;
  const grupo = g.lista.find(x=>x.id===g.grupoAbierto);
  return `
    <div class="section-head"><div><span class="eyebrow">Grupo${grupo && grupo.automatico_critico? ' · Automático' : ''}</span><h2>${esc(grupo? grupo.nombre : '')}</h2></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <button type="button" id="btn-volver-grupos" class="btn btn-secondary" style="width:auto;padding:6px 12px;font-size:12px">← Volver a grupos</button>
      <button type="button" id="btn-pausar-grupo" class="btn btn-secondary" style="width:auto;padding:6px 12px;font-size:12px;color:var(--warn)" title="Deja de cerrar ciclos y sale de la lista; conserva materiales e historial. Se puede reactivar.">Pausar grupo</button>
    </div>
    <div class="card">
      <div class="hint" style="margin-bottom:8px">Seguimiento</div>
      ${g.seguimientoCargando? `<div class="hint" style="text-align:center;padding:12px 0">Cargando…</div>` : !g.seguimiento ? '' : `
      ${g.seguimiento.totalMiembros>0 && grupo && grupo.posiciones!=null ? `<div class="hint" style="margin-bottom:8px"><strong style="color:var(--text)">${g.seguimiento.totalMiembros}</strong> material${g.seguimiento.totalMiembros===1?'':'es'} · <strong style="color:var(--text)">${grupo.posiciones}</strong> posici${grupo.posiciones===1?'ón':'ones'} en el maestro (ubicación / storage bin / batch). Buscar y el plan trabajan por posición; el seguimiento de abajo, por material.</div>` : ''}
      ${g.seguimiento.cicloActual ? `<div class="hint" style="margin-bottom:10px">Período actual: <strong>${esc(g.seguimiento.cicloActual.nombre)}</strong> · día ${g.seguimiento.cicloActual.dias}</div>` : ''}
      ${g.seguimiento.totalMiembros===0 ? `<div class="empty" style="padding:10px 8px">Sin materiales todavía.</div>` : g.seguimiento.tieneFrecuencia ? `
      ${g.editandoFechaInicioId===grupo.id ? `
      <div class="hint" style="margin-bottom:8px;display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap">
        <div>
          <label for="grupo-fecha-inicio-editar" style="display:block;margin-bottom:2px">Fecha de inicio del ciclo</label>
          <input type="date" id="grupo-fecha-inicio-editar" value="${esc(grupo.fecha_inicio||'')}" required>
        </div>
        <button type="button" class="btn btn-secondary" data-guardar-fecha-inicio-grupo="${esc(grupo.id)}" style="width:auto;padding:6px 12px;font-size:12px">Guardar</button>
        <button type="button" class="btn btn-secondary" data-cancelar-fecha-inicio-grupo style="width:auto;padding:6px 12px;font-size:12px">Cancelar</button>
      </div>
      ` : `
      <div class="hint" style="margin-bottom:8px">${g.seguimiento.cicloGrupo.vencido
        ? `Ciclo del grupo: <strong style="color:var(--warn)">vencido</strong> (debía terminar el ${fmtFecha(g.seguimiento.cicloGrupo.fechaTermino)}) · se cerrará automáticamente en la próxima pasada nocturna`
        : `Ciclo del grupo: día ${g.seguimiento.cicloGrupo.dia} de ${g.seguimiento.cicloGrupo.totalDias} · termina el ${fmtFecha(g.seguimiento.cicloGrupo.fechaTermino)}`
      } <button type="button" class="link-btn" data-editar-fecha-inicio-grupo="${esc(grupo.id)}" style="margin-left:4px">Editar inicio</button></div>
      `}
      <div style="display:flex;gap:20px;flex-wrap:wrap">
        <div><div style="font-size:22px;font-weight:700;color:var(--ok)">${g.seguimiento.contadosCiclo}</div><div class="hint">Contados en este ciclo</div></div>
        <div><div style="font-size:22px;font-weight:700;color:var(--warn)">${g.seguimiento.pendientesCiclo}</div><div class="hint">Pendientes de este ciclo</div></div>
      </div>
      <div class="hint" style="margin-top:6px">Cuando pasa la fecha de término, el cierre guarda quién quedó contado y quién no (incluidos los conteos hechos hasta el día anterior al cierre). El ciclo siguiente parte el día del cierre, con todos los materiales pendientes.</div>
      ` : `<div class="hint">${g.seguimiento.totalMiembros - g.seguimiento.nuncaContados} de ${g.seguimiento.totalMiembros} material${g.seguimiento.totalMiembros===1?'':'es'} contado${g.seguimiento.totalMiembros===1?'':'s'} alguna vez${g.seguimiento.nuncaContados? ` (${g.seguimiento.nuncaContados} nunca contado${g.seguimiento.nuncaContados===1?'':'s'})` : ''}. Define una frecuencia en este grupo para llevar un ciclo con fecha de inicio y término.</div>`}
      ${g.seguimiento.totalMiembros>0 ? `
      <div class="hint" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">Ritmo reciente -- Esta semana: <strong>${g.seguimiento.contadosSemana}</strong> de ${g.seguimiento.totalMiembros} · Este mes: <strong>${g.seguimiento.contadosMes}</strong> de ${g.seguimiento.totalMiembros}</div>
      ` : ''}
      `}
    </div>
    ${grupo && grupo.frecuencia_dias ? `
    <div class="card" style="margin-top:14px">
      <div class="hint" style="margin-bottom:8px">Historial de ciclos cerrados</div>
      ${g.historialCargando? `<div class="hint" style="text-align:center;padding:12px 0">Cargando…</div>` : g.historial.length? g.historial.map(h=>{
        const clave = claveHistorialCiclo(h.fecha_inicio, h.fecha_termino);
        const abierto = g.historialAbierto === clave;
        return `
        <div style="border-bottom:1px solid var(--line);padding:6px 0">
          <div style="display:flex;align-items:center;gap:8px">
            <button type="button" data-toggle-historial-ciclo="${esc(h.fecha_inicio)}|${esc(h.fecha_termino)}" style="display:flex;justify-content:space-between;align-items:center;flex:1;gap:8px;background:none;border:none;padding:4px;cursor:pointer;text-align:left">
              <span>${fmtFecha(h.fecha_inicio)} – ${fmtFecha(h.fecha_termino)}</span>
              <span class="hint">${h.contados} de ${h.total_miembros} contados</span>
            </button>
            <button type="button" class="btn btn-secondary" data-pdf-historial-ciclo="${esc(h.fecha_inicio)}|${esc(h.fecha_termino)}" style="width:auto;padding:5px 10px;font-size:12px" title="Exportar este ciclo cerrado a PDF">${ICONS.download} PDF</button>
          </div>
          ${abierto ? `<div style="margin-top:6px;padding-left:4px">
            ${g.historialDetalleCargando? `<div class="hint">Cargando…</div>` : g.historialDetalle.map(f=>`
              <div class="hint" style="display:flex;justify-content:space-between;gap:8px;padding:2px 0">
                <span>${esc(f.sku_code)}${f.bodega? ` · ${esc(f.bodega)}` : ''}</span>
                <span style="color:${f.contado?'var(--ok)':'var(--text-dim)'}">${f.contado? '✓ contado' : 'no contado'}</span>
              </div>
            `).join('')}
          </div>` : ''}
        </div>
      `;}).join('') : `<div class="empty" style="padding:10px 8px">Todavía no se ha cerrado ningún ciclo de este grupo.</div>`}
    </div>
    ` : ''}
    <div class="card" style="margin-top:14px">
      <div class="hint" style="margin-bottom:8px">Materiales de este grupo</div>
      ${grupo && grupo.automatico_critico ? `<div class="hint">Automático: incluye todos los materiales marcados como Crítico${g.seguimiento? ` (actualmente ${g.seguimiento.totalMiembros} material${g.seguimiento.totalMiembros===1?'':'es'})` : ''}. Para agregar o quitar materiales, actualiza el campo Crítico desde Carga masiva o Cargar SKU -- no se agregan a mano acá.</div>` :
      g.cargandoMiembros? `<div class="hint" style="text-align:center;padding:16px 0">Cargando…</div>` : g.miembros.length? g.miembros.map(m=>{
        // Estado por material -- a pedido de Joel ("está pobre y poco informativo"): descripción,
        // Crítico, y si ya está contado en el ciclo actual del grupo (o, sin ciclo, si se ha
        // contado alguna vez), calculado en cargarMiembrosGrupo para no repetir la lógica acá.
        const estado = m.tieneCiclo
          ? (m.contadoEsteCiclo? `<span class="badge badge-ok">Contado</span>` : `<span class="badge badge-warn">Pendiente</span>`)
          : (m.contadoAlgunaVez? `<span class="badge badge-neutral">Contado alguna vez</span>` : `<span class="badge badge-warn">Nunca contado</span>`);
        return `
        <div class="plan-item" style="padding:6px 0;align-items:center;gap:8px">
          <div style="flex:1">
            <div>${esc(m.sku_code)}${m.bodega? ` · ${esc(m.bodega)}` : ' · sin bodega'}${m.critico? ` <span class="badge badge-steel">Crítico</span>` : ''}</div>
            ${m.descripcion? `<div class="hint" style="margin-top:2px">${esc(m.descripcion)}</div>` : ''}
          </div>
          ${estado}
          <button type="button" class="btn btn-secondary" data-quitar-miembro-grupo="${esc(m.id)}" style="width:auto;padding:5px 10px;font-size:12px">Quitar</button>
        </div>
      `;}).join('') : `<div class="empty" style="padding:10px 8px">Todavía no hay materiales en este grupo.</div>`}
    </div>
    ${grupo && grupo.automatico_critico ? '' : `
    <div class="card" style="margin-top:14px">
      <div class="hint" style="margin-bottom:8px">Agregar materiales</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input type="text" id="candidato-texto" placeholder="Código o descripción" value="${esc(g.candidatoTexto)}" autocomplete="off" style="flex:1;min-width:160px">
        <input type="text" id="candidato-bodega" placeholder="Bodega" value="${esc(g.candidatoBodega)}" autocomplete="off" style="width:120px">
      </div>
      <div id="candidatos-grupo-resultados">${renderResultadosCandidatosGrupo()}</div>
    </div>
    `}
    <div class="card" style="margin-top:14px">
      <div class="hint" style="margin-bottom:8px">Vista previa del plan (según la frecuencia del grupo)</div>
      ${descripcionPlanGrupo(grupo)? `<div class="hint" style="margin-bottom:8px;padding:8px 10px;background:var(--surface-2);border-radius:8px">${esc(descripcionPlanGrupo(grupo))}. Generar de nuevo reemplaza esas entradas.</div>` : ''}
      ${!grupo || !grupo.frecuencia_dias ? `<div class="empty" style="padding:10px 8px">Este grupo no tiene una frecuencia definida todavía.</div>` : `
      <div class="hint" style="margin-bottom:6px">Capacidad semanal real -- de esto sale el cupo, en vez de un número puesto a ojo.</div>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
        <div>
          <label for="grupo-personas">Personas</label>
          <input type="number" id="grupo-personas" min="1" value="${esc(g.personasDisponibles||1)}" style="width:90px">
        </div>
        <div>
          <label for="grupo-horas">Horas c/u por semana</label>
          <input type="number" id="grupo-horas" min="1" value="${esc(g.horasPorPersona||10)}" style="width:110px">
        </div>
        <div>
          <label for="grupo-ritmo">Materiales por hora</label>
          <input type="number" id="grupo-ritmo" min="1" value="${esc(g.ritmoPorHora||15)}" style="width:110px">
        </div>
      </div>

// Calendario mensual: planificado/contado/recontado/pendiente por día (ver resumen_calendario_mes
// -- alcance por rol lo resuelve el propio RPC, acá solo se pinta lo que llega). Semana de lunes a
// domingo, igual convención que Planificación (ver inicioSemana).
const DOW_CORTOS = ['L','M','M','J','V','S','D'];
function renderCalendario(){
  const cal = state.calendario;
  const [y, m] = cal.mes.split('-').map(Number);
  const primerDiaSemana = (new Date(y, m-1, 1).getDay() + 6) % 7; // 0=lunes
  const diasEnMes = new Date(y, m, 0).getDate();
  const porFecha = {};
  cal.dias.forEach(d=> porFecha[d.fecha] = d);
  const hoy = fechaISO(new Date());
  const celdas = [];
  for(let i=0; i<primerDiaSemana; i++) celdas.push(null);
  for(let dia=1; dia<=diasEnMes; dia++) celdas.push(`${y}-${String(m).padStart(2,'0')}-${String(dia).padStart(2,'0')}`);
  const detalle = cal.diaSeleccionado ? porFecha[cal.diaSeleccionado] : null;
  const esAdmin = state.perfil && (state.perfil.rol==='admin' || state.perfil.es_super_admin);

  return `
    <div class="section-head"><div><span class="eyebrow">Empresa</span><h2>Calendario</h2></div></div>
    <div class="hint" style="margin-bottom:14px">Cuánto se planificó, contó y recontó cada día. ${esAdmin? 'Ves toda la empresa.' : 'Ves solo lo tuyo (tu plan y tus conteos).'}</div>
    <div class="hint" style="margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap">
      <span><strong style="color:var(--text-faint)">P</strong> Planificado</span>
      <span><strong style="color:var(--ok)">C</strong> Contado</span>
      <span><strong style="color:var(--steel)">R</strong> Recontado</span>
    </div>
    <div class="card">
      <div class="cal-nav">
        <button type="button" id="cal-mes-prev" class="btn btn-secondary cal-nav-btn" aria-label="Mes anterior">‹</button>
        <h3>${esc(MESES_ES[m-1])} ${y}</h3>
        <button type="button" id="cal-mes-next" class="btn btn-secondary cal-nav-btn" aria-label="Mes siguiente">›</button>
      </div>
      ${cal.cargando? `<div class="hint" style="text-align:center;padding:24px 0">Cargando…</div>` : `
      <div class="cal-grid" style="margin-bottom:5px">${DOW_CORTOS.map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
      <div class="cal-grid">
        ${celdas.map(fecha=>{
          if(!fecha) return `<button type="button" class="cal-dia" disabled tabindex="-1"></button>`;
          const d = porFecha[fecha];
          const clases = ['cal-dia'];
          if(fecha===hoy) clases.push('es-hoy');
          if(fecha===cal.diaSeleccionado) clases.push('seleccionado');
          return `
          <button type="button" class="${clases.join(' ')}" data-cal-dia="${fecha}" aria-label="${fmtFecha(fecha)}">
            <span class="cal-dia-num">${Number(fecha.slice(-2))}</span>
            ${d && d.planificado? `<span class="cal-dia-fila c-plan">P ${d.planificado}</span>` : ''}
            ${d && d.contado? `<span class="cal-dia-fila c-contado">C ${d.contado}</span>` : ''}
            ${d && d.recontado? `<span class="cal-dia-fila c-recontado">R ${d.recontado}</span>` : ''}
          </button>`;
        }).join('')}
      </div>
      `}
    </div>
    ${detalle? `
    <div class="section-head"><div><span class="eyebrow">${esc(fmtFecha(detalle.fecha))}</span><h2 style="font-size:15px">Detalle del día</h2></div></div>
    <div class="card">
      <div class="cal-detalle-fila"><span>Planificado</span><span class="cal-detalle-num">${detalle.planificado}</span></div>
      <div class="cal-detalle-fila"><span>Contado</span><span class="cal-detalle-num" style="color:var(--ok)">${detalle.contado}</span></div>
      <div class="cal-detalle-fila"><span>Recontado</span><span class="cal-detalle-num" style="color:var(--steel)">${detalle.recontado}</span></div>
      <div class="cal-detalle-fila"><span>Pendiente</span><span class="cal-detalle-num" style="color:${detalle.pendiente>0?'var(--warn)':'var(--text-dim)'}">${detalle.pendiente}</span></div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button type="button" id="cal-ir-contar" class="btn btn-primary" style="width:auto;padding:8px 14px">Ir a Contar ese día</button>
        ${detalle.contado || detalle.recontado? `<button type="button" id="cal-ir-buscar" class="btn btn-secondary" style="width:auto;padding:8px 14px">${esAdmin? 'Ver lo contado' : 'Ver lo que conté'}</button>` : ''}
        ${esAdmin? `<button type="button" id="cal-ir-plan" class="btn btn-secondary" style="width:auto;padding:8px 14px">Ver en Planificación</button>` : ''}
      </div>
    </div>
    ` : cal.cargado? `<div class="empty" style="padding:14px 8px;text-align:center">Toca un día para ver el detalle.</div>` : ''}
  `;
}

// Estado de la verificación en dos pasos dentro de Configuraciones (ver cargarMfaFactores/
// iniciarEnrolamientoMfa/confirmarEnrolamientoMfa/desactivarMfa). Tres estados posibles: todavía
// cargando, enrolando (QR + código de confirmación), o el resumen (activada/no activada).
function renderSeccionMfa(){
  const en = state.mfaEnrolando;
  if(en){
    if(en.cargando) return `<div class="hint">Generando código…</div>`;
    return `
      <div class="hint" style="margin-bottom:10px">Escanea este código con tu app autenticadora (Google Authenticator, Authy, 1Password, etc.) y escribe el código de 6 dígitos que te muestra para confirmar.</div>
      ${en.qr? `<div style="display:flex;justify-content:center;margin-bottom:10px"><img src="${en.qr}" alt="Código QR para activar la verificación en dos pasos" style="width:180px;height:180px;background:#fff;border-radius:8px;padding:8px"></div>` : ''}
      ${en.secret? `<div class="hint" style="margin-bottom:10px;text-align:center">¿No puedes escanear? Ingresa este código a mano: <span class="mono" style="user-select:all">${esc(en.secret)}</span></div>` : ''}
      ${en.error? `<div style="color:var(--danger);font-size:12.5px;margin-bottom:8px">${esc(en.error)}</div>` : ''}
      <form id="form-mfa-confirmar">
        <label for="mfa-confirmar-codigo">Código de 6 dígitos</label>
        <input type="text" id="mfa-confirmar-codigo" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="123456" autocomplete="one-time-code" required>
        <div style="margin-top:10px;display:flex;gap:8px">
          <button type="submit" class="btn btn-primary" style="width:auto;padding:8px 14px" ${en.guardando?'disabled':''}>${en.guardando?'Confirmando…':'Confirmar y activar'}</button>
          <button type="button" id="btn-cancelar-mfa-enrolar" class="btn btn-secondary" style="width:auto;padding:8px 14px" ${en.guardando?'disabled':''}>Cancelar</button>
        </div>
      </form>
    `;
  }
  if(!state.mfaFactoresCargado) return `<div class="hint">Cargando…</div>`;
  const factorActivo = state.mfaFactores.find(f=>f.status==='verified');
  if(factorActivo){
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <div><span class="badge badge-ok">Activada</span> <span class="hint" style="display:inline">Tu cuenta pide un código además de la contraseña al iniciar sesión.</span></div>
        <button type="button" id="btn-mfa-desactivar" class="btn btn-secondary" style="width:auto;padding:8px 14px;color:var(--danger)" data-factor-id="${esc(factorActivo.id)}">Desactivar</button>
      </div>
    `;
  }
  return `
    <div class="hint" style="margin-bottom:10px">No está activada. Si tu cuenta es administradora, te recomendamos activarla.</div>
    <button type="button" id="btn-mfa-activar" class="btn btn-secondary" style="width:auto;padding:8px 14px">Activar verificación en dos pasos</button>
  `;
}
