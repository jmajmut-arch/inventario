/* =======================================================================
   RENDER — DASHBOARD
   ======================================================================= */
function pct(n){ return n===null||n===undefined? '0' : Number(n).toFixed(1); }
function clp(n){ return (Number(n)||0).toLocaleString('es-CL', {style:'currency', currency:'CLP', maximumFractionDigits:0}); }

/* =======================================================================
   GRÁFICOS — SVG plano, sin librerías externas
   ======================================================================= */
// Reportado: en el gráfico "SKU a contar por día" (con un Período elegido), la fecha mostrada
// no coincidía con la de la entrada de planificación (aparecía un día antes). Causa: new Date()
// sin hora explícita interpreta una fecha "YYYY-MM-DD" como medianoche UTC, no medianoche local
// — en Chile (UTC-3/-4) eso cae en el día calendario anterior. El resto del código (grupos,
// abrevDiaSemana, etc.) ya fuerza T00:00:00 para evitar justo este corrimiento.
function fmtDiaCorto(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short'}).replace('.',''); }

// Suma el avance diario (que viene por bodega) en un total por día calendario.
function agregarPorDia(diario, dias=14){
  const map = new Map();
  diario.forEach(r=>{
    const key = (r.dia||'').slice(0,10);
    if(!key) return;
    const cur = map.get(key) || { dia:key, contados:0, diferencias:0, reconteos:0 };
    // skus_contados/con_diferencia/reconteos vienen de count() en la vista SQL: PostgREST
    // serializa bigint como string (para no perder precisión), así que sin Number() esto
    // concatena texto en vez de sumar ("0"+"3" -> "03") y arruina el gráfico y la proyección.
    cur.contados += Number(r.skus_contados)||0;
    cur.diferencias += Number(r.con_diferencia)||0;
    cur.reconteos += Number(r.reconteos)||0;
    map.set(key, cur);
  });
  return Array.from(map.values()).sort((a,b)=> a.dia.localeCompare(b.dia)).slice(-dias);
}

// etiquetasLargas=true ensancha las columnas según la palabra más larga y parte en dos líneas
// las etiquetas de más de una palabra (ej. "No contado" -> "No" / "contado") -- para categorías
// de texto (ver renderBuscar), donde un solo día como "vie 21" nunca necesita este ancho extra.
// color puede ser un string (mismo color para todas las barras, como hasta ahora) o una función
// (d,i)=>string para pintar cada barra distinto según su dato (ej. por categoría/estado).
// opts (opcional): {clave: d=>string, activo: string|null} hace cada barra clicable
// (data-barra-clave) y atenúa las que no son la activa, igual que renderPieChart -- ver el gráfico
// de reconteos pendientes por semana.
function renderBarChart(datos, valueKey, color, labelFn=fmtDiaCorto, mostrarValor=false, etiquetasLargas=false, opts=null){
  if(!datos.length) return `<div class="empty">Sin datos todavía.</div>`;
  const colorDe = typeof color==='function' ? color : ()=>color;
  const claveDe = opts && typeof opts.clave==='function' ? opts.clave : null;
  const activo = opts ? opts.activo : null;
  const max = Math.max(1, ...datos.map(d=>d[valueKey]||0));
  const etiquetas = datos.map(d=> String(labelFn(d.dia)));
  const lineasPorEtiqueta = etiquetas.map(t=> etiquetasLargas ? t.split(' ') : [t]);
  const palabraMasLarga = Math.max(...lineasPorEtiqueta.flat().map(p=>p.length));
  const barW = etiquetasLargas ? Math.max(24, Math.round(palabraMasLarga*6.2)) : 24;
  const gap = 12, padTop = mostrarValor?26:16;
  const hayDosLineas = lineasPorEtiqueta.some(l=>l.length>1);
  const padBottom = hayDosLineas ? 32 : 20;
  const plotH = 90;
  const w = datos.length*(barW+gap)+gap;
  const h = plotH + padTop + padBottom;
  const baseline = padTop + plotH;
  const bars = datos.map((d,i)=>{
    const val = d[valueKey]||0;
    // Solo redondea lo que se MUESTRA (etiqueta y tooltip) -- el alto de la barra sigue usando
    // el valor exacto para no perder precisión ahí. Reportado por Joel: la exactitud mensual
    // (float, ej. 52.9411764705) se mostraba con todos los decimales; los conteos (siempre
    // enteros) no se ven afectados porque redondear un entero a 1 decimal da el mismo entero.
    const valTexto = Math.round(val*10)/10;
    const barH = Math.round((val/max)*plotH);
    const x = gap + i*(barW+gap);
    const y = baseline - barH;
    const topeY = Math.max(y,padTop);
    const lineas = lineasPorEtiqueta[i];
    const textoEje = lineas.length>1
      ? `<text x="${x+barW/2}" y="${baseline+13}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)"><tspan x="${x+barW/2}" dy="0">${esc(lineas[0])}</tspan><tspan x="${x+barW/2}" dy="11">${esc(lineas.slice(1).join(' '))}</tspan></text>`
      : `<text x="${x+barW/2}" y="${baseline+13}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)">${esc(lineas[0])}</text>`;
    const clave = claveDe ? String(claveDe(d,i)) : null;
    const atenuada = clave!==null && activo && activo!==clave;
    return `<g${clave!==null? ` data-barra-clave="${esc(clave)}" style="cursor:pointer${atenuada?';opacity:.35':''}" role="button" tabindex="0" aria-label="${esc(etiquetas[i])}: ${valTexto}"` : ''}>
      <rect x="${x}" y="${topeY}" width="${barW}" height="${Math.max(barH,val>0?2:0)}" rx="4" fill="${colorDe(d,i)}"><title>${esc(etiquetas[i])}: ${valTexto}</title></rect>
      ${mostrarValor && val>0? `<text x="${x+barW/2}" y="${topeY-5}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-dim)">${valTexto}</text>` : ''}
      ${textoEje}
    </g>`;
  }).join('');
  return `<div class="table-wrap"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block">
    <line x1="0" y1="${baseline}" x2="${w}" y2="${baseline}" stroke="var(--line)" stroke-width="1"/>
    ${bars}
  </svg></div>`;
}

// Igual que renderBarChart, pero cada barra se parte en dos segmentos apilados: la base
// (colorBase) con los conteos originales y, arriba, un segmento con colorExtra para los
// reconteos del día — a pedido de Joel, para distinguir a simple vista cuánto del trabajo
// diario fue contar SKU nuevos vs. resolver diferencias ya detectadas.
function renderBarChartApilado(datos, valueKey, extraKey, colorBase, colorExtra, labelExtra, labelFn=fmtDiaCorto){
  if(!datos.length) return `<div class="empty">Sin datos todavía.</div>`;
  const max = Math.max(1, ...datos.map(d=>d[valueKey]||0));
  const barW = 24, gap = 12, padTop = 26, padBottom = 20;
  const plotH = 90;
  const w = datos.length*(barW+gap)+gap;
  const h = plotH + padTop + padBottom;
  const baseline = padTop + plotH;
  const bars = datos.map((d,i)=>{
    const val = d[valueKey]||0;
    const extra = Math.min(val, d[extraKey]||0);
    const base = val - extra;
    const barH = Math.round((val/max)*plotH);
    const extraH = val>0 ? Math.round((extra/val)*barH) : 0;
    const baseH = Math.max(0, barH-extraH);
    const x = gap + i*(barW+gap);
    const yBase = baseline - baseH;
    const yExtra = yBase - extraH;
    const topeY = Math.max(Math.min(yBase,yExtra), padTop);
    return `<g>
      ${baseH>0? `<rect x="${x}" y="${yBase}" width="${barW}" height="${baseH}" fill="${colorBase}"><title>${esc(labelFn(d.dia))}: ${base} conteos</title></rect>` : ''}
      ${extraH>0? `<rect x="${x}" y="${yExtra}" width="${barW}" height="${extraH}" rx="${baseH>0?0:4}" fill="${colorExtra}"><title>${esc(labelFn(d.dia))}: ${extra} ${labelExtra}</title></rect>` : ''}
      ${val>0? `<text x="${x+barW/2}" y="${topeY-5}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-dim)">${val}</text>` : ''}
      <text x="${x+barW/2}" y="${baseline+13}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)">${esc(labelFn(d.dia))}</text>
    </g>`;
  }).join('');
  return `<div class="table-wrap"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block">
    <line x1="0" y1="${baseline}" x2="${w}" y2="${baseline}" stroke="var(--line)" stroke-width="1"/>
    ${bars}
  </svg></div>`;
}

// Un color por barra en el gráfico de resumen de Buscar (ver renderBarChart) -- verde/ámbar
// coinciden con badge-ok/badge-warn que ya usa estadoBadge para "Cuadrado"/"Diferencia";
// "No contado" y "Pendiente" no tienen badge de color propio en la tabla (ambas son
// badge-neutral), así que acá se distinguen con gris y azul para que las 4 barras se
// diferencien a simple vista.
const COLOR_RESUMEN_ESTADO_BUSQUEDA = { 'No contado':'var(--text-faint)', 'Cuadrado':'var(--ok)', 'Diferencia':'var(--warn)', 'Pendiente':'var(--steel)' };

// Resumen por estado para el gráfico de Buscar (ver renderBuscar) -- misma lógica que
// estadoBadge para decidir en qué grupo cae cada resultado, así el gráfico nunca contradice
// las etiquetas que ya se ven fila por fila en la tabla.
function resumenEstadoBusqueda(resultados){
  const grupos = { 'No contado':0, 'Cuadrado':0, 'Diferencia':0, 'Pendiente':0 };
  resultados.forEach(r=>{
    if(!r.conteo_id){ grupos['No contado']++; return; }
    if(r.diferencia && Number(r.diferencia)!==0){ grupos['Diferencia']++; return; }
    if(r.estado==='pendiente_revision'){ grupos['Pendiente']++; return; }
    grupos['Cuadrado']++;
  });
  return Object.entries(grupos).map(([dia,n])=>({dia, n}));
}

// Leyenda chica de colores para un gráfico apilado o de torta (ver renderBarChartApilado /
// renderPieChart). Cada item es [color, label] o, si el gráfico es seleccionable, [color, label,
// clave] -- con clave presente el ítem queda clickeable (data-porcion-clave) y se atenúa si hay
// una selección activa (`activo`) distinta a la suya.
function renderLeyendaColores(items, activo){
  return `<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px">${items.map(([color,label,clave])=>{
    const clickeable = clave!==undefined && clave!==null;
    const atenuar = clickeable && activo && activo!==clave;
    return `
    <span ${clickeable?`data-porcion-clave="${esc(clave)}" role="button" tabindex="0"`:''} style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);${clickeable?`cursor:pointer;opacity:${atenuar?0.5:1}`:''}">
      <span style="width:9px;height:9px;border-radius:2px;background:${color};display:inline-block;flex-shrink:0"></span>${esc(label)}
    </span>`;
  }).join('')}</div>`;
}

// Gráfico de torta genérico: colorFn(d,i) decide el color de cada porción, labelFn(d) el texto
// del tooltip. Cuando una sola porción cubre el 100% se dibuja como círculo completo -- un arco
// SVG no puede describir 360° con un solo path (inicio y fin coinciden).
// opts.clave(d) habilita selección: cada porción queda clickeable (data-porcion-clave) y, si
// opts.activo apunta a otra porción, esta se atenúa para resaltar la seleccionada.
function renderPieChart(datos, valueKey, colorFn, labelFn, opts){
  opts = opts || {};
  const total = datos.reduce((s,d)=>s+(d[valueKey]||0), 0);
  if(!total) return `<div class="empty">Sin datos todavía.</div>`;
  const cx=50, cy=50, r=42;
  const puntoEnCirculo = (anguloDeg)=>{
    const rad = anguloDeg*Math.PI/180;
    return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)];
  };
  let anguloAcum = -90; // arranca arriba (como un reloj en las 12), sentido horario
  const segmentos = datos.filter(d=>(d[valueKey]||0)>0).map((d,i)=>{
    const val = d[valueKey]||0;
    const frac = val/total;
    const pct = Math.round(frac*100);
    const titulo = `${esc(labelFn(d))}: ${val} (${pct}%)`;
    const clave = opts.clave ? opts.clave(d) : null;
    const atenuar = clave!==null && opts.activo && opts.activo!==clave;
    const atrs = clave!==null ? ` data-porcion-clave="${esc(clave)}" style="cursor:pointer;opacity:${atenuar?0.35:1}"` : '';
    if(frac>0.999) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${colorFn(d,i)}"${atrs}><title>${titulo}</title></circle>`;
    const inicio = anguloAcum;
    anguloAcum += frac*360;
    const [x1,y1] = puntoEnCirculo(inicio);
    const [x2,y2] = puntoEnCirculo(anguloAcum);
    const grandeArco = (anguloAcum-inicio)>180 ? 1 : 0;
    return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${grandeArco} 1 ${x2},${y2} Z" fill="${colorFn(d,i)}" stroke="var(--surface)" stroke-width="2"${atrs}><title>${titulo}</title></path>`;
  }).join('');
  return `<svg viewBox="0 0 100 100" width="140" height="140" style="display:block;margin:0 auto">${segmentos}</svg>`;
}

// Colores fijos por posición (no por persona, para no ciclar al azar) -- mismo criterio que
// COLOR_RESUMEN_ESTADO_BUSQUEDA. Más allá de la 5ta persona, resumenQuienConto agrupa el resto
// en "Otros", que cae naturalmente en este gris al quedar fuera del arreglo de 5 colores.
const COLOR_QUIEN_CONTO = ['var(--steel)','var(--amber)','var(--ok)','var(--warn)','var(--danger)'];
function colorQuienConto(d,i){ return COLOR_QUIEN_CONTO[i] || 'var(--text-faint)'; }

// Resumen "quién contó" para el gráfico de torta de Buscar (ver renderBuscar) -- solo sobre
// filas ya contadas (con conteo_id); un SKU "No contado" no tiene contador que atribuirle.
// Ordena de mayor a menor y agrupa todo lo que exceda las primeras 5 personas en "Otros", para
// no terminar con una torta de decenas de porciones ilegibles en una empresa con mucha gente.
// La entrada "Otros" lleva además su lista de nombres (`nombres`) para que un clic sobre esa
// porción (ver nombresParaFiltroContador) pueda filtrar por todas esas personas a la vez.
function resumenQuienConto(resultados){
  const map = new Map();
  resultados.forEach(r=>{
    if(!r.conteo_id) return;
    const nombre = r.contado_por || 'Sin asignar';
    map.set(nombre, (map.get(nombre)||0)+1);
  });
  const ordenado = Array.from(map.entries()).map(([nombre,n])=>({nombre,n})).sort((a,b)=>b.n-a.n);
  const TOPE = 5;
  if(ordenado.length<=TOPE) return ordenado;
  const resto = ordenado.slice(TOPE);
  const otros = resto.reduce((s,d)=>s+d.n, 0);
  return [...ordenado.slice(0,TOPE), {nombre:'Otros', n:otros, nombres: resto.map(d=>d.nombre)}];
}

// Resuelve a qué nombre(s) de contador corresponde la porción/leyenda seleccionada: la propia
// persona, o -- si se seleccionó "Otros" -- la lista de nombres que ese bucket agrupa.
function nombresParaFiltroContador(quienConto, clave){
  if(!clave) return null;
  const entrada = quienConto.find(d=>d.nombre===clave);
  if(entrada && entrada.nombres) return entrada.nombres;
  return [clave];
}

function abrevDiaSemana(iso){
  const d = new Date(iso+'T00:00:00');
  const s = d.toLocaleDateString('es-CL',{weekday:'short'}).replace('.','');
  return s.charAt(0).toUpperCase()+s.slice(1);
}

// Agrupa el universo de SKU planificado por responsable, ordenado de mayor a menor carga. Dedupe
// por sku.id (no solo suma el universo de cada entrada): dos entradas de plan pueden cubrir el
// mismo SKU -- ej. una entrada "toda la ubicación" y otra de un storage bin específico dentro de
// ella, o dos generaciones del plan automático de un grupo conviviendo porque la segunda se creó
// sin borrar la primera -- y sumarlas tal cual duplica el conteo. Bug real reportado por Joel: el
// Calendario mostraba 100 pendientes para un día, pero Planificación mostraba 164 para ese mismo
// día, porque acá (y en el total por día de abajo) se sumaba por entrada en vez de contar SKU
// distintos; el Calendario (resumen_calendario_mes, en el servidor) sí deduplica por SKU. Un SKU
// que aparece en entradas de más de un responsable queda asignado al primero que lo cubre, para
// que la suma de este ranking calce con el total deduplicado del gráfico por día. Una entrada
// recién creada cuyo detalle todavía no llegó (universo en "Calculando…") no tiene con qué
// deduplicar -- se suma tal cual su universo, igual que antes, hasta que el detalle esté listo.
function resumenPorResponsable(entradas, universos, detalle, propios={}){
  const map = new Map();
  const asignado = new Set();
  entradas.forEach(e=>{
    const nombre = e.responsable_nombre || 'Sin asignar';
    if(!map.has(nombre)) map.set(nombre, 0);
    const det = detalle[e.id];
    if(det){
      det.forEach(s=>{
        if(asignado.has(s.id)) return;
        asignado.add(s.id);
        map.set(nombre, map.get(nombre)+1);
      });
    }else if(propios && propios[e.id]!==undefined){
      // Vista resumida (sin detalle de SKU): el servidor ya descontó lo cubierto por una entrada
      // anterior (ver resumenEntradasPlan), misma regla que la deduplicación de arriba.
      map.set(nombre, map.get(nombre) + (propios[e.id]||0));
    }else{
      map.set(nombre, map.get(nombre) + (universos[e.id]||0));
    }
  });
  return Array.from(map, ([nombre, cantidad])=>({nombre, cantidad})).sort((a,b)=> b.cantidad-a.cantidad);
}

// Lista de barras horizontales para comparar magnitudes por categoría (responsable, bodega, etc.),
// escaladas contra la mayor del grupo (no contra un total), de mayor a menor.
function renderRankedBarList(filas){
  if(!filas.length) return `<div class="empty">Sin datos todavía.</div>`;
  const max = Math.max(1, ...filas.map(f=>f.cantidad));
  return filas.map(f=>{
    const p = Math.round(f.cantidad/max*100);
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <span style="font-size:12.5px;color:var(--text-dim)">${esc(f.nombre)}</span>
        <span class="mono" style="font-size:12.5px;color:var(--text)">${f.cantidad} SKU</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${p}%"></div></div>
    </div>`;
  }).join('');
}

// Ranking de exactitud por bodega: a diferencia de renderRankedBarList, cada barra ya es
// un porcentaje (0-100), así que se escala contra 100 fijo, no contra el máximo del grupo.
function renderExactitudBarList(filas){
  if(!filas.length) return `<div class="empty">Sin datos todavía.</div>`;
  return filas.map(f=>`<div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
      <span style="font-size:12.5px;color:var(--text-dim)">${esc(f.nombre)}</span>

// Fecha estimada de término si se mantiene el ritmo promedio reciente (contados en la ventana
// / días REALMENTE transcurridos desde el primer conteo de esa ventana, incluidos los días sin
// actividad en el medio — así el promedio ya refleja fines de semana o pausas reales). Bug real
// reportado por Joel: antes se dividía siempre por los VENTANA_PROYECCION_DIAS (14) fijos,
// aunque el ciclo recién hubiera empezado hace 2 días — eso dividía por 12 días que nunca
// existieron y disparaba el ritmo diario hacia abajo (proyección "pésima", días restantes
// inflados). Ahora el denominador es min(14, días desde el primer día CON conteos dentro de la
// ventana hasta hoy) — nunca más días de los que realmente pudieron contarse.
function proyeccionTermino(totUniverso, totContados, diarioAgg){
  const pendientes = Math.max(0, totUniverso - totContados);
  if(totUniverso===0) return {titulo:'—', detalle:'Aún no hay SKU cargados.'};
  if(pendientes===0) return {titulo:'¡Inventario completo!', detalle:'No quedan SKU pendientes por contar.'};
  const contadosEnVentana = diarioAgg.reduce((s,d)=>s+d.contados,0);
  if(!diarioAgg.length || contadosEnVentana<=0) return {titulo:'Sin proyección', detalle:`Sin conteos en los últimos ${VENTANA_PROYECCION_DIAS} días para estimar un ritmo.`};
  const primerDia = new Date(diarioAgg[0].dia+'T00:00:00');
  const hoy = new Date(fechaISO(new Date())+'T00:00:00');
  const diasTranscurridos = Math.min(VENTANA_PROYECCION_DIAS, Math.round((hoy-primerDia)/86400000)+1);
  const ritmoDiario = contadosEnVentana / diasTranscurridos;
  const diasRestantes = Math.ceil(pendientes/ritmoDiario);
  const fechaProyectada = fechaISO(sumarDias(new Date(), diasRestantes));
  return {
    titulo: fmtFecha(fechaProyectada),
    detalle: `${diasRestantes} día${diasRestantes===1?'':'s'} más, a un ritmo de ${ritmoDiario.toFixed(1)} SKU/día (${pendientes.toLocaleString('es-CL')} pendientes, ${contadosEnVentana} contados en los últimos ${diasTranscurridos} día${diasTranscurridos===1?'':'s'})`,
  };
}

function renderDiffChart(sinDif, conDif){
  const total = sinDif + conDif;
  if(!total) return `<div class="empty">Sin conteos todavía en este período.</div>`;
  const fila = (label, val, color) => {
    const p = Math.round(val/total*100);
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <span style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim)">
          <span style="width:9px;height:9px;border-radius:2px;background:${color};display:inline-block;flex-shrink:0"></span>${label}
        </span>
        <span class="mono" style="font-size:12.5px;color:var(--text)">${val} · ${p}%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${p}%;background:${color}"></div></div>
    </div>`;
  };
  return fila('Sin diferencia', sinDif, 'var(--ok)') + fila('Con diferencia', conDif, 'var(--warn)');
}

function renderInformeEjecutivo(){
  const t = state.dash.total;
  // skus_universo/skus_contados vienen de count(distinct) en la vista SQL: PostgREST los
  // serializa como string (bigint), así que sin Number() la suma concatena texto en vez de
  // sumar y el avance global queda completamente mal calculado.
  const totUniverso = t.reduce((s,r)=>s+(Number(r.skus_universo)||0),0);
  const totContados = t.reduce((s,r)=>s+(Number(r.skus_contados)||0),0);
  const avanceGlobal = totUniverso? (totContados/totUniverso*100) : 0;

  const pendientesBodega = resumenPendientesPorBodega(t);

  const filasBodega = t.map(r=>`
    <div class="tag-card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span class="kpi-label">${esc(r.bodega||'Sin ubicación general')}</span>
        <span class="mono" style="font-size:12px;color:var(--text-dim)">${r.skus_contados||0} / ${r.skus_universo||0} SKU</span>
      </div>
      <div class="kpi-value">${pct(r.porcentaje_avance)}%</div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,r.porcentaje_avance||0)}%"></div></div>
    </div>
  `).join('') || `<div class="empty"><div class="glyph">◧</div>Aún no hay SKUs cargados para calcular avance.</div>`;

  const diarioAgg = agregarPorDia(state.dash.diario, VENTANA_PROYECCION_DIAS);
  // "Diferencias" NO se calcula sumando con_diferencia/sin_diferencia de cada conteo del
  // período (eso contaba dos veces un SKU recontado: una vez por su intento original con
  // diferencia, otra por el reconteo que la resolvió — bug real reportado por Joel, "en
  // estricto rigor no tengo diferencias"). Viene de diferencias_recientes(), que ya toma el
  // último conteo de cada SKU (mismo criterio que exactitud_por_bodega) acotado a la ventana.
  const diferenciasRecientes = (state.dash.diferenciasRecientes||[])[0] || {sin_diferencia:0, con_diferencia:0};
  const totSinDif = Number(diferenciasRecientes.sin_diferencia)||0;
  const totConDif = Number(diferenciasRecientes.con_diferencia)||0;
  const proyeccion = proyeccionTermino(totUniverso, totContados, diarioAgg);
  const rankingResponsables = (state.dash.ranking||[]).slice(0,8);

  // Exactitud: sobre el último conteo de cada SKU (no sobre cada conteo histórico), qué
  // porcentaje cuadró contra el stock de sistema (unidades) y qué porcentaje se contó en
  // la ubicación que dice el maestro (ubicación) — agregado por bodega en exactitud_por_bodega,
  // igual patrón que avance_total: se suman los totales acá, en el cliente.
  const exactBodega = state.dash.exactitudBodega||[];
  const exactContados = exactBodega.reduce((s,r)=>s+(Number(r.skus_contados)||0),0);
  const exactSinDif = exactBodega.reduce((s,r)=>s+(Number(r.sin_diferencia)||0),0);
  const exactUbicOk = exactBodega.reduce((s,r)=>s+(Number(r.ubicacion_correcta)||0),0);
  const exactitudUnidades = exactContados? (exactSinDif/exactContados*100) : 0;
  const exactitudUbicacion = exactContados? (exactUbicOk/exactContados*100) : 0;
  const rankingExactitud = exactBodega
    .map(r=>({
      nombre: r.bodega||'Sin ubicación general',
      pct: (Number(r.skus_contados)||0)? (Number(r.sin_diferencia)||0)/Number(r.skus_contados)*100 : 0,
      sub: `${r.sin_diferencia||0}/${r.skus_contados||0}`,
    }))
    .sort((a,b)=> a.pct-b.pct); // peor exactitud primero: dónde conviene intervenir
  const topDiferenciasPositivas = state.dash.topDiferenciasPositivas||[];
  const topDiferenciasNegativas = state.dash.topDiferenciasNegativas||[];

  // Tendencia de exactitud: exactitud_mensual agrupa por mes calendario (fecha_conteo), NO por
  // ciclo — a diferencia de exactitud_por_bodega (que solo mira el ciclo actual), esta vista
  // ignora el ciclo a propósito, para poder comparar un mes contra otro aunque la empresa nunca
  // haya abierto/cerrado un ciclo (hoy casi ninguna lo hace).
  const exactMensualFilas = state.dash.exactitudMensual||[];
  const mesesMap = new Map();
  exactMensualFilas.forEach(r=>{
    const cur = mesesMap.get(r.mes) || {mes:r.mes, contados:0, sinDif:0};
    cur.contados += Number(r.skus_contados)||0;
    cur.sinDif += Number(r.sin_diferencia)||0;
    mesesMap.set(r.mes, cur);
  });
  const tendenciaMensual = Array.from(mesesMap.values())
    .sort((a,b)=> a.mes.localeCompare(b.mes))
    .map(m=>({dia:m.mes, exactitud: m.contados? (m.sinDif/m.contados*100) : 0}));

  // Comparación por bodega entre el primer y el último mes con datos: es lo que le da sentido de
  // "gestión de calidad" a la tendencia ("la bodega X mejoró N puntos"), no solo un gráfico.
  const mesesDisponibles = Array.from(new Set(exactMensualFilas.map(r=>r.mes))).sort();
  const primerMes = mesesDisponibles[0];
  const ultimoMes = mesesDisponibles[mesesDisponibles.length-1];
  let comparacionBodegas = [];
  if(primerMes && ultimoMes && primerMes!==ultimoMes){
    const exactitudPorBodegaEnMes = (mes)=>{
      const m = new Map();
      exactMensualFilas.filter(r=>r.mes===mes).forEach(r=>{
        const contados = Number(r.skus_contados)||0;
        const sinDif = Number(r.sin_diferencia)||0;
        m.set(r.bodega||'Sin ubicación general', contados? (sinDif/contados*100) : null);
      });
      return m;
    };
    const inicioPorBodega = exactitudPorBodegaEnMes(primerMes);
    const finPorBodega = exactitudPorBodegaEnMes(ultimoMes);
    const bodegas = new Set([...inicioPorBodega.keys(), ...finPorBodega.keys()]);
    comparacionBodegas = Array.from(bodegas)
      .map(nombre=>{
        const inicio = inicioPorBodega.get(nombre);
        const fin = finPorBodega.get(nombre);
        return {nombre, inicio, fin, delta: (inicio!=null && fin!=null) ? (fin-inicio) : null};
      })
      // Solo bodegas con datos en AMBOS extremos: si una recién empezó a contarse, no hay
      // "mejora" que calcular todavía, solo un punto de partida.
      .filter(b=>b.delta!==null)
      .sort((a,b)=> b.delta-a.delta);
  }
  const mejorBodega = comparacionBodegas[0];
  const peorBodega = comparacionBodegas.length>1 ? comparacionBodegas[comparacionBodegas.length-1] : null;

  // Valorización: mismo patrón que exactitud_por_bodega, agregado por bodega en la vista
  // valorizacion_diferencias y sumado acá — solo cuenta los SKU con costo_unitario cargado,
  // así que "Valor contado" no es el valor de todo el inventario, sino de lo que se pudo costear.
  // "Valor contado" = costo_unitario × stock_sistema (el valor del inventario según el sistema),
  // no cantidad_contada: no debe variar según lo que se lleva contado, sino reflejar el stock.
  const valorizBodega = state.dash.valorizacion||[];
  const valorContado = valorizBodega.reduce((s,r)=>s+(Number(r.valor_contado)||0),0);
  const valorPerdidas = valorizBodega.reduce((s,r)=>s+(Number(r.valor_perdidas)||0),0);
  const valorExcedentes = valorizBodega.reduce((s,r)=>s+(Number(r.valor_excedentes)||0),0);
  const valorNeto = valorPerdidas + valorExcedentes;

  // Clasificación ABC (ver skus_resumen_abc): ya viene agregada por clase desde la base -- no
  // tiene sentido traer miles de filas de skus_valor_abc al navegador solo para contarlas.
  const resumenAbc = state.dash.resumenAbc||[];

  // Orden pedido por Joel: avance global, exactitud, adherencia, valorización y proyección
  // primero (el resumen ejecutivo de un vistazo); el resto (detalle/tendencia de cada uno y
  // rankings) queda abajo, agrupado cerca del resumen del que es detalle. La tarjeta "Conteos
  // recientes" (cantidad de conteos cargados, con reconteos) y el listado "Materiales contados"
  // de la vista Operativo se sacaron a pedido de Joel: no agregaban valor (Buscar ya lista los
  // conteos con todos sus filtros).
  return `
    <div class="kpi-grid">
      <div class="tag-card">
        <div class="kpi-label">Avance global ${campoConInfo('SKU con al menos un conteo, sobre el total de SKU activos en todas las bodegas.')}</div>
        <div class="kpi-value">${pct(avanceGlobal)}%</div>
        <div class="kpi-sub">${totContados.toLocaleString('es-CL')} de ${totUniverso.toLocaleString('es-CL')} SKU</div>
      </div>
    </div>

    <div class="section-head"><div><span class="eyebrow">Sobre el último conteo de cada SKU</span><h2 style="font-size:17px">Exactitud ${campoConInfo('Sobre el último conteo de cada SKU, no cada conteo histórico — un reconteo que corrigió una diferencia no cuenta como error.')}</h2></div></div>
    <div class="kpi-grid" style="margin-bottom:14px">
      <div class="tag-card">
        <div class="kpi-label">De unidades</div>
        <div class="kpi-value">${pct(exactitudUnidades)}%</div>
        <div class="kpi-sub">${exactSinDif.toLocaleString('es-CL')} de ${exactContados.toLocaleString('es-CL')} SKU sin diferencia</div>
      </div>
      <div class="tag-card">
        <div class="kpi-label">De ubicación</div>
        <div class="kpi-value">${pct(exactitudUbicacion)}%</div>
        <div class="kpi-sub">${exactUbicOk.toLocaleString('es-CL')} de ${exactContados.toLocaleString('es-CL')} contados donde dice el maestro</div>
      </div>
    </div>

    ${renderAdherenciaPlan()}

    ${valorContado>0 || valorPerdidas!==0 || valorExcedentes!==0? `
      <div class="section-head"><div><span class="eyebrow">Con costo unitario cargado</span><h2 style="font-size:17px">Valorización de diferencias ${campoConInfo("Solo SKU con costo unitario cargado. “Valor contado” es el stock según sistema, no lo efectivamente contado.")}</h2></div></div>
      <div class="kpi-grid" style="margin-bottom:14px">
        <div class="tag-card">
          <div class="kpi-label">Valor contado</div>
          <div class="kpi-value" style="font-size:20px">${clp(valorContado)}</div>
          <div class="kpi-sub">stock según sistema</div>
        </div>
        <div class="tag-card">
          <div class="kpi-label">Pérdidas</div>
          <div class="kpi-value" style="font-size:20px;color:var(--danger)">${clp(valorPerdidas)}</div>
          <div class="kpi-sub">contado bajo el sistema</div>
        </div>
        <div class="tag-card">
          <div class="kpi-label">Excedentes</div>
          <div class="kpi-value" style="font-size:20px;color:var(--ok)">${clp(valorExcedentes)}</div>
          <div class="kpi-sub">contado sobre el sistema</div>
        </div>
        <div class="tag-card">
          <div class="kpi-label">Neto</div>
          <div class="kpi-value" style="font-size:20px;${valorNeto<0?'color:var(--danger)':valorNeto>0?'color:var(--ok)':''}">${clp(valorNeto)}</div>
          <div class="kpi-sub">impacto total de las diferencias</div>
        </div>
      </div>
    ` : ''}

    ${resumenAbc.length? `
      <div class="section-head"><div><span class="eyebrow">Costo unitario × stock, catálogo completo</span><h2 style="font-size:17px">Clasificación ABC ${campoConInfo('Ordena el catálogo activo por valor (costo unitario × stock según sistema) y corta en 80%/95% del valor acumulado. Un SKU sin costo unitario cargado no entra en la clasificación. El % contado es sobre el ciclo de conteo actual.')}</h2></div></div>
      <div class="kpi-grid" style="margin-bottom:14px">
        ${['A','B','C','Sin clasificar'].filter(clase=>resumenAbc.some(r=>r.clase_abc===clase)).map(clase=>{
          const fila = resumenAbc.find(r=>r.clase_abc===clase);
          const color = clase==='A'?'var(--amber)':clase==='B'?'var(--steel)':clase==='C'?'var(--text-dim)':'var(--text-faint)';
          return `<div class="tag-card">
            <div class="kpi-label">${clase==='Sin clasificar'?'Sin clasificar':'Clase '+clase}</div>
            <div class="kpi-value" style="font-size:20px;color:${color}">${Number(fila.cantidad_sku).toLocaleString('es-CL')}</div>
            <div class="kpi-sub">${fila.pct_sku}% del catálogo${clase!=='Sin clasificar'?` · ${fila.pct_valor}% del valor`:''}</div>
            <div class="progress-track" style="margin-top:6px"><div class="progress-fill" style="width:${fila.pct_avance}%;background:${color}"></div></div>
            <div class="kpi-sub" style="margin-top:3px">${fila.pct_avance}% contado</div>
          </div>`;
        }).join('')}
      </div>
    ` : ''}

    <div class="section-head"><div><span class="eyebrow">Al ritmo actual</span><h2 style="font-size:17px">Proyección de término ${campoConInfo('Calculada al ritmo de conteo de los últimos 14 días.')}</h2></div></div>
    <div class="tag-card" style="margin-bottom:14px">
      <div class="kpi-value" style="font-size:22px">${proyeccion.titulo}</div>
      <div class="kpi-sub">${proyeccion.detalle}</div>
    </div>

    <div class="section-head"><div><span class="eyebrow">De unidades, por mes calendario del conteo</span><h2 style="font-size:17px">Tendencia de exactitud ${campoConInfo('De unidades, agrupada por mes calendario de la fecha de conteo (no por ciclo de inventario).')}</h2></div></div>
    <div class="tag-card" style="margin-bottom:14px">
      ${mesesDisponibles.length===0? `
        <div class="empty"><div class="glyph">◧</div>Vas a ver la tendencia acá apenas tengas conteos registrados.</div>
      ` : mesesDisponibles.length===1? `
        <div class="empty"><div class="glyph">◧</div>Por ahora solo hay conteos de ${esc(fmtMesTruncado(primerMes))}. La tendencia aparece cuando haya conteos de más de un mes.</div>
      ` : `
        ${renderBarChart(tendenciaMensual, 'exactitud', 'var(--steel)', fmtMesTruncado, true)}
        <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
          ${mejorBodega? `<p style="font-size:13px;margin:0 0 4px">📈 <strong>${esc(mejorBodega.nombre)}</strong> ${mejorBodega.delta>=0?'mejoró':'bajó'} ${pct(Math.abs(mejorBodega.delta))} puntos entre ${esc(fmtMesTruncado(primerMes))} y ${esc(fmtMesTruncado(ultimoMes))} (${pct(mejorBodega.inicio)}% → ${pct(mejorBodega.fin)}%).</p>` : ''}
          ${peorBodega && peorBodega.delta<0? `<p style="font-size:13px;margin:0;color:var(--text-dim)">📉 <strong>${esc(peorBodega.nombre)}</strong> bajó ${pct(Math.abs(peorBodega.delta))} puntos en el mismo período (${pct(peorBodega.inicio)}% → ${pct(peorBodega.fin)}%).</p>` : ''}
        </div>
        ${comparacionBodegas.length>1? `
          <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
            ${comparacionBodegas.map(b=>`
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
                <span style="font-size:12.5px;color:var(--text-dim)">${esc(b.nombre)}</span>
                <span class="mono" style="font-size:12.5px;color:${b.delta>=0?'var(--ok)':'var(--danger)'}">${pct(b.inicio)}% → ${pct(b.fin)}% (${b.delta>=0?'+':''}${pct(b.delta)} pts)</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
      `}
    </div>

    ${rankingExactitud.length? `
      <div class="section-head"><div><span class="eyebrow">Exactitud de unidades</span><h2 style="font-size:17px">Ranking por ubicación general ${campoConInfo('Exactitud de unidades por bodega, peor primero.')}</h2></div></div>
      <div class="card">${renderExactitudBarList(rankingExactitud)}</div>
    ` : ''}

    ${topDiferenciasPositivas.length? `
      <div class="section-head"><div><span class="eyebrow">Top 10 · Mayor valor a favor</span><h2 style="font-size:17px">Excedentes con más impacto ${campoConInfo('Top 10 por valor total de la línea (diferencia × costo unitario), sobre el último conteo de cada SKU.')}</h2></div></div>
      <div class="card">${tablaTopDiferencias(topDiferenciasPositivas)}</div>
    ` : ''}

    ${topDiferenciasNegativas.length? `
      <div class="section-head"><div><span class="eyebrow">Top 10 · Mayor valor en contra</span><h2 style="font-size:17px">Pérdidas con más impacto ${campoConInfo('Top 10 por valor total de la línea (diferencia × costo unitario), sobre el último conteo de cada SKU.')}</h2></div></div>
      <div class="card">${tablaTopDiferencias(topDiferenciasNegativas)}</div>
    ` : ''}

    <div class="section-head"><div><span class="eyebrow">Últimos ${VENTANA_PROYECCION_DIAS} días</span><h2 style="font-size:17px">Conteos por día ${campoConInfo('Últimos 14 días. Incluye conteos y reconteos, diferenciados por color.')}</h2></div></div>
    <div class="card">
      ${renderBarChartApilado(diarioAgg, 'contados', 'reconteos', 'var(--amber)', 'var(--steel)', 'reconteos', fmtDiaCorto)}
      ${diarioAgg.length? renderLeyendaColores([['var(--amber)','Conteos'], ['var(--steel)','Reconteos']]) : ''}
    </div>

    <div class="section-head"><div><span class="eyebrow">Últimos ${VENTANA_PROYECCION_DIAS} días</span><h2 style="font-size:17px">Diferencias ${campoConInfo('Últimos 14 días, sobre el último conteo de cada SKU — un reconteo que corrigió una diferencia no se cuenta dos veces.')}</h2></div></div>
    <div class="card">${renderDiffChart(totSinDif, totConDif)}</div>

    ${rankingResponsables.length? `
      <div class="section-head"><div><span class="eyebrow">Últimos ${VENTANA_PROYECCION_DIAS} días</span><h2 style="font-size:17px">Ranking por responsable ${campoConInfo('Conteos de los últimos 14 días, por responsable.')}</h2></div></div>
      <div class="card">${renderRankedBarList(rankingResponsables)}</div>
    ` : ''}

    ${pendientesBodega.length? `
      <div class="section-head"><div><span class="eyebrow">Dónde falta contar</span><h2 style="font-size:17px">SKU pendientes por ubicación general ${campoConInfo('SKU activos que todavía no tienen ningún conteo registrado.')}</h2></div></div>
      <div class="card">${renderRankedBarList(pendientesBodega)}</div>
    ` : ''}

    <div class="section-head"><h2 style="font-size:17px">Avance por ubicación general ${campoConInfo('SKU con al menos un conteo, sobre el total de SKU activos de esa bodega.')}</h2></div>
    ${filasBodega}
  `;
}

// Opciones del selector de período para "Adherencia al plan": el período actual (marcado
// es_actual en state.ciclos) primero, luego el resto de los ciclos, "Sin período" (conteos
// con ciclo_id null — antes de que existiera el ciclo actual, o capturados sin conexión
// mientras no había un ciclo marcado) y "Todos los períodos" para compararlos uno junto a otro.
function opcionesPeriodoDash(){
  const cicloActual = (state.ciclos||[]).find(c=>c.es_actual);
  const p = state.dashPeriodo;
  const opciones = [`<option value="" ${p===''?'selected':''}>${cicloActual? 'Período actual — '+esc(cicloActual.nombre) : 'Período actual'}</option>`];
  (state.ciclos||[]).forEach(c=>{
    if(cicloActual && c.id===cicloActual.id) return; // ya aparece como "Período actual"
    opciones.push(`<option value="${esc(c.id)}" ${p===c.id?'selected':''}>${esc(c.nombre)}</option>`);
  });
  opciones.push(`<option value="__sin_periodo__" ${p==='__sin_periodo__'?'selected':''}>Sin período</option>`);
  opciones.push(`<option value="__todos__" ${p==='__todos__'?'selected':''}>Todos los períodos</option>`);
  return opciones.join('');
}

// "Adherencia al plan": cobertura real contra el plan asignado — de todo el universo de SKU
// que cubren las entradas de Planificación de un período (sin importar la fecha de cada
// entrada, ver avance_plan_por_ciclo), cuántos ya se contaron. Antes medía otra cosa ("de lo
// contado, qué % vino del plan") con un flag capturado en el momento del conteo
// (conteos.fuera_de_plan) — frágil ante cualquier flujo nuevo que no lo setee bien (bug real
// reportado por Joel: un reconteo aparecía como "Fuera de plan" aunque su conteo original sí
// venía del plan). Se cambió a pedido de Joel: el denominador ahora es TODO lo planificado en
// el período (crece cuando se agregan entradas al plan, no cuando se cuenta), no lo que ya se
// contó — así "1 de 24" significa "se planificaron 24 SKU en este período, se contó 1", sin
// importar por qué mecanismo se contó cada uno (plan, reconteo, buscador o escáner: si el SKU
// está en el plan y tiene un conteo en el período, cuenta como avance). La bodega que se
// muestra es la del SKU (skus.bodega), igual que en Exactitud/Avance/Valorización. El selector
// de período es puramente client-side sobre dash.avancePlanPorCiclo (ya trae todos los
// períodos agrupados por bodega): cambiar de período solo recalcula esto, no dispara una
// nueva carga.
function renderAdherenciaPlan(){
  const filas = state.dash.avancePlanPorCiclo || [];
  const periodo = state.dashPeriodo;
  const cabecera = `
    <div class="section-head">
      <div><span class="eyebrow">Cuánto del plan asignado ya se contó</span><h2 style="font-size:17px">Adherencia al plan ${campoConInfo('SKU planificados en el período contra los que aún faltan por contar, sin importar cómo se contaron (plan, reconteo, buscador o escáner).')}</h2></div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <label for="dash-periodo">Período</label>
      <select id="dash-periodo">${opcionesPeriodoDash()}</select>
    </div>
  `;

  const sumar = (rows) => rows.reduce((acc,r)=>({
    planificados: acc.planificados + (Number(r.total_planificados)||0),
    contados: acc.contados + (Number(r.contados)||0),
  }), {planificados:0, contados:0});
  const nombrePeriodo = (cicloId) => cicloId===null ? 'Sin período' : (((state.ciclos||[]).find(c=>c.id===cicloId)||{}).nombre || 'Período eliminado');

  if(periodo==='__todos__'){
    const porCiclo = new Map();
    filas.forEach(r=>{
      const key = r.ciclo_id || '__null__';
      if(!porCiclo.has(key)) porCiclo.set(key, []);
      porCiclo.get(key).push(r);
    });
    const filasTabla = Array.from(porCiclo.entries()).map(([key, rows])=>{
      const cicloId = key==='__null__' ? null : key;
      const s = sumar(rows);
      return {cicloId, nombre: nombrePeriodo(cicloId), ...s, pctAvance: s.planificados? s.contados/s.planificados*100 : 0};
    }).sort((a,b)=>{
      if(a.cicloId===null) return 1;
      if(b.cicloId===null) return -1;
      const ia = (state.ciclos||[]).findIndex(c=>c.id===a.cicloId);
      const ib = (state.ciclos||[]).findIndex(c=>c.id===b.cicloId);
      return ia-ib; // state.ciclos viene ordenado created_at.desc: más reciente primero
    });

    return cabecera + `
      <div class="card">
        ${filasTabla.length? `<div class="table-wrap"><table>
          <thead><tr><th>Período</th><th class="num">Planificados</th><th class="num">Contados</th><th class="num">Pendientes</th><th class="num">Adherencia</th></tr></thead>
          <tbody>${filasTabla.map(f=>`<tr>
            <td>${esc(f.nombre)}</td>
            <td class="num">${f.planificados}</td>
            <td class="num">${f.contados}</td>
            <td class="num">${f.planificados-f.contados}</td>
            <td class="num mono">${pct(f.pctAvance)}%</td>
          </tr>`).join('')}</tbody>
        </table></div>` : `<div class="empty">Todavía no hay planificación registrada.</div>`}
      </div>
    `;
  }

  const cicloActual = (state.ciclos||[]).find(c=>c.es_actual);
  const cicloId = periodo==='' ? (cicloActual? cicloActual.id : null) : (periodo==='__sin_periodo__' ? null : periodo);
  const filasPeriodo = filas.filter(r=> (r.ciclo_id||null) === cicloId);
  const s = sumar(filasPeriodo);
  const pctAvance = s.planificados? s.contados/s.planificados*100 : 0;
  const porBodega = filasPeriodo
    .map(r=>({
      nombre: r.bodega||'Sin ubicación general',
      pct: (Number(r.total_planificados)||0) ? (Number(r.contados)||0)/Number(r.total_planificados)*100 : 0,
      sub: `${r.contados||0}/${r.total_planificados||0}`,
    }))
    .sort((a,b)=> a.pct-b.pct); // menor avance primero: dónde conviene reforzar el conteo

  return cabecera + (s.planificados? `
    <div class="kpi-grid" style="margin-bottom:14px">
      <div class="tag-card">
        <div class="kpi-label">Adherencia al plan</div>
        <div class="kpi-value">${pct(pctAvance)}%</div>
        <div class="kpi-sub">${s.contados.toLocaleString('es-CL')} de ${s.planificados.toLocaleString('es-CL')} SKU planificados</div>
      </div>
      <div class="tag-card">
        <div class="kpi-label">Pendientes</div>
        <div class="kpi-value">${(s.planificados-s.contados).toLocaleString('es-CL')}</div>
        <div class="kpi-sub">SKU del plan sin contar todavía</div>
      </div>
    </div>
    ${porBodega.length? `<div class="card">${renderExactitudBarList(porBodega)}</div>` : ''}
  ` : `<div class="empty">Sin plan creado para este período.</div>`);
}

    // mostraría "—" en cada línea — se saca entera y el resumen queda en una sola línea limpia
    // por período, en vez de una columna vacía sin aportar nada.
    const hayBodega = rows.some(r=>r.bodega);
    // Pedido de Joel: cuántos SKU se recontaron en cada período, junto al resto de columnas.
    return `<div class="table-wrap"><table>

  const vistaOperativa = `

    <div class="card">
      ${periodTable(diarioRows,'Día','dia',fmtDiaTruncado)}

    <div class="card">${periodTable(state.dash.semanal,'Semana','semana',fmtSemana)}</div>

// ocultarMagnitud (conteo ciego para operadores, ver ocultarStockOperador): muestra que hubo
// diferencia sin decir cuánta -- el monto, combinado con "Contado", deja calcular el stock del
// sistema (justo lo que el conteo ciego busca esconder).
function estadoBadge(estado, diferencia, ocultarMagnitud){
  if(diferencia && Number(diferencia)!==0) return ocultarMagnitud
    ? `<span class="badge badge-warn">Con diferencia</span>`

  if(estado==='pendiente_revision') return `<span class="badge badge-neutral">Pendiente</span>`;

  // "Aprobado", que sonaba a que alguien lo revisó y dio el visto bueno.
  return `<span class="badge badge-ok">${estado==='aprobado' ? 'Cuadrado' : esc(estado||'ok')}</span>`;

// Reportado: en Planificación, el rango de la semana mostrado ("23 ago – 29 ago") no coincidía
// con los días reales (Lun 24 – Dom 30) ni con lo que dice cada tarjeta. fmtFecha recibe tanto
// fechas puras "YYYY-MM-DD" (ej. plan_semanal.fecha, sin hora) como timestamps completos (ej.
// el último conteo, con su propia hora/zona). Sin hora explícita, new Date() interpreta una fecha
// pura como medianoche UTC, no medianoche local — en Chile (UTC-3/-4) eso corre el día al
// anterior. Se fuerza T00:00:00 solo para las fechas puras; los timestamps completos, que ya
// traen su hora/zona, se dejan tal cual.
function fmtFecha(iso){
  if(!iso) return '—';
  const d = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? new Date(iso+'T00:00:00') : new Date(iso);
  return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'2-digit'});
}
// dia/semana/mes en avance_diario/semanal/mensual vienen truncados EN EL SERVIDOR con
// date_trunc(...), siempre a las 00:00 UTC (confirmado: el timezone de la sesión de Postgres es
// UTC) — son un límite de calendario ("el lunes de esa semana", "el día 1 de ese mes"), no un
// instante real como fecha_conteo. Bug real reportado: leerlos con new Date(iso) y funciones
// locales (getMonth/getDate) los reinterpreta según la zona horaria del navegador — en cualquier
// huso detrás de UTC (Chile incluido), la medianoche UTC cae en el día anterior en hora local, y
// si es el día 1 de un mes, el mes completo se corre hacia atrás (se veía "Julio" con datos de
// agosto). Se reconstruye como fecha local a partir de los componentes UTC, para mostrar el
// mismo calendario que calculó la base de datos, sin importar la zona horaria de quien mira.
function fechaCalendarioUTC(iso){
  const d = new Date(iso);
  return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}
function fmtDiaTruncado(iso){
  if(!iso) return '—';
  return fechaCalendarioUTC(iso).toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'2-digit'});
}
// Igual que fmtDiaTruncado (misma corrección de zona horaria sobre un valor date_trunc'd), pero
// sin el día — para etiquetar meses en la tendencia de exactitud ("ene 26" en vez de "01 ene 26").
function fmtMesTruncado(iso){
  if(!iso) return '—';
  const s = fechaCalendarioUTC(iso).toLocaleDateString('es-CL',{month:'short',year:'2-digit'}).replace('.','');
  return s.charAt(0).toUpperCase()+s.slice(1);
}
// Número de semana ISO 8601 (lunes a domingo, semana 1 = la que contiene el primer jueves del
// año) — coincide con el criterio que ya usa date_trunc('week', ...) en avance_semanal.
function numeroSemanaISO(fecha){
  const d = new Date(Date.UTC(fecha.getFullYear(), fecha.getMonth(), fecha.getDate()));
  const diaSemana = d.getUTCDay() || 7; // domingo (0) pasa a 7
  d.setUTCDate(d.getUTCDate() + 4 - diaSemana);
  const inicioAnio = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - inicioAnio) / 86400000) + 1) / 7);
}
function fmtSemana(iso){
  if(!iso) return '—';
  const d = fechaCalendarioUTC(iso);
  return `Semana ${numeroSemanaISO(d)} (${d.getFullYear()})`;
}
const MESES_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function fmtMes(iso){
  if(!iso) return '—';
  const d = fechaCalendarioUTC(iso);
  return `${MESES_ES[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtFechaHora(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleString('es-CL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }

// Un conteo/SKU se considera "capturado sin conexión" cuando la fecha que reportó el
// dispositivo al momento de capturarlo (capturado_en) difiere de cuándo el registro
// realmente llegó al servidor (fecha_conteo/created_at) por más de un minuto — para
// auditoría es clave distinguir ambas fechas, nunca reemplazar una con la otra.
const UMBRAL_OFFLINE_MS = 60000;
function fueCapturadoOffline(capturadoEn, fechaServidor){
  if(!capturadoEn || !fechaServidor) return false;
  return Math.abs(new Date(fechaServidor) - new Date(capturadoEn)) > UMBRAL_OFFLINE_MS;
}
function esc(s){ return (s===null||s===undefined)? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Ícono de color para el último conteo de un SKU: verde = cuadrado (sin diferencia), amarillo =
// diferencia positiva (sobrante), rojo = diferencia negativa (faltante). null cuando aún no tiene
// ningún conteo (no se pinta nada).
function iconoUltimoConteo(estado, diferencia){
  if(!estado) return '';
  const dif = Number(diferencia)||0;
  // var(--warn) se ve café/naranjo en el tema claro (pensado para dar contraste como texto de
  // badge), no como un amarillo franco. Para este punto de color se usa un amarillo fijo, que se
  // distingue mejor de rojo/verde en cualquier tema.
  const color = estado==='aprobado' ? 'var(--ok)' : (dif>0 ? '#f1c40f' : 'var(--danger)');
  const titulo = estado==='aprobado' ? 'Último conteo cuadrado (sin diferencia)'
    : dif>0 ? `Último conteo con diferencia positiva (+${dif})`
    : `Último conteo con diferencia negativa (${dif})`;
  return `<span title="${esc(titulo)}" aria-label="${esc(titulo)}" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};flex:none"></span>`;
}

// "Mi plan del día": bodega/patio y ubicación en cascada, limitados a lo que le toca hoy a la
// cuenta logueada — no al universo completo de la empresa (eso es "Agregar a la planificación",
// en otra pantalla). Sin filtro de storage bin (se sacó a pedido: era un paso de más y, si una
// ubicación tenía varias entradas por bin distinto, obligaba a elegir una por una en vez de ver
// todo junto) — al elegir bodega+ubicación se junta el checklist de SKU pendientes de todos los
// bin de esa ubicación (ya excluye los contados en este ciclo, ver #129).
function renderPlanDelDia(){
  const cp = state.contarPlan;
  const normales = cp.entradas.filter(e=>!e.solo_sin_ubicacion);
  const haySueltos = cp.entradas.some(e=>e.solo_sin_ubicacion);
  // Bug real reportado: bodega==='' es el grupo "Sin bodega asignada" (bodega IS NULL, pero con
  // ubicación específica) — .filter(Boolean) lo descartaba de la lista de opciones (cadena vacía
  // es falsy), así que esas entradas quedaban en cp.entradas pero eran inalcanzables desde el
  // <select>: el operador nunca podía llegar a ver sus SKU pendientes. Necesita su propio option
  // con el sentinel BODEGA_VACIA, mismo patrón que ya usa Planificación.
  const hayBodegaVacia = normales.some(e=>e.bodega==='');
  const bodegas = Array.from(new Set(normales.map(e=>e.bodega).filter(b=>b))).sort();
  const porBodega = normales.filter(e=> (cp.bodega===BODEGA_VACIA ? e.bodega==='' : e.bodega===cp.bodega));
  const ubicaciones = Array.from(new Set(porBodega.map(e=> e.ubicacion || ''))).filter(Boolean).sort();
  const activas = entradasActivasContar(cp);
  const bodegaElegida = !!cp.bodega;
  return `
    <div class="section-head">
      <div><span class="eyebrow">Mi plan</span><h2>Plan del día</h2></div>
      <button type="button" class="btn btn-secondary" id="btn-exportar-plan-dia" style="width:auto;padding:8px 12px;flex:none;display:flex;align-items:center;gap:6px" ${cp.cargando || !cp.entradas.length?'disabled':''}>${ICONS.download} Exportar PDF</button>
    </div>
    <div class="card">
      <label for="contar-fecha">Día</label>
      <input type="date" id="contar-fecha" value="${cp.fecha}">
      ${cp.desdeCache? `<div class="badge badge-warn" style="display:inline-flex;align-items:center;gap:5px;margin-top:8px">${ICONS.alerta.replace('<svg','<svg style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none"')} Sin conexión: mostrando el plan guardado la última vez que hubo señal</div>` : ''}
      ${cp.cargando? `<div class="empty" style="padding:14px 8px;margin-top:10px"><span class="spinner"></span> Cargando…</div>` :
        !cp.entradas.length? `<div class="empty" style="padding:14px 8px;margin-top:10px">Sin nada planificado para ti este día.</div>` : `
        <div class="row2" style="margin-top:10px">
          <div><label for="contar-bodega">Bodega/patio</label>
            <select id="contar-bodega">
              <option value="">Elige…</option>
              ${haySueltos? `<option value="${BODEGA_SIN_UBICACION}" ${cp.bodega===BODEGA_SIN_UBICACION?'selected':''}>SKU sin ubicación</option>` : ''}
              ${hayBodegaVacia? `<option value="${BODEGA_VACIA}" ${cp.bodega===BODEGA_VACIA?'selected':''}>Sin bodega asignada</option>` : ''}
              ${bodegas.map(b=>`<option value="${esc(b)}" ${cp.bodega===b?'selected':''}>${esc(b)}</option>`).join('')}
            </select>
          </div>
          <div><label for="contar-ubic">Ubicación</label>
            <select id="contar-ubic" ${bodegaElegida && cp.bodega!==BODEGA_SIN_UBICACION? '' : 'disabled'}>
              <option value="">Todas</option>
              ${ubicaciones.map(u=>`<option value="${esc(u)}" ${cp.ubicacion===u?'selected':''}>${esc(u)}</option>`).join('')}
            </select>
          </div>
        </div>
        ${activas.length? `
          ${cp.skusPendientes===null? `<div class="hint" style="margin-top:10px">Cargando SKU pendientes…</div>` :
            cp.skusPendientes.length? `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px">
              <div class="hint" style="margin:0">${cp.skusPendientes.length} SKU pendientes</div>
              <button type="button" id="btn-escanear-plan" class="icon-btn" style="border:1px solid var(--line);border-radius:8px;width:36px;height:36px;flex:none" aria-label="Escanear código de un SKU planificado">${ICONS.escanear}</button>
            </div>
            <ul class="plan-sku-lista" style="margin-top:6px">
              ${cp.skusPendientes.map(s=>`
                <li>
                  <button type="button" data-pick-plan="${esc(s.id)}" style="width:100%;text-align:left;background:none;border:none;padding:8px 0;cursor:pointer;color:inherit">
                    <span class="mono">${esc(s.sku_code)}</span> — ${esc(s.descripcion||'Sin descripción')}
                    ${[s.bodega, s.ubicacion, s.storage_bin, s.batch? `Batch ${s.batch}` : null].filter(Boolean).length? `
                      <div class="hint" style="margin-top:2px">${esc([s.bodega, s.ubicacion, s.storage_bin, s.batch? `Batch ${s.batch}` : null].filter(Boolean).join(' · '))}</div>
                    ` : ''}
                    ${s.cambioBodega || s.cambioUbicacion || s.cambioBin? `
                      <div class="badge badge-warn" style="display:inline-flex;align-items:center;gap:5px;margin-top:5px">
                        ${ICONS.alerta.replace('<svg','<svg style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none"')}
                        ${describirCambioPlan(s)}
                      </div>
                    ` : ''}
                  </button>
                </li>
              `).join('')}
            </ul>
            ` : `<div class="empty" style="padding:14px 8px;margin-top:10px">Ya contaste todo lo pendiente aquí.</div>`}
        ` : bodegaElegida? `<div class="hint" style="margin-top:10px">Elige ubicación para ver los SKU pendientes.</div>` : ''}
      `}
    </div>
  `;
}

        <div><span class="code">${esc(s.sku_code)}</span><span class="desc">${esc(s.descripcion||'Sin descripción')} · ${esc(s.bodega||'—')}${s.ubicacion? ` · ${esc(s.ubicacion)}` : ''}${s.storage_bin? ` · Bin ${esc(s.storage_bin)}` : ''}${s.batch? ` · Batch ${esc(s.batch)}` : ''}</span></div>
        <button data-pick-btn="${s.id}">Elegir</button>
      </div>`).join('') :
    `<div class="hint">No se encontraron coincidencias.</div>`;
}

// Aviso de "ya contado este período" en la tarjeta del SKU elegido en Contar (ver
// cargarVecesContadoPeriodo). No se muestra mientras carga ni si el SKU no tiene conteos
// todavía este período -- solo aparece cuando hay algo que avisar.
function avisoVecesContadoPeriodo(){
  const info = state.conteoVecesPeriodo;
  if(!state.skuSeleccionado || !info || info.skuId !== state.skuSeleccionado.id) return '';
  if(info.cargando || !info.veces) return '';
  return `<div class="hint" style="margin-top:6px;color:var(--amber);font-weight:600">⚠ Ya contado ${info.veces} ${info.veces===1?'vez':'veces'} en este período.</div>`;
}

// Stock por tipo (Bloqueado/Tránsito 1/Tránsito 2/Transferencia, ver CAMPOS_SKU): solo
// informativo, para dar contexto de por qué un conteo puede diferir del stock sistema sin
// que sea un error real (ej. parte del material está bloqueado por calidad, o en tránsito
// entre bodegas). No participa del cálculo de diferencia. Se omite entero si el SKU no trae
// ninguno de los 4 datos, para no ensuciar la tabla en el caso común.
function infoStockPorTipo(r){
  const partes = [
    r.stock_bloqueado? `Bloq: ${r.stock_bloqueado}` : '',
    r.stock_transito_1? `Trán. 1: ${r.stock_transito_1}` : '',
    r.stock_transito_2? `Trán. 2: ${r.stock_transito_2}` : '',
    r.stock_transferencia? `Transf: ${r.stock_transferencia}` : '',
  ].filter(Boolean);
  if(!partes.length) return '';
  return `<div class="hint" style="font-size:10.5px;margin-top:2px;white-space:nowrap">${esc(partes.join(' · '))}</div>`;
}

/* =======================================================================
   RENDER — Reconteo (materiales que no cuadran con el sistema)
   ======================================================================= */
function renderReconteo(){
  const rows = state.reconteos;
  // Conteo ciego (ver ocultarStockOperador): sin la columna "Sistema" no alcanza con solo
  // quitarla -- "Contado" + "Diferencia" numérica igual la delatan (sistema = contado - diferencia),
  // así que la diferencia también se neutraliza a una etiqueta sin monto.
  const ocultarSistema = ocultarStockOperador();
  // "Descartar" (solo admin, ver descartarReconteo): saca un material de la lista sin recontarlo
  // físicamente, para cuando el problema era un error en el dato maestro y no algo por verificar.
  const esAdmin = state.perfil && state.perfil.rol === 'admin';
  // Con el módulo de bodega activo, la diferencia confirmada se puede llevar al stock como un
  // ajuste (admin: inmediato; operador: queda pendiente de aprobación). Ver abrirAjusteBodega.
  const bodegaActiva = moduloBodegaActivo();
  // Gráfico por semana (pedido de Joel): pendientes por semana ISO del último conteo ("36S"),
  // tocar una barra filtra la tabla a esa semana. Los datos vienen de reconteo_pendiente_por_semana.
  const porSemana = state.reconteosPorSemana || [];
  const totalPendientes = porSemana.reduce((s,f)=>s+f.pendientes, 0);
  const semanaActiva = state.reconteoSemana;
  const textoBusqueda = state.reconteoTexto || '';
  const etiquetaSemana = iso => `${numeroSemanaISO(new Date(iso+'T00:00:00'))}S`;
  const rangoSemana = iso => `${fmtDiaCorto(iso)} – ${fmtDiaCorto(fechaISO(sumarDias(new Date(iso+'T00:00:00'), 6)))}`;
  // La tarjeta también se muestra si hay una semana elegida aunque ya no queden pendientes en
  // ninguna: es la única forma de ver "Mostrando la semana…" y salir con "Ver todas las semanas".
  const graficoSemanas = (porSemana.length || semanaActiva) ? `
    <div class="card" style="margin-bottom:14px">
      <div class="hint" style="margin-bottom:8px">Reconteos pendientes por semana (${totalPendientes.toLocaleString('es-CL')} en total)${porSemana.length? ' · toca una semana para ver solo esa' : ''}</div>
      ${porSemana.length ? renderBarChart(porSemana.map(f=>({dia:f.semana, n:f.pendientes})), 'n', d=> d.dia===semanaActiva ? 'var(--amber)' : 'var(--steel)', etiquetaSemana, true, false, {clave: d=>d.dia, activo: semanaActiva}) : ''}
      ${semanaActiva ? `<div class="hint" style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span>Mostrando la semana <strong>${etiquetaSemana(semanaActiva)}</strong> (${esc(rangoSemana(semanaActiva))})${porSemana.some(f=>f.semana===semanaActiva)? '' : ' · ya no quedan pendientes en esta semana'}.</span><button type="button" class="link-btn" id="btn-quitar-semana-reconteo">Ver todas las semanas</button></div>` : ''}
    </div>` : '';
  return `
    <div class="section-head"><div><span class="eyebrow">${rows.length}${state.reconteosHayMas?'+':''}</span><h2>Reconteo</h2></div></div>
    <div class="hint" style="margin-bottom:12px">Materiales cuyo último conteo tuvo diferencia contra el stock de sistema <b>del momento en que se contaron</b>. Esa diferencia queda fija -- si el stock del maestro cambia después (por otra carga, venta, etc.) el material no sale solo de la lista. Recuenta para corregir o confirmar la diferencia${esAdmin?', o descártala si el problema fue un error en el dato maestro':''}.</div>
    ${graficoSemanas}
    <div class="card">
      <form id="form-buscar-reconteo" style="margin-bottom:12px">
        <label for="reconteo-texto">Buscar un pendiente</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="text" id="reconteo-texto" style="flex:1" placeholder="Código o descripción del SKU" value="${esc(textoBusqueda)}" autocomplete="off" enterkeyhint="search">
          <button type="button" id="btn-escanear-reconteo" class="icon-btn" style="border:1px solid var(--line);border-radius:8px;width:40px;height:40px;flex:none" aria-label="Escanear código">${ICONS.escanear}</button>
          <button type="submit" class="btn btn-primary" style="width:auto;padding:0 14px;height:40px">Buscar</button>
        </div>
        ${textoBusqueda ? `<div class="hint" style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span>Mostrando pendientes que coinciden con <strong>${esc(textoBusqueda)}</strong>${semanaActiva ? ` en la semana ${etiquetaSemana(semanaActiva)}` : ''}.</span><button type="button" class="link-btn" id="btn-limpiar-reconteo">Limpiar búsqueda</button></div>` : ''}
      </form>
      ${rows.length? `<div class="table-wrap"><table>
        <thead><tr><th>SKU</th>${ocultarSistema?'':'<th class="num">Sistema</th>'}<th class="num">Contado</th><th class="num">Diferencia</th><th>Causa probable</th><th>Fecha</th><th class="num">Foto</th><th></th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td class="mono">${esc(r.sku_code)}<div style="font-size:11px;color:var(--text-faint);font-family:'Inter'">${esc(r.descripcion||'')}</div></td>
          ${ocultarSistema?'':`<td class="num">${r.stock_sistema!==null? r.stock_sistema:'—'}${r.stock_sistema_anterior!=null?`<div class="hint" style="font-size:10.5px;margin-top:2px;white-space:nowrap">antes: ${r.stock_sistema_anterior}${r.stock_sistema_actualizado_en?` · ${fmtFechaHora(r.stock_sistema_actualizado_en)}`:''}</div>`:''}${infoStockPorTipo(r)}</td>`}
          <td class="num">${r.ultima_cantidad_contada}</td>
          <td class="num">${ocultarSistema
            ? `<span class="badge badge-warn">Con diferencia</span>`
            : `<span class="badge badge-warn">${r.ultima_diferencia>0?'+':''}${r.ultima_diferencia}</span>`}</td>
          <td>${causaProbableBadge(r.causa_probable)}</td>
          <td class="mono" style="font-size:11.5px">${fmtFecha(r.ultimo_conteo_fecha)}</td>
          <td class="num">${(r.fotos||[]).length
            ? `<button class="icon-btn" data-ver-fotos="${esc(JSON.stringify(r.fotos))}" aria-label="Ver fotos">${ICONS.camera}${r.fotos.length>1?` ${r.fotos.length}`:''}</button>`
            : `<span class="icon-btn disabled" aria-hidden="true">${ICONS.camera}</span>`}</td>
          <td class="num" style="white-space:nowrap"><button class="btn btn-primary" data-recontar="${r.id}" style="width:auto;padding:6px 12px;font-size:12px;display:inline-flex;align-items:center;gap:5px">${ICONS.reconteo.replace('<svg','<svg style="width:14px;height:14px" ')}Recontar</button>${esAdmin?` <button class="btn btn-secondary" data-descartar-reconteo="${r.conteo_id}" data-descartar-reconteo-sku="${esc(r.sku_code)}" style="width:auto;padding:6px 12px;font-size:12px">Descartar</button>`:''}${bodegaActiva?` <button class="btn btn-secondary" data-ajustar-sku="${esc(r.id)}" data-ajustar-codigo="${esc(r.sku_code)}" data-ajustar-stock="${ocultarSistema||r.stock_sistema==null?'':r.stock_sistema}" data-ajustar-cantidad="${r.ultima_cantidad_contada}" data-ajustar-conteo="${esc(r.conteo_id||'')}" data-ajustar-motivo="${esc(`Reconteo del ${fmtFecha(r.ultimo_conteo_fecha)}: se contaron ${r.ultima_cantidad_contada}`)}" style="width:auto;padding:6px 12px;font-size:12px">${esAdmin?'Ajustar stock':'Proponer ajuste'}</button>`:''}</td>
        </tr>`).join('')}</tbody>
      </table></div>` : `<div class="empty"><div class="glyph">${textoBusqueda?'?':'✓'}</div>${textoBusqueda ? `Ningún pendiente coincide con «${esc(textoBusqueda)}»${semanaActiva?' en esta semana':''}.` : (semanaActiva ? 'No quedan pendientes en esta semana.' : 'No hay materiales con diferencias pendientes.')}</div>`}
      ${state.reconteosHayMas? `<div style="text-align:center;margin-top:12px">
        <button type="button" class="btn btn-secondary" id="btn-cargar-mas-reconteo" style="width:auto;padding:8px 16px" ${state.reconteosCargandoMas?'disabled':''}>${state.reconteosCargandoMas?'Cargando…':'Cargar más'}</button>
      </div>` : ''}
    </div>
  `;
}

/* =======================================================================
   RENDER — Buscar (todo el maestro de SKU: contados y no contados, con fotografías)
   ======================================================================= */
// Encabezado ordenable de la tabla de Buscar (ver toggleOrdenBusqueda): muestra una flecha
// cuando esa columna es la que ordena ahora mismo (▲ ascendente, ▼ descendente).
// Grupos que se pueden elegir como filtro en Buscar -- TODOS los activos, curados a mano o
// automáticos (ej. "Críticos"). El automático internamente se resuelve como critico=eq.true (ver
// filtroGrupoBuscar/construirParametrosBusquedaRpc), sin pasar por skus_grupos_conteo -- pero
// tiene que aparecer acá igual, si no la persona no lo encuentra (reportado por Joel).
function gruposParaFiltroBuscar(){
  return state.grupos.lista || [];
}

function thOrdenBuscar(campo, etiqueta, claseExtra){
  const activo = state.busqueda.orden && state.busqueda.orden.campo===campo;
  const flecha = activo ? (state.busqueda.orden.dir==='asc'?' ▲':' ▼') : '';
  return `<th${claseExtra?` class="${claseExtra}"`:''}><button type="button" class="th-orden" data-orden-campo="${campo}" style="background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;white-space:nowrap" aria-label="Ordenar por ${esc(etiqueta)}">${esc(etiqueta)}${flecha}</button></th>`;
}

function renderBuscar(){
  const b = state.busqueda;
  const resultados = b.resultados;
  const quienConto = resumenQuienConto(resultados);
  // Selección desde el gráfico "Quién contó" (ver toggleFiltroContadoPor): filtra la tabla de
  // abajo por esa persona (o, si se eligió "Otros", por todas las que agrupa ese bucket). Se
  // muestra sin paginar -- es un drill-down sobre lo ya cargado, no una nueva búsqueda al
  // servidor, así que no tiene sentido reusar avanzarPaginaBuscar/hayMas (esos dependen del total
  // sin filtrar).
  const nombresFiltro = nombresParaFiltroContador(quienConto, b.filtroContadoPor);
  const resultadosFiltrados = nombresFiltro
    ? resultados.filter(r=> r.conteo_id && nombresFiltro.includes(r.contado_por || 'Sin asignar'))
    : null;
  // Igual que Diario (Dashboard operativo): 15 filas por página sobre lo ya cargado del
  // servidor, ver avanzarPaginaBuscar/retrocederPaginaBuscar.
  const busquedaPaginaActual = Math.min(b.busquedaPagina||0, Math.max(0, Math.ceil(resultados.length/TAM_PAGINA_BUSCAR)-1));
  const resultadosPagina = resultadosFiltrados || resultados.slice(busquedaPaginaActual*TAM_PAGINA_BUSCAR, busquedaPaginaActual*TAM_PAGINA_BUSCAR + TAM_PAGINA_BUSCAR);
  const busquedaHaySiguiente = !resultadosFiltrados && ((busquedaPaginaActual+1)*TAM_PAGINA_BUSCAR < resultados.length || b.hayMas);
  // Total real que calza con el filtro (ver buscarConteos/TOPE_CARGA_TOTAL_BUSQUEDA) -- cuando se
  // conoce, se usa en vez de "lo cargado hasta ahora" en el título, los gráficos y arriba de la
  // tabla, para que se entienda la dimensión real de los resultados (a pedido de Joel). Si "Solo
  // con fotografías" está activo Y todavía falta cargar del servidor, el total no se puede saber
  // con certeza (ese filtro se aplica en el cliente sobre lo ya cargado -- no sabemos cuántas de
  // las filas que faltan tendrán foto), así que en ese caso se degrada a "lo cargado hasta ahora".
  const totalConocido = !b.hayMas || (b.total!=null && !b.soloConFotos);
  const totalReal = totalConocido ? (b.hayMas ? b.total : resultados.length) : resultados.length;
  const alcanceBusqueda = (etiquetaCompleto) => !totalConocido
    ? `Primeros ${resultados.length} cargados`
    : (resultados.length<totalReal ? `Primeros ${resultados.length} de ${totalReal}` : etiquetaCompleto);
  const desdeTabla = busquedaPaginaActual*TAM_PAGINA_BUSCAR + 1;
  const hastaTabla = Math.min((busquedaPaginaActual+1)*TAM_PAGINA_BUSCAR, resultados.length);
  // El checkbox del encabezado de la tabla solo marca la página visible (15 filas). Este botón
  // marca/desmarca de una vez TODO lo cargado en pantalla (que puede ser más de una página), sin
  // necesidad de ir página por página -- a pedido de Joel.
  const idsTodosCargados = (resultadosFiltrados || resultados).map(r=>r.sku_id);
  const todosSeleccionadosCargados = idsTodosCargados.length>0 && idsTodosCargados.every(id=>(b.seleccionados||[]).includes(id));
  return `
    <div class="section-head"><div><span class="eyebrow">Maestro de SKU</span><h2>Buscar</h2></div></div>
    <div class="card">
      <form id="form-buscar">
        <label for="b-texto">Código o descripción del SKU</label>
        <input type="text" id="b-texto" placeholder="Ej. 4400-1123 o &quot;filtro&quot;" value="${esc(b.texto)}">
        <div class="row2">
          <div><label for="b-bodega">Ubicación general</label><input type="text" id="b-bodega" placeholder="Bodega Central" value="${esc(b.bodega)}"></div>
          <div><label for="b-estado">Estado</label>
            <select id="b-estado">
              <option value="">Todos</option>
              <option value="no_contado" ${b.estado==='no_contado'?'selected':''}>No contado</option>
              <option value="aprobado" ${b.estado==='aprobado'?'selected':''}>Cuadrado</option>
              <option value="con_diferencia" ${b.estado==='con_diferencia'?'selected':''}>Con diferencia</option>
              <option value="pendiente_revision" ${b.estado==='pendiente_revision'?'selected':''}>Pendiente</option>
              <option value="reconteo_pendiente" ${b.estado==='reconteo_pendiente'?'selected':''}>Pendiente de reconteo</option>
            </select>
          </div>
        </div>
        ${state.ciclos.length? `
        <label for="b-ciclo">Ciclo de conteo</label>
        <select id="b-ciclo">
          <option value="">Todos</option>
          <option value="__sin_ciclo__" ${b.ciclo==='__sin_ciclo__'?'selected':''}>Sin ciclo asignado</option>
          ${state.ciclos.map(c=>`<option value="${esc(c.id)}" ${b.ciclo===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}
        </select>
        ` : ''}
        ${gruposParaFiltroBuscar().length? `
        <label for="b-grupo" style="margin-top:12px">Grupo de conteo</label>
        <select id="b-grupo">
          <option value="">Todos</option>
          ${gruposParaFiltroBuscar().map(g=>`<option value="${esc(g.id)}" ${b.grupoId===g.id?'selected':''}>${esc(g.nombre)}</option>`).join('')}
        </select>
        ` : ''}
        <label for="b-clase-abc">Clase ABC</label>
        <select id="b-clase-abc">
          <option value="">Todas</option>
          <option value="A" ${b.claseAbc==='A'?'selected':''}>Clase A</option>
          <option value="B" ${b.claseAbc==='B'?'selected':''}>Clase B</option>
          <option value="C" ${b.claseAbc==='C'?'selected':''}>Clase C</option>
          <option value="__sin_clasificar__" ${b.claseAbc==='__sin_clasificar__'?'selected':''}>Sin clasificar</option>
