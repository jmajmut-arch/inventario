// Apertura: la primera carga masiva con el módulo activo deja el saldo inicial como movimiento
// de apertura (ver diseño 4.6). Las cargas siguientes no tocan el stock: solo datos maestros.
async function hayAperturaBodega(){
  try{ const rows = await rest('/movimientos_bodega?select=id&tipo=eq.apertura&limit=1'); return !!(rows && rows.length); }
  catch(e){ return false; }
}
// La apertura va por lotes (ver registrar_apertura_bodega): con un catálogo real son decenas de
// miles de SKU y una sola llamada supera el límite de tiempo del servidor. Se llama hasta que no
// queden materiales sin apertura, mostrando el avance.
const APERTURA_BODEGA_LOTE = 1000;
async function registrarAperturaBodega({silencioso=false}={}){
  let hechos = 0, total = null, vueltas = 0;
  try{
    while(vueltas++ < 500){
      const r = await rest('/rpc/registrar_apertura_bodega', {method:'POST', body:{p_limite: APERTURA_BODEGA_LOTE}, timeoutMs: 60000});
      const registrados = Number(r && r.registrados) || 0;
      const restantes = Number(r && r.restantes) || 0;
      hechos += registrados;
      if(total===null) total = hechos + restantes;
      if(!silencioso) setState({bodega: {...state.bodega, aperturaProgreso: {hechos, total}}});
      if(registrados===0 || restantes===0) break;
    }
    if(!silencioso) setState({bodega: {...state.bodega, aperturaProgreso: null}});
    if(hechos>0){
      toast(`Apertura registrada: ${hechos.toLocaleString('es-CL')} material${hechos===1?'':'es'} con su saldo inicial`);
      refrescarBodega();
    } else if(!silencioso){
      toast('No hay materiales con stock pendientes de apertura');
    }
    return hechos;
  }catch(e){
    if(!silencioso) setState({bodega: {...state.bodega, aperturaProgreso: null}});
    toast('No se pudo registrar el saldo inicial de bodega: '+e.message, 'err');
    if(hechos>0) refrescarBodega();
    return hechos;
  }
}

/* =======================================================================
   CSV — parser mínimo (soporta comillas y comas dentro de campos)
   ======================================================================= */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  text = text.replace(/^\uFEFF/, ''); // quita BOM de exportaciones SAP/Excel
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false;
      } else field += c;
    }else{
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return {headers:[], data:[]};
  const headers = rows[0].map(h=>h.trim());
  const data = rows.slice(1).filter(r=>r.some(v=>v && v.trim()!=='')).map(r=>{
    const obj = {};
    headers.forEach((h,idx)=> obj[h] = (r[idx]!==undefined? r[idx].trim() : ''));
    return obj;
  });
  return {headers, data};
}

/* =======================================================================
   EXCEL — lectura de .xlsx/.xls via SheetJS (cargada en el head)
   ======================================================================= */
async function leerExcel(file){
  if(typeof XLSX === 'undefined'){
    throw new Error('No se pudo cargar el lector de Excel (revisa tu conexion) e intenta de nuevo, o sube el archivo como .csv.');
  }
  const buf = await file.arrayBuffer();
  const libro = XLSX.read(buf, {type:'array'});
  const hoja = libro.Sheets[libro.SheetNames[0]];
  const filas = XLSX.utils.sheet_to_json(hoja, {defval:''});
  if(!filas.length) return {headers:[], data:[]};
  const headers = Object.keys(filas[0]).map(h=>String(h).trim());
  const data = filas.map(f=>{
    const obj = {};
    headers.forEach(h=> obj[h] = (f[h]!==undefined && f[h]!==null) ? String(f[h]).trim() : '');
    return obj;
  });
  return {headers, data};
}

async function leerArchivoMasivo(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(ext==='xlsx' || ext==='xls') return leerExcel(file);
  const text = await file.text();
  return parseCSV(text);
}

/* =======================================================================
   CLASIFICADOR GENERICO DE COLUMNAS
   Detecta automaticamente, por nombre de columna (en espanol o ingles, de
   SAP o de cualquier planilla armada a mano), a que campo de la tabla
   "skus" corresponde cada una, sin depender de encabezados fijos.
   ======================================================================= */
// Orden y etiquetas a pedido de Joel (coincide con el flujo real de revisión de un maestro
// SAP): Material, Descripción, Ubicación general, Ubicación específica, Storage bin, Batch,
// Stock sistema, Costo unitario, Unidad de medida al final, Categoría al final de todo.
// "Batch" es su propio campo (columna `batch`), separado de `categoria`: antes "Batch" era un
// alias de categoria, pero los datos reales de Escondida mostraron que ese campo en la práctica
// guarda el nombre de planta ("Escondida Mine"/"Escondida Caleta Coloso NB"), no un lote/batch —
// mezclar ambos conceptos en una sola columna habría hecho invisible el batch real de cada SKU
// (ver conversación con Joel: quiere SOH desglosado por batch en Contar). `categoria` se relabeló
// "Categoría" y perdió los alias que en realidad describían un lote (batch/lote/condición).
// bodega/ubicacion/storage_bin/costo_unitario son obligatorios (no solo sku_code/stock_sistema):
// sin ellos, Exactitud de ubicación, Valorización y el aviso de cambio de ubicación en Plan del
// día quedan cojos — se prefiere exigir la columna en la carga a que fallen en silencio después.
const CAMPOS_SKU = [
  { campo:'sku_code', obligatorio:true, etiqueta:'Material',
    alias:['material','sku','sku code','codigo','codigo sku','codigo material','cod','cod sku','item','item code','articulo','part number','material number','nro material','n material'] },
  { campo:'descripcion', obligatorio:false, etiqueta:'Descripcion',
    alias:['material description','descripcion','descripcion material','texto breve de material','short text','nombre','detalle','desc'] },
  { campo:'bodega', obligatorio:true, etiqueta:'Ubicación general (Planta)',
    alias:['ubicacion general','description of storage location','sloc description','bodega','almacen','warehouse','plant','deposito'] },
  { campo:'ubicacion', obligatorio:true, etiqueta:'Ubicación específica (Storage Location)',
    alias:['ubicacion especifica','storage location','ubicacion','location','rack'] },
  { campo:'storage_bin', obligatorio:true, etiqueta:'Storage bin',
    alias:['storage bin','bin','posicion','slot'] },
  { campo:'batch', obligatorio:false, etiqueta:'Batch',
    alias:['batch','batch number','batch id','batch status','lote','n de lote','n lote','numero de lote','estado material','material status','condicion','lot','lot number'] },
  { campo:'stock_sistema', obligatorio:true, etiqueta:'Stock sistema',
    alias:['unrestricted stock','stock_sistema','stock sistema','stock','existencia','cantidad','qty','quantity','saldo','on hand'] },
  { campo:'costo_unitario', obligatorio:true, etiqueta:'Costo unitario',
    alias:['costo unitario','costo_unitario','precio unitario','moving average price','standard price','unit cost','unit price','valor unitario','costo','precio'] },
  { campo:'unidad_medida', obligatorio:false, etiqueta:'Unidad de medida',
    alias:['unidad_medida','unidad de medida','base unit of measure','uom','um','unidad'] },
  { campo:'categoria', obligatorio:false, etiqueta:'Categoría',
    alias:['categoria','plant name','material group','grupo de articulos','familia','grupo','clase'] },
  { campo:'critico', obligatorio:false, etiqueta:'Crítico',
    alias:['critico','es critico','sku critico','critical','is critical'] },
  // Módulo de bodega: fijar el mínimo uno por uno no escala con catálogos grandes, así que el
  // Excel también puede traerlo. Igual que "Crítico", si la columna no viene no se toca lo que
  // el SKU ya tenía.
  { campo:'tipo_material', obligatorio:false, etiqueta:'Tipo de material',
    alias:['tipo de material','tipo_material','tipo material','tipo','clasificacion','clasificación','material type','tipo de articulo'] },
  { campo:'stock_minimo', obligatorio:false, etiqueta:'Stock mínimo',
    alias:['stock minimo','stock_minimo','minimo','min stock','stock min','cantidad minima','punto de reorden','reorder point','minimum stock','min'] },
  // Estas cuatro son solo informativas (ver infoStockPorTipo/renderConteo/renderReconteo): se
  // muestran junto al stock sistema en Contar y Reconteo para dar contexto, pero la diferencia
  // de un conteo sigue calculándose solo contra stock_sistema -- no se suman ni se restan de
  // nada automáticamente. Se ocultan igual que el stock sistema con conteo ciego activo.
  { campo:'stock_bloqueado', obligatorio:false, etiqueta:'Bloqueado',
    alias:['blocked stock','bloqueado','stock bloqueado','blocked'] },
  { campo:'stock_transito_1', obligatorio:false, etiqueta:'SOH en tránsito 1',
    alias:['soh en transito 1','soh transito 1','stock in transit 1','transito 1','en transito 1','in transit 1'] },
  { campo:'stock_transito_2', obligatorio:false, etiqueta:'SOH en tránsito 2',
    alias:['soh en transito 2','soh transito 2','stock in transit 2','transito 2','en transito 2','in transit 2'] },
  { campo:'stock_transferencia', obligatorio:false, etiqueta:'Transferencia',
    alias:['stock in transfer','transferencia','stock transferencia','en transferencia','transfer stock'] },
];

// Interpreta la columna opcional "Crítico" de la carga masiva: acepta las formas típicas de una
// planilla armada a mano (si/no, x, 1/0, true/false) -- cualquier otra cosa, incluida la celda
// vacía, se toma como "no crítico" (el default más seguro: no inventar criticidad que nadie marcó).
// A pedido de Joel: en la práctica cualquier marca sirve (una "X", "Sí", "Alta", lo que sea) --
// no tiene sentido exigir un valor exacto de una lista cerrada. Cualquier celda NO vacía cuenta
// como crítico, salvo que sea una negación explícita (alguien que sí escribió "No"/"Falso"/"0"
// a propósito no debería quedar marcado por error).
function parsearBooleanoCarga(valorTexto){
  const t = normalizarTexto(valorTexto);
  if(!t) return false;
  return !['no','n','false','falso','0'].includes(t);
}

function normalizarTexto(s){
  return String(s||'')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,' ')
    .trim();
}

// El primer alias de cada campo es su nombre "canónico" (el que más probablemente
// use alguien que arma la planilla a mano en español); una coincidencia exacta con
// ese alias pesa más que una coincidencia exacta con un alias genérico/jerga SAP,
// para que columnas como "Ubicación general" no pierdan contra "Storage Location"
// cuando el mismo archivo trae ambas.
// Palabras demasiado genéricas/comunes en encabezados SAP como para, por sí solas,
// justificar un match por "palabras en común" (el nivel más débil de puntajeColumna):
// un archivo real de Escondida trajo "Stock in Quality Inspection", que sin este
// filtro matcheaba erróneamente con el alias "stock in transit 2" (stock_transito_2)
// solo por compartir "stock"/"in" -- dos palabras genéricas, no la señal real del campo.
const PALABRAS_GENERICAS_MAPEO = new Set(['stock','de','en','la','el','a','of','in','on','the','and','y','del','para']);
function puntajeColumna(headerNorm, aliases){
  let mejor = 0;
  aliases.forEach((alias, idx)=>{
    const a = normalizarTexto(alias);
    if(headerNorm === a){ mejor = Math.max(mejor, idx===0? 110 : 100); return; }
    if(headerNorm.includes(a) || a.includes(headerNorm)){ mejor = Math.max(mejor, 75); return; }
    const hw = new Set(headerNorm.split(' '));
    const comunes = a.split(' ').filter(w=>w && !PALABRAS_GENERICAS_MAPEO.has(w) && hw.has(w)).length;
    if(comunes) mejor = Math.max(mejor, 40 + comunes*10);
  });
  return mejor;
}

// Asignacion voraz columna->campo: cada columna del archivo se usa como
// maximo para un campo, priorizando siempre la coincidencia de mayor puntaje.
function detectarMapeo(headers, campos){
  const headersNorm = headers.map(normalizarTexto);
  const candidatos = [];
  campos.forEach(campo=>{
    headers.forEach((h,idx)=>{
      const p = puntajeColumna(headersNorm[idx], campo.alias);
      if(p>0) candidatos.push({campo:campo.campo, header:h, puntaje:p});
    });
  });
  candidatos.sort((a,b)=> b.puntaje-a.puntaje);
  const mapeo = {};
  const usados = new Set();
  candidatos.forEach(c=>{
    if(mapeo[c.campo] || usados.has(c.header) || c.puntaje<60) return;
    mapeo[c.campo] = c.header;
    usados.add(c.header);
  });
  return mapeo;
}

/* =======================================================================
   ACCIONES — SKUs
   ======================================================================= */
// Detecta el rechazo del índice único (empresa_id, sku_code, bodega_key, batch_key,
// ubicacion_key, storage_bin_key) para mostrar un mensaje claro en vez del error crudo de
// Postgres. A propósito ya NO se resuelve con un upsert: hacerlo pisaba en silencio los datos
// de un SKU existente si alguien reusaba su código para un material distinto (bug real:
// "123456" con "Filtro" quedó sobrescrito por "Sillas" al cargar de nuevo el mismo código sin
// bodega). Para actualizar un SKU ya cargado se usa la carga masiva, que sí actualiza los que
// ya existen a propósito.
function esErrorCodigoSkuDuplicado(e){
  return /skus_empresa_id_sku_code_bodega_batch_ubicacion_bin_key/i.test((e && e.message) || '');
}
function mensajeCodigoSkuDuplicado(skuCode, bodega, batch, ubicacion, storageBin){
  return `El código ${skuCode} ya existe${bodega? ` en ${bodega}` : ' sin bodega asignada'}${batch? ` con batch ${batch}` : ''}${ubicacion? ` en ${ubicacion}` : ''}${storageBin? ` (bin ${storageBin})` : ''}. Para actualizarlo, usa la carga masiva.`;
}
// Mover un material de sitio. Hasta ahora la ubicación solo se podía fijar al crearlo: volver a
// cargarlo por Excel con otro bin no lo movía, creaba una segunda fila (la identidad de un
// material es código + ubicación general + específica + bin + batch, ver el índice
// skus_empresa_id_sku_code_bodega_batch_ubicacion_bin_key). Como es la MISMA fila la que cambia,
// el material conserva su historial de conteos, su kardex y su stock; la planificación ya sabía
// avisar "cambió de bin" cuando esto pasa (ver diferenciasDeUbicacionEnPlan).
function mensajeUbicacionOcupada(m){
  return `Ya existe ${m.skuCode} en ese sitio${m.batch? ` con batch ${m.batch}` : ''}. Dos materiales no pueden compartir la misma ubicación: junta primero sus saldos o mueve el otro.`;
}

async function guardarUbicacionSku(){
  const m = state.ubicacionSkuModal;
  if(!m || m.guardando) return false;
  const destino = {
    bodega: (m.bodega||'').trim() || null,
    ubicacion: (m.ubicacion||'').trim() || null,
    storage_bin: (m.storage_bin||'').trim() || null,
  };
  if(destino.bodega===m.bodegaOriginal && destino.ubicacion===m.ubicacionOriginal && destino.storage_bin===m.binOriginal){
    setState({ubicacionSkuModal:null});
    return true;
  }
  setState({ubicacionSkuModal:{...m, guardando:true}});
  try{
    await rest(`/skus?id=eq.${encodeURIComponent(m.id)}`, {method:'PATCH', body:destino, prefer:'return=minimal'});
    setState({ubicacionSkuModal:null});
    toast(`${m.skuCode} movido a ${describirUbicacion(destino)}`);
    // La ubicación alimenta el universo de planificación y los selectores de bodega/bin: esas
    // listas tienen que volver a pedirse, no servirse del caché.
    refrescarListaSkus();
    return true;
  }catch(e){
    setState({ubicacionSkuModal:{...state.ubicacionSkuModal, guardando:false}});
    toast(esErrorCodigoSkuDuplicado(e) ? mensajeUbicacionOcupada(m) : e.message, 'err');
    return false;
  }
}

function describirUbicacion({bodega, ubicacion, storage_bin}){
  const partes = [bodega, ubicacion, storage_bin].filter(Boolean);
  return partes.length ? partes.join(' · ') : 'sin ubicación';
}

async function crearSkuManual(payload){
  if(!perfilCargado()) return false;
  const capturadoEn = new Date().toISOString();
  try{
    await rest('/skus', {method:'POST', body:[{...payload, empresa_id: state.perfil.empresa_id, capturado_en: capturadoEn}], prefer:'return=minimal'});
    toast('SKU guardado correctamente');
    refrescarListaSkus();
    return true;
  }catch(e){
    // Sin conexión de verdad (no un error del servidor): igual que con los conteos, el
    // SKU se guarda en este dispositivo y se sube solo al volver la señal.
    if(pareceFalloDeRed(e)){
      encolarAccionOffline('sku', {...payload, empresa_id: state.perfil.empresa_id});
      toast('Sin conexión: SKU guardado en este dispositivo. Se enviará cuando vuelva la señal.', 'warn');
      return true;
    }
    toast(esErrorCodigoSkuDuplicado(e) ? mensajeCodigoSkuDuplicado(payload.sku_code, payload.bodega, payload.batch, payload.ubicacion, payload.storage_bin) : e.message, 'err');
    return false;
  }
}

// La bodega es parte de la identidad de cada fila (on_conflict incluye bodega_key, ver
// confirmarCargaMasiva): si un archivo nuevo usa nombres/códigos de bodega que no existen en lo
// que ya está cargado, esas filas NO actualizan lo existente — crean SKU duplicados en la bodega
// nueva y dejan los viejos activos (caso real: Materials.xlsx con bodegas "B501"/"B521" no
// coincidía con la data de pruebas anterior en "Nave Mina"/"Patio 3000"/etc., duplicando ~55.000
// SKU). Se avisa solo con mismatch TOTAL (ninguna bodega del archivo coincide) — una coincidencia
// parcial es simplemente agregar un sitio nuevo, no un error de nomenclatura.
async function calcularAvisoBodega(data, columnaBodega){
  if(!columnaBodega) return null;
  const bodegasArchivo = Array.from(new Set(data.map(r=>String(r[columnaBodega]||'').trim()).filter(Boolean))).sort();
  if(!bodegasArchivo.length) return null;
  let existentes;
  try{
    const rows = await rest('/ubicaciones_generales?select=bodega');
    existentes = Array.from(new Set((rows||[]).map(r=>r.bodega).filter(Boolean))).sort();
  }catch(e){ return null; } // si falla la consulta, no se bloquea el flujo con un aviso a medias
  if(!existentes.length) return null; // primera carga de la empresa: nada con qué comparar
  const hayCoincidencia = bodegasArchivo.some(b=>existentes.includes(b));
  if(hayCoincidencia) return null;
  return { archivo: bodegasArchivo, existentes, confirmado:false };
}

async function prepararCargaMasiva(file){
  try{
    const {headers, data} = await leerArchivoMasivo(file);
    if(!headers.length || !data.length){ toast('El archivo no tiene filas de datos','err'); return; }
    const mapeo = detectarMapeo(headers, CAMPOS_SKU);
    const avisoBodega = await calcularAvisoBodega(data, mapeo.bodega);
    setState({cargaPreview: { file, headers, data, campos:CAMPOS_SKU, mapeo, modo:'complementar', confirmaReemplazo:false, avisoBodega }});
  }catch(e){ toast(e.message,'err'); }
}

function resumenErroresAArray(resumenErrores){
  return Array.from(resumenErrores, ([motivo, cantidad])=>({motivo, cantidad})).sort((a,b)=>b.cantidad-a.cantidad);
}

// Cargas de antes de este cambio guardaron detalle_errores fila por fila (sin agrupar, y
// limitado a 50 entradas) — sin esto, el historial las mostraría como hasta 50 líneas idénticas
// y sin cantidad ("× sku_code vacío"). Agrupa también esas entradas viejas al mostrarlas: una
// entrada sin `cantidad` numérica se cuenta como 1 (nota: para cargas viejas la cantidad mostrada
// puede ser menor a la real, porque el guardado original ya venía recortado a 50 filas).
function agruparDetalleErrores(detalleErrores){
  const mapa = new Map();
  (detalleErrores||[]).forEach(e=>{
    const cantidad = typeof e.cantidad==='number' ? e.cantidad : 1;
    mapa.set(e.motivo, (mapa.get(e.motivo)||0) + cantidad);
  });
  return resumenErroresAArray(mapa);
}

async function confirmarCargaMasiva(){
  if(!perfilCargado()) return;
  const { file, data, mapeo, modo } = state.cargaPreview;
  const valor = (row, campo) => mapeo[campo] ? (row[mapeo[campo]]!==undefined ? String(row[mapeo[campo]]).trim() : '') : '';

  setState({loading:true});

  const marcaTiempo = new Date().toISOString();
  let ok=0, error=0;
  // Se agrupan por motivo, no fila por fila: un archivo grande puede tener miles de filas con
  // el mismo problema (ej. "1.306 con costo negativo"), y una lista fila por fila no es legible
  // ni práctica de mostrar en el historial — tampoco depende de un tope arbitrario de cuántas
  // filas guardar en detalle, como sí lo era la lista plana anterior.
  const resumenErrores = new Map();
  const anotarError = (motivo) => { error++; resumenErrores.set(motivo, (resumenErrores.get(motivo)||0)+1); };
  // Un mismo sku_code puede vivir en más de una bodega (cada bodega es su propia fila) y,
  // dentro de la misma bodega, en más de un batch (mismo material, distinto lote, distinto
  // SOH) -- pero además, dentro de la misma bodega+batch, puede estar repartido en más de una
  // ubicación/bin (mismo material, dos Storage Location distintos, cada uno con su propio
  // stock -- caso real confirmado con Joel: Materials_4.xlsx de Escondida trae miles de SKU así).
  // La clave de deduplicado es código+bodega+batch+ubicación+bin, no solo el código: si el
  // archivo trae dos filas del mismo código en bodegas, batches o ubicaciones/bines distintos,
  // todas deben llegar al upsert como filas separadas. Si trae dos filas idénticas en TODOS esos
  // campos, ahí sí nos quedamos con la última (no hay forma de saber cuál es la correcta).
  const porIdentidadSku = new Map();
  data.forEach((row,idx)=>{
    const sku_code = valor(row,'sku_code');
    if(!sku_code){ anotarError('Código de SKU vacío'); return; }
    ok++;
    const stockRaw = valor(row,'stock_sistema');
    const costoRaw = valor(row,'costo_unitario');
    const bodega = valor(row,'bodega') || null;
    const batch = valor(row,'batch') || null;
    const ubicacion = valor(row,'ubicacion') || null;
    const storage_bin = valor(row,'storage_bin') || null;
    // Un valor negativo (típico de notas de crédito/ajustes en exportaciones de SAP) viola el
    // check constraint de la tabla — sin este filtro, esa UNA fila hace fallar el INSERT masivo
    // completo (todo el archivo, no solo esa fila), porque se manda como un solo lote. Se guarda
    // el SKU igual, sin ese dato puntual, y se deja registrado como error de esa fila.
    let stock_sistema = stockRaw!=='' ? Number(stockRaw) : null;
    if(stock_sistema !== null && stock_sistema < 0){
      anotarError('Stock en negativo');
      stock_sistema = null;
    }
    let costo_unitario = costoRaw!=='' ? Number(costoRaw) : null;
    if(costo_unitario !== null && costo_unitario < 0){
      anotarError('Costo en negativo');
      costo_unitario = null;
    }
    porIdentidadSku.set(JSON.stringify([sku_code, bodega, batch, ubicacion, storage_bin]), {
      sku_code,
      empresa_id: state.perfil.empresa_id,
      descripcion: valor(row,'descripcion') || null,
      categoria: valor(row,'categoria') || null,
      batch,
      unidad_medida: valor(row,'unidad_medida') || null,
      ubicacion,
      storage_bin,
      bodega,
      stock_sistema,
      costo_unitario,
      // Si el archivo no trae columna "Crítico", se omite el campo entero (no se manda ni en
      // false) -- así el upsert (resolution=merge-duplicates) no pisa el valor que ya tenía cada
      // SKU en la base. Solo se sobrescribe cuando la persona de verdad mandó esa columna.
      ...(mapeo.critico? {critico: parsearBooleanoCarga(valor(row,'critico'))} : {}),
      ...(mapeo.stock_minimo? {stock_minimo: valor(row,'stock_minimo')!=='' ? Number(valor(row,'stock_minimo')) : null} : {}),
      ...(mapeo.tipo_material? {tipo_material: valor(row,'tipo_material') || null} : {}),
      // Solo informativos (ver comentario en CAMPOS_SKU) -- se omiten enteros si el archivo no
      // trae esa columna, para no pisar con null lo que ya tenía el SKU en cargas anteriores.
      ...(mapeo.stock_bloqueado? {stock_bloqueado: valor(row,'stock_bloqueado')!=='' ? Number(valor(row,'stock_bloqueado')) : null} : {}),
      ...(mapeo.stock_transito_1? {stock_transito_1: valor(row,'stock_transito_1')!=='' ? Number(valor(row,'stock_transito_1')) : null} : {}),
      ...(mapeo.stock_transito_2? {stock_transito_2: valor(row,'stock_transito_2')!=='' ? Number(valor(row,'stock_transito_2')) : null} : {}),
      ...(mapeo.stock_transferencia? {stock_transferencia: valor(row,'stock_transferencia')!=='' ? Number(valor(row,'stock_transferencia')) : null} : {}),
      activo: true,
      updated_at: marcaTiempo,
      capturado_en: marcaTiempo,
    });
  });
  const lote = Array.from(porIdentidadSku.values());
  // Módulo de bodega: después de la apertura el stock lo llevan los movimientos, no el Excel.
  const bodegaActiva = moduloBodegaActivo();
  const aperturaYaHecha = bodegaActiva ? await hayAperturaBodega() : false;
  if(aperturaYaHecha) lote.forEach(f=>{ delete f.stock_sistema; });
  // Un solo POST con todo el archivo (ej. 64.000 filas) supera el statement_timeout de 8s del
  // rol authenticated: cada fila dispara triggers propios (auditoría + chequeo de límite de
  // bodega), y ese costo por-fila multiplicado por decenas de miles de filas hace que Postgres
  // corte la consulta a mitad de camino — con un archivo grande, la carga entera fallaba (aunque
  // los datos fueran válidos) solo por el tamaño del lote. Partirlo en bloques evita el timeout
  // sin tocar los triggers ni la configuración de la base: cada POST individual es chico y rápido.
  const TAM_LOTE_CARGA = 2000;
  let insertados = 0;
  setState({cargaMasivaProgreso: {actual:0, total:lote.length}});
  try{
    for(let i=0; i<lote.length; i+=TAM_LOTE_CARGA){
      const bloque = lote.slice(i, i+TAM_LOTE_CARGA);
      await rest('/skus?on_conflict=empresa_id,sku_code,bodega_key,batch_key,ubicacion_key,storage_bin_key', {method:'POST', body:bloque, prefer:'return=minimal,resolution=merge-duplicates'});
      insertados += bloque.length;
      setState({cargaMasivaProgreso: {actual:insertados, total:lote.length}});
    }
    if(bodegaActiva && !aperturaYaHecha) await registrarAperturaBodega({silencioso:true});
    // "Reemplazar completo": todo lo que quedó activo y NO se tocó en este lote (updated_at previo a esta carga) pasa a inactivo.
    if(modo==='reemplazar' && lote.length){
      await rest(`/skus?activo=eq.true&updated_at=lt.${encodeURIComponent(marcaTiempo)}`, {method:'PATCH', body:{activo:false}, prefer:'return=minimal'});
    }
    // La clasificación ABC (ver skus_valor_abc) está materializada por rendimiento -- no se
    // recalcula sola. Una carga masiva es justo cuando más cambia (costo/stock de miles de SKU de
    // una vez), así que se refresca acá; si por lo que sea falla, no debe tumbar una carga que ya
    // se guardó bien -- el cron nocturno la deja al día de todos modos.
    if(lote.some(f=>f.costo_unitario!==undefined && f.costo_unitario!==null) || lote.some(f=>f.stock_sistema!==undefined && f.stock_sistema!==null)){
      try{ await rest('/rpc/refrescar_clasificacion_abc', {method:'POST'}); }catch(e){ /* el cron nocturno lo cubre */ }
    }
    await registrarCarga(file.name, 'skus', data.length, ok, error, resumenErroresAArray(resumenErrores));
    toast(`Carga completa: ${insertados} SKUs cargados${modo==='reemplazar'?' (reemplazo completo)':''}${error?`, ${error} con error`:''}`);
    refrescarListaSkus();
    setState({loading:false, cargaPreview:null, cargaMasivaProgreso:null});
  }catch(e){
    // Con la carga partida en bloques, un bloque que falla a mitad de camino no invalida los
    // anteriores que ya se guardaron — se informa cuántos SKU sí entraron antes del corte.
    const filasFallidas = lote.length - insertados;
    if(filasFallidas>0) resumenErrores.set(e.message, filasFallidas);
    await registrarCarga(file.name, 'skus', data.length, insertados, error + filasFallidas, resumenErroresAArray(resumenErrores));
    setState({loading:false, cargaMasivaProgreso:null});
    toast(insertados ? `Se cargaron ${insertados} de ${lote.length} SKU antes de fallar: ${e.message}` : e.message, 'err');
  }
}

/* =======================================================================
   MODO OFFLINE — cola local para conteos y SKU cuando no hay conexión
   ======================================================================= */
const COLA_OFFLINE_KEY = 'cola_offline_conteos'; // nombre histórico; hoy también guarda SKU (ver "tipo" de cada item)
const TIPO_ACCION_OFFLINE_LABEL = { conteo:'Conteo', sku:'SKU' };

// fetch() rechaza con TypeError cuando la red falla de verdad (sin señal, DNS, etc.);
// los errores HTTP (4xx/5xx) llegan como una Response resuelta, no como excepción.
// Así distinguimos "no hay conexión" (encolar) de "el servidor rechazó la solicitud" (mostrar el error).
function pareceFalloDeRed(e){
  return e instanceof TypeError;
}

// Red de seguridad global para promesas rechazadas que se le escapan a su propio catch (Sentry
// #227): con decenas de rest()/authRequest()/storageUpload() en la app, un catch(e) olvidado en
// algún flujo puntual deja el TypeError de "sin conexión" (u otro error) como promesa rechazada
// sin capturar -- Sentry lo vería igual (tiene su propio listener aparte), pero ese mensaje está
// en su ignoreErrors (ver <head>), y la persona se quedaría sin ningún aviso en pantalla. Esto no
// reemplaza los catch puntuales (que siguen dando mensajes más específicos), es el piso mínimo
// para que ninguno se escape en silencio.
function mensajeParaRechazoNoCapturado(motivo){
  return pareceFalloDeRed(motivo) ? MENSAJE_SIN_CONEXION : 'Ocurrió un error inesperado. Inténtalo de nuevo.';
}

function leerColaOffline(){
  try{ return JSON.parse(localStorage.getItem(COLA_OFFLINE_KEY)||'[]'); }catch(e){ return []; }
}

function guardarColaOffline(cola){
  try{ localStorage.setItem(COLA_OFFLINE_KEY, JSON.stringify(cola)); }catch(e){ /* localStorage no disponible */ }
  state.colaOffline = cola;
}

// Crea la entrada en la cola y la deja visible de inmediato ("pendiente"); devuelve
// el item creado (con su id local) para poder asociarle fotos en IndexedDB (solo aplica
// a conteos). `tipo` decide cómo se procesa al sincronizar (ver procesarUnItemOffline).
function encolarAccionOffline(tipo, payload){
  const cola = leerColaOffline();
  const item = { id: 'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,7), tipo, creado_en: Date.now(), estado:'pendiente', error:null, ...payload };
  cola.push(item);
  guardarColaOffline(cola);
  return item;
}

function quitarDeColaOffline(id){
  guardarColaOffline(leerColaOffline().filter(i=>i.id!==id));
}

function marcarErrorEnColaOffline(id, mensaje){
  guardarColaOffline(leerColaOffline().map(i => i.id===id ? {...i, estado:'error', error:mensaje} : i));
}

/* -----------------------------------------------------------------------
   Fotos offline (IndexedDB): localStorage no sirve para archivos binarios
   (límite chico, ~5-10MB), así que las fotos de conteos guardados sin
   conexión se guardan aparte, en IndexedDB, asociadas al id del conteo
   encolado, y se suben recién al sincronizar.
   ----------------------------------------------------------------------- */
const OFFLINE_DB_NAME = 'certero_offline';
const FOTOS_OFFLINE_STORE = 'fotos_pendientes';

function abrirDbOffline(){
  return new Promise((resolve, reject) => {
    if(typeof indexedDB === 'undefined'){ reject(new Error('IndexedDB no disponible en este navegador')); return; }
    const req = indexedDB.open(OFFLINE_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(FOTOS_OFFLINE_STORE)){
        const store = db.createObjectStore(FOTOS_OFFLINE_STORE, {keyPath:'id'});
        store.createIndex('itemId', 'itemId', {unique:false});
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function solicitudAPromesa(req){
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// Guarda una o más fotos (File) asociadas al conteo encolado `itemId`.
async function guardarFotosOffline(itemId, archivos){
  if(!archivos || !archivos.length) return;
  const db = await abrirDbOffline();
  const store = db.transaction(FOTOS_OFFLINE_STORE, 'readwrite').objectStore(FOTOS_OFFLINE_STORE);
  await Promise.all(archivos.map((file,i) => solicitudAPromesa(store.put({
    id: `${itemId}-${i}-${Math.random().toString(36).slice(2,7)}`,
    itemId, nombre: file.name, tipo: file.type, blob: file,
  }))));
  db.close();
}

async function leerFotosOffline(itemId){
  const db = await abrirDbOffline();
  const store = db.transaction(FOTOS_OFFLINE_STORE, 'readonly').objectStore(FOTOS_OFFLINE_STORE);
  const fotos = await solicitudAPromesa(store.index('itemId').getAll(itemId));
  db.close();
  return fotos;
}

async function borrarFotosOffline(itemId){
  const db = await abrirDbOffline();
  const store = db.transaction(FOTOS_OFFLINE_STORE, 'readwrite').objectStore(FOTOS_OFFLINE_STORE);
  const claves = await solicitudAPromesa(store.index('itemId').getAllKeys(itemId));
  await Promise.all(claves.map(k => solicitudAPromesa(store.delete(k))));
  db.close();
}

async function descartarAccionOffline(id){
  const item = leerColaOffline().find(i=>i.id===id);
  const tipoTexto = item && item.tipo==='sku' ? 'este SKU guardado' : item && item.tipo==='documento_bodega' ? 'este documento de bodega guardado' : 'este conteo guardado';
  if(!confirm(`¿Descartar ${tipoTexto} sin conexión? Esta acción no se puede deshacer.`)) return;
  quitarDeColaOffline(id);
  await borrarFotosOffline(id).catch(()=>{});
  render();
}

// Procesa un único item encolado sin conexión. El tipo decide qué hacer:
// - 'sku': INSERT directo a /skus (mismo criterio que crearSkuManual — sin upsert, ver
//   esErrorCodigoSkuDuplicado, para no pisar en silencio un SKU existente).
// - 'conteo' (o sin tipo, para lo ya encolado antes de que existiera este campo): sube sus
//   fotos pendientes (si tiene), crea el conteo y lo enlaza con esas fotos.
// No toca la cola/localStorage; eso lo decide quien llama según el resultado.
async function procesarUnItemOffline(item){
  // item.creado_en queda registrado desde el momento en que se encoló (sin conexión), no
  // cuándo se sincroniza — es la fecha/hora real de captura para efectos de auditoría.
  const capturadoEn = new Date(item.creado_en).toISOString();
  try{
    if(item.tipo==='documento_bodega'){
      const res = await rest('/rpc/registrar_documento_bodega', {method:'POST', body:{...item.payload, p_capturado_en: capturadoEn, p_idempotency_key: item.idempotency_key}});
      const doc = res && res.documento;
      const fotos = await leerFotosOffline(item.id).catch(()=>[]);
      if(doc && fotos.length && !(res && res.repetido)){
        await subirFotosDocumentoBodega(doc.id, fotos.map(f=>({tipo: (f.nombre||'').startsWith('guia-') ? 'guia' : 'material', file: new File([f.blob], (f.nombre||'foto.jpg').replace(/^(guia|material)-/,''), {type: f.tipo||'image/jpeg'})})));
      }
      await borrarFotosOffline(item.id).catch(()=>{});
      refrescarBodega();
      return {ok:true};
    }
    if(item.tipo==='sku'){
      await rest('/skus', {method:'POST', body:[{
        sku_code: item.sku_code,
        descripcion: item.descripcion,
        categoria: item.categoria,
        batch: item.batch,
        unidad_medida: item.unidad_medida,
        bodega: item.bodega,
        ubicacion: item.ubicacion,
        storage_bin: item.storage_bin,
        stock_sistema: item.stock_sistema,
        empresa_id: item.empresa_id,
        capturado_en: capturadoEn,
      }], prefer:'return=minimal'});
      return {ok:true};
    }

    // Compatibilidad: un item encolado antes de agregar idempotencia no trae la llave -- se le
    // asigna una la primera vez que se procesa y se guarda en la cola, para que quede estable en
    // reintentos futuros de este mismo item (si no, cada reintento generaría una llave distinta
    // y el conteo terminaría duplicado en vez de deduplicado).
    let idempotencyKey = item.idempotency_key;
    if(!idempotencyKey){
      idempotencyKey = crypto.randomUUID();
      guardarColaOffline(leerColaOffline().map(i=> i.id===item.id ? {...i, idempotency_key:idempotencyKey} : i));
    }

    const fotos = await leerFotosOffline(item.id).catch(()=>[]);
    const urls = [];
    for(let i=0;i<fotos.length;i++){
      const foto = fotos[i];
      const ext = (foto.nombre.split('.').pop()||'jpg').toLowerCase();
      // Ruta determinística (llave de idempotencia + índice), no Date.now()+random: si este
      // mismo item se reintenta (ver más abajo), storageUpload (x-upsert:true) pisa la MISMA
      // ruta en vez de crear un archivo nuevo cada vez.
      const ruta = `${item.empresa_id}/${item.sku_code}/${idempotencyKey}-${i}.${ext}`;
      urls.push(await storageUpload(ruta, foto.blob));
    }
    let filas = await rest('/conteos?on_conflict=idempotency_key', {method:'POST', body:[{
      sku_id: item.sku_id,
      usuario_id: item.usuario_id,
      empresa_id: item.empresa_id,
      cantidad_contada: item.cantidad_contada,
      ubicacion_contada: item.ubicacion_contada,
      bodega: item.bodega,
      observacion: item.observacion,
      capturado_en: capturadoEn,
      fuera_de_plan: item.fuera_de_plan,
      ubicacion_distinta: !!item.ubicacion_distinta,
      idempotency_key: idempotencyKey,
    }], prefer:'resolution=ignore-duplicates,return=representation'});
    // Igual que en guardarConteo: si ya existía (un intento anterior de sincronizar este mismo
    // item sí llegó a guardarse, pero la respuesta se perdió), se busca la fila ya guardada.
    let conteoId = filas && filas[0] && filas[0].id;
    if(!conteoId){
      const existentes = await rest(`/conteos?idempotency_key=eq.${idempotencyKey}&select=id`);
      conteoId = existentes && existentes[0] && existentes[0].id;
    }
    if(conteoId && urls.length){
      await rest('/conteo_fotos?on_conflict=foto_url', {method:'POST', body: urls.map(foto_url=>({conteo_id:conteoId, foto_url})), prefer:'resolution=ignore-duplicates,return=minimal'});
    }
    await borrarFotosOffline(item.id).catch(()=>{});
    return {ok:true};
  }catch(e){
    if(pareceFalloDeRed(e)) return {ok:false, red:true};
    if(item.tipo==='sku' && esErrorCodigoSkuDuplicado(e)) return {ok:false, red:false, mensaje:mensajeCodigoSkuDuplicado(item.sku_code, item.bodega, item.batch, item.ubicacion, item.storage_bin)};
    return {ok:false, red:false, mensaje:e.message};
  }
}

// Envía los conteos y SKU guardados sin conexión, en orden, uno por uno. Si vuelve a
// fallar por red se detiene ahí (se sigue sin conexión) y deja el resto para
// el próximo intento. Un item que falla por un error real del servidor
// (no de red) queda marcado como "error" y visible en la cola en vez de
// perderse en silencio; esos solo se reintentan a mano, para no reintentar
// en bucle algo que ya sabemos que va a volver a fallar igual.
async function sincronizarColaOffline(){
  if(!state.session || state.sincronizandoOffline) return;
  const cola = leerColaOffline();
  const pendientes = cola.filter(i=>i.estado!=='error');
  if(!pendientes.length) return;
  state.sincronizandoOffline = true;
  render();
  let enviados = 0;
  let seCorto = false;
  for(const item of pendientes){
    if(seCorto) break;
    const resultado = await procesarUnItemOffline(item);
    if(resultado.ok){ quitarDeColaOffline(item.id); enviados++; }
    else if(resultado.red) seCorto = true;
    else marcarErrorEnColaOffline(item.id, resultado.mensaje);
  }
  state.sincronizandoOffline = false;
  if(enviados>0){
    toast(`${enviados} cambio${enviados===1?'':'s'} sincronizado${enviados===1?'':'s'}`);
    cargarSkus(); invalidarCacheAgregados(['generales','sinUbicacion']); refrescarSiCargada(['dashboard','reconteos','skusPagina']);
  }
  render();
}

// Reintento manual de un item puntual (desde el panel de detalle), sin
// importar si ya estaba marcado como "error" — a diferencia de la
// sincronización automática, este sí se dispara a pedido explícito.
async function reintentarAccionOffline(id){
  if(!state.session || state.sincronizandoOffline) return;
  const item = leerColaOffline().find(i=>i.id===id);
  if(!item) return;
  state.sincronizandoOffline = true;
  render();
  const resultado = await procesarUnItemOffline(item);
  if(resultado.ok){
    quitarDeColaOffline(id);
    toast(item.tipo==='sku' ? 'SKU sincronizado' : 'Conteo sincronizado');
    cargarSkus(); invalidarCacheAgregados(['generales','sinUbicacion']); refrescarSiCargada(['dashboard','reconteos','skusPagina']);
  }else if(resultado.red){
    toast('Sigue sin haber conexión','err');
  }else{
    marcarErrorEnColaOffline(id, resultado.mensaje);
    toast(`No se pudo sincronizar: ${resultado.mensaje}`,'err');
  }
  state.sincronizandoOffline = false;
  render();
}

// Agregar o quitar una foto exige volver a renderizar toda la pantalla (para mostrar la
// miniatura), pero el resto del formulario (cantidad, ubicación, observación) no está
// atado al estado — son inputs sueltos que se leen recién al guardar. Sin esto, cada foto
// agregada/quitada borraba lo que la persona ya había tipeado, en especial la cantidad.
function conservandoCamposConteo(fn){
  const ids = ['c-cant', 'c-bodega', 'c-ubic', 'c-obs'];
  const valores = {};
  ids.forEach(id=>{ const el = document.getElementById(id); if(el) valores[id] = el.value; });
  fn();
  ids.forEach(id=>{ const el = document.getElementById(id); if(el && valores[id]!==undefined) el.value = valores[id]; });
}

// Bug reportado: al elegir bodega/ubicación/storage bin en "Agregar a la planificación", la
// selección desaparecía sola. Causa: mientras la persona llena ese formulario, hay de sobra
// actividad de fondo que dispara un render() completo sin relación alguna con lo que está
// llenando — el ejemplo más frecuente es cargarPlanSemanal() recalculando en segundo plano el
// universo y el detalle de CADA entrada ya planificada (dos setState por entrada), pero
// cualquiera de las otras cargas iniciales (cargarTodo) puede seguir resolviendo de fondo si la
// conexión es lenta, que es justamente el escenario que más le importa a esta app ("incluso sin
// señal"). Storage bin es lo que más se nota porque su lista de opciones ni siquiera viene del
// estado (se carga aparte, vía cargarBinsPara), así que un render() de fondo no solo borra la
// selección: deja el selector entero como si nunca se hubiera elegido ubicación.
// En vez de perseguir cada setState de fondo uno por uno (imposible de mantener), render() en sí
// captura y restaura este formulario alrededor de CUALQUIER render mientras esté visible — mismo
// principio que conservandoCamposConteo, pero aplicado a nivel de render() para cubrir también
// actividad de fondo que no pasa por un solo punto de entrada conocido.
function capturarFormularioPlan(){
  const binEl = document.getElementById('p-bin');
  if(!binEl) return null; // no estamos mostrando el formulario "Agregar" (otra vista, o editando)
  const bodegaEl = document.getElementById('p-bodega');
  const ubicEl = document.getElementById('p-ubic');
  const binTodosEl = document.getElementById('p-bin-todos');
  const resumenBinEl = document.getElementById('p-bin-resumen');
  const fechaEl = document.getElementById('p-fecha');
  const respEl = document.getElementById('p-responsable');
  const notaEl = document.getElementById('p-nota');
  return {
    bodega: bodegaEl && bodegaEl.value,
    ubicInnerHTML: ubicEl && ubicEl.innerHTML,
    ubicValue: ubicEl && ubicEl.value,
    ubicDisabled: ubicEl && ubicEl.disabled,
    binInnerHTML: binEl.innerHTML,
    binDisabled: binEl.disabled,
    binModo: binEl.dataset.modo,
    binSkuCodes: binEl.dataset.skuCodes,
    // binOpciones/binTotalSkuModoSkus: la foto (bin -> cantidad_skus, o el total plano en modo
    // SKU puntuales) que actualizarResumenBin() usa para recalcular el resumen "(X bin/SKU)"
    // según lo que esté seleccionado en cada momento — sin esto, un render de fondo perdía el
    // dato y el resumen quedaba en blanco hasta volver a tocar la ubicación.
    binOpciones: binEl.dataset.opciones,
    binTotalSkuModoSkus: binEl.dataset.totalSkuModoSkus,
    binSeleccionados: [...binEl.selectedOptions].map(o=>o.value),
    binTodosChecked: binTodosEl && binTodosEl.checked,
    binTodosDisabled: binTodosEl && binTodosEl.disabled,
    resumenBinText: resumenBinEl && resumenBinEl.textContent,
    fecha: fechaEl && fechaEl.value,
    responsable: respEl && respEl.value,
    nota: notaEl && notaEl.value,
  };
}
function restaurarFormularioPlan(snap){
  if(!snap) return;
  const binEl2 = document.getElementById('p-bin');
  if(!binEl2) return; // el render cambió de vista o de formulario, nada que restaurar
  const bodegaEl2 = document.getElementById('p-bodega');
  const ubicEl2 = document.getElementById('p-ubic');
  const binTodosEl2 = document.getElementById('p-bin-todos');
  const resumenBinEl2 = document.getElementById('p-bin-resumen');
  const fechaEl2 = document.getElementById('p-fecha');
  const respEl2 = document.getElementById('p-responsable');
  const notaEl2 = document.getElementById('p-nota');
  if(bodegaEl2 && snap.bodega!==undefined) bodegaEl2.value = snap.bodega;
  if(ubicEl2 && snap.ubicInnerHTML!==undefined){
    ubicEl2.innerHTML = snap.ubicInnerHTML;
    ubicEl2.value = snap.ubicValue;
    ubicEl2.disabled = snap.ubicDisabled;
  }
  binEl2.innerHTML = snap.binInnerHTML;
  binEl2.disabled = snap.binDisabled;
  if(snap.binModo!==undefined) binEl2.dataset.modo = snap.binModo;
  if(snap.binSkuCodes!==undefined) binEl2.dataset.skuCodes = snap.binSkuCodes;
  if(snap.binOpciones!==undefined) binEl2.dataset.opciones = snap.binOpciones;
  if(snap.binTotalSkuModoSkus!==undefined) binEl2.dataset.totalSkuModoSkus = snap.binTotalSkuModoSkus;
  if(binEl2.options) [...binEl2.options].forEach(o=>{ o.selected = snap.binSeleccionados.includes(o.value); });
  if(binTodosEl2){
    binTodosEl2.checked = !!snap.binTodosChecked;
    binTodosEl2.disabled = snap.binTodosDisabled;
  }
  if(resumenBinEl2 && snap.resumenBinText!==undefined) resumenBinEl2.textContent = snap.resumenBinText;
  if(fechaEl2 && snap.fecha!==undefined) fechaEl2.value = snap.fecha;
  if(respEl2 && snap.responsable!==undefined) respEl2.value = snap.responsable;
  if(notaEl2 && snap.nota!==undefined) notaEl2.value = snap.nota;
}

// Marcar/desmarcar "Lo encontré en otra ubicación" dispara un render() completo (para
// reflejar el check) — se preserva cantidad y observación igual que conservandoCamposConteo.
// Los campos de ubicación no necesitan preservarse: siempre muestran el valor del maestro,
// fijos, sin importar el estado del check (ver guardarConteo/ubicacion_distinta).
function alternarOtraUbicacionConteo(marcado){
  const cant = document.getElementById('c-cant');
  const obs = document.getElementById('c-obs');
  const valCant = cant ? cant.value : undefined;
  const valObs = obs ? obs.value : undefined;
  setState({conteoOtraUbicacion: marcado});
  const cant2 = document.getElementById('c-cant');
  const obs2 = document.getElementById('c-obs');
  if(cant2 && valCant!==undefined) cant2.value = valCant;
  if(obs2 && valObs!==undefined) obs2.value = valObs;
}

// Mismo problema que conservandoCamposConteo: refrescar las sugerencias de ubicación/bin
// en "Cargar SKU" implica un render() completo, que si no se hace con cuidado borraría lo
// que la persona ya tipeó en los otros campos del formulario (descripción, categoría, etc.).
function conservandoCamposSku(fn){
  const ids = ['s-code', 's-desc', 's-cat', 's-batch', 's-um', 's-bodega', 's-ubic', 's-bin', 's-stock', 's-costo'];
  const valores = {};
  ids.forEach(id=>{ const el = document.getElementById(id); if(el) valores[id] = el.value; });
  fn();
  ids.forEach(id=>{ const el = document.getElementById(id); if(el && valores[id]!==undefined) el.value = valores[id]; });
}

async function guardarConteo({cantidad, ubicacion, bodega, observacion, ubicacionDistinta}){
  if(!state.skuSeleccionado){ toast('Selecciona un SKU primero','err'); return; }
  if(cantidad === '' || cantidad === null || isNaN(Number(cantidad)) || Number(cantidad) < 0){ toast('Ingresa una cantidad contada válida','err'); return; }
  if(!perfilCargado()) return;
  await esperarFotosEnProceso(); // ver comprimirFoto: una foto recién tomada puede seguir comprimiéndose
  // Con conteo ciego, la persona no ve el stock del sistema -- este es el reemplazo del chequeo
  // de cordura que antes hacía ella misma al ver un número muy distinto al que tenía en pantalla.
  // Nunca revela cuál es el valor esperado, solo que el ingresado se aleja mucho de lo habitual.
  // stock_sistema ahora llega enmascarado (null) para un operador con conteo ciego -- ver
  // skus_lectura/skus_planificables y debe_ocultar_stock_operador() -- así que la comparación se
  // hace en el servidor (verificar_conteo_atipico), contra el valor real, sin mandarlo nunca acá.
  if(ocultarStockOperador()){
    let atipico = false;
    try{ atipico = !!(await rest('/rpc/verificar_conteo_atipico', {method:'POST', body:{p_sku_id: state.skuSeleccionado.id, p_cantidad: Number(cantidad)}})); }
    catch(e){ /* si falla la verificación, no se bloquea el guardado -- sigue como si no fuera atípico */ }
    if(atipico){
      const unidad = state.skuSeleccionado.unidad_medida||'';
      if(!confirm(`¿Confirmas ${cantidad} ${unidad}? Este valor es bastante distinto de lo habitual para este material.`)) return;
    }
  }
  // Momento real en que la persona capturó el conteo (no cuándo termina de guardarse) —
  // fundamental para auditoría cuando se guarda sin conexión y se sincroniza horas después.
  const capturadoEn = new Date().toISOString();
  // Llave de idempotencia: se genera UNA vez por intento de guardado y viaja igual en cualquier
  // reintento de ESE mismo intento (online con timeout, o encolado offline y sincronizado
  // después) -- así, si el conteo termina llegando al servidor más de una vez (ej. la respuesta
  // del primer intento se perdió por señal mala, pero el insert sí se alcanzó a hacer), el
  // servidor lo reconoce como el mismo intento y no lo duplica (conteos.idempotency_key, único).
  const idempotencyKey = crypto.randomUUID();
  setState({loading:true, conteoGuardandoLento:false});
  // Ver UMBRAL_GUARDADO_LENTO_MS: si el guardado no terminó (éxito, error, o modo offline) antes
  // de este plazo, avisa que sigue intentando en vez de dejar solo el spinner chico del botón.
  // El finally de más abajo lo limpia siempre, gane quien gane la carrera.
  const timerLento = setTimeout(()=> setState({conteoGuardandoLento:true}), UMBRAL_GUARDADO_LENTO_MS);
  try{
    let filas = await rest('/conteos?on_conflict=idempotency_key', {method:'POST', body:[{
      sku_id: state.skuSeleccionado.id,
      usuario_id: state.perfil ? state.perfil.id : null,
      empresa_id: state.perfil.empresa_id,
      cantidad_contada: Number(cantidad),
      ubicacion_contada: ubicacion || null,
      bodega: bodega || state.skuSeleccionado.bodega || null,
      observacion: observacion || null,
      capturado_en: capturadoEn,
      fuera_de_plan: !state.conteoOrigenPlan,
      ubicacion_distinta: !!ubicacionDistinta,
      idempotency_key: idempotencyKey,
    }], prefer:'resolution=ignore-duplicates,return=representation', timeoutMs: UMBRAL_ABORTAR_GUARDADO_MS});
    // Si el conteo ya existía (reintento de un intento anterior que sí había llegado a guardarse
    // en el servidor, pero cuya respuesta nunca volvió), el insert no devuelve fila (ON CONFLICT
    // DO NOTHING) -- se busca la que ya quedó guardada, para poder asociarle las fotos igual.
    let conteoId = filas && filas[0] && filas[0].id;
    if(!conteoId){
      const existentes = await rest(`/conteos?idempotency_key=eq.${idempotencyKey}&select=id`);
      conteoId = existentes && existentes[0] && existentes[0].id;
    }

    if(conteoId && state.conteoFotos.length){
      const urls = [];
      for(let i=0;i<state.conteoFotos.length;i++){
        const f = state.conteoFotos[i];
        const ext = (f.file.name.split('.').pop()||'jpg').toLowerCase();
        // Ruta determinística (llave de idempotencia + índice de la foto), no Date.now()+random:
        // si esta misma foto se reintenta subir, storageUpload (x-upsert:true) pisa la MISMA
        // ruta en vez de crear un archivo nuevo cada vez.
        const path = `${state.perfil.empresa_id}/${state.skuSeleccionado.sku_code}/${idempotencyKey}-${i}.${ext}`;
        urls.push(await storageUpload(path, f.file));
      }
      await rest('/conteo_fotos?on_conflict=foto_url', {method:'POST', body: urls.map(foto_url=>({conteo_id:conteoId, foto_url})), prefer:'resolution=ignore-duplicates,return=minimal'});
    }

    toast('Conteo registrado');
    setState({loading:false, conteoGuardandoLento:false, skuSeleccionado:null, conteoOrigenPlan:false, conteoOtraUbicacion:false, conteoFotos:[], skuSearch:'', buscadorLibre: resetBuscadorLibre(), conteoVecesPeriodo:null});
    if(state.contarPlan.skusPendientes) elegirCascadaContar({});
    invalidarCacheAgregados(['generales','sinUbicacion']); // cambió cuántos SKU quedan pendientes por bodega
    refrescarSiCargada(['dashboard','reconteos']);
  }catch(e){
    // Sin conexión de verdad, o señal tan lenta que rest() abortó el intento (ver
    // UMBRAL_ABORTAR_GUARDADO_MS): en ambos casos guardamos el conteo (y sus fotos, en
    // IndexedDB) en este dispositivo y lo enviamos apenas vuelva/mejore la señal, en vez de
    // dejar a la persona esperando o perder el trabajo. La llave de idempotencia viaja con el
    // item encolado, para que la sincronización posterior sea segura de reintentar.
    if(pareceFalloDeRed(e)){
      const fotosAEncolar = state.conteoFotos.map(f=>f.file);
      const item = encolarAccionOffline('conteo', {
        idempotency_key: idempotencyKey,
        sku_id: state.skuSeleccionado.id,
        sku_code: state.skuSeleccionado.sku_code,
        usuario_id: state.perfil ? state.perfil.id : null,
        empresa_id: state.perfil.empresa_id,
        cantidad_contada: Number(cantidad),
        ubicacion_contada: ubicacion || null,
        bodega: bodega || state.skuSeleccionado.bodega || null,
        observacion: observacion || null,
        fotosCount: fotosAEncolar.length,
        fuera_de_plan: !state.conteoOrigenPlan,
        ubicacion_distinta: !!ubicacionDistinta,
      });
      if(fotosAEncolar.length) await guardarFotosOffline(item.id, fotosAEncolar).catch(()=>{});
      setState({loading:false, conteoGuardandoLento:false, skuSeleccionado:null, conteoOrigenPlan:false, conteoOtraUbicacion:false, conteoFotos:[], skuSearch:'', buscadorLibre: resetBuscadorLibre(), conteoVecesPeriodo:null});
      toast(e.motivoTimeout
        ? 'La conexión está muy lenta: el conteo quedó guardado en este dispositivo y se enviará solo cuando mejore la señal.'
        : 'Sin conexión: conteo guardado en este dispositivo. Se enviará cuando vuelva la señal.', 'warn');
      return;
    }
    setState({loading:false, conteoGuardandoLento:false});
    toast(e.message,'err');
  }finally{
    clearTimeout(timerLento);
  }
}

/* =======================================================================
   ESCÁNER DE CÓDIGOS — asociación código de barras / QR ↔ SKU
   ======================================================================= */
// Resuelve un código leído por la cámara contra la lista de SKU ya cargada. Dos formas
// de coincidencia, en orden: (1) el propio código del SKU (cubre el caso de imprimir
// stickers genéricos con el sku_code como código de barras, la salida más barata para
// ítems que nunca trajeron código de fábrica) y (2) el código de barras de fábrica ya
// asociado en una lectura anterior (columna codigo_barras). Devuelve TODAS las filas que
// calzan, no solo la primera: el mismo código puede existir en más de una bodega (cada
// bodega es su propia fila de SKU) y quien llama decide qué hacer si hay más de un
// resultado. Función pura para poder testearla sin cámara real.
function resolverSkusPorCodigo(skus, codigo){
  const c = (codigo||'').trim();
  if(!c) return [];
  const cLower = c.toLowerCase();
  const porCodigo = skus.filter(s=> (s.sku_code||'').toLowerCase() === cLower);
  if(porCodigo.length) return porCodigo;
  return skus.filter(s=> (s.codigo_barras||'').toLowerCase() === cLower);
}

// Un SKU escaneado se marca como "del plan" si está en la lista de pendientes que se ve ahora
// mismo en la tarjeta Plan del día (bodega/ubicación ya elegidas ahí) — no en todo el plan del
// día completo: recorrer cada bodega/ubicación planificada para saberlo costaría una consulta
// por cada una y, sin storage bin, el universo de una sola puede ser de miles de SKU (ver
// skusMovidosDeEntradas más arriba).
function skuEstaEnPlanDelDia(skuCode){
  const pendientes = state.contarPlan.skusPendientes;
  return !!(pendientes && pendientes.some(s=>s.sku_code===skuCode));
}

// Un SKU concreto (con su bodega/ubicación/bin) está cubierto por alguna entrada del plan del
// día del operador (state.contarPlan.entradas), sin pedir nada al servidor. Pedido de Joel: un
// SKU planificado que el operador tecleaba en el buscador libre (en vez de tocarlo en la lista)
// quedaba como "Fuera de plan" aunque estuviera en su plan de ese día -- el conteo valía igual,
// pero la etiqueta mentía. Misma regla de cobertura que skus_universo_entrada_plan_lote:
// bodega NULL = comodín total; bodega '' = SKU sin bodega; ubicacion_nula = SKU sin ubicación;
// ubicación/bin vacíos = comodín; solo_sin_ubicacion = SKU sin bodega ni ubicación; y las
// exclusiones de la entrada. No mira si el SKU ya se contó: acá solo importa si estaba planificado.
function skuCubiertoPorPlanDelDia(sku){
  const cp = state.contarPlan;
  if(!sku || !cp || !Array.isArray(cp.entradas) || !cp.entradas.length) return false;
  const bodega = sku.bodega==null ? null : sku.bodega;
  const ubic = sku.ubicacion==null || sku.ubicacion==='' ? null : sku.ubicacion;
  const bin = sku.storage_bin==null || sku.storage_bin==='' ? null : sku.storage_bin;
  return cp.entradas.some(e=>{
    if(Array.isArray(e.skus_excluidos) && e.skus_excluidos.includes(sku.sku_code)) return false;
    // Entrada por código: cubre exactamente su lista, sin importar la zona.
    if(e.por_sku) return Array.isArray(e.skus_incluidos) && e.skus_incluidos.includes(sku.sku_code);
    if(e.solo_sin_ubicacion) return bodega===null && ubic===null;
    if(e.bodega===''){ if(bodega!==null) return false; }
    else if(e.bodega!=null && e.bodega!==bodega) return false;
    if(e.ubicacion_nula){ if(ubic!==null) return false; }
    else if(e.ubicacion!=null && e.ubicacion!=='' && e.ubicacion!==ubic) return false;
    if(e.storage_bin!=null && e.storage_bin!=='' && e.storage_bin!==bin) return false;
    return true;
  });
}

// Origen "Plan" / "Fuera de plan" al elegir un SKU para contar, venga del escáner o del buscador
// libre: está en la lista de pendientes visible, o alguna entrada del plan del día lo cubre.
function origenPlanParaSku(sku){
  if(!sku) return false;
  return skuEstaEnPlanDelDia(sku.sku_code) || skuCubiertoPorPlanDelDia(sku);
}

async function iniciarEscaner(){
  if(escanerInstancia) return; // ya hay una lectura en curso para este modal
  if(typeof Html5Qrcode === 'undefined'){
    setState({escanerModal: {...state.escanerModal, error:'El lector de códigos no cargó. Revisa tu conexión e inténtalo de nuevo.'}});
    return;
  }
  // Se listan los formatos explícitamente (en vez de dejar que pruebe todos los que sabe
  // decodificar) para que la librería se concentre en QR y los formatos de barras 1D más
  // comunes en maestros de materiales — mejora la velocidad y tasa de lectura de barras,
  // que son más difíciles de leer con solo cámara de celular que un QR.
  const formatos = (typeof Html5QrcodeSupportedFormats !== 'undefined') ? [
    Html5QrcodeSupportedFormats.QR_CODE,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.CODE_93,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.ITF,
  ] : undefined;
  // Reportado real (Joel, en terreno): la cámara abría pero nunca leía una barra clásica (1D).
  // Dos causas conocidas de la librería en ese escenario, ambas corregidas acá:
  // 1) useBarCodeDetectorIfSupported activa el decodificador NATIVO del navegador (BarcodeDetector)
  //    cuando el dispositivo lo soporta (Chrome/Android en su mayoría) en vez de solo el decodificador
  //    en JS puro de la librería — bastante más preciso leyendo barras 1D con cámara de celular.
  // 2) El recuadro cuadrado fijo (260x260) obligaba a alejar el celular para que una barra ANCHA
  //    entrara completa en el cuadro — a esa distancia las líneas quedan demasiado finas para
  //    resolverse. Un recuadro ancho (proporcional al video, no fijo en px) dado como función dinámica
  //    sigue siendo suficientemente alto para un QR chico (el otro formato soportado).
  const instancia = new Html5Qrcode('escaner-reader', {
    ...(formatos ? { formatsToSupport: formatos } : {}),
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
  });
  escanerInstancia = instancia;
  try{
    await instancia.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: (viewfinderWidth, viewfinderHeight) => {
        const ancho = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.9);
        return { width: ancho, height: Math.floor(ancho * 0.5) };
      } },
      (codigoLeido) => onCodigoEscaneado(codigoLeido),
      () => { /* se llama en cada frame sin lectura; no requiere acción */ }
    );
  }catch(e){
    escanerInstancia = null;
    setState({escanerModal: {...state.escanerModal, error:'No se pudo acceder a la cámara. Revisa los permisos del navegador.'}});
  }
}

// Detiene la cámara y limpia el estado del modal de forma síncrona (para poder llamarla
// desde cualquier handler — cerrar, cambiar de pestaña, cerrar sesión — sin esperar el
// stop() async de la librería, que igual libera la cámara en segundo plano).
// El try/catch envuelve la LLAMADA misma a stop(), no solo la promesa que devuelve: si alguien
// cierra el modal mientras la cámara todavía está iniciando (start() aún no resolvió), algunas
// versiones de html5-qrcode lanzan "Cannot stop, scanner is not running or paused" de forma
// síncrona, antes de llegar a devolver una promesa — un .catch() encadenado no lo alcanza a
// atrapar (visto en Sentry, JAVASCRIPT-5).
function detenerEscaner(){
  const instancia = escanerInstancia;
  escanerInstancia = null;
  state.escanerModal = null;
  if(instancia){
    try{
      const promesa = instancia.stop();
      if(promesa && promesa.then) promesa.then(()=> instancia.clear()).catch(()=>{ /* ya estaba detenida */ });
    }catch(e){ /* ya estaba detenida (lanzamiento síncrono) */ }
  }
}

function cerrarEscaner(){
  detenerEscaner();
  render();
}

async function onCodigoEscaneado(codigo){
  if(!state.escanerModal || state.escanerModal.codigo) return; // evita doble disparo mientras se procesa la primera lectura
  const destino = state.escanerModal.destino;
  detenerEscaner();
  // Al cargar un SKU nuevo no hay nada que resolver contra el maestro existente: el código
  // leído se usa tal cual como código del SKU que se está por crear.
  if(destino === 'campo-sku'){
    setState({escanerModal: null});
    const input = document.getElementById('s-code');
    if(input){ input.value = codigo; input.focus(); }
    toast('Código escaneado');
    return;
  }
  const coincidencias = resolverSkusPorCodigo(state.skus, codigo);
  // Desde Ingreso o Salida de bodega: el código va al buscador de la línea.
  if(destino === 'bodega'){
    state.escanerModal = null;
    await buscarSkuBodega(coincidencias.length ? coincidencias[0].sku_code : codigo);
    return;
  }
  // Desde el buscador de Reconteo: el código leído (o el SKU al que ya está asociado, si es un
  // código de barras conocido) se busca en la lista de pendientes. No selecciona nada para contar:
  // la persona ve la fila y decide si toca Recontar.
  if(destino === 'reconteo'){
    const skuCode = coincidencias.length ? coincidencias[0].sku_code : codigo;
    state.escanerModal = null;
    await buscarReconteo(skuCode);
    toast(`Buscando ${skuCode} en Reconteo`);
    return;
  }
  if(coincidencias.length===1){
    setState({skuSeleccionado: coincidencias[0], conteoOrigenPlan: origenPlanParaSku(coincidencias[0]), conteoOtraUbicacion:false});
    toast(`SKU ${coincidencias[0].sku_code} encontrado`);
  }else if(coincidencias.length>1){
    // El mismo código existe en más de una bodega o batch (el código físico es el mismo sin
    // importar dónde esté guardado el material o a qué batch pertenezca): no hay forma de
    // saber cuál es sin preguntar.
    setState({escanerModal: { codigo, opciones: coincidencias, destino }});
  }else{
    setState({escanerModal: { codigo, buscarAsociar:'', asociando:false, destino }});
  }
}

// La persona elige a cuál de las bodegas encontradas corresponde el código escaneado.
function elegirSkuEscaneado(skuId){
  const sku = state.skus.find(s=>s.id===skuId);
  if(!sku) return;
  setState({skuSeleccionado: sku, conteoOrigenPlan: origenPlanParaSku(sku), conteoOtraUbicacion:false, escanerModal: null});
  toast(`SKU ${sku.sku_code} encontrado`);
}

// Primera vez que se ve este código: la persona elige a mano el SKU correcto y desde
// ahora ese código queda asociado — la próxima lectura lo va a reconocer solo.
async function asociarCodigoBarras(skuId, codigo){
  const sku = state.skus.find(s=>s.id===skuId);
  if(!sku) return;
  setState({escanerModal: {...state.escanerModal, asociando:true}});
  try{
    await rest(`/skus?id=eq.${skuId}`, {method:'PATCH', body:{codigo_barras: codigo}, prefer:'return=minimal'});
    sku.codigo_barras = codigo;
    toast(`Código asociado a ${sku.sku_code}`);
    setState({skuSeleccionado: sku, conteoOrigenPlan: origenPlanParaSku(sku), conteoOtraUbicacion:false, escanerModal: null});
  }catch(e){
    toast(e.message,'err');
    setState({escanerModal: {...state.escanerModal, asociando:false}});
  }
}
