/* ---- Caché local de agregados de SKU ----------------------------------------------------
   Categorías / unidades / batches (datalist de Cargar SKU), ubicaciones generales y el conteo
   "SKU sin ubicación" recorren los 63.000 SKU de una empresa real en cada carga (0,6 a 1,2 s cada
   uno medidos en producción) y cambian solo con una carga masiva, un SKU nuevo o editado y, los
   "pendientes", con un conteo o un cambio del plan. Se guardan en localStorage por empresa por
   10 minutos y se invalidan en esas acciones (invalidarCacheAgregados), así una recarga de la app
   (F5, PWA reabierta) no vuelve a pedirlos si nada cambió. Solo nombres y totales: nada de stock
   ni datos por SKU, y nada que un operador no vea igual en pantalla. */
const CACHE_AGREGADOS_TTL_MS = 10 * 60 * 1000;
const CACHE_AGREGADOS_PREFIJO = 'agg_v1_';
function claveCacheAgregado(nombre){ return state.perfil ? `${CACHE_AGREGADOS_PREFIJO}${state.perfil.empresa_id}_${nombre}` : null; }
function leerCacheAgregado(nombre){
  const clave = claveCacheAgregado(nombre);
  if(!clave) return null;
  try{
    const j = JSON.parse(localStorage.getItem(clave) || 'null');
    if(!j || typeof j.t !== 'number' || Date.now() - j.t > CACHE_AGREGADOS_TTL_MS) return null;
    return j.v === undefined ? null : j.v;
  }catch(e){ return null; }
}
function guardarCacheAgregado(nombre, v){
  const clave = claveCacheAgregado(nombre);
  if(!clave) return;
  try{ localStorage.setItem(clave, JSON.stringify({t: Date.now(), v})); }catch(e){ /* sin espacio o modo privado: se sigue sin caché */ }
}
function invalidarCacheAgregados(nombres){
  nombres.forEach(n=>{ const clave = claveCacheAgregado(n); if(clave){ try{ localStorage.removeItem(clave); }catch(e){ /* nada */ } } });
}

async function cargarOpcionesGenerales(forzar){
  try{
    const cache = forzar ? null : leerCacheAgregado('generales');
    const rows = cache !== null ? cache : (await rest('/ubicaciones_generales?order=bodega.asc')) || [];
    if(cache === null) guardarCacheAgregado('generales', rows);
    setState({plan: {...state.plan, generales: rows||[]}});
  }catch(e){ toast(e.message,'err'); }
}

// Crear/quitar una entrada del plan (o excluir un SKU puntual) cambia cuántos SKU quedan
// "pendiente" en Ubicación general y en "SKU sin ubicación" — sin este refresco, esos números
// se quedaban con el valor de cuando se cargó la página hasta el próximo F5.
async function refrescarOpcionesUbicacion(){
  await Promise.all([cargarOpcionesGenerales(true), cargarConteoSinUbicacion(true)]);
}

// SKU cargados sin ubicación general ni específica (ej. desde "Cargar SKU" a mano, sin
// completar esos campos): ubicaciones_generales los excluye por diseño (agrupa por bodega),
// así que se cuentan aparte para poder ofrecerlos como opción en Planificación.
async function cargarConteoSinUbicacion(forzar){
  try{
    const cache = forzar ? null : leerCacheAgregado('sinUbicacion');
    const total = cache !== null ? cache : await contarUniversoUbicacion({soloSinUbicacion:true, excluirYaPlanificados:true});
    if(cache === null) guardarCacheAgregado('sinUbicacion', total);
    setState({plan: {...state.plan, sinUbicacionCount: total}});
  }catch(e){ /* no bloquea la planificación normal si esto falla */ }
}

// Categorías y unidades de medida ya usadas por la empresa, para sugerirlas (datalist) al
// cargar un SKU nuevo y evitar variantes del mismo valor por typo (ej. "Repuesto" vs "Repuestos").
async function cargarOpcionesCategoriasUnidades(forzar){
  try{
    const cache = forzar ? null : leerCacheAgregado('opcionesSku');
    let opciones = cache;
    if(opciones === null){
      const [categorias, unidades, batches] = await Promise.all([
        rest('/categorias_sku?order=categoria.asc'),
        rest('/unidades_medida_sku?order=unidad_medida.asc'),
        rest('/batches_sku?order=batch.asc'),
      ]);
      opciones = {
        categorias: (categorias||[]).map(c=>c.categoria),
        unidades: (unidades||[]).map(u=>u.unidad_medida),
        batches: (batches||[]).map(b=>b.batch),
      };
      guardarCacheAgregado('opcionesSku', opciones);
    }
    setState({
      opcionesCategorias: opciones.categorias || [],
      opcionesUnidades: opciones.unidades || [],
      opcionesBatches: opciones.batches || [],
    });
  }catch(e){ /* la sugerencia es un plus, no bloquea el formulario si falla */ }
}

// BODEGA_VACIA (el grupo "Sin bodega asignada" del <select>) necesita bodega=is.null en vez
// de un eq. literal contra ese texto — igual que filtroBodega() para el universo planificable.
function filtroBodegaOpciones(bodega){
  return bodega===BODEGA_VACIA ? 'bodega=is.null' : `bodega=eq.${encodeURIComponent(bodega)}`;
}

async function opcionesEspecificas(bodega){
  if(!bodega) return [];
  try{
    return await rest(`/ubicaciones_especificas?${filtroBodegaOpciones(bodega)}&order=ubicacion.asc`) || [];
  }catch(e){ return []; }
}

async function opcionesBins(bodega, ubicacion){
  if(!bodega) return [];
  try{
    if(ubicacion){
      return await rest(`/ubicaciones_bins?${filtroBodegaOpciones(bodega)}&ubicacion=eq.${encodeURIComponent(ubicacion)}&order=storage_bin.asc`) || [];
    }
    // "Todas" las ubicaciones específicas: el mismo storage_bin puede repetirse en más de
    // una (la vista viene agrupada por bodega+ubicacion+storage_bin), así que se suman antes
    // de listarlo — si no, un mismo bin aparecería duplicado varias veces en el <select>.
    const filas = await rest(`/ubicaciones_bins?${filtroBodegaOpciones(bodega)}&order=storage_bin.asc`) || [];
    const porBin = new Map();
    for(const f of filas){
      const acc = porBin.get(f.storage_bin) || {storage_bin:f.storage_bin, cantidad_skus:0};
      acc.cantidad_skus += Number(f.cantidad_skus)||0;
      porBin.set(f.storage_bin, acc);
    }
    return Array.from(porBin.values()).sort((a,b)=> a.storage_bin.localeCompare(b.storage_bin));
  }catch(e){ return []; }
}

// El panel entero viaja en una sola llamada (función dashboard_ejecutivo). Antes eran 14
// endpoints en paralelo: el trabajo en la base era mínimo (2 a 73 ms cada consulta, medido con
// los 63.000 materiales de Escondida), pero cada llamada pagaba su preflight CORS, su
// verificación de token y su turno en el pool — 28 idas y vueltas para pintar una pantalla que
// no mostraba nada hasta que contestaba la última. Con señal de terreno eso se sentía lentísimo.
// El JSON que devuelve la función es idéntico al que armaban las 14 consultas.
//
// Top materiales con diferencia: por costo total de la línea (diferencia x costo_unitario, ver
// reconteo_pendiente.valor_diferencia_linea), no por magnitud en unidades — top 10 excedentes
// (mayor valor a favor) y top 10 pérdidas (mayor valor en contra), por separado.
async function cargarDashboard(){
  try{
    const d = await rest(`/rpc/dashboard_ejecutivo`, {method:'POST', body:{
      p_dias: VENTANA_PROYECCION_DIAS,
      p_criticidad: state.resumenGeneral.criticidad || null,
    }}) || {};
    setState({dash:{
      total: d.total||[], diario: d.diario||[], semanal: d.semanal||[], mensual: d.mensual||[],
      ranking: d.ranking||[], exactitudBodega: d.exactitudBodega||[], exactitudMensual: d.exactitudMensual||[],
      topDiferenciasPositivas: d.topDiferenciasPositivas||[], topDiferenciasNegativas: d.topDiferenciasNegativas||[],
      valorizacion: d.valorizacion||[], avancePlanPorCiclo: d.avancePlanPorCiclo||[], diferenciasRecientes: d.diferenciasRecientes||[],
      resumenAbc: d.resumenAbc||[],
    }, dashDiarioPagina: 0,
      // El estado del maestro viene en la misma respuesta, ya filtrado por la criticidad que esté
      // puesta; cargarResumenGeneralSkus queda solo para cuando la persona cambia ese filtro.
      resumenGeneral: {...state.resumenGeneral, datos: (d.resumenGeneral&&d.resumenGeneral[0])||null, cargando:false},
    });
    // Las tres tarjetas de bodega del panel viajan en la misma respuesta. Vienen solo si el
    // módulo está activo (y los pendientes, solo para administradores): las mismas condiciones
    // que la app comprobaba antes de pedirlas por separado. Los cargadores sueltos siguen
    // existiendo porque Inicio, Movimientos y Stock también los usan.
    if(d.bodega){
      setState({bodega:{...state.bodega,
        pendientes: d.bodega.pendientes||[], pendientesCargados:true,
        ultimosMovimientos: d.bodega.ultimosMovimientos||[], ultimosCargados:true,
        valorizacion: d.bodega.valorizacion || state.bodega.valorizacion,
      }});
    }
  }catch(e){ toast(e.message,'err'); }
}

// Parámetros para el RPC resumen_general_skus. El rango de fechas se sacó a pedido de Joel: es
// una foto del maestro completo (último conteo de cada SKU) y, con el 99,8 % de los SKU nunca
// contados, filtrar por cuándo fue ese último conteo no cambiaba nada visible y confundía ("no
// funciona"). Para "qué se contó entre tales fechas" está Buscar. El RPC conserva sus parámetros
// de fecha (en null) por compatibilidad.
function parametrosResumenGeneralSkus(){
  return { p_fecha_desde: null, p_fecha_hasta: null, p_criticidad: state.resumenGeneral.criticidad || null };
}

// Estado general del maestro completo de SKU (Dashboard) -- independiente de cargarDashboard
// (que trae varias tablas y gráficos del ciclo/período actual) para poder recargar solo esto
// cuando cambia el filtro de criticidad, sin repetir el resto de las consultas del panel.
async function cargarResumenGeneralSkus(){
  setState({resumenGeneral: {...state.resumenGeneral, cargando:true}});
  try{
    const filas = await rest('/rpc/resumen_general_skus', {method:'POST', body: parametrosResumenGeneralSkus()});
    setState({resumenGeneral: {...state.resumenGeneral, datos: (filas&&filas[0])||null, cargando:false}});
  }catch(e){
    setState({resumenGeneral: {...state.resumenGeneral, cargando:false}});
    toast(e.message,'err');
  }
}

// Quita caracteres que puedan romper la sintaxis de filtros de PostgREST (,()."*)
function sanearTextoFiltro(s){
  return String(s||'').replace(/[,()."*]/g, ' ').trim();
}

// Busca en el maestro completo de SKU (skus_busqueda: un renglón por SKU con su último conteo
// embebido, si existe) — antes buscaba solo en /conteos, así que un SKU nunca contado era
// invisible acá. "Contado"/"no contado" son valores especiales de Estado que no son columnas
// reales: se traducen a filtrar por si hay o no conteo_id.
// Columnas de skus_busqueda por las que se puede ordenar la tabla (clic en el encabezado) --
// "Fotos" queda afuera porque es un arreglo agregado, PostgREST no puede ordenar por su tamaño
// con un simple "order=".
const ORDEN_COLUMNAS_BUSQUEDA = new Set(['sku_code','batch','descripcion','bodega','cantidad_contada','estado','fuera_de_plan','fecha_conteo','ciclo_nombre','clase_abc']);
function construirOrdenBusqueda(){
  const o = state.busqueda.orden;
  if(o && o.campo && ORDEN_COLUMNAS_BUSQUEDA.has(o.campo)){
    const base = `${o.campo}.${o.dir}.nullslast`;
    return o.campo==='sku_code' ? base : `${base},sku_code.asc`;
  }
  return 'fecha_conteo.desc.nullslast,sku_code.asc';
}
function construirPathBusqueda(offset, limit=TAM_PAGINA_LISTA){
  let path = `/skus_busqueda?select=*&order=${construirOrdenBusqueda()}&limit=${limit}&offset=${offset}`;
  const texto = sanearTextoFiltro(state.busqueda.texto);
  // Además de código/descripción, también busca por batch y storage bin -- alguien que escribe
  // un lote o una ubicación física puntual en el buscador libre espera encontrarlo igual.
  if(texto) path += `&or=(sku_code.ilike.*${encodeURIComponent(texto)}*,descripcion.ilike.*${encodeURIComponent(texto)}*,batch.ilike.*${encodeURIComponent(texto)}*,storage_bin.ilike.*${encodeURIComponent(texto)}*)`;
  const bodega = sanearTextoFiltro(state.busqueda.bodega);
  if(bodega) path += `&bodega=ilike.*${encodeURIComponent(bodega)}*`;
  if(state.busqueda.estado === 'no_contado') path += `&conteo_id=is.null`;
  // "Pendiente de reconteo" (pedido de Joel): los mismos materiales que lista la pestaña Reconteo
  // (último conteo del período con diferencia y no descartado), como columna de skus_busqueda.
  else if(state.busqueda.estado === 'reconteo_pendiente') path += `&reconteo_pendiente=eq.true`;
  else if(state.busqueda.estado) path += `&estado=eq.${encodeURIComponent(state.busqueda.estado)}`;
  if(state.busqueda.ciclo === '__sin_ciclo__') path += `&ciclo_id=is.null&conteo_id=not.is.null`;
  else if(state.busqueda.ciclo) path += `&ciclo_id=eq.${encodeURIComponent(state.busqueda.ciclo)}`;
  if(state.busqueda.soloFueraDePlan) path += `&fuera_de_plan=eq.true`;
  if(state.busqueda.claseAbc === '__sin_clasificar__') path += `&clase_abc=is.null`;
  else if(state.busqueda.claseAbc) path += `&clase_abc=eq.${encodeURIComponent(state.busqueda.claseAbc)}`;
  // Rango de fechas de conteo (reemplaza al viejo "Contado hoy" fijo -- a pedido de Joel, ahora
  // se elige el rango): mismo patrón que exportarConteosExcel, se arma el instante real a partir
  // de la medianoche LOCAL de cada fecha (no un string con "Z" a la fuerza), para que el rango
  // coincida con el día calendario que la persona ve en su pantalla, sin importar el huso horario.
  // Cada extremo es independiente -- se puede filtrar solo desde, solo hasta, o ambos.
  const { desde, hasta } = instantesFiltroFechaBusqueda();
  if(desde) path += `&fecha_conteo=gte.${desde}`;
  if(hasta) path += `&fecha_conteo=lt.${hasta}`;
  // Filtro por responsable (ver irABuscarDelDia, "Ver lo contado" en Calendario): a diferencia de
  // filtroContadoPor (drill-down por NOMBRE sobre lo ya cargado en el cliente), este sí restringe
  // el pedido al servidor -- necesario para que un operador que llega desde Calendario vea solo lo
  // suyo sin que la respuesta traiga de más al resto de la empresa.
  if(state.busqueda.usuarioId) path += `&contado_por_id=eq.${encodeURIComponent(state.busqueda.usuarioId)}`;
  path += filtroGrupoBuscar();
  return path;
}

// Filtro por grupo de conteo curado a mano (ver Grupos de conteo) en Buscar. skus_busqueda no
// tiene una columna de grupo -- se resuelve con los pares código+bodega ya traídos de
// skus_grupos_conteo (state.busqueda.gruposPares, ver buscarConteos) armando un OR de pares
// exactos, igual mecánica que ya usa calcularVistaPreviaPlanGrupo. El grupo automático de
// Crítico NO pasa por acá -- se resuelve directo por la columna critico (critico=eq.true, sin join).
// El grupo elegido en el <select> de Buscar (ver gruposParaFiltroBuscar) -- null si no hay
// ninguno elegido, o si state.grupos.lista todavía no cargó ese id.
function grupoBuscarSeleccionado(){
  if(!state.busqueda.grupoId) return null;
  return (state.grupos.lista || []).find(g=>g.id===state.busqueda.grupoId) || null;
}

function filtroGrupoBuscar(){
  const grupo = grupoBuscarSeleccionado();
  if(!grupo) return '';
  // Automático (ej. "Críticos"): se resuelve directo por skus_busqueda.critico, sin pasar por
  // skus_grupos_conteo (ese grupo no tiene filas ahí). Reemplaza al viejo checkbox "Solo
  // críticos" de Buscar, que se quitó por redundante (pedido de Joel).
  if(grupo.automatico_critico) return '&critico=eq.true';
  const pares = state.busqueda.gruposPares || [];
  // Grupo sin materiales: ningún resultado puede coincidir -- se arma un filtro que nunca hace
  // match (en vez de mandar un "or=()" vacío, que PostgREST rechazaría) para no pedir de más.
  if(!pares.length) return '&sku_id=eq.00000000-0000-0000-0000-000000000000';
  const clausulas = pares.map(p=>
    p.bodega ? `and(sku_code.eq.${encodeURIComponent(p.sku_code)},bodega.eq.${encodeURIComponent(p.bodega)})`
              : `and(sku_code.eq.${encodeURIComponent(p.sku_code)},bodega.is.null)`
  );
  return `&or=(${clausulas.join(',')})`;
}

// Convierte el rango de fechas (calendario, string "YYYY-MM-DD") de Buscar en los instantes UTC
// exactos a partir de la medianoche LOCAL de cada fecha -- compartido entre construirPathBusqueda
// (filtra las filas) y construirParametrosBusquedaRpc (cuenta el total): ambos deben comparar
// exactamente el mismo instante, o el total mostrado no calzaría con las filas que trae la tabla.
// Convierte un rango de fechas (calendario, strings "YYYY-MM-DD") en los instantes UTC exactos a
// partir de la medianoche LOCAL de cada fecha -- usado por Buscar (construirPathBusqueda /
// construirParametrosBusquedaRpc) y por el resumen general del Dashboard
// (parametrosResumenGeneralSkus): todos deben comparar exactamente el mismo instante, o lo que
// muestran no calzaría entre sí.
function instantesFiltroFecha(fechaDesde, fechaHasta){
  const desde = fechaDesde ? new Date(fechaDesde+'T00:00:00').toISOString() : null;
  let hasta = null;
  if(fechaHasta){
    const siguienteDia = fechaISO(sumarDias(new Date(fechaHasta+'T00:00:00'), 1));
    hasta = new Date(siguienteDia+'T00:00:00').toISOString();
  }
  return { desde, hasta };
}
function instantesFiltroFechaBusqueda(){
  return instantesFiltroFecha(state.busqueda.fechaDesde, state.busqueda.fechaHasta);
}

// Parámetros para el RPC contar_busqueda_skus -- mismo contrato de filtros que construirPathBusqueda
// (ver esa función), pero como un count(*) directo contra skus (sin joins), mucho más rápido que
// pedirle a PostgREST el total exacto vía Prefer: count=exact/Content-Range cuando la búsqueda no
// tiene filtros (ver PR de optimización de Buscar para la medición).
function construirParametrosBusquedaRpc(){
  const { desde, hasta } = instantesFiltroFechaBusqueda();
  const grupo = grupoBuscarSeleccionado();
  return {
    p_texto: sanearTextoFiltro(state.busqueda.texto) || null,
    p_bodega: sanearTextoFiltro(state.busqueda.bodega) || null,
    p_estado: state.busqueda.estado || null,
    p_ciclo: state.busqueda.ciclo || null,
    p_solo_fuera_de_plan: !!state.busqueda.soloFueraDePlan,
    // El grupo automático de Crítico se resuelve como "solo críticos" (ver filtroGrupoBuscar) --
    // así el RPC del total usa el mismo camino, sin join.
    p_solo_criticos: !!(grupo && grupo.automatico_critico),
    p_clase_abc: state.busqueda.claseAbc || null,
    p_fecha_desde: desde,
    p_fecha_hasta: hasta,
    p_usuario_id: state.busqueda.usuarioId || null,
    p_grupo_id: (grupo && !grupo.automatico_critico) ? grupo.id : null,
  };
}

// "Solo con fotografías" no es una columna propia (fotos es un array agregado), así que
// se filtra en el cliente después de traer cada página.
function filtrarResultadosBusqueda(rows){
  if(!state.busqueda.soloConFotos) return rows;
  return rows.filter(r=> (r.fotos||[]).length>0);
}

// Salto directo a Buscar con un SKU puntual precargado (botones data-buscar-sku) para ver el
// historial completo de un material sin tener que copiar el código y escribirlo a mano. Limpia
// el resto de los filtros: si quedaran de una búsqueda
// anterior (ubicación, estado, ciclo, checkboxes), el material buscado podría no aparecer.
function irABuscarSku(skuCode){
  setState({
    view: 'buscar',
    busqueda: {
      texto: skuCode, bodega:'', estado:'', ciclo:'', soloConFotos:false, soloFueraDePlan:false, claseAbc:'', fechaDesde:'', fechaHasta:'', orden:null,
      resultados:[], buscando:true, yaBuscado:true, hayMas:false, buscandoMas:false, paginaOffset:0, busquedaPagina:0, filtroContadoPor:null, seleccionados:[],
      usuarioId:null, usuarioNombre:null, grupoId:'', gruposPares:[],
    },
  });
  buscarConteos();
}

// Salto directo a Buscar desde el detalle de un día en Calendario ("Ver lo contado" -- ver
// renderCalendario/bind()): admin ve todo lo contado ese día en la empresa; un operador ve solo
// lo suyo (usuarioId server-side, no el drill-down por nombre de filtroContadoPor, que solo filtra
// lo ya cargado en el cliente y traería de más a la empresa igual). Limpia el resto de los filtros
// por la misma razón que irABuscarSku.
function irABuscarDelDia(fecha){
  if(!fecha) return;
  const esAdmin = state.perfil && (state.perfil.rol==='admin' || state.perfil.es_super_admin);
  detenerEscaner();
  setState({
    view: 'buscar',
    busqueda: {
      texto:'', bodega:'', estado:'', ciclo:'', soloConFotos:false, soloFueraDePlan:false, claseAbc:'',
      fechaDesde: fecha, fechaHasta: fecha, orden:null,
      resultados:[], buscando:true, yaBuscado:true, hayMas:false, buscandoMas:false, paginaOffset:0, busquedaPagina:0, filtroContadoPor:null, seleccionados:[],
      usuarioId: esAdmin ? null : (state.perfil && state.perfil.id) || null,
      usuarioNombre: esAdmin ? null : (state.perfil && state.perfil.nombre) || null,
      grupoId:'', gruposPares:[],
    },
  });
  buscarConteos();
}

// Pide de entrada hasta TOPE_CARGA_TOTAL_BUSQUEDA filas (no solo TAM_PAGINA_LISTA) y, en paralelo,
// el total real vía el RPC contar_busqueda_skus -- un count(*) directo contra skus, mucho más
// rápido que pedirle a PostgREST el total exacto con Prefer: count=exact (que para una búsqueda sin
// filtro obliga a materializar y unir las 58 mil filas antes de poder aplicar el LIMIT). Si el
// total cabe bajo el tope, queda TODO cargado de una: el conteo de arriba y los gráficos (que se
// calculan sobre `resultados`) ya reflejan el total real, no solo lo primero cargado. Si el total
// supera el tope (una búsqueda ancha, sin filtro), se sigue paginando de a TAM_PAGINA_LISTA con
// "Siguiente"/buscarMasConteos, como antes.
async function buscarConteos(){
  try{
    // Filtro por grupo: primero se traen los pares código+bodega del grupo elegido (consulta
    // liviana e indexada por grupo_id, ver idx_skus_grupos_conteo_grupo) para armar el filtro
    // exacto en construirPathBusqueda/construirParametrosBusquedaRpc. Se guarda en el estado
    // (gruposPares) para que "cargar más" y exportar reutilicen el mismo snapshot sin volver a
    // pedirlo -- igual criterio que el resto de los filtros de Buscar.
    const grupoParaBuscar = grupoBuscarSeleccionado();
    state.busqueda.gruposPares = (grupoParaBuscar && !grupoParaBuscar.automatico_critico)
      ? (await rest(`/skus_grupos_conteo?grupo_id=eq.${encodeURIComponent(grupoParaBuscar.id)}&select=sku_code,bodega`) || [])
      : [];
    const [data, total] = await Promise.all([
      rest(construirPathBusqueda(0, TOPE_CARGA_TOTAL_BUSQUEDA)),
      rest('/rpc/contar_busqueda_skus', { method:'POST', body: construirParametrosBusquedaRpc() }),
    ]);
    const rows = data || [];
    const resultados = filtrarResultadosBusqueda(rows);
    setState({busqueda: {...state.busqueda, resultados, total, buscando:false, hayMas: total!=null ? rows.length<total : rows.length===TOPE_CARGA_TOTAL_BUSQUEDA, paginaOffset: rows.length, busquedaPagina:0}});
  }catch(e){
    setState({busqueda: {...state.busqueda, buscando:false}});
    toast(e.message,'err');
  }
}

async function buscarMasConteos(){
  if(state.busqueda.buscandoMas) return;
  state.busqueda.buscandoMas = true;
  render();
  try{
    const rows = await rest(construirPathBusqueda(state.busqueda.paginaOffset)) || [];
    state.busqueda.resultados = state.busqueda.resultados.concat(filtrarResultadosBusqueda(rows));
    state.busqueda.paginaOffset += rows.length;
    state.busqueda.hayMas = state.busqueda.total!=null ? state.busqueda.paginaOffset<state.busqueda.total : rows.length===TAM_PAGINA_LISTA;
  }catch(e){ toast(e.message,'err'); }
  state.busqueda.buscandoMas = false;
  render();
}

// Paginado de "Buscar" (Maestro de SKU), 15 filas por página, sobre tandas de TAM_PAGINA_LISTA
// del servidor: "Solo con fotografías" filtra en el cliente después de traer cada
// tanda, así que una sola tanda del servidor puede no alcanzar para completar la página pedida;
// por eso el while, no un solo llamado, sigue pidiendo tandas mientras falten filas y el
// servidor todavía tenga más (hayMas).
async function avanzarPaginaBuscar(){
  const siguiente = (state.busqueda.busquedaPagina||0) + 1;
  while(siguiente*TAM_PAGINA_BUSCAR >= state.busqueda.resultados.length && state.busqueda.hayMas){
    await buscarMasConteos();
  }
  setState({busqueda: {...state.busqueda, busquedaPagina: siguiente}});
}
function retrocederPaginaBuscar(){
  setState({busqueda: {...state.busqueda, busquedaPagina: Math.max(0, (state.busqueda.busquedaPagina||0)-1)}});
}

// Ordenar la tabla haciendo clic en un encabezado: ciclo de 3 estados por columna (asc -> desc ->
// sin ordenar/vuelve al orden por defecto), igual que la mayoría de las tablas ordenables. Es un
// cambio de ORDEN, no de filtro, pero de todas formas hay que volver a pedirle al servidor desde
// el principio (offset 0): el orden se aplica en la base, no sobre lo ya cargado en el cliente.
async function toggleOrdenBusqueda(campo){
  const actual = state.busqueda.orden;
  let orden;
  if(!actual || actual.campo!==campo) orden = {campo, dir:'asc'};
  else if(actual.dir==='asc') orden = {campo, dir:'desc'};
  else orden = null;
  setState({busqueda: {...state.busqueda, orden, resultados:[], hayMas:false, buscando:true, busquedaPagina:0, paginaOffset:0}});
  await buscarConteos();
}

// Filtro de la tabla de resultados al hacer clic en una porción/leyenda de "Quién contó" (ver
// renderBuscar). Un segundo clic sobre la misma persona quita el filtro (toggle).
function toggleFiltroContadoPor(nombre){
  setState({busqueda: {...state.busqueda, filtroContadoPor: state.busqueda.filtroContadoPor===nombre? null : nombre}});
}

// Exporta a Excel TODO lo que matchea los filtros actuales de Buscar, no solo lo ya cargado en
// pantalla -- pagina de a TAM_PAGINA_LISTA vía construirPathBusqueda (mismo path que usa la
// búsqueda), igual que buscarMasConteos, hasta agotar el servidor. Si hay un filtro de "Quién
// contó" activo (drill-down del gráfico), ese sí es solo sobre lo ya cargado -- ver su propio
// aviso en pantalla ("Primeros N cargados") -- así que ahí se exporta esa misma selección en vez
// de pedir todo de nuevo.
async function exportarBusquedaExcel(){
  const b = state.busqueda;
  setState({busqueda: {...state.busqueda, exportando:true}});
  try{
    let filas;
    if(b.filtroContadoPor){
      const quienConto = resumenQuienConto(b.resultados);
      const nombresFiltro = nombresParaFiltroContador(quienConto, b.filtroContadoPor);
      filas = b.resultados.filter(r=> r.conteo_id && nombresFiltro.includes(r.contado_por || 'Sin asignar'));
    }else{
      filas = [];
      let offset = 0, hayMas = true;
      while(hayMas){
        const rows = await rest(construirPathBusqueda(offset)) || [];
        filas = filas.concat(filtrarResultadosBusqueda(rows));
        hayMas = rows.length === TAM_PAGINA_LISTA;
        offset += rows.length;
      }
    }
    if(!filas.length){
      toast('No hay resultados para exportar','err');
      setState({busqueda: {...state.busqueda, exportando:false}});
      return;
    }
    const filasExcel = filas.map(r=>{
      const contado = !!r.conteo_id;
      const tieneDiferencia = contado && r.diferencia && Number(r.diferencia)!==0;
      const estadoTexto = !contado ? 'No contado'
        : tieneDiferencia ? `Con diferencia ${r.diferencia>0?'+':''}${r.diferencia}`
        : r.estado==='pendiente_revision' ? 'Pendiente'
        : r.estado==='aprobado' ? 'Cuadrado' : (r.estado || 'ok');
      return {
        'SKU': r.sku_code,
        'Crítico': r.critico ? 'Sí' : 'No',
        'Batch': r.batch,
        'Descripción': r.descripcion,
        'Ubicación general': r.bodega,
        'Cantidad contada': contado ? r.cantidad_contada : '',
        'Estado': estadoTexto,
        'Origen': contado ? (r.fuera_de_plan ? 'Fuera de plan' : 'Plan') : '',
        'Fecha de conteo': contado ? fmtFechaHora(r.fecha_conteo) : '',
        'Capturado sin conexión': contado && fueCapturadoOffline(r.capturado_en, r.fecha_conteo) ? fmtFechaHora(r.capturado_en) : '',
        'Ciclo': r.ciclo_nombre || '',
        'Fotos': (r.fotos||[]).length,
        'Clase ABC': r.clase_abc || '',
      };
    });
    const hoja = XLSX.utils.json_to_sheet(filasExcel);
    const libro = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(libro, hoja, 'Buscar');
    XLSX.writeFile(libro, `buscar_${fechaISO(new Date())}.xlsx`);
    toast(`${filas.length} resultado${filas.length===1?'':'s'} exportado${filas.length===1?'':'s'}`);
  }catch(e){ toast(e.message,'err'); }
  setState({busqueda: {...state.busqueda, exportando:false}});
}

function toggleSeleccionBusqueda(skuId){
  const actuales = state.busqueda.seleccionados||[];
  const seleccionados = actuales.includes(skuId) ? actuales.filter(id=>id!==skuId) : actuales.concat(skuId);
  setState({busqueda:{...state.busqueda, seleccionados}});
}
function toggleSeleccionTodosBusqueda(ids, marcar){
  const actuales = new Set(state.busqueda.seleccionados||[]);
  ids.forEach(id=> marcar ? actuales.add(id) : actuales.delete(id));
  setState({busqueda:{...state.busqueda, seleccionados:Array.from(actuales)}});
}

// Ficha imprimible de un resultado de Buscar: todo su detalle + la foto más reciente del conteo
// (si tiene) -- a pedido de Joel, para compartir en PDF un puñado de materiales puntuales (ej.
// evidencia para un reclamo) sin exportar todo Buscar. Respeta el conteo ciego (ver
// ocultarStockOperador) igual que la tabla en pantalla: un operador con conteo ciego activo no
// debe filtrarse la magnitud de la diferencia por esta vía tampoco.
function fichaBusquedaPDF(r, fotoUrl, ocultarMagnitud, rutaFoto){
  const contado = !!r.conteo_id;
  const tieneDiferencia = contado && r.diferencia && Number(r.diferencia)!==0;
  const estadoTexto = !contado ? 'No contado'
    : tieneDiferencia ? (ocultarMagnitud ? 'Con diferencia' : `Diferencia ${r.diferencia>0?'+':''}${r.diferencia}`)
    : r.estado==='pendiente_revision' ? 'Pendiente'
    : r.estado==='aprobado' ? 'Cuadrado' : (r.estado || 'ok');
  const filas = [
    ['Descripción', r.descripcion || '—'],
    ['Ubicación general', r.bodega || '—'],
    ['Ubicación específica', r.ubicacion || '—'],
    ['Storage bin', r.storage_bin || '—'],
    ['Batch', r.batch || '—'],
    ['Clase ABC', r.clase_abc || 'Sin clasificar'],
    // La etiqueta "Crítico" va en rojo cuando el material sí lo es, para que salte a la vista
    // en el PDF igual que el badge ★ Crítico ya lo hace en pantalla (ver criticoBadge()).
    ['Crítico', r.critico ? 'Sí' : 'No', r.critico],
    ['Cantidad contada', contado ? r.cantidad_contada : '—'],
    ['Estado', estadoTexto],
    ['Origen', contado ? (r.fuera_de_plan ? 'Fuera de plan' : 'Plan') : '—'],
    ['Fecha de conteo', contado ? fmtFechaHora(r.fecha_conteo) : '—'],
    ['Ciclo', r.ciclo_nombre || '—'],
    ['Observación', r.observacion || '—'],
  ];
  return `
    <div class="print-ficha">
      <div class="print-ficha-datos">
        <h2>${esc(r.sku_code)}</h2>
        <table>${filas.map(([k,v,destacar])=>`<tr><th${destacar?' style="color:var(--danger);font-weight:600"':''}>${esc(k)}</th><td>${esc(String(v))}</td></tr>`).join('')}</table>
      </div>
      <div class="print-ficha-foto">${fotoUrl? `<img src="${esc(fotoUrl)}"${rutaFoto? ` data-ruta-foto="${esc(rutaFoto)}"` : ''}>` : `<div class="print-sin-foto">Sin foto</div>`}</div>
    </div>
  `;
}

// Foto para el PDF de Buscar. Primero pide a Supabase la versión reducida (Image
// Transformations: ~30 KB por foto, la transforma el servidor); si eso falla (proyecto sin la
// función, cuota restringida), firma la original y la reduce en el navegador; y si tampoco se
// puede, va la original. Devuelve {url, ruta}: `ruta` permite reintentar en el navegador si la
// imagen transformada falla recién al cargarse (ver esperarFotosDelPDF).
const FOTO_PDF_TRANSFORM = {width:FOTO_PDF_LADO_PX, height:FOTO_PDF_LADO_PX, resize:'cover', quality:70};
async function resolverFotoParaPDF(rutaFoto){
  try{ return { url: await crearUrlFirmada(rutaFoto, FOTO_PDF_TRANSFORM), ruta: rutaFoto }; }
  catch(e){ /* sin transform: sigue abajo */ }
  return { url: await fotoReducidaEnNavegadorOOriginal(rutaFoto), ruta: null };
}
async function fotoReducidaEnNavegadorOOriginal(rutaFoto){
  const original = await crearUrlFirmada(rutaFoto);
  return (await reducirFotoEnNavegador(original)) || original;
}

// Corre `fn` sobre `items` de a `limite` a la vez, conservando el orden de los resultados. Para
// el PDF de Buscar: con 100+ fotos, lanzarlas todas juntas (Promise.all) saturaba la conexión y
// la memoria del navegador (cada original son 3-5 MB y 12 MP decodificados) y la pestaña se
// quedaba pegada. `alAvanzar(hechos, total)` se llama cada vez que termina una.
async function mapConcurrente(items, limite, fn, alAvanzar){
  const resultados = new Array(items.length);
  let siguiente = 0, hechos = 0;
  async function obrero(){
    while(siguiente < items.length){
      const i = siguiente++;
      resultados[i] = await fn(items[i], i);
      hechos++;
      if(alAvanzar) alAvanzar(hechos, items.length);
    }
  }
  await Promise.all(Array.from({length: Math.min(limite, items.length)}, obrero));
  return resultados;
}
const FOTOS_PDF_EN_PARALELO = 4;

function textoProgresoExportPDF(hechos, total){
  return `<span class="spinner"></span> Generando… foto ${hechos} de ${total}`;
}
function mostrarProgresoExportPDF(hechos, total){
  // Directo al botón, sin setState: re-renderizar toda la vista de Buscar por cada foto
  // (100+ veces) sería más caro que el propio PDF.
  const btn = document.getElementById('btn-exportar-buscar-pdf');
  if(btn) btn.innerHTML = textoProgresoExportPDF(hechos, total);
}

// Espera a que las fotos del contenedor de impresión terminen de descargar (la URL firmada ya
// está lista, pero el navegador aún debe traer los bytes) para que no salgan en blanco al
// imprimir. Si una foto transformada por Supabase falla al cargarse (p. ej. la cuota de Image
// Transformations quedó restringida), la reemplaza por la versión reducida en el navegador.
async function esperarFotosDelPDF(contenedor){
  const imgs = Array.from(contenedor.querySelectorAll('img'));
  await mapConcurrente(imgs, FOTOS_PDF_EN_PARALELO, img => new Promise(resolve=>{
    const listo = ()=> resolve();
    const fallo = async ()=>{
      const ruta = img.getAttribute('data-ruta-foto');
      if(!ruta){ resolve(); return; }
      img.removeAttribute('data-ruta-foto');
      try{
        img.src = await fotoReducidaEnNavegadorOOriginal(ruta);
        if(img.complete && img.naturalWidth) resolve();
        else { img.addEventListener('load', listo, {once:true}); img.addEventListener('error', listo, {once:true}); }
      }catch(e){ resolve(); }
    };
    if(img.complete && img.naturalWidth){ resolve(); return; }
    if(img.complete && img.src && !img.naturalWidth && typeof img.naturalWidth==='number'){ fallo(); return; }
    img.addEventListener('load', listo, {once:true});
    img.addEventListener('error', fallo, {once:true});
  }));
}

async function exportarSeleccionadosBusquedaPDF(){
  const ids = state.busqueda.seleccionados||[];
  if(!ids.length) return;
  const filas = state.busqueda.resultados.filter(r=> ids.includes(r.sku_id));
  setState({busqueda:{...state.busqueda, exportandoPdf:true}});
  try{
    const ocultar = ocultarStockOperador();
    const fichas = await mapConcurrente(filas, FOTOS_PDF_EN_PARALELO, async r=>{
      const foto = (r.fotos||[])[0];
      let fotoPdf = null;
      if(foto){
        // Las fotos originales pesan varios MB (resolución de cámara) para un recuadro de
        // 130x130px en el PDF: ver resolverFotoParaPDF para el orden de alternativas.
        try{ fotoPdf = await resolverFotoParaPDF(foto.foto_url); }
        catch(e){ /* sigue sin foto si falla la firma */ }
      }
      return fichaBusquedaPDF(r, fotoPdf ? fotoPdf.url : null, ocultar, fotoPdf ? fotoPdf.ruta : null);
    }, mostrarProgresoExportPDF);
    document.getElementById('print-informe').innerHTML = '';
    document.getElementById('print-plan').innerHTML = '';
    const contenedor = document.getElementById('print-buscar');
    // Salto de página cada 3 fichas -- así entran exactamente 3 materiales por hoja,
    // en vez de dejar que el navegador corte donde le quede según sus márgenes. La primera
    // hoja lleva además el título ("Detalle de materiales" + el resumen de cuántos materiales
    // son), que ocupa el espacio de una ficha más -- por eso ahí el corte va después de la
    // segunda ficha, no de la tercera, o si no la 3ª ficha se corría sola a la hoja 2 dejándola
    // casi vacía y desfasando el conteo de 3 por hoja en el resto del documento.
    const FICHAS_POR_HOJA = 3;
    const FICHAS_PRIMERA_HOJA = 2;
    const fichasConSaltos = fichas.map((f,i)=>{
      const esInicioDeHoja = i===FICHAS_PRIMERA_HOJA || (i>FICHAS_PRIMERA_HOJA && (i-FICHAS_PRIMERA_HOJA)%FICHAS_POR_HOJA===0);
      return esInicioDeHoja ? `<div class="pdf-salto-pagina"></div>${f}` : f;
    }).join('');
    contenedor.innerHTML = `
      <h1>Detalle de materiales</h1>
      <div class="print-meta">${fichas.length} material${fichas.length===1?'':'es'} · Generado ${new Date().toLocaleString('es-CL')}</div>
      ${fichasConSaltos}
    `;
    await esperarFotosDelPDF(contenedor);
    window.print();
  }catch(e){ toast(e.message,'err'); }
  setState({busqueda:{...state.busqueda, exportandoPdf:false}});
}

// Exporta a Excel los conteos de una fecha o rango de fechas (vista conteos_exportables: un
// renglón por conteo, no deduplicado por SKU, con el detalle del maestro y el resultado) — para
// poder cargarlos a un ERP. Pagina de a 1000 filas vía Range (mismo patrón que skusDeUbicacion)
// para no chocar con el límite de fila de PostgREST si el rango trae muchos conteos.
async function exportarConteosExcel(){
  const {desde, hasta} = state.exportConteos;
  if(!desde){ toast('Elige al menos la fecha "Desde"','err'); return; }
  const hastaReal = hasta || desde;
  if(hastaReal < desde){ toast('"Hasta" no puede ser anterior a "Desde"','err'); return; }
  setState({exportConteos: {...state.exportConteos, exportando:true}});
  try{
    // Se construye el instante real (no un string con "Z" a la fuerza) a partir de la
    // medianoche LOCAL de cada fecha elegida, para que el rango coincida con el día calendario
    // que la persona ve en su pantalla, sin importar en qué huso horario esté.
    const desdeInstante = new Date(desde+'T00:00:00').toISOString();
    const siguienteDia = fechaISO(sumarDias(new Date(hastaReal+'T00:00:00'), 1));
    const hastaInstante = new Date(siguienteDia+'T00:00:00').toISOString();
    const filtro = `/conteos_exportables?select=*&fecha_conteo=gte.${desdeInstante}&fecha_conteo=lt.${hastaInstante}&order=fecha_conteo.asc`;
    const TAM_PAGINA = 1000;
    let inicio = 0, total = Infinity, filas = [];
    while(inicio < total){
      const res = await fetch(`${SUPABASE_URL}/rest/v1${filtro}`, {
        headers:{
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
          'Range-Unit': 'items',
          'Range': `${inicio}-${inicio+TAM_PAGINA-1}`,
          'Prefer': 'count=exact',
        }
      });
      const texto = await res.text();
      const data = texto ? JSON.parse(texto) : [];
      if(!res.ok){ throw new Error((data && data.message) || res.statusText || 'Error de base de datos'); }
      filas = filas.concat(data);
      const range = res.headers.get('content-range');
      total = range && range.includes('/') ? Number(range.split('/')[1]) : filas.length;
      inicio += TAM_PAGINA;
    }
    if(!filas.length){
      toast('No hay conteos en ese rango de fechas','err');
      setState({exportConteos: {...state.exportConteos, exportando:false}});
      return;
    }
    const filasExcel = filas.map(f=>({
      'SKU': f.sku_code,
      'Descripción': f.descripcion,
      'Batch': f.batch,
      'Categoría': f.categoria,
      'Unidad de medida': f.unidad_medida,
      'Código de barras': f.codigo_barras,
      'Bodega (maestro)': f.bodega_maestro,
      'Ubicación (maestro)': f.ubicacion_maestro,
      'Storage bin': f.storage_bin,
      'Bodega contada': f.bodega_contada,
      'Ubicación contada': f.ubicacion_contada,
      'Ubicación distinta': f.ubicacion_distinta ? 'Sí' : 'No',
      'Stock sistema': f.stock_sistema,
      'Cantidad contada': f.cantidad_contada,
      'Diferencia': f.diferencia,
      'Costo unitario': f.costo_unitario,
      'Valor diferencia': f.valor_diferencia,
      'Estado': f.estado,
      'Fuera de plan': f.fuera_de_plan ? 'Sí' : 'No',
      'Observación': f.observacion,
      'Responsable': f.responsable,
      'Ciclo': f.ciclo_nombre,
      'Fecha de conteo': fmtFechaHora(f.fecha_conteo),
      'Capturado sin conexión': fueCapturadoOffline(f.capturado_en, f.fecha_conteo) ? fmtFechaHora(f.capturado_en) : '',
    }));
    const hoja = XLSX.utils.json_to_sheet(filasExcel);
    const libro = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(libro, hoja, 'Conteos');
    const nombreArchivo = desde===hastaReal ? `conteos_${desde}.xlsx` : `conteos_${desde}_a_${hastaReal}.xlsx`;
    XLSX.writeFile(libro, nombreArchivo);
    toast(`${filas.length} conteo${filas.length===1?'':'s'} exportado${filas.length===1?'':'s'}`);
  }catch(e){ toast(e.message,'err'); }
  setState({exportConteos: {...state.exportConteos, exportando:false}});
}

// Materiales cuyo último conteo no cuadra con el stock de sistema (ver vista reconteo_pendiente).
// Filtro de semana del gráfico de Reconteo (ver renderReconteo / elegirSemanaReconteo): la
// semana va de lunes 00:00 local a lunes siguiente 00:00 local, mandada al servidor como
// instantes (mismo criterio que instantesFiltroFecha en Buscar), sobre la fecha del último
// conteo -- la misma columna que agrupa reconteo_pendiente_por_semana.
function filtroSemanaReconteo(){
  const semana = state.reconteoSemana;
  if(!semana) return '';
  const desde = new Date(semana+'T00:00:00');
  const hasta = sumarDias(desde, 7);
  return `&ultimo_conteo_fecha=gte.${encodeURIComponent(desde.toISOString())}&ultimo_conteo_fecha=lt.${encodeURIComponent(hasta.toISOString())}`;
}

// Buscador de Reconteo (pedido de Joel: "para que sea más fácil encontrarlo y ejecutarlo"):
// filtra la lista de pendientes en el SERVIDOR por código o descripción del SKU, no sobre lo ya
// cargado -- así encuentra el material aunque esté en la página 10 de "Cargar más". Se combina
// con el filtro de semana. Mismo criterio de coincidencia parcial que el buscador de Contar/Buscar.
// Se quitan coma, paréntesis y comillas: son la sintaxis de or=(...) de PostgREST y romperían el
// filtro; un código de SKU no los lleva.
function filtroTextoReconteo(){
  const t = (state.reconteoTexto||'').trim().replace(/[,()"]/g,'');
  if(!t) return '';
  const p = encodeURIComponent('*'+t+'*');
  return `&or=(sku_code.ilike.${p},descripcion.ilike.${p})`;
}

// Fija el texto del buscador y vuelve a pedir la primera página. Con texto vacío limpia la búsqueda.
function buscarReconteo(texto){
  setState({reconteoTexto: (texto||'').trim(), reconteos: [], reconteosHayMas:false});
  return cargarReconteos();
}

async function cargarReconteos(){
  try{
    // El resumen por semana (pedido de Joel: gráfico "32S, 33S…" antes de la tabla) va en
    // paralelo con la primera página; es una consulta de agregación sobre la misma vista (~60 ms
    // con datos reales), en la zona horaria del navegador para que calce con filtroSemanaReconteo.
    const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || 'America/Santiago';
    const [rows, semanas] = await Promise.all([
      rest(`/reconteo_pendiente?select=*&order=ultimo_conteo_fecha.desc&limit=${TAM_PAGINA_LISTA}${filtroSemanaReconteo()}${filtroTextoReconteo()}`),
      rest('/rpc/reconteo_pendiente_por_semana', {method:'POST', body:{p_tz: tz}}).catch(()=>null),
    ]);
    const porSemana = Array.isArray(semanas) ? semanas.map(f=>({semana:f.semana, pendientes:Number(f.pendientes)||0})) : state.reconteosPorSemana;
    // Si la semana elegida se queda sin pendientes (se descartó o recontó el último), la vista
    // se QUEDA en esa semana mostrando "No quedan pendientes en esta semana" y el botón para
    // volver a todas -- reportado por Joel: antes saltaba sola a "todas las semanas" y parecía que
    // Descartar no había hecho nada (o que aparecían pendientes nuevos de golpe).
    setState({reconteos: rows||[], reconteosHayMas: (rows||[]).length === TAM_PAGINA_LISTA, reconteosPorSemana: porSemana});
  }catch(e){ /* silencioso */ }
}

// Tocar una barra del gráfico de Reconteo: filtra la tabla a esa semana (o vuelve a todas si
// se toca la misma). Vuelve a pedir la primera página con el filtro.
function elegirSemanaReconteo(semana){
  const nueva = (!semana || state.reconteoSemana===semana) ? null : semana;
  setState({reconteoSemana: nueva, reconteos: [], reconteosHayMas:false});
  cargarReconteos();
}

async function cargarMasReconteos(){
  if(state.reconteosCargandoMas) return;
  state.reconteosCargandoMas = true;
  render();
  try{
    const rows = await rest(`/reconteo_pendiente?select=*&order=ultimo_conteo_fecha.desc&limit=${TAM_PAGINA_LISTA}&offset=${state.reconteos.length}${filtroSemanaReconteo()}${filtroTextoReconteo()}`);
    state.reconteos = state.reconteos.concat(rows||[]);
    state.reconteosHayMas = (rows||[]).length === TAM_PAGINA_LISTA;
  }catch(e){ toast(e.message,'err'); }
  state.reconteosCargandoMas = false;
  render();
}

// Descartar un reconteo pendiente sin recontar (solo admin) -- para cuando el problema era un
// error en el dato maestro (ej. stock mal ingresado) y no algo que requiera verificación física.
// Ver descartar_reconteo (RPC), que valida el rol en el servidor y deja motivo/autor/fecha en conteos.
async function descartarReconteo(){
  const m = state.descartarReconteoModal;
  if(!m || m.guardando) return;
  const motivo = (m.motivo||'').trim();
  if(!motivo){ toast('Indica un motivo','err'); return; }
  setState({descartarReconteoModal:{...m, guardando:true}});
  try{
    await rest('/rpc/descartar_reconteo', {method:'POST', body:{p_conteo_id: m.conteoId, p_motivo: motivo}});
    setState({descartarReconteoModal:null});
    toast('Reconteo descartado', 'ok');
    cargarReconteos();
  }catch(e){
    setState({descartarReconteoModal:{...state.descartarReconteoModal, guardando:false}});
    toast(e.message, 'err');
  }
}

   ======================================================================= */
// Catálogo de ubicaciones + cuántos materiales hay hoy en cada bodega (para avisar antes de
// desactivar o renombrar una que está en uso).
async function cargarUbicaciones(){
  if(!(state.perfil && state.perfil.rol==='admin')) return;
  setState({ubicaciones:{...state.ubicaciones, cargando:true}});
  try{
    const [lista, conMateriales] = await Promise.all([
      rest('/ubicaciones?select=id,bodega,ubicacion,activo&order=bodega.asc,ubicacion.asc'),
      rest('/ubicaciones_generales?select=bodega,cantidad_skus'),
    ]);
    const materialesPorBodega = {};
    (conMateriales||[]).forEach(f=>{ if(f.bodega) materialesPorBodega[f.bodega] = Number(f.cantidad_skus)||0; });
    setState({ubicaciones:{...state.ubicaciones, lista: lista||[], materialesPorBodega, cargado:true, cargando:false}});
  }catch(e){
    setState({ubicaciones:{...state.ubicaciones, cargando:false}});
    toast(e.message,'err');
  }
}

async function crearUbicacion(bodega, ubicacion, {silencioso=false}={}){
  const b = (bodega||'').trim(), u = (ubicacion||'').trim() || null;
  if(!b){ toast('Indica el nombre de la bodega','err'); return false; }
  try{
    await rest('/ubicaciones', {method:'POST', body:[{empresa_id: state.perfil.empresa_id, bodega:b, ubicacion:u}], prefer:'return=minimal'});
    await cargarUbicaciones();
    invalidarCacheAgregados(['generales']);
    refrescarSiCargada(['generales']);
    if(!silencioso) toast(u ? `${u} agregada a ${b}` : `Bodega ${b} creada`);
    return true;
  }catch(e){
    // El índice único cubre (empresa, bodega, ubicación): repetir un sitio no es un error del
    // servidor que haya que mostrar en crudo.
    toast(/ubicaciones_empresa_sitio_key/i.test(e.message) ? `${u||b} ya existe` : e.message, 'err');
    return false;
  }
}

async function alternarActivoUbicacion(id, activo){
  try{
    await rest(`/ubicaciones?id=eq.${encodeURIComponent(id)}`, {method:'PATCH', body:{activo}, prefer:'return=minimal'});
    await cargarUbicaciones();
  }catch(e){ toast(e.message,'err'); }
}

// Renombrar una bodega toca seis tablas; la grande es skus. Medido en Escondida: renombrar B501
// son 59.822 materiales y 10,2 s en una sola sentencia, sobre el límite de 8 s del servidor. Va
// por lotes con avance visible, igual que la apertura de bodega.
const RENOMBRAR_UBICACION_LOTE = 2000;
async function renombrarUbicacionGeneral(desde, hasta){
  const d = (desde||'').trim(), h = (hasta||'').trim();
  if(!h){ toast('Indica el nombre nuevo','err'); return false; }
  if(d===h){ setState({ubicaciones:{...state.ubicaciones, renombrando:null}}); return true; }
  let hechos = 0, vueltas = 0;
  setState({ubicaciones:{...state.ubicaciones, renombrando:{desde:d, hasta:h, hechos:0, trabajando:true}}});
  try{
    while(vueltas++ < 500){
      const r = await rest('/rpc/renombrar_ubicacion_general', {method:'POST', body:{p_desde:d, p_hasta:h, p_limite:RENOMBRAR_UBICACION_LOTE}, timeoutMs:60000});
      hechos += Number(r && r.actualizados) || 0;
      const quedan = Number(r && r.restantes) || 0;
      setState({ubicaciones:{...state.ubicaciones, renombrando:{desde:d, hasta:h, hechos, quedan, trabajando:true}}});
      if(r && r.terminado) break;
    }
    setState({ubicaciones:{...state.ubicaciones, renombrando:null}});
    await cargarUbicaciones();
    // La bodega aparece en el maestro, en los selectores de planificación y en el Dashboard.
    invalidarCacheAgregados(['generales','sinUbicacion','opcionesSku']);
    refrescarSiCargada(['generales','sinUbicacion','opcionesSku','skusPagina','dashboard']);
    cargarSkus();

// ¿Este nombre ya está en el catálogo? Se usa antes de guardar un material para no dejar entrar
// un sitio nuevo por un dedazo sin que nadie se dé cuenta.
function ubicacionConocida(bodega, ubicacion){
  const b = (bodega||'').trim(), u = (ubicacion||'').trim();
  const lista = state.ubicaciones.lista || [];
  // Si el catálogo todavía no se cargó (o falló), no se estorba: mejor dejar guardar que inventar
  // un aviso sobre algo que no sabemos.
  if(!state.ubicaciones.cargado) return true;
  if(!b) return true; // sin bodega es un caso válido y ya existente (materiales sin ubicación)
  const bodegaOk = lista.some(x=> x.bodega===b);
  if(!bodegaOk) return false;
  if(!u) return true;
  return lista.some(x=> x.bodega===b && x.ubicacion===u);
}

// Buscador de SKU para una línea de ingreso o salida: mismo criterio parcial que Contar, en el
// servidor. Trae el stock actual para validar la salida antes de mandarla.
let bodegaBusquedaSecuencia = 0;
async function buscarSkuBodega(texto){
  const t = sanearTextoFiltro(texto);
  const seq = ++bodegaBusquedaSecuencia;
  state.bodega.busqueda = {texto, resultados: t.length>=2 ? state.bodega.busqueda.resultados : [], buscando: t.length>=2, error:null};
  render();
  if(t.length<2) return;
  try{
    const rows = await rest(`/skus_lectura?activo=eq.true&select=id,sku_code,descripcion,bodega,ubicacion,storage_bin,batch,stock_sistema,unidad_medida,costo_unitario,tipo_material&or=(sku_code.ilike.*${encodeURIComponent(t)}*,descripcion.ilike.*${encodeURIComponent(t)}*)&order=sku_code.asc&limit=8`) || [];
    if(seq!==bodegaBusquedaSecuencia) return;
    state.bodega.busqueda = {texto, resultados: rows, buscando:false, error:null};
    render();
  }catch(e){
    // Antes se tragaba el error y la pantalla decía "Sin resultados": un fallo del servidor
    // (por ejemplo una columna que la vista no expone) parecía que el material no existía.
    if(seq!==bodegaBusquedaSecuencia) return;
    state.bodega.busqueda = {texto, resultados: [], buscando:false, error: pareceFalloDeRed(e) ? 'Sin conexión: no se pudo buscar.' : e.message};
    render();
  }
}

// propio ingreso le pone el saldo, así el kardex parte del primer movimiento y no de un maestro.
async function crearSkuDesdeIngreso(){
  const n = state.bodega.nuevoSku;
  if(!n || n.guardando) return false;
  const codigo = (n.sku_code||'').trim().toUpperCase();
  const descripcion = (n.descripcion||'').trim();
  if(!codigo){ toast('Indica el código del material','err'); return false; }
  if(!descripcion){ toast('Indica la descripción','err'); return false; }
  state.bodega.nuevoSku = {...n, sku_code: codigo, descripcion, guardando:true}; render();
  const fila = { sku_code: codigo, descripcion, unidad_medida: (n.unidad_medida||'UN').trim().toUpperCase() || 'UN', bodega: (n.bodega||'').trim() || null, storage_bin: (n.storage_bin||'').trim() || null, tipo_material: (n.tipo_material||'').trim() || null, stock_sistema: 0, activo: true, empresa_id: state.perfil.empresa_id, capturado_en: new Date().toISOString() };
  try{
    const rows = await rest('/skus?select=id,sku_code,descripcion,bodega,ubicacion,storage_bin,batch,stock_sistema,unidad_medida,costo_unitario,tipo_material', {method:'POST', body:[fila], prefer:'return=representation'});
    const sku = (rows||[])[0];
    if(!sku) throw new Error('El servidor no devolvió el SKU creado');
    state.bodega.nuevoSku = null;
    state.bodega.busqueda = {texto: sku.sku_code, resultados:[sku], buscando:false};
    refrescarListaSkus();
    render();
    toast(`SKU ${sku.sku_code} creado. Indica la cantidad que ingresa.`, 'ok');
    return true;
  }catch(e){
    state.bodega.nuevoSku = {...state.bodega.nuevoSku, guardando:false}; render();
    toast(pareceFalloDeRed(e) ? 'Sin conexión: el SKU nuevo se crea cuando vuelva la señal. Puedes registrar el resto del ingreso.' : (esErrorCodigoSkuDuplicado(e) ? `El código ${codigo} ya existe: búscalo arriba.` : e.message), 'err');
    return false;
  }
}

function agregarLineaBodega(sku, cantidad){

  if(!sku || !(n>0)){ toast('Indica una cantidad mayor a 0','err'); return false; }

    toast(`Stock insuficiente: hay ${sku.stock_sistema} de ${sku.sku_code}. Si el material está físicamente, cuéntalo primero para ajustar el stock.`,'err');
    return false;
  }
  const lineas = state.bodega.doc.lineas.filter(l=>l.sku_id!==sku.id);
  // El costo del maestro viene como sugerencia editable; si el material no tiene, queda vacío.
  // Lo que quede en esa casilla al registrar el ingreso pasa a ser el costo del material (manda la
  // última compra), así que se muestra el actual para que la persona vea qué está confirmando.
  lineas.push({sku_id: sku.id, sku_code: sku.sku_code, descripcion: sku.descripcion, storage_bin: sku.storage_bin, batch: sku.batch, unidad_medida: sku.unidad_medida, cantidad: n, stock_sistema: sku.stock_sistema, costo_unitario: sku.costo_unitario!=null ? Number(sku.costo_unitario) : null});
  state.bodega.doc.lineas = lineas;

  render();
  return true;
}

// Guarda el documento (ingreso o salida). Con conexión: RPC registrar_documento_bodega y luego
// las fotos. Sin conexión: a la cola sin conexión con las fotos en IndexedDB, igual que un conteo.
async function registrarDocumentoBodega(tipo){
  const d = state.bodega.doc;
  if(!perfilCargado()) return;
  if(!d.lineas.length){ toast('Agrega al menos un material','err'); return; }
  if(tipo==='ingreso' && !d.numeroGuia.trim()){ toast('La guía de despacho es obligatoria','err'); return; }
  if(tipo==='ingreso' && !d.fotoGuia){ toast('Toma la foto de la guía de despacho','err'); return; }
  if(tipo==='salida' && !d.retiradoPorId){ toast('Indica quién retira','err'); return; }
  await esperarFotosEnProceso();
  const idempotencyKey = crypto.randomUUID();
  const payload = {
    p_tipo: tipo, p_lineas: d.lineas.map(l=>({sku_id:l.sku_id, cantidad:l.cantidad, costo_unitario:l.costo_unitario!=null?l.costo_unitario:null})), p_fecha: fechaISO(new Date()),
    p_proveedor_id: d.proveedorId||null, p_numero_oc: d.numeroOc.trim()||null, p_numero_guia: d.numeroGuia.trim()||null,
    p_retirado_por_id: d.retiradoPorId||null, p_despachado_por_id: d.despachadoPorId||null, p_destino: d.destino.trim()||null,
    p_observacion: d.observacion.trim()||null, p_idempotency_key: idempotencyKey,
  };
  const fotos = [d.fotoGuia ? {tipo:'guia', file:d.fotoGuia.file} : null, ...d.fotosMaterial.map(f=>({tipo:'material', file:f.file}))].filter(Boolean);
  setState({bodega: {...state.bodega, guardando:true}});
  try{
    const res = await rest('/rpc/registrar_documento_bodega', {method:'POST', body: payload, timeoutMs: UMBRAL_ABORTAR_GUARDADO_MS});
    const doc = res && res.documento;
    if(doc && fotos.length) await subirFotosDocumentoBodega(doc.id, fotos);
    const pendientes = (res && res.movimientos || []).filter(m=>m.estado!=='aprobado').length;
    state.bodega.doc = documentoBodegaVacio();
    state.bodega.ultimoDocumento = doc;
    refrescarBodega();
    invalidarCacheAgregados(['generales','sinUbicacion']);
    setState({bodega: {...state.bodega, guardando:false}});
    toast(pendientes ? `${doc.numero} guardado; ${pendientes} línea${pendientes===1?'':'s'} queda${pendientes===1?'':'n'} pendiente${pendientes===1?'':'s'} de revisión` : `${doc.numero} guardado`);
  }catch(e){
    if(pareceFalloDeRed(e) && planIncluye('offline_habilitado')){
      // Sin conexión: se guarda con el saldo que se ve ahora (saldo_local) para que el servidor
      // decida al sincronizar (caso C del diseño). Las fotos van a IndexedDB.
      payload.p_lineas = d.lineas.map(l=>({sku_id:l.sku_id, cantidad:l.cantidad, costo_unitario:l.costo_unitario!=null?l.costo_unitario:null, saldo_local: l.stock_sistema!=null ? Number(l.stock_sistema) : null}));
      const item = encolarAccionOffline('documento_bodega', {payload, empresa_id: state.perfil.empresa_id, resumen: `${tipo==='ingreso'?'Ingreso':'Salida'} de ${d.lineas.length} material${d.lineas.length===1?'':'es'}`, idempotency_key: idempotencyKey});
      try{ await guardarFotosOffline(item.id, fotos.map(f=> new File([f.file], `${f.tipo}-${f.file.name||'foto.jpg'}`, {type: f.file.type||'image/jpeg'}))); }catch(err){ /* sin IndexedDB: se guarda sin fotos */ }
      state.bodega.doc = documentoBodegaVacio();
      setState({bodega: {...state.bodega, guardando:false}});
      toast('Sin conexión: el documento quedó guardado y se sincroniza solo cuando vuelva la señal', 'warn');
      return;
    }
    setState({bodega: {...state.bodega, guardando:false}});
    toast(e.message,'err');
  }
}

async function subirFotosDocumentoBodega(documentoId, fotos){
  const filas = [];
  for(let i=0;i<fotos.length;i++){
    const f = fotos[i];
    const ext = ((f.file.name||'').split('.').pop()||'jpg').toLowerCase();
    const ruta = `${state.perfil.empresa_id}/bodega/${documentoId}/${f.tipo}-${i}.${ext}`;
    filas.push({documento_id: documentoId, empresa_id: state.perfil.empresa_id, tipo: f.tipo, foto_url: await storageUpload(ruta, f.file)});
  }
  if(filas.length) await rest('/movimiento_fotos', {method:'POST', body: filas, prefer:'return=minimal'});
}

    ]);
    setState({bodega:{...state.bodega, valorizacion: valorizacion || state.bodega.valorizacion, reportes:{...state.bodega.reportes, consumo: consumo||[], ingresos: ingresos||[], cargando:false, cargado:true}}});

// Costo unitario del material (solo admin). Cada ingreso con costo pisa este valor -- manda la
// última compra, decisión de Joel --, pero hay casos en que la última compra no es el costo que
// se quiere valorizar: una compra de urgencia cara, un flete cargado por error, un precio de
// lista que llegó mal en la guía. Por eso se puede corregir a mano acá.
async function guardarCostoUnitario(skuId, valor){
  const txt = String(valor==null?'':valor).trim();
  const costo = txt==='' ? null : Number(txt);
  if(costo!==null && (isNaN(costo) || costo < 0)){ toast('El costo debe ser 0 o más','err'); return; }
  try{
    await rest(`/skus?id=eq.${encodeURIComponent(skuId)}`, {method:'PATCH', body:{costo_unitario: costo}, prefer:'return=minimal'});
    const stock = state.bodega.stock.map(r=> r.sku_id===skuId ? {...r, costo_unitario: costo, valor: costo==null?null:Number(r.stock)*costo} : r);
    setState({bodega:{...state.bodega, stock}});
    cargarValorizacionBodega(); // el total valorizado y "materiales sin costo" cambian con esto
    toast(costo===null ? 'Costo quitado' : `Costo guardado en $${Math.round(costo).toLocaleString('es-CL')}`);
  }catch(e){ toast(e.message,'err'); }
}
