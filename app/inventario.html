function renderDocumentoBodega(tipo){
  const b = state.bodega; const d = b.doc; const q = b.busqueda;
  const esIngreso = tipo==='ingreso';
  const proveedores = b.proveedores.filter(p=>p.activo);
  const personas = b.personas.filter(p=>p.activo);
  const usuarios = (state.plan && state.plan.responsables) || [];
  const totalLineas = d.lineas.reduce((s,l)=>s+l.cantidad, 0);
  // Monto del ingreso: costo unitario por línea (opcional). El total del documento es la suma de
  // las líneas que lo tengan; se avisa si alguna quedó sin costo para que el total no engañe.
  const totalMonto = d.lineas.reduce((s,l)=> s + (l.costo_unitario!=null ? l.cantidad*Number(l.costo_unitario) : 0), 0);
  const lineasSinCosto = d.lineas.filter(l=> l.costo_unitario==null).length;
  return `
    <div class="section-head"><div><span class="eyebrow">Bodega</span><h2>${esIngreso?'Ingreso de material':'Salida de material'}</h2></div></div>
    ${b.ultimoDocumento ? `<div class="card" style="margin-bottom:12px;border-color:var(--ok)"><div class="hint" style="margin:0">Último documento guardado: <strong>${esc(b.ultimoDocumento.numero)}</strong>. <button type="button" class="link-btn" data-ir-vista="movimientos">Ver movimientos</button></div></div>` : ''}
    <div class="card">
      <label for="bd-sku">Material (código o descripción)</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="text" id="bd-sku" style="flex:1" placeholder="Ej. 4400-1123 o filtro" value="${esc(q.texto)}" autocomplete="off">
        <button type="button" id="btn-escanear-bodega" class="icon-btn" style="border:1px solid var(--line);border-radius:8px;width:40px;height:40px;flex:none" aria-label="Escanear código">${ICONS.escanear}</button>
      </div>
      ${q.buscando ? `<div class="hint">Buscando…</div>` : ''}
      ${q.error ? `<div class="hint" style="color:var(--danger)">No se pudo buscar: ${esc(q.error)}</div>` : ''}
      ${q.resultados.length ? `<div class="sku-picks" style="margin-top:6px">${q.resultados.map(s=>`
        <div class="sku-pick" style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">
          <div style="flex:1;min-width:0"><div class="mono">${esc(s.sku_code)}${s.batch?` <span class="hint" style="display:inline">· ${esc(s.batch)}</span>`:''}</div><div class="hint" style="margin:0">${esc(s.descripcion||'')}${s.storage_bin?` · ${esc(s.storage_bin)}`:''} · stock ${s.stock_sistema==null?'—':s.stock_sistema}</div></div>
          <input type="number" class="bd-cantidad" data-sku-id="${esc(s.id)}" min="0" step="any" placeholder="Cant." style="width:84px;margin:0">
          <button type="button" class="btn btn-primary bd-agregar" data-sku-id="${esc(s.id)}" style="width:auto;padding:6px 10px">Agregar</button>
        </div>`).join('')}</div>` : (q.texto.length>=2 && !q.buscando && !q.error ? `<div class="hint" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">Sin resultados.${esIngreso && !b.nuevoSku ? ` <button type="button" class="link-btn" id="btn-nuevo-sku-bodega">Crear SKU nuevo «${esc(q.texto.trim())}»</button>` : ''}</div>` : '')}
      ${esIngreso && b.nuevoSku ? `<form id="form-nuevo-sku-bodega" class="card" style="margin-top:10px;background:var(--bg)">
        <div class="hint" style="margin-bottom:8px"><strong>SKU nuevo.</strong> Nace con stock 0; este ingreso le pone el saldo.</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div style="grid-column:1/-1"><label for="ns-codigo">Código</label><input type="text" id="ns-codigo" required value="${esc(b.nuevoSku.sku_code||'')}" style="margin:0"></div>
          <div style="grid-column:1/-1"><label for="ns-descripcion">Descripción</label><input type="text" id="ns-descripcion" required value="${esc(b.nuevoSku.descripcion||'')}" style="margin:0"></div>
          <div><label for="ns-unidad">Unidad</label><input type="text" id="ns-unidad" value="${esc(b.nuevoSku.unidad_medida||'UN')}" placeholder="UN, LT, KG" style="margin:0"></div>
          <div style="grid-column:1/-1"><label for="ns-tipo">Tipo de material</label><select id="ns-tipo" style="margin:0"><option value="">Sin clasificar</option>${TIPOS_MATERIAL.map(t=>`<option value="${esc(t)}" ${b.nuevoSku.tipo_material===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
          <div><label for="ns-bin">Bin</label><input type="text" id="ns-bin" value="${esc(b.nuevoSku.storage_bin||'')}" placeholder="Opcional" style="margin:0"></div>
          <div style="grid-column:1/-1"><label for="ns-bodega">Ubicación general</label><input type="text" id="ns-bodega" value="${esc(b.nuevoSku.bodega||'')}" placeholder="Opcional" style="margin:0"></div>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px">
          <button type="submit" class="btn btn-primary" style="width:auto;padding:8px 14px" ${b.nuevoSku.guardando?'disabled':''}>${b.nuevoSku.guardando?'<span class="spinner"></span> Creando…':'Crear y usar'}</button>
          <button type="button" class="btn btn-secondary" id="btn-cancelar-nuevo-sku" style="width:auto;padding:8px 14px">Cancelar</button>
        </div>
      </form>` : ''}
      ${d.lineas.length ? `<div class="table-wrap" style="margin-top:12px"><table>
        <thead><tr><th>SKU</th><th class="num">Cantidad</th>${esIngreso?'<th class="num">Costo unit.</th><th class="num">Monto</th>':''}<th></th></tr></thead>
        <tbody>${d.lineas.map(l=>`<tr>
          <td class="mono">${esc(l.sku_code)}<div style="font-size:11px;color:var(--text-faint);font-family:'Inter'">${esc(l.descripcion||'')}${l.storage_bin?` · ${esc(l.storage_bin)}`:''}${l.batch?` · ${esc(l.batch)}`:''}</div></td>
          <td class="num">${l.cantidad} ${esc(l.unidad_medida||'')}</td>
          ${esIngreso?`<td class="num"><input type="number" class="bd-costo" data-costo-sku="${esc(l.sku_id)}" min="0" step="any" value="${l.costo_unitario!=null?l.costo_unitario:''}" placeholder="—" style="width:88px;margin:0;text-align:right"></td>
          <td class="num">${l.costo_unitario!=null?'$'+Math.round(l.cantidad*Number(l.costo_unitario)).toLocaleString('es-CL'):'—'}</td>`:''}
          <td class="num"><button type="button" class="icon-btn" data-quitar-linea="${esc(l.sku_id)}" aria-label="Quitar">${ICONS.x}</button></td>
        </tr>`).join('')}</tbody></table></div>
        <div class="hint" style="margin-top:6px">${d.lineas.length} material${d.lineas.length===1?'':'es'} · ${totalLineas} unidades${esIngreso && totalMonto ? ` · monto del ingreso <strong>$${Math.round(totalMonto).toLocaleString('es-CL')}</strong>${lineasSinCosto?` (${lineasSinCosto} sin costo)`:''}` : ''}</div>` : `<div class="hint" style="margin-top:10px">Busca o escanea cada material y agrégalo con su cantidad.</div>`}
    </div>
    <div class="card" style="margin-top:12px">
      <form id="form-doc-bodega" data-tipo="${tipo}">
        ${esIngreso ? `
        <label for="bd-proveedor">Proveedor</label>
        <select id="bd-proveedor"><option value="">Sin proveedor</option>${proveedores.map(p=>`<option value="${esc(p.id)}" ${d.proveedorId===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select>
        ${!proveedores.length ? `<div class="hint">El administrador agrega proveedores en Configuraciones.</div>` : ''}
        <div class="row2">
          <div><label for="bd-guia">N° guía de despacho *</label><input type="text" id="bd-guia" value="${esc(d.numeroGuia)}" required></div>
          <div><label for="bd-oc">N° orden de compra</label><input type="text" id="bd-oc" value="${esc(d.numeroOc)}"></div>
        </div>
        <label>Foto de la guía *</label>
        <div class="file-input"><input type="file" id="bd-foto-guia" accept="image/*" capture="environment">${ICONS.camera.replace('<svg','<svg style="width:22px;height:22px;stroke:var(--text-dim);margin-bottom:6px" ')}<div>${d.fotoGuia ? (d.fotoGuia.preparando ? 'Preparando…' : 'Guía lista, toca para reemplazar') : 'Tomar foto de la guía'}</div></div>
        ${d.fotoGuia && d.fotoGuia.preview ? `<div class="foto-preview-grid"><div class="foto-preview-item"><img src="${d.fotoGuia.preview}"></div></div>` : ''}
        ` : `
        <label for="bd-retira">Quién retira *</label>
        <select id="bd-retira" required><option value="">Elige una persona</option>${personas.map(p=>`<option value="${esc(p.id)}" ${d.retiradoPorId===p.id?'selected':''}>${esc(p.nombre)}${p.area?` (${esc(p.area)})`:''}</option>`).join('')}</select>
        ${!personas.length ? `<div class="hint">El administrador agrega las personas que retiran en Configuraciones.</div>` : ''}
        <label for="bd-despacha">Quién despacha</label>
        <select id="bd-despacha"><option value="">${esc(state.perfil ? state.perfil.nombre : 'Yo')} (yo)</option>${usuarios.filter(u=>u.id!==(state.perfil&&state.perfil.id)).map(u=>`<option value="${esc(u.id)}" ${d.despachadoPorId===u.id?'selected':''}>${esc(u.nombre)}</option>`).join('')}</select>
        <label for="bd-destino">Para qué se usa</label>
        <input type="text" id="bd-destino" placeholder="Ej. Mantención chancador" value="${esc(d.destino)}">
        `}
        <label>Foto${esIngreso?'s':''} del material (opcional)</label>
        <div class="file-input"><input type="file" id="bd-foto-material" accept="image/*" capture="environment" multiple>${ICONS.camera.replace('<svg','<svg style="width:22px;height:22px;stroke:var(--text-dim);margin-bottom:6px" ')}<div>Tomar o adjuntar foto${d.fotosMaterial.length?'s':''}</div></div>
        ${d.fotosMaterial.length ? `<div class="foto-preview-grid">${d.fotosMaterial.map((f,i)=>`<div class="foto-preview-item">${f.preview?`<img src="${f.preview}">`:`<div class="hint" style="display:flex;align-items:center;justify-content:center;height:100%;min-height:72px;margin:0">Preparando…</div>`}<button type="button" class="foto-preview-remove" data-quitar-foto-material="${i}" aria-label="Quitar foto">${ICONS.x}</button></div>`).join('')}</div>` : ''}
        <label for="bd-obs">Observación</label>
        <textarea id="bd-obs" placeholder="Opcional">${esc(d.observacion)}</textarea>
        <div style="margin-top:16px;display:flex;gap:8px;align-items:center">
          <button type="submit" class="btn btn-primary" ${b.guardando?'disabled':''}>${b.guardando?'<span class="spinner"></span>':(esIngreso?'Guardar ingreso':'Guardar salida')}</button>
          <button type="button" class="btn btn-secondary" id="btn-limpiar-doc-bodega" style="width:auto;padding:10px 14px">Limpiar</button>
        </div>
      </form>
    </div>
  `;
}

function etiquetaTipoMovimiento(t){ return {apertura:'Apertura', ingreso:'Ingreso', salida:'Salida', ajuste:'Ajuste'}[t] || t; }
function badgeEstadoMovimiento(e){
  return e==='aprobado' ? '<span class="badge badge-ok">Aprobado</span>' : e==='anulado' ? '<span class="badge badge-danger">Anulado</span>' : e==='pendiente_revision' ? '<span class="badge badge-warn">En revisión</span>' : '<span class="badge badge-warn">Por aprobar</span>';
}

// Tarjeta de bodega en el Dashboard: pendientes de aprobación y últimos movimientos, con
// accesos a Movimientos y Stock. Solo con el módulo activo.
function renderResumenBodegaDashboard(){
  if(!moduloBodegaActivo()) return '';
  const b = state.bodega; const pend = (b.pendientes||[]).length; const ult = b.ultimosMovimientos||[];
  return `<div class="card" style="margin-bottom:14px${pend?';border-color:var(--amber)':''}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <div><span class="eyebrow">Bodega</span><h3 style="margin:0;font-size:15px">${pend ? `${pend} pendiente${pend===1?'':'s'} de aprobación` : 'Sin pendientes de aprobación'}</h3></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn btn-secondary" data-ir-vista="movimientos" style="width:auto;padding:6px 12px;font-size:12px">Movimientos</button><button type="button" class="btn btn-secondary" data-ir-vista="stock" style="width:auto;padding:6px 12px;font-size:12px">Stock</button><button type="button" class="btn btn-secondary" data-ir-vista="reportes" style="width:auto;padding:6px 12px;font-size:12px">Reportes</button></div>
    </div>
    ${b.valorizacion ? `<div class="hint" style="margin-bottom:6px">Stock valorizado en <strong>$${Math.round(Number(b.valorizacion.valor_total)||0).toLocaleString('es-CL')}</strong>${Number(b.valorizacion.bajo_minimo)?` · <span style="color:var(--warn)">${b.valorizacion.bajo_minimo} bajo su mínimo</span>`:''}</div>` : ''}
    ${ult.length ? `<div class="hint" style="margin-bottom:4px">Últimos movimientos</div>${ult.map(m=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px"><span><span class="mono">${esc(m.numero)}</span> · ${etiquetaTipoMovimiento(m.tipo)} · <span class="mono">${esc(m.sku_code)}</span></span><span class="num" style="white-space:nowrap">${m.tipo==='ajuste'&&m.cantidad>0?'+':''}${m.cantidad} ${esc(m.unidad_medida||'')} ${badgeEstadoMovimiento(m.estado)}</span></div>`).join('')}` : `<div class="hint">${b.ultimosCargados?'Aún no hay movimientos.':'Cargando…'}</div>`}
  </div>`;
}

function renderMovimientosBodega(){
  const b = state.bodega;
  const esAdmin = state.perfil && (state.perfil.rol==='admin' || state.perfil.es_super_admin);
  const rows = b.movimientos;
  const pend = b.pendientes || [];
  return `
    <div class="section-head"><div><span class="eyebrow">Bodega</span><h2>Movimientos</h2></div></div>
    ${esAdmin && b.valorizacion && Number(b.valorizacion.sin_apertura) ? `
    <div class="card" style="margin-bottom:12px;border-color:var(--amber)">
      <div class="hint" style="margin-bottom:8px"><strong>${Number(b.valorizacion.sin_apertura).toLocaleString('es-CL')} material${Number(b.valorizacion.sin_apertura)===1?'':'es'}</strong> tiene${Number(b.valorizacion.sin_apertura)===1?'':'n'} stock cargado pero ningún movimiento registrado, así que su kardex parte vacío. Registra la apertura para dejar ese saldo como punto de partida; el stock no cambia.</div>
      ${b.aperturaProgreso
        ? `<div class="hint" style="margin:0"><span class="spinner"></span> Registrando apertura… ${b.aperturaProgreso.hechos.toLocaleString('es-CL')} de ${Number(b.aperturaProgreso.total||0).toLocaleString('es-CL')}</div>`
        : `<button type="button" class="btn btn-primary" id="btn-apertura-bodega" style="width:auto;padding:8px 14px">Registrar apertura de stock</button>`}
    </div>` : ''}
    ${esAdmin && pend.length ? `
    <div class="card" style="margin-bottom:12px;border-color:var(--amber)">
      <div class="hint" style="margin-bottom:8px"><strong>${pend.length} pendiente${pend.length===1?'':'s'}</strong> de tu decisión.</div>
      ${pend.map(m=>`<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap">
        <div style="flex:1;min-width:200px"><span class="mono">${esc(m.numero)}</span> · ${etiquetaTipoMovimiento(m.tipo)} · <span class="mono">${esc(m.sku_code)}</span> · ${m.tipo==='ajuste' ? `${m.cantidad>0?'+':''}${m.cantidad} ${esc(m.unidad_medida||'')}${m.saldo_local!=null?` (deja el stock en ${Number(m.saldo_local)+Number(m.cantidad)})`:''}` : `${m.cantidad} ${esc(m.unidad_medida||'')}`}${m.estado==='pendiente_revision' ? `<div class="hint" style="margin:0">Registrado sin conexión con saldo ${m.saldo_local!=null?m.saldo_local:'—'}; el saldo real no alcanzaba.</div>` : (m.motivo?`<div class="hint" style="margin:0">${esc(m.motivo)}</div>`:'')}</div>
        <div style="display:flex;gap:6px"><button type="button" class="btn btn-primary" data-aprobar-mov="${esc(m.id)}" style="width:auto;padding:6px 12px;font-size:12px">Aprobar</button><button type="button" class="btn btn-secondary" data-rechazar-mov="${esc(m.id)}" style="width:auto;padding:6px 12px;font-size:12px">Rechazar</button></div>
      </div>`).join('')}
    </div>` : ''}
    <div class="card">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <select id="mov-filtro-tipo" style="width:auto;margin:0"><option value="">Todos</option>${['ingreso','salida','ajuste','apertura'].map(t=>`<option value="${t}" ${b.filtroTipo===t?'selected':''}>${etiquetaTipoMovimiento(t)}</option>`).join('')}</select>
        <button type="button" class="btn btn-secondary" id="btn-exportar-movimientos" style="width:auto;padding:6px 12px" ${rows.length?'':'disabled'}>Exportar Excel</button>
      </div>
      ${rows.length ? `<div class="table-wrap"><table>
        <thead><tr><th>N°</th><th>Tipo</th><th>SKU</th><th class="num">Cantidad</th><th>Detalle</th><th>Fecha</th><th>Estado</th><th></th></tr></thead>
        <tbody>${rows.map(m=>{ const fotos = b.fotosPorDocumento[m.documento_id]||[]; return `<tr>
          <td class="mono" style="font-size:11.5px">${esc(m.numero)}</td>
          <td>${etiquetaTipoMovimiento(m.tipo)}</td>
          <td class="mono">${esc(m.sku_code)}<div style="font-size:11px;color:var(--text-faint);font-family:'Inter'">${esc(m.descripcion||'')}${m.storage_bin?` · ${esc(m.storage_bin)}`:''}</div></td>
          <td class="num">${m.tipo==='ajuste' && m.cantidad>0 ? '+' : ''}${m.cantidad} ${esc(m.unidad_medida||'')}</td>
          <td style="font-size:12px">${m.tipo==='ingreso' ? `${esc(m.proveedor_nombre||'')}${m.numero_guia?` · GD ${esc(m.numero_guia)}`:''}${m.numero_oc?` · OC ${esc(m.numero_oc)}`:''}` : m.tipo==='salida' ? `Retira ${esc(m.retirado_por_nombre||'—')}${m.destino?` · ${esc(m.destino)}`:''}<div class="hint" style="margin:0">Despacha ${esc(m.despachado_por_nombre||m.usuario_nombre||'')}</div>` : esc(m.motivo||'')}${m.anulado_motivo?`<div class="hint" style="margin:0">Anulado: ${esc(m.anulado_motivo)}</div>`:''}</td>
          <td class="mono" style="font-size:11.5px">${fmtFecha(m.fecha)}</td>
          <td>${badgeEstadoMovimiento(m.estado)}</td>
          <td class="num" style="white-space:nowrap">${fotos.length?`<button class="icon-btn" data-ver-fotos="${esc(JSON.stringify(fotos.map(f=>({foto_url:f.foto_url, numero_conteo:null, fecha_conteo:m.fecha}))))}" aria-label="Ver fotos">${ICONS.camera}${fotos.length>1?` ${fotos.length}`:''}</button>`:''} <button type="button" class="btn btn-secondary" data-kardex-sku="${esc(m.sku_id)}" data-kardex-codigo="${esc(m.sku_code)}" style="width:auto;padding:5px 10px;font-size:12px">Kardex</button>${m.documento_id ? ` <button type="button" class="btn btn-secondary" data-comprobante-doc="${esc(m.documento_id)}" style="width:auto;padding:5px 10px;font-size:12px">PDF</button>`:''}${esAdmin && m.documento_id && m.estado==='aprobado' && !m.documento_anulado_en ? ` <button type="button" class="btn btn-secondary" data-anular-doc="${esc(m.documento_id)}" data-numero="${esc(m.numero)}" style="width:auto;padding:5px 10px;font-size:12px">Anular</button>`:''}${esAdmin && !m.documento_id && m.estado==='aprobado' ? ` <button type="button" class="btn btn-secondary" data-anular-mov="${esc(m.id)}" data-numero="${esc(m.numero)}" style="width:auto;padding:5px 10px;font-size:12px">Anular</button>`:''}</td>
        </tr>`; }).join('')}</tbody></table></div>` : `<div class="empty"><div class="glyph">✓</div>${b.movimientosCargados ? 'Aún no hay movimientos.' : 'Cargando…'}</div>`}
    </div>
  `;
}

function renderStockBodega(){
  const b = state.bodega;
  const rows = b.stock;
  const esAdminBodega = state.perfil && state.perfil.rol==='admin';
  const totalValor = rows.reduce((s,r)=>s+(Number(r.valor)||0), 0);
  return `
    <div class="section-head"><div><span class="eyebrow">Bodega</span><h2>Stock actual</h2></div></div>
    <div class="card">
      <form id="form-stock-bodega" style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
        <input type="text" id="stock-texto" placeholder="Código, descripción o bin" value="${esc(b.stockTexto)}" style="flex:1;margin:0">
        <button type="submit" class="btn btn-primary" style="width:auto;padding:0 14px;height:40px">Buscar</button>
        <button type="button" class="btn btn-secondary" id="btn-exportar-stock" style="width:auto;padding:0 12px;height:40px">Excel</button>
      </form>
      <label style="display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:13px;cursor:pointer"><input type="checkbox" id="stock-bajo-minimo" ${b.stockSoloBajoMinimo?'checked':''} style="width:auto;margin:0">Solo bajo el mínimo${b.valorizacion && b.valorizacion.bajo_minimo ? ` <span class="badge badge-warn">${b.valorizacion.bajo_minimo}</span>` : ''}</label>
      ${rows.length ? `<div class="hint" style="margin-bottom:6px">${rows.length} SKU${rows.length>=300?' (primeros 300)':''}${totalValor?` · valor $${Math.round(totalValor).toLocaleString('es-CL')}`:''}</div><div class="table-wrap"><table>
        <thead><tr><th>SKU</th><th>Bin</th><th>Tipo</th><th class="num">Stock</th><th class="num">Mínimo</th><th class="num">Costo</th><th class="num">Valor</th><th></th></tr></thead>

function exportarMovimientosExcel(){

    'Retira': m.retirado_por_nombre||'', 'Área': m.retirado_por_area||'', 'Despacha': m.despachado_por_nombre||'', 'Destino': m.destino||'', 'Motivo': m.motivo||m.anulado_motivo||'', 'Registró': m.usuario_nombre||'',
    'Tipo material': m.tipo_material||'', 'Costo unitario': m.costo_aplicado!=null?Number(m.costo_aplicado):'', 'Monto': m.costo_aplicado!=null?Number(m.costo_aplicado)*Number(m.cantidad):'',
  }));
  if(!rows.length){ toast('No hay movimientos para exportar','err'); return; }
  if(typeof XLSX==='undefined'){ toast('Exportación no disponible sin conexión','err'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Movimientos');
  XLSX.writeFile(wb, `movimientos-bodega-${fechaISO(new Date())}.xlsx`);
}

// Ingreso y Salida comparten los listeners (bindDocumentoBodega); las fotos se comprimen igual
// que en Contar (comprimirFoto + fotosEnProceso).
function prepararFotoBodega(file, destino){
  const entrada = {file, preview:null, preparando:true};
  const tarea = comprimirFoto(file).then(listo=>{
    entrada.file = listo; entrada.preparando = false;
    return new Promise(resolve=>{ const reader = new FileReader(); reader.onload = ev=>{ entrada.preview = ev.target.result; render(); resolve(); }; reader.onerror = ()=>{ render(); resolve(); }; reader.readAsDataURL(listo); });
  }).finally(()=>{ fotosEnProceso = fotosEnProceso.filter(t=>t!==tarea); });
  fotosEnProceso.push(tarea);
  return entrada;
}
function capturarCamposDocumentoBodega(){
  const d = state.bodega.doc; const g = id => document.getElementById(id);
  if(g('bd-proveedor')) d.proveedorId = g('bd-proveedor').value;
  if(g('bd-guia')) d.numeroGuia = g('bd-guia').value;
  if(g('bd-oc')) d.numeroOc = g('bd-oc').value;
  if(g('bd-retira')) d.retiradoPorId = g('bd-retira').value;
  if(g('bd-despacha')) d.despachadoPorId = g('bd-despacha').value;
  if(g('bd-destino')) d.destino = g('bd-destino').value;
  if(g('bd-obs')) d.observacion = g('bd-obs').value;
  // Costo por línea del ingreso (ver renderDocumentoBodega): vacío = sin informar, no cero.
  document.querySelectorAll('.bd-costo').forEach(inp=>{
    const linea = d.lineas.find(l=>l.sku_id===inp.dataset.costoSku);
    if(!linea) return;
    const txt = (inp.value||'').trim();
    const n = Number(txt);
    linea.costo_unitario = (txt==='' || isNaN(n) || n<0) ? null : n;
  });
}
function bindDocumentoBodega(){
  const tipo = state.view;
  const inputSku = document.getElementById('bd-sku');
  if(inputSku){
    let timer = null;
    inputSku.addEventListener('input', e=>{ capturarCamposDocumentoBodega(); clearTimeout(timer); const v = e.target.value; timer = setTimeout(()=> buscarSkuBodega(v), 250); });
    inputSku.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); capturarCamposDocumentoBodega(); buscarSkuBodega(e.target.value); } });
  }
  const btnEsc = document.getElementById('btn-escanear-bodega');
  if(btnEsc) btnEsc.addEventListener('click', ()=>{ capturarCamposDocumentoBodega(); setState({escanerModal: {codigo:null, error:null, destino:'bodega'}}); });
  const btnNuevo = document.getElementById('btn-nuevo-sku-bodega');
  if(btnNuevo) btnNuevo.addEventListener('click', ()=>{ capturarCamposDocumentoBodega(); state.bodega.nuevoSku = {sku_code: state.bodega.busqueda.texto.trim().toUpperCase(), descripcion:'', unidad_medida:'UN', bodega:'', storage_bin:'', tipo_material:'', guardando:false}; render(); });
  const formNuevo = document.getElementById('form-nuevo-sku-bodega');
  if(formNuevo){
    const leer = ()=>{ const n = state.bodega.nuevoSku; if(!n) return; n.sku_code = document.getElementById('ns-codigo').value; n.descripcion = document.getElementById('ns-descripcion').value; n.unidad_medida = document.getElementById('ns-unidad').value; n.storage_bin = document.getElementById('ns-bin').value; n.bodega = document.getElementById('ns-bodega').value; n.tipo_material = document.getElementById('ns-tipo').value; };
    formNuevo.addEventListener('submit', e=>{ e.preventDefault(); capturarCamposDocumentoBodega(); leer(); crearSkuDesdeIngreso(); });
    document.getElementById('btn-cancelar-nuevo-sku').addEventListener('click', ()=>{ capturarCamposDocumentoBodega(); state.bodega.nuevoSku = null; render(); });
  }
  document.querySelectorAll('.bd-agregar').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      capturarCamposDocumentoBodega();
      const sku = state.bodega.busqueda.resultados.find(s=>s.id===btn.dataset.skuId);
      const input = document.querySelector(`.bd-cantidad[data-sku-id="${btn.dataset.skuId}"]`);
      agregarLineaBodega(sku, input ? input.value : '');
    });
  });
  document.querySelectorAll('.bd-cantidad').forEach(inp=>{
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); const btn = document.querySelector(`.bd-agregar[data-sku-id="${inp.dataset.skuId}"]`); if(btn) btn.click(); } });
  });
  document.querySelectorAll('.bd-costo').forEach(inp=>{
    inp.addEventListener('change', ()=>{ capturarCamposDocumentoBodega(); render(); });
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } });
  });
  document.querySelectorAll('[data-quitar-linea]').forEach(btn=> btn.addEventListener('click', ()=>{ capturarCamposDocumentoBodega(); quitarLineaBodega(btn.dataset.quitarLinea); }));
  const fotoGuia = document.getElementById('bd-foto-guia');
  if(fotoGuia) fotoGuia.addEventListener('change', e=>{ const f = (e.target.files||[])[0]; if(f){ capturarCamposDocumentoBodega(); state.bodega.doc.fotoGuia = prepararFotoBodega(f, 'guia'); render(); } e.target.value=''; });
  const fotoMat = document.getElementById('bd-foto-material');
  if(fotoMat) fotoMat.addEventListener('change', e=>{ capturarCamposDocumentoBodega(); Array.from(e.target.files||[]).forEach(f=> state.bodega.doc.fotosMaterial.push(prepararFotoBodega(f, 'material'))); render(); e.target.value=''; });
  document.querySelectorAll('[data-quitar-foto-material]').forEach(btn=> btn.addEventListener('click', ()=>{ capturarCamposDocumentoBodega(); state.bodega.doc.fotosMaterial.splice(Number(btn.dataset.quitarFotoMaterial),1); render(); }));
  const form = document.getElementById('form-doc-bodega');
  if(form) form.addEventListener('submit', e=>{ e.preventDefault(); capturarCamposDocumentoBodega(); registrarDocumentoBodega(tipo); });
  const btnLimpiar = document.getElementById('btn-limpiar-doc-bodega');
  if(btnLimpiar) btnLimpiar.addEventListener('click', ()=>{ state.bodega.doc = documentoBodegaVacio(); state.bodega.busqueda = {texto:'', resultados:[], buscando:false}; render(); });
}

          <button id="btn-logout" class="btn-icon-header" aria-label="Salir">${ICONS.logout.replace('style="width:14px;height:14px"','style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"')}</button>

    ${state.versionNueva? `

      <span>Hay una versión nueva de InventIA. Recarga para usarla: lo que tengas guardado sin conexión no se pierde.</span>
      <button id="btn-recargar-version" class="btn btn-primary" style="width:auto;padding:6px 12px">Recargar</button>
    </div>
    ` : ''}
    ${state.colaOffline.length? `
    <div id="banner-offline" style="background:rgba(224,178,60,.15);color:var(--warn);border-bottom:1px solid var(--warn);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px">
      <span>${state.colaOffline.length} cambio${state.colaOffline.length===1?'':'s'} guardado${state.colaOffline.length===1?'':'s'} sin conexión, pendiente${state.colaOffline.length===1?'':'s'} de sincronizar.</span>
      <div style="display:flex;gap:8px">
        <button id="btn-ver-offline" class="btn btn-secondary" style="width:auto;padding:6px 12px">Ver detalle</button>
        <button id="btn-sincronizar-offline" class="btn btn-secondary" style="width:auto;padding:6px 12px" ${state.sincronizandoOffline?'disabled':''}>${state.sincronizandoOffline?'Sincronizando…':'Reintentar ahora'}</button>

    <main${VISTAS_ANCHAS.includes(state.view)?' class="ancho"':''}>${content}</main>
    ${VISTAS_BODEGA.includes(state.view) ? `<nav class="tabbar">
      ${tabBtn('inicio','Inicio')}

}

function tabBtn(view,label){
  const bloqueada = vistaBloqueadaParaRol(view);
  return `<button class="tab ${state.view===view?'active':''} ${bloqueada?'tab-bloqueada':''}" data-tab="${view}" ${bloqueada?`data-bloqueada="1" title="Solo para administradores"`:''}>
    <span class="tab-icon-wrap">
      ${ICONS[view==='carga'?'upload':view]}
      ${bloqueada? `<span class="tab-candado" aria-hidden="true">${ICONS.candado}</span>` : ''}
    </span>
    ${label}
  </button>`;
}

/* =======================================================================
   RENDER PRINCIPAL + BINDINGS
   ======================================================================= */
function render(){
  document.documentElement.setAttribute('data-tema', state.tema);
  if(state.session && state.perfil && state.view !== vistaAseguradaAnterior){
    vistaAseguradaAnterior = state.view;
    const vista = state.view;
    Promise.resolve().then(()=> asegurarDatosDeVista(vista));
  }
  // Ver capturarFormularioPlan: cualquier render (incluida actividad de fondo sin relación con
  // lo que la persona está llenando) reconstruye toda la pantalla desde cero, así que hay que
  // guardar el formulario "Agregar a la planificación" antes y devolverlo después.
  const snapshotPlan = state.view==='plan' ? capturarFormularioPlan() : null;
  const root = document.getElementById('app');
  root.innerHTML = (state.mfaDesafio ? renderMfaDesafio() : state.debeCrearPassword ? renderCrearPassword() : (state.session && state.empresaBloqueada) ? renderCuentaBloqueada() : state.session ? renderShell() : state.registroPlan ? renderRegistroAutoservicio() : renderLogin()) + renderFotoModal() + renderOfflineModal() + renderExportarModal() + renderEscanerModal() + renderDescartarReconteoModal() + renderAjusteBodegaModal() + renderKardexModal() + renderUbicacionSkuModal();
  bind();
  restaurarFormularioPlan(snapshotPlan);
}

function renderCuentaBloqueada(){
  const {motivo, nombre, planNombre} = state.empresaBloqueada;
  const mensaje = motivo === 'morosa'
    ? 'Hubo un problema con el último cobro de tu suscripción y no se pudo regularizar automáticamente.'
    : motivo === 'pendiente_tarjeta'
    ? 'Creaste tu cuenta pero todavía no registraste un método de pago, así que no tienes acceso todavía.'
    : motivo === 'vencida'
    ? 'Tu suscripción fue cancelada y ya terminó el período que estaba pagado.'
    : 'Esta cuenta fue pausada.';
  const accionHtml = (motivo === 'pendiente_tarjeta' || motivo === 'vencida')
    ? `<button type="button" id="btn-registrar-tarjeta-bloqueada" class="btn btn-primary" style="margin-bottom:10px" ${state.iniciandoSuscripcionFlow?'disabled':''}>${state.iniciandoSuscripcionFlow?'Redirigiendo…':(motivo==='vencida'?'Suscribirme de nuevo':'Registrar método de pago')}</button><br>`
    : motivo === 'morosa'
    ? `<button type="button" id="btn-verificar-pago-bloqueada" class="btn btn-primary" style="margin-bottom:10px" ${state.verificandoPagoBloqueada?'disabled':''}>${state.verificandoPagoBloqueada?'Verificando…':'Ya regularicé el pago, verificar'}</button><br>`
    : '';
  return `
    <div class="login-wrap">
      <div class="login-card">
        <div class="brand-badge" style="margin:0 auto 16px">IA</div>
        <h1 style="text-align:center">${esc(nombre)}</h1>
        <p class="hint" style="text-align:center;margin-bottom:20px">${mensaje} ${(motivo==='pendiente_tarjeta'||motivo==='vencida')?'':'Escríbenos a <a href="mailto:contacto@inventiapp.cl">contacto@inventiapp.cl</a> para reactivarla.'}</p>
        ${accionHtml}
        <button type="button" id="btn-salir-bloqueada" class="btn btn-secondary">Salir</button>
      </div>
    </div>

}

          <button type="submit" class="btn btn-primary" ${state.creandoCuentaAutoservicio?'disabled':''}>
            ${state.creandoCuentaAutoservicio? '<span class="spinner"></span>' : 'Crear cuenta y continuar al pago'}

function bind(){
  if(!(state.view==='conteo' && !state.skuSeleccionado)) conteoBuscadorFueEnfocado = false;
  if(state.fotoModal){
    document.getElementById('foto-modal-close').addEventListener('click', ()=> setState({fotoModal:null}));
    document.getElementById('foto-modal-backdrop').addEventListener('click', e=>{
      if(e.target.id === 'foto-modal-backdrop') setState({fotoModal:null});
    });
    const btnPrevFoto = document.getElementById('foto-modal-prev');
    const btnNextFoto = document.getElementById('foto-modal-next');
    if(btnPrevFoto) btnPrevFoto.addEventListener('click', ()=>{
      const {urls, labels, index} = state.fotoModal;
      setState({fotoModal:{urls, labels, index:(index-1+urls.length)%urls.length}});
    });
    if(btnNextFoto) btnNextFoto.addEventListener('click', ()=>{
      const {urls, labels, index} = state.fotoModal;
      setState({fotoModal:{urls, labels, index:(index+1)%urls.length}});
    });
  }
  if(state.offlineModal){
    document.getElementById('offline-modal-close').addEventListener('click', ()=> setState({offlineModal:false}));
    document.getElementById('offline-modal-backdrop').addEventListener('click', e=>{
      if(e.target.id === 'offline-modal-backdrop') setState({offlineModal:false});
    });
    document.querySelectorAll('[data-reintentar-offline]').forEach(btn=>{
      btn.addEventListener('click', ()=> reintentarAccionOffline(btn.dataset.reintentarOffline));
    });
    document.querySelectorAll('[data-descartar-offline]').forEach(btn=>{
      btn.addEventListener('click', ()=> descartarAccionOffline(btn.dataset.descartarOffline));
    });
  }
  if(state.exportarModal){
    document.getElementById('exportar-modal-close').addEventListener('click', ()=> setState({exportarModal:false}));
    document.getElementById('exportar-modal-backdrop').addEventListener('click', e=>{
      if(e.target.id === 'exportar-modal-backdrop') setState({exportarModal:false});
    });
    document.getElementById('form-exportar-conteos').addEventListener('submit', e=>{
      e.preventDefault();
      setState({exportConteos:{
        ...state.exportConteos,
        desde: document.getElementById('ex-desde').value,
        hasta: document.getElementById('ex-hasta').value,
      }});
      exportarConteosExcel();
    });
  }
  if(state.escanerModal){
    document.getElementById('escaner-modal-close').addEventListener('click', cerrarEscaner);
    document.getElementById('escaner-modal-backdrop').addEventListener('click', e=>{
      if(e.target.id === 'escaner-modal-backdrop') cerrarEscaner();
    });
    if(state.escanerModal.opciones){
      document.querySelectorAll('[data-escaner-elegir-btn]').forEach(btn=>{
        btn.addEventListener('click', ()=> elegirSkuEscaneado(btn.dataset.escanerElegirBtn));
      });
    }else if(!state.escanerModal.codigo){
      if(!state.escanerModal.error) iniciarEscaner();
    }else{
      const buscar = document.getElementById('escaner-buscar');
      buscar.addEventListener('input', e=> setState({escanerModal: {...state.escanerModal, buscarAsociar: e.target.value}}));
      buscar.focus(); buscar.selectionStart = buscar.selectionEnd = buscar.value.length;
      document.querySelectorAll('[data-asociar-btn]').forEach(btn=>{
        btn.addEventListener('click', ()=> asociarCodigoBarras(btn.dataset.asociarBtn, state.escanerModal.codigo));
      });
    }
  }
  if(state.mfaDesafio){
    document.getElementById('form-mfa-desafio').addEventListener('submit', e=>{
      e.preventDefault();
      enviarCodigoMfaDesafio(document.getElementById('mfa-codigo').value.trim());
    });
    document.getElementById('btn-cancelar-mfa').addEventListener('click', ()=>{
      // Se descarta la sesión aal1 a medio camino: si la persona no tiene el segundo factor a
      // mano, es más seguro volver al login (contraseña de nuevo) que dejarla atascada acá.
      borrarSesionGuardada();
      state = estadoTrasCerrarSesion();
      render();
    });
    return;
  }
  if(state.debeCrearPassword){
    document.getElementById('crear-password-form').addEventListener('submit', e=>{
      e.preventDefault();
      establecerPassword(document.getElementById('f-nueva-pass').value);
    });
    return;
  }
  if(state.session && state.empresaBloqueada){
    document.getElementById('btn-salir-bloqueada').addEventListener('click', handleLogout);
    const btnVerificarPago = document.getElementById('btn-verificar-pago-bloqueada');
    if(btnVerificarPago) btnVerificarPago.addEventListener('click', verificarPagoCuentaBloqueada);
    const btnRegistrarTarjeta = document.getElementById('btn-registrar-tarjeta-bloqueada');
    if(btnRegistrarTarjeta) btnRegistrarTarjeta.addEventListener('click', ()=> iniciarSuscripcionFlow(state.empresaBloqueada.planNombre));
    return;
  }
  if(!state.session && state.registroPlan){
    document.getElementById('registro-autoservicio-form').addEventListener('submit', e=>{
      e.preventDefault();
      const nombreEmpresa = document.getElementById('ra-empresa').value.trim();
      const nombreAdmin = document.getElementById('ra-nombre').value.trim();
      const email = document.getElementById('ra-email').value.trim();
      const pass = document.getElementById('ra-pass').value;
      crearCuentaAutoservicio(nombreEmpresa, nombreAdmin, email, pass);
    });
    document.getElementById('btn-ya-tengo-cuenta').addEventListener('click', ()=> setState({registroPlan:null}));
    return;
  }
  if(!state.session){
    if(state.otpAcceso){
      document.getElementById('otp-acceso-form').addEventListener('submit', e=>{
        e.preventDefault();
        const email = document.getElementById('f-otp-email').value.trim();
        const codigo = document.getElementById('f-otp-codigo').value.trim();
        ingresarConCodigo(email, codigo);
      });
      document.getElementById('btn-volver-login-otp').addEventListener('click', ()=> setState({otpAcceso:null}));
      return;
    }
    if(state.authRecuperar){
      document.getElementById('recuperar-password-form').addEventListener('submit', e=>{
        e.preventDefault();
        solicitarRecuperacion(document.getElementById('f-recuperar-email').value.trim());
      });
      document.getElementById('btn-volver-login').addEventListener('click', ()=> setState({authRecuperar:false}));
      return;
    }
    const form = document.getElementById('auth-form');
    form.addEventListener('submit', e=>{
      e.preventDefault();
      const email = document.getElementById('f-email').value.trim();
      const pass = document.getElementById('f-pass').value;
      handleLogin(email, pass);
    });
    document.getElementById('btn-olvide-pass').addEventListener('click', ()=> setState({authRecuperar:true}));
    document.getElementById('btn-tengo-codigo').addEventListener('click', ()=> setState({otpAcceso:{email:''}}));
    return;
  }

  document.getElementById('btn-logout').addEventListener('click', ()=>{ detenerEscaner(); handleLogout(); });
  document.getElementById('btn-config').addEventListener('click', ()=>{ detenerEscaner(); setState({view:'config'}); });
  document.getElementById('btn-ir-buscar').addEventListener('click', ()=>{ detenerEscaner(); setState({view:'buscar'}); });
  document.getElementById('btn-ir-skus').addEventListener('click', ()=>{ detenerEscaner(); setState({view:'skus'}); });
  document.getElementById('btn-ir-calendario').addEventListener('click', ()=>{ detenerEscaner(); setState({view:'calendario'}); });
  document.getElementById('btn-exportar-conteos-modal').addEventListener('click', ()=> setState({exportarModal:true}));
  const btnSincronizarOffline = document.getElementById('btn-sincronizar-offline');
  if(btnSincronizarOffline) btnSincronizarOffline.addEventListener('click', sincronizarColaOffline);
  const btnRecargarVersion = document.getElementById('btn-recargar-version');
  if(btnRecargarVersion) btnRecargarVersion.addEventListener('click', recargarPorVersionNueva);
  const btnVerOffline = document.getElementById('btn-ver-offline');
  if(btnVerOffline) btnVerOffline.addEventListener('click', ()=> setState({offlineModal:true}));
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.bloqueada){ toast('Esta sección es solo para administradores', 'err'); return; }
      detenerEscaner();
      const patch = {view: btn.dataset.tab};
      // "Plan del día" queda en state.contarPlan una vez cargado y no se vuelve a pedir solo
      // por re-renderizar (ver el chequeo de "cargado" más abajo, necesario para evitar una
      // recursión infinita) — pero puede haber cambiado desde la última carga (planificación
      // editada desde otra pestaña, otro día, otra persona). Al volver a seleccionar la
      // pestaña Contar se fuerza a pedirla de nuevo, para no mostrar un plan desactualizado.
      if(btn.dataset.tab==='conteo') patch.contarPlan = contarPlanAlEntrar(state.contarPlan);
      setState(patch);
      if(btn.dataset.tab==='plan') refrescarPlanSiCorresponde();
    });
  });

  document.querySelectorAll('[data-ir-vista]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const vista = btn.dataset.irVista;
      if(vistaBloqueadaParaRol(vista)){ toast('Esta sección es solo para administradores', 'err'); return; }
      detenerEscaner();
      const patch = {view: vista};
      if(vista==='conteo') patch.contarPlan = contarPlanAlEntrar(state.contarPlan);
      setState(patch);
    });
  });
  const btnIrInicio = document.getElementById('btn-ir-inicio');
  if(btnIrInicio) btnIrInicio.addEventListener('click', ()=>{ detenerEscaner(); setState({view:'inicio'}); });
  if(state.view==='ingreso' || state.view==='salida') bindDocumentoBodega();
  if(state.view==='movimientos'){
    const sel = document.getElementById('mov-filtro-tipo');
    if(sel) sel.addEventListener('change', ()=>{ state.bodega.filtroTipo = sel.value; cargarMovimientosBodega(); });
    const btnExp = document.getElementById('btn-exportar-movimientos');
    if(btnExp) btnExp.addEventListener('click', exportarMovimientosExcel);
    document.querySelectorAll('[data-anular-doc]').forEach(btn=> btn.addEventListener('click', ()=> anularDocumentoBodega(btn.dataset.anularDoc, btn.dataset.numero)));
    document.querySelectorAll('[data-comprobante-doc]').forEach(btn=> btn.addEventListener('click', ()=> imprimirComprobanteBodega(btn.dataset.comprobanteDoc)));
    const btnApertura = document.getElementById('btn-apertura-bodega');
    if(btnApertura) btnApertura.addEventListener('click', ()=>{
      const n = Number(state.bodega.valorizacion && state.bodega.valorizacion.sin_apertura) || 0;
      if(!confirm(`Se va a registrar la apertura de ${n.toLocaleString('es-CL')} material${n===1?'':'es'} con el stock que tienen hoy. El stock no cambia: queda como primer movimiento del kardex. ¿Continuar?`)) return;
      registrarAperturaBodega();
    });
    document.querySelectorAll('[data-aprobar-mov]').forEach(btn=> btn.addEventListener('click', ()=> resolverMovimientoBodega(btn.dataset.aprobarMov, true)));
    document.querySelectorAll('[data-rechazar-mov]').forEach(btn=> btn.addEventListener('click', ()=> resolverMovimientoBodega(btn.dataset.rechazarMov, false)));
    document.querySelectorAll('[data-ver-fotos]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const fotos = JSON.parse(btn.dataset.verFotos);
        try{ const urls = await Promise.all(fotos.map(f=>crearUrlFirmada(f.foto_url))); setState({fotoModal:{urls, labels: fotos.map((f,i)=>`Foto ${i+1}`), index:0}}); }catch(e){ toast(e.message,'err'); }
      });
    });
  }
  if(state.view==='stock'){
    const form = document.getElementById('form-stock-bodega');
    if(form) form.addEventListener('submit', e=>{ e.preventDefault(); state.bodega.stockTexto = document.getElementById('stock-texto').value; cargarStockBodega(); });
    const btnExcel = document.getElementById('btn-exportar-stock');
    if(btnExcel) btnExcel.addEventListener('click', exportarStockExcel);
    const chkBajo = document.getElementById('stock-bajo-minimo');
    if(chkBajo) chkBajo.addEventListener('change', ()=>{ state.bodega.stockSoloBajoMinimo = chkBajo.checked; cargarStockBodega(); });
    document.querySelectorAll('.stock-tipo').forEach(sel=> sel.addEventListener('change', ()=> guardarTipoMaterial(sel.dataset.tipoSku, sel.value)));
    document.querySelectorAll('.stock-minimo').forEach(inp=>{
      inp.addEventListener('change', ()=> guardarStockMinimo(inp.dataset.minSku, inp.value));
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } });
    });
    document.querySelectorAll('.stock-costo').forEach(inp=>{
      inp.addEventListener('change', ()=> guardarCostoUnitario(inp.dataset.costoSku, inp.value));
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } });
    });
  }
  if(state.view==='reportes'){
    const form = document.getElementById('form-reportes-bodega');
    if(form) form.addEventListener('submit', e=>{
      e.preventDefault();
      state.bodega.reportes = {...state.bodega.reportes, desde: document.getElementById('rep-desde').value, hasta: document.getElementById('rep-hasta').value};
      cargarReportesBodega();
    });
    const btnRepExcel = document.getElementById('btn-exportar-reportes');
    if(btnRepExcel) btnRepExcel.addEventListener('click', exportarReporteBodegaExcel);
    const selCon = document.getElementById('rep-consumo-agrupar');
    if(selCon) selCon.addEventListener('change', ()=>{ state.bodega.reportes = {...state.bodega.reportes, consumoAgrupar: selCon.value}; cargarReportesBodega(); });
    const selIng = document.getElementById('rep-ingresos-agrupar');
    if(selIng) selIng.addEventListener('change', ()=>{ state.bodega.reportes = {...state.bodega.reportes, ingresosAgrupar: selIng.value}; cargarReportesBodega(); });
  }
  if(state.view==='config'){
    const formBodega = document.getElementById('form-nueva-bodega');
    if(formBodega) formBodega.addEventListener('submit', async e=>{
      e.preventDefault();
      const input = document.getElementById('nueva-bodega');
      if(await crearUbicacion(input.value, null)) input.value = '';
    });

    document.getElementById('form-plan').addEventListener('submit', async e=>{

      // Tres estados posibles del selector, y cada uno viaja distinto a crearPlanEntrada:

      // pero con ubicación específica cargada); cualquier otro valor -> esa bodega tal cual.
      const bodegaParaEnviar = bodegaSeleccionada===''? null : bodegaSeleccionada===BODEGA_VACIA? '' : bodegaSeleccionada;
      // "Seleccionar todos" marca cada storage bin visible, pero esa lista (igual que las de

      const chkBinTodos = document.getElementById('p-bin-todos');

      const seleccionBin = (chkBinTodos && chkBinTodos.checked) ? [] : [...selBinEl.selectedOptions].map(o=>o.value).filter(Boolean);
      // Cuando no hay storage bin cargado, #p-bin lista SKU en vez de bins (ver cargarBinsPara):
      // elegir alguno ahí significa "solo estos", el resto de los SKU de la ubicación se excluye.
      let storageBins = [], skusExcluidos = [];
      if(selBinEl.dataset.modo==='skus'){
        if(seleccionBin.length){
          const todosLosSkus = JSON.parse(selBinEl.dataset.skuCodes || '[]');
          skusExcluidos = todosLosSkus.filter(sku=>!seleccionBin.includes(sku));
        }
      }else{
        storageBins = seleccionBin;
      }
      const ubicacionElegida = document.getElementById('p-ubic').value.trim();
      // Aviso de solape (a pedido de Joel): si parte de lo que se va a agregar YA está cubierto
      // por otra entrada del plan de este período, avisar antes de crear la entrada -- con datos
      // reales, 3 entradas de ubicación completa solaparon 136 SKU con bins ya planificados en
      // otros días, y quedaban dos veces en el plan sin que nadie lo notara. Se compara el
      // universo completo (skus_planificables) contra el disponible (skus_disponibles_planificar,
      // que además saca lo ya cubierto por otra entrada); la diferencia es lo repetido. Solo avisa,
      // no bloquea: a veces se quiere igual (ej. recontar una ubicación entera). No aplica al modo
      // "SKU puntuales" (la lista que se ofrece ahí ya viene sin los ya planificados). Si el
      // conteo falla, no bloquea agregar.
      if(selBinEl.dataset.modo!=='skus'){
        try{
          const base = {bodega: soloSinUbicacion ? '' : bodegaParaEnviar, ubicacion: ubicacionElegida, excluidos:[], soloSinUbicacion};
          // Una consulta para todos los bins elegidos (in.(...)), no una por bin: con decenas de
          // bins marcados a mano eran cientos de viajes al servidor antes de poder agregar.
          const [total, disponibles] = await Promise.all([
            contarUniversoUbicacionPorBins(base, storageBins),
            contarUniversoUbicacionPorBins({...base, excluirYaPlanificados:true}, storageBins),
          ]);
          const yaPlanificados = total - disponibles;
          if(yaPlanificados>0 && !confirm(`${yaPlanificados} de los ${total} SKU de esta selección ya están planificados en otra entrada de este período y quedarían dos veces en el plan. ¿Agregar igual?`)) return;
        }catch(e){ /* el aviso es informativo: si no se pudo calcular, se agrega igual */ }
      }
      await crearPlanEntrada({
        fecha: document.getElementById('p-fecha').value,
        bodega: soloSinUbicacion ? '' : bodegaParaEnviar,
        ubicacion: ubicacionElegida,
        storageBins,
        skusExcluidos,
        soloSinUbicacion,
        // Sin selector propio (se sacó por duplicar el filtro "Período" de arriba de la
        // página): siempre queda en automático, el trigger del servidor la asigna al ciclo
        // marcado como actual.
        cicloId: '',
        responsableId: document.getElementById('p-responsable').value,
        nota: document.getElementById('p-nota').value.trim(),
      });
      await refrescarCascadaTrasAgregar();

    function resetPBin(){
      const selBin = document.getElementById('p-bin');
      const chkTodos = document.getElementById('p-bin-todos');
      const resumenBin = document.getElementById('p-bin-resumen');
      selBin.innerHTML = '<option value="">Elige ubicación específica primero</option>';
      selBin.disabled = true;
      selBin.dataset.modo = 'bins';
      delete selBin.dataset.opciones;
      delete selBin.dataset.totalSkuModoSkus;
      chkTodos.checked = false;
      chkTodos.disabled = true;
      resumenBin.textContent = '';
    }
    // Recalcula el resumen "(X bin / Y SKU)" (o su equivalente en modo SKU puntuales) según lo
    // que esté REALMENTE seleccionado en #p-bin en este momento, no solo el total cargado — a
    // pedido: antes el resumen se calculaba una sola vez al cargar la lista y no se movía aunque
    // la persona desmarcara bins puntuales a mano. Sin selección (o con todo marcado) se sigue
    // mostrando el total, que es lo que de verdad va a cubrir la entrada (ver "sin selección =
    // todos" en el submit de #form-plan).
    function actualizarResumenBin(){
      const selBin = document.getElementById('p-bin');
      const resumenBin = document.getElementById('p-bin-resumen');
      if(!selBin || !resumenBin) return;
      const seleccionados = [...(selBin.selectedOptions||[])].map(o=>o.value).filter(Boolean);
      if(selBin.dataset.modo==='skus'){
        const total = Number(selBin.dataset.totalSkuModoSkus||0);
        if(!total){ resumenBin.textContent = ''; return; }
        const esTodos = seleccionados.length===0 || seleccionados.length>=total;
        resumenBin.textContent = esTodos ? `(${total} SKU)` : `(${seleccionados.length} de ${total} SKU seleccionados)`;
        return;
      }
      let opciones = [];
      try{ opciones = JSON.parse(selBin.dataset.opciones || '[]'); }catch(e){ opciones = []; }
      if(!opciones.length){ resumenBin.textContent = ''; return; }
      const esTodos = seleccionados.length===0 || seleccionados.length>=opciones.length;
      const base = esTodos ? opciones : opciones.filter(o=>seleccionados.includes(o.storage_bin));
      const totalSkus = base.reduce((s,o)=> s+(Number(o.cantidad_skus)||0), 0);
      resumenBin.textContent = esTodos
        ? `(${opciones.length} bin / ${totalSkus} SKU)`
        : `(${seleccionados.length} de ${opciones.length} bin / ${totalSkus} SKU)`;
    }
    // Por arriba de esta cantidad de SKU sin bin, no tiene sentido listarlos uno a uno en el
    // <select> (se vuelve lento e inmanejable) — se deja solo el mensaje de "agregar igual".
    const MAX_SKU_SIN_BIN_LISTABLES = 300;
    // Compartida entre el cambio de bodega (que deja "Todas" elegido por defecto en Ubicación
    // específica sin que la persona toque nada) y el cambio de ubicación específica en sí.
    async function cargarBinsPara(bodega, ubicacion){
      if(!bodega){ resetPBin(); return; }
      const selBinInicial = document.getElementById('p-bin');
      const chkTodosInicial = document.getElementById('p-bin-todos');
      const resumenBinInicial = document.getElementById('p-bin-resumen');
      if(!selBinInicial || !chkTodosInicial || !resumenBinInicial) return; // no estamos mostrando el formulario "Agregar"
      // A diferencia del resto de las cargas de esta pantalla (opcionesBins/opcionesEspecificas,
      // que ya tragan sus propios errores), skusDeUbicacion() más abajo pagina con fetch() crudo
      // y no atrapa un corte de señal a mitad de camino — sin este try/catch, ese TypeError se
      // escapaba sin capturar en vez de mostrar un aviso como en cualquier otra pantalla.
      try{
      // "Todas" (ubicacion vacío) también debe mostrar los storage bin — de toda la bodega,
      // no solo de una ubicación específica — igual que ya pasa al elegir una en particular.
      selBinInicial.innerHTML = '<option value="">Cargando…</option>';
      selBinInicial.disabled = true;
      selBinInicial.dataset.modo = 'bins';
      chkTodosInicial.checked = false;
      chkTodosInicial.disabled = true;
      resumenBinInicial.textContent = '';
      const opciones = await opcionesBins(bodega, ubicacion);
      // Los elementos se buscan de nuevo ACÁ, después del await (y otra vez más abajo, tras el
      // segundo await): un render() de fondo puede haber reemplazado el formulario mientras
      // esperábamos la respuesta — mismo motivo que en cargarOpcionesEspecificasEnSelect. Escribir
      // sobre la referencia vieja quedaba en un nodo ya desprendido del DOM, invisible en pantalla:
      // bug real reportado, Storage bin se quedaba pegado en "Cargando…" (o con los datos de la
      // ubicación anterior) hasta que la persona volvía a tocar el selector a mano.
      let selBin = document.getElementById('p-bin');
      let chkTodos = document.getElementById('p-bin-todos');
      let hintBin = document.getElementById('p-bin-hint');
      let resumenBin = document.getElementById('p-bin-resumen');
      if(!selBin || !chkTodos || !hintBin || !resumenBin) return; // la vista cambió mientras esperábamos
      if(opciones.length){
        selBin.innerHTML = opciones.map(o=>`<option value="${esc(o.storage_bin)}">${esc(o.storage_bin)} — ${o.cantidad_skus} SKU</option>`).join('');
        // Foto bin -> cantidad_skus que actualizarResumenBin() usa para recalcular el resumen
        // cada vez que cambie la selección (no solo al cargar), sin tener que volver a pedirla.
        selBin.dataset.opciones = JSON.stringify(opciones.map(o=>({storage_bin:o.storage_bin, cantidad_skus:Number(o.cantidad_skus)||0})));
        delete selBin.dataset.totalSkuModoSkus;
        // A pedido: la lista carga con TODOS los storage bin ya marcados (visualmente explícito),
        // en vez de dejarla sin nada seleccionado confiando en la regla "sin selección = todos"
        // (que ya causó confusión — ver actualizarResumenBin). Se marca también "Seleccionar
        // todos" para que el submit siga mandando el comodín sin filtro (ver el comentario del
        // submit de #form-plan), no la lista exhaustiva de bins de este momento.
        if(selBin.options) [...selBin.options].forEach(o=>{ o.selected = true; });
        chkTodos.checked = true;
        hintBin.textContent = 'Vienen todos los storage bin marcados. Puedes dejarlos así o desmarcar los que no quieras incluir.';
        // Aclara que "12 elementos" (resumen nativo del navegador para el <select multiple>) son
        // storage bin, no SKU — bug real reportado: se entendía como 12 SKU y no cuadraba con el
        // total real, que suma los SKU de todos esos bins juntos (normalmente más que uno por bin).
        // Se recalcula en vivo con cada cambio de selección (ver el listener 'change' de #p-bin).
        actualizarResumenBin();
        selBin.disabled = false;
        chkTodos.disabled = false;
      }else{
        // Estos SKU no tienen storage bin cargado (ej. carga masiva sin esa columna): en vez de
        // dejar la caja vacía sin explicación, se listan los SKU de la ubicación para poder
        // elegir puntualmente cuáles incluir (misma mecánica de "sin selección = todos", pero
        // sobre SKU en vez de bins — ver el submit de #form-plan y crearPlanEntrada).
        const bodegaReal = bodega===BODEGA_VACIA ? '' : bodega;
        // La lista que se ofrece para elegir excluye los SKU que ya quedaron cubiertos por OTRA
        // entrada de plan (buena UX: no tiene sentido volver a ofrecerlos). Pero el submit calcula
        // "seleccionados = todos MENOS los elegidos" (ver el submit de #form-plan): si esa base
        // fuera la misma lista angosta, un SKU ya cubierto por otra entrada (invisible acá, así
        // que nunca queda "elegido") tampoco quedaría en la exclusión — y se colaría de nuevo en
        // el conteo de ESTA entrada (que sí usa el universo completo, sin ese filtro: ver el
        // comentario en contarUniversoUbicacion). Por eso se guarda acá la lista COMPLETA (sin
        // excluirYaPlanificados) como base real para calcular exclusiones, aunque el <select>
        // solo muestre/permita elegir de la lista angosta.
        // Solo id/código/descripción (no las 15 columnas) y con tope: si hay más SKU de los que se
        // pueden listar (MAX_SKU_SIN_BIN_LISTABLES), no se sigue paginando ni se pide el universo
        // completo -- con datos reales una ubicación sin bins puede tener 32.000 SKU (66 páginas
        // que se bajaban enteras para terminar mostrando "puedes agregar igual").
        const skus = await skusDeUbicacion({bodega:bodegaReal, ubicacion, storage_bin:'', excluidos:[], soloSinUbicacion:false, excluirYaPlanificados:true, campos:'id,sku_code,descripcion', maxFilas: MAX_SKU_SIN_BIN_LISTABLES+1});
        const skusUniversoCompleto = (skus.length && skus.length<=MAX_SKU_SIN_BIN_LISTABLES)
          ? await skusDeUbicacion({bodega:bodegaReal, ubicacion, storage_bin:'', excluidos:[], soloSinUbicacion:false, campos:'sku_code'})
          : [];
        // Elementos frescos otra vez, tras este segundo await.
        selBin = document.getElementById('p-bin');
        chkTodos = document.getElementById('p-bin-todos');
        hintBin = document.getElementById('p-bin-hint');
        resumenBin = document.getElementById('p-bin-resumen');
        if(!selBin || !chkTodos || !hintBin || !resumenBin) return; // la vista cambió mientras esperábamos
        if(skus.length && skus.length<=MAX_SKU_SIN_BIN_LISTABLES){
          selBin.dataset.modo = 'skus';
          selBin.dataset.skuCodes = JSON.stringify(skusUniversoCompleto.map(s=>s.sku_code));
          selBin.dataset.totalSkuModoSkus = String(skus.length);
          delete selBin.dataset.opciones;
          selBin.innerHTML = skus.map(s=>`<option value="${esc(s.sku_code)}">${esc(s.sku_code)} — ${esc(s.descripcion||'')}</option>`).join('');
          // Misma lógica que la lista de storage bin: carga con todos los SKU ya marcados.
          if(selBin.options) [...selBin.options].forEach(o=>{ o.selected = true; });
          chkTodos.checked = true;
          hintBin.textContent = 'No hay storage bin cargado para esta ubicación: puedes elegir SKU puntuales. Vienen todos marcados; desmarca los que no quieras incluir.';
          actualizarResumenBin();
        }else{
          selBin.innerHTML = '';
          delete selBin.dataset.opciones;
          delete selBin.dataset.totalSkuModoSkus;
          resumenBin.textContent = '';
          hintBin.textContent = 'No hay storage bin cargado para esta ubicación. Puedes agregar igual: la planificación cubrirá toda la ubicación elegida.';
        }
        selBin.disabled = false;
        chkTodos.disabled = false;
      }
      }catch(e){ toast(e.message,'err'); }
    }
    // Recarga las opciones de Ubicación específica (con su conteo pendiente/total) para la

    // ese mismo valor — compartida entre el cambio de bodega (que siempre vuelve a "Todas") y el
    // refresco tras agregar una entrada (que intenta conservar la ubicación ya elegida).
    async function cargarOpcionesEspecificasEnSelect(bodega, valorPreferido){
      const opciones = await opcionesEspecificas(bodega);
      // El <select> se busca ACÁ, después del await: un render() de fondo (p.ej. el que dispara
      // cargarPlanSemanal justo tras agregar una entrada) puede reemplazar el formulario mientras
      // esperábamos la respuesta. Buscarlo antes del await escribía sobre un nodo ya desprendido
      // del DOM (invisible en pantalla) — bug real reportado: las cantidades ("6/8", etc.) se
      // quedaban con el valor viejo hasta que la persona volvía a tocar el selector a mano.
      const selUbic = document.getElementById('p-ubic');

      selUbic.innerHTML = `<option value="">Todas${bodegaObj? ` (${bodegaObj.cantidad_pendiente}/${bodegaObj.cantidad_skus})` : ''}</option>` + opciones.map(o=>`<option value="${esc(o.ubicacion)}">${esc(o.ubicacion)} (${o.cantidad_pendiente}/${o.cantidad_skus})</option>`).join('');
      selUbic.disabled = false;
      selUbic.value = (valorPreferido && opciones.some(o=>o.ubicacion===valorPreferido)) ? valorPreferido : '';
      return selUbic.value;
    }

    async function refrescarCascadaTrasAgregar(){

    // o varios storage bin a mano en la lista, el checkbox seguía marcado (nada lo desmarcaba) y
    // el submit mandaba "sin filtro" (todos) ignorando por completo la selección manual. Cualquier
    // cambio hecho a mano en la lista debe desmarcar "Seleccionar todos" para que el submit respete
    // la selección real.
    document.getElementById('p-bin').addEventListener('change', ()=>{
      document.getElementById('p-bin-todos').checked = false;
      // A pedido: el resumen "(X bin / Y SKU)" debe reflejar en vivo lo que la persona vaya
      // marcando/desmarcando a mano, no solo el total de cuando se cargó la lista.
      actualizarResumenBin();
    });
    document.querySelectorAll('[data-borrar-plan]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await confirmarYBorrarPlanEntrada(btn.dataset.borrarPlan);
        await refrescarCascadaTrasAgregar();
      });
    });
    document.querySelectorAll('.plan-select-check').forEach(chk=>{
      chk.addEventListener('change', ()=> alternarSeleccionPlan(chk.dataset.selectPlan));
    });
    const chkTodoPlan = document.getElementById('chk-seleccionar-todo-plan');
    if(chkTodoPlan) chkTodoPlan.addEventListener('change', alternarSeleccionTodoPlan);
    const btnBorrarSeleccion = document.getElementById('btn-borrar-seleccion-plan');
    if(btnBorrarSeleccion) btnBorrarSeleccion.addEventListener('click', async ()=>{
      await confirmarYBorrarSeleccionPlan();
      await refrescarCascadaTrasAgregar();
    });
    const btnReasignarSeleccion = document.getElementById('btn-reasignar-seleccion-plan');
    if(btnReasignarSeleccion) btnReasignarSeleccion.addEventListener('click', ()=>{
      const sel = document.getElementById('plan-reasignar-select');
      if(sel.value==='__elegir__'){ toast('Elige a quién reasignar primero','err'); return; }
      reasignarResponsableSeleccionPlan(sel.value);
    });
    const btnCancelarSeleccion = document.getElementById('btn-cancelar-seleccion-plan');
    if(btnCancelarSeleccion) btnCancelarSeleccion.addEventListener('click', ()=> setState({plan:{...state.plan, seleccionados:[]}}));
    document.querySelectorAll('.plan-sku-quitar').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await excluirSkuDePlan(btn.dataset.planId, btn.dataset.skuCode);
        await refrescarCascadaTrasAgregar();
      });
    });
    document.querySelectorAll('[data-editar-plan]').forEach(btn=>{
      btn.addEventListener('click', ()=> setState({plan:{...state.plan, editando: btn.dataset.editarPlan}}));
    });
    document.querySelectorAll('[data-cancelar-plan]').forEach(btn=>{
      btn.addEventListener('click', ()=> setState({plan:{...state.plan, editando: null}}));
    });
    document.querySelectorAll('[data-guardar-plan]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.guardarPlan;
        actualizarPlanEntrada(id, {
          fecha: document.getElementById(`pe-fecha-${id}`).value,
          responsableId: document.getElementById(`pe-responsable-${id}`).value,
          nota: document.getElementById(`pe-nota-${id}`).value.trim(),
        });
      });
    });
  }
}

async function iniciarApp(){
  // Service Worker: cachea el app shell para que la app siga abriendo sin conexión.
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  }
  // Al recuperar la señal, intentamos enviar los conteos que quedaron guardados sin conexión.
  // .catch() explícito: sincronizarColaOffline() es async y el navegador no espera ni atrapa lo
  // que devuelva un listener nativo — cualquier falla que en el futuro se le escape a su propio
  // try/catch quedaría como promesa rechazada sin capturar en vez de un toast.
  window.addEventListener('online', ()=> sincronizarColaOffline().catch(e=>toast(e.message,'err')));
  // Red de seguridad global (Sentry #227) -- ver mensajeParaRechazoNoCapturado más arriba.
  window.addEventListener('unhandledrejection', e=> toast(mensajeParaRechazoNoCapturado(e.reason), 'err'));
  // Ver alVolverAPrimerPlano: la PWA puede quedar abierta de un día para otro.
  document.addEventListener('visibilitychange', alVolverAPrimerPlano);
  window.addEventListener('focus', alVolverAPrimerPlano);
  procesarRetornoFlow();
  procesarRegistroPlanDesdeUrl();
  await procesarLlegadaPorInvitacion();
  if(!state.debeCrearPassword) await restaurarSesionGuardada();
  // Ver verificarVersionNueva: fija la versión publicada al arrancar y la revisa cada 15 min.
  verificarVersionNueva();
  setInterval(()=>{ verificarVersionNueva(); }, VERSION_CHECK_CADA_MS);
  if(state.avisoFlow){
    const ok = state.avisoFlow === 'ok';
    state.avisoFlow = null;
    if(state.perfil) setState({view:'config'});
    toast(ok? 'Tarjeta registrada, tu plan quedó activo' : 'No se pudo completar la suscripción, intenta de nuevo', ok?'ok':'err');
  }
  render();
}
iniciarApp();
</script>
