/* =======================================================================
   CARGA DE DATOS
   ======================================================================= */
/* ---- Arranque por pestaña -------------------------------------------------------------
   Antes cargarTodo() disparaba ~25 consultas en paralelo al iniciar sesión (dashboard completo,
   filtros de categorías/unidades/batches, resumen ABC, ubicaciones generales, reconteos, página
   de SKU, planificación...), casi todas agregados sobre los 63.000 SKU de una empresa real, y se
   estorbaban entre sí: medido en producción, la misma consulta tardaba 3 veces más en el arranque
   que sola. Y se cargaban para todos, incluido un operador que solo va a Contar. Ahora al arrancar
   va solo lo transversal (maestro para el buscador/escáner, períodos, cola offline) y cada pestaña
   pide lo suyo la primera vez que se muestra (ver asegurarDatosDeVista); las acciones que antes
   recargaban todo refrescan solo lo que ya está cargado (refrescarSiCargada). */
async function cargarTodo(){
  // cargarPlanSemanal() no va acá: la primera carga la hace la pestaña Plan al mostrarse (ver
  // refrescarPlanSiCorresponde); cargarCiclos() solo fija el período preseleccionado.
  const tareas = [cargarSkus(), cargarCiclos(), sincronizarColaOffline(), asegurarDatosDeVista(state.view)];
  await Promise.all(tareas);
}

// Qué necesita cada pestaña (claves de CARGADORES). Buscar solo usa los períodos (transversal);
// Calendario y Grupos ya cargan lo suyo con su propio flag `cargado`.
const CARGAS_POR_VISTA = {
  dashboard: ['dashboard'], // una sola llamada: trae el panel, el estado del maestro y las tarjetas de bodega
  skus: ['skusPagina', 'opcionesSku', 'generales', 'ubicaciones'],
  reconteo: ['reconteos'],
  plan: ['plan', 'generales', 'sinUbicacion', 'responsables'],
  inicio: ['bodegaPendientes'],
  ingreso: ['bodegaListas', 'responsables'],
  salida: ['bodegaListas', 'responsables'],
  movimientos: ['bodegaMovimientos', 'bodegaPendientes', 'bodegaValorizacion'],
  stock: ['bodegaStock', 'bodegaValorizacion'],
  reportes: ['bodegaReportes'],
  config: ['bodegaListas', 'ubicaciones'],
};
const CARGADORES = {
  dashboard: ()=> cargarDashboard(), // trae también el resumen del maestro, en la misma respuesta
  skusPagina: ()=> cargarSkusPagina(state.skusPagina.page||0),
  opcionesSku: ()=> cargarOpcionesCategoriasUnidades(),
  generales: ()=> cargarOpcionesGenerales(),
  sinUbicacion: ()=> cargarConteoSinUbicacion(),
  responsables: ()=> cargarResponsables(),
  bodegaListas: ()=> cargarListasBodega(),
  ubicaciones: ()=> cargarUbicaciones(),
  bodegaMovimientos: ()=> cargarMovimientosBodega(),
  bodegaPendientes: ()=> cargarPendientesBodega(),
  bodegaStock: ()=> cargarStockBodega(),
  bodegaValorizacion: ()=> moduloBodegaActivo() ? cargarValorizacionBodega() : Promise.resolve(),
  bodegaReportes: ()=> cargarReportesBodega(),
  reconteos: ()=> cargarReconteos(),
  plan: ()=> refrescarPlanSiCorresponde(),
};
const cargasHechas = new Set();
let vistaAseguradaAnterior = null;
function asegurarDatosDeVista(vista){
  if(!state.perfil) return Promise.resolve();
  const pendientes = (CARGAS_POR_VISTA[vista]||[]).filter(k=>!cargasHechas.has(k));
  pendientes.forEach(k=> cargasHechas.add(k));
  return Promise.all(pendientes.map(k=> Promise.resolve().then(()=> CARGADORES[k]()).catch(()=>{})));
}
// Tras una acción que cambia datos (conteo guardado, cola offline sincronizada, carga masiva):
// recarga solo lo que alguna pestaña ya pidió; lo demás se pedirá fresco cuando se muestre.
function refrescarSiCargada(claves){
  claves.forEach(k=>{ if(cargasHechas.has(k) && CARGADORES[k]) Promise.resolve().then(()=> CARGADORES[k]()).catch(()=>{}); });
}
function olvidarCargasPorVista(){ cargasHechas.clear(); vistaAseguradaAnterior = null; }

async function cargarSkus(){
  try{
    // skus_lectura (no /skus directo): con conteo ciego activo, esta lista alimenta la selección
    // por código/escáner en Contar -- necesita el mismo enmascarado de stock que el resto.
    const rows = await rest(`/skus_lectura?activo=eq.true&order=sku_code.asc&limit=500`);
    setState({skus: rows||[]});
  }catch(e){ toast(e.message,'err'); }
}

// Buscador libre de SKU en Contar ("Agregar algo fuera del plan"): busca en el servidor contra
// el maestro completo (no solo los 500 SKU precargados en `state.skus`), con debounce para no
// disparar una consulta por cada tecla, y un tope de resultados (8, igual que el resto de los
// pickers de la app) para que la respuesta sea liviana. `peticionId` descarta respuestas que
// lleguen fuera de orden (ej. si la red demora y la persona ya siguió escribiendo).
let debounceBuscadorLibre = null;
let buscadorLibrePeticionId = 0;

function resetBuscadorLibre(){
  clearTimeout(debounceBuscadorLibre);
  buscadorLibrePeticionId++;
  return { resultados: [], buscando: false };
}

// Bug real reportado (Joel, en iPad y en computador): cada tecleo en "Agregar algo fuera del
// plan" disparaba un setState() que reconstruye TODA la pantalla por innerHTML -- el <input> se
// destruye y nace uno nuevo sin foco. Restaurar el foco por código después ayuda en escritorio,
// pero en iOS Safari el teclado en pantalla se cierra apenas el elemento se destruye y no
// siempre vuelve a abrirse solo porque se llame .focus() después (necesita estar atado al mismo
// gesto del usuario). La solución de fondo es que el <input> nunca se destruya mientras se
// escribe: acá NO se llama a setState() -- se actualiza el estado directo y se repinta a mano
// SOLO el contenedor de resultados (#buscador-libre-resultados, ver renderResultadosBuscadorLibre),
// dejando el <input> intacto en todo momento.
function escribirBuscadorLibre(texto){
  const q = texto.trim();
  clearTimeout(debounceBuscadorLibre);
  state.skuSearch = texto;
  state.buscadorLibre = { resultados: q.length>=2? state.buscadorLibre.resultados : [], buscando: q.length>=2 };
  actualizarResultadosBuscadorLibreEnPantalla();
  if(q.length < 2) { buscadorLibrePeticionId++; return; }
  debounceBuscadorLibre = setTimeout(()=> buscarSkusLibre(q), 350);
}

// Repinta solo #buscador-libre-resultados con el estado actual, sin tocar el resto de la
// pantalla (ni el <input> de búsqueda) -- ver escribirBuscadorLibre. Si el contenedor no está en
// pantalla (por ejemplo, ya se eligió un SKU y cambió la vista mientras la búsqueda seguía en
// vuelo), no hace nada: no hay nada que pintar ni foco que proteger.
function actualizarResultadosBuscadorLibreEnPantalla(){
  const cont = document.getElementById('buscador-libre-resultados');
  if(!cont) return;
  cont.innerHTML = renderResultadosBuscadorLibre();
  bindBuscadorLibreResultados();
}

function bindBuscadorLibreResultados(){
  document.querySelectorAll('[data-pick-btn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      // El resultado viene del buscador libre (servidor, ver escribirBuscadorLibre), no
      // necesariamente está en state.skus (que solo trae los primeros 500 SKU activos) —
      // state.skus queda de respaldo por si acaso, mismo patrón que data-pick-plan.
      const sku = state.buscadorLibre.resultados.find(s=>s.id===btn.dataset.pickBtn)
        || state.skus.find(s=>s.id===btn.dataset.pickBtn);
      if(!sku) return;
      // Si el SKU tecleado está en el plan del día de esta persona, el conteo es "Plan" aunque
      // no lo haya tocado en la lista (pedido de Joel) -- ver origenPlanParaSku.
      setState({skuSeleccionado: sku, conteoOrigenPlan: origenPlanParaSku(sku), conteoOtraUbicacion:false});
    });
  });
}

async function buscarSkusLibre(texto){
  const miPeticion = ++buscadorLibrePeticionId;
  const t = sanearTextoFiltro(texto);
  try{
    const rows = t? await rest(`/skus_lectura?activo=eq.true&select=id,sku_code,descripcion,bodega,ubicacion,storage_bin,batch,stock_sistema,unidad_medida,critico,clase_abc,stock_bloqueado,stock_transito_1,stock_transito_2,stock_transferencia&or=(sku_code.ilike.*${encodeURIComponent(t)}*,descripcion.ilike.*${encodeURIComponent(t)}*)&order=sku_code.asc&limit=8`) : [];
    if(miPeticion !== buscadorLibrePeticionId) return; // respuesta obsoleta: se siguió escribiendo
    state.buscadorLibre = { resultados: rows||[], buscando: false };
    actualizarResultadosBuscadorLibreEnPantalla();
  }catch(e){
    if(miPeticion !== buscadorLibrePeticionId) return;
    state.buscadorLibre = { resultados: [], buscando: false };
    actualizarResultadosBuscadorLibreEnPantalla();
    toast(e.message,'err');
  }
}

let conteoVecesPeriodoPeticionId = 0;
// Avisa en la tarjeta del SKU elegido en Contar si ya se contó en el período (ciclo) actual y
// cuántas veces (RPC veces_contado_periodo, ver migración) -- para no duplicar trabajo si dos
// personas cuentan el mismo material sin saberlo (a pedido de Joel). Se dispara solo, en segundo
// plano, la primera vez que se pinta la tarjeta de cada SKU (ver bind() de la vista Contar); si
// falla, simplemente no se muestra el aviso, no bloquea el conteo.
async function cargarVecesContadoPeriodo(sku){
  // Marca "cargando" de inmediato (mutación directa, sin setState/render) para que el guard en
  // bind() no dispare una segunda consulta mientras esta sigue en vuelo -- mismo patrón que
  // buscadorLibrePeticionId/escribirBuscadorLibre.
  state.conteoVecesPeriodo = {skuId: sku.id, veces:null, cargando:true};
  const miPeticion = ++conteoVecesPeriodoPeticionId;
  try{
    const veces = await rest('/rpc/veces_contado_periodo', {method:'POST', body:{p_sku_id: sku.id}});
    if(miPeticion !== conteoVecesPeriodoPeticionId) return; // se eligió otro SKU mientras tanto
    setState({conteoVecesPeriodo: {skuId: sku.id, veces: Number(veces)||0, cargando:false}});
  }catch(e){
    if(miPeticion !== conteoVecesPeriodoPeticionId) return;
    setState({conteoVecesPeriodo: {skuId: sku.id, veces:null, cargando:false}});
  }
}

// Página del listado de SKUs (tabla "SKU activos"), con conteo exacto vía Prefer: count=exact
// para poder mostrar Anterior/Siguiente y ver el 100% de los materiales, no solo los primeros 500.
async function fetchSkusPagina(page){
  const from = page*SKUS_POR_PAGINA;
  const to = from + SKUS_POR_PAGINA - 1;
  // skus_lectura (no /skus directo): esta tabla la ve también un operador (no es solo-admin, ver
  // VISTAS_SOLO_ADMIN), así que necesita el mismo enmascarado de stock que el resto.
  const res = await fetch(`${SUPABASE_URL}/rest/v1/skus_lectura?activo=eq.true&order=sku_code.asc`, {
    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
      'Range-Unit': 'items',
      'Range': `${from}-${to}`,
      'Prefer': 'count=exact',
    }
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : [];
  if(!res.ok){ throw new Error((data && data.message) || res.statusText || 'Error de base de datos'); }
  const range = res.headers.get('content-range'); // ej. "0-49/1410"
  const total = range && range.includes('/') ? Number(range.split('/')[1]) : data.length;
  return { data, total };
}

async function cargarSkusPagina(page=0){
  try{
    const { data, total } = await fetchSkusPagina(page);
    const rows = data||[];
    // Estado del último conteo de cada SKU de esta página (para el ícono verde/amarillo/rojo
    // según si cuadró, quedó con sobrante o con faltante) — consulta aparte porque
    // ultimo_conteo_por_sku es una vista sin FK declarada hacia skus, así que PostgREST no la
    // puede traer embebida automáticamente.
    if(rows.length){
      try{
        const ids = rows.map(r=>r.id).join(',');
        const estados = await rest(`/ultimo_conteo_por_sku?sku_id=in.(${ids})&select=sku_id,estado,diferencia`);
        const porSku = new Map((estados||[]).map(e=>[e.sku_id, e]));
        rows.forEach(r=>{
          const e = porSku.get(r.id);
          r.ultimoEstado = e ? e.estado : null;
          r.ultimaDiferencia = e ? e.diferencia : null;
        });
      }catch(e){ /* si falla, la tabla igual se ve, solo sin el ícono */ }
      // Clase ABC (ver skus_valor_abc): consulta aparte porque vive en una vista sin FK declarada
      // hacia skus, igual que ultimo_conteo_por_sku arriba.
      try{
        const ids = rows.map(r=>r.id).join(',');
        const clases = await rest(`/skus_valor_abc?sku_id=in.(${ids})&select=sku_id,clase_abc`);
        const claseSku = new Map((clases||[]).map(c=>[c.sku_id, c.clase_abc]));
        rows.forEach(r=>{ r.clase_abc = claseSku.get(r.id) || null; });
      }catch(e){ /* si falla, la tabla igual se ve, solo sin el badge de clase */ }
    }
    setState({skusPagina: { rows, page, total: total||0 }, skusSeleccionados: []});
  }catch(e){ toast(e.message,'err'); }
}

async function eliminarSkusSeleccionados(){
  const ids = state.skusSeleccionados;
  if(!ids.length) return;
  if(!confirm(`¿Eliminar ${ids.length} SKU? Esta acción no se puede deshacer.`)) return;
  setState({loading:true});
  try{
    // Un SKU con conteos ya registrados no se puede borrar (protegido por la base de datos):
    // los separamos primero para avisar cuáles se saltaron, en vez de que falle todo el lote.
    const conteosExistentes = await rest(`/conteos?select=sku_id&sku_id=in.(${ids.join(',')})`);
    const idsConConteos = new Set((conteosExistentes||[]).map(c=>c.sku_id));
    const idsABorrar = ids.filter(id=>!idsConConteos.has(id));
    if(idsABorrar.length) await rest(`/skus?id=in.(${idsABorrar.join(',')})`, {method:'DELETE'});
    const omitidos = ids.length - idsABorrar.length;
    if(!omitidos){
      toast(`${idsABorrar.length} SKU eliminados`);
    }else if(idsABorrar.length){
      toast(`${idsABorrar.length} SKU eliminados. ${omitidos} no se eliminaron: ya tienen conteos registrados (desactívalos en vez de eliminarlos).`, 'err');
    }else{
      toast('No se eliminó ningún SKU: todos ya tienen conteos registrados. Desactívalos en vez de eliminarlos.', 'err');
    }
    setState({loading:false});
    refrescarListaSkus();
  }catch(e){
    setState({loading:false});
    toast(e.message,'err');
  }
}

// Borra de una sola vez todos los SKU de la empresa que todavía no tienen ningún conteo
// registrado (no solo los de la página actual). Los que ya se contaron quedan protegidos
// por la base de datos, igual que en eliminarSkusSeleccionados.

/* =======================================================================
   PLANIFICACIÓN SEMANAL — por ubicación (bodega), ubicación específica y storage bin
   ======================================================================= */
function fechaISO(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function sumarDias(d, n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function inicioSemana(d){
  const date = new Date(d);
  const dia = date.getDay(); // 0=domingo .. 6=sabado
  const diff = dia===0 ? -6 : 1-dia; // retrocede hasta el lunes
  date.setDate(date.getDate()+diff);
  date.setHours(0,0,0,0);
  return date;
}

// Arma el filtro PostgREST que excluye del cálculo los SKU quitados a mano de una entrada del plan.
function filtroExclusion(excluidos){
  if(!excluidos || !excluidos.length) return '';
  return `&sku_code=not.in.(${excluidos.map(s=>encodeURIComponent(s)).join(',')})`;
}

// SKU "sueltos": sin ubicación general ni específica (ver renderPlanificacion / crearPlanEntrada).
// Las vistas ubicaciones_generales/especificas/bins los excluyen a propósito (agrupan solo lo que
// tiene bodega/ubicacion), así que para plani­ficarlos hay que filtrar explícitamente is.null.
function filtroSoloSinUbicacion(soloSinUbicacion){
  return soloSinUbicacion ? '&bodega=is.null&ubicacion=is.null' : '';
}

// bodega==='' es el caso "Sin bodega asignada" (BODEGA_VACIA ya resuelto a '' antes de
// llegar acá): filtra bodega IS NULL en la base. Distinto de bodega==null/undefined, que
// significa "sin filtro, cualquier bodega" — el campo se dejó opcionalmente en blanco al
// planificar (comodín ya existente, no confundir con el caso anterior).
function filtroBodega(bodega){
  if(bodega==='') return '&bodega=is.null';
  if(bodega) return `&bodega=eq.${encodeURIComponent(bodega)}`;
  return '';
}

// Usa skus_planificables (no skus): un SKU ya contado en el ciclo actual (con diferencia o
// sin ella) no debe seguir ofreciéndose para planificar — planificarlo de nuevo solo confunde.
// excluirYaPlanificados además saca los que ya están cubiertos por OTRA entrada de plan_semanal
// vigente (skus_disponibles_planificar) — solo para armar una entrada NUEVA. No usar esto para
// calcular el universo/detalle de una entrada YA CREADA: se anularía a sí misma (todo lo que
// cubre "ya está planificado" por ella).
// storage_bin puede ser un texto (un bin: eq.) o una lista de bins (in.(...)): una sola consulta
// para varios bins en vez de una por bin -- ver contarUniversoUbicacionPorBins/skusDeUbicacionPorBins.
function filtroBin(storage_bin){
  if(Array.isArray(storage_bin)){
    const bins = storage_bin.filter(Boolean);
    if(!bins.length) return '';
    if(bins.length===1) return `&storage_bin=eq.${encodeURIComponent(bins[0])}`;
    return `&storage_bin=in.(${bins.map(b=>encodeURIComponent('"'+b.replace(/"/g,'\\"')+'"')).join(',')})`;
  }
  return storage_bin ? `&storage_bin=eq.${encodeURIComponent(storage_bin)}` : '';
}

// Columnas del universo de SKU que usa Contar/Planificación cuando necesita el detalle completo.
const CAMPOS_UNIVERSO_SKU = 'id,sku_code,descripcion,bodega,ubicacion,storage_bin,batch,unidad_medida,stock_sistema,critico,clase_abc,stock_bloqueado,stock_transito_1,stock_transito_2,stock_transferencia';
// Tope de bins por consulta in.(...): mantiene la URL corta (PostgREST la rechaza si es enorme).
const BINS_POR_CONSULTA = 80;

async function contarUniversoUbicacion({bodega, ubicacion, storage_bin, excluidos, soloSinUbicacion, ubicacionEsNula, excluirYaPlanificados}){
  let filtro = `/${excluirYaPlanificados ? 'skus_disponibles_planificar' : 'skus_planificables'}?activo=eq.true`;
  if(soloSinUbicacion){
    filtro += filtroSoloSinUbicacion(true);
  }else{
    filtro += filtroBodega(bodega);
    // ubicacionEsNula: "esta bodega, sin ubicación específica" (bodega conocida, ubicacion IS
    // NULL) -- distinto de omitir el filtro (que traería TODAS las ubicaciones de la bodega) y
    // distinto de soloSinUbicacion (que además exige bodega IS NULL). Ver conversación con Joel
    // sobre las zonas "sin ubicación" que quedaban fuera del plan automático de Grupos.
    if(ubicacionEsNula) filtro += '&ubicacion=is.null';
    else if(ubicacion) filtro += `&ubicacion=eq.${encodeURIComponent(ubicacion)}`;
    filtro += filtroBin(storage_bin);
  }
  filtro += filtroExclusion(excluidos);
  const res = await fetchConTimeout(`${SUPABASE_URL}/rest/v1${filtro}`, {
    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
      'Range-Unit': 'items',
      'Range': '0-0',
      'Prefer': 'count=exact',
    }
  });
  const range = res.headers.get('content-range');
  return range && range.includes('/') ? Number(range.split('/')[1]) : 0;
}

// Trae el detalle completo (no solo el conteo) de los SKU de una ubicación planificada,
// paginando de a 1000 filas vía Range para no chocar con el límite de fila de PostgREST.
// campos: columnas a traer (por defecto el detalle completo, CAMPOS_UNIVERSO_SKU); cuando solo
// hacen falta códigos/ids (exclusiones, fotos del plan, listar SKU) se pide lo mínimo -- con
// ubicaciones de decenas de miles de SKU la diferencia de bytes es grande. maxFilas: deja de
// paginar al llegar a ese tope (quien llama solo quiere saber si hay "más de N").
async function skusDeUbicacion({bodega, ubicacion, storage_bin, excluidos, soloSinUbicacion, ubicacionEsNula, excluirYaPlanificados, campos, maxFilas}){
  let filtro = `/${excluirYaPlanificados ? 'skus_disponibles_planificar' : 'skus_planificables'}?activo=eq.true&select=${campos || CAMPOS_UNIVERSO_SKU}&order=storage_bin.asc,sku_code.asc`;
  if(soloSinUbicacion){
    filtro += filtroSoloSinUbicacion(true);
  }else{
    filtro += filtroBodega(bodega);
    // Ver el mismo comentario en contarUniversoUbicacion sobre ubicacionEsNula.
    if(ubicacionEsNula) filtro += '&ubicacion=is.null';
    else if(ubicacion) filtro += `&ubicacion=eq.${encodeURIComponent(ubicacion)}`;
    filtro += filtroBin(storage_bin);
  }
  filtro += filtroExclusion(excluidos);
  const TAM_PAGINA = maxFilas ? Math.min(1000, maxFilas) : 1000;
  let desde = 0, total = Infinity, filas = [];
  while(desde < total){
    const res = await fetchConTimeout(`${SUPABASE_URL}/rest/v1${filtro}`, {
      headers:{
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
        'Range-Unit': 'items',
        'Range': `${desde}-${desde+TAM_PAGINA-1}`,
        'Prefer': 'count=exact',
      }
    });
    const text = await res.text();
    const data = text ? JSON.parse(text) : [];
    if(!res.ok){ throw new Error((data && data.message) || res.statusText || 'Error de base de datos'); }
    filas = filas.concat(data);
    const range = res.headers.get('content-range');
    total = range && range.includes('/') ? Number(range.split('/')[1]) : filas.length;
    desde += TAM_PAGINA;
    if(!data.length) break;
    if(maxFilas && filas.length >= maxFilas) break;
  }
  return filas;
}

// Varios storage bin de una misma bodega+ubicación en UNA consulta (in.(...)) en vez de una por
// bin, en tandas de BINS_POR_CONSULTA. Con datos reales (Escondida, B521/0105 tiene 148 bins) el
// formulario de Planificación y el generador de Grupos hacían cientos de viajes al servidor por
// una sola acción; ahora son uno o dos. Devuelve un Map bin -> filas (los bins sin SKU quedan con []).
async function skusDeUbicacionPorBins(base, bins, campos){
  const unicos = [...new Set(bins.filter(Boolean))];
  const porBin = new Map(unicos.map(b=>[b, []]));
  for(let i=0; i<unicos.length; i+=BINS_POR_CONSULTA){
    const tanda = unicos.slice(i, i+BINS_POR_CONSULTA);
    const filas = await skusDeUbicacion({...base, storage_bin: tanda, campos: campos || 'id,sku_code,storage_bin'});
    for(const f of filas){ if(porBin.has(f.storage_bin)) porBin.get(f.storage_bin).push(f); }
  }
  return porBin;
}

// Cuenta el universo de varios storage bin (o de toda la selección si la lista viene vacía) en
// una sola consulta por tanda, en vez de una por bin.
async function contarUniversoUbicacionPorBins(base, bins){
  const unicos = [...new Set((bins||[]).filter(Boolean))];
  if(!unicos.length) return contarUniversoUbicacion({...base, storage_bin: ''});
  let total = 0;
  for(let i=0; i<unicos.length; i+=BINS_POR_CONSULTA){
    total += await contarUniversoUbicacion({...base, storage_bin: unicos.slice(i, i+BINS_POR_CONSULTA)});
  }
  return total;
}

// Universo completo (todas las columnas que usa Contar) de VARIAS entradas del plan en UNA sola
// respuesta, agrupado por plan_id: { "<plan_id>": [{id, sku_code, ..., stock_transferencia}] }.
// Historia: el plan del día en Contar pedía skus_universo_entrada_plan una vez POR ENTRADA (con
// 20-30 entradas por día en datos reales eran 20-30 viajes al servidor cada vez que la persona
// elegía bodega+ubicación, justo a la hora en que todos abren su plan). Ahora es un solo RPC,
// igual que ya se hizo en Planificación (universoEntradasPlanResumen). Manda solo los plan_id: la
// exclusión (plan_semanal_exclusiones, que puede ser de miles de SKU) la resuelve el servidor, así
// que nunca viaja por la URL (bug real "Cargando SKU…" con entradas de grupos grandes). Una
// entrada sin SKU no viene como clave: el que llama la trata como [].
async function universoEntradasPlanContar(planIds){ return rpcUniversoEntradasPlan('universo_entradas_plan_contar', planIds); }

// Universo/detalle de VARIAS entradas de una vez, agregado por el servidor en UNA sola respuesta
// (universo_entradas_plan_resumen: { "<plan_id>": [{id, sku_code, descripcion}, ...] }).
// Historia: cargarPlanSemanal() mandaba una llamada paralela por cada entrada visible; con cientos
// de entradas eso saturaba el pool de conexiones. Se pasó a un solo RPC en lote paginado de a
// 1.000 filas (skus_universo_entrada_plan_lote) -- pero PostgREST vuelve a ejecutar la función
// completa por CADA página, así que el período completo (3.062 filas con datos reales) eran 4
// ejecuciones de 6-19 s cada una en producción, y mientras corrían dejaban sin CPU al resto de la
// app (bug real reportado por Joel: "351 no funciona bien"). Ahora es una sola ejecución (1,6 s
// medidos con RLS), sin Range ni count, y solo con las 3 columnas que usa la pantalla (id para
// deduplicar SKU cubiertos por más de una entrada, sku_code y descripcion para el listado).
// Una entrada sin SKU no viene como clave: el que llama la trata como [].
async function universoEntradasPlanResumen(planIds){ return rpcUniversoEntradasPlan('universo_entradas_plan_resumen', planIds); }
// Hoja de conteo (Exportar PDF): el listado completo por entrada con las columnas que imprime la
// hoja (sku_code, descripcion, storage_bin, unidad_medida, clase_abc, critico). Antes el PDF
// pedía el universo entrada por entrada (375 consultas seguidas con el período real).
async function universoEntradasPlanHoja(planIds){ return rpcUniversoEntradasPlan('universo_entradas_plan_hoja', planIds); }
async function rpcUniversoEntradasPlan(nombre, planIds){
  if(!planIds.length) return {};
  const res = await fetchConTimeout(`${SUPABASE_URL}/rest/v1/rpc/${nombre}`, {
    method: 'POST',
    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({p_plan_ids: planIds}),
  }, TIMEOUT_UNIVERSO_PLAN_MS);
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if(!res.ok){ throw new Error((data && data.message) || res.statusText || 'Error de base de datos'); }
  if(!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('respuesta inesperada del servidor');
  return data;
}

// Resumen sin SKU para las ventanas grandes de Planificación (Mes, Año, Período): por entrada,
// cuántos SKU cubre (total) y cuántos NO están ya cubiertos por una entrada anterior del mismo
// conjunto (propios). Es lo único que necesita la vista resumida -- unas pocas filas en vez de
// bajar miles de SKU que la pantalla no va a listar (idea de Joel: "que no sature la app").
async function resumenEntradasPlan(planIds){
  if(!planIds.length) return [];
  const res = await fetchConTimeout(`${SUPABASE_URL}/rest/v1/rpc/resumen_entradas_plan`, {
    method: 'POST',
    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({p_plan_ids: planIds}),
  }, TIMEOUT_UNIVERSO_PLAN_MS);
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if(!res.ok){ throw new Error((data && data.message) || res.statusText || 'Error de base de datos'); }
  if(!Array.isArray(data)) throw new Error('respuesta inesperada del servidor');
  return data;
}

// GET paginado con Range: PostgREST corta en 1.000 filas por respuesta. Para las ventanas grandes
// (un año, un período entero) la lista de entradas puede pasar de ahí; se sigue pidiendo mientras
// la página venga llena. Solo para listas de entradas (filas chicas), nunca para SKU.
async function restTodo(path){
  const TAM = 1000;
  let desde = 0, todas = [];
  while(true){
    const pagina = await rest(path, {extraHeaders:{'Range-Unit':'items', 'Range':`${desde}-${desde+TAM-1}`}});
    const filas = Array.isArray(pagina) ? pagina : [];
    todas = todas.concat(filas);
    if(filas.length < TAM) break;
    desde += TAM;
  }
  return todas;
}

/* ---- Ventana de Planificación: Día / Semana / Mes / Año / Período (idea de Joel) ----
   Una sola fuente de verdad: diaFiltro (día puntual) gana sobre cicloFiltro (período completo),
   y sin ninguno de los dos se navega por calendario según `rango` (semana, mes o año). En las
   ventanas grandes (mes, año, período) la pantalla es RESUMIDA: totales por entrada sin listar
   SKU (ver esResumenPlan / resumenEntradasPlan). Día y Semana siguen con el detalle completo. */
function modoPlan(p){
  if(p.diaFiltro) return 'dia';
  if(p.cicloFiltro) return 'periodo';
  return (p.rango==='mes' || p.rango==='anio') ? p.rango : 'semana';
}
function esResumenPlan(p){ const m = modoPlan(p); return m==='mes' || m==='anio' || m==='periodo'; }
function inicioMes(iso){ return iso.slice(0,8)+'01'; }
function finMes(mesInicio){ const d = new Date(mesInicio+'T00:00:00'); d.setMonth(d.getMonth()+1); d.setDate(0); return fechaISO(d); }
function sumarMeses(mesInicio, n){ const d = new Date(mesInicio+'T00:00:00'); d.setMonth(d.getMonth()+n); return fechaISO(d); }
function fmtMesCorto(iso){ if(!iso) return ''; return new Date(iso+'T00:00:00').toLocaleDateString('es-CL',{month:'short'}).replace('.',''); }
function fmtMesLargo(iso){ const t = new Date(iso+'T00:00:00').toLocaleDateString('es-CL',{month:'long', year:'numeric'}); return t.charAt(0).toUpperCase()+t.slice(1); }
// {modo, desde, hasta, etiqueta}: desde/hasta son null en modo período (se filtra por ciclo_id).
function ventanaPlan(p){
  const modo = modoPlan(p);
  const hoy = fechaISO(new Date());
  if(modo==='dia') return {modo, desde:p.diaFiltro, hasta:p.diaFiltro, etiqueta: fmtFecha(p.diaFiltro)};
  if(modo==='mes'){ const desde = p.mesInicio || inicioMes(hoy); return {modo, desde, hasta: finMes(desde), etiqueta: fmtMesLargo(desde)}; }
  if(modo==='anio'){ const desde = p.anioInicio || hoy.slice(0,4)+'-01-01'; return {modo, desde, hasta: desde.slice(0,4)+'-12-31', etiqueta: desde.slice(0,4)}; }
  if(modo==='periodo'){ const c = (state.ciclos||[]).find(c=>c.id===p.cicloFiltro); return {modo, desde:null, hasta:null, etiqueta: c ? c.nombre : ''}; }
  // La "semana" mostrada va de lunes al lunes siguiente inclusive (8 días, no 7): a pedido, para
  // no cortar la vista justo el domingo y poder ver de una el arranque de la semana próxima.
  const inicio = p.semanaInicio || fechaISO(inicioSemana(new Date()));
  const fin = fechaISO(sumarDias(new Date(inicio+'T00:00:00'), 7));
  return {modo, desde: inicio, hasta: fin, etiqueta: `${fmtFecha(inicio)} – ${fmtFecha(fin)}`};
}
// Cambio de pestaña Día/Semana/Mes/Año: cae sobre el mismo tramo del calendario que se estaba
// mirando (hoy si está dentro de la ventana actual; si no, el inicio de esa ventana), no salta a
// hoy porque sí. Período se elige desde el selector de períodos (cicloFiltro), no desde acá.
function cambiarModoPlan(modo){
  const p = state.plan;
  const v = ventanaPlan(p);
  const hoy = fechaISO(new Date());
  const ref = p.diaFiltro || ((v.desde && hoy>=v.desde && hoy<=v.hasta) || !v.desde ? hoy : v.desde);
  const cambios = {diaFiltro:null, cicloFiltro:'', rango: modo==='dia' ? 'semana' : modo};
  if(modo==='dia'){ cambios.diaFiltro = ref; cambios.semanaInicio = fechaISO(inicioSemana(new Date(ref+'T00:00:00'))); }
  else if(modo==='semana'){ cambios.semanaInicio = fechaISO(inicioSemana(new Date(ref+'T00:00:00'))); }
  else if(modo==='mes'){ cambios.mesInicio = inicioMes(ref); }
  else if(modo==='anio'){ cambios.anioInicio = ref.slice(0,4)+'-01-01'; }
  else return;
  setState({plan:{...state.plan, ...cambios}});
  cargarPlanSemanal();
}
// Anterior/Siguiente según la ventana activa: un día, una semana, un mes o un año.
function navegarPlan(delta){
  const p = state.plan;
  const v = ventanaPlan(p);
  if(v.modo==='dia'){
    const d = fechaISO(sumarDias(new Date(p.diaFiltro+'T00:00:00'), delta));
    setState({plan:{...p, diaFiltro:d, semanaInicio: fechaISO(inicioSemana(new Date(d+'T00:00:00')))}});
  }else if(v.modo==='semana'){
    setState({plan:{...p, semanaInicio: fechaISO(sumarDias(new Date(v.desde+'T00:00:00'), 7*delta)), diaFiltro:null}});
  }else if(v.modo==='mes'){
    setState({plan:{...p, mesInicio: sumarMeses(v.desde, delta)}});
  }else if(v.modo==='anio'){
    setState({plan:{...p, anioInicio: (Number(v.desde.slice(0,4))+delta)+'-01-01'}});
  }else return;
  cargarPlanSemanal();
}

// Token de carrera para cargarPlanSemanal: se llama desde muchos lugares (agregar/editar/borrar
// una entrada, cambiar de semana o período, "Ver en Planificación" desde Calendario, etc.) y
// puede quedar más de una llamada en vuelo a la vez -- ej. la que dispara el plan automático de
// un grupo grande al terminar de crear cientos de entradas, todavía resolviendo su propio tramo
// lento (universoEntradasPlanResumen), mientras la persona ya navegó a otra semana/día y disparó
// una segunda llamada. Sin este resguardo, si la llamada VIEJA responde después que la nueva,
// pisa el estado fresco con datos de otra semana/período -- bug real reportado por Joel: entró a
// Planificación filtrado a un día puntual y vio un total inflado (164 en vez de 100) que se
// autocorregía solo al reintentar. Cada llamada se identifica con un número creciente; si al
// volver de un await ya hay una llamada MÁS NUEVA en curso, esta se cancela en silencio (su
// resultado ya no es el que corresponde mostrar).
let cargarPlanSemanalSecuencia = 0;
async function cargarPlanSemanal(){
  const miSecuencia = ++cargarPlanSemanalSecuencia;
  const inicio = state.plan.semanaInicio || fechaISO(inicioSemana(new Date()));
  // La "semana" mostrada va de lunes al lunes siguiente inclusive (8 días, no 7): a pedido, para
  // no cortar la vista justo el domingo y poder ver de una el arranque de la semana próxima.
  const fin = fechaISO(sumarDias(new Date(inicio+'T00:00:00'), 7));
  // Con un período (ciclo) elegido en el filtro, se muestra toda su planificación sin
  // importar la semana; sin período elegido, se sigue mostrando semana por semana como antes.
  // Con un día puntual elegido desde el Calendario (diaFiltro), se pide SOLO ese día -- bug real
  // reportado por Joel: como el período actual viene preseleccionado (ver cargarCiclos), "Ver en
  // Planificación" cargaba el período ENTERO (370 entradas, 1254 filas de SKU con datos reales)
  // para mostrar solo un día: tardaba ~12 s (dos páginas de un RPC de ~5 s cada una) y, peor, el
  // día quedaba con los SKU de la primera página nada más (82 en vez de 100). Solo ese día son
  // ~100 filas en una sola página, ~0.3 s medidos.
  // Mes y Año (idea de Joel) son ventanas de calendario más grandes que la semana; junto con
  // Período son vistas RESUMIDAS (ver ventanaPlan / esResumenPlan): se piden las entradas y solo
  // sus totales, nunca los SKU.
  const ventana = ventanaPlan(state.plan);
  const resumido = esResumenPlan(state.plan);
  try{
    const rows = ventana.modo==='dia'
      ? await rest(`/plan_semanal_detalle?fecha=eq.${ventana.desde}&order=fecha.asc`)
      : ventana.modo==='periodo'
      ? await restTodo(`/plan_semanal_detalle?ciclo_id=eq.${state.plan.cicloFiltro}&order=fecha.asc`)
      : ventana.modo==='semana'
      ? await rest(`/plan_semanal_detalle?fecha=gte.${inicio}&fecha=lte.${fin}&order=fecha.asc`)
      : await restTodo(`/plan_semanal_detalle?fecha=gte.${ventana.desde}&fecha=lte.${ventana.hasta}&order=fecha.asc`);
    if(miSecuencia !== cargarPlanSemanalSecuencia) return; // ver comentario arriba: ya hay una llamada más nueva
    planCargadoEn = Date.now();
    planCargadoDia = fechaISO(new Date());
    setState({plan: {...state.plan, semanaInicio: inicio, entradas: rows||[], seleccionados:[]}});
    // Este recálculo de fondo (universo Y detalle de TODAS las entradas visibles) dispara un
    // render() completo, sin relación con el formulario "Agregar a la planificación" que la
    // persona puede estar llenando en ese momento. No hace falta protegerlo acá: render() ya
    // captura y restaura ese formulario alrededor de cualquier render (ver
    // capturarFormularioPlan). Bug real reportado por Joel: esto antes mandaba una llamada
    // paralela POR ENTRADA (forEach); con más de cien entradas reales (y peor aún con las 322 de
    // una prueba de plan automático), eso saturaba el pool de conexiones a la base de datos y
    // dejaba sin turno a cualquier otra pantalla cargando en simultáneo (ej. el Dashboard),
    // "colgada" sin ningún error visible. Ahora es UN solo viaje al servidor para todas las
    // entradas (ver universoEntradasPlanResumen), ya agrupado por plan_id. Silencioso a
    // propósito: no es una acción que la persona haya iniciado, y si falla (red caída, pestaña en
    // background) el conteo de esas entradas simplemente no se actualiza esta vez (se reintenta
    // solo al volver a cargar la pestaña).
    try{
      const ids = (rows||[]).map(r=>r.id);
      const universos = {...state.plan.universos};
      const detalle = {...state.plan.detalle};
      const propios = {...(state.plan.propios||{})};
      if(resumido){
        // Vista resumida: solo totales por entrada (y cuántos ya estaban en una entrada anterior),
        // sin bajar ningún SKU -- ver resumenEntradasPlan.
        const filas = await resumenEntradasPlan(ids);
        if(miSecuencia !== cargarPlanSemanalSecuencia) return; // idem: descarta la respuesta si ya quedó obsoleta
        const porPlan = new Map(filas.map(f=>[f.plan_id, f]));
        (rows||[]).forEach(r=>{
          const f = porPlan.get(r.id);
          universos[r.id] = f ? Number(f.total)||0 : 0;
          propios[r.id] = f ? Number(f.propios)||0 : 0;
          delete detalle[r.id];
        });
      }else{
        const resumen = await universoEntradasPlanResumen(ids);
        if(miSecuencia !== cargarPlanSemanalSecuencia) return; // idem: descarta la respuesta si ya quedó obsoleta
        (rows||[]).forEach(r=>{
          const skus = Array.isArray(resumen[r.id]) ? resumen[r.id] : [];
          universos[r.id] = skus.length;
          detalle[r.id] = skus;
          delete propios[r.id];
        });
      }
      setState({plan: {...state.plan, universos, detalle, propios, universoError:null}});
    }catch(e){
      if(miSecuencia !== cargarPlanSemanalSecuencia) return;
      // Ya no es silencioso: bug real reportado por Joel -- con el período completo, la segunda
      // página del RPC caía sobre el timeout y la pantalla quedaba con números viejos o
      // incompletos sin ningún aviso ("1000 en total" cuando eran 1.251). Se borra lo que se
      // tenía de estas entradas (vuelven a "Calculando…"), se avisa y se ofrece reintentar.
      const universos = {...state.plan.universos};
      const detalle = {...state.plan.detalle};
      const propios = {...(state.plan.propios||{})};
      (rows||[]).forEach(r=>{ delete universos[r.id]; delete detalle[r.id]; delete propios[r.id]; });
      setState({plan: {...state.plan, universos, detalle, propios, universoError: e.message || 'error desconocido'}});
      toast('No se pudo calcular el SKU a contar del plan. Revisa el aviso en Planificación para reintentar.', 'warn');
    }
  }catch(e){ if(miSecuencia === cargarPlanSemanalSecuencia) toast(e.message,'err'); }
}

// El Calendario carga resumen_calendario_mes una sola vez por mes (ver el resguardo contra
// recursión en bind(), state.view==='calendario') y se queda con esa foto -- si se agrega,
// edita o borra algo del plan mientras tanto (desde Planificación), sin esto la vista quedaba
// mostrando cifras viejas hasta cerrar sesión. Cualquier mutación de plan_semanal/exclusiones
// llama esto para que la próxima vez que se entre a Calendario vuelva a pedir datos frescos.
function invalidarCalendario(){
  if(state.calendario.cargado) setState({calendario: {...state.calendario, cargado:false}});
}

/* ---- Mantener el plan "en el día" -------------------------------------------------------
   Pedido de Joel: al entrar a Contar o a Plan, la pantalla debe estar en el día de hoy y con la
   información al día. Dos problemas reales que esto resuelve: (1) el día se fijaba una sola vez
   al abrir la app -- un operador que retoma la PWA a la mañana siguiente seguía viendo el plan de
   ayer; (2) Plan solo se cargaba al iniciar y tras acciones propias -- lo que planificó otra
   persona, generó un grupo o cerró el cron nocturno no aparecía hasta recargar la app. */
const PLAN_REFRESCO_MIN_MS = 60 * 1000; // no repetir la consulta del período completo (1,6 s de servidor) por cada cambio de pestaña
let planCargadoEn = 0;        // Date.now() de la última carga exitosa de Planificación
let planCargadoDia = null;    // fechaISO de ese momento, para detectar el cambio de día
let diaVisibleAnterior = fechaISO(new Date());

// Estado de contarPlan al entrar a la pestaña: siempre se vuelve a pedir el plan (cargado:false),
// y si la fecha no fue elegida a mano en esta sesión y ya no es hoy, vuelve a hoy.
function contarPlanAlEntrar(cp){
  const hoy = fechaISO(new Date());
  const volverAHoy = !cp.fechaManual && cp.fecha !== hoy;
  return {...cp, cargado:false, fecha: volverAHoy ? hoy : cp.fecha, ...(volverAHoy ? {bodega:'', ubicacion:'', skusPendientes:null} : {})};
}

// Recarga Planificación si la última carga es vieja o cambió el día. Si cambió el día y se
// estaba navegando por semana sin un día puntual, la semana pasa a ser la de hoy.
function refrescarPlanSiCorresponde(forzar){
  const hoy = fechaISO(new Date());
  const cambioDia = planCargadoDia !== null && planCargadoDia !== hoy;
  const viejo = Date.now() - planCargadoEn > PLAN_REFRESCO_MIN_MS;
  if(!forzar && !cambioDia && !viejo) return false;
  if(cambioDia && !state.plan.diaFiltro && !state.plan.cicloFiltro && (state.plan.rango||'semana')==='semana'){
    setState({plan:{...state.plan, semanaInicio: fechaISO(inicioSemana(new Date(hoy+'T00:00:00')))}});
  }
  cargarPlanSemanal();
  return true;
}

/* ---- Aviso de versión nueva ------------------------------------------------------------
   Hallazgo real (logs del 7 de septiembre): una pestaña de escritorio que llevaba días abierta
   seguía corriendo una versión antigua de la app y llamó 4.000 veces a una función que ya no
   existía en el código nuevo, a 5 s cada una -- horas de CPU de la base de datos en una tarde. La
   app es un solo HTML servido por GitHub Pages: no hay build ni número de versión, así que la
   "versión" es el ETag (o Last-Modified) que el servidor devuelve para el propio HTML. Al
   arrancar se guarda el publicado en ese momento; al volver a primer plano y cada 15 minutos se
   vuelve a pedir con HEAD (sin caché, sin pasar por el service worker) y, si cambió, se muestra
   una barra "Hay una versión nueva" con el botón Recargar. Nunca recarga sola: la persona puede
   estar a mitad de un conteo. */
const VERSION_CHECK_CADA_MS = 15 * 60 * 1000;
let versionPublicadaAlArrancar = null;
let versionChequeoEnCurso = null;
async function leerVersionPublicada(){
  try{
    const ruta = (typeof location!=='undefined' && location.pathname) ? location.pathname : './';
    const res = await fetch(ruta, {method:'HEAD', cache:'no-store'});
    if(!res || !res.ok) return null;
    return res.headers.get('etag') || res.headers.get('last-modified') || null;
  }catch(e){ return null; } // sin señal o servidor caído: no es motivo para molestar
}
// Devuelve true si hay una versión nueva (y deja state.versionNueva para que se muestre la barra).
async function verificarVersionNueva(){
  if(state.versionNueva) return true;
  if(versionChequeoEnCurso) return versionChequeoEnCurso;
  versionChequeoEnCurso = (async ()=>{
    const v = await leerVersionPublicada();
    if(!v) return false;
    if(versionPublicadaAlArrancar===null){ versionPublicadaAlArrancar = v; return false; }
    if(v===versionPublicadaAlArrancar) return false;
    setState({versionNueva:true});
    return true;
  })();
  try{ return await versionChequeoEnCurso; }
  finally{ versionChequeoEnCurso = null; }
}
function recargarPorVersionNueva(){
  if(typeof location!=='undefined' && location.reload) location.reload();
}

// Al volver la app a primer plano con otro día en el calendario (PWA que quedó abierta de un día
// para otro), refresca la vista que se esté mirando para que no quede "en ayer".
function alVolverAPrimerPlano(){
  if(typeof document!=='undefined' && document.hidden) return;
  verificarVersionNueva();
  const hoy = fechaISO(new Date());
  if(hoy === diaVisibleAnterior) return;
  diaVisibleAnterior = hoy;
  if(!state.perfil) return;
  invalidarCalendario();
  if(state.view==='conteo') setState({contarPlan: contarPlanAlEntrar(state.contarPlan)});
  else if(state.view==='plan') refrescarPlanSiCorresponde(true);
  else if(state.calendario && state.calendario.mes){
    // El calendario abre en el mes de hoy la próxima vez que se muestre.
    setState({calendario:{...state.calendario, mes: hoy.slice(0,8)+'01', diaSeleccionado:null, cargado:false}});
  }
}

async function excluirSkuDePlan(planId, skuCode){
  try{
    await rest('/plan_semanal_exclusiones', {method:'POST', body:[{plan_id:planId, sku_code:skuCode}], prefer:'return=minimal'});
    toast('SKU quitado de la planificación');
    cargarPlanSemanal();
    refrescarOpcionesUbicacion();
    invalidarCalendario();
  }catch(e){ toast(e.message,'err'); }
}

// "Responsable" en Planificación son directamente las cuentas del equipo (usuarios), no una
// lista aparte: así queda un solo lugar para gestionar personas (Configuraciones → Equipo).
async function cargarResponsables(){
  try{
    // Solo operadores: quien planifica es admin, pero el responsable de contar en terreno
    // (a quien "Contar" le muestra su plan del día) es siempre un operador, no un admin.
    // Siempre de la empresa propia: un súper admin puede leer usuarios de todas las empresas
    // (read_usuarios) y sin este filtro le aparecían operadores ajenos como responsables -- bug
    // real: 5 entradas de Escondida quedaron asignadas a una operadora de Demo InventIA. La base
    // ahora también lo rechaza (trigger validar_responsable_misma_empresa).
    const empresaFiltro = state.perfil && state.perfil.empresa_id ? `&empresa_id=eq.${encodeURIComponent(state.perfil.empresa_id)}` : '';
    const rows = await rest(`/usuarios?activo=eq.true&rol=eq.operador&select=id,nombre${empresaFiltro}&order=nombre.asc`);
    setState({plan: {...state.plan, responsables: rows||[]}});
  }catch(e){ toast(e.message,'err'); }
}

// Ciclos de conteo (ej. "T1 2027", "Cierre 2027"): permiten etiquetar a qué período
// pertenece cada conteo. Los conteos nuevos se etiquetan solos con el ciclo marcado como
// "actual" (ver trigger asignar_ciclo_conteo); acá solo se listan/gestionan.
async function cargarCiclos(){
  try{
    const rows = await rest('/ciclos_conteo?select=id,nombre,es_actual,fecha_inicio&order=created_at.desc');
    setState({ciclos: rows||[]});
    // Semana de conteo: la primera vez que se conocen los períodos, seleccionar el actual por
    // defecto en el filtro de Planificación (a pedido de Joel), en vez de arrancar en modo
    // "navegar por semana". Solo la primera vez -- cicloFiltroInicializado evita pisar lo que
    // la persona haya elegido después (incluido volver a "Todos los períodos" a mano).
    // Es también quien dispara la primera carga de la planificación (ver cargarTodo): con o sin
    // período actual, pero UNA sola vez y ya sabiendo qué se va a mostrar.
    if(!state.plan.cicloFiltroInicializado){
      const actual = (rows||[]).find(c=>c.es_actual);
      setState({plan:{...state.plan, cicloFiltro: actual? actual.id : state.plan.cicloFiltro, cicloFiltroInicializado:true}});
      // La pestaña Plan carga lo suyo al mostrarse (asegurarDatosDeVista); si ya se está mirando,
      // recargar acá con el período recién preseleccionado.
      if(state.view==='plan') cargarPlanSemanal();
    }
  }catch(e){
    toast(e.message,'err');
    // Si no se pudieron leer los períodos, la planificación se muestra igual (por semana).
    if(!state.plan.cicloFiltroInicializado){
      setState({plan:{...state.plan, cicloFiltroInicializado:true}});
      if(state.view==='plan') cargarPlanSemanal();
    }
  }
}

// Informes de cierre (ver marcar_ciclo_actual/informes_ciclo): un snapshot automático por
// cada ciclo ya cerrado -- se carga aparte de cargarCiclos (perezoso, al entrar a la pestaña)
// porque es un historial que crece con el tiempo y la mayoría de las visitas a Períodos no
// lo necesitan.
async function cargarInformesCiclo(){
  state.informesCiclo = {...state.informesCiclo, cargando:true};
  render();
  try{
    const rows = await rest('/informes_ciclo?select=id,ciclo_nombre,fecha_inicio,fecha_cierre,datos&order=fecha_cierre.desc');
    state.informesCiclo = {cargado:true, cargando:false, lista: rows||[]};
  }catch(e){
    state.informesCiclo = {...state.informesCiclo, cargando:false};
    toast(e.message,'err');
  }
  render();
}

// Calendario mensual: planificado/contado/recontado/pendiente por día vía el RPC
// resumen_calendario_mes (RLS + el rol dentro de la función deciden el alcance -- admin/
// súper-admin ven toda la empresa, un operador solo lo suyo -- no hay nada que filtrar acá).
async function cargarCalendario(mes){
  if(!perfilCargado()) return;
  setState({calendario:{...state.calendario, mes, cargando:true}});
  try{
    const dias = await rest('/rpc/resumen_calendario_mes', {method:'POST', body:{p_mes: mes}});
    setState({calendario:{...state.calendario, mes, cargando:false, cargado:true, dias: dias||[]}});
  }catch(e){
    setState({calendario:{...state.calendario, cargando:false}});
    toast(e.message,'err');
  }
}

async function crearCiclo(nombre, fechaInicio){
  if(!nombre || !perfilCargado()) return;
  try{
    await rest('/ciclos_conteo', {method:'POST', body:[{
      empresa_id: state.perfil.empresa_id, nombre,
      fecha_inicio: fechaInicio || fechaISO(new Date()),
    }], prefer:'return=minimal'});
    toast('Ciclo creado');
    cargarCiclos();
  }catch(e){ toast(e.message,'err'); }
}

async function editarFechaInicioCiclo(id, fechaInicio){
  if(!fechaInicio || !perfilCargado()) return;
  try{
    await rest(`/ciclos_conteo?id=eq.${encodeURIComponent(id)}`, {method:'PATCH', body:{fecha_inicio: fechaInicio}, prefer:'return=minimal'});
    toast('Fecha de inicio actualizada');
    setState({cicloEditandoId: null});
    cargarCiclos();
  }catch(e){ toast(e.message,'err'); }
}

async function marcarCicloActual(id){
  if(!perfilCargado()) return;
  // Si hay un período actual distinto del que se va a activar, cambiarlo lo cierra de verdad
  // (genera su informe de cierre en el mismo momento, ver marcar_ciclo_actual/informes_ciclo)
  // -- se advierte antes, no después, porque no hay forma de deshacerlo una vez cerrado.
  const actual = (state.ciclos||[]).find(c=>c.es_actual);
  if(actual && actual.id!==id){
    if(!confirm(`Cambiarte a este período cerrará "${actual.nombre}" y generará su informe de cierre automáticamente. ¿Seguro que quieres cerrarlo?`)) return;
  }
  try{
    // Desmarcar el ciclo actual previo y marcar el nuevo ocurre en una sola transacción de RPC
    // (marcar_ciclo_actual), no en dos PATCH separados: así nunca queda una ventana donde dos
    // ciclos puedan quedar marcados "actuales" a la vez (respaldado además por un índice único
    // parcial en la base).
    await rest('/rpc/marcar_ciclo_actual', {method:'POST', body:{ciclo_id:id}});
    toast('Ciclo actual actualizado');
    cargarCiclos();
    // El ciclo que se acaba de dejar de ser actual queda con su informe de cierre recién
    // generado (ver marcar_ciclo_actual/informes_ciclo) -- si la lista ya estaba cargada en
    // pantalla, se refresca para mostrarlo sin que la persona tenga que salir y volver a entrar.
    if(state.informesCiclo.cargado) cargarInformesCiclo();
  }catch(e){ toast(e.message,'err'); }
}

/* =======================================================================
   GRUPOS DE CONTEO
   Listas curadas de materiales (ej. "IE", "5S"), armadas a mano con filtros -- no por carga
   masiva. La pertenencia se guarda por código+bodega (ver migración skus_grupos_conteo), no
   por la fila exacta de `skus`, para que sobreviva cambios de storage bin/ubicación/batch.
   ======================================================================= */
async function cargarGrupos(){
  setState({grupos: {...state.grupos, cargando:true}});
  try{
    // El embed "miembros:skus_grupos_conteo(count)" trae la cantidad de materiales de cada
    // grupo sin tener que pedirla aparte por grupo (evita N+1 consultas). No sirve para el grupo
    // automático de Crítico (no tiene filas en skus_grupos_conteo) -- para ese, aparte, se pide
    // el conteo real vía RPC (contar_criticos_distintos, cuenta materiales, no filas -- rápida,
    // usa el índice idx_skus_empresa_activo_critico) -- a lo más un grupo automático por empresa,
    // así que es un solo pedido extra, no N+1.
    // Se traen también los pausados (activo=false, ver pausarGrupo): van aparte, en `pausados`,
    // para poder reactivarlos; `lista` sigue siendo solo los activos (es lo que usan Buscar, el
    // plan automático y el resto).
    const todos = await rest('/grupos_conteo?select=*,miembros:skus_grupos_conteo(count)&order=nombre.asc') || [];
    const rows = todos.filter(g=>g.activo!==false);
    const pausados = todos.filter(g=>g.activo===false);
    const grupoAutomatico = rows.find(g=>g.automatico_critico);
    if(grupoAutomatico){
      const total = await rest('/rpc/contar_criticos_distintos', {method:'POST', body:{}});
      grupoAutomatico.totalCriticos = Number(total) || 0;
    }
    // "3 materiales · 8 posiciones" (pedido de Joel: al filtrar Buscar por un grupo de 3
    // materiales salían 8 filas, una por posición). Un grupo se arma por material (código +
    // bodega), pero Buscar y el plan trabajan por posición: cada fila activa del maestro
    // (ubicación / storage bin / batch). Una sola llamada para todos los grupos (no N+1); si
    // falla, simplemente no se muestra la cifra.
    if(todos.length){
      try{
        const filas = await rest('/rpc/posiciones_por_grupo', {method:'POST', body:{p_grupo_ids: todos.map(g=>g.id)}}) || [];
        const porGrupo = new Map(filas.map(f=>[f.grupo_id, f]));
        todos.forEach(g=>{ const f = porGrupo.get(g.id); g.posiciones = f ? Number(f.posiciones) : null; });
      }catch(e){ todos.forEach(g=>{ g.posiciones = null; }); }
    }
    // Cuántas entradas de plan_semanal generó el plan automático de cada grupo (a pedido de Joel:
    // ver de un vistazo el tamaño real del último plan generado -- ej. "332 entradas" -- sin tener
    // que volver a generarlo para verlo). No hay una columna que vincule plan_semanal a
    // grupos_conteo directamente; se identifica por la nota fija que pone
    // confirmarVistaPreviaComoPlan. Un solo conteo (Range 0-0 + count=exact, sin traer filas) por
    // grupo -- son pocos grupos (no las miles de entradas que sí eran el problema real), así que
    // no es el patrón n+1 que causó el bug de las llamadas paralelas.
    await Promise.all(rows.map(async grupo => {
      const nota = `Generado automáticamente por el grupo "${grupo.nombre}"`;
      try{
        const res = await fetchConTimeout(`${SUPABASE_URL}/rest/v1/plan_semanal?nota=eq.${encodeURIComponent(nota)}&select=id`, {
          headers:{
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
            'Range-Unit': 'items', 'Range': '0-0', 'Prefer': 'count=exact',
          },
        });
        const range = res.headers.get('content-range');
        grupo.entradasPlan = range && range.includes('/') ? Number(range.split('/')[1]) : 0;
      }catch(e){ grupo.entradasPlan = null; }
    }));
    setState({grupos: {...state.grupos, lista: rows, pausados, cargado:true, cargando:false}});
    cargarResumenPlanGrupos(todos.map(g=>g.id));
  }catch(e){
    setState({grupos: {...state.grupos, cargando:false}});
    toast(e.message,'err');
  }
}

async function crearGrupo(nombre, frecuenciaDias, automaticoCritico, fechaInicio){
  if(!nombre || !fechaInicio || !perfilCargado()) return;
  try{
    await rest('/grupos_conteo', {method:'POST', body:[{
      empresa_id: state.perfil.empresa_id, nombre,
      frecuencia_dias: frecuenciaDias!=='' && frecuenciaDias!=null ? Number(frecuenciaDias) : null,

    cargarGrupos();
  }catch(e){
    // Ya existe un grupo automático de críticos activo (índice único idx_grupos_conteo_automatico_
    // critico_unico) -- a lo más uno por empresa, para no tener dos compitiendo por el mismo criterio.
    toast(/idx_grupos_conteo_automatico_critico_unico/i.test(e.message||'') ? 'Ya existe un grupo automático de Crítico activo' : e.message, 'err');
  }
}

  return Promise.all([cargarMiembrosGrupo(id), cargarSeguimientoGrupo(id), cargarHistorialCiclosGrupo(id)]);
}

function volverAListaGrupos(){
  setState({grupos: {...state.grupos, grupoAbierto:null, miembros:[], ...resetCandidatosGrupo(), vistaPreviaSemanas:null, seguimiento:null, historial:[], historialAbierto:null, historialDetalle:[], editandoFechaInicioId:null}});

// Ciclo PROPIO del grupo (a pedido de Joel: 5S cada 60 días, Críticos cada 90, cada uno con su
// fecha de inicio -- independiente del período general de la empresa). Se cierra solo cuando pasa
// la fecha de término (ver cron cerrar_ciclos_grupo_vencidos, que guarda el resultado en
// historial_ciclos_grupo y arranca el ciclo siguiente). Se usa tanto en la lista de grupos (para
// ver el avance sin entrar a cada uno) como en el detalle -- por eso vive aparte de
// cargarSeguimientoGrupo, ya que solo necesita fecha_inicio/frecuencia_dias del grupo mismo, sin
// pedir nada al servidor.
function calcularCicloGrupo(grupo){
  if(!grupo || !grupo.frecuencia_dias || !grupo.fecha_inicio) return null;
  const inicioMs = new Date(grupo.fecha_inicio+'T00:00:00').getTime();
  const diaCrudo = Math.max(1, Math.floor((Date.now() - inicioMs) / (24*60*60*1000)) + 1);
  // Si diaCrudo > totalDias es que el ciclo ya venció en el calendario pero el cron nocturno
  // todavía no corre para cerrarlo y arrancar el siguiente -- se muestra como "vencido" en vez de
  // un día que no tendría sentido para el usuario (ej. "día 69 de 60").
  return {
    dia: Math.min(diaCrudo, grupo.frecuencia_dias),
    totalDias: grupo.frecuencia_dias,
    fechaTermino: fechaISO(sumarDias(new Date(grupo.fecha_inicio+'T00:00:00'), grupo.frecuencia_dias-1)),
    vencido: diaCrudo > grupo.frecuencia_dias,
  };
}

// Seguimiento del grupo: cuántos de sus materiales están al día vs vencidos según su frecuencia
// (o, si todavía no tiene frecuencia definida, cuántos se han contado alguna vez) -- ver
// conversación con Joel sobre llevar un avance separado por grupo. Deliberadamente vive acá, en
// el detalle del grupo, y no como una dimensión nueva en el Dashboard: agregar "grupo" a las
// vistas/RPC del Dashboard es un cambio de mayor riesgo (toca reportes ya en producción) que
// prefiero dejar aparte si en algún momento hace falta -- esto ya da visibilidad real hoy sin
// tocar una sola consulta existente del Dashboard.
async function cargarSeguimientoGrupo(grupoId){
  const grupo = state.grupos.lista.find(g=>g.id===grupoId);
  setState({grupos: {...state.grupos, seguimientoCargando:true, seguimiento:null}});
  try{
    // El período actual (ciclo_actual) se pide en paralelo -- es un dato de contexto ("¿cuántos
    // días llevamos?"), no depende de los miembros del grupo. Si no hay ninguno marcado como
    // actual, simplemente no se muestra esa línea (mismo criterio que el resto de la app).
    const pedidoCiclo = rest('/ciclos_conteo?es_actual=eq.true&select=nombre,fecha_inicio&limit=1');
    let miembros, filas;
    if(grupo && grupo.automatico_critico){
      // Automático: la membresía ES el propio universo de skus.critico=true -- alcanza una sola
      // consulta (ya trae la fecha), a diferencia de un grupo curado a mano que necesita cruzar
      // skus_grupos_conteo con skus por separado (ver la rama de abajo).
      filas = await rest(`/skus?activo=eq.true&critico=eq.true&select=sku_code,bodega,ultimo_conteo_fecha`) || [];
      const vistos = new Set();
      miembros = [];
      filas.forEach(f=>{
        const clave = `${f.sku_code}::${f.bodega||''}`;
        if(!vistos.has(clave)){ vistos.add(clave); miembros.push({sku_code:f.sku_code, bodega:f.bodega}); }
      });
    }else{
      miembros = await rest(`/skus_grupos_conteo?grupo_id=eq.${grupoId}&select=sku_code,bodega`) || [];
      filas = [];
      if(miembros.length){
        const codigos = Array.from(new Set(miembros.map(m=>m.sku_code)));
        filas = await rest(`/skus?activo=eq.true&sku_code=in.(${codigos.map(c=>encodeURIComponent(c)).join(',')})&select=sku_code,bodega,ultimo_conteo_fecha`) || [];
      }
    }
    const ciclosActuales = await pedidoCiclo || [];
    // fecha_inicio es una fecha elegida a mano al crear el período (ver renderCiclos/crearCiclo),
    // no cuándo se creó el registro -- para que "día X" refleje cuándo arrancó de verdad el
    // conteo en terreno, aunque el período se cargue en la app unos días después (pedido de Joel).
    // Se interpreta a medianoche LOCAL (mismo criterio que instantesFiltroFecha), no UTC.
    const cicloActual = ciclosActuales[0] ? {
      nombre: ciclosActuales[0].nombre,
      dias: Math.max(1, Math.floor((Date.now() - new Date(ciclosActuales[0].fecha_inicio+'T00:00:00').getTime()) / (24*60*60*1000)) + 1),
    } : null;

    // El ciclo PROPIO del grupo (a pedido de Joel: 5S cada 60 días, Críticos cada 90, cada uno
    // con su fecha de inicio -- independiente del período general de la empresa de arriba). Se
    // cierra solo cuando pasa la fecha de término (ver cron cerrar_ciclos_grupo_vencidos, que
    // guarda el resultado en historial_ciclos_grupo y arranca el ciclo siguiente): mientras el
    // ciclo sigue abierto, un material cuenta como "contado en este ciclo" si su conteo más
    // reciente cae en o después de la fecha de inicio del grupo.
    const cicloGrupo = calcularCicloGrupo(grupo);
    // Requiere fecha_inicio además de frecuencia_dias -- sin fecha de inicio no hay con qué
    // calcular ni el día del ciclo ni qué cuenta como "contado en este ciclo" (ver más abajo).
    const tieneFrecuencia = !!cicloGrupo;
    const inicioGrupoMs = tieneFrecuencia ? new Date(grupo.fecha_inicio+'T00:00:00').getTime() : null;

    const inicioSemanaActual = inicioSemana(new Date());
    const inicioMesActual = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    const resumen = {totalMiembros: miembros.length, nuncaContados:0, contadosCiclo:0, pendientesCiclo:0, tieneFrecuencia, contadosSemana:0, contadosMes:0, cicloActual, cicloGrupo};
    if(miembros.length){
      miembros.forEach(m=>{
        // Un material puede tener varias filas activas (por batch/ubicación/bin) -- se usa la
        // fecha de conteo MÁS RECIENTE entre todas ellas para decidir el estado del material
        // (código+bodega), no una fila cualquiera.
        let masReciente = null;
        filas.forEach(f=>{
          if(f.sku_code===m.sku_code && (f.bodega||'')===(m.bodega||'') && f.ultimo_conteo_fecha){
            if(!masReciente || new Date(f.ultimo_conteo_fecha) > new Date(masReciente)) masReciente = f.ultimo_conteo_fecha;
          }
        });
        if(!masReciente) resumen.nuncaContados++;
        if(tieneFrecuencia){
          if(masReciente && new Date(masReciente).getTime() >= inicioGrupoMs) resumen.contadosCiclo++;
          else resumen.pendientesCiclo++;
        }
        // Ritmo reciente -- no reemplaza el avance del ciclo, solo da una referencia de avance
        // esta semana/mes (a pedido de Joel: "algo que no sea tanta información, pero que sí
        // entregue referencia de dónde estás"). Usa la misma fecha más reciente ya calculada.
        if(masReciente){
          const fechaReciente = new Date(masReciente);
          if(fechaReciente >= inicioSemanaActual) resumen.contadosSemana++;
          if(fechaReciente >= inicioMesActual) resumen.contadosMes++;
        }
      });
    }
    setState({grupos: {...state.grupos, seguimientoCargando:false, seguimiento: resumen}});
  }catch(e){
    setState({grupos: {...state.grupos, seguimientoCargando:false}});
    toast(e.message,'err');
  }
}

// Corrige a mano la fecha de inicio del ciclo PROPIO del grupo (ver cicloGrupo en
// cargarSeguimientoGrupo) -- a pedido de Joel, para cuando el conteo en terreno arrancó otro día
// del que quedó registrado (mismo caso ya resuelto para el período general de la empresa, ver
// editarFechaInicioCiclo). Solo tiene sentido si el grupo tiene frecuencia (si no, no hay ciclo
// que trackear). Recalcula el seguimiento al toque para que "día X de Y" se vea actualizado sin
// esperar a la próxima carga.
// Resumen del plan generado por cada grupo (pedido de Joel: junto a "8 entradas de plan", decir
// qué son, cuántos SKU quedan por contar, el rango de fechas y cuántas entradas están por venir).
// Va en segundo plano DESPUÉS de mostrar la lista: el servidor calcula el universo de SKU de
// todas las entradas de todos los grupos en una sola ejecución (~2 s con los 332 entradas reales
// de Escondida), y la lista no tiene por qué esperarlo. Si falla, la línea simplemente no sale.
let cargarResumenPlanGruposSecuencia = 0;
async function cargarResumenPlanGrupos(grupoIds){
  if(!grupoIds.length) return;
  const miSecuencia = ++cargarResumenPlanGruposSecuencia;
  try{
    const filas = await rest('/rpc/resumen_plan_grupos', {method:'POST', body:{p_grupo_ids: grupoIds}, timeoutMs: TIMEOUT_UNIVERSO_PLAN_MS}) || [];
    if(miSecuencia !== cargarResumenPlanGruposSecuencia) return; // ya hubo otra recarga de grupos
    const porGrupo = new Map(filas.map(f=>[f.grupo_id, f]));
    const aplicar = g => {
      const f = porGrupo.get(g.id);
      return f ? {...g, planResumen: {entradas:Number(f.entradas)||0, desde:f.desde, hasta:f.hasta, porVenir:Number(f.por_venir)||0, skusPorContar:Number(f.skus_por_contar)||0}} : g;
    };
    setState({grupos: {...state.grupos, lista: (state.grupos.lista||[]).map(aplicar), pausados: (state.grupos.pausados||[]).map(aplicar)}});
  }catch(e){ /* informativo: la lista ya está en pantalla */ }
}

// Línea "Plan generado: …" de un grupo (lista y ficha). Cada entrada de plan es una ubicación o
// un storage bin planificado para una fecha (lo que crea el plan automático), no un SKU.
function descripcionPlanGrupo(grupo){
  const r = grupo && grupo.planResumen;
  if(!r || !r.entradas) return '';
  const partes = [
    `${r.entradas} entrada${r.entradas===1?'':'s'} (ubicaciones o storage bins por fecha)`,
    `${r.skusPorContar.toLocaleString('es-CL')} SKU por contar`,
    r.desde && r.hasta ? (r.desde===r.hasta ? fmtDiaCorto(r.desde) : `${fmtDiaCorto(r.desde)} – ${fmtDiaCorto(r.hasta)}`) : '',
    `${r.porVenir} por venir`,
  ].filter(Boolean);
  return `Plan generado: ${partes.join(' · ')}`;
}

// Pausar un grupo (pregunta de Joel: "¿cómo detengo un grupo?"). Solo cambia activo=false, no
// borra nada: el cron cerrar_ciclos_grupo_vencidos lo ignora (deja de cerrar ciclos), sale de la
// lista y de los filtros de Buscar, y conserva materiales e historial. A pedido de Joel se
// prefirió esto a un "Eliminar grupo": no hay política de DELETE sobre grupos_conteo y el
// historial de ciclos apunta al grupo, así que borrar no es posible ni deseable. Aparte, en un
// segundo paso explícito, se ofrece eliminar SOLO las entradas de plan futuras (de mañana en
// adelante) que generó su plan automático -- por id, exactamente las que se acaban de listar, para
// que no sigan apareciendo en Planificación ni en el plan del día de cada operador.
async function pausarGrupo(id){
  const grupo = (state.grupos.lista||[]).find(g=>g.id===id);
  if(!grupo || !perfilCargado()) return;
  if(!confirm(`¿Pausar el grupo "${grupo.nombre}"?\n\nDeja de cerrar ciclos y sale de la lista y de los filtros de Buscar. Sus materiales y su historial se conservan. Puedes reactivarlo cuando quieras.`)) return;
  try{
    await rest(`/grupos_conteo?id=eq.${encodeURIComponent(id)}`, {method:'PATCH', body:{activo:false}, prefer:'return=minimal'});
    toast(`Grupo "${grupo.nombre}" pausado`);
  }catch(e){ toast(e.message,'err'); return; }
  try{
    const manana = fechaISO(sumarDias(new Date(), 1));
    const nota = `Generado automáticamente por el grupo "${grupo.nombre}"`;
    const futuras = await restTodo(`/plan_semanal?nota=eq.${encodeURIComponent(nota)}&fecha=gte.${manana}&select=id&order=fecha.asc`);
    if(futuras.length && confirm(`El grupo tiene ${futuras.length} entrada${futuras.length===1?'':'s'} de plan generada${futuras.length===1?'':'s'} automáticamente para mañana en adelante. ¿Eliminarla${futuras.length===1?'':'s'} de la Planificación?\n\nLas de hoy y las anteriores no se tocan. Si eliges Cancelar, quedan tal cual.`)){
      // De a 200 ids por llamada para no armar una URL gigante (322 entradas con datos reales).
      for(let i=0; i<futuras.length; i+=200){
        const ids = futuras.slice(i, i+200).map(f=>f.id);
        await rest(`/plan_semanal?id=in.(${ids.join(',')})`, {method:'DELETE'});
      }
      toast(`${futuras.length} entrada${futuras.length===1?'':'s'} de plan eliminada${futuras.length===1?'':'s'}`);
      cargarPlanSemanal(); refrescarOpcionesUbicacion(); invalidarCalendario();
    }
  }catch(e){ toast(e.message,'err'); }
  volverAListaGrupos();
  await cargarGrupos();
}

// Reactivar un grupo pausado: vuelve a activo con un ciclo nuevo que arranca hoy (si se dejara la
// fecha de inicio vieja, el cron cerraría de golpe todos los ciclos "vencidos" del tiempo que
// estuvo pausado). La fecha se puede ajustar después con "Editar inicio".
async function reactivarGrupo(id){
  const grupo = (state.grupos.pausados||[]).find(g=>g.id===id);
  if(!grupo || !perfilCargado()) return;
  const hoy = fechaISO(new Date());
  if(!confirm(`¿Reactivar el grupo "${grupo.nombre}"?\n\nArranca un ciclo nuevo desde hoy (${fmtFecha(hoy)}). Puedes cambiar la fecha de inicio después con "Editar inicio".`)) return;
  try{
    await rest(`/grupos_conteo?id=eq.${encodeURIComponent(id)}`, {method:'PATCH', body:{activo:true, fecha_inicio: hoy}, prefer:'return=minimal'});
    toast(`Grupo "${grupo.nombre}" reactivado`);
    await cargarGrupos();
  }catch(e){
    toast(/idx_grupos_conteo_automatico_critico_unico/i.test(e.message||'') ? 'Ya existe otro grupo automático de Crítico activo' : e.message, 'err');
  }
}

async function editarFechaInicioGrupo(id, fechaInicio){
  if(!fechaInicio || !perfilCargado()) return;
  try{
    await rest(`/grupos_conteo?id=eq.${encodeURIComponent(id)}`, {method:'PATCH', body:{fecha_inicio: fechaInicio}, prefer:'return=minimal'});
    toast('Fecha de inicio actualizada');
    setState({grupos: {...state.grupos, editandoFechaInicioId:null}});
    await cargarGrupos();
    cargarSeguimientoGrupo(id);
  }catch(e){ toast(e.message,'err'); }
}

// Historial de ciclos ya cerrados del grupo (ver cerrar_ciclos_grupo_vencidos, el cron diario que
// guarda esta foto antes de resetear el ciclo): se lee de la vista resumen (agregada en el
// servidor) para no traer, por ejemplo, los 757 materiales de Críticos por cada ciclo cerrado solo
// para mostrar un conteo -- el detalle por material se pide aparte, y solo si se expande.
async function cargarHistorialCiclosGrupo(grupoId){

    const rows = await rest(`/historial_ciclos_grupo_resumen?grupo_id=eq.${grupoId}&select=fecha_inicio,fecha_termino,total_miembros,contados&order=fecha_inicio.desc`) || [];

  }catch(e){
    setState({grupos: {...state.grupos, historialCargando:false}});
    toast(e.message,'err');

}

function claveHistorialCiclo(fechaInicio, fechaTermino){ return `${fechaInicio}|${fechaTermino}`; }

async function alternarDetalleHistorialCiclo(grupoId, fechaInicio, fechaTermino){
  const clave = claveHistorialCiclo(fechaInicio, fechaTermino);
  if(state.grupos.historialAbierto === clave){
    setState({grupos: {...state.grupos, historialAbierto:null, historialDetalle:[]}});

  setState({grupos: {...state.grupos, historialAbierto: clave, historialDetalle:[], historialDetalleCargando:true}});
