<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>InventIA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e242c">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#161a20;
  --surface:#1e242c;
  --surface-2:#252c36;
  --line:#333c48;
  --amber:#f0a030;
  --amber-dim:#8a6224;
  --steel:#5b8fb0;
  --ok:#4caf6d;
  --warn:#e0b23c;
  --danger:#e0554a;
  --text:#eef1f4;
  --text-dim:#a3adb8;
  --text-faint:#6b7684;
  --radius:10px;
}

/* ---------- temas visuales (Configuraciones) ---------- */
:root[data-tema="acero"]{
  --bg:#10151c; --surface:#19212b; --surface-2:#212a37; --line:#2d394a;
  --amber:#4d9fe0; --amber-dim:#2a5578; --steel:#7fc4f0;
  --ok:#4caf6d; --warn:#e0b23c; --danger:#e0554a;
  --text:#edf1f5; --text-dim:#a1adba; --text-faint:#66727f; --radius:10px;
}
:root[data-tema="verde"]{
  --bg:#121a15; --surface:#19241c; --surface-2:#212f25; --line:#2d3f33;
  --amber:#43c07c; --amber-dim:#276b46; --steel:#5b8fb0;
  --ok:#5cb85c; --warn:#e0b23c; --danger:#e0554a;
  --text:#edf3ef; --text-dim:#a0b0a6; --text-faint:#647468; --radius:12px;
}
:root[data-tema="claro"]{
  --bg:#f4f5f3; --surface:#ffffff; --surface-2:#eef0ed; --line:#dde0db;
  --amber:#c9720f; --amber-dim:#f0d4ae; --steel:#3d6d8a;
  --ok:#2f8f52; --warn:#a8720a; --danger:#c23b2f;
  --text:#181b1a; --text-dim:#4c5450; --text-faint:#7c8480; --radius:14px;
}
:root[data-tema="alto_contraste"]{
  --bg:#000000; --surface:#0c0c0c; --surface-2:#181818; --line:#3a3a3a;
  --amber:#ffd400; --amber-dim:#8a7400; --steel:#29b6f6;
  --ok:#00e676; --warn:#ffd400; --danger:#ff5252;
  --text:#ffffff; --text-dim:#d4d4d4; --text-faint:#8f8f8f; --radius:4px;
}
/* el toast de error/ok usa colores pastel fijos pensados para fondo oscuro; en el tema claro necesitan su propio contraste */
:root[data-tema="claro"] .toast.err{border-color:#e3b3ae;color:#8a2b20;background:#fdf1f0;}
:root[data-tema="claro"] .toast.ok{border-color:#b7dcc3;color:#1f6b3d;background:#eef8f1;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .2s ease,color .2s ease;}
body{min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3,.display{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- barcode tick divider (signature element) ---------- */
.ticks{height:14px;display:flex;align-items:flex-end;gap:2px;overflow:hidden;opacity:0.55;}
.ticks span{display:block;width:2px;background:var(--amber);}
.ticks span:nth-child(3n){height:14px;} .ticks span:nth-child(3n+1){height:8px;} .ticks span:nth-child(3n+2){height:11px;}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 0;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-badge{width:34px;height:34px;border-radius:8px;background:linear-gradient(155deg,var(--amber),#c97a1c);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:13px;letter-spacing:-0.03em;color:#1a1204;flex-shrink:0;}
.brand-text h1{font-size:18px;margin:0;line-height:1.1;}
.brand-text span{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em;}
.user-chip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);}
.user-chip button{background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:6px;padding:5px 9px;font-size:11px;}
.user-chip button:active{background:var(--surface-2);}

/* ---------- layout ---------- */
main{flex:1;max-width:720px;width:100%;margin:0 auto;padding:18px 16px 96px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px;}
.section-head:first-child{margin-top:0;}
.section-head h2{font-size:22px;margin:0;}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--amber);font-weight:600;margin-bottom:2px;display:block;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card + .card{margin-top:10px;}

/* bin-tag card: torn top edge motif for KPI cards */
.tag-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);padding:14px 14px 12px;overflow:hidden;}
.tag-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(-55deg,var(--amber) 0 6px,transparent 6px 12px);opacity:0.85;}
.tag-card .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-faint);margin-bottom:6px;}
.tag-card .kpi-value{font-family:'Barlow Condensed';font-weight:800;font-size:30px;line-height:1;}
.tag-card .kpi-sub{font-size:12px;color:var(--text-dim);margin-top:4px;}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.segmented{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;margin-bottom:16px;gap:2px;}
.segmented-btn{flex:1;border:none;background:none;padding:9px 4px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-dim);}
.segmented-btn.active{background:var(--amber);color:#1a1204;}

.progress-track{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--amber-dim),var(--amber));border-radius:5px;transition:width .4s ease;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--text-faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;padding:6px 8px;border-bottom:1px solid var(--line);}
td{padding:8px;border-bottom:1px solid var(--line);color:var(--text-dim);}
tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono';}
.table-wrap{overflow-x:auto;}

label{display:block;font-size:12px;color:var(--text-dim);margin:12px 0 5px;font-weight:500;}
label:first-child{margin-top:0;}
input[type=text],input[type=number],input[type=password],input[type=email],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  padding:11px 12px;border-radius:8px;font-size:15px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--amber);}
textarea{resize:vertical;min-height:60px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;padding:12px 16px;font-size:14px;font-weight:600;width:100%;}
.btn-primary{background:var(--amber);color:#1a1204;}
.btn-primary:active{background:#d68e26;}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
.btn-secondary:active{background:#2c3441;}
.btn-danger{background:transparent;color:var(--danger);border:1px solid #5a2f2c;}
.btn:disabled{opacity:0.45;pointer-events:none;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{width:auto;flex:1;}

.file-input{border:1.5px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--text-dim);font-size:13px;position:relative;}
.file-input input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.file-preview{margin-top:10px;border-radius:8px;overflow:hidden;border:1px solid var(--line);max-height:220px;}
.file-preview img{width:100%;display:block;object-fit:cover;max-height:220px;}

.badge{display:inline-block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;padding:3px 8px;border-radius:5px;}
.badge-ok{background:rgba(76,175,109,.15);color:var(--ok);}
.badge-warn{background:rgba(224,178,60,.15);color:var(--warn);}
.badge-danger{background:rgba(224,85,74,.15);color:var(--danger);}
.badge-neutral{background:var(--surface-2);color:var(--text-dim);}

.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:8px;font-size:13.5px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:88%;text-align:center;}
.toast.err{border-color:#5a2f2c;color:#f3a6a0;}
.toast.ok{border-color:#2c5a3d;color:#a3e0b8;}

.empty{text-align:center;padding:30px 10px;color:var(--text-faint);}
.empty .glyph{font-size:28px;margin-bottom:8px;opacity:0.6;}

#marca-agua{position:fixed;right:10px;bottom:62px;z-index:15;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.04em;color:var(--text-faint);opacity:0.6;pointer-events:none;user-select:none;}

/* ---------- bottom nav ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px 8px;background:none;border:none;color:var(--text-faint);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.02em;}
.tab.active{color:var(--amber);}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px 26px;position:relative;overflow:hidden;}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(-55deg,var(--amber) 0 6px,transparent 6px 12px);}
.login-logo{width:52px;height:52px;border-radius:12px;background:linear-gradient(155deg,var(--amber),#c97a1c);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:19px;letter-spacing:-0.03em;color:#1a1204;margin:6px auto 14px;}
.login-title{text-align:center;font-size:22px;margin:0 0 4px;}
.login-sub{text-align:center;font-size:12.5px;color:var(--text-faint);margin-bottom:22px;}
.login-toggle{display:flex;font-size:12.5px;color:var(--text-dim);justify-content:center;margin-top:16px;gap:5px;}
.login-toggle button{background:none;border:none;color:var(--amber);font-weight:600;padding:0;}

.spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,.25);border-top-color:#1a1204;border-radius:50%;animation:spin .7s linear infinite;}
.spinner.light{border:2px solid var(--line);border-top-color:var(--amber);}
@keyframes spin{to{transform:rotate(360deg);}}

.hint{font-size:11.5px;color:var(--text-faint);margin-top:6px;line-height:1.5;}
.sku-pick{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--surface-2);}
.sku-pick div span{display:block;}
.sku-pick .code{font-family:'IBM Plex Mono';font-weight:600;font-size:13.5px;}
.sku-pick .desc{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.sku-pick button{background:var(--amber);color:#1a1204;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;}
.selected-sku{background:var(--surface-2);border:1px solid var(--amber-dim);border-radius:8px;padding:12px;margin-bottom:6px;}
.selected-sku .code{font-family:'IBM Plex Mono';font-weight:700;font-size:15px;color:var(--amber);}

.icon-btn{background:none;border:none;padding:4px;color:var(--amber);display:inline-flex;align-items:center;justify-content:center;line-height:0;}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.icon-btn.disabled{color:var(--text-faint);opacity:.35;}
.foto-modal-backdrop{position:fixed;inset:0;background:rgba(10,12,15,.86);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;}
.foto-modal-card{position:relative;max-width:92vw;max-height:86vh;}
.foto-modal-card img{max-width:92vw;max-height:86vh;display:block;border-radius:10px;border:1px solid var(--line);}
.foto-modal-close{position:absolute;top:-14px;right:-14px;width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;}
.foto-modal-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
.foto-modal-nav-prev{left:6px;}
.foto-modal-nav-next{right:6px;}
.foto-modal-contador{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--text-dim);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 10px;white-space:nowrap;}

.foto-preview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.foto-preview-item{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:var(--surface-2);}
.foto-preview-item img{width:100%;height:100%;object-fit:cover;display:block;}
.foto-preview-remove{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);border:none;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;}
.foto-preview-remove svg{width:11px;height:11px;}

.tema-opcion{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:10px;cursor:pointer;}
.tema-opcion.activo{border-color:var(--amber);}
.tema-swatches{display:flex;gap:3px;flex-shrink:0;}
.tema-swatches span{width:16px;height:16px;border-radius:4px;display:block;border:1px solid rgba(128,128,128,.35);}
.tema-info{flex:1;min-width:0;}
.tema-nombre{font-size:14px;font-weight:600;color:var(--text);}
.tema-desc{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.btn-icon-header{padding:6px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--text-dim);display:inline-flex;align-items:center;justify-content:center;}

.opcion-carga{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface-2);margin-bottom:8px;cursor:pointer;}
.opcion-carga.activo{border-color:var(--amber);background:var(--surface);}
.opcion-carga input[type=radio]{margin-top:2px;flex-shrink:0;}
.opcion-carga .nombre{font-size:13.5px;font-weight:600;color:var(--text);}
.opcion-carga .desc{font-size:11.5px;color:var(--text-faint);margin-top:2px;line-height:1.4;}

.plan-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.plan-item:last-child{border-bottom:none;}
.plan-item-ubic{font-size:13.5px;font-weight:600;color:var(--text);}
.plan-item-responsable{font-size:12px;color:var(--text-dim);margin-top:2px;}
.plan-item-nota{font-size:12px;color:var(--text-dim);margin-top:2px;}
.plan-item-universo{font-size:11px;color:var(--text-faint);margin-top:3px;}
.plan-item-detalle{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
.plan-sku-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
.plan-sku-lista li{font-size:12px;color:var(--text-dim);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.plan-sku-lista .icon-btn{padding:2px;flex:none;}

#print-plan{display:none;}
@media print{
  html,body{background:#fff;}
  #app,#toast-root{display:none;}
  #print-plan{display:block;padding:0;color:#000;background:#fff;}
  #print-plan h1{font-size:17px;margin:0 0 2px;}
  #print-plan .print-meta{font-size:11px;color:#333;margin-bottom:14px;}
  #print-plan h2{font-size:13px;text-transform:capitalize;margin:16px 0 6px;border-bottom:1px solid #000;padding-bottom:2px;page-break-after:avoid;}
  #print-plan h3{font-size:11.5px;margin:10px 0 1px;page-break-after:avoid;}
  #print-plan .print-entrada-meta{font-size:10px;color:#333;margin-bottom:4px;}
  #print-plan table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:6px;}
  #print-plan th,#print-plan td{border:1px solid #999;padding:3px 6px;text-align:left;}
  #print-plan th{background:#eee;}
  #print-plan td.print-blank{min-width:60px;}
  #print-plan .print-vacio{font-size:11px;color:#555;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>
<div id="print-plan"></div>
<div id="marca-agua" aria-hidden="true">Joel Majmut</div>

<script>
/* =======================================================================
   CONFIG — proyecto Supabase "inventario-toma-fisica"
   ======================================================================= */
const SUPABASE_URL = 'https://ncvwgsbcvklhbyvurxzz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jdndnc2JjdmtsaGJ5dnVyeHp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTcwMDAsImV4cCI6MjEwMjA3MzAwMH0.ElSrlTk0Mheb9P37BCGOLHqgGIxMVmoRLdpnlDSZYbE';
const BUCKET = 'fotos-inventario';

/* =======================================================================
   MONITOREO DE ERRORES — reporta errores del navegador del cliente a
   errores_cliente, para enterarnos aunque nadie nos escriba. Nunca debe
   romper nada ni mostrarle algo al usuario: es "mejor esfuerzo", en silencio.
   ======================================================================= */
const erroresYaReportados = new Set();
function reportarError(mensaje, stack){
  try{
    const clave = String(mensaje).slice(0,200);
    if(erroresYaReportados.has(clave)) return; // no floodear con el mismo error repetido
    erroresYaReportados.add(clave);
    fetch(`${SUPABASE_URL}/rest/v1/errores_cliente`, {
      method:'POST',
      headers:{
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${(typeof state!=='undefined' && state.session) ? state.session.access_token : SUPABASE_ANON_KEY}`,
        'Content-Type':'application/json',
        'Prefer':'return=minimal',
      },
      body: JSON.stringify([{
        empresa_id: (typeof state!=='undefined' && state.perfil) ? state.perfil.empresa_id : null,
        usuario_id: (typeof state!=='undefined' && state.perfil) ? state.perfil.id : null,
        mensaje: String(mensaje).slice(0,2000),
        stack: stack ? String(stack).slice(0,4000) : null,
        url: location.href,
        user_agent: navigator.userAgent,
      }]),
    }).catch(()=>{}); // si falla el reporte mismo, no hay nada más que hacer
  }catch(e){ /* nunca dejar que el reporte de errores rompa la app */ }
}
window.addEventListener('error', function(e){
  reportarError(e.message || 'Error desconocido', e.error && e.error.stack);
});
window.addEventListener('unhandledrejection', function(e){
  const razon = e.reason;
  reportarError((razon && razon.message) || String(razon), razon && razon.stack);
});

/* =======================================================================
   ESTADO
   ======================================================================= */
let state = {
  session: null,      // {access_token, refresh_token, user}
  perfil: null,        // fila de public.usuarios

function formatearValorAuditoria(v){
  if(v===null || v===undefined || v==='') return '—';
  if(v===true) return 'sí';
  if(v===false) return 'no';
  return String(v);
}

function resumenCambioAuditoria(fila){
  if(fila.accion==='INSERT') return 'Se creó el registro';
  if(fila.accion==='DELETE') return 'Se eliminó el registro';
  const campos = CAMPOS_AUDITADOS[fila.tabla] || [];
  const antes = fila.datos_antes || {};
  const despues = fila.datos_despues || {};
  const cambios = campos
    .filter(([campo]) => JSON.stringify(antes[campo]) !== JSON.stringify(despues[campo]))
    .map(([campo,label]) => `${label}: ${formatearValorAuditoria(antes[campo])} → ${formatearValorAuditoria(despues[campo])}`);
  return cambios.length ? cambios.join(' · ') : 'Sin cambios visibles';
}

   ======================================================================= */
async function authRequest(path, body){
  const res = await fetch(`${SUPABASE_URL}/auth/v1${path}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(()=> ({}));
  if(!res.ok){ throw new Error(data.error_description || data.msg || data.error || 'Error de autenticación'); }
  return data;
}

async function rest(path, { method='GET', body=null, prefer=null, extraHeaders={} } = {}){
  const hacerLlamada = () => {
    const headers = {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      ...extraHeaders
    };
    if(prefer) headers['Prefer'] = prefer;
    return fetch(`${SUPABASE_URL}/rest/v1${path}`, { method, headers, body: body?JSON.stringify(body):null });
  };
  let res = await hacerLlamada();
  // El access_token dura poco (~1h); si ya venció, refrescamos con el refresh_token
  // guardado y reintentamos una sola vez antes de mostrar el error.
  if(res.status===401 && state.session && state.session.refresh_token){
    const refrescada = await refrescarSesion();
    if(refrescada) res = await hacerLlamada();
  }
  const text = await res.text(); // POST/PATCH con Prefer: return=minimal responden 200/201 con cuerpo vacío, no 204 — no asumir JSON siempre presente
  let data = null;
  if(text){ try{ data = JSON.parse(text); }catch(e){ /* respuesta no-JSON */ } }
  if(!res.ok){
    throw new Error((data && data.message) || res.statusText || 'Error de base de datos');
  }
  return data;
}

async function storageUpload(path, file){
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
    method:'POST',
    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session.access_token}`,
      'Content-Type': file.type || 'application/octet-stream',
      'x-upsert':'true'
    },
    body:file
  });
  if(!res.ok){ const err=await res.json().catch(()=>({})); throw new Error(err.message||'No se pudo subir la foto'); }
  return path; // el bucket es privado: se guarda la ruta, la URL para verla se firma al momento de mostrarla
}

// Genera una URL temporal para ver una foto del bucket privado. Acepta tanto
// una ruta nueva (empresa_id/sku/archivo) como una URL pública completa de
// fotos subidas antes de que el bucket pasara a privado.
async function crearUrlFirmada(fotoUrlORuta){
  const marcador = `/object/public/${BUCKET}/`;
  const idx = fotoUrlORuta.indexOf(marcador);
  const ruta = idx>=0 ? fotoUrlORuta.slice(idx+marcador.length) : fotoUrlORuta;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/sign/${BUCKET}/${ruta}`, {
    method:'POST',
    headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${state.session.access_token}`, 'Content-Type':'application/json' },
    body: JSON.stringify({expiresIn:3600})
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok || !data.signedURL) throw new Error(data.message || 'No se pudo abrir la foto');
  return `${SUPABASE_URL}/storage/v1${data.signedURL}`;
}

function toast(msg, type='ok'){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast ${type==='err'?'err':'ok'}`;

}

const SESION_KEY = 'sesion_inventario';

function guardarSesion(data){
  try{ localStorage.setItem(SESION_KEY, JSON.stringify({access_token:data.access_token, refresh_token:data.refresh_token, user:data.user})); }catch(e){ /* localStorage no disponible (modo privado, etc.) */ }
}

function borrarSesionGuardada(){
  try{ localStorage.removeItem(SESION_KEY); }catch(e){ /* nada que borrar */ }
}

// El access_token dura ~1h; con el refresh_token pedimos uno nuevo sin que
// la persona tenga que volver a loguearse (ni al recargar la página, ni
// a mitad de un turno largo de conteo).
async function refrescarSesion(){
  if(!state.session || !state.session.refresh_token) return false;
  try{
    const data = await authRequest('/token?grant_type=refresh_token', {refresh_token: state.session.refresh_token});
    if(!data.access_token) return false;
    state.session = data;
    guardarSesion(data);
    return true;
  }catch(e){ return false; }
}

// Al abrir la app, si hay una sesión guardada la restauramos (con refresh)
// en vez de mostrar el login. Si el refresh_token ya no sirve o la cuenta
// fue desactivada, la limpiamos y seguimos al login normal.
async function restaurarSesionGuardada(){
  let guardada;
  try{ guardada = JSON.parse(localStorage.getItem(SESION_KEY)); }catch(e){ guardada = null; }
  if(!guardada || !guardada.refresh_token) return;
  state.session = guardada;
  const ok = await refrescarSesion();
  if(!ok){ state.session = null; borrarSesionGuardada(); return; }
  await cargarPerfil();
  if(!state.perfil){ state.session = null; borrarSesionGuardada(); return; }
  cargarTodo();
}

async function cargarPerfil(){
  const uid = state.session.user.id;
  const rows = await rest(`/usuarios?auth_user_id=eq.${uid}&select=id,nombre,rol,es_super_admin,empresa_id,empresas(nombre,codigo_invitacion,planes(nombre,etiqueta,max_bodegas,max_usuarios,offline_habilitado,dashboard_ejecutivo_habilitado,auditoria_habilitada))`);
  if(rows && rows[0]) state.perfil = rows[0];
  else state.perfil = null;
}

// Si no hay plan cargado (aún no llegó del backend, o el embed falló) se asume acceso
// completo: es una restricción de UX, no de seguridad — el límite real lo aplican los
// triggers en la base de datos, así que fallar "abierto" acá no compromete nada.
function planIncluye(campo){
  const plan = state.perfil && state.perfil.empresas && state.perfil.empresas.planes;
  if(!plan) return true;
  return !!plan[campo];
}

// Al llegar desde el link del correo de invitación, Supabase redirige con el
// token de sesión en el fragmento de la URL (#access_token=...&type=recovery).
// Lo detectamos antes del primer render para mostrar "crea tu contraseña"
// en vez del login normal.
async function procesarLlegadaPorInvitacion(){
  const hash = location.hash.startsWith('#') ? location.hash.slice(1) : '';
  const params = new URLSearchParams(hash);
  const accessToken = params.get('access_token');
  const tipo = params.get('type');
  if(!accessToken || (tipo!=='recovery' && tipo!=='invite')) return;
  history.replaceState(null, '', location.pathname + location.search);
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${accessToken}` }
    });
    const user = await res.json();
    if(!res.ok || !user.id) throw new Error('El link de invitación ya no es válido');
    state.session = { access_token: accessToken, refresh_token: params.get('refresh_token'), user };
    state.debeCrearPassword = true;
  }catch(e){
    toast(e.message,'err');
  }
}

// Página del listado de SKUs (tabla "SKU activos"), con conteo exacto vía Prefer: count=exact
// para poder mostrar Anterior/Siguiente y ver el 100% de los materiales, no solo los primeros 500.
async function fetchSkusPagina(page){
  const from = page*SKUS_POR_PAGINA;
  const to = from + SKUS_POR_PAGINA - 1;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/skus?activo=eq.true&order=sku_code.asc`, {
    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
      'Range-Unit': 'items',
      'Range': `${from}-${to}`,
      'Prefer': 'count=exact',
    }
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : [];
  if(!res.ok){ throw new Error((data && data.message) || res.statusText || 'Error de base de datos'); }
  const range = res.headers.get('content-range'); // ej. "0-49/1410"
  const total = range && range.includes('/') ? Number(range.split('/')[1]) : data.length;
  return { data, total };
}

async function cargarSkusPagina(page=0){
  try{

async function eliminarSkusSeleccionados(){
  const ids = state.skusSeleccionados;
  if(!ids.length) return;
  if(!confirm(`¿Eliminar ${ids.length} SKU? Esta acción no se puede deshacer.`)) return;
  setState({loading:true});
  try{
    // Un SKU con conteos ya registrados no se puede borrar (protegido por la base de datos):
    // los separamos primero para avisar cuáles se saltaron, en vez de que falle todo el lote.
    const conteosExistentes = await rest(`/conteos?select=sku_id&sku_id=in.(${ids.join(',')})`);
    const idsConConteos = new Set((conteosExistentes||[]).map(c=>c.sku_id));
    const idsABorrar = ids.filter(id=>!idsConConteos.has(id));
    if(idsABorrar.length) await rest(`/skus?id=in.(${idsABorrar.join(',')})`, {method:'DELETE'});
    const omitidos = ids.length - idsABorrar.length;
    if(!omitidos){
      toast(`${idsABorrar.length} SKU eliminados`);
    }else if(idsABorrar.length){
      toast(`${idsABorrar.length} SKU eliminados. ${omitidos} no se eliminaron: ya tienen conteos registrados (desactívalos en vez de eliminarlos).`, 'err');
    }else{
      toast('No se eliminó ningún SKU: todos ya tienen conteos registrados. Desactívalos en vez de eliminarlos.', 'err');
    }
    setState({loading:false});
    refrescarListaSkus();
  }catch(e){
    setState({loading:false});
    toast(e.message,'err');
  }
}

/* =======================================================================
   PLANIFICACIÓN SEMANAL — por ubicación (bodega), ubicación específica y storage bin
   ======================================================================= */
function fechaISO(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function sumarDias(d, n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function inicioSemana(d){
  const date = new Date(d);
  const dia = date.getDay(); // 0=domingo .. 6=sabado
  const diff = dia===0 ? -6 : 1-dia; // retrocede hasta el lunes
  date.setDate(date.getDate()+diff);
  date.setHours(0,0,0,0);
  return date;
}

// Arma el filtro PostgREST que excluye del cálculo los SKU quitados a mano de una entrada del plan.
function filtroExclusion(excluidos){
  if(!excluidos || !excluidos.length) return '';
  return `&sku_code=not.in.(${excluidos.map(s=>encodeURIComponent(s)).join(',')})`;
}

// SKU "sueltos": sin ubicación general ni específica (ver renderPlanificacion / crearPlanEntrada).
// Las vistas ubicaciones_generales/especificas/bins los excluyen a propósito (agrupan solo lo que
// tiene bodega/ubicacion), así que para plani­ficarlos hay que filtrar explícitamente is.null.
function filtroSoloSinUbicacion(soloSinUbicacion){
  return soloSinUbicacion ? '&bodega=is.null&ubicacion=is.null' : '';
}

async function contarUniversoUbicacion({bodega, ubicacion, storage_bin, excluidos, soloSinUbicacion}){
  let filtro = '/skus?activo=eq.true';
  if(soloSinUbicacion){
    filtro += filtroSoloSinUbicacion(true);
  }else{
    if(bodega) filtro += `&bodega=eq.${encodeURIComponent(bodega)}`;
    if(ubicacion) filtro += `&ubicacion=eq.${encodeURIComponent(ubicacion)}`;
    if(storage_bin) filtro += `&storage_bin=eq.${encodeURIComponent(storage_bin)}`;
  }
  filtro += filtroExclusion(excluidos);
  const res = await fetch(`${SUPABASE_URL}/rest/v1${filtro}`, {
    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
      'Range-Unit': 'items',
      'Range': '0-0',
      'Prefer': 'count=exact',
    }
  });
  const range = res.headers.get('content-range');
  return range && range.includes('/') ? Number(range.split('/')[1]) : 0;
}

// Trae el detalle completo (no solo el conteo) de los SKU de una ubicación planificada,
// paginando de a 1000 filas vía Range para no chocar con el límite de fila de PostgREST.
async function skusDeUbicacion({bodega, ubicacion, storage_bin, excluidos, soloSinUbicacion}){
  let filtro = '/skus?activo=eq.true&select=sku_code,descripcion,storage_bin,unidad_medida&order=storage_bin.asc,sku_code.asc';
  if(soloSinUbicacion){
    filtro += filtroSoloSinUbicacion(true);
  }else{
    if(bodega) filtro += `&bodega=eq.${encodeURIComponent(bodega)}`;
    if(ubicacion) filtro += `&ubicacion=eq.${encodeURIComponent(ubicacion)}`;
    if(storage_bin) filtro += `&storage_bin=eq.${encodeURIComponent(storage_bin)}`;
  }
  filtro += filtroExclusion(excluidos);
  const TAM_PAGINA = 1000;
  let desde = 0, total = Infinity, filas = [];
  while(desde < total){
    const res = await fetch(`${SUPABASE_URL}/rest/v1${filtro}`, {
      headers:{
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${state.session ? state.session.access_token : SUPABASE_ANON_KEY}`,
        'Range-Unit': 'items',
        'Range': `${desde}-${desde+TAM_PAGINA-1}`,
        'Prefer': 'count=exact',
      }
    });
    const text = await res.text();
    const data = text ? JSON.parse(text) : [];
    if(!res.ok){ throw new Error((data && data.message) || res.statusText || 'Error de base de datos'); }
    filas = filas.concat(data);
    const range = res.headers.get('content-range');
    total = range && range.includes('/') ? Number(range.split('/')[1]) : filas.length;
    desde += TAM_PAGINA;
    if(!data.length) break;
  }
  return filas;
}

async function cargarPlanSemanal(){
  const inicio = state.plan.semanaInicio || fechaISO(inicioSemana(new Date()));
  const fin = fechaISO(sumarDias(new Date(inicio+'T00:00:00'), 6));
  try{
    const rows = await rest(`/plan_semanal_detalle?fecha=gte.${inicio}&fecha=lte.${fin}&order=fecha.asc`);
    setState({plan: {...state.plan, semanaInicio: inicio, entradas: rows||[], seleccionados:[]}});
    (rows||[]).forEach(async r=>{
      const total = await contarUniversoUbicacion({bodega:r.bodega, ubicacion:r.ubicacion, storage_bin:r.storage_bin, excluidos:r.skus_excluidos, soloSinUbicacion:r.solo_sin_ubicacion});
      setState({plan: {...state.plan, universos: {...state.plan.universos, [r.id]: total}}});
    });
    (rows||[]).forEach(async r=>{
      const skus = await skusDeUbicacion({bodega:r.bodega, ubicacion:r.ubicacion, storage_bin:r.storage_bin, excluidos:r.skus_excluidos, soloSinUbicacion:r.solo_sin_ubicacion});
      setState({plan: {...state.plan, detalle: {...state.plan.detalle, [r.id]: skus}}});
    });
  }catch(e){ toast(e.message,'err'); }
}

// Quita caracteres que puedan romper la sintaxis de filtros de PostgREST (,()."*)
function sanearTextoFiltro(s){
  return String(s||'').replace(/[,()."*]/g, ' ').trim();
}

function construirPathBusqueda(offset){
  let path = `/conteos?select=*,skus(sku_code,descripcion,categoria,ubicacion),conteo_fotos(foto_url),ciclos_conteo(nombre)&order=fecha_conteo.desc&limit=${TAM_PAGINA_LISTA}&offset=${offset}`;
  const bodega = sanearTextoFiltro(state.busqueda.bodega);
  if(bodega) path += `&bodega=ilike.*${encodeURIComponent(bodega)}*`;
  if(state.busqueda.estado) path += `&estado=eq.${encodeURIComponent(state.busqueda.estado)}`;
  if(state.busqueda.ciclo === '__sin_ciclo__') path += `&ciclo_id=is.null`;
  else if(state.busqueda.ciclo) path += `&ciclo_id=eq.${encodeURIComponent(state.busqueda.ciclo)}`;
  return path;
}

// El texto y "solo con fotos" se filtran en el cliente (no son filtros directos de
// PostgREST sobre columnas propias), por eso se aplican después de traer cada página.
function filtrarResultadosBusqueda(rows){
  let filtradas = rows;
  const texto = sanearTextoFiltro(state.busqueda.texto).toLowerCase();
  if(texto){
    filtradas = filtradas.filter(r=>{
      const codigo = (r.skus? r.skus.sku_code : '').toLowerCase();
      const desc = (r.skus? r.skus.descripcion||'' : '').toLowerCase();
      return codigo.includes(texto) || desc.includes(texto);
    });
  }
  if(state.busqueda.soloConFotos) filtradas = filtradas.filter(r=> (r.conteo_fotos||[]).length>0);
  return filtradas;
}

/* =======================================================================
   CSV — parser mínimo (soporta comillas y comas dentro de campos)
   ======================================================================= */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  text = text.replace(/^\uFEFF/, ''); // quita BOM de exportaciones SAP/Excel
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false;
      } else field += c;
    }else{
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return {headers:[], data:[]};
  const headers = rows[0].map(h=>h.trim());
  const data = rows.slice(1).filter(r=>r.some(v=>v && v.trim()!=='')).map(r=>{
    const obj = {};
    headers.forEach((h,idx)=> obj[h] = (r[idx]!==undefined? r[idx].trim() : ''));
    return obj;
  });
  return {headers, data};
}

/* =======================================================================
   EXCEL — lectura de .xlsx/.xls via SheetJS (cargada en el head)
   ======================================================================= */
async function leerExcel(file){
  if(typeof XLSX === 'undefined'){
    throw new Error('No se pudo cargar el lector de Excel (revisa tu conexion) e intenta de nuevo, o sube el archivo como .csv.');
  }
  const buf = await file.arrayBuffer();
  const libro = XLSX.read(buf, {type:'array'});
  const hoja = libro.Sheets[libro.SheetNames[0]];
  const filas = XLSX.utils.sheet_to_json(hoja, {defval:''});
  if(!filas.length) return {headers:[], data:[]};
  const headers = Object.keys(filas[0]).map(h=>String(h).trim());
  const data = filas.map(f=>{
    const obj = {};
    headers.forEach(h=> obj[h] = (f[h]!==undefined && f[h]!==null) ? String(f[h]).trim() : '');
    return obj;
  });
  return {headers, data};
}

async function leerArchivoMasivo(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(ext==='xlsx' || ext==='xls') return leerExcel(file);
  const text = await file.text();
  return parseCSV(text);
}

/* =======================================================================
   CLASIFICADOR GENERICO DE COLUMNAS
   Detecta automaticamente, por nombre de columna (en espanol o ingles, de
   SAP o de cualquier planilla armada a mano), a que campo de la tabla
   "skus" corresponde cada una, sin depender de encabezados fijos.
   ======================================================================= */
const CAMPOS_SKU = [
  { campo:'sku_code', obligatorio:true, etiqueta:'Codigo SKU',
    alias:['material','sku','sku code','codigo','codigo sku','codigo material','cod','cod sku','item','item code','articulo','part number','material number','nro material','n material'] },
  { campo:'descripcion', obligatorio:false, etiqueta:'Descripcion',
    alias:['material description','descripcion','descripcion material','texto breve de material','short text','nombre','detalle','desc'] },
  { campo:'categoria', obligatorio:false, etiqueta:'Categoria',
    alias:['plant name','categoria','material group','grupo de articulos','familia','grupo','clase'] },
  { campo:'unidad_medida', obligatorio:false, etiqueta:'Unidad de medida',
    alias:['unidad_medida','unidad de medida','base unit of measure','uom','um','unidad'] },
  { campo:'ubicacion', obligatorio:false, etiqueta:'Ubicación específica',
    alias:['ubicacion especifica','storage location','ubicacion','location','rack'] },
  { campo:'storage_bin', obligatorio:false, etiqueta:'Storage bin',
    alias:['storage bin','bin','posicion','slot'] },
  { campo:'bodega', obligatorio:false, etiqueta:'Ubicación general',
    alias:['ubicacion general','description of storage location','sloc description','bodega','almacen','warehouse','plant','deposito'] },
  { campo:'stock_sistema', obligatorio:true, etiqueta:'Stock sistema',
    alias:['unrestricted stock','stock_sistema','stock sistema','stock','existencia','cantidad','qty','quantity','saldo','on hand'] },
];

function normalizarTexto(s){
  return String(s||'')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,' ')
    .trim();
}

// El primer alias de cada campo es su nombre "canónico" (el que más probablemente
// use alguien que arma la planilla a mano en español); una coincidencia exacta con
// ese alias pesa más que una coincidencia exacta con un alias genérico/jerga SAP,
// para que columnas como "Ubicación general" no pierdan contra "Storage Location"
// cuando el mismo archivo trae ambas.
function puntajeColumna(headerNorm, aliases){
  let mejor = 0;
  aliases.forEach((alias, idx)=>{
    const a = normalizarTexto(alias);
    if(headerNorm === a){ mejor = Math.max(mejor, idx===0? 110 : 100); return; }
    if(headerNorm.includes(a) || a.includes(headerNorm)){ mejor = Math.max(mejor, 75); return; }
    const hw = new Set(headerNorm.split(' '));
    const comunes = a.split(' ').filter(w=>w && hw.has(w)).length;
    if(comunes) mejor = Math.max(mejor, 40 + comunes*10);
  });
  return mejor;
}

// Asignacion voraz columna->campo: cada columna del archivo se usa como
// maximo para un campo, priorizando siempre la coincidencia de mayor puntaje.
function detectarMapeo(headers, campos){
  const headersNorm = headers.map(normalizarTexto);
  const candidatos = [];
  campos.forEach(campo=>{
    headers.forEach((h,idx)=>{
      const p = puntajeColumna(headersNorm[idx], campo.alias);
      if(p>0) candidatos.push({campo:campo.campo, header:h, puntaje:p});
    });
  });
  candidatos.sort((a,b)=> b.puntaje-a.puntaje);
  const mapeo = {};
  const usados = new Set();
  candidatos.forEach(c=>{
    if(mapeo[c.campo] || usados.has(c.header) || c.puntaje<60) return;
    mapeo[c.campo] = c.header;
    usados.add(c.header);
  });
  return mapeo;
}

async function crearSkuManual(payload){
  if(!perfilCargado()) return false;
  const capturadoEn = new Date().toISOString();
  try{
    // upsert por (empresa_id, sku_code): si el código ya existía para esta empresa, se
    // actualiza con los datos ingresados en vez de fallar por la restricción única —
    // mismo criterio que usa la carga masiva por CSV.
    await rest('/skus?on_conflict=empresa_id,sku_code', {method:'POST', body:[{...payload, empresa_id: state.perfil.empresa_id, capturado_en: capturadoEn}], prefer:'return=minimal,resolution=merge-duplicates'});
    toast('SKU guardado correctamente');
    refrescarListaSkus();
    return true;
  }catch(e){
    // Sin conexión de verdad (no un error del servidor): igual que con los conteos, el
    // SKU se guarda en este dispositivo y se sube solo al volver la señal.
    if(pareceFalloDeRed(e)){
      encolarAccionOffline('sku', {...payload, empresa_id: state.perfil.empresa_id});
      toast('Sin conexión: SKU guardado en este dispositivo. Se enviará cuando vuelva la señal.', 'err');
      return true;
    }
    toast(e.message,'err');
    return false;
  }
}

async function prepararCargaMasiva(file){
  try{
    const {headers, data} = await leerArchivoMasivo(file);
    if(!headers.length || !data.length){ toast('El archivo no tiene filas de datos','err'); return; }
    const mapeo = detectarMapeo(headers, CAMPOS_SKU);
    setState({cargaPreview: { file, headers, data, campos:CAMPOS_SKU, mapeo, modo:'complementar', confirmaReemplazo:false }});
  }catch(e){ toast(e.message,'err'); }
}

async function confirmarCargaMasiva(){
  if(!perfilCargado()) return;
  const { file, data, mapeo, modo } = state.cargaPreview;
  const valor = (row, campo) => mapeo[campo] ? (row[mapeo[campo]]!==undefined ? String(row[mapeo[campo]]).trim() : '') : '';

  setState({loading:true});

  const marcaTiempo = new Date().toISOString();
  let ok=0, error=0; const errores=[];
  const porCodigo = new Map();
  data.forEach((row,idx)=>{
    const sku_code = valor(row,'sku_code');
    if(!sku_code){ error++; errores.push({fila:idx+2, motivo:'Código de SKU vacío'}); return; }
    ok++;
    const stockRaw = valor(row,'stock_sistema');
    porCodigo.set(sku_code, {
      sku_code,
      empresa_id: state.perfil.empresa_id,
      descripcion: valor(row,'descripcion') || null,
      categoria: valor(row,'categoria') || null,
      unidad_medida: valor(row,'unidad_medida') || null,
      ubicacion: valor(row,'ubicacion') || null,
      storage_bin: valor(row,'storage_bin') || null,
      bodega: valor(row,'bodega') || null,
      stock_sistema: stockRaw!=='' ? Number(stockRaw) : null,
      activo: true,
      updated_at: marcaTiempo,
      capturado_en: marcaTiempo,
    }); // si el archivo trae una fila por planta/ubicación para el mismo código, nos quedamos con la última
  });
  const lote = Array.from(porCodigo.values());
  try{
    if(lote.length) await rest('/skus?on_conflict=empresa_id,sku_code', {method:'POST', body:lote, prefer:'return=minimal,resolution=merge-duplicates'});
    // "Reemplazar completo": todo lo que quedó activo y NO se tocó en este lote (updated_at previo a esta carga) pasa a inactivo.
    if(modo==='reemplazar' && lote.length){
      await rest(`/skus?activo=eq.true&updated_at=lt.${encodeURIComponent(marcaTiempo)}`, {method:'PATCH', body:{activo:false}, prefer:'return=minimal'});
    }
    await registrarCarga(file.name, 'skus', data.length, ok, error, errores);
    toast(`Carga completa: ${lote.length} SKUs cargados${modo==='reemplazar'?' (reemplazo completo)':''}${error?`, ${error} con error`:''}`);
    refrescarListaSkus();
    setState({loading:false, cargaPreview:null});
  }catch(e){
    await registrarCarga(file.name, 'skus', data.length, 0, data.length, [{motivo:e.message}]);
    setState({loading:false});
    toast(e.message,'err');
  }
}

   ACCIONES — Toma de inventario
   ======================================================================= */
/* =======================================================================
   MODO OFFLINE — cola local para conteos y SKU cuando no hay conexión
   ======================================================================= */
const COLA_OFFLINE_KEY = 'cola_offline_conteos'; // nombre histórico; hoy también guarda SKU (ver "tipo" de cada item)
const TIPO_ACCION_OFFLINE_LABEL = { conteo:'Conteo', sku:'SKU' };

// fetch() rechaza con TypeError cuando la red falla de verdad (sin señal, DNS, etc.);
// los errores HTTP (4xx/5xx) llegan como una Response resuelta, no como excepción.
// Así distinguimos "no hay conexión" (encolar) de "el servidor rechazó la solicitud" (mostrar el error).
function pareceFalloDeRed(e){
  return e instanceof TypeError;
}

function leerColaOffline(){
  try{ return JSON.parse(localStorage.getItem(COLA_OFFLINE_KEY)||'[]'); }catch(e){ return []; }
}

function guardarColaOffline(cola){
  try{ localStorage.setItem(COLA_OFFLINE_KEY, JSON.stringify(cola)); }catch(e){ /* localStorage no disponible */ }
  state.colaOffline = cola;
}

// Crea la entrada en la cola y la deja visible de inmediato ("pendiente"); devuelve
// el item creado (con su id local) para poder asociarle fotos en IndexedDB (solo aplica
// a conteos). `tipo` decide cómo se procesa al sincronizar (ver procesarUnItemOffline).
function encolarAccionOffline(tipo, payload){
  const cola = leerColaOffline();
  const item = { id: 'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,7), tipo, creado_en: Date.now(), estado:'pendiente', error:null, ...payload };
  cola.push(item);
  guardarColaOffline(cola);
  return item;
}

function quitarDeColaOffline(id){
  guardarColaOffline(leerColaOffline().filter(i=>i.id!==id));
}

function marcarErrorEnColaOffline(id, mensaje){
  guardarColaOffline(leerColaOffline().map(i => i.id===id ? {...i, estado:'error', error:mensaje} : i));
}

/* -----------------------------------------------------------------------
   Fotos offline (IndexedDB): localStorage no sirve para archivos binarios
   (límite chico, ~5-10MB), así que las fotos de conteos guardados sin
   conexión se guardan aparte, en IndexedDB, asociadas al id del conteo
   encolado, y se suben recién al sincronizar.
   ----------------------------------------------------------------------- */
const OFFLINE_DB_NAME = 'certero_offline';
const FOTOS_OFFLINE_STORE = 'fotos_pendientes';

function abrirDbOffline(){
  return new Promise((resolve, reject) => {
    if(typeof indexedDB === 'undefined'){ reject(new Error('IndexedDB no disponible en este navegador')); return; }
    const req = indexedDB.open(OFFLINE_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(FOTOS_OFFLINE_STORE)){
        const store = db.createObjectStore(FOTOS_OFFLINE_STORE, {keyPath:'id'});
        store.createIndex('itemId', 'itemId', {unique:false});
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function solicitudAPromesa(req){
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// Guarda una o más fotos (File) asociadas al conteo encolado `itemId`.
async function guardarFotosOffline(itemId, archivos){
  if(!archivos || !archivos.length) return;
  const db = await abrirDbOffline();
  const store = db.transaction(FOTOS_OFFLINE_STORE, 'readwrite').objectStore(FOTOS_OFFLINE_STORE);
  await Promise.all(archivos.map((file,i) => solicitudAPromesa(store.put({
    id: `${itemId}-${i}-${Math.random().toString(36).slice(2,7)}`,
    itemId, nombre: file.name, tipo: file.type, blob: file,
  }))));
  db.close();
}

async function leerFotosOffline(itemId){
  const db = await abrirDbOffline();
  const store = db.transaction(FOTOS_OFFLINE_STORE, 'readonly').objectStore(FOTOS_OFFLINE_STORE);
  const fotos = await solicitudAPromesa(store.index('itemId').getAll(itemId));
  db.close();
  return fotos;
}

async function borrarFotosOffline(itemId){
  const db = await abrirDbOffline();
  const store = db.transaction(FOTOS_OFFLINE_STORE, 'readwrite').objectStore(FOTOS_OFFLINE_STORE);
  const claves = await solicitudAPromesa(store.index('itemId').getAllKeys(itemId));
  await Promise.all(claves.map(k => solicitudAPromesa(store.delete(k))));
  db.close();
}

async function descartarAccionOffline(id){
  const item = leerColaOffline().find(i=>i.id===id);
  const tipoTexto = item && item.tipo==='sku' ? 'este SKU guardado' : 'este conteo guardado';
  if(!confirm(`¿Descartar ${tipoTexto} sin conexión? Esta acción no se puede deshacer.`)) return;
  quitarDeColaOffline(id);
  await borrarFotosOffline(id).catch(()=>{});
  render();
}

// Procesa un único item encolado sin conexión. El tipo decide qué hacer:
// - 'sku': upsert directo a /skus (mismo criterio que crearSkuManual/carga masiva).
// - 'conteo' (o sin tipo, para lo ya encolado antes de que existiera este campo): sube sus
//   fotos pendientes (si tiene), crea el conteo y lo enlaza con esas fotos.
// No toca la cola/localStorage; eso lo decide quien llama según el resultado.
async function procesarUnItemOffline(item){
  // item.creado_en queda registrado desde el momento en que se encoló (sin conexión), no
  // cuándo se sincroniza — es la fecha/hora real de captura para efectos de auditoría.
  const capturadoEn = new Date(item.creado_en).toISOString();
  try{
    if(item.tipo==='sku'){
      await rest('/skus?on_conflict=empresa_id,sku_code', {method:'POST', body:[{
        sku_code: item.sku_code,
        descripcion: item.descripcion,
        categoria: item.categoria,
        unidad_medida: item.unidad_medida,
        bodega: item.bodega,
        ubicacion: item.ubicacion,
        storage_bin: item.storage_bin,
        stock_sistema: item.stock_sistema,
        empresa_id: item.empresa_id,
        capturado_en: capturadoEn,
      }], prefer:'return=minimal,resolution=merge-duplicates'});
      return {ok:true};
    }

    const fotos = await leerFotosOffline(item.id).catch(()=>[]);
    const urls = [];
    for(const foto of fotos){
      const ext = (foto.nombre.split('.').pop()||'jpg').toLowerCase();
      const ruta = `${item.empresa_id}/${item.sku_code}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
      urls.push(await storageUpload(ruta, foto.blob));
    }
    const filas = await rest('/conteos', {method:'POST', body:[{
      sku_id: item.sku_id,
      usuario_id: item.usuario_id,
      empresa_id: item.empresa_id,
      cantidad_contada: item.cantidad_contada,
      ubicacion_contada: item.ubicacion_contada,
      bodega: item.bodega,
      observacion: item.observacion,
      capturado_en: capturadoEn,
    }], prefer:'return=representation'});
    const conteoId = filas && filas[0] && filas[0].id;
    if(conteoId && urls.length){
      await rest('/conteo_fotos', {method:'POST', body: urls.map(foto_url=>({conteo_id:conteoId, foto_url})), prefer:'return=minimal'});
    }
    await borrarFotosOffline(item.id).catch(()=>{});
    return {ok:true};
  }catch(e){
    if(pareceFalloDeRed(e)) return {ok:false, red:true};
    return {ok:false, red:false, mensaje:e.message};
  }
}

// Envía los conteos y SKU guardados sin conexión, en orden, uno por uno. Si vuelve a
// fallar por red se detiene ahí (se sigue sin conexión) y deja el resto para
// el próximo intento. Un item que falla por un error real del servidor
// (no de red) queda marcado como "error" y visible en la cola en vez de
// perderse en silencio; esos solo se reintentan a mano, para no reintentar
// en bucle algo que ya sabemos que va a volver a fallar igual.
async function sincronizarColaOffline(){
  if(!state.session || state.sincronizandoOffline) return;
  const cola = leerColaOffline();
  const pendientes = cola.filter(i=>i.estado!=='error');
  if(!pendientes.length) return;
  state.sincronizandoOffline = true;
  render();
  let enviados = 0;
  let seCorto = false;
  for(const item of pendientes){
    if(seCorto) break;
    const resultado = await procesarUnItemOffline(item);
    if(resultado.ok){ quitarDeColaOffline(item.id); enviados++; }
    else if(resultado.red) seCorto = true;
    else marcarErrorEnColaOffline(item.id, resultado.mensaje);
  }
  state.sincronizandoOffline = false;
  if(enviados>0){
    toast(`${enviados} cambio${enviados===1?'':'s'} sincronizado${enviados===1?'':'s'}`);
    cargarDashboard(); cargarUltimosConteos(); cargarReconteos(); refrescarListaSkus();
  }
  render();
}

// Reintento manual de un item puntual (desde el panel de detalle), sin
// importar si ya estaba marcado como "error" — a diferencia de la
// sincronización automática, este sí se dispara a pedido explícito.
async function reintentarAccionOffline(id){
  if(!state.session || state.sincronizandoOffline) return;
  const item = leerColaOffline().find(i=>i.id===id);
  if(!item) return;
  state.sincronizandoOffline = true;
  render();
  const resultado = await procesarUnItemOffline(item);
  if(resultado.ok){
    quitarDeColaOffline(id);
    toast(item.tipo==='sku' ? 'SKU sincronizado' : 'Conteo sincronizado');
    cargarDashboard(); cargarUltimosConteos(); cargarReconteos(); refrescarListaSkus();
  }else if(resultado.red){
    toast('Sigue sin haber conexión','err');
  }else{
    marcarErrorEnColaOffline(id, resultado.mensaje);
    toast(`No se pudo sincronizar: ${resultado.mensaje}`,'err');
  }
  state.sincronizandoOffline = false;
  render();
}

async function guardarConteo({cantidad, ubicacion, bodega, observacion}){
  if(!state.skuSeleccionado){ toast('Selecciona un SKU primero','err'); return; }
  if(cantidad === '' || cantidad === null || isNaN(Number(cantidad)) || Number(cantidad) < 0){ toast('Ingresa una cantidad contada válida','err'); return; }
  if(!perfilCargado()) return;
  // Momento real en que la persona capturó el conteo (no cuándo termina de guardarse) —
  // fundamental para auditoría cuando se guarda sin conexión y se sincroniza horas después.
  const capturadoEn = new Date().toISOString();
  setState({loading:true});
  try{
    const filas = await rest('/conteos', {method:'POST', body:[{
      sku_id: state.skuSeleccionado.id,
      usuario_id: state.perfil ? state.perfil.id : null,
      empresa_id: state.perfil.empresa_id,
      cantidad_contada: Number(cantidad),
      ubicacion_contada: ubicacion || null,
      bodega: bodega || state.skuSeleccionado.bodega || null,
      observacion: observacion || null,
      capturado_en: capturadoEn,
    }], prefer:'return=representation'});
    const conteoId = filas && filas[0] && filas[0].id;

    if(conteoId && state.conteoFotos.length){
      const urls = [];
      for(const f of state.conteoFotos){
        const ext = (f.file.name.split('.').pop()||'jpg').toLowerCase();
        const path = `${state.perfil.empresa_id}/${state.skuSeleccionado.sku_code}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
        urls.push(await storageUpload(path, f.file));
      }
      await rest('/conteo_fotos', {method:'POST', body: urls.map(foto_url=>({conteo_id:conteoId, foto_url})), prefer:'return=minimal'});
    }

    toast('Conteo registrado');
    setState({loading:false, skuSeleccionado:null, conteoFotos:[], skuSearch:''});
    cargarDashboard(); cargarUltimosConteos(); cargarReconteos();
  }catch(e){
    // Sin conexión de verdad (no un error del servidor): guardamos el conteo (y sus
    // fotos, en IndexedDB) en este dispositivo y lo enviamos apenas vuelva la señal,
    // en vez de perder el trabajo.
    if(pareceFalloDeRed(e)){
      const fotosAEncolar = state.conteoFotos.map(f=>f.file);
      const item = encolarAccionOffline('conteo', {
        sku_id: state.skuSeleccionado.id,
        sku_code: state.skuSeleccionado.sku_code,
        usuario_id: state.perfil ? state.perfil.id : null,
        empresa_id: state.perfil.empresa_id,
        cantidad_contada: Number(cantidad),
        ubicacion_contada: ubicacion || null,
        bodega: bodega || state.skuSeleccionado.bodega || null,
        observacion: observacion || null,
        fotosCount: fotosAEncolar.length,
      });
      if(fotosAEncolar.length) await guardarFotosOffline(item.id, fotosAEncolar).catch(()=>{});
      setState({loading:false, skuSeleccionado:null, conteoFotos:[], skuSearch:''});
      toast('Sin conexión: conteo guardado en este dispositivo. Se enviará cuando vuelva la señal.', 'err');
      return;
    }
    setState({loading:false});
    toast(e.message,'err');
  }
}

/* =======================================================================
   ESCÁNER DE CÓDIGOS — asociación código de barras / QR ↔ SKU
   ======================================================================= */
// Resuelve un código leído por la cámara contra la lista de SKU ya cargada. Dos formas
// de coincidencia, en orden: (1) el propio código del SKU (cubre el caso de imprimir
// stickers genéricos con el sku_code como código de barras, la salida más barata para
// ítems que nunca trajeron código de fábrica) y (2) el código de barras de fábrica ya
// asociado en una lectura anterior (columna codigo_barras). Función pura para poder
// testearla sin cámara real.
function resolverSkuPorCodigo(skus, codigo){
  const c = (codigo||'').trim();
  if(!c) return null;
  const cLower = c.toLowerCase();
  return skus.find(s=> (s.sku_code||'').toLowerCase() === cLower)
      || skus.find(s=> (s.codigo_barras||'').toLowerCase() === cLower)
      || null;
}

async function iniciarEscaner(){
  if(escanerInstancia) return; // ya hay una lectura en curso para este modal
  if(typeof Html5Qrcode === 'undefined'){
    setState({escanerModal: {...state.escanerModal, error:'El lector de códigos no cargó. Revisa tu conexión e inténtalo de nuevo.'}});
    return;
  }
  // Se listan los formatos explícitamente (en vez de dejar que pruebe todos los que sabe
  // decodificar) para que la librería se concentre en QR y los formatos de barras 1D más
  // comunes en maestros de materiales — mejora la velocidad y tasa de lectura de barras,
  // que son más difíciles de leer con solo cámara de celular que un QR.
  const formatos = (typeof Html5QrcodeSupportedFormats !== 'undefined') ? [
    Html5QrcodeSupportedFormats.QR_CODE,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.CODE_93,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.ITF,
  ] : undefined;
  const instancia = new Html5Qrcode('escaner-reader', formatos ? { formatsToSupport: formatos } : undefined);
  escanerInstancia = instancia;
  try{
    await instancia.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 280, height: 140 } },
      (codigoLeido) => onCodigoEscaneado(codigoLeido),
      () => { /* se llama en cada frame sin lectura; no requiere acción */ }
    );
  }catch(e){
    escanerInstancia = null;
    setState({escanerModal: {...state.escanerModal, error:'No se pudo acceder a la cámara. Revisa los permisos del navegador.'}});
  }
}

// Detiene la cámara y limpia el estado del modal de forma síncrona (para poder llamarla
// desde cualquier handler — cerrar, cambiar de pestaña, cerrar sesión — sin esperar el
// stop() async de la librería, que igual libera la cámara en segundo plano).
function detenerEscaner(){
  const instancia = escanerInstancia;
  escanerInstancia = null;
  state.escanerModal = null;
  if(instancia){
    instancia.stop().then(()=> instancia.clear()).catch(()=>{ /* ya estaba detenida */ });
  }
}

function cerrarEscaner(){
  detenerEscaner();
  render();
}

async function onCodigoEscaneado(codigo){
  if(!state.escanerModal || state.escanerModal.codigo) return; // evita doble disparo mientras se procesa la primera lectura
  detenerEscaner();
  const sku = resolverSkuPorCodigo(state.skus, codigo);
  if(sku){
    setState({skuSeleccionado: sku});
    toast(`SKU ${sku.sku_code} encontrado`);
  }else{
    setState({escanerModal: { codigo, buscarAsociar:'', asociando:false }});
  }
}

// Primera vez que se ve este código: la persona elige a mano el SKU correcto y desde
// ahora ese código queda asociado — la próxima lectura lo va a reconocer solo.
async function asociarCodigoBarras(skuId, codigo){
  const sku = state.skus.find(s=>s.id===skuId);
  if(!sku) return;
  setState({escanerModal: {...state.escanerModal, asociando:true}});
  try{
    await rest(`/skus?id=eq.${skuId}`, {method:'PATCH', body:{codigo_barras: codigo}, prefer:'return=minimal'});
    sku.codigo_barras = codigo;
    toast(`Código asociado a ${sku.sku_code}`);
    setState({skuSeleccionado: sku, escanerModal: null});
  }catch(e){
    toast(e.message,'err');
    setState({escanerModal: {...state.escanerModal, asociando:false}});
  }
}

function fmtDiaCorto(iso){ if(!iso) return ''; const d=new Date(iso); return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short'}).replace('.',''); }

// Suma el avance diario (que viene por bodega) en un total por día calendario.
function agregarPorDia(diario, dias=14){
  const map = new Map();
  diario.forEach(r=>{
    const key = (r.dia||'').slice(0,10);
    if(!key) return;
    const cur = map.get(key) || { dia:key, contados:0, diferencias:0 };
    // skus_contados/con_diferencia vienen de count() en la vista SQL: PostgREST serializa
    // bigint como string (para no perder precisión), así que sin Number() esto concatena
    // texto en vez de sumar ("0"+"3" -> "03") y arruina el gráfico y la proyección.
    cur.contados += Number(r.skus_contados)||0;
    cur.diferencias += Number(r.con_diferencia)||0;
    map.set(key, cur);
  });
  return Array.from(map.values()).sort((a,b)=> a.dia.localeCompare(b.dia)).slice(-dias);
}

function renderBarChart(datos, valueKey, color, labelFn=fmtDiaCorto, mostrarValor=false){
  if(!datos.length) return `<div class="empty">Sin datos todavía.</div>`;
  const max = Math.max(1, ...datos.map(d=>d[valueKey]||0));
  const barW = 24, gap = 12, padTop = mostrarValor?26:16, padBottom = 20;
  const plotH = 90;
  const w = datos.length*(barW+gap)+gap;
  const h = plotH + padTop + padBottom;
  const baseline = padTop + plotH;
  const bars = datos.map((d,i)=>{
    const val = d[valueKey]||0;
    const barH = Math.round((val/max)*plotH);
    const x = gap + i*(barW+gap);
    const y = baseline - barH;
    const topeY = Math.max(y,padTop);
    return `<g>
      <rect x="${x}" y="${topeY}" width="${barW}" height="${Math.max(barH,val>0?2:0)}" rx="4" fill="${color}"><title>${esc(labelFn(d.dia))}: ${val}</title></rect>
      ${mostrarValor && val>0? `<text x="${x+barW/2}" y="${topeY-5}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-dim)">${val}</text>` : ''}
      <text x="${x+barW/2}" y="${baseline+13}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)">${esc(labelFn(d.dia))}</text>
    </g>`;
  }).join('');
  return `<div class="table-wrap"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block">
    <line x1="0" y1="${baseline}" x2="${w}" y2="${baseline}" stroke="var(--line)" stroke-width="1"/>
    ${bars}
  </svg></div>`;
}

function abrevDiaSemana(iso){
  const d = new Date(iso+'T00:00:00');
  const s = d.toLocaleDateString('es-CL',{weekday:'short'}).replace('.','');
  return s.charAt(0).toUpperCase()+s.slice(1);
}

// Agrupa el universo de SKU planificado por responsable, ordenado de mayor a menor carga.
function resumenPorResponsable(entradas, universos){
  const map = new Map();
  entradas.forEach(e=>{
    const nombre = e.responsable_nombre || 'Sin asignar';
    const cantidad = universos[e.id] || 0;
    map.set(nombre, (map.get(nombre)||0) + cantidad);
  });
  return Array.from(map, ([nombre, cantidad])=>({nombre, cantidad})).sort((a,b)=> b.cantidad-a.cantidad);
}

// SKU que faltan por contar en cada ubicación general, de mayor a menor — dónde falta trabajar.
function resumenPendientesPorBodega(t){
  return t
    .map(r=>({nombre: r.bodega||'Sin ubicación general', cantidad: Math.max(0,(r.skus_universo||0)-(r.skus_contados||0))}))
    .filter(f=>f.cantidad>0)
    .sort((a,b)=> b.cantidad-a.cantidad);
}

// Fecha estimada de término si se mantiene el ritmo promedio de los últimos
// VENTANA_PROYECCION_DIAS días (contados en ese período / cantidad de días de la ventana,
// incluidos los días sin actividad — así el promedio ya refleja fines de semana o pausas
// reales en vez de asumir que se trabaja todos los días).
function proyeccionTermino(totUniverso, totContados, contadosEnVentana){
  const pendientes = Math.max(0, totUniverso - totContados);
  if(totUniverso===0) return {titulo:'—', detalle:'Aún no hay SKU cargados.'};
  if(pendientes===0) return {titulo:'¡Inventario completo!', detalle:'No quedan SKU pendientes por contar.'};
  const ritmoDiario = contadosEnVentana / VENTANA_PROYECCION_DIAS;
  if(ritmoDiario<=0) return {titulo:'Sin proyección', detalle:`Sin conteos en los últimos ${VENTANA_PROYECCION_DIAS} días para estimar un ritmo.`};
  const diasRestantes = Math.ceil(pendientes/ritmoDiario);
  const fechaProyectada = fechaISO(sumarDias(new Date(), diasRestantes));
  return {
    titulo: fmtFecha(fechaProyectada),
    detalle: `${diasRestantes} día${diasRestantes===1?'':'s'} más, a un ritmo de ${ritmoDiario.toFixed(1)} SKU/día (${pendientes.toLocaleString('es-CL')} pendientes)`,
  };
}

function renderDiffChart(sinDif, conDif){
  const total = sinDif + conDif;
  if(!total) return `<div class="empty">Sin conteos todavía en este período.</div>`;
  const fila = (label, val, color) => {
    const p = Math.round(val/total*100);
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <span style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim)">
          <span style="width:9px;height:9px;border-radius:2px;background:${color};display:inline-block;flex-shrink:0"></span>${label}
        </span>
        <span class="mono" style="font-size:12.5px;color:var(--text)">${val} · ${p}%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${p}%;background:${color}"></div></div>
    </div>`;
  };
  return fila('Sin diferencia', sinDif, 'var(--ok)') + fila('Con diferencia', conDif, 'var(--warn)');
}

  // sumar y el avance global queda completamente mal calculado.
  const totUniverso = t.reduce((s,r)=>s+(Number(r.skus_universo)||0),0);

    ${rankingResponsables.length? `

          <td class="mono" style="font-size:11.5px">

}

function estadoBadge(estado, diferencia){
  if(diferencia && Number(diferencia)!==0) return `<span class="badge badge-warn">Diferencia ${diferencia>0?'+':''}${diferencia}</span>`;
  if(estado==='pendiente_revision') return `<span class="badge badge-neutral">Pendiente</span>`;
  return `<span class="badge badge-ok">${esc(estado||'ok')}</span>`;
}

function fmtFecha(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'2-digit'}); }
function fmtFechaHora(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleString('es-CL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }

// Un conteo/SKU se considera "capturado sin conexión" cuando la fecha que reportó el
// dispositivo al momento de capturarlo (capturado_en) difiere de cuándo el registro
// realmente llegó al servidor (fecha_conteo/created_at) por más de un minuto — para
// auditoría es clave distinguir ambas fechas, nunca reemplazar una con la otra.
const UMBRAL_OFFLINE_MS = 60000;
function fueCapturadoOffline(capturadoEn, fechaServidor){
  if(!capturadoEn || !fechaServidor) return false;
  return Math.abs(new Date(fechaServidor) - new Date(capturadoEn)) > UMBRAL_OFFLINE_MS;
}
function esc(s){ return (s===null||s===undefined)? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const todosMarcados = sp.rows.length>0 && sp.rows.every(s=>seleccionados.includes(s.id));

  return `

        <tbody>${sp.rows.map(s=>`<tr>
          ${esAdmin?`<td><input type="checkbox" class="chk-sku" data-sku-id="${esc(s.id)}" ${seleccionados.includes(s.id)?'checked':''}></td>`:''}
          <td class="mono">${esc(s.sku_code)}</td>
          <td>${esc(s.descripcion||'—')}</td>
          <td>${esc(s.bodega||'—')}</td>

function encabezadoEntradaPlan(e){
  const ubic = e.solo_sin_ubicacion ? 'SKU sin ubicación' : ([e.bodega, e.ubicacion, e.storage_bin].filter(Boolean).join(' · ') || 'Sin ubicación específica');
  const partes = [`Responsable: ${esc(e.responsable_nombre || 'Sin asignar')}`];
  if(e.nota) partes.push(`Nota: ${esc(e.nota)}`);
  return `<h3>${esc(ubic)}</h3><div class="print-entrada-meta">${partes.join(' · ')}</div>`;
}

function tablaSkusEntradaPlan(skus){
  if(!skus.length) return `<p class="print-vacio">Sin SKU activos en esta ubicación.</p>`;
  return `
    <table>
      <thead><tr><th>SKU</th><th>Descripción</th><th>Storage bin</th><th>Unidad</th><th>Cantidad contada</th><th>Observación</th></tr></thead>

          <tr>
            <td>${esc(s.sku_code)}</td>
            <td>${esc(s.descripcion||'')}</td>
            <td>${esc(s.storage_bin||'—')}</td>
            <td>${esc(s.unidad_medida||'—')}</td>
            <td class="print-blank"></td>
            <td class="print-blank"></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function imprimirPlan(){
  const p = state.plan;
  const inicio = new Date(p.semanaInicio+'T00:00:00');
  const finSemana = sumarDias(inicio,6);
  const dias = Array.from({length:7},(_,i)=> sumarDias(inicio,i));
  const porDia = dias.map(d=>{
    const iso = fechaISO(d);
    return {
      label: d.toLocaleDateString('es-CL',{weekday:'long', day:'2-digit', month:'short'}),
      entradas: p.entradas.filter(e=>e.fecha===iso),
    };
  }).filter(d=>d.entradas.length);

  if(!porDia.length){
    document.getElementById('print-plan').innerHTML = `
      <h1>Plan de conteo semanal</h1>
      <div class="print-meta">Semana ${fmtFecha(p.semanaInicio)} – ${fmtFecha(fechaISO(finSemana))} · Generado ${new Date().toLocaleString('es-CL')}</div>
      <p class="print-vacio">No hay conteos planificados para esta semana.</p>
    `;
    window.print();
    return;
  }

  const btn = document.getElementById('btn-exportar-plan');
  if(btn){ btn.disabled = true; btn.textContent = 'Generando…'; }
  try{
    let cuerpo = '';
    for(const d of porDia){
      cuerpo += `<h2>${esc(d.label)}</h2>`;
      for(const e of d.entradas){
        const skus = await skusDeUbicacion({bodega:e.bodega, ubicacion:e.ubicacion, storage_bin:e.storage_bin, excluidos:e.skus_excluidos, soloSinUbicacion:e.solo_sin_ubicacion});
        cuerpo += encabezadoEntradaPlan(e) + tablaSkusEntradaPlan(skus);
      }
    }
    document.getElementById('print-plan').innerHTML = `
      <h1>Plan de conteo semanal</h1>
      <div class="print-meta">Semana ${fmtFecha(p.semanaInicio)} – ${fmtFecha(fechaISO(finSemana))} · Generado ${new Date().toLocaleString('es-CL')}</div>
      ${cuerpo}
    `;
    window.print();
  }catch(err){
    toast(err.message,'err');
  }finally{
    if(btn){ btn.disabled = !p.entradas.length; btn.innerHTML = `${ICONS.download} Exportar PDF`; }
  }
}

      <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;${p.seleccionados.length?'border-color:var(--danger)':''}">

    ${porDia.map(d=>`

            <label for="pe-responsable-${e.id}">Responsable</label>
            <select id="pe-responsable-${e.id}">
              <option value="">Sin asignar</option>
              ${p.responsables.map(u=>`<option value="${esc(u.id)}" ${u.id===e.responsable_id?'selected':''}>${esc(u.nombre)}</option>`).join('')}
            </select>
            <label for="pe-nota-${e.id}">Nota</label>
            <input type="text" id="pe-nota-${e.id}" value="${esc(e.nota||'')}" placeholder="Opcional">
            <div style="display:flex;gap:8px;margin-top:12px">
              <button class="btn btn-primary" data-guardar-plan="${e.id}" style="width:auto;padding:8px 14px">Guardar</button>
              <button class="btn btn-secondary" data-cancelar-plan="${e.id}" style="width:auto;padding:8px 14px">Cancelar</button>
            </div>
          </div>
        ` : `
          <div class="plan-item">
            <div style="display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0">
            <input type="checkbox" class="plan-select-check" data-select-plan="${e.id}" ${p.seleccionados.includes(e.id)?'checked':''} aria-label="Seleccionar esta entrada para borrado masivo" style="margin-top:3px;flex:none">
            <div class="plan-item-info">
              <div class="plan-item-ubic">${e.solo_sin_ubicacion? 'SKU sin ubicación' : esc([e.bodega,e.ubicacion,e.storage_bin].filter(Boolean).join(' · ') || 'Sin ubicación específica')}</div>
              <div class="plan-item-responsable">Responsable: ${esc(e.responsable_nombre || 'Sin asignar')}</div>
              ${e.nota? `<div class="plan-item-nota">${esc(e.nota)}</div>` : ''}
              <div class="plan-item-universo">${p.universos[e.id]!==undefined? `${p.universos[e.id]} SKU en esta ubicación` : 'Calculando…'}</div>
              <div class="plan-item-detalle">
                ${!p.detalle[e.id]? 'Cargando SKU…' : (
                  p.detalle[e.id].length? `
                    <ul class="plan-sku-lista">
                      ${p.detalle[e.id].slice(0,50).map(s=>`
                        <li>
                          <span><span class="mono">${esc(s.sku_code)}</span> — ${esc(s.descripcion||'Sin descripción')}</span>
                          <button class="icon-btn plan-sku-quitar" data-plan-id="${e.id}" data-sku-code="${esc(s.sku_code)}" aria-label="Quitar SKU de la planificación" title="Quitar solo este SKU de esta entrada (la ubicación sigue planificada)" style="color:var(--danger)">${ICONS.x}</button>
                        </li>
                      `).join('')}
                    </ul>
                    ${p.detalle[e.id].length>50? `<div class="hint" style="margin-top:4px">Mostrando 50 de ${p.detalle[e.id].length}. Usa "Exportar PDF" para ver el listado completo.</div>` : ''}
                  ` : `<div class="hint">Sin SKU activos en esta ubicación.</div>`
                )}
              </div>
            </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;flex:none">
              <button class="icon-btn" data-editar-plan="${e.id}" aria-label="Editar" title="Editar esta entrada del plan">${ICONS.editar}</button>
              <button class="icon-btn" data-borrar-plan="${e.id}" aria-label="Eliminar entrada completa" title="Eliminar toda esta entrada del plan (ubicación, responsable y nota)" style="color:var(--danger)">${ICONS.papelera}</button>
            </div>
          </div>
        `).join('') : `<div class="empty" style="padding:14px 8px">Sin conteos planificados.</div>`}
      </div>
    `).join('')}
  `;
}

  const empresasResumenActivas = resumen.filter(r=>r.activo).length;
  const personasActivas = resumen.reduce((s,r)=>s+Number(r.personas_activas||0),0);

    <div class="kpi-grid" style="grid-template-columns:1fr 1fr 1fr">

        <div class="kpi-value">${empresasResumenActivas}</div>

          <select class="sa-empresa-plan" data-empresa-id="${esc(e.id)}" style="flex:none;width:auto;margin:0">
            ${sa.planes.map(p=>`<option value="${esc(p.id)}" ${e.plan_id===p.id?'selected':''}>${esc(p.etiqueta)}</option>`).join('')}

          <div style="display:flex;gap:4px;flex:none">
            <button type="button" class="icon-btn" data-guardar-empresa-sa="${esc(e.id)}" aria-label="Guardar nombre">${ICONS.editar}</button>

          </div>

          ${!u.activo? `<span class="badge badge-danger">Inactiva</span>` : ''}

    <div class="card" style="margin-top:14px">
