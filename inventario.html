    ${(esAdmin || esSuperAdmin) && planIncluye('auditoria_habilitada')? renderAuditoria() : ''}
    <div class="section-head"><div><span class="eyebrow">Apariencia</span><h2>Configuraciones</h2></div></div>
    <div class="hint" style="margin-bottom:14px">Elige el diseño visual de la aplicación. La elección se guarda en este dispositivo.</div>
    ${TEMAS.map(t=>`
      <div class="tema-opcion ${state.tema===t.id?'activo':''}" data-tema-opcion="${t.id}">
        <div class="tema-swatches">
          <span style="background:${t.colores[0]}"></span>
          <span style="background:${t.colores[1]}"></span>
          <span style="background:${t.colores[2]}"></span>
        </div>
        <div class="tema-info">
          <div class="tema-nombre">${esc(t.nombre)}</div>
          <div class="tema-desc">${esc(t.desc)}</div>
        </div>
        ${state.tema===t.id? `<span class="badge badge-ok">Actual</span>` : ''}
      </div>
    `).join('')}

    <div class="section-head"><div><span class="eyebrow">Equipo</span><h2>Operadores</h2></div></div>
    <div class="card">
      <div class="hint" style="margin-bottom:10px">Personas asignables como responsables al planificar el conteo. No requieren cuenta ni login en la app.</div>
      <form id="form-operador">
        <label for="nuevo-operador">Nombre</label>
        <input type="text" id="nuevo-operador" placeholder="Ej. Ana Torres" required>
        <div style="margin-top:10px">
          <button type="submit" class="btn btn-secondary" style="width:auto;padding:8px 14px">Agregar operador</button>
        </div>
      </form>
      ${p.responsables.length? `<div style="margin-top:12px">${p.responsables.map(u=>`
        <div class="plan-item" style="padding:8px 0">
          <div class="plan-item-ubic" style="font-weight:500">${esc(u.nombre)}</div>
          <button class="icon-btn" data-eliminar-operador="${esc(u.id)}" aria-label="Eliminar" style="color:var(--danger)">${ICONS.x}</button>
        </div>
      `).join('')}</div>` : `<div class="empty" style="padding:14px 8px">Sin operadores agregados.</div>`}
    </div>
  `;
}

/* =======================================================================
   RENDER — SHELL
   ======================================================================= */
function viewTitle(v){
  return {dashboard:'Dashboard', skus:'SKUs', carga:'Carga masiva', conteo:'Inventario', reconteo:'Reconteo', config:'Configuraciones', buscar:'Buscar', plan:'Planificación'}[v];
}

function renderShell(){
  const content = {
    dashboard: renderDashboard,
    skus: renderSkus,
    carga: renderCargaMasiva,
    conteo: renderConteo,
    reconteo: renderReconteo,
    config: renderConfiguraciones,
    buscar: renderBuscar,
    plan: renderPlanificacion,
  }[state.view]();

  return `
    <div class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <div class="brand-badge">IA</div>
          <div class="brand-text"><h1>${viewTitle(state.view)}</h1><span>${esc(state.perfil && state.perfil.empresas ? state.perfil.empresas.nombre : 'InventIA')}</span></div>
        </div>
        <div class="user-chip">
          <button id="btn-config" class="btn-icon-header" aria-label="Configuraciones">${ICONS.config}</button>
          <span>${esc(state.perfil? state.perfil.nombre : (state.session.user.email||''))}</span>
          <button id="btn-logout">${ICONS.logout} Salir</button>
        </div>
      </div>
    </div>
    ${state.colaOffline.length? `
    <div id="banner-offline" style="background:rgba(224,178,60,.15);color:var(--warn);border-bottom:1px solid var(--warn);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px">
      <span>${state.colaOffline.length} cambio${state.colaOffline.length===1?'':'s'} guardado${state.colaOffline.length===1?'':'s'} sin conexión, pendiente${state.colaOffline.length===1?'':'s'} de sincronizar.</span>
      <div style="display:flex;gap:8px">
        <button id="btn-ver-offline" class="btn btn-secondary" style="width:auto;padding:6px 12px">Ver detalle</button>
        <button id="btn-sincronizar-offline" class="btn btn-secondary" style="width:auto;padding:6px 12px" ${state.sincronizandoOffline?'disabled':''}>${state.sincronizandoOffline?'Sincronizando…':'Reintentar ahora'}</button>
      </div>
    </div>
    ` : ''}
    <main>${content}</main>
    <nav class="tabbar">
      ${tabBtn('dashboard','Dashboard')}
      ${tabBtn('plan','Plan')}
      ${tabBtn('conteo','Contar')}
      ${tabBtn('reconteo','Reconteo')}
      ${tabBtn('buscar','Buscar')}
      ${tabBtn('skus','SKUs')}
      ${tabBtn('carga','Carga')}
    </nav>
  `;
}

function tabBtn(view,label){
  return `<button class="tab ${state.view===view?'active':''}" data-tab="${view}">${ICONS[view==='carga'?'upload':view]}${label}</button>`;
}

/* =======================================================================
   RENDER PRINCIPAL + BINDINGS
   ======================================================================= */
function render(){
  document.documentElement.setAttribute('data-tema', state.tema);
  const root = document.getElementById('app');
  root.innerHTML = (state.debeCrearPassword ? renderCrearPassword() : state.session ? renderShell() : renderLogin()) + renderFotoModal() + renderOfflineModal() + renderEscanerModal();
  bind();
}

function bind(){
  if(state.fotoModal){
    document.getElementById('foto-modal-close').addEventListener('click', ()=> setState({fotoModal:null}));
    document.getElementById('foto-modal-backdrop').addEventListener('click', e=>{
      if(e.target.id === 'foto-modal-backdrop') setState({fotoModal:null});
    });
    const btnPrevFoto = document.getElementById('foto-modal-prev');
    const btnNextFoto = document.getElementById('foto-modal-next');
    if(btnPrevFoto) btnPrevFoto.addEventListener('click', ()=>{
      const {urls, index} = state.fotoModal;
      setState({fotoModal:{urls, index:(index-1+urls.length)%urls.length}});
    });
    if(btnNextFoto) btnNextFoto.addEventListener('click', ()=>{
      const {urls, index} = state.fotoModal;
      setState({fotoModal:{urls, index:(index+1)%urls.length}});
    });
  }
  if(state.offlineModal){
    document.getElementById('offline-modal-close').addEventListener('click', ()=> setState({offlineModal:false}));
    document.getElementById('offline-modal-backdrop').addEventListener('click', e=>{
      if(e.target.id === 'offline-modal-backdrop') setState({offlineModal:false});
    });
    document.querySelectorAll('[data-reintentar-offline]').forEach(btn=>{
      btn.addEventListener('click', ()=> reintentarAccionOffline(btn.dataset.reintentarOffline));
    });
    document.querySelectorAll('[data-descartar-offline]').forEach(btn=>{
      btn.addEventListener('click', ()=> descartarAccionOffline(btn.dataset.descartarOffline));
    });
  }
  if(state.escanerModal){
    document.getElementById('escaner-modal-close').addEventListener('click', cerrarEscaner);
    document.getElementById('escaner-modal-backdrop').addEventListener('click', e=>{
      if(e.target.id === 'escaner-modal-backdrop') cerrarEscaner();
    });
    if(!state.escanerModal.codigo){
      if(!state.escanerModal.error) iniciarEscaner();
    }else{
      const buscar = document.getElementById('escaner-buscar');
      buscar.addEventListener('input', e=> setState({escanerModal: {...state.escanerModal, buscarAsociar: e.target.value}}));
      buscar.focus(); buscar.selectionStart = buscar.selectionEnd = buscar.value.length;
      document.querySelectorAll('[data-asociar-btn]').forEach(btn=>{
        btn.addEventListener('click', ()=> asociarCodigoBarras(btn.dataset.asociarBtn, state.escanerModal.codigo));
      });
    }
  }
  if(state.debeCrearPassword){
    document.getElementById('crear-password-form').addEventListener('submit', e=>{
      e.preventDefault();
      establecerPassword(document.getElementById('f-nueva-pass').value);
    });
    return;
  }
  if(!state.session){
    if(state.authRecuperar){
      document.getElementById('recuperar-password-form').addEventListener('submit', e=>{
        e.preventDefault();
        solicitarRecuperacion(document.getElementById('f-recuperar-email').value.trim());
      });
      document.getElementById('btn-volver-login').addEventListener('click', ()=> setState({authRecuperar:false}));
      return;
    }
    const form = document.getElementById('auth-form');
    form.addEventListener('submit', e=>{
      e.preventDefault();
      const email = document.getElementById('f-email').value.trim();
      const pass = document.getElementById('f-pass').value;
      handleLogin(email, pass);
    });
    document.getElementById('btn-olvide-pass').addEventListener('click', ()=> setState({authRecuperar:true}));
    return;
  }

  document.getElementById('btn-logout').addEventListener('click', ()=>{ detenerEscaner(); handleLogout(); });
  document.getElementById('btn-config').addEventListener('click', ()=>{ detenerEscaner(); setState({view:'config'}); });
  const btnSincronizarOffline = document.getElementById('btn-sincronizar-offline');
  if(btnSincronizarOffline) btnSincronizarOffline.addEventListener('click', sincronizarColaOffline);
  const btnVerOffline = document.getElementById('btn-ver-offline');
  if(btnVerOffline) btnVerOffline.addEventListener('click', ()=> setState({offlineModal:true}));
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ detenerEscaner(); setState({view: btn.dataset.tab}); });
  });

  if(state.view==='config'){
    document.querySelectorAll('[data-tema-opcion]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const tema = el.dataset.temaOpcion;
        localStorage.setItem('tema_app', tema);
        setState({tema});
      });
    });
    document.getElementById('form-operador').addEventListener('submit', e=>{
      e.preventDefault();
      crearResponsable(document.getElementById('nuevo-operador').value.trim());
    });
    document.querySelectorAll('[data-eliminar-operador]').forEach(btn=>{
      btn.addEventListener('click', ()=> quitarResponsable(btn.dataset.eliminarOperador));
    });
    const formEmpresaNombre = document.getElementById('form-empresa-nombre');
    if(formEmpresaNombre) formEmpresaNombre.addEventListener('submit', e=>{
      e.preventDefault();
      actualizarNombreEmpresa(document.getElementById('empresa-nombre-input').value.trim());
    });
    const formInvitarEquipo = document.getElementById('form-invitar-equipo');
    if(formInvitarEquipo) formInvitarEquipo.addEventListener('submit', e=>{
      e.preventDefault();
      const nombre = document.getElementById('equipo-nombre').value.trim();
      const email = document.getElementById('equipo-email').value.trim();
      const rol = document.getElementById('equipo-rol').value;
      invitarPersona({email, nombre, empresaId: state.perfil.empresa_id, rol}).then(ok=>{ if(ok) e.target.reset(); });
    });
    if(state.perfil && state.perfil.rol==='admin' && !state.perfil.es_super_admin){
      if(!state.equipo.cargado) cargarEquipo();
      document.querySelectorAll('[data-guardar-persona-equipo]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.guardarPersonaEquipo;
          const input = document.querySelector(`.mi-equipo-nombre[data-persona-id="${id}"]`);
          actualizarPersonaEquipo(id, {nombre: input.value.trim()});
        });
      });
      document.querySelectorAll('.mi-equipo-rol').forEach(sel=>{
        sel.addEventListener('change', ()=> actualizarPersonaEquipo(sel.dataset.personaId, {rol: sel.value}));
      });
      document.querySelectorAll('[data-toggle-persona-equipo]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.togglePersonaEquipo;
          const activo = btn.dataset.activo === '1';
          if(activo && !confirm('¿Desactivar el acceso de esta persona?')) return;
          actualizarPersonaEquipo(id, {activo: !activo});
        });
      });
      const formCrearCiclo = document.getElementById('form-crear-ciclo');
      if(formCrearCiclo) formCrearCiclo.addEventListener('submit', e=>{
        e.preventDefault();
        const input = document.getElementById('ciclo-nombre');
        crearCiclo(input.value.trim());
        input.value = '';
      });
      document.querySelectorAll('[data-marcar-ciclo-actual]').forEach(btn=>{
        btn.addEventListener('click', ()=> marcarCicloActual(btn.dataset.marcarCicloActual));
      });
    }
    const selectAuditoriaTabla = document.getElementById('auditoria-filtro-tabla');
    if(selectAuditoriaTabla){
      if(!state.auditoria.cargado){ state.auditoria.cargado = true; cargarAuditoria(''); }
      selectAuditoriaTabla.addEventListener('change', ()=> cargarAuditoria(selectAuditoriaTabla.value));
    }
    const btnCargarMasAuditoria = document.getElementById('btn-cargar-mas-auditoria');
    if(btnCargarMasAuditoria) btnCargarMasAuditoria.addEventListener('click', cargarMasAuditoria);
    if(state.perfil && state.perfil.es_super_admin){
      if(!state.superadmin.cargado){ state.superadmin.cargado = true; cargarEmpresasSuperAdmin(); cargarResumenSuperAdmin(); cargarLeadsSuperAdmin(); cargarPlanesSuperAdmin(); cargarErroresSuperAdmin(); }
      document.getElementById('form-crear-empresa-sa').addEventListener('submit', e=>{
        e.preventDefault();
        const input = document.getElementById('nueva-empresa-nombre');
        crearEmpresaSuperAdmin(input.value.trim());
        input.value = '';
      });
      document.getElementById('form-invitar-persona-sa').addEventListener('submit', e=>{
        e.preventDefault();
        const nombre = document.getElementById('invitar-nombre').value.trim();
        const email = document.getElementById('invitar-email').value.trim();
        const empresaId = document.getElementById('invitar-empresa').value;
        const rol = document.getElementById('invitar-rol').value;
        invitarPersona({email, nombre, empresaId, rol}).then(ok=>{ if(ok) e.target.reset(); });
      });
      document.querySelectorAll('[data-guardar-empresa-sa]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.guardarEmpresaSa;
          const input = document.querySelector(`.sa-empresa-nombre[data-empresa-id="${id}"]`);
          actualizarEmpresaSuperAdmin(id, {nombre: input.value.trim()});
        });
      });
      document.querySelectorAll('[data-toggle-empresa-sa]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.toggleEmpresaSa;
          const activo = btn.dataset.activo === '1';
          if(activo && !confirm('¿Desactivar esta empresa? Todo su equipo perderá el acceso hasta que la reactives.')) return;
          actualizarEmpresaSuperAdmin(id, {activo: !activo});
        });
      });
      document.querySelectorAll('.sa-empresa-plan').forEach(sel=>{
        sel.addEventListener('change', ()=> actualizarEmpresaSuperAdmin(sel.dataset.empresaId, {plan_id: sel.value}));
      });
      const selectPersonasEmpresa = document.getElementById('sa-personas-empresa');
      if(selectPersonasEmpresa) selectPersonasEmpresa.addEventListener('change', ()=> cargarPersonasSuperAdmin(selectPersonasEmpresa.value));
      document.querySelectorAll('[data-guardar-persona-sa]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.guardarPersonaSa;
          const input = document.querySelector(`.sa-persona-nombre[data-persona-id="${id}"]`);
          actualizarPersonaSuperAdmin(id, {nombre: input.value.trim()});
        });
      });
      document.querySelectorAll('.sa-persona-rol').forEach(sel=>{
        sel.addEventListener('change', ()=> actualizarPersonaSuperAdmin(sel.dataset.personaId, {rol: sel.value}));
      });
      document.querySelectorAll('[data-toggle-persona-sa]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.togglePersonaSa;
          const activo = btn.dataset.activo === '1';
          if(activo && !confirm('¿Desactivar el acceso de esta persona?')) return;
          actualizarPersonaSuperAdmin(id, {activo: !activo});
        });
      });
      const btnCargarMasLeadsSa = document.getElementById('btn-cargar-mas-leads-sa');
      if(btnCargarMasLeadsSa) btnCargarMasLeadsSa.addEventListener('click', cargarMasLeadsSuperAdmin);
      const btnCargarMasErroresSa = document.getElementById('btn-cargar-mas-errores-sa');
      if(btnCargarMasErroresSa) btnCargarMasErroresSa.addEventListener('click', cargarMasErroresSuperAdmin);
    }
  }

  if(state.view==='dashboard'){
    document.querySelectorAll('[data-ver-fotos]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const rutas = JSON.parse(btn.dataset.verFotos);
        if(!rutas.length) return;
        try{
          const urls = await Promise.all(rutas.map(crearUrlFirmada));
          setState({fotoModal:{urls, index:0}});
        }catch(e){ toast(e.message,'err'); }
      });
    });
    document.querySelectorAll('[data-dash-modo]').forEach(btn=>{
      btn.addEventListener('click', ()=> setState({dashboardModo: btn.dataset.dashModo}));
    });
    const btnCargarMasConteos = document.getElementById('btn-cargar-mas-conteos');
    if(btnCargarMasConteos) btnCargarMasConteos.addEventListener('click', cargarMasUltimosConteos);
  }

  if(state.view==='skus'){
    document.getElementById('form-sku').addEventListener('submit', async e=>{
      e.preventDefault();
      const payload = {
        sku_code: document.getElementById('s-code').value.trim(),
        descripcion: document.getElementById('s-desc').value.trim() || null,
        categoria: document.getElementById('s-cat').value.trim() || null,
        unidad_medida: document.getElementById('s-um').value.trim() || null,
        bodega: document.getElementById('s-bodega').value.trim() || null,
        ubicacion: document.getElementById('s-ubic').value.trim() || null,
        storage_bin: document.getElementById('s-bin').value.trim() || null,
        stock_sistema: document.getElementById('s-stock').value !== '' ? Number(document.getElementById('s-stock').value) : null,
      };
      if(!payload.sku_code){ toast('El código SKU es obligatorio','err'); return; }
      if(payload.stock_sistema !== null && payload.stock_sistema < 0){ toast('El stock según sistema no puede ser negativo','err'); return; }
      setState({loading:true});
      const ok = await crearSkuManual(payload);
      setState({loading:false});
      if(ok) render();
    });
    const btnPrev = document.getElementById('skus-pag-prev');
    const btnNext = document.getElementById('skus-pag-next');
    if(btnPrev) btnPrev.addEventListener('click', ()=> cargarSkusPagina(state.skusPagina.page-1));
    if(btnNext) btnNext.addEventListener('click', ()=> cargarSkusPagina(state.skusPagina.page+1));
    document.querySelectorAll('.chk-sku').forEach(chk=>{
      chk.addEventListener('change', e=>{
        const id = chk.dataset.skuId;
        const seleccionados = e.target.checked
          ? state.skusSeleccionados.concat(id)
          : state.skusSeleccionados.filter(x=>x!==id);
        setState({skusSeleccionados: seleccionados});
      });
    });
    const chkTodos = document.getElementById('chk-skus-todos');
    if(chkTodos) chkTodos.addEventListener('change', e=>{
      const idsPagina = state.skusPagina.rows.map(s=>s.id);
      const seleccionados = e.target.checked
        ? Array.from(new Set(state.skusSeleccionados.concat(idsPagina)))
        : state.skusSeleccionados.filter(id=>!idsPagina.includes(id));
      setState({skusSeleccionados: seleccionados});
    });
    const btnEliminarSkus = document.getElementById('btn-eliminar-skus');
    if(btnEliminarSkus) btnEliminarSkus.addEventListener('click', eliminarSkusSeleccionados);
  }

  if(state.view==='carga'){
    if(state.cargaPreview){
      document.querySelectorAll('[data-campo]').forEach(sel=>{
        sel.addEventListener('change', e=>{
          state.cargaPreview.mapeo[sel.dataset.campo] = e.target.value || undefined;
          render();
        });
      });
      document.querySelectorAll('input[name="modo-carga"]').forEach(r=>{
        r.addEventListener('change', e=>{
          state.cargaPreview.modo = e.target.value;
          state.cargaPreview.confirmaReemplazo = false; // exige reconfirmar cada vez que se elige reemplazar
          render();
        });
      });
      const chkReemplazo = document.getElementById('chk-confirma-reemplazo');
      if(chkReemplazo) chkReemplazo.addEventListener('change', e=>{
        state.cargaPreview.confirmaReemplazo = e.target.checked;
        render();
      });
      document.getElementById('btn-cancelar-carga').addEventListener('click', ()=> setState({cargaPreview:null}));
      document.getElementById('btn-confirmar-carga').addEventListener('click', confirmarCargaMasiva);
    }else{
      document.getElementById('file-skus').addEventListener('change', async e=>{
        const file = e.target.files[0]; if(!file) return;
        document.getElementById('file-skus-name').textContent = `Leyendo ${file.name}...`;
        await prepararCargaMasiva(file);
      });
    }
  }

  if(state.view==='conteo'){
    if(!state.skuSeleccionado){
      const search = document.getElementById('sku-search');
      search.addEventListener('input', e=> setState({skuSearch: e.target.value}));
      search.focus(); search.selectionStart = search.selectionEnd = search.value.length;
      document.querySelectorAll('[data-pick-btn]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const sku = state.skus.find(s=>s.id===btn.dataset.pickBtn);
          setState({skuSeleccionado: sku});
        });
      });
      const btnEscaner = document.getElementById('btn-abrir-escaner');
      if(btnEscaner) btnEscaner.addEventListener('click', ()=> setState({escanerModal: {codigo:null, error:null}}));
    }else{
      document.getElementById('btn-quitar-sku').addEventListener('click', ()=> setState({skuSeleccionado:null, conteoFotos:[]}));
      document.getElementById('c-foto').addEventListener('change', e=>{
        const files = Array.from(e.target.files || []);
        files.forEach(file=>{
          const reader = new FileReader();
          reader.onload = ev => { state.conteoFotos.push({file, preview: ev.target.result}); render(); };
          reader.readAsDataURL(file);
        });
        e.target.value = ''; // permite volver a elegir/tomar otra foto después
      });
      document.querySelectorAll('[data-quitar-foto]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          state.conteoFotos.splice(Number(btn.dataset.quitarFoto), 1);
          render();
        });
      });
      document.getElementById('form-conteo').addEventListener('submit', e=>{
        e.preventDefault();
        guardarConteo({
          cantidad: document.getElementById('c-cant').value,
          bodega: document.getElementById('c-bodega').value.trim(),
          ubicacion: document.getElementById('c-ubic').value.trim(),
          observacion: document.getElementById('c-obs').value.trim(),
        });
      });
    }
  }

  if(state.view==='reconteo'){
    const btnCargarMasReconteo = document.getElementById('btn-cargar-mas-reconteo');
    if(btnCargarMasReconteo) btnCargarMasReconteo.addEventListener('click', cargarMasReconteos);
    document.querySelectorAll('[data-recontar]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const r = state.reconteos.find(x=>x.id===btn.dataset.recontar);
        if(!r) return;
        setState({
          view:'conteo',
          skuSeleccionado:{ id:r.id, sku_code:r.sku_code, descripcion:r.descripcion, categoria:r.categoria, unidad_medida:r.unidad_medida, ubicacion:r.ubicacion, bodega:r.bodega, stock_sistema:r.stock_sistema },
          conteoFotos:[], skuSearch:'',
        });
      });
    });
  }

  if(state.view==='buscar'){
    if(!state.busqueda.yaBuscado && !state.busqueda.buscando){
      setState({busqueda:{...state.busqueda, buscando:true, yaBuscado:true}});
      buscarConteos();
      return;
    }
    document.getElementById('form-buscar').addEventListener('submit', e=>{
      e.preventDefault();
      const selCiclo = document.getElementById('b-ciclo');
      setState({busqueda:{
        ...state.busqueda,
        texto: document.getElementById('b-texto').value,
        bodega: document.getElementById('b-bodega').value,
        estado: document.getElementById('b-estado').value,
        ciclo: selCiclo ? selCiclo.value : '',
        soloConFotos: document.getElementById('b-solo-fotos').checked,
        buscando: true,
      }});
      buscarConteos();
    });
    document.querySelectorAll('[data-ver-fotos]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const rutas = JSON.parse(btn.dataset.verFotos);
        if(!rutas.length) return;
        try{
          const urls = await Promise.all(rutas.map(crearUrlFirmada));
          setState({fotoModal:{urls, index:0}});
        }catch(e){ toast(e.message,'err'); }
      });
    });
    const btnCargarMasBusqueda = document.getElementById('btn-cargar-mas-busqueda');
    if(btnCargarMasBusqueda) btnCargarMasBusqueda.addEventListener('click', buscarMasConteos);
  }

  if(state.view==='plan'){
    const btnExportarPlan = document.getElementById('btn-exportar-plan');
    if(btnExportarPlan) btnExportarPlan.addEventListener('click', imprimirPlan);
    document.getElementById('plan-semana-prev').addEventListener('click', ()=>{
      const nueva = fechaISO(sumarDias(new Date(state.plan.semanaInicio+'T00:00:00'), -7));
      setState({plan:{...state.plan, semanaInicio:nueva}});
      cargarPlanSemanal();
    });
    document.getElementById('plan-semana-next').addEventListener('click', ()=>{
      const nueva = fechaISO(sumarDias(new Date(state.plan.semanaInicio+'T00:00:00'), 7));
      setState({plan:{...state.plan, semanaInicio:nueva}});
      cargarPlanSemanal();
    });
    document.getElementById('form-plan').addEventListener('submit', e=>{
      e.preventDefault();
      const bodegaSeleccionada = document.getElementById('p-bodega').value.trim();
      const soloSinUbicacion = bodegaSeleccionada === BODEGA_SIN_UBICACION;
      // "Seleccionar todos" marca cada storage bin visible, pero esa lista (igual que las de
      // ubicación) no incluye los SKU sin storage bin asignado. Para que "todos" sea realmente
      // todos (sin excepción), se manda vacío en vez de la lista exhaustiva: crearPlanEntrada ya
      // trata "sin selección" como "sin filtro de storage bin" (cubre también los que no tienen).
      const chkBinTodos = document.getElementById('p-bin-todos');
      const storageBins = (chkBinTodos && chkBinTodos.checked) ? [] : [...document.getElementById('p-bin').selectedOptions].map(o=>o.value).filter(Boolean);
      crearPlanEntrada({
        fecha: document.getElementById('p-fecha').value,
        bodega: soloSinUbicacion ? '' : bodegaSeleccionada,
        ubicacion: document.getElementById('p-ubic').value.trim(),
        storageBins,
        soloSinUbicacion,
        responsableId: document.getElementById('p-responsable').value,
        nota: document.getElementById('p-nota').value.trim(),
      });
    });
    function resetPBin(){
      const selBin = document.getElementById('p-bin');
      const chkTodos = document.getElementById('p-bin-todos');
      selBin.innerHTML = '<option value="">Elige ubicación específica primero</option>';
      selBin.disabled = true;
      chkTodos.checked = false;
      chkTodos.disabled = true;
    }
    document.getElementById('p-bodega').addEventListener('change', async e=>{
      const bodega = e.target.value;
      const selUbic = document.getElementById('p-ubic');
      resetPBin();
      if(bodega === BODEGA_SIN_UBICACION){
        selUbic.innerHTML = '<option value="">No aplica (SKU sin ubicación)</option>';
        selUbic.disabled = true;
        return;
      }
      if(!bodega){
        selUbic.innerHTML = '<option value="">Elige ubicación general primero</option>';
        selUbic.disabled = true;
        return;
      }
      selUbic.innerHTML = '<option value="">Cargando…</option>';
      selUbic.disabled = true;
      const opciones = await opcionesEspecificas(bodega);
      selUbic.innerHTML = '<option value="">Todas</option>' + opciones.map(o=>`<option value="${esc(o.ubicacion)}">${esc(o.ubicacion)}</option>`).join('');
      selUbic.disabled = false;
    });
    document.getElementById('p-ubic').addEventListener('change', async e=>{
      const bodega = document.getElementById('p-bodega').value;
      const ubicacion = e.target.value;
      const selBin = document.getElementById('p-bin');
      const chkTodos = document.getElementById('p-bin-todos');
      if(!ubicacion){
        resetPBin();
        return;
      }
      selBin.innerHTML = '<option value="">Cargando…</option>';
      selBin.disabled = true;
      chkTodos.checked = false;
      chkTodos.disabled = true;
      const opciones = await opcionesBins(bodega, ubicacion);
      selBin.innerHTML = opciones.map(o=>`<option value="${esc(o.storage_bin)}">${esc(o.storage_bin)} — ${o.cantidad_skus} SKU</option>`).join('');
      selBin.disabled = false;
      chkTodos.disabled = false;
    });
    document.getElementById('p-bin-todos').addEventListener('change', e=>{
      const selBin = document.getElementById('p-bin');
      [...selBin.options].forEach(o=>{ o.selected = e.target.checked; });
    });
    document.querySelectorAll('[data-borrar-plan]').forEach(btn=>{
      btn.addEventListener('click', ()=> confirmarYBorrarPlanEntrada(btn.dataset.borrarPlan));
    });
    document.querySelectorAll('.plan-select-check').forEach(chk=>{
      chk.addEventListener('change', ()=> alternarSeleccionPlan(chk.dataset.selectPlan));
    });
    const chkTodoPlan = document.getElementById('chk-seleccionar-todo-plan');
    if(chkTodoPlan) chkTodoPlan.addEventListener('change', alternarSeleccionTodoPlan);
    const btnBorrarSeleccion = document.getElementById('btn-borrar-seleccion-plan');
    if(btnBorrarSeleccion) btnBorrarSeleccion.addEventListener('click', confirmarYBorrarSeleccionPlan);
    const btnCancelarSeleccion = document.getElementById('btn-cancelar-seleccion-plan');
    if(btnCancelarSeleccion) btnCancelarSeleccion.addEventListener('click', ()=> setState({plan:{...state.plan, seleccionados:[]}}));
    document.querySelectorAll('.plan-sku-quitar').forEach(btn=>{
      btn.addEventListener('click', ()=> excluirSkuDePlan(btn.dataset.planId, btn.dataset.skuCode));
    });
    document.querySelectorAll('[data-editar-plan]').forEach(btn=>{
      btn.addEventListener('click', ()=> setState({plan:{...state.plan, editando: btn.dataset.editarPlan}}));
    });
    document.querySelectorAll('[data-cancelar-plan]').forEach(btn=>{
      btn.addEventListener('click', ()=> setState({plan:{...state.plan, editando: null}}));
    });
    document.querySelectorAll('[data-guardar-plan]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.guardarPlan;
        actualizarPlanEntrada(id, {
          fecha: document.getElementById(`pe-fecha-${id}`).value,
          responsableId: document.getElementById(`pe-responsable-${id}`).value,
          nota: document.getElementById(`pe-nota-${id}`).value.trim(),
        });
      });
    });
  }
}

async function iniciarApp(){
  // Service Worker: cachea el app shell para que la app siga abriendo sin conexión.
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  }
  // Al recuperar la señal, intentamos enviar los conteos que quedaron guardados sin conexión.
  window.addEventListener('online', sincronizarColaOffline);
  await procesarLlegadaPorInvitacion();
  if(!state.debeCrearPassword) await restaurarSesionGuardada();
  render();
}
iniciarApp();
</script>
</body>
</html>
