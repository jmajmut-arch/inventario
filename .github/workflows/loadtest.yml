name: Prueba de carga (k6)

# Se dispara a mano desde la pestaña "Actions" del repo (botón "Run workflow"), sin necesitar
# terminal — funciona igual desde un celular o iPad. Corre loadtest/inventia-loadtest.js contra
# Supabase en producción, contra empresas de prueba aisladas (ver EMPRESA_IDS). Correrlo de
# noche: a partir de cierto nivel pone lenta la app para todos, también para los clientes.
#
# Requiere el secreto de repo SUPABASE_SERVICE_ROLE_KEY (Settings > Secrets and variables >
# Actions > New repository secret). La anon key y las empresas de prueba no son secretas, van
# directo acá abajo.
on:
  workflow_dispatch:
    inputs:
      niveles:
        description: "Personas contando a la vez, por nivel (separadas por coma)"
        required: false
        default: "50,100,200,300,500,750,1000"
        type: string
      minutos_por_nivel:
        description: "Minutos que se sostiene cada nivel"
        required: false
        default: "3"
        type: string

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SUPABASE_URL: "https://ncvwgsbcvklhbyvurxzz.supabase.co"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jdndnc2JjdmtsaGJ5dnVyeHp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTcwMDAsImV4cCI6MjEwMjA3MzAwMH0.ElSrlTk0Mheb9P37BCGOLHqgGIxMVmoRLdpnlDSZYbE"
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Empresas de prueba __CARGA_1__ (80.000 materiales, como Escondida) a __CARGA_5__ (10.000
      # cada una), creadas el 13/10/2026. Se borran con loadtest/limpieza_manual.sql.
      EMPRESA_IDS: "e0f25d07-863e-44b5-bddc-392af62150cd,0fb018f8-e329-4a87-b84a-5e048a97dbc9,7176f256-3b05-4cb8-bcdf-864b5d123cdd,67a20d7f-51c9-4976-afd7-7164585da442,d0a29721-a3d1-4080-821f-b969705e728e"
      NIVELES: ${{ inputs.niveles }}
      MINUTOS_POR_NIVEL: ${{ inputs.minutos_por_nivel }}
    steps:
      - uses: actions/checkout@v7

      - name: Instalar k6
        run: |
          curl -sS -L https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz | tar xz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Correr la prueba de carga
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Falta el secreto SUPABASE_SERVICE_ROLE_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          k6 run loadtest/inventia-loadtest.js

      - name: Subir el resumen como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultado-loadtest
          path: resultado-loadtest.json
          retention-days: 30
